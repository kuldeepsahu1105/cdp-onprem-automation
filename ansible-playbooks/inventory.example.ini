# Ansible-only inventory template (no Terraform required).
#
# Usage:
#   cp inventory.example.ini inventory.ini
#   edit every active host line
#   ansible all -i inventory.ini -m ping
#
# Host fields:
#   ansible_host  Address reachable from the Ansible controller (public or private).
#   private_ip    Address used for node-to-node cluster traffic.
#   public_ip     Optional public address shown in the deployment portal.
#   cldr_hostname Short hostname; cluster_domain from config.yml is appended when needed.
#
# Keep the established hyphenated group names. ansible.cfg preserves them without warnings.

[ipaserver]
ipa-node ansible_host=203.0.113.10 private_ip=10.0.0.10 public_ip=203.0.113.10 cldr_hostname=ipaserver

# Optional dedicated PostgreSQL host. Delete this host line to install PostgreSQL
# on cldr-mngr. The legacy [db] group is also supported; use only one.
[postgres]
# pgdb ansible_host=203.0.113.11 private_ip=10.0.0.11 public_ip=203.0.113.11 cldr_hostname=pgdb

[cldr-mngr]
cm-node ansible_host=203.0.113.20 private_ip=10.0.0.20 public_ip=203.0.113.20 cldr_hostname=cldr-mngr

[base-masters]
pvcbase-master ansible_host=203.0.113.30 private_ip=10.0.0.30 public_ip=203.0.113.30 cldr_hostname=pvcbase-master

[base-workers]
pvcbase-worker1 ansible_host=203.0.113.31 private_ip=10.0.0.31 public_ip=203.0.113.31 cldr_hostname=pvcbase-worker1
pvcbase-worker2 ansible_host=203.0.113.32 private_ip=10.0.0.32 public_ip=203.0.113.32 cldr_hostname=pvcbase-worker2
pvcbase-worker3 ansible_host=203.0.113.33 private_ip=10.0.0.33 public_ip=203.0.113.33 cldr_hostname=pvcbase-worker3

# Optional ECS groups. Leave both groups empty when ECS is not used.
[ecs-masters]
# pvcecs-master ansible_host=203.0.113.40 private_ip=10.0.0.40 public_ip=203.0.113.40 cldr_hostname=pvcecs-master

[ecs-workers]
# pvcecs-worker1 ansible_host=203.0.113.41 private_ip=10.0.0.41 public_ip=203.0.113.41 cldr_hostname=pvcecs-worker1
# pvcecs-worker2 ansible_host=203.0.113.42 private_ip=10.0.0.42 public_ip=203.0.113.42 cldr_hostname=pvcecs-worker2
# pvcecs-worker3 ansible_host=203.0.113.43 private_ip=10.0.0.43 public_ip=203.0.113.43 cldr_hostname=pvcecs-worker3

# Optional SDX placement for Model Registry. A host may also belong to a base group.
[sdx]
# pvcbase-master

[deployment_portal_runtime]
# Populated dynamically by portal and monitoring playbooks.

[all:vars]
# Override only when the SSH username differs from config.yml/group_vars defaults.
# ansible_user=ec2-user
# ansible_ssh_private_key_file=./sshkey.pem

### ansible-playbook -i inventory.ini 33_setup_ecs_cluster.yml
#
# Install Cloudera Data Services (ECS / Experience Cluster) on ecs-masters/ecs-workers.
# Requires CDP base cluster (31_setup_base_cluster.yml) and CM agents on ECS nodes.
---
- import_playbook: ensure_collections.yml

- name: Reconcile ECS wildcard DNS before control plane validation
  ansible.builtin.import_playbook: 19_setup_wildcard.yml

- name: Install cloudera.cluster collection on control node
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Install cloudera.cluster collection
      ansible.builtin.import_tasks: common_tasks/install_cloudera_collection.yml

- name: Ensure ECS hosts are reachable and collect standalone facts
  hosts: ecs-masters:ecs-workers
  gather_facts: no
  tasks:
    - name: Wait for ECS host connection
      ansible.builtin.wait_for_connection:
        timeout: 60
      when: ecs_deploy_enabled | default('auto') | string | lower != 'false'

    - name: Gather ECS host facts
      ansible.builtin.setup:
      when: ecs_deploy_enabled | default('auto') | string | lower != 'false'

- name: Install ECS (Cloudera Data Services) cluster via Cloudera Manager
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Detect ECS inventory presence
      ansible.builtin.set_fact:
        ecs_inventory_present: >-
          {{
            (ecs_cluster_master_group in groups)
            and (groups[ecs_cluster_master_group] | default([]) | length > 0)
            and (ecs_cluster_worker_group in groups)
            and (groups[ecs_cluster_worker_group] | default([]) | length > 0)
          }}

    - name: Resolve ECS deployment toggle
      ansible.builtin.set_fact:
        ecs_deploy_effective: >-
          {{
            ecs_deploy_enabled | bool
            if ecs_deploy_enabled not in ['auto', 'Auto', 'AUTO']
            else ecs_inventory_present | bool
          }}

    - name: Skip ECS deployment when disabled or inventory is empty
      ansible.builtin.debug:
        msg: >-
          Skipping ECS cluster deployment
          (ecs_deploy_enabled={{ ecs_deploy_enabled }},
          ecs-masters/workers present={{ ecs_inventory_present }}).
      when: not ecs_deploy_effective | bool

    - name: End playbook when ECS deployment is not requested
      ansible.builtin.meta: end_play
      when: not ecs_deploy_effective | bool

    - name: Prepare Cloudera Manager API
      ansible.builtin.import_tasks: common_tasks/prepare_cm_security_api.yml

    - name: Resolve ECS control plane console URL
      ansible.builtin.import_tasks: common_tasks/resolve_ecs_control_plane_url.yml

    - name: Validate ECS inventory groups
      ansible.builtin.assert:
        that:
          - ecs_cluster_master_group in groups
          - groups[ecs_cluster_master_group] | length > 0
          - ecs_cluster_worker_group in groups
          - groups[ecs_cluster_worker_group] | length > 0
        fail_msg: >-
          ECS inventory groups '{{ ecs_cluster_master_group }}' and
          '{{ ecs_cluster_worker_group }}' must exist and contain hosts.

    - name: Use SSH for ECS master delegation from localhost play
      ansible.builtin.add_host:
        name: "{{ groups[ecs_cluster_master_group][0] }}"
        ansible_connection: ssh
      changed_when: false

    - name: Detect ARM64 on ECS nodes
      ansible.builtin.set_fact:
        ecs_arm64_detected: >-
          {{
            hostvars[groups[ecs_cluster_master_group][0]].ansible_architecture | default('x86_64')
              in ['aarch64', 'arm64']
            or (
              groups[ecs_cluster_worker_group]
              | map('extract', hostvars, 'ansible_architecture')
              | select('in', ['aarch64', 'arm64'])
              | list
              | length > 0
            )
          }}

    - name: Block ECS on ARM64 unless explicitly enabled
      ansible.builtin.fail:
        msg: >-
          ECS on ARM64/Graviton is disabled by default (ecs_deploy_on_arm64: false).
          Set ECS_DEPLOY_ON_ARM64=true in .tfvars or pass -e ecs_deploy_on_arm64=true.
      when:
        - ecs_arm64_detected | bool
        - not (ecs_deploy_on_arm64 | default(false) | bool)

    - name: Verify base cluster exists before ECS install
      ansible.builtin.uri:
        url: "{{ cm_krb_api_url }}/clusters/{{ cdh_basecluster_name | urlencode }}"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_check
      delegate_to: "{{ cm_api_uri_delegate_to }}"

    - name: Set ECS master FQDN
      ansible.builtin.set_fact:
        ecs_master_fqdn: >-
          {%- set hostname = hostvars[groups[ecs_cluster_master_group][0]].cldr_hostname -%}
          {{ hostname if hostname.endswith('.' ~ cluster_domain) else hostname ~ '.' ~ cluster_domain }}
        ecs_master_ip: >-
          {{
            hostvars[groups[ecs_cluster_master_group][0]].private_ip
            | default(
                hostvars[groups[ecs_cluster_master_group][0]]
                .get('ansible_default_ipv4', {})
                .get(
                  'address',
                  hostvars[groups[ecs_cluster_master_group][0]].ansible_host
                ),
                true
              )
          }}

    - name: Build ECS worker assignments
      ansible.builtin.set_fact:
        ecs_worker_fqdns: >-
          {%- set hostname = hostvars[item].cldr_hostname -%}
          {{
            ecs_worker_fqdns | default([])
            + [hostname if hostname.endswith('.' ~ cluster_domain) else hostname ~ '.' ~ cluster_domain]
          }}
        ecs_worker_host_entries: >-
          {%- set hostname = hostvars[item].cldr_hostname -%}
          {%- set fqdn = hostname if hostname.endswith('.' ~ cluster_domain)
              else hostname ~ '.' ~ cluster_domain -%}
          {{
            ecs_worker_host_entries | default([])
            + [{
              'name': fqdn,
              'host_ip': hostvars[item].private_ip
                         | default(hostvars[item].ansible_host, true)
            }]
          }}
      loop: "{{ groups[ecs_cluster_worker_group] }}"
      loop_control:
        label: "{{ item }}"

    - name: Resolve ECS console DNS directly from FreeIPA
      ansible.builtin.command:
        argv:
          - dig
          - +short
          - +time=2
          - +tries=1
          - "@{{ hostvars[groups['ipaserver'][0]].private_ip | default(hostvars[groups['ipaserver'][0]].ansible_host, true) }}"
          - "{{ ecs_console_host_prefix }}.{{ ecs_app_domain }}"
          - A
      register: ecs_console_dns_from_ipa
      changed_when: false
      failed_when: false
      delegate_to: "{{ groups[ecs_cluster_master_group][0] }}"
      when:
        - identity_provider_effective == 'freeipa'
        - groups.get('ipaserver', []) | length > 0

    - name: Require authoritative ECS console DNS from FreeIPA
      ansible.builtin.assert:
        that:
          - ecs_console_dns_from_ipa.rc | int == 0
          - ecs_master_ip in ecs_console_dns_from_ipa.stdout_lines
        fail_msg: >-
          Direct FreeIPA DNS validation from
          {{ groups[ecs_cluster_master_group][0] }} failed immediately.
          Expected ECS master private IP {{ ecs_master_ip }}; dig rc={{
          ecs_console_dns_from_ipa.rc | default('unknown') }}, returned={{
          ecs_console_dns_from_ipa.stdout_lines | default([]) | join(', ') }},
          stderr={{ ecs_console_dns_from_ipa.stderr | default('') | trim }}.
          ECS master gathered IPv4={{
          hostvars[groups[ecs_cluster_master_group][0]]
          .get('ansible_default_ipv4', {}).get('address', 'unknown') }},
          inventory private_ip={{
          hostvars[groups[ecs_cluster_master_group][0]].private_ip
          | default('undefined') }}, ansible_host={{
          hostvars[groups[ecs_cluster_master_group][0]].ansible_host
          | default('undefined') }}.
      when:
        - identity_provider_effective == 'freeipa'
        - groups.get('ipaserver', []) | length > 0

    - name: Read ECS master resolver configuration
      ansible.builtin.command: cat /etc/resolv.conf
      register: ecs_master_resolv_conf
      changed_when: false
      delegate_to: "{{ groups[ecs_cluster_master_group][0] }}"

    - name: Resolve ECS console DNS from the ECS master
      ansible.builtin.command:
        argv:
          - getent
          - ahostsv4
          - "{{ ecs_console_host_prefix }}.{{ ecs_app_domain }}"
      register: ecs_console_dns_from_master
      changed_when: false
      failed_when: false
      delegate_to: "{{ groups[ecs_cluster_master_group][0] }}"
      retries: "{{ ecs_console_dns_wait_retries | default(24) }}"
      delay: "{{ ecs_console_dns_wait_delay | default(5) }}"
      until:
        - ecs_console_dns_from_master.rc | int == 0
        - ecs_master_ip in ecs_console_dns_from_master.stdout

    - name: Require ECS console DNS to use the master private IP
      ansible.builtin.assert:
        that:
          - ecs_master_ip in ecs_console_dns_from_master.stdout
        fail_msg: >-
          {{ ecs_console_host_prefix }}.{{ ecs_app_domain }} resolves from the
          ECS master as {{ ecs_console_dns_from_master.stdout_lines | default([])
          | join(', ') }}, but First Run requires private IP {{ ecs_master_ip }}.
          ECS master /etc/resolv.conf:
          {{ ecs_master_resolv_conf.stdout_lines | default([]) | join('; ') }}.
          {% if identity_provider_effective == 'freeipa' %}
          Direct FreeIPA response:
          {{ ecs_console_dns_from_ipa.stdout_lines | default([]) | join(', ') }}.
          {% endif %}
          Re-run playbook 13 to repair managed resolvers and playbook 19 to
          reconcile wildcard DNS before installing the control plane.

    - name: Print ECS cluster targets
      ansible.builtin.debug:
        msg:
          - "Cluster name: {{ ecs_cluster_name }}"
          - "PVC DS repo: {{ ecs_pvc_repository_url }}"
          - "Application domain: {{ ecs_application_domain }}"
          - "App domain: {{ ecs_app_domain }}"
          - "Control plane URL (automation): {{ ecs_control_plane_url_effective | default('') }}"
          - "Datalake cluster: {{ cdh_basecluster_name }}"
          - "ECS master: {{ ecs_master_fqdn }}"
          - "ECS workers: {{ ecs_worker_fqdns }}"

    - name: Refresh remote parcel repository URLs in Cloudera Manager (includes ECS PVC DS)
      ansible.builtin.import_tasks: common_tasks/configure_cm_parcel_repo_api.yml
      when: parcel_repo is defined

    - name: Read configured ECS parcel repository manifest
      ansible.builtin.uri:
        url: "{{ ecs_parcel_repo_url | regex_replace('/+$', '') }}/manifest.json"
        method: GET
        user: "{{ cm_repo_username if (cm_repo_source | default('public')) == 'public' else omit }}"
        password: "{{ cm_repo_password if (cm_repo_source | default('public')) == 'public' else omit }}"
        force_basic_auth: "{{ (cm_repo_source | default('public')) == 'public' }}"
        validate_certs: no
        status_code: [200]
        follow_redirects: safe
        return_content: true
        timeout: 60
      register: ecs_parcel_manifest
      changed_when: false
      failed_when: false
      retries: 5
      delay: 10
      until: ecs_parcel_manifest.status | default(0) == 200
      delegate_to: "{{ cm_api_uri_delegate_to }}"
      when: ecs_parcel_version | default('') | length == 0

    - name: Parse configured ECS parcel repository manifest
      ansible.builtin.set_fact:
        ecs_parcel_manifest_data: "{{ ecs_parcel_manifest.content | from_json }}"
      no_log: true
      when:
        - ecs_parcel_version | default('') | length == 0
        - ecs_parcel_manifest.status | default(0) == 200

    - name: Default unavailable ECS parcel repository manifest
      ansible.builtin.set_fact:
        ecs_parcel_manifest_data: {}
      when:
        - ecs_parcel_version | default('') | length == 0
        - ecs_parcel_manifest_data is not defined

    - name: Select published ECS parcel versions
      ansible.builtin.set_fact:
        ecs_parcel_versions_available: >-
          {{
            ecs_parcel_manifest_data.get('parcels', [])
            | map(attribute='parcelName')
            | select('match', '^ECS-.*[.]parcel$')
            | map('regex_replace', '^ECS-', '')
            | map('regex_replace', '-[^-]+[.]parcel$', '')
            | unique
            | list
          }}
      when: ecs_parcel_version | default('') | length == 0

    - name: Resolve ECS parcel version
      ansible.builtin.set_fact:
        ecs_parcel_version_effective: >-
          {{
            ecs_parcel_version
            if ecs_parcel_version | default('') | length > 0
            else (
              ecs_parcel_versions_available | default([]) | first | default('', true)
            )
          }}

    - name: Require ECS parcel version
      ansible.builtin.assert:
        that:
          - ecs_parcel_version_effective | default('') | length > 0
          - >-
            ecs_parcel_version | default('') | length > 0
            or ecs_parcel_versions_available | default([]) | length == 1
        fail_msg: >-
          Could not resolve one ECS parcel from
          {{ ecs_parcel_repo_url | regex_replace('/+$', '') }}/manifest.json.
          Repository HTTP status={{
            (ecs_parcel_manifest | default({})).get('status', 'not requested')
          }};
          response={{
            (ecs_parcel_manifest | default({})).get('msg', 'none')
          }};
          published ECS versions={{
            ecs_parcel_versions_available | default([]) | join(', ') | default('(none)', true)
          }}. Set ecs_parcel_version explicitly only when the repository intentionally
          publishes multiple ECS parcels.

    - name: Print selected ECS parcel version
      ansible.builtin.debug:
        msg: "Using ECS parcel version: {{ ecs_parcel_version_effective }}"

    - name: Resolve CM API endpoint for cloudera.cluster modules
      ansible.builtin.import_tasks: common_tasks/resolve_cm_cluster_module_endpoint.yml

    - name: Check if requested ECS cluster already exists
      ansible.builtin.uri:
        url: "{{ cm_cluster_module_api_url }}/clusters/{{ ecs_cluster_name | urlencode }}"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200, 404]
        follow_redirects: none
      register: requested_ecs_cluster
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Check legacy ECS cluster when the prefixed default is absent
      ansible.builtin.uri:
        url: "{{ cm_cluster_module_api_url }}/clusters/{{ ecs_cluster_legacy_name | urlencode }}"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200, 404]
        follow_redirects: none
      register: legacy_ecs_cluster
      when:
        - requested_ecs_cluster.status == 404
        - ecs_cluster_name == ecs_cluster_default_name
        - ecs_cluster_legacy_name | default('') | length > 0
        - ecs_cluster_legacy_name != ecs_cluster_name
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Preserve existing legacy ECS cluster name
      ansible.builtin.set_fact:
        ecs_cluster_name: "{{ ecs_cluster_legacy_name }}"
      when:
        - requested_ecs_cluster.status == 404
        - legacy_ecs_cluster.status | default(404) == 200

    - name: Select existing ECS cluster lookup
      ansible.builtin.set_fact:
        existing_ecs_cluster: >-
          {{
            legacy_ecs_cluster
            if (
              requested_ecs_cluster.status == 404
              and legacy_ecs_cluster.status | default(404) == 200
            )
            else requested_ecs_cluster
          }}

    - name: Read existing ECS cluster services
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{
          ecs_cluster_name | urlencode }}/services
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: existing_ecs_services
      changed_when: false
      when: existing_ecs_cluster.status == 200
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Determine whether phased ECS installation is required
      ansible.builtin.set_fact:
        ecs_phased_install_required: >-
          {{
            existing_ecs_cluster.status == 404
            or (
              existing_ecs_cluster.status == 200
              and (
                (
                  ['docker', 'ecs']
                  | difference(
                      existing_ecs_services.json['items'] | default([])
                      | selectattr('serviceState', 'equalto', 'STARTED')
                      | map(attribute='name')
                      | list
                    )
                  | length
                ) > 0
              )
            )
          }}

    - name: Report partial ECS cluster recovery
      ansible.builtin.debug:
        msg: >-
          ECS cluster '{{ ecs_cluster_name }}' exists but is incomplete or not
          fully started. Resuming the reference-aligned host attachment, parcel
          activation, service, role, and control-plane phases.
      when:
        - existing_ecs_cluster.status == 200
        - ecs_phased_install_required | bool

    - name: Phased ECS cluster install (reference-aligned)
      ansible.builtin.import_tasks: common_tasks/ecs_phased_cluster_install.yml
      when: ecs_phased_install_required | bool

    - name: Start existing ECS cluster services
      cloudera.cluster.cluster:
        host: "{{ cm_cluster_module_host }}"
        port: "{{ cm_cluster_module_port }}"
        version: "{{ cm_api_version }}"
        force_tls: "{{ cm_cluster_module_force_tls }}"
        username: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        verify_tls: false
        name: "{{ ecs_cluster_name }}"
        state: started
      when:
        - existing_ecs_cluster.status == 200
        - not (ecs_phased_install_required | bool)
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Configure kubectl, kubeconfig, and k9s on ECS master
      ansible.builtin.import_tasks: common_tasks/ecs_configure_cli_tools.yml
      when:
        - ecs_deploy_effective | default(false) | bool
        - ecs_cli_tools_enabled | default(true) | bool

    - name: Require healthy ECS Management Console before installation completes
      ansible.builtin.import_tasks: common_tasks/ecs_wait_control_plane_console.yml
      when:
        - ecs_deploy_effective | default(false) | bool

    - name: Reconcile ECS CoreDNS forwarding order
      ansible.builtin.import_tasks: common_tasks/ecs_reconcile_coredns.yml
      when:
        - ecs_deploy_effective | default(false) | bool
        - ecs_reconcile_coredns | default(true) | bool
        - not (ecs_coredns_reconciled_this_run | default(false) | bool)

    - name: Load existing ECS automation API credentials
      ansible.builtin.import_tasks: common_tasks/ecs_load_api_credentials.yml
      when:
        - ecs_deploy_effective | default(false) | bool
        - ecs_run_post_install_inline | default(true) | bool
        - ecs_auto_provision_api_access_key | default(true) | bool

    - name: Provision ECS automation IAM access key after console is up
      ansible.builtin.include_tasks: common_tasks/ecs_provision_iam_machine_access_key.yml
      when:
        - ecs_deploy_effective | default(false) | bool
        - ecs_run_post_install_inline | default(true) | bool
        - ecs_auto_provision_api_access_key | default(true) | bool
        - >-
          ecs_api_access_key_id | default('') | length == 0
          or ecs_api_private_key | default('') | length == 0

    - name: Print ECS cluster result
      ansible.builtin.debug:
        msg: "ECS cluster '{{ ecs_cluster_name }}' deployment complete or already exists"

    - name: Optional ECS control plane LDAP and LDAP admin user
      when:
        - ecs_deploy_effective | default(false) | bool
        - ecs_run_post_install_inline | default(true) | bool
        - (ecs_ldap_enabled | default(false) | bool) or (ecs_ldap_admin_user_enabled | default(false) | bool)
      block:
        - name: Resolve ECS LDAP / IAM phase flags
          ansible.builtin.import_tasks: common_tasks/resolve_ecs_control_plane_iam_phase.yml
          vars:
            ecs_data_services_install_names: []

        - name: Install CDP CLI prerequisites for ECS IAM
          ansible.builtin.import_tasks: common_tasks/install_cloudera_cloud_prereqs.yml

        - name: Configure CDP CLI profile for ECS IAM
          ansible.builtin.import_tasks: common_tasks/ecs_data_services_runtime.yml

        - name: Configure ECS LDAP and admin user
          ansible.builtin.import_tasks: common_tasks/ecs_control_plane_ldap_and_admin.yml

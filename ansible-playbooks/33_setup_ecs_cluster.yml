### ansible-playbook -i inventory.ini 33_setup_ecs_cluster.yml
#
# Install Cloudera Data Services (ECS / Experience Cluster) on ecs-masters/ecs-workers.
# Requires CDP base cluster (31_setup_base_cluster.yml) and CM agents on ECS nodes.
---
- import_playbook: ensure_collections.yml

- name: Reconcile ECS wildcard DNS before control plane validation
  ansible.builtin.import_playbook: 19_setup_wildcard.yml

- name: Install cloudera.cluster collection on control node
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Run ECS install collection tasks
      ansible.builtin.import_role:
        name: ecs
        tasks_from: install_collection

- name: Install ECS (Cloudera Data Services) cluster via Cloudera Manager
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Run ECS setup cluster tasks
      ansible.builtin.import_role:
        name: ecs
        tasks_from: setup_cluster

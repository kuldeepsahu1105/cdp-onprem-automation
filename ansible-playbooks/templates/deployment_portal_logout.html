<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Signing out</title>
</head>
<body>
  <p>Signing out of the deployment portal...</p>
  <script>
    document.cookie = 'portal_authenticated=; Path=/; Max-Age=0; SameSite=Lax';
    fetch('/downloads/auth.html?logout=' + Date.now(), {
      cache: 'no-store',
      credentials: 'omit',
      headers: { Authorization: 'Basic ' + btoa('logout:' + Date.now()) }
    }).catch(function () {}).finally(function () {
      location.replace('/?logged_out=1');
    });
  </script>
</body>
</html>

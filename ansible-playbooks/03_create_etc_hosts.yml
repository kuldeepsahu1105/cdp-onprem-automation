### ansible-playbook -i inventory.ini 03_create_etc_hosts.yml 
# vars: 
#

---
- name: Configure /etc/hosts file and Gather System Information
  hosts: all
  become: yes

  tasks:
    - name: Generate /etc/hosts from template
      ansible.builtin.template:
        src: templates/etc_hosts.j2
        dest: /etc/hosts
        owner: root
        group: root
        mode: "0644"

    # /etc/hosts is read on each lookup; no network service restart required.

    - name: Ensure OS version is RHEL 9.x
      shell: cat /etc/*rel* | grep -E 'NAME|VERSION'
      register: os_version
      changed_when: false

    - name: Print OS version information
      debug:
        msg: "{{ os_version.stdout.replace('\t', '    ').split('\n') }}"

    - name: Verify hostname (FQDN)
      command: hostname -f
      register: hostname_fqdn
      changed_when: false

    - name: Print hostname (FQDN)
      debug:
        msg: "Hostname (FQDN): {{ hostname_fqdn.stdout }}"

    - name: Verify host IP address
      command: hostname -i
      register: hostname_ip
      changed_when: false

    - name: Print host IP address
      debug:
        msg: "Hostname IP Address: {{ hostname_ip.stdout }}"

    - name: Verify /etc/hostname file content
      command: cat /etc/hostname
      register: hostname_file
      changed_when: false

    - name: Print /etc/hostname content
      debug:
        msg: "Content of /etc/hostname: {{ hostname_file.stdout }}"

    - name: Get IP addresses (cross-platform)
      shell: |
        if command -v ip >/dev/null 2>&1; then
          ip -o -4 addr show | awk '{print $4}'
        else
          ifconfig | grep -E 'inet ' | awk '{print $2}'
        fi
      register: net_info
      changed_when: false

    - name: Print interfaces and IPs
      debug:
        msg: "{{ net_info.stdout_lines }}"

    # Optional interface checks

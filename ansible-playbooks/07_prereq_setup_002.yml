### ansible-playbook -i inventory.ini 07_prereq_setup_002.yml
# vars:
#
---
- import_playbook: ensure_collections.yml

- name: Verify rsyslog service
  hosts: all
  become: yes
  tasks:
    - name: Verify rsyslog service
      ansible.builtin.import_role:
        name: prereq_system_tuning
        tasks_from: rsyslog

- name: Configure Ulimit, and other system settings
  hosts: all
  become: yes
  tasks:
    - name: Configure ulimit and PAM
      ansible.builtin.import_role:
        name: prereq_system_tuning
        tasks_from: ulimit

- name: Configure settings in sysctl.conf
  hosts: all
  become: yes
  tasks:
    - name: Configure sysctl
      ansible.builtin.import_role:
        name: prereq_system_tuning
        tasks_from: sysctl

- name: Disable Transparent Huge Pages and IPv6 on all nodes
  hosts: all
  become: true
  tasks:
    - name: Disable Transparent Huge Pages and IPv6
      ansible.builtin.import_role:
        name: prereq_system_tuning
        tasks_from: thp

- name: Disabling tuned service
  hosts: all
  become: yes
  tasks:
    - name: Disable tuned service
      ansible.builtin.import_role:
        name: prereq_system_tuning
        tasks_from: tuned

- name: Disable TCP Checksum Offload on ECS Nodes
  hosts: ecs-masters, ecs-workers
  become: yes
  tasks:
    - name: Disable TCP checksum offload
      ansible.builtin.import_role:
        name: prereq_system_tuning
        tasks_from: tcp_checksum

- name: Verify Chrony settings
  hosts: all
  become: yes
  tasks:
    - name: Verify Chrony settings
      ansible.builtin.import_role:
        name: prereq_system_tuning
        tasks_from: chrony

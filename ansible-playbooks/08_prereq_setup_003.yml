### ansible-playbook -i inventory.ini 08_prereq_setup_003.yml

---
- import_playbook: ensure_collections.yml

- name: Enable Repositories and Install Packages
  hosts: "{{ postgres_inventory_group_resolved | default('cldr-mngr') }}"
  become: yes

  tasks:
    - name: Resolve PostgreSQL install host from inventory
      ansible.builtin.import_tasks: common_tasks/resolve_postgres_inventory.yml

    - name: Set OS-specific facts
      ansible.builtin.import_tasks: common_tasks/set_os_facts.yml

    - name: Check whether PostgreSQL client is already installed
      ansible.builtin.command:
        argv:
          - psql
          - --version
      register: existing_psql_version
      changed_when: false
      failed_when: false

    - name: Install PostgreSQL repository
      ansible.builtin.import_tasks: common_tasks/install_postgresql_repo.yml
      when: existing_psql_version.rc != 0

    - name: Install PostgreSQL client (psql)
      ansible.builtin.dnf:
        name: "{{ os.postgres_client_packages }}"
        state: present
        enablerepo:
          - "pgdg*"
      when:
        - ansible_os_family == "RedHat"
        - existing_psql_version.rc != 0

    - name: Install PostgreSQL client (psql) on Debian
      ansible.builtin.apt:
        name: "{{ os.postgres_client_packages }}"
        state: present
      when:
        - ansible_os_family == "Debian"
        - existing_psql_version.rc != 0

    - name: Verify PostgreSQL(psql) installation
      ansible.builtin.command: psql --version
      register: psql_version
      changed_when: false

    - name: Print PostgreSQL(psql) version
      ansible.builtin.debug:
        msg: "{{ psql_version.stdout }}"

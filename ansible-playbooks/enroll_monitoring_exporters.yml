---
# Install node_exporter, process_exporter, and optional host cAdvisor on cluster hosts.
# Imported from 10 (when monitoring_stack_enabled or monitoring routes are active), 32 (MONITORING
# phase), and 35 (when monitoring routes are active) so Prometheus scrape targets match listeners.

- name: Install and enroll node_exporter on cluster hosts
  hosts: "{{ monitoring_node_exporter_host_groups | join(':') }}"
  become: true
  gather_facts: true
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: Run monitoring enroll node exporter tasks
      ansible.builtin.import_role:
        name: monitoring
        tasks_from: enroll_node_exporter

- name: Install and enroll process_exporter on cluster hosts
  hosts: "{{ monitoring_process_exporter_host_groups | join(':') }}"
  become: true
  gather_facts: true
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: Run monitoring enroll process exporter tasks
      ansible.builtin.import_role:
        name: monitoring
        tasks_from: enroll_process_exporter

- name: Install and enroll host cAdvisor on cluster hosts (Docker)
  hosts: "{{ monitoring_cadvisor_host_groups | join(':') }}"
  become: true
  gather_facts: true
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: Run monitoring enroll cadvisor tasks
      ansible.builtin.import_role:
        name: monitoring
        tasks_from: enroll_cadvisor

- name: Refresh Prometheus scrape target facts after exporter enrollment
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run monitoring refresh scrape targets tasks
      ansible.builtin.import_role:
        name: monitoring
        tasks_from: refresh_scrape_targets

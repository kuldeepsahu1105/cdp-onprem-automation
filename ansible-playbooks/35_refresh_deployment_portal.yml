### ansible-playbook -i inventory.ini 35_refresh_deployment_portal.yml
# Update Caddy index, pgAdmin, and discovered service URLs after CDH, ECS, or data services change.
# Run playbook 10 once for PORTAL bootstrap. Use this refresh only when portal content must be rebuilt.
---
- import_playbook: ensure_collections.yml

- name: Rebuild deployment portal facts
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Rebuild deployment portal facts
      ansible.builtin.import_role:
        name: deployment_portal
        tasks_from: refresh_controller

- name: Refresh deployment portal content on ops host
  hosts: deployment_portal_runtime
  become: true
  gather_facts: true
  tasks:
    - name: Refresh deployment portal content on ops host
      ansible.builtin.import_role:
        name: deployment_portal
        tasks_from: refresh

- name: Verify external deployment portal URLs from Ansible controller (Tier B)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    deployment_portal_verify_post_cm: true
  tasks:
    - name: Verify external deployment portal URLs from Ansible controller
      ansible.builtin.import_role:
        name: deployment_portal
        tasks_from: verify_external
      vars:
        deployment_portal_tier_b_skip_task_name: "Skip Tier B when deployment portal is disabled"

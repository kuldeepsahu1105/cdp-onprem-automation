### ansible-playbook -i inventory.ini 29_setup_cm_ldap.yml
# Run after 27_setup_cm_autotls.yml and 28_setup_cm_cms.yml; before 30_setup_cm_krbs.yml.
---
- import_playbook: ensure_collections.yml

- name: Configure LDAP authentication in Cloudera Manager (FreeIPA or Active Directory)
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Run CM security configure ldap tasks
      ansible.builtin.import_role:
        name: cm_security
        tasks_from: configure_ldap

### ansible-playbook -i inventory.ini 16_setup_identity_client.yml
#
# Identity client enrollment (auto-detected FreeIPA or Active Directory)
---
- import_playbook: ensure_collections.yml

- name: Detect and validate identity provider
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Detect identity provider
      ansible.builtin.import_tasks: common_tasks/detect_identity_provider.yml

- name: Kerberos — Ansible FILE ccache documentation on FreeIPA server
  hosts: ipaserver
  become: true
  gather_facts: false
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: Install krb5.conf.d ansible-ccache-note.conf on ipaserver
      ansible.builtin.import_tasks: common_tasks/ensure_krb5_ansible_ccache_note.yml
      when: hostvars['localhost']['identity_provider_effective'] | default('') == 'freeipa'

    - name: Restore KEYRING default_ccache_name on ipaserver (clients stay commented in later plays)
      ansible.builtin.import_tasks: common_tasks/ensure_krb5_default_ccache_commented.yml
      when: hostvars['localhost']['identity_provider_effective'] | default('') == 'freeipa'

- name: Kerberos — Ansible FILE ccache documentation on identity client hosts
  hosts: "{{ identity_client_hosts }}"
  become: true
  gather_facts: false
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: Install krb5.conf.d ansible-ccache-note.conf on enrolled or enrolling hosts
      ansible.builtin.import_tasks: common_tasks/ensure_krb5_ansible_ccache_note.yml
      when: hostvars['localhost']['identity_provider_effective'] | default('') == 'freeipa'

- name: Build deployment portal facts for IPA HTTPD Caddy proxy (localhost)
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: Resolve portal facts before IPA client enrollment
      ansible.builtin.import_tasks: common_tasks/ensure_ipa_httpd_behind_caddy_before_client.yml
      when: identity_provider_effective == 'freeipa'

- name: Sync ipaserver HTTPD Caddy proxy state before client enrollment
  hosts: ipaserver
  gather_facts: true
  become: true
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: Apply or remove IPA HTTPD Caddy snippets and preflight JSON-RPC
      ansible.builtin.import_tasks: common_tasks/sync_ipa_httpd_caddy_proxy_state_on_ipaserver.yml
      when: hostvars['localhost']['identity_provider_effective'] | default('') == 'freeipa'

- name: Update DNS for identity provider
  hosts: all
  become: yes
  tasks:
    - name: Configure DNS (netplan or resolv.conf)
      ansible.builtin.import_tasks: common_tasks/configure_resolv_conf.yml

    - name: Wait for DNS to settle
      ansible.builtin.pause:
        seconds: 10

- name: Enroll cluster hosts with identity provider
  hosts: "{{ identity_client_hosts }}"
  become: yes
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: Install FreeIPA client packages
      ansible.builtin.package:
        name: "{{ os_vars[ansible_os_family].freeipa_client_packages }}"
        state: present
      when: identity_provider_effective == 'freeipa'

    - name: Join FreeIPA domain
      ansible.builtin.import_tasks: common_tasks/join_freeipa_client.yml
      when: identity_provider_effective == 'freeipa'

    - name: Join Active Directory realm
      ansible.builtin.import_tasks: common_tasks/join_ad_realm.yml
      when: identity_provider_effective == 'ad'

### ansible-playbook -i inventory.ini 16_setup_identity_client.yml
#
# Identity client enrollment (auto-detected FreeIPA or Active Directory)
---
- import_playbook: ensure_collections.yml

- name: Detect and validate identity provider
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Detect identity provider
      ansible.builtin.import_role:
        name: identity
        tasks_from: detect_identity_provider

- name: Kerberos — Ansible FILE ccache documentation on FreeIPA server
  hosts: ipaserver
  become: true
  gather_facts: false
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: Ipaserver kerberos ccache
      ansible.builtin.import_role:
        name: identity
        tasks_from: ipaserver_kerberos_ccache

- name: Kerberos — Ansible FILE ccache documentation on identity client hosts
  hosts: "{{ identity_client_hosts }}"
  become: true
  gather_facts: false
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: Client kerberos ccache
      ansible.builtin.import_role:
        name: identity
        tasks_from: client_kerberos_ccache

- name: Build deployment portal facts for IPA HTTPD Caddy proxy (localhost)
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: Portal facts before client
      ansible.builtin.import_role:
        name: identity
        tasks_from: portal_facts_before_client

- name: Sync ipaserver HTTPD Caddy proxy state before client enrollment
  hosts: ipaserver
  gather_facts: true
  become: true
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: Sync ipaserver caddy proxy
      ansible.builtin.import_role:
        name: identity
        tasks_from: sync_ipaserver_caddy_proxy

- name: Install identity client packages before DNS cutover
  hosts: "{{ identity_client_hosts }}"
  become: true
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: Identity client packages
      ansible.builtin.import_role:
        name: identity
        tasks_from: identity_client_packages

- name: Update DNS for identity provider
  hosts: all
  become: yes
  tasks:
    - name: Identity dns cutover
      ansible.builtin.import_role:
        name: identity
        tasks_from: identity_dns_cutover

- name: Enroll cluster hosts with identity provider
  hosts: "{{ identity_client_hosts }}"
  become: yes
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: Identity client enrollment
      ansible.builtin.import_role:
        name: identity
        tasks_from: identity_client_enrollment

---
# Ansible Galaxy collections for the PVC control node (Jenkins / pvc_setup / ensure_collections.yml).
# Install: ansible-galaxy collection install -r requirements.yml
#
# Controller Python (not Galaxy): cm_client, urllib3<2 (install_cm_client_python.yml);
#   cdpcli from PyPI plus Cloudera Labs cdpy v2.1.0 from GitHub
#   (install_cloudera_cloud_prereqs.yml) for cloudera.cloud + ECS LDAP IAM.

collections:
  - name: community.general
  - name: community.postgresql
  - name: ansible.posix
  - name: community.crypto
  - name: freeipa.ansible_freeipa
  - name: kubernetes.core
  - name: git+https://github.com/cloudera-labs/cloudera.exe.git,51d7636e743efab62e433fa060deadbbc0a2fb34

  # CM/CDP cluster API — 31_setup_base_cluster, 33_setup_ecs_cluster (cloudera.cluster.cluster)
  - name: git+https://github.com/cloudera-labs/cloudera.cluster.git,v4.4.0

  # ECS control plane — CDW/CDE/CAI/Model Registry + LDAP IAM (env_info, dw_*, de, ml)
  # Modules: env_info, dw_cluster, dw_database_catalog_info, dw_virtual_warehouse, de, ml
  - name: git+https://github.com/cloudera-labs/cloudera.cloud.git,78e5bbfff1cad88dc9602f8026d65bc7e3c88781

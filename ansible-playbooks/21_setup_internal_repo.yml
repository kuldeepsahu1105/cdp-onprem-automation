### ansible-playbook -i inventory.ini 21_setup_internal_repo.yml
#
# Internal web server for CM/CDH mirror — only when cm_repo_source=internal
---
- import_playbook: ensure_collections.yml

- name: Skip internal web server when using public Cloudera repos
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Skip internal repo for public
      ansible.builtin.import_role:
        name: cm_install
        tasks_from: skip_internal_repo_for_public

- name: Set up web server to host repository
  hosts: cldr-mngr
  become: true

  tasks:
    - name: Internal repo web server
      ansible.builtin.import_role:
        name: cm_install
        tasks_from: internal_repo_web_server

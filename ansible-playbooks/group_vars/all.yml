---
# ansible_config_vars:
# Fresh RHEL EC2 AMIs reject root SSH until bootstrap; use ec2-user + become (ansible.cfg).
# Override for in-VPC local control: ansible_user=root or CONTROL_MODE=local in pvc_setup.sh
ansible_user: ec2-user
ansible_ssh_private_key_file: ./id_rsa
ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
# ansible_galaxy: "/usr/bin/ansible-galaxy"

# dependencies versions:
java_version: "17"
python_version: "3.11"
postgresql_version: 18

# ---------------------------------------------------------------------------
# Identity provider: auto | freeipa | ad
# auto: [ipaserver] in inventory -> FreeIPA full flow
#       no ipaserver + ad_kdc_host set -> AD dependent flow only
# ---------------------------------------------------------------------------
identity_provider: auto

# True when inventory.ini has at least one host in [ipaserver] or legacy [ipa_server]
ipa_server_in_inventory: >-
  {{
    (groups.get('ipaserver', []) | default([]) | length > 0)
    or (groups.get('ipa_server', []) | default([]) | length > 0)
  }}

# Effective FreeIPA server inventory group ([ipaserver] preferred; Terraform-style [ipa_server] supported).
ipaserver_inventory_group_resolved: >-
  {%- if groups.get('ipaserver', []) | default([]) | length > 0 -%}
  ipaserver
  {%- elif groups.get('ipa_server', []) | default([]) | length > 0 -%}
  ipa_server
  {%- else -%}
  ipaserver
  {%- endif -%}
ipaserver_inventory_host: >-
  {{
    groups.get(ipaserver_inventory_group_resolved, [])[0]
    if ipa_server_in_inventory | bool
    else ''
  }}

identity_provider_effective: >-
  {%- if identity_provider in ['freeipa', 'ad'] -%}
  {{- identity_provider -}}
  {%- elif ipa_server_in_inventory | bool -%}
  freeipa
  {%- elif ad_kdc_host | default('') | length > 0 -%}
  ad
  {%- else -%}
  freeipa
  {%- endif -%}

# Host pattern for client enrollment / realm join
identity_client_hosts: "{{ 'all:!ipaserver' if ipa_server_in_inventory | bool else 'all' }}"

# Unified domain/realm (used by hostname, cluster FQDNs, Kerberos)
cluster_domain: "{{ ad_domain if identity_provider_effective == 'ad' else ipaserver_domain }}"
cluster_realm: "{{ cluster_domain | upper }}"

# ipa_server_vars:
ipaserver_domain: cldrsetup.local
ipaserver_realm: "{{ ipaserver_domain | upper }}"
ipaadmin_principal: "admin"
ipaadmin_password: "PseTeam@123"
ipadm_password: "{{ ipaadmin_password }}"
# Shared lab password (ECS UMS bootstrap, Kerberos admin, ECS LDAP admin); override in Jenkins ANSIBLE_GROUP_VARS_YAML
common_password: "{{ ipaadmin_password }}"
ipaserver_setup_dns: yes
# IPA BIND forwarders at ipa-server-install (see resolve_ipa_install_dns_forwarders.yml):
#   no (default) — no custom public forwarder; on AWS uses VPC resolver (x.y.0.2) unless opted out below
#   aws / vpc — always VPC resolver on EC2 when known
#   no-forwarders — legacy --no-forwarders (original 10_setup_freeipa_server.yml paste)
#   <IP> — explicit --forwarder=<IP>
dns_forwarders: "no"
# When dns_forwarders=no on AWS, pass --forwarder=<VPC resolver>. Set false (or dns_forwarders: no-forwarders) for --no-forwarders.
ipa_server_install_use_vpc_dns_forwarder: true
ipa_server_install_no_forwarders: false
reverse_zones: "no"
chrony_enabled: "yes"

# Active Directory (when identity_provider: ad)
# Leave ad_kdc_host empty unless using AD; placeholder values break identity auto-detect.
ad_domain: corp.example.com
ad_realm: "{{ ad_domain | upper }}"
ad_kdc_host: ""
ad_dns_servers:
  - "{{ ad_kdc_host }}"
ad_join_user: "svc-cloudera-join"
ad_join_password: "ChangeMe@123"
# Optional OU for computer accounts (leave empty to use default Computers container)
ad_computer_ou: ""
ad_organizational_unit: "{{ ad_computer_ou }}"
# CM service account for Kerberos admin operations in AD
ad_kdc_admin_user: "{{ ad_join_user }}"
ad_kdc_admin_password: "{{ ad_join_password }}"

# ---------------------------------------------------------------------------
# DNS / resolv.conf — AWS vs bare metal
# deployment_environment: auto (detect) | aws | baremetal
# ---------------------------------------------------------------------------
deployment_environment: auto
aws_region: "{{ lookup('env', 'AWS_REGION') | default('', true) }}"
aws_vpc_dns_resolver: ""
extra_dns_search_domains: []
extra_dns_nameservers: []

# ssh_vars:
ssh_user: "root"
ssh_dir: "/root/.ssh"
private_key_path: "{{ ssh_dir }}/id_rsa"
public_key_path: "{{ ssh_dir }}/id_rsa.pub"
authorized_keys_path: "{{ ssh_dir }}/authorized_keys"
force_generate: "{{ hostvars[inventory_hostname].force_generate | default(false) }}"

# Variables for setting internal repo (OS-specific paths resolved at runtime):
httpd_repo_dir: /var/www/https
server_name: "{{ ansible_fqdn }}"
cert_days_valid: 3650

# Variables for customizable certificate subject fields:
cert_country: "US"
cert_state: "Santa Clara"
cert_locality: "Raleigh"
cert_organization: "Cloudera Inc"
cert_organizational_unit: "CLDR"
# cert_common_name: "cldr-mngr.cldrsetup.local"

# The CN (Common Name) will be automatically set to the FQDN:
cert_subj: "/C={{ cert_country }}/ST={{ cert_state }}/L={{ cert_locality }}/O={{ cert_organization }}/OU={{ cert_organizational_unit }}/CN={{ ansible_fqdn }}"

# Variables for wildcard record and postgres jdbc driver setup:
wildcard_dns_record: "*.apps"
postgres_jdbc_version: "42.7.10"  # Configurable version
psycopg2_binary_version: ""  # empty = latest from pip; pin e.g. "2.9.9"
jdbc_driver_url: "https://jdbc.postgresql.org/download/postgresql-{{ postgres_jdbc_version }}.jar"
jdbc_driver_dest: "/usr/share/java/postgresql-connector-java.jar"

# PostgreSQL database variables (OS-specific paths in os_vars below):
pg_client_crt_dir: "/root/.postgresql"
postgres_user: "postgres"
postgres_password: "postgres"
postgres_db: "postgres"

# PostgreSQL configuration template variables:
postgres_port: 5432
listen_addresses: "*"
max_connections: 1000
shared_buffers: "1024MB"
wal_buffers: "16MB"
max_wal_size: "6GB"
min_wal_size: "512MB"
checkpoint_completion_target: 0.9
standard_conforming_strings: "off"
jit: "off"

# PostgreSQL database TLS/SSL variables:
enable_ssl: true
ssl_ca_file: "root.crt"
ssl_cert_file: "server.crt"
ssl_key_file: "server.key"

# cldr-mngr repo setup variables:
cm_version: "7.13.2.10000"
cm_numeric_version: "713210000"

cdh_version: "7.3.2.10000"
cdh_numeric_version: "82216952"
# Spark is bundled in the CDH parcel for 7.3.1+ — separate SPARK3 parcel not required
cdh_spark_bundled_min_version: "7.3.1"

# spark_version: "3.3.1.7.3.1.700"
# spark_minor_version: "3.3.1.7.3.1.700"
# spark_numeric_version: "p0.74774806"

public_ip: "{{ ansible_default_ipv4.address }}"
cm_repo_username: "<username>"
cm_repo_password: "<password>"
# Archive credentials: set here OR use *info.txt / CM_REPO_USERNAME+PASSWORD (one source only).
webserver_path: "/var/www/html"
cldr_repos_path: "{{ webserver_path }}/cloudera-repos"

# ---------------------------------------------------------------------------
# CM/CDH repository source: public | internal
# public   — use archive.cloudera.com/p/ directly (default)
# internal — mirror CM + CDH parcels to cldr-mngr web server (16 + 17 playbooks)
#            RHEL: yum/RPM + createrepo | Ubuntu/Debian: apt mirror + Packages index
# ---------------------------------------------------------------------------
cm_repo_source: public
cm_repo_public_base_url: "https://archive.cloudera.com/p"
cm_repo_mirror_host: "{{ hostvars[groups['cldr-mngr'][0]].ansible_host | default(groups['cldr-mngr'][0]) }}"
cdh_repo_product: "cdh{{ cdh_version.split('.')[0] }}"
parcel_repo_public: "{{ cm_repo_public_base_url }}/{{ cdh_repo_product }}/{{ cdh_version }}/parcels/"
parcel_repo_internal: "http://{{ cm_repo_mirror_host }}/cloudera-repos/{{ cdh_repo_product }}/{{ cdh_version }}/"
parcel_repo: "{{ parcel_repo_internal if cm_repo_source == 'internal' else parcel_repo_public }}"

# CDH parcel file suffix — auto-detects from worker OS when set to "auto".
# Archive publishes: el8, el9, jammy (Ubuntu 22.04), noble (Ubuntu 24.04), sles15, *.aarch64le
# Examples: cdh_parcel_os_suffix: noble | jammy | el8 | el9 | el8.aarch64le
cdh_parcel_os_suffix: auto
cdh_parcel_target_group: base-workers
cdh_parcel_os_suffix_fallback: el8

# cldr-mngr: scm config:
scm_db_name: "scm"
scm_db_user: "scm"
scm_db_password: "scm"
cm_db_ssl_crt_dir: "/var/lib/cloudera-scm-server/.postgresql"
cm_db_root_crt: "{{ cm_db_ssl_crt_dir }}/root.crt"
cldr_mngr_packages:
  server:
    - cloudera-manager-server
    - cloudera-manager-daemons
    # - cloudera-manager-agent  
  client:
    - cloudera-manager-agent
    - cloudera-manager-daemons

# cldr-mngr databases to be created on postgres external database:
databases:
  - { name: "{{ scm_db_name }}", user: "{{ scm_db_user }}", password: "{{ scm_db_password }}" }
  - { name: "rman", user: "rman", password: "rman" }
  - { name: "hue", user: "hue", password: "hue" }
  - { name: "hive", user: "hive", password: "hive" }
  - { name: "knox", user: "knox", password: "knox" }
  - { name: "oozie", user: "oozie", password: "oozie" }
  - { name: "ranger", user: "rangeradmin", password: "rangeradmin" }
  - { name: "rangerkms", user: "rangerkms", password: "rangerkms" }
  - { name: "schemaregistry", user: "schemaregistry", password: "schemaregistry" }
  - { name: "nifiregistry", user: "nifiregistry", password: "nifiregistry" }
  - { name: "dataviz", user: "dataviz", password: "dataviz" }
  - { name: "yqm", user: "yqm", password: "yqm" }
  - { name: "smm", user: "smm", password: "smm" }
  - { name: "das", user: "das", password: "das" }

scm_csds: []
# Optional explicit CSD URL list (overrides auto-built URLs). Leave empty to build from version vars below.
scm_csds_redhat: []

# CSD archive versions (https://archive.cloudera.com/p/...). Update jar basenames when build ids change.
cdv_version: "8.0.7"
cdv_dataviz_csd_jar: "DATAVIZ-{{ cdv_version }}-b50.p1.71299628.jar"
cfm_version: "2.1.7.3004"
cfm_nifi_app_version: "1.28.1"
cfm_nifi_csd_jar: "NIFI-{{ cfm_nifi_app_version }}.{{ cfm_version }}-1.jar"
cfm_nifi_registry_csd_jar: "NIFIREGISTRY-{{ cfm_nifi_app_version }}.{{ cfm_version }}-1.jar"
# redhat8 | redhat9 | auto (CM host RHEL major version)
csd_redhat_repo: auto
# When scm_csds / scm_csds_redhat are empty, build URLs from versions (RHEL CM only)
csd_build_urls_enabled: true
# Include a CSD only when matching base_cluster_install_services toggle (set false to install all three)
csd_respect_service_toggles: true
csd_install_dataviz: true
csd_install_nifi: true
csd_install_nifi_registry: true

# When true, pure Debian hosts use Ubuntu CM apt repo path (Cloudera supports Ubuntu only)
cm_debian_use_ubuntu_repo: false
cm_debian_ubuntu_compat_version: "2204"

##### cm_server api configs:
cm_port: 7180
cm_admin_user: "admin"
cm_admin_pass: "admin"
# Factory CM login password on first boot (used to reset to cm_admin_pass when different)
cm_admin_bootstrap_pass: "admin"
cdh_basecluster_name: "CDH-Cluster"
base_cluster_master_group: base-masters
base_cluster_worker_group: base-workers

# CDP base cluster services (31_setup_base_cluster.yml). Override per key in Ansible controller via base_cluster_install_services.
base_cluster_install_services:
  core_settings: true
  zookeeper: true
  hdfs: true
  ozone: true
  yarn: true
  tez: true
  hive: true
  hive_on_tez: true
  hbase: true
  hue: true
  # ICEBERG service requires newer CDH parcels (not on CDH 7.3.2); enable when parcel supports it.
  iceberg: false
  # Replication Manager is not on CDH 7.3.2; enable when the parcel supports REPLICATION_MANAGER.
  replication: false
  impala: true
  kafka: true
  atlas: true
  ranger: true
  # Optional CFM/CDV (install matching CSDs in 24_start_cm.yml; set true to add to base cluster)
  nifi: false
  nifi_registry: false
  dataviz: false
  phoenix: false
  knox: true
  # Solr is required for Ranger audit with HDFS (CDP default); disable only if Ranger is false.
  solr: true

# YARN sizing for small lab clusters (base_cluster_cluster_spec.j2)
base_cluster_yarn_rm_max_mb: 4096
base_cluster_yarn_rm_max_vcores: 4
base_cluster_yarn_nm_memory_mb: 4096
base_cluster_yarn_nm_vcores: 4

cdh_parcel_version: "{{ cdh_version.split('.')[:3] | join('.') }}-1.cdh{{ cdh_version.split('.')[:3] | join('.') }}.p{{ cdh_version.split('.')[-1] }}.{{ cdh_numeric_version }}"
kerberos_principal: "{{ ipaadmin_principal }}/{{ ipaadmin_principal }}@{{ cluster_realm }}"
kerberos_password: "{{ ipaadmin_password }}"
license_file_name: "license.txt"

# Kerberos / KDC (FreeIPA or Active Directory)
kdc_host: "{{ ad_kdc_host if identity_provider_effective == 'ad' else ipa_kdc_host }}"
krb5_kdc_type: "{{ 'Active Directory' if identity_provider_effective == 'ad' else 'Red Hat IPA' }}"
krb5_kdc_admin_user: "{{ ad_kdc_admin_user if identity_provider_effective == 'ad' else ipaadmin_principal }}"
krb5_kdc_admin_password: "{{ ad_kdc_admin_password if identity_provider_effective == 'ad' else ipaadmin_password }}"
krb5_ad_suffix: "{{ ad_domain }}"
krb5_ad_delete_on_regenerate: true

# PostgreSQL server for Cloudera Manager (23_setup_postgres.yml) and CMS Reports Manager.
# Auto-detect install target: [postgres] → [db] → cldr-mngr. Set postgres_inventory_group to pin a group name.
postgres_inventory_group: ""
postgres_inventory_group_resolved: >-
  {%- set explicit = postgres_inventory_group | default('') | trim -%}
  {%- if explicit | length > 0 -%}
  {{- explicit -}}
  {%- elif 'postgres' in groups and groups['postgres'] | length > 0 -%}
  postgres
  {%- elif 'db' in groups and groups['db'] | length > 0 -%}
  db
  {%- else -%}
  cldr-mngr
  {%- endif -%}
postgres_inventory_host: "{{ groups[postgres_inventory_group_resolved][0] }}"
postgres_host_fqdn: >-
  {{ hostvars[postgres_inventory_host].cldr_hostname | default(postgres_inventory_host) }}.{{ cluster_domain }}

# Cloudera Management Service (CMS) - NOT the CDP base cluster
# CMS roles on cldr-mngr; Reports Manager JDBC uses postgres_host_fqdn above.
cm_manager_inventory_host: "{{ groups['cldr-mngr'][0] if ('cldr-mngr' in groups and groups['cldr-mngr'] | length > 0) else '' }}"
cm_postgres_inventory_host: "{{ postgres_inventory_host }}"
cm_cms_hostname: "{{ hostvars[cm_manager_inventory_host].cldr_hostname | default(cm_manager_inventory_host) }}.{{ cluster_domain }}"
cm_cms_servicemonitor_memory_bytes: 6442450944
cm_cms_role_types:
  - SERVICEMONITOR
  - HOSTMONITOR
  - EVENTSERVER
  - ALERTPUBLISHER
  - REPORTSMANAGER
cm_cms_health_role_types:
  - SERVICEMONITOR
  - HOSTMONITOR
  - REPORTSMANAGER
cm_cms_reports_manager_db_host: "{{ postgres_host_fqdn }}"
cm_cms_reports_manager_db_name: rman
cm_cms_reports_manager_db_user: rman
cm_cms_reports_manager_db_password: rman
# After 27_setup_cm_autotls.yml, point CMS Java clients (firehose/headlamp) at agent Auto-TLS truststore.
cm_cms_configure_autotls_trust: true
cm_cms_autotls_truststore_path: /var/lib/cloudera-scm-agent/agent-cert/cm-auto-global_truststore.jks
# Labs cm_autotls: reconcile MGMT trust + restart CMS in 27 when CMS already exists; full CMS in 29.
cm_cms_reconcile_trust_after_autotls: true
cm_cms_restart_after_autotls: true
# Bounded waits for CMS setup (max wall time ≈ retries × delay seconds).
cm_api_command_poll_retries: 90
cm_api_command_poll_delay: 10
cm_cms_monitor_wait_retries: 30
cm_cms_monitor_wait_delay: 20
cm_cms_monitor_wait_timeout_seconds: "{{ (cm_cms_monitor_wait_retries | int) * (cm_cms_monitor_wait_delay | int) }}"
# Bounded wait for CM kerberosInfo.kerberized after importAdminCredentials + CM restart (playbook 28).
cm_krb_kerberized_wait_retries: 30
cm_krb_kerberized_wait_delay: 10
cm_krb_kerberized_wait_timeout_seconds: "{{ (cm_krb_kerberized_wait_retries | int) * (cm_krb_kerberized_wait_delay | int) }}"
cm_krb_kdc_preflight_timeout: 60
# Post-CMS checks: Postgres for Reports Manager; TCP listen for Service Monitor Avro (firehose).
cm_cms_verify_reports_manager_db: true
cm_cms_verify_servicemonitor_listen: true
cm_cms_servicemonitor_port_config_names:
  - firehose_port
  - firehose_listen_port
  - listen_port
cm_cms_smon_listen_wait_timeout_seconds: 120

# CM agents — server_host / use_tls reconcile (24_start_cm, 25_reconcile_cm_agents, 27 after Auto-TLS)
cm_agent_reconcile_after_autotls: true
cm_agent_active_wait_retries: 12
cm_agent_active_wait_delay: 5
# When true, set use_tls=1 in config.ini (also set from CM API in 25/27 when Auto-TLS is on)
cm_agent_use_tls: false

# CM Hosts UI — optional tags (PUT /hosts/{fqdn}/tags); empty Tags column is normal until this runs
cm_host_tags_enabled: true
cm_host_tags_owner: "cdp-lab"
cm_host_tags_env_value: "{{ cdh_basecluster_name }}"
cm_host_tag_group_map:
  cldr-mngr: cm
  base-masters: base-master
  base-workers: base-worker
  ecs-masters: ecs-master
  ecs-workers: ecs-worker

# CM Hosts UI — Last Heartbeat (agent→CM); load/disk/memory columns need Host Monitor (29)
cm_host_heartbeat_verify_enabled: true
cm_host_heartbeat_verify_after_cms: true
cm_host_heartbeat_verify_fail: true
cm_host_heartbeat_max_age_seconds: 300
cm_host_heartbeat_verify_retries: 6
cm_host_heartbeat_verify_delay: 30

# Cloudera Manager API ports
cm_https_port: 7183
cm_http_port: 7180
# Control-plane reachability (CM API + portal URL verify from the Ansible controller):
#   auto   — remote controller outside VPC → public ansible_host; CONTROL_MODE=local on cluster → private;
#            else try CM private/public from controller (VPN/bare metal prefers private)
#   public — control node has no route to 10.x/172.31.x (typical Ansible controller host)
#   private — bare metal / in-VPC / VPN automation (prefer inventory private_ip)
ansible_control_reachability: auto
# Legacy toggles (auto profile also reads these; Ansible controller run-ansible.sh sets public equivalents)
cm_api_prefer_private_ip: true
cm_api_connect_host: ""
ansible_controller_outside_vpc: false
# Default: run CM API /api/version checks on cldr-mngr (manager IP/FQDN). Set false to check from the Ansible controller.
cm_api_delegate_probes_to_manager: true
cm_api_private_reachability_timeout: 5
# Cloudera Manager UI/API use direct cldr-mngr :7180/:7183 — not Caddy (portal stack is portal/pgAdmin/monitoring/IPA only).
cm_external_url: ""
# Deprecated — CM frontend_url is not set via Caddy; kept for inventory overrides only.
cm_apply_caddy_frontend_url: false
cm_config_api_via_caddy_proxy: false
# fail | warn — reserved for CM API reachability policy (default fail)
cm_api_verify_mode: fail
# Deprecated — cm_api_version is fetched from GET /api/version (see fetch_cm_api_version_slug.yml)
cm_api_version_default: v58
# Portal verify: skip VPC-only URL checks when control profile is public-only (remote controller default)
deployment_portal_url_verify_skip_vpc: false
# Milestone-scoped URL verify (portal, ipa, identity, cm, cm_tls, cdh, monitoring, ecs).
# Default [] — 10_setup_deployment_portal sets [portal, ipa]; pvc_setup/35_refresh pass cumulative lists per phase.
deployment_portal_verify_milestones: []
# Deprecated no-op — CM URL verify is only in 25_verify_cm.yml (portal milestones strip cm/cm_tls)
deployment_portal_verify_cm_vhost: false
# Set by 35_refresh_deployment_portal.yml — legacy CM milestone when milestones extra-var omitted
deployment_portal_verify_post_cm: false
# Deprecated — CM UI verify is direct on cldr-mngr; kept for inventory overrides
deployment_portal_cm_vhost_tier_a_verify: fail
# Tier B: GET external URLs from Ansible controller when ansible_control_reachability is public (warn|fail|skip)
deployment_external_url_verify: warn
# External URL GET checks from Ansible controller in 10/35 (default off — portal sync only checks Caddy :port + index)
deployment_portal_verify_tier_b_enabled: false
# pgAdmin HTTP verify after portal sync (default off)
deployment_portal_pgadmin_verify_enabled: false
# Legacy portal-only key (used when deployment_external_url_verify is unset)
deployment_portal_external_url_verify: warn
# Optional per-service overrides, e.g. deployment_cm_external_url_verify: skip
# Or map: deployment_service_external_url_verify: { cm: warn, grafana: skip }
# Tier B direct https://ipaserver.<domain> from controller: auto skips on public remote when Caddy IPA vhosts exist
deployment_ipa_direct_fqdn_external_url_verify: auto
# Set true after 27_setup_cm_autotls.yml (CM listens on :7183; Caddy is not used for CM).
autotls_enabled: false

##### cm_server autotls variables:
# SSH Authentication (Choose one)
# cm_node_sudo_password: "your-root-pass"  # Required for password-based authentication # Either commented out or defined but not set to empty string
# Path on Ansible controller (CI runner or laptop), not on CM host. Empty = auto (sshkey.pem / ansible_ssh_private_key_file).
cm_private_key_path: ""
cm_priv_key_passphrase: "" # If private key is encrypted, provide cm_priv_key_passphrase

# OS User for Key-Based/Password based Authentication for AutoTLS
cm_srvr_sudo_user: "root" # Set the default SSH user for key-based/password-based authentication

# Cloudera Manager Auto-TLS
use_freeipa_for_crt_mgmt: false # Set to true if FreeIPA is used for certificate management
# Run generateCmca even when CM API reports Auto-TLS already configured (repair / re-apply)
cm_autotls_force_run: false

# cloudera.cluster devel/v5 expects cm_client ApiClient(configuration=); PyPI cm-client uses host=.
# v4.0.0 dropped cluster/cm_config modules — pin v4.4.0 for 31/33 cloudera.cluster.cluster.
cloudera_cluster_collection_git_ref: v4.4.0
# ECS data services / LDAP IAM (cloudera.cloud.*); keep in sync with requirements.yml
cloudera_cloud_collection_git_ref: v2.5.1

##### KDC integration for cldr-mngr:
# Cloudera Manager KRB_ENC_TYPES (short names). AES only — Java 17+ disables RC4.
krb5_allow_weak_rc4: false
krb5_enc_types: >-
  {{
    'aes256-cts aes128-cts' + (' rc4-hmac' if krb5_allow_weak_rc4 | bool else '')
  }}
# FreeIPA KDC krb5 permitted_enctypes (long krb5 names; see templates/krb5_permitted_enctypes.conf.j2)
krb5_ipa_default_enctypes: "aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96"
krb5_ipa_permitted_enctypes: >-
  {{
    krb5_ipa_default_enctypes
    + ' aes256-cts-hmac-sha384-192 aes128-cts-hmac-sha256-128'
    + (' arcfour-hmac' if krb5_allow_weak_rc4 | bool else '')
  }}
ipa_kdc_host: "ipaserver.{{ ipaserver_domain }}"

# Cloudera Manager LDAP integration (FreeIPA or Active Directory)
# AUTH_BACKEND_ORDER must be one of: DB_ONLY, LDAP_THEN_DB, DB_THEN_LDAP, LDAP_ONLY, EXTERNAL_ONLY_WITHOUT_DB_ADMINS
cm_ldap_enabled: true
cm_ldap_auth_backend_order: DB_THEN_LDAP
cm_ldap_auth_backend_order_allowed:
  - DB_ONLY
  - LDAP_THEN_DB
  - DB_THEN_LDAP
  - LDAP_ONLY
  - EXTERNAL_ONLY_WITHOUT_DB_ADMINS
cm_ldap_type: "LDAP"
cm_ldap_url: >-
  {{ 'ldaps://' + ad_kdc_host + ':636' if identity_provider_effective == 'ad'
     else 'ldaps://' + ipa_kdc_host + ':636' }}
cm_ldap_bind_dn: >-
  {{ ad_ldap_bind_dn if identity_provider_effective == 'ad'
     else 'uid=' + ipaadmin_principal + ',cn=users,cn=accounts,' + ipa_ldap_dc_suffix }}
cm_ldap_bind_password: "{{ ad_ldap_bind_password if identity_provider_effective == 'ad' else ipaadmin_password }}"
cm_ldap_user_search_base: >-
  {{ ad_ldap_user_search_base if identity_provider_effective == 'ad'
     else 'cn=users,cn=accounts,' + ipa_ldap_dc_suffix }}
cm_ldap_user_search_filter: "{{ '(sAMAccountName={0})' if identity_provider_effective == 'ad' else '(uid={0})' }}"
cm_ldap_group_search_base: >-
  {{ ad_ldap_group_search_base if identity_provider_effective == 'ad'
     else 'cn=groups,cn=accounts,' + ipa_ldap_dc_suffix }}
cm_ldap_group_search_filter: "{{ '(member={0})' if identity_provider_effective == 'ad' else '(&(member={0})(objectClass=posixgroup))' }}"
cm_ldap_dn_pattern: ""

# AD LDAP bind/search defaults (override in extra-vars or vault as needed)
ad_ldap_bind_dn: "CN=svc-cm-ldap,OU=Service Accounts,DC=corp,DC=example,DC=com"
ad_ldap_bind_password: "{{ ad_join_password }}"
ad_ldap_user_search_base: "OU=Users,DC=corp,DC=example,DC=com"
ad_ldap_group_search_base: "OU=Groups,DC=corp,DC=example,DC=com"

# FreeIPA LDAP (used when identity_provider: freeipa)
ipa_ldap_dc_suffix: "{% for part in ipaserver_domain.split('.') %}dc={{ part }}{% if not loop.last %},{% endif %}{% endfor %}"

cloudera_manager_api_user: "{{ cm_admin_user }}"
cloudera_manager_api_password: "{{ cm_admin_pass }}"

# ---------------------------------------------------------------------------
# CPU architecture (optional ARM64 / AWS Graviton)
# CPU_ARCHITECTURE: x86_64 (default) | arm64
# APPLY_GRAVITON_DEFAULTS: remap m5/r5 → m7g/r7g when arm64 (default true)
# AUTO_RESOLVE_ARM64_AMI: lookup RHEL 9 arm64 AMI in AWS_REGION when arm64 (default true)
# ECS_DEPLOY_ON_ARM64: enable ECS on ARM64 — experimental (default false)
# ---------------------------------------------------------------------------
target_cpu_architecture: auto  # auto | x86_64 | arm64 — wrappers pass CPU_ARCHITECTURE from .tfvars
ecs_deploy_on_arm64: false
cdh_parcel_arm64_suffix: ".aarch64le"  # appended to el8/el9/jammy/noble parcel names on ARM64 workers
# Master switch MUST be true to run any cleanup:
#   ansible-playbook -i inventory.ini 99_cleanup.yml -e cleanup_enabled=true ...
# ---------------------------------------------------------------------------
cleanup_enabled: false
cleanup_confirm: false

# Cluster/API cleanup scope
cleanup_delete_base_cluster: false
cleanup_delete_ecs_cluster: false
cleanup_stop_cms: false
cleanup_delete_cms: false
cleanup_delete_cluster_via_api: true

# Cloudera Manager removal
cleanup_remove_cm: false
cleanup_remove_cm_agents: false
cleanup_remove_cm_repo_file: false

# PostgreSQL / CM database cleanup (typically on cldr-mngr)
cleanup_stop_postgres: false
cleanup_remove_postgres_data: false
cleanup_backup_postgres_data: true
cleanup_remove_postgres_packages: false
cleanup_remove_postgres_user: false

# End-to-end / deep cleanup
cleanup_e2e: false
cleanup_remove_service_users: "{{ cleanup_e2e }}"
cleanup_remove_service_groups: "{{ cleanup_e2e }}"
cleanup_deep_remove_data_dirs: "{{ cleanup_e2e }}"

# ECS-specific options
cleanup_reset_iptables: false
cleanup_ecs_remove_docker_registry: true
cleanup_ecs_run_rke2_killall: true

# Post-cleanup actions
cleanup_reboot_hosts: false

# Cluster names for API deletion
ecs_cluster_name: "ECS-Cluster"

# ---------------------------------------------------------------------------
# ECS (Cloudera Data Services / Experience Cluster) deployment
# Requires base cluster (31) and wildcard DNS (*.apps) when using FreeIPA.
# Compatible with CDH 7.3.2: CDS 1.5.5 SP3+ (see Cloudera release matrix).
# ---------------------------------------------------------------------------
ecs_deploy_enabled: auto  # auto | true | false — auto runs when ecs-masters/workers exist
ecs_cluster_master_group: ecs-masters
ecs_cluster_worker_group: ecs-workers
ecs_pvc_ds_version: "1.5.5-h3300"  # CDS 1.5.5 SP3 CHF3 repo tag
ecs_pvc_repository_url: "{{ cm_repo_public_base_url }}/cdp-pvc-ds/{{ ecs_pvc_ds_version }}"
ecs_parcel_repo_url: "{{ ecs_pvc_repository_url }}/parcels/"
# Optional override; when empty the playbook discovers the latest ECS parcel from CM after refresh
ecs_parcel_version: ""
ecs_app_domain: "apps.{{ cluster_domain }}"
ecs_docker_data_path: "/mnt/docker"
ecs_lso_data_path: "/ecs/local"
ecs_longhorn_data_path: "/ecs/longhorn-storage"
ecs_longhorn_replication: 2
ecs_nfs_over_provisioning: 800
ecs_k8s_webui_secret_admin_token: "ChangeMe@ECS-WebUI"
ecs_cp_prometheus_ingress_user: "{{ cm_admin_user }}"
ecs_cp_prometheus_ingress_password: "{{ cm_admin_pass }}"
ecs_infra_prometheus_ingress_user: "{{ cm_admin_user }}"
ecs_infra_prometheus_ingress_password: "{{ cm_admin_pass }}"
# ECS Management Console bootstrap admin (UMS); must meet CDP complexity rules
ecs_console_admin_password: "{{ common_password | default(ipaadmin_password, true) }}"
ecs_control_plane_database_mode: embedded  # embedded | existing (existing needs full control_plane_config)
ecs_control_plane_vault_mode: embedded
ecs_control_plane_embedded_db_storage_gb: 50
ecs_control_plane_embedded_vault_storage_gb: 2

# ECS Data Services (CDW, CDE, CAI) — 34_setup_ecs_data_services.yml
# IAM access keys are signed API credentials — automation can CREATE machine-user keys after ECS
# is up only when a bootstrap admin key exists (one-time console key or ecs_iam_bootstrap_*).
ecs_data_services_deploy_enabled: false
ecs_control_plane_url: ""  # blank = https://console.{{ ecs_app_domain }}
ecs_api_access_key_id: ""
ecs_api_private_key: ""
ecs_auto_provision_api_access_key: true
ecs_automation_machine_user: cldr-automation-sa
ecs_automation_access_key_type: V2
ecs_iam_bootstrap_access_key_id: ""
ecs_iam_bootstrap_private_key: ""
ecs_api_credentials_cache_path: "{{ lookup('env', 'CDP_ARTIFACTS_DIR') | default(lookup('env', 'WORKSPACE') | default('/tmp', true) ~ '/artifacts', true) }}/ecs-automation-api-credentials.yml"
ecs_control_plane_wait_retries: 40
ecs_control_plane_wait_delay: 15
ecs_control_plane_validate_certs: false
ecs_data_services_use_cdpcurl: true
ecs_data_services_install: []  # optional list; unioned with per-service flags below
# Per-service toggles (Jenkins: ECS_DEPLOY_CDW, ECS_DEPLOY_CDE, ECS_DEPLOY_CAI, ECS_DEPLOY_CAI_REGISTRY)
ecs_deploy_cdw: false
ecs_deploy_cde: false
ecs_deploy_cai: false
ecs_deploy_cai_registry: false  # Model Registry (requires [sdx]); install key model_registry
ecs_data_services_catalog:
  cdw:
    name: Cloudera Data Warehouse
    description: CDW on ECS control plane
    url: ""
  cde:
    name: Cloudera Data Engineering
    description: CDE virtual clusters
    url: ""
  cai:
    name: Cloudera AI
    description: Cloudera AI workspaces
    url: ""
# CDP environment name on private cloud (must match ECS control plane environment)
ecs_cdp_environment_name: ecs
ecs_cdp_console_api_url: ""  # default https://console-cdp.<ecs_app_domain>
ecs_data_services_verify_tls: false
# Optional ECS control plane LDAP (FreeIPA/AD) — playbook 33 end and/or 34
ecs_ldap_enabled: false
ecs_data_services_configure_ldap: false  # when true, sync LDAP before installing CDW/CDE/CAI in playbook 34
ecs_ldap_provider_name: cm-ldap
# LDAP admin user <prefix>admin in FreeIPA + IAM roles on ECS environment
ecs_ldap_admin_user_enabled: false
ecs_ldap_admin_user_prefix: cldr
ecs_ldap_admin_username: "{{ ecs_ldap_admin_user_prefix }}admin"
ecs_ldap_admin_password: "{{ common_password | default(ipaadmin_password, true) }}"
ecs_ldap_admin_assign_all_tenant_roles: true
ecs_ldap_admin_assign_all_resource_roles_on_env: true
ecs_ldap_admin_tenant_role_name_regex: '(?i)(poweruser|iamadmin|admin|owner|environment)'
ecs_ldap_admin_resource_role_name_regex: '(?i)(admin|owner|power|environment|de|dw|ml|data)'
# CDW
ecs_cdw_private_cloud_config: {}  # optional storage_class, db_client_certificate paths
ecs_cdw_hive_vw_name: hive-vw
ecs_cdw_impala_vw_name: impala-vw
ecs_cdw_vw_tshirt_size: xsmall
ecs_cdw_dbc_wait_retries: 10
ecs_cdw_dbc_wait_delay: 30
# CDE
ecs_cde_service_name: "{{ ecs_cluster_name | regex_replace('[^a-zA-Z0-9]+', '-') | lower }}-de"
ecs_cde_instance_type: private
ecs_cde_cpu_requests: "24"
ecs_cde_memory_requests: 64Gi
ecs_cde_resource_pool: "root.{{ ecs_cdp_environment_name }}.cde"
# CAI / CML workspace
ecs_cai_workspace_name: "{{ ecs_cluster_name | regex_replace('[^a-zA-Z0-9]+', '-') | lower }}-ml"
ecs_cai_k8s_namespace: cml
ecs_cai_resource_pool:
  cpu: "50"
  memory: "46 Gi"
ecs_cai_enable_governance: true
ecs_cai_enable_metrics: true
ecs_cai_enable_tls: true
ecs_cai_enable_monitoring: true
# Model Registry (requires [sdx] inventory + Ozone)
ecs_model_registry_sdx_group: sdx
ecs_model_registry_service_name: "{{ ecs_cluster_name | regex_replace('[^a-zA-Z0-9]+', '-') | lower }}-registry"
ecs_model_registry_subdomain: model-registry
ecs_model_registry_s3_bucket: "{{ cdh_basecluster_name | lower }}-registry"
ecs_model_registry_s3_endpoint: ""  # default https://<first-sdx-fqdn>:9879 when model_registry is selected
ecs_model_registry_ozone_service_id: o3service1

# ---------------------------------------------------------------------------
# Deployment portal + ops UI — 10_setup_deployment_portal.yml
# Caddy index, pgAdmin, Prometheus, Grafana, Alertmanager, cAdvisor on ops host.
# auto = ipaserver when [ipaserver] exists, else cldr-mngr. pgAdmin targets CM PostgreSQL on cldr-mngr.
# ---------------------------------------------------------------------------
# Portal header attribution (index badges). Filled from tfvars/Jenkins when unset:
#   owner → deployment_owner (Terraform pvc_cluster_tags.owner / Jenkins OWNER)
#   environment → deployment_name_prefix (workspace + EC2 Name prefix / Jenkins ENVIRONMENT)
portal_automation_owner_display: "Kuldeep Sahu"
deployment_owner: ""
deployment_name_prefix: ""
# ipaserver EC2 start/stop helper (36/37). CLI: <op> <prefix> <hostgroup...> (tag:environment + tag:Group).
# On-disk name: {prefix}_cldr_ec2_strt_stp.sh; symlink /usr/local/bin/{same}. prefix = deployment_name_prefix (Jenkins ENVIRONMENT).
ec2_startstop_script_name_prefix: ""
ec2_startstop_script_dir: /root
ec2_startstop_script_prefix_effective: >-
  {{
    (ec2_startstop_script_name_prefix | default('', true) | trim)
    if (ec2_startstop_script_name_prefix | default('', true) | trim | length > 0)
    else (deployment_name_prefix | default('', true) | trim)
  }}
ec2_startstop_script_prefix_sanitized: >-
  {{
    ec2_startstop_script_prefix_effective
    | lower
    | regex_replace('[^a-z0-9_]', '_')
    | regex_replace('_+', '_')
    | regex_replace('^_', '')
    | regex_replace('_$', '')
  }}
ec2_startstop_script_basename: >-
  {{
    (ec2_startstop_script_prefix_sanitized ~ '_cldr_ec2_strt_stp.sh')
    if (ec2_startstop_script_prefix_sanitized | length > 0)
    else 'cldr_ec2_strt_stp.sh'
  }}
ec2_startstop_script_path: "{{ ec2_startstop_script_dir }}/{{ ec2_startstop_script_basename }}"
# Terraform instance_groups keys → EC2 tag:Group (see README, .tfvars.yaml, generate_inventory.sh). Used for script/Jenkins/portal examples.
ec2_startstop_terraform_group_catalog:
  - cldr_mngr
  - ipa_server
  - pvcbase_master
  - pvcbase_worker
  - pvcecs_master
  - pvcecs_worker
ec2_startstop_ansible_to_terraform_group:
  cldr-mngr: cldr_mngr
  ipaserver: ipa_server
  ipa_server: ipa_server
  base-masters: pvcbase_master
  base-workers: pvcbase_worker
  ecs-masters: pvcecs_master
  ecs-workers: pvcecs_worker
# Scan order for effective Group tags (only groups with hosts in inventory are included in examples).
ec2_startstop_inventory_group_scan_order:
  - cldr-mngr
  - base-masters
  - base-workers
  - ecs-masters
  - ecs-workers
  - ipaserver
# Portal + Caddy on ops host when deployment_portal_enabled + caddy_vhost_enabled (resolve_deployment_portal_caddy_enabled.yml). monitoring_stack_enabled gates monitoring install in sync only.
deployment_portal_enabled: true
# Set by Jenkins PORTAL / pvc_setup bootstrap — fail instead of silent skip when Caddy gate is off.
deployment_portal_install_required: false
deployment_portal_host_group: auto
# auto = same resolution as postgres_inventory_group_resolved ([postgres] → [db] → cldr-mngr)
deployment_portal_postgres_host_group: auto
# Caddy edge listener on ops (ipaserver): portal, pgAdmin, monitoring, and IPA vhosts share this TCP port.
# Cloudera Manager and ECS use direct host ports (cldr-mngr :7180/:7183; ECS console/gateway URLs) — not Caddy.
deployment_portal_http_port: 81
deployment_portal_pgadmin_host_port: 5050
deployment_portal_config_dir: /opt/cldr-deployment-portal
deployment_portal_www_dir: /opt/cldr-deployment-portal/www
deployment_portal_caddy_image: caddy:2-alpine
deployment_portal_caddy_container: cldr-portal-caddy
# RHEL 'docker' RPM is a Podman shim (no docker.service); install Docker CE for the portal stack.
portal_docker_use_ce: true
# When compose plugin is missing, install Compose v2 binary then pip v1
portal_docker_compose_version: "2.29.2"
portal_compose_pip_fallback: true
# Command argv prefix for compose up/restart (set on host by install_portal_container_runtime)
deployment_portal_compose_argv: ['docker', 'compose']
deployment_portal_pgadmin_image: dpage/pgadmin4:8
deployment_portal_pgadmin_container: cldr-portal-pgadmin
# When true, print docker logs for pgAdmin after successful PORTAL sync (troubleshooting).
deployment_portal_pgadmin_debug_logs: false
# pgAdmin 8 validates PGADMIN_DEFAULT_EMAIL; IPA/cluster .local domains (e.g. cldrsetup.local) fail at container start.
pgadmin_default_email: "admin@{{ caddy_vhost_public_base }}"
pgadmin_default_password: "{{ postgres_password }}"
deployment_portal_inventory_groups:
  - ipaserver
  - ipa_server
  - postgres
  - db
  - cldr-mngr
  - base-masters
  - base-workers
  - ecs-masters
  - ecs-workers
# Human-readable role labels for deployment portal host inventory table
deployment_portal_inventory_group_labels:
  ipaserver: FreeIPA server
  ipa_server: FreeIPA server
  postgres: PostgreSQL (CM DB)
  db: PostgreSQL (CM DB)
  cldr-mngr: Cloudera Manager
  base-masters: CDP Runtime master
  base-workers: CDP Runtime worker
  ecs-masters: ECS master
  ecs-workers: ECS worker
deployment_portal_data_service_links: []
deployment_portal_extra_links: []
# SSH user shown in portal sample commands (defaults to ansible_user / ec2-user).
deployment_ssh_user: "{{ ansible_user | default('ec2-user') }}"
# Operator access hub on portal index (credentials table + optional SSH key downloads).
deployment_portal_expose_credentials: true
# deployment_portal_expose_ssh_keys — true (default) | false | auto
#   true: copy Ansible controller PEM/Auto-TLS keys to /downloads/ssh/ on the ops host.
#   false: do not expose SSH private keys on the portal.
#   auto: expose keys only when deployment_portal_basic_auth_enabled is true (HTTP auth on /downloads/*).
deployment_portal_expose_ssh_keys: true
# Optional explicit paths on the Ansible controller (Jenkins/laptop), not on the portal host. Empty = auto-discovery.
# EC2 PEM: sshkey.pem, ANSIBLE_PRIVATE_KEY when *.pem, deployment_portal_ssh_private_key_path_override (legacy).
deployment_portal_ssh_pem_path: ""
# Auto-TLS key: cm_private_key_path, autotls_private_key_path, id_rsa, or same PEM when only one key exists.
deployment_portal_ssh_autotls_key_path: ""
# HTTP basic auth for /downloads/* (SSH keys, operator-credentials.json). Index HTML stays unauthenticated so Ansible Tier A verify is unchanged.
deployment_portal_basic_auth_enabled: true
deployment_portal_basic_auth_user: portal
deployment_portal_basic_auth_password: "{{ postgres_password }}"
# Optional Jenkins block on portal (URL only — do not commit real Jenkins passwords to git).
deployment_portal_jenkins_url: ""
deployment_portal_jenkins_user: ""
deployment_portal_jenkins_password: ""
# Portal URL profile: auto | cloud (public + VPC) | private (bare metal / no public IP)
deployment_portal_access_profile: auto
# When profile is private, prefer cluster FQDN in links (set false to use management IP only)
deployment_portal_prefer_fqdn_urls: true
# Force private profile on cloud-style inventory (no public URLs in portal index)
deployment_portal_use_private_network_only: false

# Caddy nip.io-style hostnames (all resolve to ops host IP; Caddy reverse-proxies to backends)
# embedded_ip: portal.10-54-75-123.pvc.cloudera-labs.com  (wildcard DNS on base domain)
# classic_nipio: portal.10-54-75-123.nip.io  (works without custom DNS)
# flat: portal.pvc.cloudera-labs.com  (single A record for *.svc → ops IP)
# Lab vhosts (portal/pgadmin/grafana/prometheus/alertmanager/cadvisor/ipa.<ops-ip-dashed>.pvc…) — deployment_portal_caddy_effective.
caddy_vhost_enabled: true
caddy_vhost_public_base: pvc.cloudera-labs.com
caddy_vhost_dns_mode: embedded_ip
# Register nip.io-style vhosts for private IP as well (in-VPC browsers); public slug for external/internet
caddy_vhost_register_private_ip: true
caddy_vhost_service_names:
  portal: portal
  pgadmin: pgadmin
  grafana: grafana
  prometheus: prometheus
  alertmanager: alertmanager
  cadvisor: cadvisor
  ipa: ipa

monitoring_stack_enabled: true
monitoring_config_dir: /opt/cldr-monitoring
monitoring_prometheus_image: prom/prometheus:v2.54.1
monitoring_prometheus_container: cldr-mon-prometheus
monitoring_grafana_image: grafana/grafana:11.2.0
monitoring_grafana_container: cldr-mon-grafana
monitoring_grafana_docker_service: grafana
monitoring_prometheus_docker_service: prometheus
monitoring_alertmanager_docker_service: alertmanager
monitoring_alertmanager_image: prom/alertmanager:v0.27.0
monitoring_alertmanager_container: cldr-mon-alertmanager
monitoring_cadvisor_image: gcr.io/cadvisor/cadvisor:v0.49.1
monitoring_cadvisor_container: cldr-mon-cadvisor
monitoring_cadvisor_docker_service: cadvisor
monitoring_cadvisor_host_port: 8089
monitoring_grafana_host_port: 3000
monitoring_prometheus_host_port: 9090
monitoring_alertmanager_host_port: 9093
monitoring_grafana_admin_user: admin
monitoring_grafana_admin_password: "{{ postgres_password }}"
monitoring_prometheus_extra_targets: []


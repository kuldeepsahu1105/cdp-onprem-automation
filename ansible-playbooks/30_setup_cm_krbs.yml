### ansible-playbook -i inventory.ini 30_setup_cm_krbs.yml
# Run after 27_setup_cm_autotls.yml, 28_setup_cm_cms.yml, and 29_setup_cm_ldap.yml.
---
- import_playbook: ensure_collections.yml

- name: Ensure FreeIPA KDC services are running before CM Kerberos setup
  hosts: ipaserver
  become: yes
  gather_facts: no
  tasks:
    - name: Run CM security ensure freeipa kdc tasks
      ansible.builtin.import_role:
        name: cm_security
        tasks_from: ensure_freeipa_kdc

- name: Enable Kerberos (KDC) integration in Cloudera Manager
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Run CM security configure kerberos tasks
      ansible.builtin.import_role:
        name: cm_security
        tasks_from: configure_kerberos

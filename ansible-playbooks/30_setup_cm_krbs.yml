### ansible-playbook -i inventory.ini 30_setup_cm_krbs.yml
# Run after 27_setup_cm_autotls.yml, 28_setup_cm_cms.yml, and 29_setup_cm_ldap.yml.
---
- import_playbook: ensure_collections.yml

- name: Ensure FreeIPA KDC services are running before CM Kerberos setup
  hosts: ipaserver
  become: yes
  gather_facts: no
  tasks:
    - name: Skip when identity provider is not FreeIPA
      ansible.builtin.meta: end_host
      when: identity_provider_effective != 'freeipa'

    - name: Ensure IPA KDC services are active
      ansible.builtin.import_tasks: common_tasks/ensure_ipa_kdc_services.yml

    - name: Configure FreeIPA KDC encryption types (AES)
      ansible.builtin.import_tasks: common_tasks/configure_ipa_krb_enc_types.yml

- name: Enable Kerberos (KDC) integration in Cloudera Manager
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Clear CM restart flag for this play
      ansible.builtin.set_fact:
        cm_restart_after_config_change: false

    - name: Kerberos — prepare CM API and KDC admin principal
      ansible.builtin.import_tasks: common_tasks/resolve_cm_krb_api_url.yml

    - name: Kerberos — preflight KDC reachability from controller
      ansible.builtin.import_tasks: common_tasks/preflight_kdc_reachable.yml

    - name: Print Kerberos integration targets
      ansible.builtin.debug:
        msg:
          - "Identity provider: {{ identity_provider_effective }}"
          - "CM API (Kerberos REST): {{ cm_krb_api_url }}"
          - "CM host: {{ cm_host }}"
          - "KDC host: {{ kdc_host }}"
          - "Kerberos realm: {{ cluster_realm }}"
          - "KDC type: {{ krb5_kdc_type }}"
          - "KDC admin principal (import): {{ cm_krb_kdc_admin_principal }}"
          - "CM KRB_ENC_TYPES: {{ krb5_enc_types }}"

    - name: Configure Kerberos via Cloudera Manager REST API
      ansible.builtin.import_tasks: common_tasks/configure_cm_kerberos_api.yml

    - name: Kerberos — identify this KDC account-manager credential set
      ansible.builtin.set_fact:
        cm_krb_credentials_marker_effective_path: >-
          {{
            cm_krb_credentials_marker_path
            ~ '-'
            ~ ((cm_krb_kdc_admin_principal ~ '|' ~ cluster_realm ~ '|' ~ kdc_host) | hash('sha256'))
          }}

    - name: Kerberos — check successful credential-import marker
      ansible.builtin.stat:
        path: "{{ cm_krb_credentials_marker_effective_path }}"
      delegate_to: "{{ cm_manager_inventory_host }}"
      become: true
      register: cm_krb_credentials_marker

    - name: Kerberos — determine whether KDC account-manager credentials are current
      ansible.builtin.set_fact:
        cm_krb_credentials_current: >-
          {{
            cm_krb_credentials_marker.stat.exists | default(false) | bool
            and not (cm_kerberos_config_changed | bool)
            and not (cm_krb_force_credential_import | bool)
          }}

    - name: Kerberos — report healthy matching KDC integration
      ansible.builtin.debug:
        msg: >-
          KDC preflight succeeded, CM Kerberos settings match, and the KDC account-manager
          credentials were previously imported successfully; skipping credential import and restart.
      when:
        - cm_krb_credentials_current | bool
        - not (cm_kerberos_config_changed | bool)

    - name: Kerberos — print existing Cloudera Manager access URLs
      ansible.builtin.import_tasks: common_tasks/print_cm_urls.yml
      when:
        - cm_krb_credentials_current | bool
        - not (cm_kerberos_config_changed | bool)

    - name: Kerberos — finish healthy matching no-op play
      ansible.builtin.meta: end_play
      when:
        - cm_krb_credentials_current | bool
        - not (cm_kerberos_config_changed | bool)

    - name: Configure Active Directory-specific Kerberos settings
      ansible.builtin.uri:
        url: "{{ cm_krb_api_url }}/cm/kerberosConfig"
        method: PUT
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        body_format: json
        body:
          items:
            - name: AD_DELETE_ON_REGENERATE
              value: "{{ krb5_ad_delete_on_regenerate | default(true) | lower }}"
            - name: AD_KDC_DOMAIN
              value: "{{ krb5_ad_suffix }}"
        status_code: [200, 204]
        follow_redirects: none
      delegate_to: "{{ cm_api_uri_delegate_to }}"
      register: cm_kerberos_ad_config
      when:
        - identity_provider_effective == 'ad'
        - cm_kerberos_config_changed | default(false) | bool
      changed_when: true

    - name: Kerberos — include AD configuration in restart decision
      ansible.builtin.set_fact:
        cm_restart_after_config_change: true
      when:
        - cm_kerberos_ad_config is defined
        - cm_kerberos_ad_config is changed

    - name: Restart Cloudera Manager after Kerberos /cm/config before credential import
      ansible.builtin.import_tasks: common_tasks/apply_cm_restart_after_config.yml
      when: cm_restart_after_config_change | default(false) | bool

    - name: Kerberos — clear restart flag after pre-import CM restart
      ansible.builtin.set_fact:
        cm_restart_after_config_change: false
      when: cm_restart_after_config_change | default(false) | bool

    - name: Kerberos — require KDC admin password before credential import
      ansible.builtin.assert:
        that:
          - krb5_kdc_admin_password is defined
          - (krb5_kdc_admin_password | string | length) > 0
        fail_msg: >-
          krb5_kdc_admin_password is empty (FreeIPA: ipaadmin_password; AD: ad_kdc_admin_password).
          CM cannot import KDC admin credentials without a password — set via group_vars or Jenkins ANSIBLE_GROUP_VARS_YAML.
      when: not (cm_krb_credentials_current | bool)

    - name: Import KDC admin credentials into Cloudera Manager
      ansible.builtin.uri:
        url: >-
          {{ cm_krb_api_url }}/cm/commands/importAdminCredentials?username={{
          cm_krb_kdc_admin_principal | urlencode }}&password={{
          krb5_kdc_admin_password | urlencode }}
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200, 201]
        follow_redirects: none
      delegate_to: "{{ cm_api_uri_delegate_to }}"
      register: kdc_import_result
      changed_when: true
      no_log: true
      when: not (cm_krb_credentials_current | bool)

    - name: Require importAdminCredentials command id
      ansible.builtin.assert:
        that:
          - kdc_import_result.json.id is defined
        fail_msg: >-
          importAdminCredentials returned HTTP {{ kdc_import_result.status | default('unknown') }}
          without an ApiCommand id. Check the KDC principal, password, and
          /var/log/cloudera-scm-server/cloudera-scm-server.log.
      when: not (cm_krb_credentials_current | bool)

    - name: Wait for importAdminCredentials command
      ansible.builtin.import_tasks: common_tasks/wait_cm_api_command.yml
      vars:
        cm_api_command_id: "{{ kdc_import_result.json.id }}"
        cm_api_command_allow_already_exists: true
      when:
        - not (cm_krb_credentials_current | bool)
        - kdc_import_result.json.id is defined

    - name: Kerberos — confirm importAdminCredentials command success
      ansible.builtin.set_fact:
        cm_krb_import_confirmed: >-
          {{
            cm_api_command_poll.json.success | default(false) | bool
            or (
              'already exists' in (
                cm_api_command_poll.json.resultMessage
                | default(cm_api_command_poll.json.result_message | default(''))
                | lower
              )
            )
          }}
      when:
        - not (cm_krb_credentials_current | bool)
        - kdc_import_result.json.id is defined

    - name: Kerberos — require confirmed account-manager credential import
      ansible.builtin.assert:
        that:
          - cm_krb_import_confirmed | default(false) | bool
        fail_msg: >-
          importAdminCredentials command {{ kdc_import_result.json.id | default('unknown') }}
          completed without a confirmed successful result.
      when: not (cm_krb_credentials_current | bool)

    - name: Kerberos — record successful KDC account-manager credential import
      ansible.builtin.copy:
        dest: "{{ cm_krb_credentials_marker_effective_path }}"
        owner: root
        group: root
        mode: "0600"
        content: |
          principal={{ cm_krb_kdc_admin_principal }}
          realm={{ cluster_realm }}
          kdc={{ kdc_host }}
      delegate_to: "{{ cm_manager_inventory_host }}"
      become: true
      when:
        - not (cm_krb_credentials_current | bool)
        - cm_krb_import_confirmed | default(false) | bool

    - name: Print KDC credential import result
      ansible.builtin.debug:
        msg: >-
          KDC credential import submitted (command id={{ kdc_import_result.json.id | default('n/a') }},
          HTTP {{ kdc_import_result.status | default('skipped') }})
      when:
        - kdc_import_result is defined
        - kdc_import_result is changed

    - name: Kerberos — confirm pre-cluster KDC integration
      ansible.builtin.assert:
        that:
          - >-
            cm_krb_credentials_marker.stat.exists | default(false) | bool
            or cm_krb_import_confirmed | default(false) | bool
        success_msg: >-
          KDC integration is ready: the KDC is reachable, CM settings match, and account-manager
          credentials are imported. A managed cluster can still report kerberized=false until
          cluster creation and Kerberos enablement.
        fail_msg: KDC account-manager credential import was not confirmed.

    - name: Kerberos — print Cloudera Manager access URLs
      ansible.builtin.import_tasks: common_tasks/print_cm_urls.yml

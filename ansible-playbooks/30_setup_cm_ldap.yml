### ansible-playbook -i inventory.ini 30_setup_cm_ldap.yml
---
- import_playbook: 00_ensure_collections.yml

- name: Configure LDAP authentication in Cloudera Manager (FreeIPA or Active Directory)
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Clear CM restart flag for this play
      ansible.builtin.set_fact:
        cm_restart_after_config_change: false

    - name: Skip LDAP configuration when disabled
      ansible.builtin.meta: end_play
      when: not cm_ldap_enabled | default(false)

    - name: Set up Cloudera Manager API URL
      ansible.builtin.import_tasks: common_tasks/set_cm_api_url.yml

    - name: Print LDAP integration targets
      ansible.builtin.debug:
        msg:
          - "Identity provider: {{ identity_provider_effective }}"
          - "LDAP URL: {{ cm_ldap_url }}"
          - "LDAP bind DN: {{ cm_ldap_bind_dn }}"
          - "User search base: {{ cm_ldap_user_search_base }}"
          - "User search filter: {{ cm_ldap_user_search_filter }}"

    - name: Configure Cloudera Manager LDAP settings (REST API)
      ansible.builtin.import_tasks: common_tasks/configure_cm_ldap_api.yml

    - name: Restart Cloudera Manager after LDAP configuration change
      ansible.builtin.import_tasks: common_tasks/apply_cm_restart_after_ldap.yml
      when: cm_restart_after_config_change | default(false) | bool

    - name: Print LDAP configuration result
      ansible.builtin.debug:
        msg: LDAP authentication configured in Cloudera Manager (CM restarted when settings changed).
      when: cm_ldap_result is defined and cm_ldap_result is changed

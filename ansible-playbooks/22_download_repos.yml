### ansible-playbook -i inventory.ini 22_download_repos.yml
#
# Configure CM/CDH repositories:
#   cm_repo_source=public   — point hosts at archive.cloudera.com/p/ (default)
#   cm_repo_source=internal — mirror to cldr-mngr web server (RPM on RHEL, apt on Ubuntu/Debian)
---
- import_playbook: ensure_collections.yml

- name: Validate CM repository configuration
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Validate repository configuration
      ansible.builtin.import_role:
        name: cm_install
        tasks_from: validate_repository_configuration

- name: Mirror Cloudera Manager and CDH to internal web server
  hosts: cldr-mngr
  become: yes
  tasks:
    - name: Mirror internal repositories
      ansible.builtin.import_role:
        name: cm_install
        tasks_from: mirror_internal_repositories

- name: Configure cloudera-manager.repo on all cluster hosts
  hosts: all
  become: yes
  tasks:
    - name: Configure repositories on hosts
      ansible.builtin.import_role:
        name: cm_install
        tasks_from: configure_repositories_on_hosts

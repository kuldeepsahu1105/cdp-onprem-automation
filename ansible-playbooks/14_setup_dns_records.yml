### ansible-playbook -i inventory.ini 14_setup_dns_records.yml
# vars:
#   ipaadmin_password: "vmware123"
#   ipaadmin_principal: "admin"
#   ipaserver_domain: cldr.internal.arpa

---
- import_playbook: ensure_collections.yml

- name: Skip FreeIPA DNS records when Active Directory is detected
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: End playbook for Active Directory deployments
      ansible.builtin.meta: end_play
      when: identity_provider_effective == 'ad'

- name: Manage FreeIPA DNS Zones and Records
  hosts: ipaserver
  gather_facts: yes
  become: yes
  environment:
    KRB5CCNAME: "FILE:{{ ipa_kerberos_ccache_path }}"
  tasks:
    - name: Protect existing FreeIPA deployments from domain drift
      ansible.builtin.import_tasks: common_tasks/assert_existing_ipa_domain.yml

    - name: Ensure Kerberos ticket and show klist for IPA CLI
      ansible.builtin.import_tasks: common_tasks/ensure_ipa_kerberos_ticket_with_klist.yml

    - name: Validate IPA Services
      ansible.builtin.command: ipactl status
      register: ipa_status
      changed_when: false
      failed_when: "'The ipactl command was successful' not in ipa_status.stderr"
      environment:
        KRB5CCNAME: "FILE:{{ ipa_kerberos_ccache_path }}"

    - name: Ensure FreeIPA DNS module Python dependency
      ansible.builtin.package:
        name: python3-netaddr
        state: present

    - name: Extract Reverse DNS Zone from IP Address
      set_fact:
        reverse_dns_zone: "{{ hostvars[inventory_hostname]['ansible_default_ipv4']['network'].split('.')[1] }}.{{ hostvars[inventory_hostname]['ansible_default_ipv4']['network'].split('.')[0] }}.in-addr.arpa."

    - name: Print reverse_dns_zone name
      debug:
        msg: "Reverse DNS Zone Name: {{ reverse_dns_zone }}"

    - name: Ensure Reverse DNS Zone is Present
      freeipa.ansible_freeipa.ipadnszone:
        ipaadmin_password: "{{ ipaadmin_password }}"
        name: "{{ reverse_dns_zone }}"
        state: present

    - name: Gather facts for all hosts
      ansible.builtin.setup:
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups['all'] }}"

    - name: Debug ansible_default_ipv4 before using it
      debug:
        msg: "{{ item }} ansible_default_ipv4: {{ hostvars[item].ansible_default_ipv4 | default('MISSING') }}"
      loop: "{{ groups['all'] }}"

    - name: Validate requested stale IPA DNS domain cleanup
      ansible.builtin.assert:
        that:
          - ipa_dns_cleanup_stale_domain_confirm | bool
          - ipa_dns_cleanup_stale_domain | trim | lower != ipaserver_domain | trim | lower
          - ipa_dns_cleanup_stale_domain | trim | length > 0
        fail_msg: >-
          Refusing stale IPA DNS cleanup. Set ipa_dns_cleanup_stale_domain to
          the incorrect domain, set ipa_dns_cleanup_stale_domain_confirm=true,
          and ensure it differs from the live ipaserver_domain.
      when: ipa_dns_cleanup_stale_domain | default('') | trim | length > 0

    - name: Remove stale PTR values for inventory hosts
      freeipa.ansible_freeipa.ipadnsrecord:
        ipaadmin_password: "{{ ipaadmin_password }}"
        name: "{{ hostvars[item]['ansible_default_ipv4']['address'].split('.')[3] }}.{{ hostvars[item]['ansible_default_ipv4']['address'].split('.')[2] }}"
        zone_name: "{{ reverse_dns_zone }}"
        record_type: "PTR"
        record_value: "{{ hostvars[item]['cldr_hostname'] }}.{{ ipa_dns_cleanup_stale_domain | trim | lower }}."
        state: absent
      loop: "{{ groups['all'] }}"
      when:
        - ipa_dns_cleanup_stale_domain | default('') | trim | length > 0
        - ipa_dns_cleanup_stale_domain_confirm | bool

    - name: Check whether stale forward DNS zone exists
      ansible.builtin.command:
        argv:
          - ipa
          - dnszone-show
          - "{{ ipa_dns_cleanup_stale_domain | trim | lower }}"
      register: ipa_dns_cleanup_stale_zone_probe
      changed_when: false
      failed_when: false
      environment:
        KRB5CCNAME: "FILE:{{ ipa_kerberos_ccache_path }}"
      when:
        - ipa_dns_cleanup_stale_domain | default('') | trim | length > 0
        - ipa_dns_cleanup_stale_domain_confirm | bool

    - name: Remove stale forward A values for inventory hosts
      freeipa.ansible_freeipa.ipadnsrecord:
        ipaadmin_password: "{{ ipaadmin_password }}"
        name: "{{ hostvars[item]['cldr_hostname'] }}"
        zone_name: "{{ ipa_dns_cleanup_stale_domain | trim | lower }}"
        record_type: "A"
        record_value: "{{ hostvars[item]['ansible_default_ipv4']['address'] }}"
        state: absent
      loop: "{{ groups['all'] }}"
      when:
        - ipa_dns_cleanup_stale_domain | default('') | trim | length > 0
        - ipa_dns_cleanup_stale_domain_confirm | bool
        - ipa_dns_cleanup_stale_zone_probe.rc | default(1) == 0

    - name: Add forward A records for inventory hosts
      freeipa.ansible_freeipa.ipadnsrecord:
        ipaadmin_password: "{{ ipaadmin_password }}"
        name: "{{ hostvars[item]['cldr_hostname'] }}"
        zone_name: "{{ ipaserver_domain }}"
        record_type: A
        record_value: >-
          {{
            hostvars[item].private_ip
            | default(hostvars[item].ansible_default_ipv4.address, true)
          }}
        state: present
      loop: "{{ groups['all'] }}"
      when:
        - hostvars[item].cldr_hostname | default('') | length > 0
        - >-
          hostvars[item].private_ip | default(
            hostvars[item].ansible_default_ipv4.address | default(''),
            true
          ) | length > 0

    - name: Add PTR Records Dynamically
      freeipa.ansible_freeipa.ipadnsrecord:
        ipaadmin_password: "{{ ipaadmin_password }}"
        name: "{{ hostvars[item]['ansible_default_ipv4']['address'].split('.')[3] }}.{{ hostvars[item]['ansible_default_ipv4']['address'].split('.')[2] }}"
        zone_name: "{{ reverse_dns_zone }}"
        record_type: "PTR"
        record_value: "{{ hostvars[item]['cldr_hostname'] }}.{{ ipaserver_domain }}."
        state: present
      loop: "{{ groups['all'] }}"

    - name: Refresh Kerberos ticket and show klist before IPA DNS verification
      ansible.builtin.import_tasks: common_tasks/ensure_ipa_kerberos_ticket_with_klist.yml

    - name: Probe IPA CLI with Kerberos FILE ccache before DNS verification
      ansible.builtin.import_tasks: common_tasks/verify_ipa_cli_krb5_ccache.yml

    - name: Verify Created DNS Records in FreeIPA
      ansible.builtin.include_tasks: common_tasks/run_ipa_cli.yml
      vars:
        ipa_cli_task_name: Verify Created DNS Records in FreeIPA
        ipa_cli_argv:
          - dnsrecord-find
          - "{{ reverse_dns_zone }}"

    - name: Debug FreeIPA DNS Records
      debug:
        msg: "{{ ipa_cli_run.stdout_lines }}"

    - name: Verify A Record using dig
      shell: dig $(hostname -f) A | grep -A2 ANSWER
      register: dig_result
      changed_when: false

    - name: Debug dig Output
      debug:
        msg: "{{ dig_result.stdout.replace('\t', '    ').split('\n') }}"

    - name: Verify reverse lookup using dig
      shell: dig -x $(hostname -i) | grep -A2 ANSWER
      register: dig_result
      changed_when: false

    - name: Debug dig Output
      debug:
        msg: "{{ dig_result.stdout.replace('\t', '    ').split('\n') }}"

    - name: Validate DNS resolution using nslookup
      shell: "nslookup $(hostname -f)"
      register: nslookup_output
      changed_when: false

    - name: Display nslookup output for DNS
      debug:
        msg: "{{ nslookup_output.stdout.replace('\t', '    ').split('\n') }}"

    - name: Validate IP resolution using nslookup
      shell: "nslookup $(hostname -i)"
      register: nslookup_output
      changed_when: false

    - name: Display nslookup output for IP
      debug:
        msg: "{{ nslookup_output.stdout.replace('\t', '    ').split('\n') }}"

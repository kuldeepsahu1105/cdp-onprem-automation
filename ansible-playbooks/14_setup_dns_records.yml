### ansible-playbook -i inventory.ini 14_setup_dns_records.yml
# vars:
#   ipaadmin_password: "vmware123"
#   ipaadmin_principal: "admin"
#   ipaserver_domain: cldrsetup.local

---
- import_playbook: ensure_collections.yml

- name: Skip FreeIPA DNS records when Active Directory is detected
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Skip freeipa dns for ad
      ansible.builtin.import_role:
        name: identity
        tasks_from: skip_freeipa_dns_for_ad

- name: Manage FreeIPA DNS Zones and Records
  hosts: ipaserver
  gather_facts: yes
  become: yes
  environment:
    KRB5CCNAME: "FILE:{{ ipa_kerberos_ccache_path }}"
  tasks:
    - name: Freeipa dns records
      ansible.builtin.import_role:
        name: identity
        tasks_from: freeipa_dns_records

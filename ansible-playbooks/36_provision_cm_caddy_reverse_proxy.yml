### ansible-playbook -i inventory.ini 36_provision_cm_caddy_reverse_proxy.yml
# Cloudera Labs openshift alignment: after CM server listens on :7180/:7183, install/reload the
# Caddy CM vhost on the reverse-proxy (ops) host, then wait until the proxy answers.
# Does not run full 35_refresh (no Tier B URL verify). frontend_url is applied in 26_setup_cm_license.yml.
---
- import_playbook: 00_ensure_collections.yml

- name: Build Caddy CM vhost facts (localhost)
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Resolve deployment portal Caddy gate (monitoring_stack_enabled)
      ansible.builtin.import_tasks: common_tasks/resolve_deployment_portal_caddy_enabled.yml

    - name: Skip when Caddy reverse proxy stack is disabled
      ansible.builtin.meta: end_play
      when: not (deployment_portal_caddy_effective | default(false) | bool)

    - name: Build deployment portal context from inventory
      ansible.builtin.import_tasks: common_tasks/build_deployment_portal_facts.yml

- name: Provision Cloudera Manager Caddy reverse proxy on ops host
  hosts: "{{ hostvars['localhost']['deployment_portal_host_group_effective'] }}"
  become: true
  gather_facts: true
  tasks:
    - name: Skip when Caddy reverse proxy stack is disabled
      ansible.builtin.meta: end_host
      when: not (hostvars['localhost'].deployment_portal_caddy_effective | default(false) | bool)

    - name: Load portal context from localhost
      ansible.builtin.import_tasks: common_tasks/deployment_portal_load_host_facts.yml

    - name: Require portal bootstrap (docker-compose present)
      ansible.builtin.stat:
        path: "{{ deployment_portal_config_dir }}/docker-compose.yml"
      register: portal_compose_stat

    - name: Fail when PORTAL stage did not run
      ansible.builtin.fail:
        msg: >-
          Deployment portal not installed on {{ inventory_hostname }}.
          Run 10_setup_deployment_portal.yml or Jenkins PORTAL before CM_INSTALL.
      when: not portal_compose_stat.stat.exists

    - name: Install or update Cloudera Manager reverse proxy entry in Caddy
      ansible.builtin.import_tasks: common_tasks/sync_deployment_portal_caddy_cm.yml

    - name: Print CM Caddy reverse proxy target
      ansible.builtin.debug:
        msg:
          - "CM Caddy vhost: {{ caddy_vhost_urls_external.cm.url | default('') }}"
          - "CM upstream: {{ deployment_portal_cm_upstream_host }}:{{ cm_http_port if not (autotls_enabled | default(false) | bool) else cm_https_port }} (Host {{ deployment_portal_cm_fqdn }})"

- name: Wait for Cloudera Manager via Caddy CM vhost (controller)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Skip when Caddy CM URL not defined
      ansible.builtin.meta: end_play
      when: >
        not (hostvars['localhost'].deployment_portal_caddy_effective | default(false) | bool)
        or (hostvars['localhost'].cm_caddy_public_url | default('') | length == 0)

    - name: Wait until CM API responds via Caddy CM vhost (labs proxy probe)
      ansible.builtin.uri:
        url: "{{ hostvars['localhost'].cm_caddy_public_url | trim | regex_replace('/+$', '') }}/api/version"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: false
        status_code: [200, 301, 303, 401, 403]
        timeout: 20
      register: cm_caddy_proxy_wait
      until: cm_caddy_proxy_wait is succeeded
      retries: "{{ cm_caddy_proxy_wait_retries | default(36) | int }}"
      delay: "{{ cm_caddy_proxy_wait_delay | default(5) | int }}"

    - name: CM reachable through Caddy reverse proxy
      ansible.builtin.debug:
        msg: >-
          Cloudera Manager API reachable via Caddy at
          {{ hostvars['localhost'].cm_caddy_public_url }} (status {{ cm_caddy_proxy_wait.status | default('n/a') }}).

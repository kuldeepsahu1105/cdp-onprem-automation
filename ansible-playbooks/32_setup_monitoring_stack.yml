### ansible-playbook -i inventory.ini 32_setup_monitoring_stack.yml
#
# Prometheus, Grafana, Alertmanager, and cAdvisor (requires 10_setup_deployment_portal.yml first).
---
- import_playbook: ensure_collections.yml

- name: Build deployment portal facts for monitoring URLs
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Run monitoring build portal context tasks
      ansible.builtin.import_role:
        name: monitoring
        tasks_from: build_portal_context

- name: Deploy monitoring stack and update Caddy routes
  hosts: deployment_portal_runtime
  become: true
  gather_facts: true
  vars:
    monitoring_stack_enabled: true
    deployment_portal_verify_milestones:
      - portal
      - ipa
      - monitoring
  tasks:
    - name: Run monitoring deploy stack tasks
      ansible.builtin.import_role:
        name: monitoring
        tasks_from: deploy_stack

### ansible-playbook -i inventory.ini 19_setup_wildcard.yml
# vars:
#   ipaserver_domain: cldrsetup.local
#   ipaadmin_password: "vmware123"
#   wildcard_dns_record: "*.apps"
#   postgres_jdbc_version: "42.7.5"

---
- import_playbook: ensure_collections.yml

- name: Skip FreeIPA wildcard DNS when Active Directory is detected
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Skip freeipa wildcard for ad
      ansible.builtin.import_role:
        name: identity
        tasks_from: skip_freeipa_wildcard_for_ad

- name: Configure wildcard DNS record
  hosts: ipaserver
  become: true
  environment:
    KRB5CCNAME: "FILE:{{ ipa_kerberos_ccache_path }}"

  tasks:
    - name: Freeipa wildcard dns
      ansible.builtin.import_role:
        name: identity
        tasks_from: freeipa_wildcard_dns

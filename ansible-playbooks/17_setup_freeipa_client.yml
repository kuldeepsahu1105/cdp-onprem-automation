### ansible-playbook -i inventory.ini 17_setup_freeipa_client.yml
# vars:
#   ipaserver_domain: cldrsetup.local
#   ipaserver_realm: "{{ ipaserver_domain | upper }}"
#   ipaadmin_principal: "admin"
#   ipaadmin_password: "vmware123"

---
- import_playbook: ensure_collections.yml

- name: Install FreeIPA client packages before DNS cutover
  hosts: all:!ipaserver
  become: yes
  tasks:
    - name: Legacy freeipa client packages
      ansible.builtin.import_role:
        name: identity
        tasks_from: legacy_freeipa_client_packages

- name: Update /etc/resolv.conf on all hosts
  hosts: all
  become: yes
  tasks:
    - name: Legacy freeipa dns cutover
      ansible.builtin.import_role:
        name: identity
        tasks_from: legacy_freeipa_dns_cutover

- name: Enroll nodes as IPA clients
  hosts: all:!ipaserver
  become: true
  vars_files:
    - group_vars/all.yml

  tasks:
    - name: Legacy freeipa client enrollment
      ansible.builtin.import_role:
        name: identity
        tasks_from: legacy_freeipa_client_enrollment

### ansible-playbook -i inventory.ini 37_run_ipaserver_ec2_startstop.yml
# Run EC2 start/stop/describe on ipaserver via deployed script.
# Extra vars: ec2_startstop_operation (start|stop|describe), ec2_startstop_groups (list or CSV),
#             ec2_startstop_environment (optional; default deployment_name_prefix),
#             ec2_startstop_install_if_missing (default true)
---
- import_playbook: 00_ensure_collections.yml

- name: Skip when no ipaserver in inventory
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: End play when ipaserver group is empty
      ansible.builtin.meta: end_play
      when: groups['ipaserver'] | default([]) | length == 0

- name: Ensure EC2 start/stop script is present
  ansible.builtin.import_playbook: 36_install_ipaserver_ec2_startstop.yml
  when: ec2_startstop_deploy_script | default(true) | bool

- name: Execute EC2 start/stop operation on ipaserver
  hosts: ipaserver
  become: true
  vars_files:
    - group_vars/all.yml
  vars:
    ec2_startstop_default_environment: "{{ deployment_name_prefix | default('', true) | trim }}"
    _ec2_startstop_groups_list: >-
      {{
        ec2_startstop_groups
        if (ec2_startstop_groups is sequence and ec2_startstop_groups is not string)
        else (ec2_startstop_groups | default('', true) | string).split(',')
      }}
    _ec2_startstop_groups_clean: "{{ _ec2_startstop_groups_list | map('trim') | reject('equalto', '') | list }}"
    _ec2_startstop_env: "{{ ec2_startstop_environment | default(ec2_startstop_default_environment, true) | trim }}"
  tasks:
    - name: Validate operation
      ansible.builtin.assert:
        that:
          - ec2_startstop_operation | default('') | lower in ['start', 'stop', 'describe']
        fail_msg: "Set ec2_startstop_operation to start, stop, or describe."
      when: ec2_startstop_run_script | default(true) | bool

    - name: Validate groups for start/stop
      ansible.builtin.assert:
        that:
          - _ec2_startstop_groups_clean | length > 0
        fail_msg: "Set ec2_startstop_groups (comma-separated Terraform Group tag values) for start/stop."
      when:
        - ec2_startstop_run_script | default(true) | bool
        - ec2_startstop_operation | lower != 'describe'

    - name: Build script argument list
      ansible.builtin.set_fact:
        ec2_startstop_argv: >-
          {{
            [ec2_startstop_script_path, ec2_startstop_operation | lower]
            + ([_ec2_startstop_env] if _ec2_startstop_env | length > 0 else [])
            + _ec2_startstop_groups_clean
          }}
      when: ec2_startstop_run_script | default(true) | bool

    - name: Run EC2 start/stop script on ipaserver
      ansible.builtin.command:
        argv: "{{ ec2_startstop_argv }}"
      environment: >-
        {{
          {
            'EC2_STARTSTOP_NON_INTERACTIVE': (ec2_startstop_non_interactive | default('1') | string),
            'JENKINS_URL': (lookup('env', 'JENKINS_URL') | default('', true))
          }
          | combine(
              {'AWS_DEFAULT_REGION': (aws_region | trim)}
              if (aws_region | default('', true) | trim | length > 0)
              else {}
            )
        }}
      register: ec2_startstop_run
      changed_when: ec2_startstop_operation | lower in ['start', 'stop']
      when: ec2_startstop_run_script | default(true) | bool

    - name: Show script output
      ansible.builtin.debug:
        msg: "{{ ec2_startstop_run.stdout_lines }}"
      when: ec2_startstop_run_script | default(true) | bool

    - name: Deploy-only (run skipped)
      ansible.builtin.debug:
        msg: "ec2_startstop_run_script=false — script deploy finished; EC2 operation not executed."
      when: not (ec2_startstop_run_script | default(true) | bool)

### ansible-playbook -i inventory.ini 25_verify_cm.yml
# vars:
#   cm_port: 7180
#   cm_admin_user: "admin"
#   cm_admin_pass: "admin"
# CM API reachability: unauthenticated GET /api/version may return 401 — that still means the API is up
# (see common_tasks/set_cm_api_url.yml and .cursor/LEARNINGS.md).

---
- import_playbook: 00_ensure_collections.yml

- name: Verify and perform sanity checks on cloudera-manager server
  hosts: localhost
  gather_facts: no
  tasks:
    - name: CM API — set connection context
      ansible.builtin.import_tasks: common_tasks/resolve_cm_api_probe_context.yml

    - name: Align Cloudera Manager admin password with group_vars after CM server start
      ansible.builtin.import_tasks: common_tasks/ensure_cm_admin_password.yml

    - name: Set up Cloudera Manager API URL
      ansible.builtin.import_tasks: common_tasks/set_cm_api_url.yml
      become: false

    - name: Authenticate with Cloudera Manager API
      ansible.builtin.uri:
        url: "{{ cm_api_url }}/cm/version"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        status_code: [200, 301, 303]
        validate_certs: no
      register: cm_version
      delegate_to: "{{ cm_api_uri_delegate_to if (cm_api_uri_delegate_to | default('') | length > 0) else omit }}"

    # - name: Print Cloudera Manager API Version Response
    #   ansible.builtin.debug:
    #     msg: "Cloudera Manager API Version: {{ cm_version.json }}"

    - name: Print Cloudera Manager API Version and Build Timestamp
      ansible.builtin.debug:
        msg: "Cloudera Manager Version: {{ cm_version.json.version }}, Build Timestamp: {{ cm_version.json.buildTimestamp }}"

    - name: Require Cloudera SCM Server active on cldr-mngr (systemctl exit code 0 only)
      ansible.builtin.command: systemctl is-active cloudera-scm-server
      register: scm_server_status
      delegate_to: cldr-mngr
      become: true
      changed_when: false
      failed_when: scm_server_status.rc | int != 0

    - name: Print Cloudera SCM Server Service Status
      ansible.builtin.debug:
        msg: "Cloudera SCM Server is {{ scm_server_status.stdout }} (systemctl rc=0)."

    - name: Check Cloudera Manager Service status
      ansible.builtin.shell: systemctl status cloudera-scm-server --no-pager
      delegate_to: cldr-mngr
      register: cm_status_output
      changed_when: false

    - name: Display Cloudera Manager Service status
      ansible.builtin.debug:
        msg: "{{ cm_status_output.stdout }}"

    - name: Check Cloudera Management Services Status
      ansible.builtin.uri:
        url: "{{ cm_api_url }}/cm/service"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        status_code: [200, 301, 303]
        validate_certs: no
      register: cm_service_status
      failed_when: false
      delegate_to: "{{ cm_api_uri_delegate_to if (cm_api_uri_delegate_to | default('') | length > 0) else omit }}"

    - name: Print Cloudera Management Services Status
      ansible.builtin.debug:
        msg: >
          {% if cm_service_status.status == 200 %}
            {{ cm_service_status.json.displayName }}:
            State={{ cm_service_status.json.serviceState }},
            Health={{ cm_service_status.json.healthSummary }},
            Entity={{ cm_service_status.json.entityStatus }},
            Status Code={{ cm_service_status.status }}
          {% else %}
            CM Service not available:
            Message={{ cm_service_status.json.message | default('Unknown error') }},
            Status Code={{ cm_service_status.status }}
          {% endif %}

    - name: List available clusters in Cloudera Manager
      ansible.builtin.uri:
        url: "{{ cm_api_url }}/clusters"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        status_code: [200, 301, 303]
        validate_certs: no
      register: cm_clusters
      delegate_to: "{{ cm_api_uri_delegate_to if (cm_api_uri_delegate_to | default('') | length > 0) else omit }}"

    - name: Print Available Clusters
      ansible.builtin.debug:
        msg: "Available Clusters: {{ cm_clusters.json['items'] }}"
        # msg: "Available Clusters: {{ cm_clusters.json.items | map(attribute='name') | list }}"

    - name: Verify CM UI URLs on cldr-mngr (and optional external when portal disabled)
      ansible.builtin.import_tasks: common_tasks/verify_cm_tiered_urls.yml


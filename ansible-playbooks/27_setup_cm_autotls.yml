### ansible-playbook -i inventory.ini 27_setup_cm_autotls.yml
# Standalone (no wrapper): cd ansible-playbooks && ANSIBLE_PRIVATE_KEY=/path/to/key ansible-playbook -i inventory.ini 27_setup_cm_autotls.yml
---
- import_playbook: ensure_collections.yml

- name: Enable Auto-TLS in Cloudera Manager
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Run CM security enable autotls tasks
      ansible.builtin.import_role:
        name: cm_security
        tasks_from: enable_autotls

- name: Require healthy CM API before cluster-wide agent reconcile after Auto-TLS
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run CM security require healthy api before agent reconcile tasks
      ansible.builtin.import_role:
        name: cm_security
        tasks_from: require_healthy_api_before_agent_reconcile

- name: Reconcile CM agents after Auto-TLS (server_host / use_tls / restart)
  hosts: all:!ipaserver
  become: true
  serial: "{{ cm_agent_reconcile_serial | default('100%') }}"
  tasks:
    - name: Run CM security reconcile agents after autotls tasks
      ansible.builtin.import_role:
        name: cm_security
        tasks_from: reconcile_agents_after_autotls

- name: Mandatory Cloudera SCM agent restart after Auto-TLS (all cluster agents)
  hosts: all:!ipaserver
  become: true
  serial: "{{ cm_agent_reconcile_serial | default('100%') }}"
  tasks:
    - name: Run CM security mandatory agent restart after autotls tasks
      ansible.builtin.import_role:
        name: cm_security
        tasks_from: mandatory_agent_restart_after_autotls

- name: Record CM agent Auto-TLS restart wave completed (once per playbook run)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run CM security record agent restart wave tasks
      ansible.builtin.import_role:
        name: cm_security
        tasks_from: record_agent_restart_wave

- name: Clear CM agent identity-change marker after successful certificate regeneration
  hosts: all:!ipaserver
  become: true
  gather_facts: false
  tasks:
    - name: Run CM security clear agent identity change marker tasks
      ansible.builtin.import_role:
        name: cm_security
        tasks_from: clear_agent_identity_change_marker

- name: Ensure Auto-TLS agent truststore on CM host after agent reconcile
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run CM security ensure agent truststore after reconcile tasks
      ansible.builtin.import_role:
        name: cm_security
        tasks_from: ensure_agent_truststore_after_reconcile

- name: Reconcile CMS TLS trust and restart after Auto-TLS (Cloudera Labs cm_autotls → cm_service)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run CM security reconcile cms after autotls tasks
      ansible.builtin.import_role:
        name: cm_security
        tasks_from: reconcile_cms_after_autotls

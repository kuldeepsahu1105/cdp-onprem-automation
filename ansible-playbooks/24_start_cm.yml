---
- import_playbook: 00_ensure_collections.yml

- name: Install and Configure Cloudera Manager Server
  hosts: cldr-mngr
  become: yes
  tasks:
    - name: Resolve PostgreSQL host for CM database connection
      ansible.builtin.import_tasks: common_tasks/resolve_postgres_inventory.yml

    - name: Set OS-specific facts on Cloudera Manager host
      ansible.builtin.import_tasks: common_tasks/set_os_facts.yml

    - name: Set OS-specific facts on PostgreSQL host (paths for remote DB)
      ansible.builtin.import_tasks: common_tasks/set_os_facts.yml
      delegate_to: "{{ postgres_inventory_host }}"
      when: postgres_inventory_host != inventory_hostname

    - name: Install Cloudera Manager Server packages
      ansible.builtin.import_tasks: common_tasks/install_cm_packages.yml
      vars:
        cm_package_list: "{{ cldr_mngr_packages.server }}"

    - name: Create PostgreSQL SSL directory
      ansible.builtin.file:
        path: "{{ cm_db_ssl_crt_dir }}"
        state: directory
        owner: cloudera-scm
        group: cloudera-scm
        mode: "0755"

    - name: Read PostgreSQL root certificate from DB host
      ansible.builtin.slurp:
        src: "{{ hostvars[postgres_inventory_host].postgres_data_dir }}/root.crt"
      delegate_to: "{{ postgres_inventory_host }}"
      register: cm_pg_root_crt_slurp

    - name: Install PostgreSQL root certificate for Cloudera Manager
      ansible.builtin.copy:
        content: "{{ cm_pg_root_crt_slurp.content | b64decode }}"
        dest: "{{ cm_db_root_crt }}"
        owner: cloudera-scm
        group: cloudera-scm
        mode: "0644"

    - name: Configure PostgreSQL JDBC connector for CM
      ansible.builtin.copy:
        src: /usr/share/java/postgresql-connector-java.jar
        dest: /opt/cloudera/cm/lib/postgresql-connector.jar
        remote_src: yes

    - name: Remove existing PostgreSQL connector JAR files
      ansible.builtin.find:
        paths: /opt/cloudera/cm/lib
        patterns: "postgresql-42*.jar"
      register: old_pg_jars
      failed_when: false

    - name: Delete old PostgreSQL connector JAR files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_pg_jars.files | default([]) }}"
      when: old_pg_jars.files is defined

    ##### Generate db.properties file
    - name: Check if CM database is already prepared
      ansible.builtin.command: grep -q "jdbc:postgresql" /etc/cloudera-scm-server/db.properties
      register: cm_db_prepared
      failed_when: false
      changed_when: false

    - name: Run scm_prepare_database.sh script
      ansible.builtin.command:
        cmd: >
          /opt/cloudera/cm/schema/scm_prepare_database.sh -h{{ postgres_host_fqdn }}
          --jdbc-url "jdbc:postgresql://{{ postgres_host_fqdn }}:{{ postgres_port }}/{{ scm_db_name }}?ssl=true&sslmode=verify-ca&sslrootcert={{ cm_db_root_crt }}"
          postgresql {{ scm_db_name }} {{ scm_db_user }} {{ scm_db_password }} --ssl
      register: scm_db_output
      changed_when: "'Successfully connected to database.' in scm_db_output.stdout"
      when: cm_db_prepared.rc != 0

    ##### Verify the Cloudera Manager Server updated configs
    - name: Print the updated db.properties file
      ansible.builtin.command:
        cmd: cat /etc/cloudera-scm-server/db.properties
      register: db_properties_output
      changed_when: false

    - name: Display db.properties contents
      ansible.builtin.debug:
        msg: "{{ db_properties_output.stdout_lines }}"


    ##### CSD Installation
    - name: Create CSD directory
      file:
        path: /opt/cloudera/csd
        state: directory
        owner: cloudera-scm
        group: cloudera-scm
        mode: 0755
      # delegate_to: cldr-mngr

    - name: Download CSDs
      ansible.builtin.get_url:
        url: "{{ item }}"
        dest: /opt/cloudera/csd
        mode: '0644'
        url_username: "{{ cm_repo_username }}"
        url_password: "{{ cm_repo_password }}"
        force_basic_auth: yes
      loop: "{{ scm_csds_effective }}"
      when: scm_csds_effective | length > 0
      # delegate_to: cldr-mngr

    # ----------------------------------------
    # Start and enable Cloudera Manager Server
    # ----------------------------------------
    - name: Ensure Cloudera Manager server is enabled and started
      ansible.builtin.systemd:
        name: cloudera-scm-server
        enabled: true
        state: started
      register: cm_service_status

    # ----------------------------------------
    # Wait for CM systemd active (includes local port wait when needed)
    # ----------------------------------------
    - name: Wait for Cloudera Manager to become active
      ansible.builtin.import_tasks: common_tasks/wait_for_cm_server_active.yml


##### Setup agent config on rest of the hosts
- name: Install and Configure Cloudera Manager Agents
  hosts: all:!ipaserver
  become: yes
  tasks:
    - name: Set OS-specific facts
      ansible.builtin.import_tasks: common_tasks/set_os_facts.yml

    - name: Install Cloudera Manager Agent packages
      ansible.builtin.import_tasks: common_tasks/install_cm_packages.yml
      vars:
        cm_package_list: "{{ cldr_mngr_packages.client }}"

    - name: Configure CM agent server_host to cldr-mngr FQDN
      ansible.builtin.import_tasks: common_tasks/configure_cm_agent.yml

    - name: Ensure Cloudera Manager Agent is enabled and started
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: yes
        state: started
      loop:
        - cloudera-scm-agent
      register: cm_services_status


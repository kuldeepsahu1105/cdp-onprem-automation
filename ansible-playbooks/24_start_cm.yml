---
- import_playbook: ensure_collections.yml

- name: Install and Configure Cloudera Manager Server
  hosts: cldr-mngr
  become: yes
  tasks:
    - name: Install cm server
      ansible.builtin.import_role:
        name: cm_install
        tasks_from: install_cm_server

- name: Install and Configure Cloudera Manager Agents
  hosts: all:!ipaserver
  become: yes
  tasks:
    - name: Install cm agents
      ansible.builtin.import_role:
        name: cm_install
        tasks_from: install_cm_agents

### ansible-playbook -i inventory.ini 34_setup_ecs_data_services.yml
#
# Cloudera Data Services on ECS (CDW, CDE, CAI, Model Registry) via Control Plane API.
# Prerequisites:
#   1. ECS cluster installed (33_setup_ecs_cluster.yml).
#   2. Management Console reachable; wildcard DNS for *.{{ ecs_app_domain }} (19_setup_wildcard.yml).
#   3. API keys: ecs_api_* or ecs_auto_provision_api_access_key with bootstrap IAM key.
#
# Enable with ecs_data_services_deploy_enabled: true and either:
#   - ecs_deploy_cdw / ecs_deploy_cde / ecs_deploy_cai / ecs_deploy_cai_registry (or ECS_DEPLOY_* env), or
#   - ecs_data_services_install: [cdw, cde, cai, model_registry]
---
- import_playbook: ensure_collections.yml

- name: Prepare ECS data services on Ansible controller
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Resolve selected ECS data services (flags and/or install list)
      ansible.builtin.import_tasks: common_tasks/resolve_ecs_data_services_install.yml

    - name: Resolve optional ECS LDAP / IAM admin phase
      ansible.builtin.import_tasks: common_tasks/resolve_ecs_control_plane_iam_phase.yml

    - name: Skip when no ECS data services or control-plane IAM work is requested
      ansible.builtin.meta: end_play
      when: not (ecs_data_services_deploy_enabled | default(false) | bool)

    - name: Validate ECS inventory is present
      ansible.builtin.assert:
        that:
          - groups.get(ecs_cluster_master_group, []) | length > 0
        fail_msg: >-
          ECS masters group '{{ ecs_cluster_master_group }}' is empty.
          Run 33_setup_ecs_cluster.yml first.

    - name: Initialize Caddy route list for data service ingress
      ansible.builtin.set_fact:
        ecs_caddy_data_service_routes: []

    - name: Require at least one data service when data services phase is enabled
      ansible.builtin.assert:
        that:
          - ecs_data_services_install_names | length > 0
        fail_msg: >-
          ECS data services phase is enabled but no service is selected.
          Set ecs_deploy_cdw, ecs_deploy_cde, ecs_deploy_cai, and/or ecs_deploy_cai_registry (or
          ECS_DEPLOY_CDW / ECS_DEPLOY_CDE / ECS_DEPLOY_CAI / ECS_DEPLOY_CAI_REGISTRY),
          or ecs_data_services_install: [cdw, cde, cai, model_registry].
      when:
        - ecs_data_services_deploy_enabled | default(false) | bool
        - ecs_data_services_install_names | default([]) | length == 0
        - not (ecs_control_plane_iam_phase_enabled | default(false) | bool)

    - name: Wait for ECS Management Console after cluster install
      ansible.builtin.import_tasks: common_tasks/ecs_wait_control_plane_console.yml

    - name: Reconcile CoreDNS before Data Services provisioning
      ansible.builtin.import_tasks: common_tasks/ecs_reconcile_coredns.yml
      when:
        - ecs_data_services_install_names | default([]) | length > 0
        - ecs_reconcile_coredns | default(true) | bool
        - not (ecs_coredns_reconciled_this_run | default(false) | bool)

    - name: Verify Data Services DNS through Kubernetes pods
      ansible.builtin.import_tasks: common_tasks/ecs_data_services_verify_dns.yml
      when:
        - ecs_data_services_install_names | default([]) | length > 0

    - name: Load existing ECS automation API credentials
      ansible.builtin.import_tasks: common_tasks/ecs_load_api_credentials.yml

    - name: Provision automation machine-user API access key when needed
      ansible.builtin.include_tasks: common_tasks/ecs_provision_iam_machine_access_key.yml
      when:
        - >-
          ecs_api_access_key_id | default('') | length == 0
          or ecs_api_private_key | default('') | length == 0

    - name: Validate control plane credentials
      ansible.builtin.import_tasks: common_tasks/ecs_validate_control_plane_credentials.yml

    - name: Configure CDP CLI profile for data services API calls
      ansible.builtin.import_tasks: common_tasks/ecs_data_services_runtime.yml

    - name: Force-reset an explicitly confirmed stale CDW activation
      ansible.builtin.include_tasks: common_tasks/ecs_data_service_cdw_force_reset.yml
      when:
        - "'cdw' in (ecs_data_services_install_names | default([]))"
        - ecs_cdw_force_reset_cluster_id | default('') | length > 0

    - name: Validate Data Services wait bounds
      ansible.builtin.assert:
        that:
          - ecs_data_services_module_wait_timeout | int > 0
          - ecs_data_services_status_wait_retries | int > 0
          - ecs_data_services_status_wait_delay | int > 0
          - ecs_data_services_async_timeout | int > ecs_data_services_module_wait_timeout | int
          - ecs_data_services_async_poll_retries | int > 0
          - ecs_data_services_async_poll_delay | int > 0
        fail_msg: >-
          Data Services wait bounds are invalid. Set positive module timeout,
          structured-status retry/delay, and CDE async timeout/poll values.

    - name: Optional ECS LDAP provider sync and LDAP admin user
      ansible.builtin.import_tasks: common_tasks/ecs_control_plane_ldap_and_admin.yml

    - name: Provision CDW without blocking subsequent services
      when: "'cdw' in (ecs_data_services_install_names | default([]))"
      block:
        - name: Prepare CDW rerun
          ansible.builtin.include_tasks: common_tasks/ecs_data_service_cdw_preflight.yml

        - name: Launch CDW
          ansible.builtin.include_tasks: common_tasks/ecs_data_service_cdw_start.yml
          vars:
            ansible_python_interpreter: "{{ hostvars['localhost'].ecs_data_services_remote_venv_path }}/bin/python"

        - name: Wait for CDW terminal status
          ansible.builtin.include_tasks: common_tasks/ecs_data_service_cdw_wait.yml
          vars:
            ansible_python_interpreter: "{{ hostvars['localhost'].ecs_data_services_remote_venv_path }}/bin/python"

        - name: Complete CDW dependent services
          ansible.builtin.include_tasks: common_tasks/ecs_data_service_cdw_followup.yml
          vars:
            ansible_python_interpreter: "{{ hostvars['localhost'].ecs_data_services_remote_venv_path }}/bin/python"
      rescue:
        - name: Record uncaught CDW failure
          ansible.builtin.set_fact:
            ecs_cdw_cluster_succeeded: false
            ecs_cdw_catalog_succeeded: false
            ecs_cdw_dataviz_succeeded: false
            ecs_cdw_cluster:
              failed: true
              finished: true
              msg: "{{ ansible_failed_result.msg | default(ansible_failed_result | to_json) }}"

        - name: Collect CDW diagnostics after uncaught failure
          ansible.builtin.include_tasks: common_tasks/ecs_data_service_cdw_diagnostics.yml
          when: not (ecs_cdw_diagnostics_collected | default(false) | bool)

    - name: Report CDW completion status
      ansible.builtin.debug:
        msg: >-
          CDW STATUS: {{
          'SUCCEEDED'
          if (
            ecs_cdw_cluster_succeeded | default(false) | bool
            and ecs_cdw_catalog_succeeded | default(false) | bool
            and ecs_cdw_dataviz_succeeded | default(false) | bool
          )
          else 'FAILED'
          }}. {{
          'cluster='
          + ((ecs_cdw_cluster.cluster | default({})).name | default(ecs_cdp_environment_name))
          + ', Hive VW=' + (ecs_cdw_hive_vw_name_effective | default('unknown'))
          + ', Impala VW=' + (ecs_cdw_impala_vw_name_effective | default('unknown'))
          + ', DataViz=' + (ecs_cdw_dataviz_name_effective | default('unknown'))
          if (
            ecs_cdw_cluster_succeeded | default(false) | bool
            and ecs_cdw_catalog_succeeded | default(false) | bool
            and ecs_cdw_dataviz_succeeded | default(false) | bool
          )
          else (
            (ecs_cdw_cluster | default({})).msg
            | default(ecs_cdw_cluster | default({}) | to_json)
          )
          }}
      when: "'cdw' in (ecs_data_services_install_names | default([]))"

    - name: Provision CDE without blocking subsequent services
      when: "'cde' in (ecs_data_services_install_names | default([]))"
      block:
        - name: Prepare CDE rerun
          ansible.builtin.include_tasks: common_tasks/ecs_data_service_cde_preflight.yml
          vars:
            ansible_python_interpreter: "{{ hostvars['localhost'].ecs_data_services_remote_venv_path }}/bin/python"

        - name: Launch CDE
          ansible.builtin.include_tasks: common_tasks/ecs_data_service_cde_start.yml
          vars:
            ansible_python_interpreter: "{{ hostvars['localhost'].ecs_data_services_remote_venv_path }}/bin/python"
            ansible_async_dir: "{{ hostvars['localhost'].ecs_data_services_remote_async_dir }}"

        - name: Wait for CDE module job
          ansible.builtin.include_tasks: common_tasks/ecs_data_service_cde_wait.yml
          vars:
            ansible_python_interpreter: "{{ hostvars['localhost'].ecs_data_services_remote_venv_path }}/bin/python"
            ansible_async_dir: "{{ hostvars['localhost'].ecs_data_services_remote_async_dir }}"
      rescue:
        - name: Record uncaught CDE failure
          ansible.builtin.set_fact:
            ecs_cde_service_succeeded: >-
              {{ ecs_cde_service_succeeded | default(false) | bool }}
            ecs_cde_virtual_cluster_succeeded: false
            ecs_cde_failure_message: >-
              {{
                ansible_failed_result.msg
                | default(ansible_failed_result | to_json)
              }}
      always:
        - name: Delete temporary CDE human creator access key
          ansible.builtin.command:
            argv: >-
              {{
                ecs_data_services_cdp_cli_prefix
                + [
                  'iam',
                  'delete-access-key',
                  '--access-key-id',
                  ecs_cde_creator_access_key.accessKeyId
                ]
              }}
          environment: "{{ ecs_cdp_cli_environment }}"
          register: ecs_cde_creator_access_key_delete
          changed_when: ecs_cde_creator_access_key_delete.rc == 0
          failed_when: false
          no_log: true
          become: false
          delegate_to: "{{ ecs_data_services_delegate_host }}"
          connection: ssh
          when:
            - ecs_cde_creator_access_key is defined
            - ecs_cde_creator_access_key.accessKeyId | default('') | length > 0

        - name: Remove temporary CDE human creator credentials
          ansible.builtin.file:
            path: "{{ ecs_ds_cdp_profile_dir.path }}/cde-creator-credentials"
            state: absent
          changed_when: false
          become: false
          delegate_to: "{{ ecs_data_services_delegate_host }}"
          connection: ssh

    - name: Report CDE completion status
      ansible.builtin.debug:
        msg: >-
          CDE STATUS: {{
          'SUCCEEDED'
          if (
            ecs_cde_service_succeeded | default(false) | bool
            and ecs_cde_virtual_cluster_succeeded | default(false) | bool
          )
          else 'FAILED'
          }}. {{
          'service=' + (ecs_cde_service_name_effective | default('unknown'))
          + ', service_status='
          + ((ecs_cde_service.service | default({})).status | default('unknown'))
          + ', virtual_cluster='
          + (ecs_cde_virtual_cluster_name_effective | default('unknown'))
          + ', virtual_cluster_status='
          + ((ecs_cde_virtual_cluster | default({})).status | default('unknown'))
          if (
            ecs_cde_service_succeeded | default(false) | bool
            and ecs_cde_virtual_cluster_succeeded | default(false) | bool
          )
          else (
            ecs_cde_failure_message
            | default(
                (ecs_cde_service | default({})).msg
                | default(ecs_cde_service | default({}) | to_json),
                true
              )
          )
          }}
      when: "'cde' in (ecs_data_services_install_names | default([]))"

    - name: Provision CAI without blocking subsequent services
      when: "'cai' in (ecs_data_services_install_names | default([]))"
      block:
        - name: Prepare CAI rerun
          ansible.builtin.include_tasks: common_tasks/ecs_data_service_cai_preflight.yml
          vars:
            ansible_python_interpreter: "{{ hostvars['localhost'].ecs_data_services_remote_venv_path }}/bin/python"

        - name: Converge and validate CAI TLS before workspace submission
          ansible.builtin.include_tasks: common_tasks/ecs_data_service_cai_tls.yml

        - name: Launch CAI
          ansible.builtin.include_tasks: common_tasks/ecs_data_service_cai_start.yml
          vars:
            ansible_python_interpreter: "{{ hostvars['localhost'].ecs_data_services_remote_venv_path }}/bin/python"

        - name: Discover and verify CAI endpoint before terminal status
          ansible.builtin.include_tasks: common_tasks/ecs_data_service_cai_endpoint.yml
          vars:
            ansible_python_interpreter: "{{ hostvars['localhost'].ecs_data_services_remote_venv_path }}/bin/python"

        - name: Wait for CAI terminal status
          ansible.builtin.include_tasks: common_tasks/ecs_data_service_cai_wait.yml
          vars:
            ansible_python_interpreter: "{{ hostvars['localhost'].ecs_data_services_remote_venv_path }}/bin/python"

        - name: Verify CAI UI
          ansible.builtin.include_tasks: common_tasks/ecs_data_service_cai_followup.yml
      rescue:
        - name: Record uncaught CAI failure
          ansible.builtin.set_fact:
            ecs_cai_workspace_succeeded: false
            ecs_cai_ui_succeeded: false
            ecs_cai_workspace:
              failed: true
              finished: true
              msg: "{{ ansible_failed_result.msg | default(ansible_failed_result | to_json) }}"

    - name: Report CAI completion status
      ansible.builtin.debug:
        msg: >-
          CAI STATUS: {{
          'SUCCEEDED'
          if (
            ecs_cai_workspace_succeeded | default(false) | bool
            and ecs_cai_ui_succeeded | default(false) | bool
          )
          else 'FAILED'
          }}. {{
          ecs_cai_status
          if (
            ecs_cai_workspace_succeeded | default(false) | bool
            and ecs_cai_ui_succeeded | default(false) | bool
          )
          else (
            (ecs_cai_workspace | default({})).msg
            | default(
                'workspace=' + (ecs_cai_workspace | default({}) | to_json)
                + ', ui_status='
                + (ecs_cai_ui_probe.status | default('unavailable') | string)
              )
          )
          }}
      when: "'cai' in (ecs_data_services_install_names | default([]))"

    - name: Install Model Registry when selected
      ansible.builtin.include_tasks: common_tasks/ecs_data_service_model_registry.yml
      when: "'model_registry' in (ecs_data_services_install_names | default([]))"
      vars:
        ansible_python_interpreter: "{{ hostvars['localhost'].ecs_data_services_remote_venv_path }}/bin/python"

    - name: Report Model Registry completion status
      ansible.builtin.debug:
        msg: >-
          MODEL REGISTRY STATUS: {{
          'SUCCEEDED' if ecs_model_registry_succeeded | default(false) | bool else 'FAILED'
          }}. {{
          ecs_model_registry_status
          | default(ecs_model_registry_failure_message | default('no result'), true)
          }}
      when: "'model_registry' in (ecs_data_services_install_names | default([]))"

    - name: Remove temporary Data Services profile from ECS master
      ansible.builtin.file:
        path: "{{ ecs_ds_cdp_profile_dir.path }}"
        state: absent
      changed_when: false
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when:
        - ecs_ds_cdp_profile_dir is defined
        - ecs_ds_cdp_profile_dir.path | default('') | length > 0

    - name: Create ECS data-service catalog cache directory
      ansible.builtin.file:
        path: "{{ ecs_data_services_catalog_cache_path | dirname }}"
        state: directory
        mode: "0755"
      become: true
      when:
        - ecs_data_services_catalog_cache_path | default('') | length > 0
        - ecs_data_services_install_names | default([]) | length > 0

    - name: Persist ECS data-service catalog for portal refresh and email URLs
      ansible.builtin.copy:
        dest: "{{ ecs_data_services_catalog_cache_path }}"
        mode: "0644"
        content: "{{ ecs_data_services_catalog | to_nice_yaml(indent=2) }}"
      become: true
      when:
        - ecs_data_services_catalog_cache_path | default('') | length > 0
        - ecs_data_services_install_names | default([]) | length > 0

    - name: Resolve deployment portal Caddy gate for ECS ingress sync
      ansible.builtin.import_tasks: common_tasks/resolve_deployment_portal_caddy_enabled.yml

    - name: Refresh optional deployment portal routes for ECS data services
      when:
        - ecs_caddy_data_service_routes | default([]) | length > 0
        - deployment_portal_caddy_effective | default(false) | bool
      block:
        - name: Resolve deployment portal target host group
          ansible.builtin.import_tasks: common_tasks/resolve_deployment_portal_host.yml

        - name: Check whether deployment portal was bootstrapped
          ansible.builtin.stat:
            path: "{{ deployment_portal_config_dir }}/docker-compose.yml"
          register: ecs_ds_portal_compose
          delegate_to: "{{ groups[deployment_portal_host_group_effective][0] }}"
          connection: ssh
          become: true
          run_once: true

        - name: Report skipped ECS route refresh when portal is not installed
          ansible.builtin.debug:
            msg: >-
              Skipping optional ECS Data Services portal route refresh because
              {{ deployment_portal_config_dir }}/docker-compose.yml is absent
              on {{ groups[deployment_portal_host_group_effective][0] }}.
              Native ECS application endpoints are unchanged.
          when: not (ecs_ds_portal_compose.stat.exists | default(false) | bool)

        - name: Build deployment portal facts for ECS ingress sync
          ansible.builtin.import_tasks: common_tasks/build_deployment_portal_facts.yml
          when: ecs_ds_portal_compose.stat.exists | default(false) | bool

        - name: Sync ECS data service routes on deployment portal Caddy
          ansible.builtin.import_tasks: common_tasks/ecs_data_services_sync_caddy.yml
          delegate_to: "{{ groups[deployment_portal_host_group_effective][0] }}"
          connection: ssh
          become: true
          run_once: true
          when: ecs_ds_portal_compose.stat.exists | default(false) | bool
      rescue:
        - name: Report optional deployment portal route refresh failure
          ansible.builtin.debug:
            msg: >-
              ECS Data Services provisioning completed, but the optional
              deployment portal route refresh failed:
              {{ ansible_failed_result.msg | default(ansible_failed_result | to_json) }}.
              Native ECS application endpoints are unchanged. Re-run
              35_refresh_deployment_portal.yml after repairing the portal.

    - name: Require successful CDW provisioning after all attempts
      ansible.builtin.assert:
        that:
          - ecs_cdw_cluster_succeeded | default(false) | bool
          - ecs_cdw_catalog_succeeded | default(false) | bool
          - ecs_cdw_dataviz_succeeded | default(false) | bool
        fail_msg: >-
          CDW failed after its independent provisioning attempt. See the
          preceding CDW STATUS and Kubernetes diagnostics.
      when: "'cdw' in (ecs_data_services_install_names | default([]))"

    - name: Require successful CDE provisioning after all attempts
      ansible.builtin.assert:
        that:
          - ecs_cde_service_succeeded | default(false) | bool
          - ecs_cde_virtual_cluster_succeeded | default(false) | bool
        fail_msg: >-
          CDE failed after its independent provisioning attempt:
          service_succeeded={{
          ecs_cde_service_succeeded | default(false) | bool }},
          virtual_cluster_succeeded={{
          ecs_cde_virtual_cluster_succeeded | default(false) | bool }}.
          {{
            ecs_cde_failure_message
            | default(
                (ecs_cde_service | default({})).msg
                | default(ecs_cde_service | default({}) | to_json),
                true
              )
          }}
      when: "'cde' in (ecs_data_services_install_names | default([]))"

    - name: Require successful CAI provisioning after all attempts
      ansible.builtin.assert:
        that:
          - ecs_cai_workspace_succeeded | default(false) | bool
          - ecs_cai_ui_succeeded | default(false) | bool
        fail_msg: >-
          CAI failed after its independent provisioning attempt. See the
          preceding CAI STATUS and workspace diagnostics.
      when: "'cai' in (ecs_data_services_install_names | default([]))"

    - name: Require successful Model Registry provisioning after all attempts
      ansible.builtin.assert:
        that:
          - ecs_model_registry_succeeded | default(false) | bool
        fail_msg: >-
          Model Registry failed after its independent provisioning attempt.
          See the preceding MODEL REGISTRY STATUS.
      when: "'model_registry' in (ecs_data_services_install_names | default([]))"

### ansible-playbook -i inventory.ini 23_setup_postgres.yml
# vars:
#   postgresql_version: 15
#   postgres_data_dir: "/var/lib/pgsql/{{ postgresql_version }}/data"
#   pg_client_crt_dir: "/root/.postgresql"
#   postgres_user: "postgres"
#   postgres_password: "postgres"
#   postgres_db: "postgres"

---
- import_playbook: ensure_collections.yml

- name: Configure cloudera-manager.repo on all hosts
  hosts: all
  become: yes
  tasks:
    - name: Configure cm repo for postgres
      ansible.builtin.import_role:
        name: cm_install
        tasks_from: configure_cm_repo_for_postgres

- name: Download PostgreSQL JDBC driver
  hosts: all
  become: true
  tasks:
    - name: Download postgres jdbc
      ansible.builtin.import_role:
        name: cm_install
        tasks_from: download_postgres_jdbc

- name: Distribute JDBC driver to all hosts
  hosts: all
  become: true
  tasks:
    - name: Distribute postgres jdbc
      ansible.builtin.import_role:
        name: cm_install
        tasks_from: distribute_postgres_jdbc

- name: Install and Configure PostgreSQL
  hosts: "{{ postgres_inventory_group_resolved | default('cldr-mngr') }}"
  become: yes
  tasks:
    - name: Install postgresql
      ansible.builtin.import_role:
        name: cm_install
        tasks_from: install_postgresql

- name: Setup PostgreSQL with TLS/SSL for Cloudera Manager
  hosts: "{{ postgres_inventory_group_resolved | default('cldr-mngr') }}"
  become: yes
  tasks:
    - name: Setup postgresql tls
      ansible.builtin.import_role:
        name: cm_install
        tasks_from: setup_postgresql_tls

- name: Fetch root.crt from PostgreSQL host
  hosts: "{{ postgres_inventory_group_resolved | default('cldr-mngr') }}"
  gather_facts: false
  tasks:
    - name: Fetch postgresql ca
      ansible.builtin.import_role:
        name: cm_install
        tasks_from: fetch_postgresql_ca

- name: Copy root.crt to all nodes
  hosts: all
  become: true
  tasks:
    - name: Distribute postgresql ca
      ansible.builtin.import_role:
        name: cm_install
        tasks_from: distribute_postgresql_ca

- name: Verify the certificate files
  hosts: "{{ postgres_inventory_group_resolved | default('cldr-mngr') }}"
  become: yes
  tasks:
    - name: Verify postgresql certificates
      ansible.builtin.import_role:
        name: cm_install
        tasks_from: verify_postgresql_certificates

- name: Restart and verify Postgres DB is running fine
  hosts: "{{ postgres_inventory_group_resolved | default('cldr-mngr') }}"
  become: yes
  tasks:
    - name: Restart and verify postgresql
      ansible.builtin.import_role:
        name: cm_install
        tasks_from: restart_and_verify_postgresql

- name: Verify PostgreSQL SSL Configuration (Post Start)
  hosts: "{{ postgres_inventory_group_resolved | default('cldr-mngr') }}"
  become: true
  tasks:
    - name: Verify postgresql ssl
      ansible.builtin.import_role:
        name: cm_install
        tasks_from: verify_postgresql_ssl

- name: Initialize PostgreSQL Database
  hosts: "{{ postgres_inventory_group_resolved | default('cldr-mngr') }}"
  become: true
  tasks:
    - name: Initialize cm databases
      ansible.builtin.import_role:
        name: cm_install
        tasks_from: initialize_cm_databases

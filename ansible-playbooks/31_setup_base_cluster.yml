### ansible-playbook -i inventory.ini 31_setup_base_cluster.yml
#
# Install CDP Base Cluster on base-masters/base-workers (services: see base_cluster_install_services).
# This is separate from Cloudera Management Service (CMS) — see 28_setup_cm_cms.yml
---
- import_playbook: 27_setup_cm_autotls.yml

- name: Install cloudera.cluster collection on control node
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Install cloudera.cluster collection
      ansible.builtin.import_tasks: common_tasks/install_cloudera_collection.yml

- name: Install CDP Base Cluster via Cloudera Manager
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Prepare CM API
      ansible.builtin.import_tasks: common_tasks/prepare_cm_security_api.yml

    - name: Check inventory groups
      ansible.builtin.assert:
        that:
          - base_cluster_master_group in groups
          - groups[base_cluster_master_group] | length > 0
          - base_cluster_worker_group in groups
          - groups[base_cluster_worker_group] | length > 0
        fail_msg: >-
          Base cluster inventory groups '{{ base_cluster_master_group }}' and
          '{{ base_cluster_worker_group }}' must exist and contain hosts.

    - name: Check required service settings
      ansible.builtin.assert:
        that:
          - base_cluster_database_host | string | trim | length > 0
          - not (base_cluster_install_services.ozone | default(true) | bool) or (base_cluster_ozone_service_id | string | trim | length > 0)
          - not (base_cluster_install_services.hive | default(true) | bool) or (base_cluster_hive_database_name | string | trim | length > 0)
          - not (base_cluster_install_services.hive | default(true) | bool) or (base_cluster_hive_database_user | string | trim | length > 0)
          - not (base_cluster_install_services.hive | default(true) | bool) or (base_cluster_hive_database_password | string | length > 0)
          - not (base_cluster_install_services.hue | default(true) | bool) or (base_cluster_hue_database_name | string | trim | length > 0)
          - not (base_cluster_install_services.hue | default(true) | bool) or (base_cluster_hue_database_user | string | trim | length > 0)
          - not (base_cluster_install_services.hue | default(true) | bool) or (base_cluster_hue_database_password | string | length > 0)
          - not (base_cluster_install_services.ranger | default(true) | bool) or (base_cluster_ranger_admin_password | string | length > 0)
          - not (base_cluster_install_services.ranger | default(true) | bool) or (base_cluster_ranger_keyadmin_password | string | length > 0)
          - not (base_cluster_install_services.ranger | default(true) | bool) or (base_cluster_ranger_tagsync_password | string | length > 0)
          - not (base_cluster_install_services.ranger | default(true) | bool) or (base_cluster_ranger_usersync_password | string | length > 0)
          - not (base_cluster_install_services.ranger | default(true) | bool) or (base_cluster_ranger_admin_password | string | length >= 8)
          - not (base_cluster_install_services.ranger | default(true) | bool) or (base_cluster_ranger_admin_password | regex_search('[A-Za-z]'))
          - not (base_cluster_install_services.ranger | default(true) | bool) or (base_cluster_ranger_admin_password | regex_search('[0-9]'))
          - not (base_cluster_install_services.knox | default(true) | bool) or (base_cluster_knox_master_secret | string | length > 0)
          - not (base_cluster_install_services.kafka | default(true) | bool) or (base_cluster_kafka_metadata_store | lower in ['kraft', 'zookeeper'])
          - not (base_cluster_enable_kerberos | default(true) | bool) or (base_cluster_install_services.hdfs | default(true) | bool)
        fail_msg: >-
          Required base-cluster service or database settings are empty. Set the
          base_cluster_* values through ANSIBLE_GROUP_VARS_YAML or an Ansible vault.
          base_cluster_kafka_metadata_store must be KRaft or Zookeeper. Kerberos
          enablement requires HDFS so its final authentication mode can be verified.

    - name: Check service dependencies
      ansible.builtin.assert:
        that:
          - base_cluster_install_services[item.dependency] | default(false) | bool
        fail_msg: >-
          base_cluster_install_services.{{ item.service }} requires
          base_cluster_install_services.{{ item.dependency }}.
      when: base_cluster_install_services[item.service] | default(false) | bool
      loop:
        - { service: yarn, dependency: hdfs }
        - { service: yarn, dependency: zookeeper }
        - { service: tez, dependency: yarn }
        - { service: spark3, dependency: yarn }
        - { service: hive, dependency: hdfs }
        - { service: hive_on_tez, dependency: hive }
        - { service: hive_on_tez, dependency: tez }
        - { service: hbase, dependency: hdfs }
        - { service: hbase, dependency: zookeeper }
        - { service: hue, dependency: hive }
        - { service: impala, dependency: hdfs }
        - { service: impala, dependency: hive }
        - { service: atlas, dependency: hdfs }
        - { service: atlas, dependency: hbase }
        - { service: atlas, dependency: kafka }
        - { service: atlas, dependency: solr }
        - { service: ranger, dependency: solr }
        - { service: solr, dependency: hdfs }
        - { service: solr, dependency: zookeeper }
        - { service: phoenix, dependency: hbase }
        - { service: iceberg, dependency: hive }
        - { service: iceberg, dependency: impala }
        - { service: iceberg, dependency: spark3 }
      loop_control:
        label: "{{ item.service }} requires {{ item.dependency }}"

    - name: Check Kafka ZooKeeper dependency
      ansible.builtin.assert:
        that:
          - base_cluster_install_services.zookeeper | default(false) | bool
        fail_msg: >-
          Kafka metadata mode Zookeeper requires base_cluster_install_services.zookeeper=true.
      when:
        - base_cluster_install_services.kafka | default(true) | bool
        - base_cluster_kafka_metadata_store | lower == 'zookeeper'

    - name: Resolve Kafka metadata store
      ansible.builtin.set_fact:
        base_cluster_kafka_metadata_store_effective: >-
          {{ 'KRaft' if base_cluster_kafka_metadata_store | lower == 'kraft' else 'Zookeeper' }}

    - name: Set master hostname
      ansible.builtin.set_fact:
        base_master_fqdn: >-
          {%- set hostname = hostvars[groups[base_cluster_master_group][0]].cldr_hostname -%}
          {{ hostname if hostname.endswith('.' ~ cluster_domain) else hostname ~ '.' ~ cluster_domain }}

    - name: Set worker hostnames
      ansible.builtin.set_fact:
        base_worker_fqdns: >-
          {%- set hostname = hostvars[item].cldr_hostname -%}
          {{
            base_worker_fqdns | default([])
            + [hostname if hostname.endswith('.' ~ cluster_domain) else hostname ~ '.' ~ cluster_domain]
          }}
      loop: "{{ groups[base_cluster_worker_group] }}"
      loop_control:
        label: "{{ item }}"

    - name: Build worker assignments
      ansible.builtin.set_fact:
        base_worker_host_entries: "{{ base_worker_host_entries | default([]) + [{'name': item, 'host_template': 'Worker'}] }}"
      loop: "{{ base_worker_fqdns }}"

    - name: Build cluster hosts
      ansible.builtin.set_fact:
        base_cluster_hosts: "{{ [{'name': base_master_fqdn, 'host_template': 'Master'}] + base_worker_host_entries }}"

    - name: Show cluster targets
      ansible.builtin.debug:
        msg:
          - "Cluster name: {{ cdh_basecluster_name }}"
          - "CDH parcel version: {{ cdh_parcel_version }}"
          - "Master host: {{ base_master_fqdn }}"
          - "Worker hosts: {{ base_worker_fqdns }}"

    - name: Build cluster specification
      ansible.builtin.set_fact:
        base_cluster_spec: "{{ lookup('template', 'base_cluster_cluster_spec.j2') | from_yaml }}"

    - name: Show enabled services
      ansible.builtin.debug:
        msg: >-
          Services to install:
          {{ base_cluster_spec.services | map(attribute='name') | list | join(', ') }}

    - name: Find invalid role mappings
      ansible.builtin.set_fact:
        base_cluster_invalid_role_groups: >-
          {%- set invalid = [] -%}
          {%- for host_template in base_cluster_spec.host_templates -%}
            {%- for assignment in host_template.role_groups | default([]) -%}
              {%- set matching_services =
                base_cluster_spec.services
                | selectattr('type', 'equalto', assignment.service)
                | list
              -%}
              {%- if
                matching_services | length == 0
                or (
                  matching_services[0].role_groups | default([])
                  | selectattr('type', 'equalto', assignment.type)
                  | list
                  | length == 0
                )
              -%}
                {%- set _ = invalid.append(
                  host_template.name ~ ':' ~ assignment.service ~ '/' ~ assignment.type
                ) -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ invalid }}

    - name: Check role mappings
      ansible.builtin.assert:
        that:
          - base_cluster_invalid_role_groups | length == 0
        fail_msg: >-
          Host-template roles missing matching service base role groups:
          {{ base_cluster_invalid_role_groups | join(', ') }}.

    - name: Configure parcel repository
      ansible.builtin.import_tasks: common_tasks/configure_cm_parcel_repo_api.yml
      when: parcel_repo is defined

    - name: Prepare cluster module connection
      ansible.builtin.import_tasks: common_tasks/resolve_cm_cluster_module_endpoint.yml

    - name: Check requested cluster
      ansible.builtin.uri:
        url: "{{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200, 404]
        follow_redirects: none
      register: base_cluster_requested_lookup
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Check legacy default cluster
      ansible.builtin.uri:
        url: "{{ cm_cluster_module_api_url }}/clusters/{{ base_cluster_legacy_name }}"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200, 404]
        follow_redirects: none
      register: base_cluster_legacy_lookup
      when:
        - base_cluster_requested_lookup.status == 404
        - cdh_basecluster_name == 'CDP-base-cluster'
        - base_cluster_legacy_name | default('') | length > 0
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Preserve existing legacy default cluster name
      ansible.builtin.set_fact:
        cdh_basecluster_name: "{{ base_cluster_legacy_name }}"
      when:
        - base_cluster_requested_lookup.status == 404
        - base_cluster_legacy_lookup.status | default(404) == 200

    - name: Select existing cluster lookup
      ansible.builtin.set_fact:
        existing_cluster: >-
          {{
            base_cluster_legacy_lookup
            if (
              base_cluster_requested_lookup.status == 404
              and base_cluster_legacy_lookup.status | default(404) == 200
            )
            else base_cluster_requested_lookup
          }}

    - name: Check cluster hosts
      ansible.builtin.uri:
        url: "{{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}/hosts"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: existing_cluster_hosts
      changed_when: false
      when: existing_cluster.status == 200
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Check cluster services
      ansible.builtin.uri:
        url: "{{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}/services?view=summary"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: existing_cluster_services
      changed_when: false
      when: existing_cluster.status == 200
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Detect incomplete cluster
      ansible.builtin.set_fact:
        base_cluster_partial_empty: >-
          {{
            existing_cluster.status == 200
            and (existing_cluster_hosts.json['items'] | default([]) | length == 0)
          }}
        base_cluster_missing_service_types: >-
          {{
            (
              base_cluster_spec.services
              | map(attribute='type')
              | list
              | difference(
                  existing_cluster_services.json['items'] | default([])
                  | map(attribute='type')
                  | list
                )
            )
            if existing_cluster.status == 200
            else []
          }}

    - name: Show existing cluster state
      ansible.builtin.debug:
        msg: >-
          Base cluster with name {{ cdh_basecluster_name }} already exists:
          state={{ existing_cluster.json.clusterState | default('unknown') }},
          hosts={{ existing_cluster_hosts.json['items'] | default([]) | length }},
          services={{ existing_cluster_services.json['items'] | default([]) | map(attribute='type') | sort | join(', ') }}.
      when: existing_cluster.status == 200

    - name: Show incomplete cluster recovery
      ansible.builtin.debug:
        msg: >-
          Base cluster '{{ cdh_basecluster_name }}' exists with zero assigned hosts, indicating
          an interrupted module creation; deleting only this empty partial cluster before recreation.
      when: base_cluster_partial_empty | bool

    - name: Delete incomplete base cluster with name {{ cdh_basecluster_name }}
      ansible.builtin.uri:
        url: "{{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}"
        method: DELETE
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200, 202, 204, 404]
        follow_redirects: none
      when: base_cluster_partial_empty | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Wait for cluster deletion
      ansible.builtin.uri:
        url: "{{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200, 404]
        follow_redirects: none
      register: base_cluster_partial_delete_wait
      until: base_cluster_partial_delete_wait.status == 404
      retries: 30
      delay: 5
      changed_when: false
      when: base_cluster_partial_empty | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Set cluster creation state
      ansible.builtin.set_fact:
        base_cluster_create_required: >-
          {{ existing_cluster.status == 404 or (base_cluster_partial_empty | bool) }}

    - name: Check existing cluster services
      ansible.builtin.assert:
        that:
          - base_cluster_missing_service_types | length == 0
        fail_msg: >-
          Existing populated base cluster with name {{ cdh_basecluster_name }} is missing requested
          service types: {{ base_cluster_missing_service_types | join(', ') }}. The cluster module
          cannot safely reconcile service topology on an existing populated cluster.
      when:
        - existing_cluster.status == 200
        - not (base_cluster_partial_empty | bool)

    - name: Show cluster creation wait
      ansible.builtin.debug:
        msg: >-
          Creating the CM cluster, services, host templates, host assignments, and activating
          parcels. Jenkins will poll every {{ base_cluster_module_poll_interval }}s; the
          cloudera.cluster collection allows up to 7200s for CM parcel and command operations.
      when: base_cluster_create_required | bool

    - name: Create base cluster with name {{ cdh_basecluster_name }}
      cloudera.cluster.cluster:
        host: "{{ cm_cluster_module_host }}"
        port: "{{ cm_cluster_module_port }}"
        version: "{{ cm_api_version }}"
        force_tls: "{{ cm_cluster_module_force_tls }}"
        username: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        verify_tls: false
        name: "{{ cdh_basecluster_name }}"
        display_name: "{{ cdh_basecluster_name }}"
        cluster_version: "{{ cdh_parcel_version }}"
        type: BASE_CLUSTER
        state: present
        parcels:
          CDH: "{{ cdh_parcel_version }}"
        services: "{{ base_cluster_spec.services }}"
        host_templates: "{{ base_cluster_spec.host_templates }}"
        hosts: "{{ base_cluster_hosts }}"
      register: base_cluster_create_result
      when: base_cluster_create_required | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"
      async: "{{ base_cluster_module_async_timeout }}"
      poll: "{{ base_cluster_module_poll_interval }}"

    - name: Reset required configuration change state
      ansible.builtin.set_fact:
        base_cluster_required_config_changed: false

    - name: Configure Ozone requirements
      ansible.builtin.include_tasks: common_tasks/reconcile_cm_config_api.yml
      vars:
        cm_config_display_name: Ozone
        cm_config_endpoint: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}/services/ozone/config
        cm_config_desired:
          ozone.service.id: "{{ base_cluster_ozone_service_id }}"
          ozone.scm.primordial.node.id: "{{ base_master_fqdn }}"
          hdfs_service: "{{ 'hdfs' if base_cluster_install_services.hdfs | default(true) else '' }}"
      when: base_cluster_install_services.ozone | default(true) | bool

    - name: Configure Hive database
      ansible.builtin.include_tasks: common_tasks/reconcile_cm_config_api.yml
      vars:
        cm_config_display_name: Hive database
        cm_config_endpoint: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}/services/hive/config
        cm_config_desired:
          hive_metastore_database_host: "{{ base_cluster_database_host }}"
          hive_metastore_database_port: "{{ base_cluster_database_port }}"
          hive_metastore_database_type: postgresql
          hive_metastore_database_name: "{{ base_cluster_hive_database_name }}"
          hive_metastore_database_user: "{{ base_cluster_hive_database_user }}"
          hive_metastore_database_password: "{{ base_cluster_hive_database_password }}"
        cm_config_secret_names:
          - hive_metastore_database_password
      when: base_cluster_install_services.hive | default(true) | bool

    - name: Repair stale CM Hive Metastore canary catalogs
      ansible.builtin.include_tasks: common_tasks/repair_hive_cm_canary_catalogs.yml
      when:
        - existing_cluster.status == 200
        - base_cluster_repair_hive_canary_catalogs | default(true) | bool
        - base_cluster_install_services.hive | default(true) | bool

    - name: Configure Hue database
      ansible.builtin.include_tasks: common_tasks/reconcile_cm_config_api.yml
      vars:
        cm_config_display_name: Hue database
        cm_config_endpoint: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}/services/hue/config
        cm_config_desired:
          database_host: "{{ base_cluster_database_host }}"
          database_port: "{{ base_cluster_database_port }}"
          database_type: postgresql
          database_name: "{{ base_cluster_hue_database_name }}"
          database_user: "{{ base_cluster_hue_database_user }}"
          database_password: "{{ base_cluster_hue_database_password }}"
        cm_config_secret_names:
          - database_password
      when: base_cluster_install_services.hue | default(true) | bool

    - name: Discover Hue parcel Python environment
      ansible.builtin.find:
        paths: /opt/cloudera/parcels/CDH/lib/hue/build/venvs
        patterns: "python{{ python_version }}"
        file_type: directory
        recurse: false
        follow: true
      register: base_cluster_hue_python_environments
      become: true
      connection: ssh
      delegate_to: "{{ groups[base_cluster_master_group][0] }}"
      when: base_cluster_install_services.hue | default(true) | bool

    - name: Require Hue parcel Python environment
      ansible.builtin.assert:
        that:
          - base_cluster_hue_python_environments.matched | default(0) | int == 1
        fail_msg: >-
          Hue is enabled but exactly one python{{ python_version }} environment was not found
          below the active CDH parcel's Hue venv directory on
          {{ groups[base_cluster_master_group][0] }}. Confirm the CDH parcel is activated and
          its Hue Python version matches python_version={{ python_version }}.
      when: base_cluster_install_services.hue | default(true) | bool

    - name: Resolve Hue parcel Python interpreter
      ansible.builtin.set_fact:
        base_cluster_hue_python_interpreter_effective: >-
          {{ base_cluster_hue_python_environments.files[0].path }}/bin/python
      when: base_cluster_install_services.hue | default(true) | bool

    - name: Ensure psycopg2 is installed for Hue
      ansible.builtin.import_tasks: common_tasks/ensure_python_psycopg2.yml
      vars:
        python_psycopg2_additional_interpreters:
          - "{{ base_cluster_hue_python_interpreter_effective }}"
      become: true
      connection: ssh
      delegate_to: "{{ groups[base_cluster_master_group][0] }}"
      when: base_cluster_install_services.hue | default(true) | bool

    - name: Read Kafka role config groups
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/kafka/roleConfigGroups?view=summary
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_kafka_role_groups
      changed_when: false
      when: base_cluster_install_services.kafka | default(true) | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Select Kafka Broker role config group
      ansible.builtin.set_fact:
        base_cluster_kafka_broker_group: >-
          {{
            base_cluster_kafka_role_groups.json['items']
            | selectattr('roleType', 'equalto', 'KAFKA_BROKER')
            | map(attribute='name')
            | first
            | default('')
          }}
      when: base_cluster_install_services.kafka | default(true) | bool

    - name: Check Kafka Broker role config group
      ansible.builtin.assert:
        that:
          - base_cluster_kafka_broker_group | length > 0
        fail_msg: Kafka service has no KAFKA_BROKER base role config group.
      when: base_cluster_install_services.kafka | default(true) | bool

    - name: Configure Kafka Broker metadata store
      ansible.builtin.include_tasks: common_tasks/reconcile_cm_config_api.yml
      vars:
        cm_config_display_name: Kafka Broker metadata store
        cm_config_endpoint: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/kafka/roleConfigGroups/{{ base_cluster_kafka_broker_group }}/config
        cm_config_desired:
          metadata.store: "{{ base_cluster_kafka_metadata_store_effective }}"
      when: base_cluster_install_services.kafka | default(true) | bool

    - name: Configure Ranger database and passwords
      ansible.builtin.include_tasks: common_tasks/reconcile_cm_config_api.yml
      vars:
        cm_config_display_name: Ranger database and passwords
        cm_config_endpoint: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}/services/ranger/config
        cm_config_desired:
          ranger_database_host: "{{ base_cluster_database_host }}"
          ranger_database_port: "{{ base_cluster_database_port }}"
          ranger_database_type: postgresql
          ranger_database_name: "{{ base_cluster_ranger_database_name }}"
          ranger_database_user: "{{ base_cluster_ranger_database_user }}"
          ranger_database_password: "{{ base_cluster_ranger_database_password }}"
          rangeradmin_user_password: "{{ base_cluster_ranger_admin_password }}"
          keyadmin_user_password: "{{ base_cluster_ranger_keyadmin_password }}"
          rangertagsync_user_password: "{{ base_cluster_ranger_tagsync_password }}"
          rangerusersync_user_password: "{{ base_cluster_ranger_usersync_password }}"
        cm_config_secret_names:
          - ranger_database_password
          - rangeradmin_user_password
          - keyadmin_user_password
          - rangertagsync_user_password
          - rangerusersync_user_password
      when: base_cluster_install_services.ranger | default(true) | bool

    - name: Configure Knox database
      ansible.builtin.include_tasks: common_tasks/reconcile_cm_config_api.yml
      vars:
        cm_config_display_name: Knox database
        cm_config_endpoint: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}/services/knox/config
        cm_config_desired:
          knox_gateway_database_host: "{{ base_cluster_database_host }}"
          knox_gateway_database_port: "{{ base_cluster_database_port }}"
          knox_gateway_database_type: postgresql
          knox_gateway_database_name: "{{ base_cluster_knox_database_name }}"
          knox_gateway_database_user: "{{ base_cluster_knox_database_user }}"
          knox_gateway_database_password: "{{ base_cluster_knox_database_password }}"
        cm_config_secret_names:
          - knox_gateway_database_password
      when: base_cluster_install_services.knox | default(true) | bool

    - name: Find Knox role config group
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/knox/roleConfigGroups?view=summary
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_knox_role_groups
      changed_when: false
      when: base_cluster_install_services.knox | default(true) | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Select Knox Gateway role config group
      ansible.builtin.set_fact:
        base_cluster_knox_gateway_group: >-
          {{
            base_cluster_knox_role_groups.json['items']
            | selectattr('roleType', 'equalto', 'KNOX_GATEWAY')
            | map(attribute='name')
            | first
            | default('')
          }}
      when: base_cluster_install_services.knox | default(true) | bool

    - name: Check Knox Gateway role config group
      ansible.builtin.assert:
        that:
          - base_cluster_knox_gateway_group | length > 0
        fail_msg: Knox service has no KNOX_GATEWAY base role config group.
      when: base_cluster_install_services.knox | default(true) | bool

    - name: Configure Knox master secret
      ansible.builtin.include_tasks: common_tasks/reconcile_cm_config_api.yml
      vars:
        cm_config_display_name: Knox Gateway
        cm_config_endpoint: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/knox/roleConfigGroups/{{ base_cluster_knox_gateway_group }}/config
        cm_config_desired:
          gateway_master_secret: "{{ base_cluster_knox_master_secret }}"
        cm_config_secret_names:
          - gateway_master_secret
      when: base_cluster_install_services.knox | default(true) | bool

    - name: Read base cluster initialization marker before Knox trust repair
      ansible.builtin.slurp:
        src: "{{ base_cluster_initialization_marker_path }}"
      register: base_cluster_initialization_marker
      failed_when: false
      changed_when: false
      become: true
      delegate_to: "{{ cm_manager_inventory_host }}"
      when: existing_cluster.status == 200

    - name: Detect incomplete initialization before Knox trust repair
      ansible.builtin.set_fact:
        base_cluster_initialization_incomplete: >-
          {{
            existing_cluster.status == 200
            and not (
              existing_cluster.json.uuid is defined
              and base_cluster_initialization_marker.content is defined
              and (
                'uuid=' ~ existing_cluster.json.uuid
                in (base_cluster_initialization_marker.content | b64decode)
              )
            )
          }}

    - name: Read Knox Gateway Auto-TLS client truststore schema
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/knox/roleConfigGroups/{{ base_cluster_knox_gateway_group }}/config?view=full
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_knox_gateway_config_schema
      changed_when: false
      delegate_to: "{{ cm_cluster_module_delegate_to }}"
      when:
        - base_cluster_install_services.knox | default(true) | bool
        - autotls_enabled | default(true) | bool
        - base_cluster_knox_configure_autotls_trust | default(true) | bool

    - name: Require Knox Gateway Auto-TLS client truststore settings
      ansible.builtin.assert:
        that:
          - >-
            base_cluster_knox_gateway_config_schema.json['items'] | default([])
            | selectattr('name', 'equalto', 'ssl_client_truststore_location')
            | list | length == 1
          - >-
            base_cluster_knox_gateway_config_schema.json['items'] | default([])
            | selectattr('name', 'equalto', 'ssl_client_truststore_password')
            | list | length == 1
        fail_msg: >-
          The Knox Gateway role schema does not expose ssl_client_truststore_location and
          ssl_client_truststore_password. Available truststore settings:
          {{
            base_cluster_knox_gateway_config_schema.json['items'] | default([])
            | map(attribute='name')
            | select('search', 'truststore')
            | list
            | join(', ')
          }}.
      when:
        - base_cluster_install_services.knox | default(true) | bool
        - autotls_enabled | default(true) | bool
        - base_cluster_knox_configure_autotls_trust | default(true) | bool

    - name: Check Knox Auto-TLS client truststore
      ansible.builtin.stat:
        path: "{{ base_cluster_knox_autotls_truststore_path }}"
      register: base_cluster_knox_autotls_truststore
      delegate_to: "{{ groups[base_cluster_master_group][0] }}"
      become: true
      when:
        - base_cluster_install_services.knox | default(true) | bool
        - autotls_enabled | default(true) | bool
        - base_cluster_knox_configure_autotls_trust | default(true) | bool

    - name: Require Knox Auto-TLS client truststore
      ansible.builtin.assert:
        that:
          - base_cluster_knox_autotls_truststore.stat.exists | default(false) | bool
          - base_cluster_knox_autotls_truststore.stat.isreg | default(false) | bool
        fail_msg: >-
          Knox cannot discover cluster services over the Auto-TLS CM API because
          {{ base_cluster_knox_autotls_truststore_path }} is missing on
          {{ groups[base_cluster_master_group][0] }}. Re-run 27_setup_cm_autotls.yml
          so the CM agent deploys its truststore, then retry the base-cluster phase.
      when:
        - base_cluster_install_services.knox | default(true) | bool
        - autotls_enabled | default(true) | bool
        - base_cluster_knox_configure_autotls_trust | default(true) | bool

    - name: Read Auto-TLS truststore password for Knox
      ansible.builtin.uri:
        url: "{{ cm_cluster_module_api_url }}/certs/truststorePassword"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        return_content: yes
        status_code: [200]
        follow_redirects: none
      register: base_cluster_knox_truststore_password_api
      delegate_to: "{{ cm_cluster_module_delegate_to }}"
      no_log: true
      when:
        - base_cluster_install_services.knox | default(true) | bool
        - autotls_enabled | default(true) | bool
        - base_cluster_knox_configure_autotls_trust | default(true) | bool

    - name: Require Auto-TLS truststore password for Knox
      ansible.builtin.assert:
        that:
          - base_cluster_knox_truststore_password_api.content | default('') | trim | length > 0
        fail_msg: >-
          CM Auto-TLS did not return a truststore password for Knox service discovery.
          Re-run 27_setup_cm_autotls.yml and verify the CM cert API before retrying.
      no_log: true
      when:
        - base_cluster_install_services.knox | default(true) | bool
        - autotls_enabled | default(true) | bool
        - base_cluster_knox_configure_autotls_trust | default(true) | bool

    - name: Configure Knox Auto-TLS client truststore
      ansible.builtin.include_tasks: common_tasks/reconcile_cm_config_api.yml
      vars:
        cm_config_display_name: Knox Gateway Auto-TLS client truststore
        cm_config_endpoint: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/knox/roleConfigGroups/{{ base_cluster_knox_gateway_group }}/config
        cm_config_desired:
          ssl_client_truststore_location: "{{ base_cluster_knox_autotls_truststore_path }}"
          ssl_client_truststore_password: >-
            {{ base_cluster_knox_truststore_password_api.content | trim }}
        cm_config_secret_names:
          - ssl_client_truststore_password
        base_cluster_force_secret_update: >-
          {{
            base_cluster_knox_update_autotls_truststore_password | default(false) | bool
            or autotls_applied_this_run | default(false) | bool
            or base_cluster_initialization_incomplete | default(false) | bool
          }}
      when:
        - base_cluster_install_services.knox | default(true) | bool
        - autotls_enabled | default(true) | bool
        - base_cluster_knox_configure_autotls_trust | default(true) | bool

    - name: Record Knox Auto-TLS client truststore update
      ansible.builtin.set_fact:
        base_cluster_knox_autotls_trust_changed: "{{ cm_config_updates | length > 0 }}"
      when:
        - base_cluster_install_services.knox | default(true) | bool
        - autotls_enabled | default(true) | bool
        - base_cluster_knox_configure_autotls_trust | default(true) | bool

    - name: Read Knox state after Auto-TLS trust configuration
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/knox?view=summary
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_knox_after_trust
      changed_when: false
      delegate_to: "{{ cm_cluster_module_delegate_to }}"
      when: base_cluster_knox_autotls_trust_changed | default(false) | bool

    - name: Restart running Knox after Auto-TLS trust configuration
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/knox/commands/restart
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_knox_trust_restart
      delegate_to: "{{ cm_cluster_module_delegate_to }}"
      when:
        - base_cluster_knox_autotls_trust_changed | default(false) | bool
        - base_cluster_knox_after_trust.json.serviceState | default('') == 'STARTED'

    - name: Wait for Knox Auto-TLS trust restart
      ansible.builtin.include_tasks: common_tasks/wait_cm_api_command.yml
      vars:
        cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
        cm_api_command_id: "{{ base_cluster_knox_trust_restart.json.id }}"
        cm_api_command_allow_already_exists: false
      when:
        - base_cluster_knox_trust_restart is defined
        - base_cluster_knox_trust_restart.json.id is defined

    - name: Read CM hosts for required service roles
      ansible.builtin.uri:
        url: "{{ cm_cluster_module_api_url }}/hosts?view=summary"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_cm_hosts
      changed_when: false
      when: >-
        base_cluster_install_services.ozone | default(true) | bool
        or base_cluster_install_services.kafka | default(true) | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Select Ozone service host
      ansible.builtin.set_fact:
        base_cluster_ozone_service_host_id: >-
          {{
            base_cluster_cm_hosts.json['items']
            | selectattr('hostname', 'equalto', base_master_fqdn)
            | map(attribute='hostId')
            | first
            | default('')
          }}
      when: base_cluster_install_services.ozone | default(true) | bool

    - name: Check Ozone service host
      ansible.builtin.assert:
        that:
          - base_cluster_ozone_service_host_id | length > 0
        fail_msg: >-
          CM has no host matching base master {{ base_master_fqdn }} for required Ozone roles.
      when: base_cluster_install_services.ozone | default(true) | bool

    - name: Read Ozone roles
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/ozone/roles?view=summary
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_ozone_roles
      changed_when: false
      when: base_cluster_install_services.ozone | default(true) | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Select Ozone SCM role
      ansible.builtin.set_fact:
        base_cluster_ozone_scm_role: >-
          {{
            base_cluster_ozone_roles.json['items']
            | selectattr('type', 'equalto', 'STORAGE_CONTAINER_MANAGER')
            | selectattr('hostRef.hostname', 'equalto', base_master_fqdn)
            | first
            | default({})
          }}
      when: base_cluster_install_services.ozone | default(true) | bool

    - name: Require Ozone SCM role
      ansible.builtin.assert:
        that:
          - base_cluster_ozone_scm_role.name | default('') | length > 0
        fail_msg: >-
          Ozone is enabled but CM has no STORAGE_CONTAINER_MANAGER role.
          Correct the Ozone role assignment before cluster startup.
      when: base_cluster_install_services.ozone | default(true) | bool

    - name: Find missing Ozone roles
      ansible.builtin.set_fact:
        base_cluster_missing_ozone_roles: >-
          {{
            ['OZONE_RECON', 'S3_GATEWAY']
            | difference(
                base_cluster_ozone_roles.json['items']
                | map(attribute='type')
                | list
              )
          }}
      when: base_cluster_install_services.ozone | default(true) | bool

    - name: Add missing Ozone roles
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/ozone/roles
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        body_format: json
        body:
          items:
            - type: "{{ item }}"
              hostRef:
                hostId: "{{ base_cluster_ozone_service_host_id }}"
                hostname: "{{ base_master_fqdn }}"
        status_code: [200, 201, 204]
        follow_redirects: none
      loop: "{{ base_cluster_missing_ozone_roles }}"
      loop_control:
        label: "{{ item }}"
      register: base_cluster_ozone_role_create
      when: base_cluster_install_services.ozone | default(true) | bool
      changed_when: true
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Track Ozone role changes
      ansible.builtin.set_fact:
        base_cluster_required_config_changed: >-
          {{
            base_cluster_required_config_changed | bool
            or base_cluster_ozone_role_create.changed | default(false) | bool
          }}

    - name: Read Kafka roles
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/kafka/roles?view=summary
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_kafka_roles
      changed_when: false
      when:
        - base_cluster_install_services.kafka | default(true) | bool
        - base_cluster_kafka_metadata_store_effective == 'KRaft'
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Find workers missing Kafka KRaft roles
      ansible.builtin.set_fact:
        base_cluster_missing_kraft_hosts: >-
          {{
            base_worker_fqdns
            | difference(
                base_cluster_kafka_roles.json['items']
                | selectattr('type', 'equalto', 'KRAFT')
                | map(attribute='hostRef.hostname')
                | list
              )
          }}
      when:
        - base_cluster_install_services.kafka | default(true) | bool
        - base_cluster_kafka_metadata_store_effective == 'KRaft'

    - name: Add missing Kafka KRaft roles
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/kafka/roles
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        body_format: json
        body:
          items:
            - type: KRAFT
              hostRef:
                hostId: >-
                  {{
                    base_cluster_cm_hosts.json['items']
                    | selectattr('hostname', 'equalto', item)
                    | map(attribute='hostId')
                    | first
                  }}
                hostname: "{{ item }}"
        status_code: [200, 201, 204]
        follow_redirects: none
      loop: "{{ base_cluster_missing_kraft_hosts }}"
      loop_control:
        label: "{{ item }}"
      register: base_cluster_kraft_role_create
      when:
        - base_cluster_install_services.kafka | default(true) | bool
        - base_cluster_kafka_metadata_store_effective == 'KRaft'
      changed_when: true
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Track Kafka KRaft role changes
      ansible.builtin.set_fact:
        base_cluster_required_config_changed: >-
          {{
            base_cluster_required_config_changed | bool
            or base_cluster_kraft_role_create.changed | default(false) | bool
          }}
      when:
        - base_cluster_install_services.kafka | default(true) | bool
        - base_cluster_kafka_metadata_store_effective == 'KRaft'

    - name: Read existing initialization service states
      ansible.builtin.set_fact:
        base_cluster_existing_ozone_service: >-
          {{
            existing_cluster_services.json['items'] | default([])
            | selectattr('name', 'equalto', 'ozone')
            | first
            | default({})
          }}
        base_cluster_existing_hdfs_service: >-
          {{
            existing_cluster_services.json['items'] | default([])
            | selectattr('name', 'equalto', 'hdfs')
            | first
            | default({})
          }}
        base_cluster_existing_solr_service: >-
          {{
            existing_cluster_services.json['items'] | default([])
            | selectattr('name', 'equalto', 'solr')
            | first
            | default({})
          }}
        base_cluster_existing_hbase_service: >-
          {{
            existing_cluster_services.json['items'] | default([])
            | selectattr('name', 'equalto', 'hbase')
            | first
            | default({})
          }}
        base_cluster_existing_yarn_service: >-
          {{
            existing_cluster_services.json['items'] | default([])
            | selectattr('name', 'equalto', 'yarn')
            | first
            | default({})
          }}
        base_cluster_existing_spark3_service: >-
          {{
            existing_cluster_services.json['items'] | default([])
            | selectattr('name', 'equalto', 'spark3_on_yarn')
            | first
            | default({})
          }}
        base_cluster_existing_hive_service: >-
          {{
            existing_cluster_services.json['items'] | default([])
            | selectattr('name', 'equalto', 'hive')
            | first
            | default({})
          }}
        base_cluster_existing_impala_service: >-
          {{
            existing_cluster_services.json['items'] | default([])
            | selectattr('name', 'equalto', 'impala')
            | first
            | default({})
          }}
      when: existing_cluster.status == 200

    - name: Determine whether interrupted First Run recovery is required
      ansible.builtin.set_fact:
        base_cluster_recovery_required: >-
          {{
            existing_cluster.status == 200
            and not (base_cluster_partial_empty | bool)
            and not (
              existing_cluster.json.uuid is defined
              and base_cluster_initialization_marker.content is defined
              and (
                'uuid=' ~ existing_cluster.json.uuid
                in (base_cluster_initialization_marker.content | b64decode)
              )
            )
            and not (
              (
                not (base_cluster_install_services.ozone | default(true) | bool)
                or (
                  base_cluster_existing_ozone_service.serviceState | default('') == 'STARTED'
                  and base_cluster_existing_ozone_service.healthSummary | default('') == 'GOOD'
                )
              )
              and (
                not (base_cluster_install_services.hdfs | default(true) | bool)
                or (
                  base_cluster_existing_hdfs_service.serviceState | default('') == 'STARTED'
                  and base_cluster_existing_hdfs_service.healthSummary | default('') == 'GOOD'
                )
              )
              and (
                not (base_cluster_install_services.solr | default(false) | bool)
                or (
                  base_cluster_existing_solr_service.serviceState | default('') == 'STARTED'
                  and base_cluster_existing_solr_service.healthSummary | default('') == 'GOOD'
                )
              )
              and (
                not (base_cluster_install_services.hbase | default(true) | bool)
                or (
                  base_cluster_existing_hbase_service.serviceState | default('') == 'STARTED'
                  and base_cluster_existing_hbase_service.healthSummary | default('') == 'GOOD'
                )
              )
              and (
                not (base_cluster_install_services.yarn | default(true) | bool)
                or (
                  base_cluster_existing_yarn_service.serviceState | default('') == 'STARTED'
                  and base_cluster_existing_yarn_service.healthSummary | default('') == 'GOOD'
                )
              )
              and (
                not (base_cluster_install_services.spark3 | default(true) | bool)
                or (
                  base_cluster_existing_spark3_service.serviceState | default('') == 'STARTED'
                  and base_cluster_existing_spark3_service.healthSummary | default('') == 'GOOD'
                )
              )
              and (
                not (base_cluster_install_services.hive | default(true) | bool)
                or (
                  base_cluster_existing_hive_service.serviceState | default('') == 'STARTED'
                  and base_cluster_existing_hive_service.healthSummary | default('') == 'GOOD'
                )
              )
              and (
                not (base_cluster_install_services.impala | default(true) | bool)
                or (
                  base_cluster_existing_impala_service.serviceState | default('') == 'STARTED'
                  and base_cluster_existing_impala_service.healthSummary | default('') == 'GOOD'
                )
              )
            )
          }}

    - name: Prepare Kerberos before any new or recovery cluster service start
      ansible.builtin.include_tasks: common_tasks/prepare_cluster_kerberos_before_start.yml
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_create_required | bool or base_cluster_recovery_required | bool

    - name: Show interrupted First Run recovery
      ansible.builtin.debug:
        msg: >-
          The populated cluster has no matching initialization marker. Starting ZooKeeper, HDFS,
          and Ranger prerequisites, then reconciling only non-destructive HDFS and dependent
          service initialization artifacts. NameNode format and cluster First Run will not be
          invoked.
      when: base_cluster_recovery_required | bool

    - name: Stop partially running services before initialization recovery
      ansible.builtin.include_tasks: common_tasks/run_cm_service_setup_command.yml
      loop: >-
        {{
          (
            [{'service': 'ozone', 'command': 'stop'}]
            if (
              base_cluster_install_services.ozone | default(true) | bool
              and base_cluster_existing_ozone_service.serviceState | default('') == 'STARTED'
              and base_cluster_existing_ozone_service.healthSummary | default('') != 'GOOD'
            )
            else []
          )
          + (
            [{'service': 'solr', 'command': 'stop'}]
            if (
              base_cluster_install_services.solr | default(false) | bool
              and base_cluster_existing_solr_service.serviceState | default('') == 'STARTED'
              and base_cluster_existing_solr_service.healthSummary | default('') != 'GOOD'
            )
            else []
          )
          + (
            [{'service': 'hbase', 'command': 'stop'}]
            if (
              base_cluster_install_services.hbase | default(true) | bool
              and base_cluster_existing_hbase_service.serviceState | default('') == 'STARTED'
              and base_cluster_existing_hbase_service.healthSummary | default('') != 'GOOD'
            )
            else []
          )
          + (
            [{'service': 'yarn', 'command': 'stop'}]
            if (
              base_cluster_install_services.yarn | default(true) | bool
              and base_cluster_existing_yarn_service.serviceState | default('') == 'STARTED'
              and base_cluster_existing_yarn_service.healthSummary | default('') != 'GOOD'
            )
            else []
          )
        }}
      loop_control:
        loop_var: base_cluster_setup_command
        label: "{{ base_cluster_setup_command.service }}:{{ base_cluster_setup_command.command }}"
      when: base_cluster_recovery_required | bool

    - name: Start recovery prerequisite services
      ansible.builtin.include_tasks: common_tasks/run_cm_service_setup_command.yml
      loop: >-
        {{
          (
            [{'service': 'zookeeper', 'command': 'start'}]
            if (base_cluster_install_services.zookeeper | default(true) | bool)
            else []
          )
          + (
            [{'service': 'hdfs', 'command': 'start'}]
            if (base_cluster_install_services.hdfs | default(true) | bool)
            else []
          )
          + (
            [{'service': 'ranger', 'command': 'start'}]
            if (base_cluster_install_services.ranger | default(true) | bool)
            else []
          )
        }}
      loop_control:
        loop_var: base_cluster_setup_command
        label: "{{ base_cluster_setup_command.service }}:{{ base_cluster_setup_command.command }}"
      when: base_cluster_recovery_required | bool

    - name: Read YARN initialization paths
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/yarn/config?view=full
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_yarn_recovery_config
      changed_when: false
      when:
        - base_cluster_recovery_required | bool
        - base_cluster_install_services.yarn | default(true) | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Resolve YARN node labels directory
      ansible.builtin.set_fact:
        base_cluster_yarn_node_labels_dir: >-
          {{
            (
              base_cluster_yarn_recovery_config.json['items'] | default([])
              | selectattr('name', 'equalto', 'node_labels_root_dir')
              | map(attribute='value')
              | first
            )
            | default('/yarn/node-labels', true)
          }}
      when:
        - base_cluster_recovery_required | bool
        - base_cluster_install_services.yarn | default(true) | bool

    - name: Read Hive initialization paths
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/hive/config?view=full
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_hive_recovery_config
      changed_when: false
      when:
        - base_cluster_recovery_required | bool
        - base_cluster_install_services.hive | default(true) | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Resolve Hive external warehouse directory
      ansible.builtin.set_fact:
        base_cluster_hive_external_warehouse_dir: >-
          {{
            (
              base_cluster_hive_recovery_config.json['items'] | default([])
              | selectattr('name', 'equalto', 'hive_warehouse_external_directory')
              | map(attribute='value')
              | first
            )
            | default('/warehouse/tablespace/external/hive', true)
          }}
      when:
        - base_cluster_recovery_required | bool
        - base_cluster_install_services.hive | default(true) | bool

    - name: Recover HDFS temporary directory
      ansible.builtin.include_tasks: common_tasks/ensure_hdfs_tmp.yml
      when:
        - base_cluster_recovery_required | bool
        - base_cluster_install_services.hdfs | default(true) | bool

    - name: Recover YARN node-label directory
      ansible.builtin.include_tasks: common_tasks/reconcile_hdfs_directory.yml
      vars:
        hdfs_directory_path: "{{ base_cluster_yarn_node_labels_dir }}"
        hdfs_directory_mode: "700"
        hdfs_directory_owner: "yarn:yarn"
      when:
        - base_cluster_recovery_required | bool
        - base_cluster_install_services.hdfs | default(true) | bool
        - base_cluster_install_services.yarn | default(true) | bool

    - name: Build safe service initialization recovery commands
      ansible.builtin.set_fact:
        base_cluster_recovery_commands: >-
          {{
            (
              [{'service': 'ranger', 'command': 'SetupPluginServices'}]
              if (base_cluster_install_services.ranger | default(true) | bool)
              else []
            )
            + (
              [
                {'service': 'solr', 'command': 'createSolrHdfsHomeDir'},
                {'service': 'solr', 'command': 'initSolr'}
              ]
              if (
                base_cluster_install_services.solr | default(false) | bool
                and (
                  base_cluster_existing_solr_service.serviceState | default('') != 'STARTED'
                  or base_cluster_existing_solr_service.healthSummary | default('') != 'GOOD'
                )
              )
              else []
            )
            + (
              [
                {'service': 'hbase', 'command': 'hbaseCreateRoot'},
                {'service': 'hbase', 'command': 'hbaseCreateUserDirectory'}
              ]
              if (
                base_cluster_install_services.hbase | default(true) | bool
                and (
                  base_cluster_existing_hbase_service.serviceState | default('') != 'STARTED'
                  or base_cluster_existing_hbase_service.healthSummary | default('') != 'GOOD'
                )
              )
              else []
            )
            + (
              [
                {'service': 'yarn', 'command': 'yarnCreateJobHistoryDirCommand'},
                {'service': 'yarn', 'command': 'installMrFrameworkJars'}
              ]
              if (
                base_cluster_install_services.yarn | default(true) | bool
                and (
                  base_cluster_existing_yarn_service.serviceState | default('') != 'STARTED'
                  or base_cluster_existing_yarn_service.healthSummary | default('') != 'GOOD'
                )
              )
              else []
            )
            + (
              [
                {'service': 'spark3_on_yarn', 'command': 'CreateSparkHistoryDirCommand'},
                {'service': 'spark3_on_yarn', 'command': 'CreateSparkUserDirCommand'},
                {'service': 'spark3_on_yarn', 'command': 'CreateSparkDriverLogDirCommand'}
              ]
              if (
                base_cluster_install_services.spark3 | default(true) | bool
                and (
                  base_cluster_existing_spark3_service.serviceState | default('') != 'STARTED'
                  or base_cluster_existing_spark3_service.healthSummary | default('') != 'GOOD'
                )
              )
              else []
            )
            + (
              [
                {'service': 'hive', 'command': 'hiveCreateHiveUserDir'},
                {'service': 'hive', 'command': 'hiveCreateHiveWarehouse'},
                {
                  'service': 'hive',
                  'command': 'hiveCreateHiveWarehouseExternal',
                  'query': 'directory=' ~ (
                    base_cluster_hive_external_warehouse_dir
                    | regex_replace('^/warehouse/?', '')
                    | urlencode
                  )
                }
              ]
              if (
                base_cluster_install_services.hive | default(true) | bool
                and (
                  base_cluster_existing_hive_service.serviceState | default('') != 'STARTED'
                  or base_cluster_existing_hive_service.healthSummary | default('') != 'GOOD'
                )
              )
              else []
            )
            + (
              [{'service': 'impala', 'command': 'impalaCreateUserDir'}]
              if (
                base_cluster_install_services.impala | default(true) | bool
                and (
                  base_cluster_existing_impala_service.serviceState | default('') != 'STARTED'
                  or base_cluster_existing_impala_service.healthSummary | default('') != 'GOOD'
                )
              )
              else []
            )
          }}
      when: base_cluster_recovery_required | bool

    - name: Recover interrupted First Run service initialization
      ansible.builtin.include_tasks: common_tasks/run_cm_service_setup_command.yml
      loop: "{{ base_cluster_recovery_commands }}"
      loop_control:
        loop_var: base_cluster_setup_command
        label: "{{ base_cluster_setup_command.service }}:{{ base_cluster_setup_command.command }}"
      when: base_cluster_recovery_required | bool

    - name: Read Ozone SCM state before cluster startup
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/ozone/roles/{{ base_cluster_ozone_scm_role.name }}?view=summary
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_ozone_scm_state
      changed_when: false
      delegate_to: "{{ cm_cluster_module_delegate_to }}"
      when:
        - base_cluster_install_services.ozone | default(true) | bool
        - base_cluster_recovery_required | bool

    - name: Start Ozone SCM before other Ozone roles
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/ozone/roleCommands/start
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        body_format: json
        body:
          items:
            - "{{ base_cluster_ozone_scm_role.name }}"
        status_code: [200]
        follow_redirects: none
      register: base_cluster_ozone_scm_start
      delegate_to: "{{ cm_cluster_module_delegate_to }}"
      when:
        - base_cluster_install_services.ozone | default(true) | bool
        - base_cluster_recovery_required | bool
        - base_cluster_ozone_scm_state.json.roleState | default('') != 'STARTED'

    - name: Require Ozone SCM role start command
      ansible.builtin.assert:
        that:
          - base_cluster_ozone_scm_start.json['items'] | default([]) | length == 1
          - base_cluster_ozone_scm_start.json['items'][0].id is defined
        fail_msg: >-
          CM did not return exactly one command while starting the Ozone SCM role.
      when:
        - base_cluster_ozone_scm_start is defined
        - base_cluster_ozone_scm_start is not skipped

    - name: Wait for Ozone SCM role start
      ansible.builtin.include_tasks: common_tasks/wait_cm_api_command.yml
      vars:
        cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
        cm_api_command_id: "{{ base_cluster_ozone_scm_start.json['items'][0].id }}"
        cm_api_command_allow_already_exists: false
      when:
        - base_cluster_ozone_scm_start is defined
        - base_cluster_ozone_scm_start is not skipped
        - base_cluster_ozone_scm_start.json['items'][0].id is defined

    - name: Wait for Ozone SCM leader before starting DataNodes
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          scm_process_dir="$(
            ls -dt /var/run/cloudera-scm-agent/process/*-ozone-STORAGE_CONTAINER_MANAGER \
              2>/dev/null | head -1
          )"
          test -n "${scm_process_dir}" && test -f "${scm_process_dir}/ozone.keytab"
          export HADOOP_CONF_DIR="${scm_process_dir}/ozone-conf"
          export OZONE_CONF_DIR="${scm_process_dir}/ozone-conf"
          export KRB5CCNAME="/tmp/ansible-ozone-scm-leader-$$.ccache"
          cleanup() {
            kdestroy >/dev/null 2>&1 || true
            rm -f "${KRB5CCNAME}"
          }
          trap cleanup EXIT
          scm_principal="$(
            klist -kt "${scm_process_dir}/ozone.keytab" \
              | awk '$NF ~ /^scm\// { print $NF; exit }'
          )"
          test -n "${scm_principal}"
          kinit -kt "${scm_process_dir}/ozone.keytab" "${scm_principal}"
          scm_service_id="$(
            awk '
              /<name>ozone.scm.service.ids<\/name>/ {
                getline
                gsub(/.*<value>|<\/value>.*/, "")
                print
                exit
              }
            ' "${OZONE_CONF_DIR}/ozone-site.xml"
          )"
          test -n "${scm_service_id}"
          ozone_bin="$(command -v ozone || true)"
          if test -z "${ozone_bin}" && test -x /opt/cloudera/parcels/CDH/bin/ozone; then
            ozone_bin=/opt/cloudera/parcels/CDH/bin/ozone
          fi
          test -x "${ozone_bin}"
          "${ozone_bin}" admin scm roles --service-id="${scm_service_id}" 2>&1 \
            | grep -Eq '(^|:)LEADER(:|$)'
        executable: /bin/bash
      register: base_cluster_ozone_scm_leader
      until: base_cluster_ozone_scm_leader.rc == 0
      retries: "{{ base_cluster_ozone_scm_leader_retries }}"
      delay: "{{ base_cluster_ozone_scm_leader_delay }}"
      changed_when: false
      become: true
      connection: ssh
      delegate_to: "{{ groups[base_cluster_master_group][0] }}"
      when:
        - base_cluster_install_services.ozone | default(true) | bool
        - base_cluster_recovery_required | bool

    - name: Start Ozone roles after SCM leader recovery
      ansible.builtin.include_tasks: common_tasks/run_cm_service_setup_command.yml
      vars:
        base_cluster_setup_command:
          service: ozone
          command: start
      when:
        - base_cluster_install_services.ozone | default(true) | bool
        - base_cluster_recovery_required | bool

    - name: Determine cluster initialization action
      ansible.builtin.set_fact:
        base_cluster_first_run_required: >-
          {{ base_cluster_create_required | bool }}

    - name: Show cluster startup wait
      ansible.builtin.debug:
        msg: >-
          Cluster configuration and pre-First-Run security convergence are complete.
          Starting CM First Run; Jenkins will poll every
          {{ base_cluster_module_poll_interval }}s until CM finishes or the bounded wait expires.
      when: base_cluster_first_run_required | bool

    - name: Start {{ 'new' if base_cluster_create_required | bool else 'existing' }} base cluster with name {{ cdh_basecluster_name }}
      block:
        - name: Submit cluster First Run or start
          ansible.builtin.uri:
            url: >-
              {{
                cm_cluster_module_api_url
                ~ (
                  '/clusters/' ~ cdh_basecluster_name ~ '/commands/firstRun'
                  if base_cluster_first_run_required | bool
                  else '/clusters/' ~ cdh_basecluster_name ~ '/commands/start'
                )
              }}
            method: POST
            user: "{{ cm_admin_user }}"
            password: "{{ cm_admin_pass }}"
            force_basic_auth: yes
            validate_certs: no
            status_code: [200]
            follow_redirects: none
          register: base_cluster_initialization_command
          delegate_to: "{{ cm_cluster_module_delegate_to }}"

        - name: Wait for cluster startup
          ansible.builtin.include_tasks: common_tasks/wait_cm_api_command.yml
          vars:
            cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
            cm_api_command_id: "{{ base_cluster_initialization_command.json.id }}"
            cm_api_command_allow_already_exists: false
          when:
            - base_cluster_initialization_command.json.id is defined

      rescue:
        - name: Select failed cluster command
          ansible.builtin.set_fact:
            base_cluster_failed_command_id: >-
              {{ base_cluster_initialization_command.json.id | default('') }}

        - name: Get failed First Run command
          ansible.builtin.uri:
            url: >-
              {{ cm_cluster_module_api_url }}/commands/{{ base_cluster_failed_command_id }}?view=full
            method: GET
            user: "{{ cm_admin_user }}"
            password: "{{ cm_admin_pass }}"
            force_basic_auth: yes
            validate_certs: no
            status_code: [200]
            follow_redirects: none
          register: base_cluster_failed_command
          when: base_cluster_failed_command_id | length > 0
          changed_when: false
          delegate_to: "{{ cm_cluster_module_delegate_to }}"

        - name: Get failed First Run service commands
          ansible.builtin.uri:
            url: "{{ cm_cluster_module_api_url }}/commands/{{ item.id }}?view=full"
            method: GET
            user: "{{ cm_admin_user }}"
            password: "{{ cm_admin_pass }}"
            force_basic_auth: yes
            validate_certs: no
            status_code: [200]
            follow_redirects: none
          loop: >-
            {{
              base_cluster_failed_command.json.get('children', {}).get('items', [])
              | rejectattr('success', 'equalto', true)
              | list
            }}
          loop_control:
              label: "{{ item.get('serviceRef', {}).get('serviceDisplayName', item.name) }}"
          register: base_cluster_failed_service_commands
          when: base_cluster_failed_command.status | default(0) | int == 200
          changed_when: false
          delegate_to: "{{ cm_cluster_module_delegate_to }}"

        - name: Collect failed First Run service details
          ansible.builtin.set_fact:
            base_cluster_failed_service_details: >-
              {{
                base_cluster_failed_service_commands.results
                | default([])
                | selectattr('json', 'defined')
                | map(attribute='json')
                | list
              }}

        - name: Detect recoverable Knox readiness timeout
          ansible.builtin.set_fact:
            base_cluster_knox_readiness_recovery_candidate: >-
              {{
                base_cluster_first_run_required | bool
                and base_cluster_failed_service_details | length == 1
                and base_cluster_failed_service_details[0]
                  .get('serviceRef', {}).get('serviceName', '') == 'knox'
                and (
                  base_cluster_failed_service_details[0]
                  .get('children', {}).get('items', [])
                  | rejectattr('success', 'equalto', true)
                  | map(attribute='name')
                  | list
                ) == ['WaitForKnoxGatewayReadyToServe']
              }}

        - name: Wait for Knox after transient First Run readiness timeout
          ansible.builtin.uri:
            url: >-
              {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
              }}/services/knox?view=full
            method: GET
            user: "{{ cm_admin_user }}"
            password: "{{ cm_admin_pass }}"
            force_basic_auth: yes
            validate_certs: no
            status_code: [200]
            follow_redirects: none
          register: base_cluster_knox_readiness_recovery
          until:
            - base_cluster_knox_readiness_recovery.json.serviceState | default('') == 'STARTED'
            - base_cluster_knox_readiness_recovery.json.healthSummary | default('') == 'GOOD'
          retries: "{{ base_cluster_knox_readiness_recovery_retries | default(30) }}"
          delay: "{{ base_cluster_knox_readiness_recovery_delay | default(10) }}"
          failed_when: false
          changed_when: false
          delegate_to: "{{ cm_cluster_module_delegate_to }}"
          when: base_cluster_knox_readiness_recovery_candidate | bool

        - name: Confirm recoverable Knox readiness timeout
          ansible.builtin.set_fact:
            base_cluster_knox_readiness_recovered: >-
              {{
                base_cluster_knox_readiness_recovery_candidate | bool
                and base_cluster_knox_readiness_recovery.status | default(0) == 200
                and base_cluster_knox_readiness_recovery.json.serviceState | default('') == 'STARTED'
                and base_cluster_knox_readiness_recovery.json.healthSummary | default('') == 'GOOD'
              }}

        - name: Start full cluster after Knox readiness recovery
          ansible.builtin.uri:
            url: >-
              {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}/commands/start
            method: POST
            user: "{{ cm_admin_user }}"
            password: "{{ cm_admin_pass }}"
            force_basic_auth: yes
            validate_certs: no
            status_code: [200]
            follow_redirects: none
          register: base_cluster_post_knox_recovery_start
          delegate_to: "{{ cm_cluster_module_delegate_to }}"
          when: base_cluster_knox_readiness_recovered | bool

        - name: Require post-Knox recovery cluster start command
          ansible.builtin.assert:
            that:
              - base_cluster_post_knox_recovery_start.json.id is defined
            fail_msg: >-
              CM did not return a command ID while starting the cluster after
              Knox readiness recovery.
          when: base_cluster_knox_readiness_recovered | bool

        - name: Wait for full cluster start after Knox readiness recovery
          ansible.builtin.include_tasks: common_tasks/wait_cm_api_command.yml
          vars:
            cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
            cm_api_command_id: "{{ base_cluster_post_knox_recovery_start.json.id }}"
          when: base_cluster_knox_readiness_recovered | bool

        - name: Report recovered Knox First Run readiness timeout
          ansible.builtin.debug:
            msg: >-
              Knox became STARTED/GOOD after CM First Run timed out waiting for
              readiness. The full cluster start then completed successfully.
          when: base_cluster_knox_readiness_recovered | bool

        - name: Report failed First Run services
          ansible.builtin.fail:
            msg: |-
              Cluster startup failed (command {{ base_cluster_failed_command_id | default('unknown', true) }}).
              {% for result in base_cluster_failed_service_commands.results | default([]) %}
              - {{ result.json.get('serviceRef', {}).get('serviceDisplayName', result.json.name) }}: {{ result.json.resultMessage | default('unknown') }}
              {% for child in result.json.get('children', {}).get('items', []) if not (child.success | default(false) | bool) %}
                - {{ child.name }}: {{ child.resultMessage | default('unknown') }}
              {% endfor %}
              {% endfor %}
              Original error: {{ ansible_failed_result.msg | default('unknown') }}
          when: not (base_cluster_knox_readiness_recovered | default(false) | bool)

    - name: Ensure HDFS temporary directory after fresh First Run
      ansible.builtin.include_tasks: common_tasks/ensure_hdfs_tmp.yml
      when:
        - base_cluster_first_run_required | bool
        - base_cluster_install_services.hdfs | default(true) | bool

    - name: Refresh existing base cluster with name {{ cdh_basecluster_name }}
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/commands/deployClientConfigsAndRefresh
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_refresh_command
      when:
        - existing_cluster.status == 200
        - not (base_cluster_partial_empty | bool)
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Wait for base cluster refresh
      ansible.builtin.include_tasks: common_tasks/wait_cm_api_command.yml
      vars:
        cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
        cm_api_command_id: "{{ base_cluster_refresh_command.json.id }}"
        cm_api_command_allow_already_exists: false
      when:
        - base_cluster_refresh_command is defined
        - base_cluster_refresh_command.json.id is defined

    - name: Read base cluster HDFS authentication mode
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/hdfs/config?view=full
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_hdfs_auth_config
      changed_when: false
      when: base_cluster_enable_kerberos | default(true) | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Resolve base cluster Kerberos state
      ansible.builtin.set_fact:
        base_cluster_hdfs_authentication: >-
          {{
            (
              base_cluster_hdfs_auth_config.json['items'] | default([])
              | selectattr('name', 'equalto', 'hadoop_security_authentication')
              | map(attribute='value')
              | first
            )
            | default(
                (
                  base_cluster_hdfs_auth_config.json['items'] | default([])
                  | selectattr('name', 'equalto', 'hadoop_security_authentication')
                  | map(attribute='default')
                  | first
                ),
                true
              )
            | default('simple', true)
            | lower
          }}
      when: base_cluster_enable_kerberos | default(true) | bool

    - name: Determine whether Auto-TLS requires an existing cluster restart
      ansible.builtin.set_fact:
        base_cluster_autotls_restart_required: >-
          {{
            autotls_applied_this_run | default(false) | bool
            and existing_cluster.status == 200
            and not (base_cluster_recovery_required | bool)
            and (
              not (base_cluster_enable_kerberos | default(true) | bool)
              or base_cluster_hdfs_authentication | default('simple') == 'kerberos'
            )
          }}
      when: autotls_enabled | default(true) | bool

    - name: Stop existing secured cluster after enabling Auto-TLS
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}/commands/stop
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_autotls_stop_command
      when: base_cluster_autotls_restart_required | default(false) | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Wait for post-Auto-TLS cluster stop
      ansible.builtin.include_tasks: common_tasks/wait_cm_api_command.yml
      vars:
        cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
        cm_api_command_id: "{{ base_cluster_autotls_stop_command.json.id }}"
        cm_api_command_allow_already_exists: false
      when:
        - base_cluster_autotls_restart_required | default(false) | bool
        - base_cluster_autotls_stop_command.json.id is defined

    - name: Start existing secured cluster after enabling Auto-TLS
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}/commands/start
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_autotls_start_command
      when: base_cluster_autotls_restart_required | default(false) | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Wait for post-Auto-TLS cluster start
      ansible.builtin.include_tasks: common_tasks/wait_cm_api_command.yml
      vars:
        cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
        cm_api_command_id: "{{ base_cluster_autotls_start_command.json.id }}"
        cm_api_command_allow_already_exists: false
      when:
        - base_cluster_autotls_restart_required | default(false) | bool
        - base_cluster_autotls_start_command.json.id is defined

    - name: Refresh client configuration after Auto-TLS cluster restart
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/commands/deployClientConfigsAndRefresh
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_autotls_refresh_command
      when: base_cluster_autotls_restart_required | default(false) | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Wait for post-Auto-TLS client configuration refresh
      ansible.builtin.include_tasks: common_tasks/wait_cm_api_command.yml
      vars:
        cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
        cm_api_command_id: "{{ base_cluster_autotls_refresh_command.json.id }}"
        cm_api_command_allow_already_exists: false
      when:
        - base_cluster_autotls_restart_required | default(false) | bool
        - base_cluster_autotls_refresh_command.json.id is defined

    - name: Resolve expected KDC credential marker
      ansible.builtin.set_fact:
        base_cluster_kdc_admin_principal: >-
          {{
            krb5_kdc_admin_user
            if ('@' in (krb5_kdc_admin_user | string))
            else (krb5_kdc_admin_user ~ '@' ~ cluster_realm)
          }}
        base_cluster_kdc_credentials_marker: >-
          {{
            cm_krb_credentials_marker_path
            ~ '-'
            ~ (
              (
                (
                  krb5_kdc_admin_user
                  if ('@' in (krb5_kdc_admin_user | string))
                  else (krb5_kdc_admin_user ~ '@' ~ cluster_realm)
                )
                ~ '|' ~ cluster_realm ~ '|' ~ kdc_host
              )
              | hash('sha256')
            )
          }}
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'

    - name: Check KDC account-manager credential marker
      ansible.builtin.stat:
        path: "{{ base_cluster_kdc_credentials_marker }}"
      register: base_cluster_kdc_credentials
      changed_when: false
      become: true
      delegate_to: "{{ cm_manager_inventory_host }}"
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'

    - name: Check KDC reachability before cluster Kerberos transition
      ansible.builtin.wait_for:
        host: "{{ kdc_host }}"
        port: 88
        state: started
        connect_timeout: 5
        timeout: "{{ cm_krb_kdc_preflight_timeout }}"
      changed_when: false
      delegate_to: "{{ cm_manager_inventory_host }}"
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'

    - name: Require imported KDC account-manager credentials
      ansible.builtin.assert:
        that:
          - base_cluster_kdc_credentials.stat.exists | default(false) | bool
        fail_msg: >-
          Kerberos transition was requested, but the credential-import marker for
          {{ base_cluster_kdc_admin_principal }} is missing. Run
          30_setup_cm_krbs.yml successfully before playbook 31. The cluster has
          not been stopped or modified.
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'

    - name: Show base cluster Kerberos transition
      ansible.builtin.debug:
        msg: >-
          HDFS authentication is {{ base_cluster_hdfs_authentication }}.
          Stopping {{ cdh_basecluster_name }}, configuring Kerberos, generating
          credentials, restarting the cluster, and refreshing client configuration.
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'

    - name: Stop base cluster before Kerberos configuration
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}/commands/stop
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_kerberos_stop_command
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Wait for pre-Kerberos cluster stop
      ansible.builtin.include_tasks: common_tasks/wait_cm_api_command.yml
      vars:
        cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
        cm_api_command_id: "{{ base_cluster_kerberos_stop_command.json.id }}"
        cm_api_command_allow_already_exists: false
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'
        - base_cluster_kerberos_stop_command.json.id is defined

    - name: Configure base cluster for Kerberos
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/commands/configureForKerberos
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        body_format: json
        body: {}
        status_code: [200]
        follow_redirects: none
      register: base_cluster_kerberos_configure_command
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Wait for base cluster Kerberos configuration
      ansible.builtin.include_tasks: common_tasks/wait_cm_api_command.yml
      vars:
        cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
        cm_api_command_id: "{{ base_cluster_kerberos_configure_command.json.id }}"
        cm_api_command_allow_already_exists: false
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'
        - base_cluster_kerberos_configure_command.json.id is defined

    - name: Generate base cluster Kerberos credentials
      ansible.builtin.uri:
        url: "{{ cm_cluster_module_api_url }}/cm/commands/generateCredentials"
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_kerberos_credentials_command
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Wait for base cluster Kerberos credentials
      ansible.builtin.include_tasks: common_tasks/wait_cm_api_command.yml
      vars:
        cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
        cm_api_command_id: "{{ base_cluster_kerberos_credentials_command.json.id }}"
        cm_api_command_allow_already_exists: false
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'
        - base_cluster_kerberos_credentials_command.json.id is defined

    - name: Start Kerberized base cluster
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}/commands/start
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_kerberos_start_command
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Wait for Kerberized base cluster startup
      ansible.builtin.include_tasks: common_tasks/wait_cm_api_command.yml
      vars:
        cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
        cm_api_command_id: "{{ base_cluster_kerberos_start_command.json.id }}"
        cm_api_command_allow_already_exists: false
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'
        - base_cluster_kerberos_start_command.json.id is defined

    - name: Refresh Kerberized base cluster client configuration
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/commands/deployClientConfigsAndRefresh
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_kerberos_refresh_command
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Wait for Kerberized base cluster client refresh
      ansible.builtin.include_tasks: common_tasks/wait_cm_api_command.yml
      vars:
        cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
        cm_api_command_id: "{{ base_cluster_kerberos_refresh_command.json.id }}"
        cm_api_command_allow_already_exists: false
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'
        - base_cluster_kerberos_refresh_command.json.id is defined

    - name: Verify base cluster HDFS Kerberos authentication
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/hdfs/config?view=full
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_hdfs_auth_verify
      changed_when: false
      when: base_cluster_enable_kerberos | default(true) | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Require Kerberos authentication on base cluster HDFS
      ansible.builtin.assert:
        that:
          - >-
            (
              base_cluster_hdfs_auth_verify.json['items'] | default([])
              | selectattr('name', 'equalto', 'hadoop_security_authentication')
              | map(attribute='value')
              | first
              | default('', true)
              | lower
            ) == 'kerberos'
        fail_msg: >-
          CM completed the Kerberos workflow, but HDFS authentication is not
          reported as kerberos. Do not record the cluster initialization marker.
      when: base_cluster_enable_kerberos | default(true) | bool

    - name: Refresh final Auto-TLS state
      ansible.builtin.set_fact:
        cm_autotls_config_fetched_this_play: false
      when: autotls_enabled | default(true) | bool

    - name: Verify final Cloudera Manager Auto-TLS state
      ansible.builtin.import_tasks: common_tasks/fetch_cm_autotls_api_state.yml
      when: autotls_enabled | default(true) | bool

    - name: Require Cloudera Manager Auto-TLS
      ansible.builtin.assert:
        that:
          - cm_autotls_api_enabled | default(false) | bool
        fail_msg: >-
          Auto-TLS was requested, but Cloudera Manager does not report an enabled
          AUTO_TLS_TYPE. Do not record the cluster initialization marker.
      when: autotls_enabled | default(true) | bool

    - name: Restart Cloudera Management Service after base cluster convergence
      ansible.builtin.include_tasks: common_tasks/restart_cm_management_service_api.yml
      vars:
        cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
        cm_api_uri_delegate_to: "{{ cm_cluster_module_delegate_to }}"
      when: base_cluster_restart_cms_after_start | default(true) | bool

    - name: Require completed Cloudera Management Service restart
      ansible.builtin.assert:
        that:
          - cms_service_state_for_restart.status | default(0) | int == 200
          - cms_service_state_for_restart.json.serviceState | default('') == 'STARTED'
          - cms_restart_api_cmd.json.id is defined
        fail_msg: >-
          Base cluster convergence completed, but Cloudera Management Service
          was not running or CM did not return a restart command. Do not record
          the cluster initialization marker.
      when: base_cluster_restart_cms_after_start | default(true) | bool

    - name: Read final cluster state
      ansible.builtin.uri:
        url: "{{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}?view=full"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_final_state
      changed_when: false
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Record completed base cluster initialization
      ansible.builtin.copy:
        dest: "{{ base_cluster_initialization_marker_path }}"
        owner: root
        group: root
        mode: "0600"
        content: |
          cluster={{ cdh_basecluster_name }}
          uuid={{ base_cluster_final_state.json.uuid }}
      become: true
      delegate_to: "{{ cm_manager_inventory_host }}"

    - name: Check ZooKeeper roles
      ansible.builtin.import_tasks: common_tasks/verify_base_cluster_zookeeper_servers.yml

    - name: Show cluster result
      ansible.builtin.debug:
        msg: >-
          Base cluster with name {{ cdh_basecluster_name }} is ready:
          state={{ base_cluster_final_state.json.clusterState | default('unknown') }},
          health={{ base_cluster_final_state.json.healthSummary | default('unknown') }}.

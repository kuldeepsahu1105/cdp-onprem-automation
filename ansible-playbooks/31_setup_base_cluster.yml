### ansible-playbook -i inventory.ini 31_setup_base_cluster.yml
#
# Install CDP Base Cluster on base-masters/base-workers (services: see base_cluster_install_services).
# This is separate from Cloudera Management Service (CMS) — see 28_setup_cm_cms.yml
# Prerequisite: run 27_setup_cm_autotls.yml and 30_setup_cm_krbs.yml first when
# Auto-TLS and Kerberos are enabled. This playbook verifies those prerequisites;
# it does not regenerate the CMCA or restart cloudera-scm-server.
---
- name: Install cloudera.cluster collection on control node
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Run CDH base cluster install collection tasks
      ansible.builtin.import_role:
        name: cdh_base_cluster
        tasks_from: install_collection

- name: Install CDP Base Cluster via Cloudera Manager
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Run CDH base cluster setup base cluster tasks
      ansible.builtin.import_role:
        name: cdh_base_cluster
        tasks_from: setup_base_cluster

### ansible-playbook -i inventory.ini 31_setup_base_cluster.yml
#
# Install CDP Base Cluster on base-masters/base-workers (services: see base_cluster_install_services).
# This is separate from Cloudera Management Service (CMS) — see 28_setup_cm_cms.yml
# Prerequisite: run 27_setup_cm_autotls.yml and 30_setup_cm_krbs.yml first when
# Auto-TLS and Kerberos are enabled. This playbook verifies those prerequisites;
# it does not regenerate the CMCA or restart cloudera-scm-server.
---
- name: Install cloudera.cluster collection on control node
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Install cloudera.cluster collection
      ansible.builtin.import_tasks: common_tasks/install_cloudera_collection.yml

- name: Install CDP Base Cluster via Cloudera Manager
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Prepare CM API
      ansible.builtin.import_tasks: common_tasks/prepare_cm_security_api.yml

    - name: Read Cloudera Manager Auto-TLS prerequisite
      ansible.builtin.include_tasks: common_tasks/fetch_cm_autotls_api_state.yml
      when:
        - base_cluster_enable_autotls | default(true) | bool
        - autotls_enabled | default(true) | bool

    - name: Require Cloudera Manager Auto-TLS before CDH installation
      ansible.builtin.assert:
        that:
          - cm_autotls_api_enabled | default(false) | bool
        fail_msg: >-
          CDH_INSTALL requires CM Auto-TLS to be complete, but CM does not report
          AUTO_TLS_TYPE enabled. Run the CM_TLS_KRB_LDAP phase first. CDH_INSTALL
          never runs generateCmca or restarts cloudera-scm-server.
      when:
        - base_cluster_enable_autotls | default(true) | bool
        - autotls_enabled | default(true) | bool

    - name: Check inventory groups
      ansible.builtin.assert:
        that:
          - base_cluster_master_group in groups
          - groups[base_cluster_master_group] | length > 0
          - base_cluster_worker_group in groups
          - groups[base_cluster_worker_group] | length > 0
        fail_msg: >-
          Base cluster inventory groups '{{ base_cluster_master_group }}' and
          '{{ base_cluster_worker_group }}' must exist and contain hosts.

    - name: Check required service settings
      ansible.builtin.assert:
        that:
          - base_cluster_database_host | string | trim | length > 0
          - not (base_cluster_install_services.ozone | default(true) | bool) or (base_cluster_ozone_service_id | string | trim | length > 0)
          - not (base_cluster_install_services.hive | default(true) | bool) or (base_cluster_hive_database_name | string | trim | length > 0)
          - not (base_cluster_install_services.hive | default(true) | bool) or (base_cluster_hive_database_user | string | trim | length > 0)
          - not (base_cluster_install_services.hive | default(true) | bool) or (base_cluster_hive_database_password | string | length > 0)
          - not (base_cluster_install_services.hue | default(true) | bool) or (base_cluster_hue_database_name | string | trim | length > 0)
          - not (base_cluster_install_services.hue | default(true) | bool) or (base_cluster_hue_database_user | string | trim | length > 0)
          - not (base_cluster_install_services.hue | default(true) | bool) or (base_cluster_hue_database_password | string | length > 0)
          - not (base_cluster_install_services.ranger | default(true) | bool) or (base_cluster_ranger_admin_password | string | length > 0)
          - not (base_cluster_install_services.ranger | default(true) | bool) or (base_cluster_ranger_keyadmin_password | string | length > 0)
          - not (base_cluster_install_services.ranger | default(true) | bool) or (base_cluster_ranger_tagsync_password | string | length > 0)
          - not (base_cluster_install_services.ranger | default(true) | bool) or (base_cluster_ranger_usersync_password | string | length > 0)
          - not (base_cluster_install_services.ranger | default(true) | bool) or (base_cluster_ranger_admin_password | string | length >= 8)
          - not (base_cluster_install_services.ranger | default(true) | bool) or (base_cluster_ranger_admin_password | regex_search('[A-Za-z]'))
          - not (base_cluster_install_services.ranger | default(true) | bool) or (base_cluster_ranger_admin_password | regex_search('[0-9]'))
          - not (base_cluster_install_services.knox | default(true) | bool) or (base_cluster_knox_master_secret | string | length > 0)
          - not (base_cluster_install_services.kafka | default(true) | bool) or (base_cluster_kafka_metadata_store | lower in ['kraft', 'zookeeper'])
          - not (base_cluster_enable_kerberos | default(true) | bool) or (base_cluster_install_services.hdfs | default(true) | bool)
        fail_msg: >-
          Required base-cluster service or database settings are empty. Set the
          base_cluster_* values through ANSIBLE_GROUP_VARS_YAML or an Ansible vault.
          base_cluster_kafka_metadata_store must be KRaft or Zookeeper. Kerberos
          enablement requires HDFS so its final authentication mode can be verified.

    - name: Check service dependencies
      ansible.builtin.assert:
        that:
          - base_cluster_install_services[item.dependency] | default(false) | bool
        fail_msg: >-
          base_cluster_install_services.{{ item.service }} requires
          base_cluster_install_services.{{ item.dependency }}.
      when: base_cluster_install_services[item.service] | default(false) | bool
      loop:
        - { service: hdfs, dependency: zookeeper }
        - { service: hdfs, dependency: core_settings }
        - { service: yarn, dependency: hdfs }
        - { service: yarn, dependency: zookeeper }
        - { service: tez, dependency: yarn }
        - { service: spark3, dependency: yarn }
        - { service: hive, dependency: hdfs }
        - { service: hive, dependency: yarn }
        - { service: hive, dependency: zookeeper }
        - { service: hive_on_tez, dependency: hive }
        - { service: hive_on_tez, dependency: tez }
        - { service: hbase, dependency: hdfs }
        - { service: hbase, dependency: zookeeper }
        - { service: hue, dependency: hive }
        - { service: hue, dependency: hdfs }
        - { service: impala, dependency: hdfs }
        - { service: impala, dependency: hive }
        - { service: atlas, dependency: hdfs }
        - { service: atlas, dependency: hbase }
        - { service: atlas, dependency: kafka }
        - { service: atlas, dependency: solr }
        - { service: ranger, dependency: hdfs }
        - { service: ranger, dependency: solr }
        - { service: solr, dependency: hdfs }
        - { service: solr, dependency: zookeeper }
        - { service: nifi, dependency: hdfs }
        - { service: nifi, dependency: zookeeper }
        - { service: phoenix, dependency: hbase }
        - { service: iceberg, dependency: hive }
        - { service: iceberg, dependency: impala }
        - { service: iceberg, dependency: spark3 }
      loop_control:
        label: "{{ item.service }} requires {{ item.dependency }}"

    - name: Check Kafka ZooKeeper dependency
      ansible.builtin.assert:
        that:
          - base_cluster_install_services.zookeeper | default(false) | bool
        fail_msg: >-
          Kafka metadata mode Zookeeper requires base_cluster_install_services.zookeeper=true.
      when:
        - base_cluster_install_services.kafka | default(true) | bool
        - base_cluster_kafka_metadata_store | lower == 'zookeeper'

    - name: Resolve Kafka metadata store
      ansible.builtin.set_fact:
        base_cluster_kafka_metadata_store_effective: >-
          {{ 'KRaft' if base_cluster_kafka_metadata_store | lower == 'kraft' else 'Zookeeper' }}

    - name: Set master hostname
      ansible.builtin.set_fact:
        base_master_fqdn: >-
          {%- set hostname = hostvars[groups[base_cluster_master_group][0]].cldr_hostname -%}
          {{ hostname if hostname.endswith('.' ~ cluster_domain) else hostname ~ '.' ~ cluster_domain }}

    - name: Set worker hostnames
      ansible.builtin.set_fact:
        base_worker_fqdns: >-
          {%- set hostname = hostvars[item].cldr_hostname -%}
          {{
            base_worker_fqdns | default([])
            + [hostname if hostname.endswith('.' ~ cluster_domain) else hostname ~ '.' ~ cluster_domain]
          }}
      loop: "{{ groups[base_cluster_worker_group] }}"
      loop_control:
        label: "{{ item }}"

    - name: Build worker assignments
      ansible.builtin.set_fact:
        base_worker_host_entries: >-
          {%- set hostname = hostvars[item].cldr_hostname -%}
          {%- set fqdn = hostname if hostname.endswith('.' ~ cluster_domain)
              else hostname ~ '.' ~ cluster_domain -%}
          {{
            base_worker_host_entries | default([])
            + [{
              'name': fqdn,
              'host_ip': hostvars[item].private_ip
                         | default(hostvars[item].ansible_host, true),
              'host_template': 'Worker'
            }]
          }}
      loop: "{{ groups[base_cluster_worker_group] }}"
      loop_control:
        label: "{{ item }}"

    - name: Build cluster hosts
      ansible.builtin.set_fact:
        base_cluster_hosts: >-
          {{
            [{
              'name': base_master_fqdn,
              'host_ip': hostvars[groups[base_cluster_master_group][0]].private_ip
                         | default(hostvars[groups[base_cluster_master_group][0]].ansible_host, true),
              'host_template': 'Master'
            }]
            + base_worker_host_entries
          }}

    - name: Show cluster targets
      ansible.builtin.debug:
        msg:
          - "Cluster name: {{ cdh_basecluster_name }}"
          - "Configured CDH parcel version: {{ cdh_parcel_version }}"
          - "Master host: {{ base_master_fqdn }}"
          - "Worker hosts: {{ base_worker_fqdns }}"

    - name: Build cluster specification
      ansible.builtin.set_fact:
        base_cluster_spec: "{{ lookup('template', 'base_cluster_cluster_spec.j2') | from_yaml }}"

    - name: Find native booleans incompatible with collection v4 configuration modules
      ansible.builtin.set_fact:
        base_cluster_native_boolean_configs: >-
          {%- set invalid = [] -%}
          {%- for service in base_cluster_spec.services -%}
            {%- for config in service.config | default({}) | dict2items -%}
              {%- if config.value is boolean -%}
                {%- set _ = invalid.append(service.name ~ '.config.' ~ config.key) -%}
              {%- endif -%}
            {%- endfor -%}
            {%- for role_group in service.role_groups | default([]) -%}
              {%- for config in role_group.config | default({}) | dict2items -%}
                {%- if config.value is boolean -%}
                  {%- set _ = invalid.append(
                    service.name ~ '.' ~ role_group.type ~ '.config.' ~ config.key
                  ) -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ invalid }}

    - name: Require string values for boolean CM configurations
      ansible.builtin.assert:
        that:
          - base_cluster_native_boolean_configs | length == 0
        fail_msg: >-
          cloudera.cluster v4.4.0 converts native booleans to capitalized strings
          that CM cannot parse. Quote these configuration values as lowercase strings:
          {{ base_cluster_native_boolean_configs | join(', ') }}.

    - name: Select runtime services requiring health verification
      ansible.builtin.set_fact:
        base_cluster_runtime_service_names: >-
          {%- set runtime_services = [] -%}
          {%- for service in base_cluster_spec.services -%}
            {%- set runtime_roles =
              service.role_groups | default([])
              | rejectattr('type', 'equalto', 'GATEWAY')
              | list
            -%}
            {%- if runtime_roles | length > 0 -%}
              {%- set _ = runtime_services.append(service.name) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ runtime_services }}

    - name: Show enabled services
      ansible.builtin.debug:
        msg: >-
          Services to install:
          {{ base_cluster_spec.services | map(attribute='name') | list | join(', ') }}

    - name: Show enabled Iceberg engine capability
      ansible.builtin.debug:
        msg: >-
          Iceberg is enabled through Hive, Impala, and Spark3. CDP 7.3.2 and the
          cloudera.cluster service catalog do not expose a standalone ICEBERG service.
      when: base_cluster_install_services.iceberg | default(true) | bool

    - name: Find invalid role mappings
      ansible.builtin.set_fact:
        base_cluster_invalid_role_groups: >-
          {%- set invalid = [] -%}
          {%- for host_template in base_cluster_spec.host_templates -%}
            {%- for assignment in host_template.role_groups | default([]) -%}
              {%- set matching_services =
                base_cluster_spec.services
                | selectattr('type', 'equalto', assignment.service)
                | list
              -%}
              {%- if
                matching_services | length == 0
                or (
                  matching_services[0].role_groups | default([])
                  | selectattr('type', 'equalto', assignment.type)
                  | list
                  | length == 0
                )
              -%}
                {%- set _ = invalid.append(
                  host_template.name ~ ':' ~ assignment.service ~ '/' ~ assignment.type
                ) -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ invalid }}

    - name: Check role mappings
      ansible.builtin.assert:
        that:
          - base_cluster_invalid_role_groups | length == 0
        fail_msg: >-
          Host-template roles missing matching service base role groups:
          {{ base_cluster_invalid_role_groups | join(', ') }}.

    - name: Configure parcel repository
      ansible.builtin.include_tasks: common_tasks/configure_cm_parcel_repo_api.yml
      vars:
        cm_parcel_repo_force_refresh: true
      when: parcel_repo is defined

    - name: Read configured CDH parcel repository manifest
      ansible.builtin.uri:
        url: "{{ parcel_repo | regex_replace('/+$', '') }}/manifest.json"
        method: GET
        user: "{{ cm_repo_username if (cm_repo_source | default('public')) == 'public' else omit }}"
        password: "{{ cm_repo_password if (cm_repo_source | default('public')) == 'public' else omit }}"
        force_basic_auth: "{{ (cm_repo_source | default('public')) == 'public' }}"
        validate_certs: no
        status_code: [200]
        follow_redirects: safe
        return_content: true
        timeout: 60
      register: base_cluster_cdh_manifest
      changed_when: false
      failed_when: false
      until: base_cluster_cdh_manifest.status | default(0) == 200
      retries: 5
      delay: 10
      delegate_to: "{{ cm_api_uri_delegate_to | default('localhost', true) }}"

    - name: Parse configured CDH parcel repository manifest
      ansible.builtin.set_fact:
        base_cluster_cdh_manifest_data: "{{ base_cluster_cdh_manifest.content | from_json }}"
      no_log: true
      when: base_cluster_cdh_manifest.status | default(0) == 200

    - name: Default unavailable CDH parcel repository manifest
      ansible.builtin.set_fact:
        base_cluster_cdh_manifest_data: {}
      when: base_cluster_cdh_manifest_data is not defined

    - name: Select published CDH parcel versions for configured release
      ansible.builtin.set_fact:
        base_cluster_cdh_parcel_versions_available: >-
          {{
            base_cluster_cdh_manifest_data.get('parcels', [])
            | map(attribute='parcelName')
            | select(
                'match',
                '^CDH-'
                ~ (
                    cdh_parcel_version
                    .split('.')[:-1]
                    | join('.')
                    | regex_escape
                  )
                ~ '[.][0-9]+-.*[.]parcel$'
              )
            | map('regex_replace', '^CDH-', '')
            | map('regex_replace', '-[^-]+[.]parcel$', '')
            | unique
            | list
          }}

    - name: Require unambiguous CDH parcel before cluster mutation
      ansible.builtin.assert:
        that:
          - base_cluster_cdh_manifest.status | default(0) == 200
          - base_cluster_cdh_parcel_versions_available | length == 1
        fail_msg: >-
          Could not resolve one CDH parcel for configured release {{ cdh_version }}
          from {{ parcel_repo | regex_replace('/+$', '') }}/manifest.json after
          the Cloudera Manager repository refresh. Configured parcel version:
          {{ cdh_parcel_version }}. Matching published versions:
          {{ base_cluster_cdh_parcel_versions_available | join(', ') | default('(none)', true) }}.
          Repository HTTP status:
          {{ base_cluster_cdh_manifest.status | default('unknown') }}.
          Response: {{ base_cluster_cdh_manifest.msg | default('none') }}.
          Published parcel files: {{
            base_cluster_cdh_manifest_data.get('parcels', [])
            | map(attribute='parcelName')
            | join(', ')
          }}. Verify parcel_repo/REMOTE_PARCEL_REPO_URLS, archive credentials,
          cdh_version, and cdh_numeric_version before cluster mutation.

    - name: Use CDH parcel version published by configured repository
      ansible.builtin.set_fact:
        base_cluster_cdh_parcel_version_effective: >-
          {{ base_cluster_cdh_parcel_versions_available | first }}

    - name: Show resolved CDH parcel version
      ansible.builtin.debug:
        msg:
          - "Configured CDH parcel version: {{ cdh_parcel_version }}"
          - "Repository CDH parcel version: {{ base_cluster_cdh_parcel_version_effective }}"

    - name: Resolve whether the CFM parcel is required
      ansible.builtin.set_fact:
        base_cluster_cfm_parcel_required: >-
          {{
            base_cluster_install_services.nifi | default(false) | bool
            or base_cluster_install_services.nifi_registry | default(false) | bool
          }}

    - name: Read configured CFM parcel repository manifest
      ansible.builtin.uri:
        url: "{{ cfm_parcel_yum_tars_repo_url | regex_replace('/+$', '') }}/manifest.json"
        method: GET
        user: "{{ cm_repo_username if (cm_repo_source | default('public')) == 'public' else omit }}"
        password: "{{ cm_repo_password if (cm_repo_source | default('public')) == 'public' else omit }}"
        force_basic_auth: "{{ (cm_repo_source | default('public')) == 'public' }}"
        validate_certs: no
        status_code: [200]
        follow_redirects: safe
        return_content: true
        timeout: 60
      register: base_cluster_cfm_manifest
      changed_when: false
      no_log: true
      when: base_cluster_cfm_parcel_required | bool
      delegate_to: "{{ cm_api_uri_delegate_to | default('localhost', true) }}"

    - name: Parse configured CFM parcel repository manifest
      ansible.builtin.set_fact:
        base_cluster_cfm_manifest_data: "{{ base_cluster_cfm_manifest.content | from_json }}"
      no_log: true
      when: base_cluster_cfm_parcel_required | bool

    - name: Select published CFM parcel version
      ansible.builtin.set_fact:
        base_cluster_cfm_parcel_versions_available: >-
          {{
            base_cluster_cfm_manifest_data.get('parcels', [])
            | map(attribute='parcelName')
            | select('match', '^CFM-.*[.]parcel$')
            | map('regex_replace', '^CFM-', '')
            | map('regex_replace', '-[^-]+[.]parcel$', '')
            | unique
            | list
          }}
      when: base_cluster_cfm_parcel_required | bool

    - name: Require unambiguous CFM parcel before cluster mutation
      ansible.builtin.assert:
        that:
          - base_cluster_cfm_parcel_versions_available | length == 1
        fail_msg: >-
          Could not resolve one CFM parcel from
          {{ cfm_parcel_yum_tars_repo_url | regex_replace('/+$', '') }}/manifest.json.
          Matching versions:
          {{ base_cluster_cfm_parcel_versions_available | default([]) | join(', ') | default('(none)', true) }}.
      when: base_cluster_cfm_parcel_required | bool

    - name: Use CFM parcel version published by configured repository
      ansible.builtin.set_fact:
        base_cluster_cfm_parcel_version_effective: >-
          {{ base_cluster_cfm_parcel_versions_available | first }}
      when: base_cluster_cfm_parcel_required | bool

    - name: Prepare cluster module connection
      ansible.builtin.import_tasks: common_tasks/resolve_cm_cluster_module_endpoint.yml

    - name: Check requested cluster
      ansible.builtin.uri:
        url: "{{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200, 404]
        follow_redirects: none
      register: base_cluster_requested_lookup
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Check legacy default cluster
      ansible.builtin.uri:
        url: "{{ cm_cluster_module_api_url }}/clusters/{{ base_cluster_legacy_name }}"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200, 404]
        follow_redirects: none
      register: base_cluster_legacy_lookup
      when:
        - base_cluster_requested_lookup.status == 404
        - cdh_basecluster_name == base_cluster_default_name
        - base_cluster_legacy_name | default('') | length > 0
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Preserve existing legacy default cluster name
      ansible.builtin.set_fact:
        cdh_basecluster_name: "{{ base_cluster_legacy_name }}"
      when:
        - base_cluster_requested_lookup.status == 404
        - base_cluster_legacy_lookup.status | default(404) == 200

    - name: Discover existing CM clusters for default-name adoption
      ansible.builtin.uri:
        url: "{{ cm_cluster_module_api_url }}/clusters?view=summary"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_discovery_list
      changed_when: false
      when:
        - base_cluster_requested_lookup.status == 404
        - base_cluster_legacy_lookup.status | default(404) == 404
        - cdh_basecluster_name == base_cluster_default_name
        - base_cluster_adopt_by_master_host | default(true) | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Read hosts assigned to existing CM clusters
      ansible.builtin.uri:
        url: "{{ cm_cluster_module_api_url }}/clusters/{{ item.name | urlencode }}/hosts"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      loop: >-
        {{
          base_cluster_discovery_list.json['items'] | default([])
          if not (base_cluster_discovery_list.skipped | default(false) | bool)
          else []
        }}
      loop_control:
        label: "{{ item.name }}"
      register: base_cluster_discovery_host_results
      changed_when: false
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Initialize existing cluster host matches
      ansible.builtin.set_fact:
        base_cluster_host_matches: []

    - name: Match existing cluster containing configured base master
      ansible.builtin.set_fact:
        base_cluster_host_matches: >-
          {{
            base_cluster_host_matches
            + [{
                'name': item.item.name,
                'hostnames': (
                  item.json['items'] | default([])
                  | map(attribute='hostname')
                  | list
                )
              }]
          }}
      loop: "{{ base_cluster_discovery_host_results.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name | default('unknown') }}"
      when:
        - not (item.skipped | default(false) | bool)
        - base_master_fqdn in (item.json['items'] | default([]) | map(attribute='hostname') | list)

    - name: Require unambiguous existing cluster host ownership
      ansible.builtin.assert:
        that:
          - base_cluster_host_matches | length <= 1
        fail_msg: >-
          Configured base master {{ base_master_fqdn }} appears in multiple CM clusters:
          {{ base_cluster_host_matches | map(attribute='name') | join(', ') }}.
          Refusing automatic adoption; set cdh_basecluster_name explicitly.

    - name: Require discovered cluster to contain every configured base host
      ansible.builtin.assert:
        that:
          - >-
            (
              base_cluster_hosts | map(attribute='name') | list
              | difference(base_cluster_host_matches[0].hostnames)
              | length
            ) == 0
        fail_msg: >-
          CM cluster {{ base_cluster_host_matches[0].name }} owns base master
          {{ base_master_fqdn }}, but does not contain all configured base hosts. Missing:
          {{
            base_cluster_hosts | map(attribute='name') | list
            | difference(base_cluster_host_matches[0].hostnames)
            | join(', ')
          }}. Refusing to adopt a partially matching cluster.
      when: base_cluster_host_matches | length == 1

    - name: Adopt existing cluster discovered from base master ownership
      ansible.builtin.set_fact:
        cdh_basecluster_name: "{{ base_cluster_host_matches[0].name }}"
      when: base_cluster_host_matches | length == 1

    - name: Read adopted existing cluster
      ansible.builtin.uri:
        url: "{{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name | urlencode }}"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_discovered_lookup
      changed_when: false
      when: base_cluster_host_matches | length == 1
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Report adopted cluster discovered from host ownership
      ansible.builtin.debug:
        msg: >-
          Requested default cluster {{ base_cluster_default_name }} is absent, but all configured base hosts
          already belong to CM cluster {{ cdh_basecluster_name }}. Adopting that cluster for
          idempotent reconciliation instead of attempting duplicate host assignment.
      when: base_cluster_host_matches | length == 1

    - name: Select existing cluster lookup
      ansible.builtin.set_fact:
        existing_cluster: >-
          {{
            base_cluster_discovered_lookup
            if (base_cluster_discovered_lookup.status | default(404) == 200)
            else (
            base_cluster_legacy_lookup
            if (
              base_cluster_requested_lookup.status == 404
              and base_cluster_legacy_lookup.status | default(404) == 200
            )
            else base_cluster_requested_lookup
            )
          }}

    - name: Check cluster hosts
      ansible.builtin.uri:
        url: "{{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}/hosts"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: existing_cluster_hosts
      changed_when: false
      when: existing_cluster.status == 200
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Check cluster services
      ansible.builtin.uri:
        url: "{{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}/services?view=summary"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: existing_cluster_services
      changed_when: false
      when: existing_cluster.status == 200
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Select existing Core Settings service
      ansible.builtin.set_fact:
        base_cluster_existing_core_settings: >-
          {{
            (existing_cluster_services.json | default({})).get('items', [])
            | selectattr('type', 'equalto', 'CORE_SETTINGS')
            | list
          }}

    - name: Require at most one existing Core Settings service
      ansible.builtin.assert:
        that:
          - base_cluster_existing_core_settings | length <= 1
        fail_msg: >-
          Cluster {{ cdh_basecluster_name }} unexpectedly has
          {{ base_cluster_existing_core_settings | length }} CORE_SETTINGS services.

    - name: Resolve existing Core Settings service name
      ansible.builtin.set_fact:
        base_cluster_core_settings_service_name: >-
          {{
            base_cluster_existing_core_settings[0].name
            if base_cluster_existing_core_settings | length == 1
            else 'core-settings'
          }}

    - name: Check existing cluster host templates
      ansible.builtin.uri:
        url: "{{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}/hostTemplates"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_existing_host_templates
      changed_when: false
      when: existing_cluster.status == 200
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Read base cluster initialization marker
      ansible.builtin.slurp:
        src: "{{ base_cluster_initialization_marker_path }}"
      register: base_cluster_initialization_marker
      failed_when: false
      changed_when: false
      become: true
      delegate_to: "{{ cm_manager_inventory_host }}"
      when: existing_cluster.status == 200

    - name: Detect incomplete cluster initialization
      ansible.builtin.set_fact:
        base_cluster_initialization_incomplete: >-
          {{
            existing_cluster.status == 200
            and not (
              existing_cluster.json.uuid is defined
              and base_cluster_initialization_marker.content is defined
              and (
                'uuid=' ~ existing_cluster.json.uuid
                in (base_cluster_initialization_marker.content | b64decode)
              )
            )
          }}

    - name: Read roles assigned to existing cluster services
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/{{ item.name }}/roles?view=summary
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      loop: "{{ existing_cluster_services.json['items'] | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      register: base_cluster_existing_service_roles
      changed_when: false
      when: existing_cluster.status == 200
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Initialize existing cluster role count
      ansible.builtin.set_fact:
        base_cluster_existing_role_count: 0

    - name: Count roles assigned to existing cluster services
      ansible.builtin.set_fact:
        base_cluster_existing_role_count: >-
          {{
            base_cluster_existing_role_count | int
            + (item.json['items'] | default([]) | length)
          }}
      loop: "{{ base_cluster_existing_service_roles.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name | default('unknown') }}"
      when: not (item.skipped | default(false) | bool)

    - name: Calculate expected Base cluster role count
      ansible.builtin.set_fact:
        base_cluster_expected_role_count: >-
          {%- set expected = namespace(count=0) -%}
          {%- for template in base_cluster_spec.host_templates -%}
            {%- set multiplier = (
              base_worker_fqdns | length
              if template.name == 'Worker'
              else 1
            ) -%}
            {%- set required_roles =
              template.role_groups
              | rejectattr('service', 'equalto', 'HUE')
              | list
            -%}
            {%- set hue_required_roles =
              template.role_groups
              | selectattr('service', 'equalto', 'HUE')
              | rejectattr('type', 'equalto', 'KT_RENEWER')
              | list
            -%}
            {%- set expected.count = expected.count
              + ((required_roles + hue_required_roles) | length * multiplier) -%}
          {%- endfor -%}
          {{ expected.count }}

    # Before templates or roles exist, every phased operation is idempotent and
    # an interrupted install can resume in place (including parcel download).
    - name: Detect resumable pre-template cluster topology
      ansible.builtin.set_fact:
        base_cluster_pre_template_resume_safe: >-
          {{
            existing_cluster.status == 200
            and base_cluster_initialization_incomplete | bool
            and base_cluster_existing_role_count | int == 0
            and (
              (
                (base_cluster_existing_host_templates.json | default({})).get('items', [])
                | map(attribute='name')
                | list
              )
              | difference(
                  base_cluster_spec.host_templates
                  | map(attribute='name')
                  | list
                )
              | length
            ) == 0
            and existing_cluster.json.clusterState | default('') != 'STARTED'
            and (
              existing_cluster_services.json['items'] | default([])
              | selectattr('serviceState', 'defined')
              | selectattr('serviceState', 'equalto', 'STARTED')
              | list
              | length
            ) == 0
          }}

    # With startRoles=false no role can initialize storage before the complete
    # topology exists. A later malformed partial topology is safe to recreate,
    # while a complete topology that entered First Run must be preserved.
    - name: Detect incomplete never-started cluster topology
      ansible.builtin.set_fact:
        base_cluster_never_started_topology_incomplete: >-
          {{
            existing_cluster.status == 200
            and base_cluster_initialization_incomplete | bool
            and base_cluster_existing_role_count | int
                < base_cluster_expected_role_count | int
            and existing_cluster.json.clusterState | default('') != 'STARTED'
            and (
              existing_cluster_services.json['items'] | default([])
              | selectattr('serviceState', 'defined')
              | selectattr('serviceState', 'equalto', 'STARTED')
              | list
              | length
            ) == 0
          }}

    - name: Detect incomplete cluster
      ansible.builtin.set_fact:
        base_cluster_partial_empty: >-
          {{
            existing_cluster.status == 200
            and not (base_cluster_pre_template_resume_safe | bool)
            and (
              existing_cluster_hosts.json['items'] | default([]) | length == 0
              or base_cluster_never_started_topology_incomplete | bool
            )
          }}
        base_cluster_missing_service_types: >-
          {{
            (
              base_cluster_spec.services
              | map(attribute='type')
              | list
              | difference(
                  existing_cluster_services.json['items'] | default([])
                  | map(attribute='type')
                  | list
                )
            )
            if existing_cluster.status == 200
            else []
          }}

    - name: Show existing cluster state
      ansible.builtin.debug:
        msg: >-
          Base cluster with name {{ cdh_basecluster_name }} already exists:
          state={{ existing_cluster.json.clusterState | default('unknown') }},
          hosts={{ existing_cluster_hosts.json['items'] | default([]) | length }},
          services={{ existing_cluster_services.json['items'] | default([]) | map(attribute='type') | sort | join(', ') }}.
      when: existing_cluster.status == 200

    - name: Show incomplete cluster recovery
      ansible.builtin.debug:
        msg: >-
          Base cluster '{{ cdh_basecluster_name }}' is an uninitialized partial topology
          ({{
            'zero assigned hosts'
            if (existing_cluster_hosts.json['items'] | default([]) | length == 0)
            else (
              base_cluster_existing_role_count | string
              ~ '/' ~ base_cluster_expected_role_count | string
              ~ ' assigned roles'
            )
          }}), indicating interrupted module creation. Deleting only this never-started
          partial cluster before recreating its complete service and role topology.
      when: base_cluster_partial_empty | bool

    - name: Show resumable phased cluster recovery
      ansible.builtin.debug:
        msg: >-
          Base cluster '{{ cdh_basecluster_name }}' stopped before roles were created.
          Existing host templates are absent or match the requested topology. Resuming
          the phased install in place and preserving parcel download/distribution.
      when: base_cluster_pre_template_resume_safe | bool

    - name: Delete incomplete base cluster with name {{ cdh_basecluster_name }}
      ansible.builtin.uri:
        url: "{{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}"
        method: DELETE
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200, 202, 204, 404]
        follow_redirects: none
      when: base_cluster_partial_empty | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Wait for cluster deletion
      ansible.builtin.uri:
        url: "{{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200, 404]
        follow_redirects: none
      register: base_cluster_partial_delete_wait
      until: base_cluster_partial_delete_wait.status == 404
      retries: 30
      delay: 5
      changed_when: false
      when: base_cluster_partial_empty | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Set cluster creation state
      ansible.builtin.set_fact:
        base_cluster_create_required: >-
          {{
            existing_cluster.status == 404
            or (base_cluster_partial_empty | bool)
            or (base_cluster_pre_template_resume_safe | bool)
          }}

    - name: Check existing cluster services
      ansible.builtin.assert:
        that:
          - base_cluster_missing_service_types | length == 0
        fail_msg: >-
          Existing populated base cluster with name {{ cdh_basecluster_name }} is missing requested
          service types: {{ base_cluster_missing_service_types | join(', ') }}. The cluster module
          cannot safely reconcile service topology on an existing populated cluster.
      when:
        - existing_cluster.status == 200
        - not (base_cluster_create_required | bool)

    - name: Show cluster creation wait
      ansible.builtin.debug:
        msg: >-
          Creating the CM cluster in reference order: cluster shell, hosts, parcel,
          dependency-ordered services, host templates, and role assignments.
      when: base_cluster_create_required | bool

    - name: Install fresh Base cluster in working reference sequence
      ansible.builtin.include_tasks: common_tasks/base_cluster_reference_install.yml
      when: base_cluster_create_required | bool

    - name: Reset required configuration change state
      ansible.builtin.set_fact:
        base_cluster_required_config_changed: false

    - name: Read initialized Ozone identity before existing-cluster reconciliation
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/ozone/config?view=full
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_existing_ozone_config
      changed_when: false
      when:
        - existing_cluster.status == 200
        - not (base_cluster_partial_empty | bool)
        - base_cluster_install_services.ozone | default(true) | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Preserve initialized Ozone service identity
      ansible.builtin.set_fact:
        base_cluster_ozone_service_id_effective: >-
          {{
            (
              (
                base_cluster_existing_ozone_config.json['items'] | default([])
                | selectattr('name', 'equalto', 'ozone.service.id')
                | map(attribute='value')
                | first
              )
              | default(base_cluster_ozone_service_id, true)
            )
            if (
              existing_cluster.status == 200
              and not (base_cluster_partial_empty | bool)
            )
            else base_cluster_ozone_service_id
          }}
        base_cluster_ozone_primordial_node_effective: >-
          {{
            (
              (
                base_cluster_existing_ozone_config.json['items'] | default([])
                | selectattr('name', 'equalto', 'ozone.scm.primordial.node.id')
                | map(attribute='value')
                | first
              )
              | default(base_master_fqdn, true)
            )
            if (
              existing_cluster.status == 200
              and not (base_cluster_partial_empty | bool)
            )
            else base_master_fqdn
          }}
      when: base_cluster_install_services.ozone | default(true) | bool

    - name: Report preserved existing Ozone identity
      ansible.builtin.debug:
        msg: >-
          Preserving initialized Ozone identity:
          service_id={{ base_cluster_ozone_service_id_effective }},
          primordial_node={{ base_cluster_ozone_primordial_node_effective }}.
          Existing service IDs are not rewritten during cluster adoption.
      when:
        - existing_cluster.status == 200
        - not (base_cluster_partial_empty | bool)
        - base_cluster_install_services.ozone | default(true) | bool

    - name: Configure Ozone requirements
      ansible.builtin.include_tasks: common_tasks/reconcile_cm_config_api.yml
      vars:
        cm_config_display_name: Ozone
        cm_config_endpoint: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}/services/ozone/config
        cm_config_desired:
          ozone.service.id: "{{ base_cluster_ozone_service_id_effective }}"
          ozone.scm.primordial.node.id: "{{ base_cluster_ozone_primordial_node_effective }}"
          ozone.security.enabled: >-
            {{ 'true' if base_cluster_enable_kerberos | default(true) | bool else 'false' }}
          hdfs_service: "{{ 'hdfs' if base_cluster_install_services.hdfs | default(true) else '' }}"
          solr_service: "{{ 'solr' if base_cluster_install_services.solr | default(false) else '' }}"
      when: base_cluster_install_services.ozone | default(true) | bool

    - name: Configure Core Settings security
      ansible.builtin.include_tasks: common_tasks/reconcile_cm_config_api.yml
      vars:
        cm_config_display_name: Core Settings security
        cm_config_endpoint: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/{{ base_cluster_core_settings_service_name | default('core-settings') }}/config
        cm_config_desired:
          hadoop_security_authorization: >-
            {{ 'true' if base_cluster_enable_kerberos | default(true) | bool else 'false' }}
          hadoop_security_authentication: >-
            {{ 'kerberos' if base_cluster_enable_kerberos | default(true) | bool else 'simple' }}
      when: base_cluster_install_services.core_settings | default(true) | bool

    - name: Configure ZooKeeper security
      ansible.builtin.include_tasks: common_tasks/reconcile_cm_config_api.yml
      vars:
        cm_config_display_name: ZooKeeper security
        cm_config_endpoint: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/zookeeper/config
        cm_config_desired:
          zookeeper_datadir_autocreate: "true"
          quorum_auth_enable_sasl: >-
            {{ 'true' if base_cluster_enable_kerberos | default(true) | bool else 'false' }}
          enableSecurity: >-
            {{ 'true' if base_cluster_enable_kerberos | default(true) | bool else 'false' }}
      when: base_cluster_install_services.zookeeper | default(true) | bool

    - name: Configure HDFS security
      ansible.builtin.include_tasks: common_tasks/reconcile_cm_config_api.yml
      vars:
        cm_config_display_name: HDFS security
        cm_config_endpoint: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/hdfs/config
        cm_config_desired:
          dfs_encrypt_data_transfer_algorithm: AES/CTR/NoPadding
          hadoop_secure_web_ui: >-
            {{ 'true' if base_cluster_enable_kerberos | default(true) | bool else 'false' }}
      when: base_cluster_install_services.hdfs | default(true) | bool

    - name: Configure YARN security
      ansible.builtin.include_tasks: common_tasks/reconcile_cm_config_api.yml
      vars:
        cm_config_display_name: YARN security
        cm_config_endpoint: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/yarn/config
        cm_config_desired:
          hadoop_secure_web_ui: >-
            {{ 'true' if base_cluster_enable_kerberos | default(true) | bool else 'false' }}
      when: base_cluster_install_services.yarn | default(true) | bool

    - name: Configure Kafka security and ZooKeeper chroot
      ansible.builtin.include_tasks: common_tasks/reconcile_cm_config_api.yml
      vars:
        cm_config_display_name: Kafka security
        cm_config_endpoint: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/kafka/config
        cm_config_desired: >-
          {{
            {
              'kerberos.auth.enable':
                ('true' if base_cluster_enable_kerberos | default(true) | bool else 'false')
            }
            | combine(
                {'zookeeper.chroot': '/kafka'}
                if base_cluster_kafka_metadata_store_effective == 'Zookeeper'
                else {}
              )
          }}
      when: base_cluster_install_services.kafka | default(true) | bool

    - name: Configure HBase security
      ansible.builtin.include_tasks: common_tasks/reconcile_cm_config_api.yml
      vars:
        cm_config_display_name: HBase security
        cm_config_endpoint: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/hbase/config
        cm_config_desired:
          hbase_thriftserver_security_authentication: >-
            {{ 'auth-conf' if base_cluster_enable_kerberos | default(true) | bool else 'none' }}
          hbase_security_authentication: >-
            {{ 'kerberos' if base_cluster_enable_kerberos | default(true) | bool else 'simple' }}
          hbase_security_authorization: >-
            {{ 'true' if base_cluster_enable_kerberos | default(true) | bool else 'false' }}
      when: base_cluster_install_services.hbase | default(true) | bool

    - name: Configure Atlas security
      ansible.builtin.include_tasks: common_tasks/reconcile_cm_config_api.yml
      vars:
        cm_config_display_name: Atlas security
        cm_config_endpoint: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/atlas/config
        cm_config_desired:
          kerberos.auth.enable: >-
            {{ 'true' if base_cluster_enable_kerberos | default(true) | bool else 'false' }}
      when: base_cluster_install_services.atlas | default(true) | bool

    - name: Configure Solr security
      ansible.builtin.include_tasks: common_tasks/reconcile_cm_config_api.yml
      vars:
        cm_config_display_name: Solr security
        cm_config_endpoint: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/solr/config
        cm_config_desired:
          solr_security_authentication: >-
            {{ 'kerberos' if base_cluster_enable_kerberos | default(true) | bool else 'none' }}
      when: base_cluster_install_services.solr | default(true) | bool

    - name: Configure Hive database
      ansible.builtin.include_tasks: common_tasks/reconcile_cm_config_api.yml
      vars:
        cm_config_display_name: Hive database
        cm_config_endpoint: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}/services/hive/config
        cm_config_desired:
          hive_metastore_database_host: "{{ base_cluster_database_host }}"
          hive_metastore_database_port: "{{ base_cluster_database_port }}"
          hive_metastore_database_type: postgresql
          hive_metastore_database_name: "{{ base_cluster_hive_database_name }}"
          hive_metastore_database_user: "{{ base_cluster_hive_database_user }}"
          hive_metastore_database_password: "{{ base_cluster_hive_database_password }}"
        cm_config_secret_names:
          - hive_metastore_database_password
      when: base_cluster_install_services.hive | default(true) | bool

    - name: Repair stale CM Hive Metastore canary catalogs
      ansible.builtin.include_tasks: common_tasks/repair_hive_cm_canary_catalogs.yml
      when:
        - existing_cluster.status == 200
        - base_cluster_repair_hive_canary_catalogs | default(true) | bool
        - base_cluster_install_services.hive | default(true) | bool

    - name: Configure Hue database
      ansible.builtin.include_tasks: common_tasks/reconcile_cm_config_api.yml
      vars:
        cm_config_display_name: Hue database
        cm_config_endpoint: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}/services/hue/config
        cm_config_desired:
          database_host: "{{ base_cluster_database_host }}"
          database_port: "{{ base_cluster_database_port }}"
          database_type: postgresql
          database_name: "{{ base_cluster_hue_database_name }}"
          database_user: "{{ base_cluster_hue_database_user }}"
          database_password: "{{ base_cluster_hue_database_password }}"
        cm_config_secret_names:
          - database_password
      when: base_cluster_install_services.hue | default(true) | bool

    - name: Read Kafka role config groups
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/kafka/roleConfigGroups?view=summary
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_kafka_role_groups
      changed_when: false
      when: base_cluster_install_services.kafka | default(true) | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Select Kafka Broker role config group
      ansible.builtin.set_fact:
        base_cluster_kafka_broker_group: >-
          {{
            base_cluster_kafka_role_groups.json['items']
            | selectattr('roleType', 'equalto', 'KAFKA_BROKER')
            | map(attribute='name')
            | first
            | default('')
          }}
      when: base_cluster_install_services.kafka | default(true) | bool

    - name: Check Kafka Broker role config group
      ansible.builtin.assert:
        that:
          - base_cluster_kafka_broker_group | length > 0
        fail_msg: Kafka service has no KAFKA_BROKER base role config group.
      when: base_cluster_install_services.kafka | default(true) | bool

    - name: Configure Kafka Broker metadata store
      ansible.builtin.include_tasks: common_tasks/reconcile_cm_config_api.yml
      vars:
        cm_config_display_name: Kafka Broker metadata store
        cm_config_endpoint: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/kafka/roleConfigGroups/{{ base_cluster_kafka_broker_group }}/config
        cm_config_desired:
          metadata.store: "{{ base_cluster_kafka_metadata_store_effective }}"
      when: base_cluster_install_services.kafka | default(true) | bool

    - name: Configure Ranger database and passwords
      ansible.builtin.include_tasks: common_tasks/reconcile_cm_config_api.yml
      vars:
        cm_config_display_name: Ranger database and passwords
        cm_config_endpoint: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}/services/ranger/config
        cm_config_desired:
          ranger_database_host: "{{ base_cluster_database_host }}"
          ranger_database_port: "{{ base_cluster_database_port }}"
          ranger_database_type: postgresql
          ranger_database_name: "{{ base_cluster_ranger_database_name }}"
          ranger_database_user: "{{ base_cluster_ranger_database_user }}"
          ranger_database_password: "{{ base_cluster_ranger_database_password }}"
          rangeradmin_user_password: "{{ base_cluster_ranger_admin_password }}"
          keyadmin_user_password: "{{ base_cluster_ranger_keyadmin_password }}"
          rangertagsync_user_password: "{{ base_cluster_ranger_tagsync_password }}"
          rangerusersync_user_password: "{{ base_cluster_ranger_usersync_password }}"
        cm_config_secret_names:
          - ranger_database_password
          - rangeradmin_user_password
          - keyadmin_user_password
          - rangertagsync_user_password
          - rangerusersync_user_password
      when: base_cluster_install_services.ranger | default(true) | bool

    - name: Initialize Knox CDP discovery change flags
      ansible.builtin.set_fact:
        base_cluster_knox_gateway_site_changed: false
        base_cluster_knox_kerberos_config_changed: false
        base_cluster_knox_autotls_trust_changed: false
      when: base_cluster_install_services.knox | default(true) | bool

    - name: Configure Knox database
      ansible.builtin.include_tasks: common_tasks/reconcile_cm_config_api.yml
      vars:
        cm_config_display_name: Knox database
        cm_config_endpoint: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}/services/knox/config
        cm_config_desired:
          knox_gateway_database_host: "{{ base_cluster_database_host }}"
          knox_gateway_database_port: "{{ base_cluster_database_port }}"
          knox_gateway_database_type: postgresql
          knox_gateway_database_name: "{{ base_cluster_knox_database_name }}"
          knox_gateway_database_user: "{{ base_cluster_knox_database_user }}"
          knox_gateway_database_password: "{{ base_cluster_knox_database_password }}"
        cm_config_secret_names:
          - knox_gateway_database_password
      when: base_cluster_install_services.knox | default(true) | bool

    - name: Find Knox role config group
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/knox/roleConfigGroups?view=summary
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_knox_role_groups
      changed_when: false
      when: base_cluster_install_services.knox | default(true) | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Select Knox Gateway role config group
      ansible.builtin.set_fact:
        base_cluster_knox_gateway_group: >-
          {{
            base_cluster_knox_role_groups.json['items']
            | selectattr('roleType', 'equalto', 'KNOX_GATEWAY')
            | map(attribute='name')
            | first
            | default('')
          }}
      when: base_cluster_install_services.knox | default(true) | bool

    - name: Check Knox Gateway role config group
      ansible.builtin.assert:
        that:
          - base_cluster_knox_gateway_group | length > 0
        fail_msg: Knox service has no KNOX_GATEWAY base role config group.
      when: base_cluster_install_services.knox | default(true) | bool

    - name: Configure Knox master secret
      ansible.builtin.include_tasks: common_tasks/reconcile_cm_config_api.yml
      vars:
        cm_config_display_name: Knox Gateway
        cm_config_endpoint: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/knox/roleConfigGroups/{{ base_cluster_knox_gateway_group }}/config
        cm_config_desired:
          gateway_master_secret: "{{ base_cluster_knox_master_secret }}"
        cm_config_secret_names:
          - gateway_master_secret
      when: base_cluster_install_services.knox | default(true) | bool

    - name: Set Knox gateway frontend URL for topology rewrite
      ansible.builtin.set_fact:
        base_cluster_knox_gateway_frontend_url_effective: >-
          {{
            base_cluster_knox_gateway_frontend_url | default('', true) | trim
            if (base_cluster_knox_gateway_frontend_url | default('', true) | trim | length > 0)
            else ('https://' ~ base_master_fqdn ~ ':8443/gateway/')
          }}
      when: base_cluster_install_services.knox | default(true) | bool

    - name: Configure Knox gateway-site safety valve for CM topology discovery
      ansible.builtin.include_tasks: common_tasks/reconcile_cm_config_api.yml
      vars:
        cm_config_display_name: Knox gateway-site safety valve
        cm_config_endpoint: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/knox/roleConfigGroups/{{ base_cluster_knox_gateway_group }}/config
        cm_config_desired:
          conf/gateway-site.xml_role_safety_valve: >-
            {{ lookup('template', 'knox_gateway_site_safety_valve.xml.j2') | trim }}
      when:
        - base_cluster_install_services.knox | default(true) | bool
        - base_cluster_knox_configure_gateway_site | default(true) | bool

    - name: Record Knox gateway-site configuration change
      ansible.builtin.set_fact:
        base_cluster_knox_gateway_site_changed: >-
          {{
            base_cluster_knox_gateway_site_changed | default(false) | bool
            or (cm_config_updates | default([]) | length > 0)
          }}
      when:
        - base_cluster_install_services.knox | default(true) | bool
        - base_cluster_knox_configure_gateway_site | default(true) | bool

    - name: Configure Knox Kerberos authentication for secured clusters
      ansible.builtin.include_tasks: common_tasks/reconcile_cm_config_api.yml
      vars:
        cm_config_display_name: Knox Kerberos
        cm_config_endpoint: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/knox/config
        cm_config_desired:
          kerberos.auth.enabled: >-
            {{ 'true' if base_cluster_enable_kerberos | default(true) | bool else 'false' }}
      when:
        - base_cluster_install_services.knox | default(true) | bool
        - base_cluster_knox_configure_kerberos | default(true) | bool

    - name: Record Knox Kerberos configuration change
      ansible.builtin.set_fact:
        base_cluster_knox_kerberos_config_changed: >-
          {{
            base_cluster_knox_kerberos_config_changed | default(false) | bool
            or (cm_config_updates | default([]) | length > 0)
          }}
      when:
        - base_cluster_install_services.knox | default(true) | bool
        - base_cluster_knox_configure_kerberos | default(true) | bool

    - name: Read CM hosts for required service roles
      ansible.builtin.uri:
        url: "{{ cm_cluster_module_api_url }}/hosts?view=summary"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_cm_hosts
      changed_when: false
      when: >-
        base_cluster_install_services.ozone | default(true) | bool
        or base_cluster_install_services.kafka | default(true) | bool
        or base_cluster_install_services.hue | default(true) | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Select Base master CM host
      ansible.builtin.set_fact:
        base_cluster_master_cm_host_id: >-
          {{
            base_cluster_cm_hosts.json['items']
            | selectattr('hostname', 'equalto', base_master_fqdn)
            | map(attribute='hostId')
            | first
            | default('')
          }}

    - name: Check Base master CM host
      ansible.builtin.assert:
        that:
          - base_cluster_master_cm_host_id | length > 0
        fail_msg: >-
          CM has no host matching base master {{ base_master_fqdn }} for required
          service roles.
      when: >-
        base_cluster_install_services.ozone | default(true) | bool
        or base_cluster_install_services.kafka | default(true) | bool
        or base_cluster_install_services.hue | default(true) | bool

    - name: Read Hue roles
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/hue/roles?view=summary
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_hue_roles
      changed_when: false
      when: base_cluster_install_services.hue | default(true) | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Find Hue hosts missing Kerberos Ticket Renewer
      ansible.builtin.set_fact:
        base_cluster_missing_hue_kt_renewer_hosts: >-
          {%- set required_hosts = [] -%}
          {%- set renewer_hosts = [] -%}
          {%- for role in base_cluster_hue_roles.json['items'] | default([]) -%}
            {%- if role.type in ['HUE_SERVER', 'HUE_DATA_EXPLORER'] -%}
              {%- set _ = required_hosts.append(role.hostRef.hostname) -%}
            {%- elif role.type == 'KT_RENEWER' -%}
              {%- set _ = renewer_hosts.append(role.hostRef.hostname) -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set missing = required_hosts | unique | difference(renewer_hosts | unique) -%}
          {%- set host_refs = [] -%}
          {%- for host in base_cluster_cm_hosts.json['items'] | default([]) -%}
            {%- if host.hostname in missing -%}
              {%- set _ = host_refs.append({
                'hostId': host.hostId,
                'hostname': host.hostname
              }) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ host_refs }}
      when: base_cluster_install_services.hue | default(true) | bool

    - name: Require CM host references for Hue Ticket Renewers
      ansible.builtin.assert:
        that:
          - >-
            base_cluster_missing_hue_kt_renewer_hosts | length
            == (
              base_cluster_hue_roles.json['items'] | default([])
              | selectattr('type', 'in', ['HUE_SERVER', 'HUE_DATA_EXPLORER'])
              | map(attribute='hostRef.hostname')
              | unique
              | difference(
                  base_cluster_hue_roles.json['items'] | default([])
                  | selectattr('type', 'equalto', 'KT_RENEWER')
                  | map(attribute='hostRef.hostname')
                  | unique
                )
              | length
            )
        fail_msg: >-
          CM host inventory does not contain every Hue host that requires a
          colocated KT_RENEWER role.
      when: base_cluster_install_services.hue | default(true) | bool

    - name: Add missing Hue Kerberos Ticket Renewer roles
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/hue/roles
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        body_format: json
        body:
          items:
            - type: KT_RENEWER
              hostRef: "{{ item }}"
        status_code: [200, 201, 204]
        follow_redirects: none
      loop: "{{ base_cluster_missing_hue_kt_renewer_hosts }}"
      loop_control:
        label: "{{ item.hostname }}"
      register: base_cluster_hue_kt_renewer_create
      when: base_cluster_install_services.hue | default(true) | bool
      changed_when: true
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Track Hue Kerberos Ticket Renewer role changes
      ansible.builtin.set_fact:
        base_cluster_required_config_changed: >-
          {{
            base_cluster_required_config_changed | bool
            or base_cluster_hue_kt_renewer_create.changed | default(false) | bool
          }}
      when: base_cluster_install_services.hue | default(true) | bool

    - name: Read Ozone roles
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/ozone/roles?view=summary
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_ozone_roles
      changed_when: false
      when: base_cluster_install_services.ozone | default(true) | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Select Ozone SCM roles and control host
      ansible.builtin.set_fact:
        base_cluster_ozone_scm_roles: >-
          {{
            base_cluster_ozone_roles.json['items']
            | selectattr('type', 'equalto', 'STORAGE_CONTAINER_MANAGER')
            | list
          }}
        base_cluster_ozone_scm_role: >-
          {{
            base_cluster_ozone_roles.json['items']
            | selectattr('type', 'equalto', 'STORAGE_CONTAINER_MANAGER')
            | selectattr('hostRef.hostname', 'equalto', base_master_fqdn)
            | first
            | default({})
          }}
      when: base_cluster_install_services.ozone | default(true) | bool

    - name: Find missing Ozone roles
      ansible.builtin.set_fact:
        base_cluster_missing_ozone_roles: >-
          {{
            (
              ['STORAGE_CONTAINER_MANAGER']
              if (
                base_cluster_ozone_scm_roles | length == 0
                and base_cluster_initialization_incomplete | default(false) | bool
                and (
                  existing_cluster_services.json['items'] | default([])
                  | selectattr('name', 'equalto', 'ozone')
                  | map(attribute='serviceState')
                  | first
                  | default('')
                ) != 'STARTED'
              )
              else []
            )
            + ['OZONE_RECON', 'S3_GATEWAY']
            | difference(
                base_cluster_ozone_roles.json['items']
                | map(attribute='type')
                | list
              )
          }}
      when: base_cluster_install_services.ozone | default(true) | bool

    - name: Add missing Ozone roles
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/ozone/roles
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        body_format: json
        body:
          items:
            - type: "{{ item }}"
              hostRef:
                hostId: "{{ base_cluster_master_cm_host_id }}"
                hostname: "{{ base_master_fqdn }}"
        status_code: [200, 201, 204]
        follow_redirects: none
      loop: "{{ base_cluster_missing_ozone_roles }}"
      loop_control:
        label: "{{ item }}"
      register: base_cluster_ozone_role_create
      when: base_cluster_install_services.ozone | default(true) | bool
      changed_when: true
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Track Ozone role changes
      ansible.builtin.set_fact:
        base_cluster_required_config_changed: >-
          {{
            base_cluster_required_config_changed | bool
            or base_cluster_ozone_role_create.changed | default(false) | bool
          }}

    - name: Refresh Ozone roles after reconciliation
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/ozone/roles?view=summary
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_ozone_roles_reconciled
      changed_when: false
      when: base_cluster_install_services.ozone | default(true) | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Select reconciled Ozone SCM roles and control host
      ansible.builtin.set_fact:
        base_cluster_ozone_scm_roles: >-
          {{
            base_cluster_ozone_roles_reconciled.json['items']
            | selectattr('type', 'equalto', 'STORAGE_CONTAINER_MANAGER')
            | list
          }}
        base_cluster_ozone_scm_role: >-
          {{
            base_cluster_ozone_roles_reconciled.json['items']
            | selectattr('type', 'equalto', 'STORAGE_CONTAINER_MANAGER')
            | selectattr('hostRef.hostname', 'equalto', base_master_fqdn)
            | first
            | default({})
          }}
      when: base_cluster_install_services.ozone | default(true) | bool

    - name: Require Ozone SCM role after reconciliation
      ansible.builtin.assert:
        that:
          - base_cluster_ozone_scm_role.name | default('') | length > 0
        fail_msg: >-
          Ozone is enabled but CM has no STORAGE_CONTAINER_MANAGER role on
          {{ base_master_fqdn }} after safe incomplete-cluster reconciliation.
          Correct the Ozone role assignment before cluster startup.
      when: base_cluster_install_services.ozone | default(true) | bool

    - name: Require supported Ozone SCM topology including primordial host
      ansible.builtin.assert:
        that:
          - >-
            (
              base_cluster_ozone_scm_roles | length == 1
              or (
                base_cluster_adopt_existing_ozone_ha | default(true) | bool
                and existing_cluster.status == 200
                and not (base_cluster_partial_empty | bool)
                and base_cluster_ozone_scm_roles | length >= 3
                and (base_cluster_ozone_scm_roles | length) % 2 == 1
              )
            )
          - >-
            base_cluster_ozone_primordial_node_effective
            in (
              base_cluster_ozone_scm_roles
              | map(attribute='hostRef')
              | map(attribute='hostname')
              | list
            )
        fail_msg: >-
          Unsupported existing Ozone SCM topology. CM reports
          {{
            base_cluster_ozone_scm_roles
            | map(attribute='hostRef')
            | map(attribute='hostname')
            | list
            | join(', ')
          }}, with primordial node {{ base_cluster_ozone_primordial_node_effective }}.
          New clusters require one SCM; adopted clusters may retain an existing odd-sized
          HA quorum of at least three SCMs when base_cluster_adopt_existing_ozone_ha=true.
      when: base_cluster_install_services.ozone | default(true) | bool

    - name: Read Kafka roles
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/kafka/roles?view=summary
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_kafka_roles
      changed_when: false
      when:
        - base_cluster_install_services.kafka | default(true) | bool
        - base_cluster_kafka_metadata_store_effective == 'KRaft'
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Find workers missing Kafka KRaft roles
      ansible.builtin.set_fact:
        base_cluster_missing_kraft_hosts: >-
          {{
            base_worker_fqdns
            | difference(
                base_cluster_kafka_roles.json['items']
                | selectattr('type', 'equalto', 'KRAFT')
                | map(attribute='hostRef.hostname')
                | list
              )
          }}
      when:
        - base_cluster_install_services.kafka | default(true) | bool
        - base_cluster_kafka_metadata_store_effective == 'KRaft'

    - name: Add missing Kafka KRaft roles
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/kafka/roles
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        body_format: json
        body:
          items:
            - type: KRAFT
              hostRef:
                hostId: >-
                  {{
                    base_cluster_cm_hosts.json['items']
                    | selectattr('hostname', 'equalto', item)
                    | map(attribute='hostId')
                    | first
                  }}
                hostname: "{{ item }}"
        status_code: [200, 201, 204]
        follow_redirects: none
      loop: "{{ base_cluster_missing_kraft_hosts }}"
      loop_control:
        label: "{{ item }}"
      register: base_cluster_kraft_role_create
      when:
        - base_cluster_install_services.kafka | default(true) | bool
        - base_cluster_kafka_metadata_store_effective == 'KRaft'
      changed_when: true
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Track Kafka KRaft role changes
      ansible.builtin.set_fact:
        base_cluster_required_config_changed: >-
          {{
            base_cluster_required_config_changed | bool
            or base_cluster_kraft_role_create.changed | default(false) | bool
          }}
      when:
        - base_cluster_install_services.kafka | default(true) | bool
        - base_cluster_kafka_metadata_store_effective == 'KRaft'

    - name: Read existing Ozone service state
      ansible.builtin.set_fact:
        base_cluster_existing_ozone_service: >-
          {{
            existing_cluster_services.json['items'] | default([])
            | selectattr('name', 'equalto', 'ozone')
            | first
            | default({})
          }}
      when: existing_cluster.status == 200

    - name: Check whether the HDFS NameNode namespace is already formatted
      ansible.builtin.stat:
        path: "{{ base_cluster_hdfs_name_dir }}/current/VERSION"
      register: base_cluster_hdfs_version_file
      become: true
      connection: ssh
      delegate_to: "{{ groups[base_cluster_master_group][0] }}"
      when: base_cluster_install_services.hdfs | default(true) | bool

    - name: Inspect existing HDFS NameNode directory contents
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          if test -d {{ base_cluster_hdfs_name_dir | quote }}; then
            find {{ base_cluster_hdfs_name_dir | quote }} \
              -mindepth 1 -maxdepth 1 -printf '%f\n' | sort
          fi
        executable: /bin/bash
      register: base_cluster_hdfs_name_dir_contents
      changed_when: false
      become: true
      connection: ssh
      delegate_to: "{{ groups[base_cluster_master_group][0] }}"
      when: base_cluster_install_services.hdfs | default(true) | bool

    - name: Read existing HDFS namespace identity
      ansible.builtin.slurp:
        src: "{{ base_cluster_hdfs_name_dir }}/current/VERSION"
      register: base_cluster_hdfs_version
      become: true
      connection: ssh
      delegate_to: "{{ groups[base_cluster_master_group][0] }}"
      when:
        - base_cluster_install_services.hdfs | default(true) | bool
        - base_cluster_hdfs_version_file.stat.exists | default(false) | bool

    - name: Resolve HDFS namespace state
      ansible.builtin.set_fact:
        base_cluster_hdfs_formatted: >-
          {{
            base_cluster_install_services.hdfs | default(true) | bool
            and base_cluster_hdfs_version_file.stat.exists | default(false) | bool
          }}
        base_cluster_hdfs_namespace_identity: >-
          {{
            (
              base_cluster_hdfs_version.content | b64decode
              | regex_findall('(?m)^(?:clusterID|namespaceID)=.*$')
              | join(', ')
            )
            if (
              base_cluster_hdfs_version.content is defined
            )
            else 'unformatted'
          }}

    - name: Remove only filesystem lost+found from unformatted NameNode storage
      ansible.builtin.file:
        path: "{{ base_cluster_hdfs_name_dir }}/lost+found"
        state: absent
      become: true
      connection: ssh
      delegate_to: "{{ groups[base_cluster_master_group][0] }}"
      when:
        - base_cluster_install_services.hdfs | default(true) | bool
        - not (base_cluster_hdfs_formatted | bool)
        - base_cluster_hdfs_name_dir_contents.stdout_lines | default([]) == ['lost+found']

    - name: Refuse First Run over unexplained NameNode directory contents
      ansible.builtin.assert:
        that:
          - >-
            base_cluster_hdfs_name_dir_contents.stdout_lines | default([])
            | difference(['lost+found'])
            | length == 0
        fail_msg: >-
          Refusing CM First Run because unformatted NameNode directory
          {{ base_cluster_hdfs_name_dir }} is not empty on
          {{ groups[base_cluster_master_group][0] }}. Unexpected entries:
          {{
            base_cluster_hdfs_name_dir_contents.stdout_lines | default([])
            | difference(['lost+found'])
            | join(', ')
          }}. Use the explicit cleanup workflow after confirming these are not
          HDFS data; automation will not delete unexplained storage contents.
      when:
        - base_cluster_install_services.hdfs | default(true) | bool
        - not (base_cluster_hdfs_formatted | bool)

    - name: Refuse a fresh CM cluster over an existing HDFS namespace
      ansible.builtin.assert:
        that:
          - not (base_cluster_hdfs_formatted | bool)
        fail_msg: >-
          Refusing destructive First Run for newly created CM cluster
          {{ cdh_basecluster_name }} because
          {{ base_cluster_hdfs_name_dir }}/current/VERSION already exists on
          {{ groups[base_cluster_master_group][0] }}
          ({{ base_cluster_hdfs_namespace_identity }}). Clean the host through the
          explicit cluster cleanup workflow or adopt the CM cluster that owns this
          namespace; automation will never reformat existing HDFS data.
      when:
        - base_cluster_create_required | bool
        - existing_cluster.status == 404
        - base_cluster_install_services.hdfs | default(true) | bool

    - name: Determine whether CM First Run still needs to run
      ansible.builtin.set_fact:
        base_cluster_pending_first_run: >-
          {{
            not (base_cluster_hdfs_formatted | bool)
            and (
              base_cluster_force_first_run | default(false) | bool
              or (
                existing_cluster.status == 200
                and not (base_cluster_partial_empty | bool)
                and base_cluster_initialization_incomplete | default(false) | bool
              )
            )
          }}
      when: existing_cluster.status == 200

    - name: Detect partial First Run with formatted HDFS
      ansible.builtin.set_fact:
        base_cluster_partial_first_run_recovery_required: >-
          {{
            existing_cluster.status == 200
            and not (base_cluster_partial_empty | bool)
            and base_cluster_initialization_incomplete | default(false) | bool
            and base_cluster_hdfs_formatted | bool
          }}

    - name: Show pending CM First Run on existing cluster
      ansible.builtin.debug:
        msg: >-
          Base cluster exists but First Run never completed (the cluster UUID initialization
          marker and HDFS VERSION file are absent). Playbook will submit CM First Run so
          Cloudera Manager owns service initialization and dependency ordering.
      when: base_cluster_pending_first_run | default(false) | bool

    - name: Show partial First Run recovery
      ansible.builtin.debug:
        msg: >-
          Base cluster First Run did not complete, but HDFS is already formatted
          ({{ base_cluster_hdfs_namespace_identity }}). Preserving the namespace,
          reconciling only idempotent service initialization commands, and using
          normal cluster Start. CM First Run and NameNode format will not run again.
      when: base_cluster_partial_first_run_recovery_required | bool

    - name: Determine whether ordered Ozone recovery is required
      ansible.builtin.set_fact:
        base_cluster_ozone_ordered_recovery_required: >-
          {{
            existing_cluster.status == 200
            and not (base_cluster_partial_empty | bool)
            and not (base_cluster_pending_first_run | default(false) | bool)
            and base_cluster_install_services.ozone | default(true) | bool
            and (
              base_cluster_partial_first_run_recovery_required | bool
              or (
                existing_cluster.json.clusterState | default('') == 'STARTED'
                and (
                  base_cluster_existing_ozone_service.serviceState | default('') != 'STARTED'
                  or base_cluster_existing_ozone_service.healthSummary | default('') == 'BAD'
                )
              )
            )
          }}

    - name: Prepare Kerberos before CM First Run or recovery
      ansible.builtin.include_tasks: common_tasks/prepare_cluster_kerberos_before_start.yml
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - >-
          base_cluster_create_required | bool
          or base_cluster_ozone_ordered_recovery_required | bool
          or base_cluster_pending_first_run | default(false) | bool
          or base_cluster_partial_first_run_recovery_required | bool

    - name: Refresh Cloudera Manager Auto-TLS state before cluster Auto-TLS
      ansible.builtin.include_tasks: common_tasks/fetch_cm_autotls_api_state.yml
      when:
        - base_cluster_enable_autotls | default(true) | bool
        - autotls_enabled | default(true) | bool
        - not (cm_autotls_config_fetched_this_play | default(false) | bool)

    - name: Enable cluster-wide Auto-TLS on base cluster services
      ansible.builtin.include_tasks: common_tasks/enable_base_cluster_autotls_api.yml
      when:
        - base_cluster_enable_autotls | default(true) | bool
        - autotls_enabled | default(true) | bool

    - name: Configure Knox Auto-TLS client trust for CM discovery
      ansible.builtin.include_tasks: common_tasks/configure_knox_autotls_client_trust.yml
      when:
        - base_cluster_install_services.knox | default(true) | bool
        - base_cluster_knox_configure_autotls_trust | default(true) | bool
        - base_cluster_enable_autotls | default(true) | bool
        - autotls_enabled | default(true) | bool

    - name: Refresh Knox gateway after CDP discovery configuration
      ansible.builtin.include_tasks: common_tasks/refresh_knox_gateway_after_discovery_config.yml
      when:
        - base_cluster_install_services.knox | default(true) | bool
        - base_cluster_knox_gateway_group is defined
        - base_cluster_knox_gateway_group | length > 0

    - name: Recover services after partial First Run
      ansible.builtin.include_tasks: common_tasks/recover_partial_base_first_run.yml
      when:
        - base_cluster_partial_first_run_recovery_required | bool
        - existing_cluster.json.clusterState | default('') != 'STARTED'

    - name: Show ordered Ozone recovery
      ansible.builtin.debug:
        msg: >-
          Ozone requires ordered recovery. Stopping any remaining Ozone roles,
          starting SCM alone, waiting for authenticated SCM leadership, and then
          starting the remaining Ozone roles.
      when: base_cluster_ozone_ordered_recovery_required | bool

    - name: Stop unhealthy Ozone before ordered recovery
      ansible.builtin.include_tasks: common_tasks/run_cm_service_setup_command.yml
      vars:
        base_cluster_setup_command:
          service: ozone
          command: stop
      when:
        - base_cluster_ozone_ordered_recovery_required | bool
        - base_cluster_existing_ozone_service.serviceState | default('') == 'STARTED'

    - name: Read Ozone SCM state before cluster startup
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/ozone/roles/{{ base_cluster_ozone_scm_role.name }}?view=summary
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_ozone_scm_state
      changed_when: false
      delegate_to: "{{ cm_cluster_module_delegate_to }}"
      when:
        - base_cluster_install_services.ozone | default(true) | bool
        - base_cluster_ozone_ordered_recovery_required | bool

    - name: Start Ozone SCM before other Ozone roles
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/ozone/roleCommands/start
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        body_format: json
        body:
          items: "{{ base_cluster_ozone_scm_roles | map(attribute='name') | list }}"
        status_code: [200]
        follow_redirects: none
      register: base_cluster_ozone_scm_start
      delegate_to: "{{ cm_cluster_module_delegate_to }}"
      when:
        - base_cluster_install_services.ozone | default(true) | bool
        - base_cluster_ozone_ordered_recovery_required | bool
        - base_cluster_ozone_scm_state.json.roleState | default('') != 'STARTED'

    - name: Require Ozone SCM role start command
      ansible.builtin.assert:
        that:
          - >-
            base_cluster_ozone_scm_start.json['items'] | default([]) | length
            == base_cluster_ozone_scm_roles | length
          - >-
            base_cluster_ozone_scm_start.json['items'] | default([])
            | selectattr('id', 'defined')
            | list
            | length
            == base_cluster_ozone_scm_roles | length
        fail_msg: >-
          CM did not return one command per SCM role while starting the Ozone quorum
          (expected={{ base_cluster_ozone_scm_roles | length }},
          returned={{ base_cluster_ozone_scm_start.json['items'] | default([]) | length }}).
      when:
        - base_cluster_ozone_scm_start is defined
        - base_cluster_ozone_scm_start is not skipped

    - name: Wait for Ozone SCM role start
      ansible.builtin.include_tasks: common_tasks/wait_cm_api_command.yml
      vars:
        cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
        cm_api_command_id: "{{ base_cluster_ozone_scm_start_command.id }}"
        cm_api_command_allow_already_exists: false
      loop: "{{ base_cluster_ozone_scm_start.json['items'] | default([]) }}"
      loop_control:
        loop_var: base_cluster_ozone_scm_start_command
        label: "{{ base_cluster_ozone_scm_start_command.id | default('missing-id') }}"
      when:
        - base_cluster_ozone_scm_start is defined
        - base_cluster_ozone_scm_start is not skipped
        - base_cluster_ozone_scm_start_command.id is defined

    - name: Wait for Ozone SCM leader before starting DataNodes
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          scm_process_dir="$(
            ls -dt /var/run/cloudera-scm-agent/process/*-ozone-STORAGE_CONTAINER_MANAGER \
              2>/dev/null | head -1
          )"
          test -n "${scm_process_dir}" && test -f "${scm_process_dir}/ozone.keytab"
          export HADOOP_CONF_DIR="${scm_process_dir}/ozone-conf"
          export OZONE_CONF_DIR="${scm_process_dir}/ozone-conf"
          export KRB5CCNAME="/tmp/ansible-ozone-scm-leader-$$.ccache"
          cleanup() {
            kdestroy >/dev/null 2>&1 || true
            rm -f "${KRB5CCNAME}"
          }
          trap cleanup EXIT
          scm_principal="$(
            klist -kt "${scm_process_dir}/ozone.keytab" \
              | awk '$NF ~ /^scm\// { print $NF; exit }'
          )"
          test -n "${scm_principal}"
          kinit -kt "${scm_process_dir}/ozone.keytab" "${scm_principal}"
          scm_service_id="$(
            awk '
              /<name>ozone.scm.service.ids<\/name>/ {
                getline
                gsub(/.*<value>|<\/value>.*/, "")
                print
                exit
              }
            ' "${OZONE_CONF_DIR}/ozone-site.xml"
          )"
          test -n "${scm_service_id}"
          ozone_bin="$(command -v ozone || true)"
          if test -z "${ozone_bin}" && test -x /opt/cloudera/parcels/CDH/bin/ozone; then
            ozone_bin=/opt/cloudera/parcels/CDH/bin/ozone
          fi
          test -x "${ozone_bin}"
          "${ozone_bin}" admin scm roles --service-id="${scm_service_id}" 2>&1 \
            | grep -Eq '(^|:)LEADER(:|$)'
        executable: /bin/bash
      register: base_cluster_ozone_scm_leader
      until: base_cluster_ozone_scm_leader.rc == 0
      retries: "{{ base_cluster_ozone_scm_leader_retries }}"
      delay: "{{ base_cluster_ozone_scm_leader_delay }}"
      changed_when: false
      become: true
      connection: ssh
      delegate_to: "{{ groups[base_cluster_master_group][0] }}"
      when:
        - base_cluster_install_services.ozone | default(true) | bool
        - base_cluster_ozone_ordered_recovery_required | bool

    - name: Start Ozone roles after SCM leader recovery
      ansible.builtin.include_tasks: common_tasks/run_cm_service_setup_command.yml
      vars:
        base_cluster_setup_command:
          service: ozone
          command: start
      when:
        - base_cluster_install_services.ozone | default(true) | bool
        - base_cluster_ozone_ordered_recovery_required | bool

    - name: Discover Hue parcel Python and install psycopg2 before First Run
      block:
        - name: Discover Hue parcel Python on master
          ansible.builtin.import_tasks: common_tasks/discover_hue_parcel_python.yml

        - name: Ensure psycopg2 is installed for Hue
          ansible.builtin.import_tasks: common_tasks/ensure_python_psycopg2.yml
          vars:
            python_psycopg2_target_host: "{{ groups[base_cluster_master_group][0] }}"
            python_psycopg2_additional_interpreters:
              - "{{ base_cluster_hue_python_interpreter_effective }}"

        - name: Ensure Hue Django can load its PostgreSQL backend
          ansible.builtin.import_tasks: common_tasks/ensure_hue_postgresql_backend.yml
      become: true
      connection: ssh
      delegate_to: "{{ groups[base_cluster_master_group][0] }}"
      when: base_cluster_install_services.hue | default(true) | bool

    - name: Find unhealthy existing runtime services
      ansible.builtin.set_fact:
        base_cluster_existing_unhealthy_runtime_services: >-
          {%- set unhealthy = [] -%}
          {%- for service_name in base_cluster_runtime_service_names -%}
            {%- set service =
              existing_cluster_services.json['items'] | default([])
              | selectattr('name', 'equalto', service_name)
              | first
              | default({})
            -%}
            {%- if
              service.get('serviceState', '') != 'STARTED'
              or service.get('healthSummary', '') == 'BAD'
            -%}
              {%- set _ = unhealthy.append(service_name) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ unhealthy }}
      when: existing_cluster.status == 200

    - name: Determine whether existing cluster requires a controlled restart
      ansible.builtin.set_fact:
        base_cluster_existing_restart_required: >-
          {{
            existing_cluster.status == 200
            and not (base_cluster_partial_empty | bool)
            and existing_cluster.json.clusterState | default('') == 'STARTED'
            and not (base_cluster_pending_first_run | default(false) | bool)
            and not (base_cluster_ozone_ordered_recovery_required | default(false) | bool)
            and (
              base_cluster_required_config_changed | default(false) | bool
              or base_cluster_existing_unhealthy_runtime_services | default([]) | length > 0
            )
          }}

    - name: Show controlled existing cluster restart reason
      ansible.builtin.debug:
        msg: >-
          Restarting existing cluster before convergence because
          configuration_changed={{ base_cluster_required_config_changed | default(false) | bool }}
          and unhealthy_runtime_services={{
          base_cluster_existing_unhealthy_runtime_services | default([]) | join(', ') | default('none', true) }}.
      when: base_cluster_existing_restart_required | bool

    - name: Stop existing cluster before applying reconciled configuration
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}/commands/stop
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_existing_restart_stop
      delegate_to: "{{ cm_cluster_module_delegate_to }}"
      when: base_cluster_existing_restart_required | bool

    - name: Wait for existing cluster stop before configuration restart
      ansible.builtin.include_tasks: common_tasks/wait_cm_api_command.yml
      vars:
        cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
        cm_api_command_id: "{{ base_cluster_existing_restart_stop.json.id }}"
        cm_api_command_allow_already_exists: false
      when:
        - base_cluster_existing_restart_required | bool
        - base_cluster_existing_restart_stop.json.id is defined

    - name: Determine cluster initialization action
      ansible.builtin.set_fact:
        base_cluster_first_run_required: >-
          {{
            (base_cluster_create_required | bool)
            or (base_cluster_pending_first_run | default(false) | bool)
          }}

    - name: Re-read Hue roles before First Run
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/hue/roles?view=summary
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_hue_roles_before_first_run
      changed_when: false
      when:
        - >-
          base_cluster_first_run_required | bool
          or base_cluster_partial_first_run_recovery_required | bool
        - base_cluster_install_services.hue | default(true) | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Find invalid Hue role colocation before First Run
      ansible.builtin.set_fact:
        base_cluster_hue_hosts_without_kt_renewer: >-
          {%- set data_hosts = [] -%}
          {%- set renewer_hosts = [] -%}
          {%- for role in base_cluster_hue_roles_before_first_run.json['items'] | default([]) -%}
            {%- if role.type in ['HUE_SERVER', 'HUE_DATA_EXPLORER'] -%}
              {%- set _ = data_hosts.append(role.hostRef.hostname) -%}
            {%- elif role.type == 'KT_RENEWER' -%}
              {%- set _ = renewer_hosts.append(role.hostRef.hostname) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ data_hosts | unique | difference(renewer_hosts | unique) }}
      when:
        - >-
          base_cluster_first_run_required | bool
          or base_cluster_partial_first_run_recovery_required | bool
        - base_cluster_install_services.hue | default(true) | bool

    - name: Require Hue Kerberos Ticket Renewer colocation before First Run
      ansible.builtin.assert:
        that:
          - base_cluster_hue_hosts_without_kt_renewer | length == 0
        fail_msg: >-
          Refusing CM First Run because Hue server/Data Explorer roles on these
          hosts lack a colocated KT_RENEWER:
          {{ base_cluster_hue_hosts_without_kt_renewer | join(', ') }}.
      when:
        - >-
          base_cluster_first_run_required | bool
          or base_cluster_partial_first_run_recovery_required | bool
        - base_cluster_install_services.hue | default(true) | bool

    - name: Show cluster startup wait
      ansible.builtin.debug:
        msg: >-
          Cluster topology and pre-First-Run security convergence are complete.
          Starting CM First Run; Jenkins will poll every
          {{ base_cluster_module_poll_interval }}s until CM finishes or the bounded wait expires.
      when: base_cluster_first_run_required | bool

    - name: Start {{ 'new' if base_cluster_create_required | bool else 'existing' }} base cluster with name {{ cdh_basecluster_name }}
      block:
        # cloudera.cluster v4.4.0 predates cluster.force; this is the equivalent
        # CM operation and preserves the command tree for failure diagnostics.
        - name: Submit cluster First Run or start
          ansible.builtin.uri:
            url: >-
              {{
                cm_cluster_module_api_url
                ~ (
                  '/clusters/' ~ cdh_basecluster_name ~ '/commands/firstRun'
                  if base_cluster_first_run_required | bool
                  else '/clusters/' ~ cdh_basecluster_name ~ '/commands/start'
                )
              }}
            method: POST
            user: "{{ cm_admin_user }}"
            password: "{{ cm_admin_pass }}"
            force_basic_auth: yes
            validate_certs: no
            status_code: [200]
            follow_redirects: none
          register: base_cluster_initialization_command
          delegate_to: "{{ cm_cluster_module_delegate_to }}"

        - name: Wait for cluster startup
          ansible.builtin.include_tasks: common_tasks/wait_cm_api_command.yml
          vars:
            cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
            cm_api_command_id: "{{ base_cluster_initialization_command.json.id }}"
            cm_api_command_allow_already_exists: false
          when:
            - base_cluster_initialization_command.json.id is defined

      rescue:
        - name: Select failed cluster command
          ansible.builtin.set_fact:
            base_cluster_failed_command_id: >-
              {{ base_cluster_initialization_command.json.id | default('') }}

        - name: Get failed First Run command
          ansible.builtin.uri:
            url: >-
              {{ cm_cluster_module_api_url }}/commands/{{ base_cluster_failed_command_id }}?view=full
            method: GET
            user: "{{ cm_admin_user }}"
            password: "{{ cm_admin_pass }}"
            force_basic_auth: yes
            validate_certs: no
            status_code: [200]
            follow_redirects: none
          register: base_cluster_failed_command
          when: base_cluster_failed_command_id | length > 0
          changed_when: false
          delegate_to: "{{ cm_cluster_module_delegate_to }}"

        - name: Get failed First Run service commands
          ansible.builtin.uri:
            url: "{{ cm_cluster_module_api_url }}/commands/{{ item.id }}?view=full"
            method: GET
            user: "{{ cm_admin_user }}"
            password: "{{ cm_admin_pass }}"
            force_basic_auth: yes
            validate_certs: no
            status_code: [200]
            follow_redirects: none
          loop: >-
            {{
              base_cluster_failed_command.json.get('children', {}).get('items', [])
              | rejectattr('success', 'equalto', true)
              | list
            }}
          loop_control:
              label: "{{ item.get('serviceRef', {}).get('serviceDisplayName', item.name) }}"
          register: base_cluster_failed_service_commands
          when: base_cluster_failed_command.status | default(0) | int == 200
          changed_when: false
          delegate_to: "{{ cm_cluster_module_delegate_to }}"

        - name: Report failed First Run services
          ansible.builtin.fail:
            msg: |-
              Cluster startup failed (command {{ base_cluster_failed_command_id | default('unknown', true) }}).
              {% for result in base_cluster_failed_service_commands.results | default([]) %}
              - {{ result.json.get('serviceRef', {}).get('serviceDisplayName', result.json.name) }}: {{ result.json.resultMessage | default('unknown') }}
              {% for child in result.json.get('children', {}).get('items', []) if not (child.success | default(false) | bool) %}
                - {{ child.name }}: {{ child.resultMessage | default('unknown') }}
              {% endfor %}
              {% endfor %}
              Original error: {{ ansible_failed_result.msg | default('unknown') }}

    - name: Wait for Knox CDP proxy topologies after cluster startup
      ansible.builtin.include_tasks: common_tasks/wait_knox_cdp_proxy_topology_readiness.yml
      when:
        - base_cluster_install_services.knox | default(true) | bool
        - base_cluster_knox_gateway_group is defined
        - base_cluster_knox_gateway_group | length > 0

    - name: Verify Knox CDP proxy descriptors after cluster startup
      ansible.builtin.include_tasks: common_tasks/verify_knox_cdp_proxy_descriptors.yml
      when:
        - base_cluster_install_services.knox | default(true) | bool
        - base_cluster_knox_gateway_group is defined
        - base_cluster_knox_gateway_group | length > 0

    - name: Refresh base cluster client and monitoring configuration after startup
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/commands/deployClientConfigsAndRefresh
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_refresh_command
      when:
        - >-
          base_cluster_create_required | bool
          or (
            existing_cluster.status == 200
            and not (base_cluster_partial_empty | bool)
          )
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Wait for base cluster refresh
      ansible.builtin.include_tasks: common_tasks/wait_cm_api_command.yml
      vars:
        cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
        cm_api_command_id: "{{ base_cluster_refresh_command.json.id }}"
        cm_api_command_allow_already_exists: false
      when:
        - base_cluster_refresh_command is defined
        - base_cluster_refresh_command.json.id is defined

    - name: Read base cluster HDFS authentication mode
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/hdfs/config?view=full
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_hdfs_auth_config
      changed_when: false
      when: base_cluster_enable_kerberos | default(true) | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Resolve base cluster Kerberos state
      ansible.builtin.set_fact:
        base_cluster_hdfs_authentication: >-
          {{
            (
              base_cluster_hdfs_auth_config.json['items'] | default([])
              | selectattr('name', 'equalto', 'hadoop_security_authentication')
              | map(attribute='value')
              | first
            )
            | default(
                (
                  base_cluster_hdfs_auth_config.json['items'] | default([])
                  | selectattr('name', 'equalto', 'hadoop_security_authentication')
                  | map(attribute='default')
                  | first
                ),
                true
              )
            | default('simple', true)
            | lower
          }}
      when: base_cluster_enable_kerberos | default(true) | bool

    - name: Determine whether Auto-TLS requires an existing cluster restart
      ansible.builtin.set_fact:
        base_cluster_autotls_restart_required: >-
          {{
            (
              autotls_applied_this_run | default(false) | bool
              or base_cluster_cluster_autotls_applied_this_run | default(false) | bool
            )
            and existing_cluster.status == 200
            and not (base_cluster_pending_first_run | default(false) | bool)
            and (
              not (base_cluster_enable_kerberos | default(true) | bool)
              or base_cluster_hdfs_authentication | default('simple') == 'kerberos'
            )
          }}
      when: autotls_enabled | default(true) | bool

    - name: Stop existing secured cluster after enabling Auto-TLS
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}/commands/stop
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_autotls_stop_command
      when: base_cluster_autotls_restart_required | default(false) | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Wait for post-Auto-TLS cluster stop
      ansible.builtin.include_tasks: common_tasks/wait_cm_api_command.yml
      vars:
        cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
        cm_api_command_id: "{{ base_cluster_autotls_stop_command.json.id }}"
        cm_api_command_allow_already_exists: false
      when:
        - base_cluster_autotls_restart_required | default(false) | bool
        - base_cluster_autotls_stop_command.json.id is defined

    - name: Start existing secured cluster after enabling Auto-TLS
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}/commands/start
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_autotls_start_command
      when: base_cluster_autotls_restart_required | default(false) | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Wait for post-Auto-TLS cluster start
      ansible.builtin.include_tasks: common_tasks/wait_cm_api_command.yml
      vars:
        cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
        cm_api_command_id: "{{ base_cluster_autotls_start_command.json.id }}"
        cm_api_command_allow_already_exists: false
      when:
        - base_cluster_autotls_restart_required | default(false) | bool
        - base_cluster_autotls_start_command.json.id is defined

    - name: Refresh client configuration after Auto-TLS cluster restart
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/commands/deployClientConfigsAndRefresh
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_autotls_refresh_command
      when: base_cluster_autotls_restart_required | default(false) | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Wait for post-Auto-TLS client configuration refresh
      ansible.builtin.include_tasks: common_tasks/wait_cm_api_command.yml
      vars:
        cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
        cm_api_command_id: "{{ base_cluster_autotls_refresh_command.json.id }}"
        cm_api_command_allow_already_exists: false
      when:
        - base_cluster_autotls_restart_required | default(false) | bool
        - base_cluster_autotls_refresh_command.json.id is defined

    - name: Resolve expected KDC credential marker
      ansible.builtin.set_fact:
        base_cluster_kdc_admin_principal: >-
          {{
            krb5_kdc_admin_user
            if ('@' in (krb5_kdc_admin_user | string))
            else (krb5_kdc_admin_user ~ '@' ~ cluster_realm)
          }}
        base_cluster_kdc_credentials_marker: >-
          {{
            cm_krb_credentials_marker_path
            ~ '-'
            ~ (
              (
                (
                  krb5_kdc_admin_user
                  if ('@' in (krb5_kdc_admin_user | string))
                  else (krb5_kdc_admin_user ~ '@' ~ cluster_realm)
                )
                ~ '|' ~ cluster_realm ~ '|' ~ kdc_host
              )
              | hash('sha256')
            )
          }}
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'

    - name: Check KDC account-manager credential marker
      ansible.builtin.stat:
        path: "{{ base_cluster_kdc_credentials_marker }}"
      register: base_cluster_kdc_credentials
      changed_when: false
      become: true
      delegate_to: "{{ cm_manager_inventory_host }}"
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'

    - name: Check KDC reachability before cluster Kerberos transition
      ansible.builtin.wait_for:
        host: "{{ kdc_host }}"
        port: 88
        state: started
        connect_timeout: 5
        timeout: "{{ cm_krb_kdc_preflight_timeout }}"
      changed_when: false
      delegate_to: "{{ cm_manager_inventory_host }}"
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'

    - name: Require imported KDC account-manager credentials
      ansible.builtin.assert:
        that:
          - base_cluster_kdc_credentials.stat.exists | default(false) | bool
        fail_msg: >-
          Kerberos transition was requested, but the credential-import marker for
          {{ base_cluster_kdc_admin_principal }} is missing. Run
          30_setup_cm_krbs.yml successfully before playbook 31. The cluster has
          not been stopped or modified.
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'

    - name: Show base cluster Kerberos transition
      ansible.builtin.debug:
        msg: >-
          HDFS authentication is {{ base_cluster_hdfs_authentication }}.
          Stopping {{ cdh_basecluster_name }}, configuring Kerberos, generating
          credentials, restarting the cluster, and refreshing client configuration.
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'

    - name: Stop base cluster before Kerberos configuration
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}/commands/stop
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_kerberos_stop_command
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Wait for pre-Kerberos cluster stop
      ansible.builtin.include_tasks: common_tasks/wait_cm_api_command.yml
      vars:
        cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
        cm_api_command_id: "{{ base_cluster_kerberos_stop_command.json.id }}"
        cm_api_command_allow_already_exists: false
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'
        - base_cluster_kerberos_stop_command.json.id is defined

    - name: Configure base cluster for Kerberos
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/commands/configureForKerberos
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        body_format: json
        body: {}
        status_code: [200]
        follow_redirects: none
      register: base_cluster_kerberos_configure_command
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Wait for base cluster Kerberos configuration
      ansible.builtin.include_tasks: common_tasks/wait_cm_api_command.yml
      vars:
        cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
        cm_api_command_id: "{{ base_cluster_kerberos_configure_command.json.id }}"
        cm_api_command_allow_already_exists: false
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'
        - base_cluster_kerberos_configure_command.json.id is defined

    - name: Generate base cluster Kerberos credentials
      ansible.builtin.uri:
        url: "{{ cm_cluster_module_api_url }}/cm/commands/generateCredentials"
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_kerberos_credentials_command
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Wait for base cluster Kerberos credentials
      ansible.builtin.include_tasks: common_tasks/wait_cm_api_command.yml
      vars:
        cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
        cm_api_command_id: "{{ base_cluster_kerberos_credentials_command.json.id }}"
        cm_api_command_allow_already_exists: false
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'
        - base_cluster_kerberos_credentials_command.json.id is defined

    - name: Start Kerberized base cluster
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}/commands/start
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_kerberos_start_command
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Wait for Kerberized base cluster startup
      ansible.builtin.include_tasks: common_tasks/wait_cm_api_command.yml
      vars:
        cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
        cm_api_command_id: "{{ base_cluster_kerberos_start_command.json.id }}"
        cm_api_command_allow_already_exists: false
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'
        - base_cluster_kerberos_start_command.json.id is defined

    - name: Refresh Kerberized base cluster client configuration
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/commands/deployClientConfigsAndRefresh
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_kerberos_refresh_command
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Wait for Kerberized base cluster client refresh
      ansible.builtin.include_tasks: common_tasks/wait_cm_api_command.yml
      vars:
        cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
        cm_api_command_id: "{{ base_cluster_kerberos_refresh_command.json.id }}"
        cm_api_command_allow_already_exists: false
      when:
        - base_cluster_enable_kerberos | default(true) | bool
        - base_cluster_hdfs_authentication != 'kerberos'
        - base_cluster_kerberos_refresh_command.json.id is defined

    - name: Verify base cluster HDFS Kerberos authentication
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
          }}/services/hdfs/config?view=full
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_hdfs_auth_verify
      changed_when: false
      when: base_cluster_enable_kerberos | default(true) | bool
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Require Kerberos authentication on base cluster HDFS
      ansible.builtin.assert:
        that:
          - >-
            (
              base_cluster_hdfs_auth_verify.json['items'] | default([])
              | selectattr('name', 'equalto', 'hadoop_security_authentication')
              | map(attribute='value')
              | first
              | default('', true)
              | lower
            ) == 'kerberos'
        fail_msg: >-
          CM completed the Kerberos workflow, but HDFS authentication is not
          reported as kerberos. Do not record the cluster initialization marker.
      when: base_cluster_enable_kerberos | default(true) | bool

    - name: Refresh final Auto-TLS state
      ansible.builtin.set_fact:
        cm_autotls_config_fetched_this_play: false
      when: autotls_enabled | default(true) | bool

    - name: Verify final Cloudera Manager Auto-TLS state
      ansible.builtin.include_tasks: common_tasks/fetch_cm_autotls_api_state.yml
      when: autotls_enabled | default(true) | bool

    - name: Require Cloudera Manager Auto-TLS
      ansible.builtin.assert:
        that:
          - cm_autotls_api_enabled | default(false) | bool
        fail_msg: >-
          Auto-TLS was requested, but Cloudera Manager does not report an enabled
          AUTO_TLS_TYPE. Do not record the cluster initialization marker.
      when: autotls_enabled | default(true) | bool

    - name: Read base cluster service Auto-TLS state
      ansible.builtin.uri:
        url: >-
          {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}/isTlsEnabled
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_final_tls_enabled
      changed_when: false
      delegate_to: "{{ cm_cluster_module_delegate_to }}"
      when: base_cluster_enable_autotls | default(true) | bool

    - name: Require base cluster Auto-TLS (isTlsEnabled)
      ansible.builtin.assert:
        that:
          - >-
            (
              base_cluster_final_tls_enabled.json
              if (base_cluster_final_tls_enabled.json is boolean)
              else (base_cluster_final_tls_enabled.json | default(false) | bool)
            ) | bool
        fail_msg: >-
          Cluster {{ cdh_basecluster_name }} does not report isTlsEnabled=true after
          configureAutoTlsServices. Do not record the cluster initialization marker.
      when: base_cluster_enable_autotls | default(true) | bool

    - name: Reconcile CMS Auto-TLS client identity for service monitoring
      ansible.builtin.include_tasks: common_tasks/configure_cm_cms_autotls_trust.yml
      vars:
        cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
        cm_api_uri_delegate_to: "{{ cm_cluster_module_delegate_to }}"
      when:
        - base_cluster_enable_autotls | default(true) | bool
        - autotls_enabled | default(true) | bool

    - name: Determine whether Cloudera Management Service restart is required
      ansible.builtin.set_fact:
        base_cluster_cms_restart_required: >-
          {{
            base_cluster_restart_cms_after_start | default(true) | bool
            and (
              base_cluster_first_run_required | default(false) | bool
              or base_cluster_partial_first_run_recovery_required | default(false) | bool
              or base_cluster_cluster_autotls_applied_this_run | default(false) | bool
              or (
                cms_service_truststore_put is defined
                and cms_service_truststore_put is changed
              )
              or (
                cms_legacy_client_keystore_safety_valve_put is defined
                and cms_legacy_client_keystore_safety_valve_put is changed
              )
              or (
                cms_servicemonitor_tls_put is defined
                and cms_servicemonitor_tls_put is changed
              )
              or (
                base_cluster_pre_start_kerberos_configure_command is defined
                and base_cluster_pre_start_kerberos_configure_command.json.id is defined
              )
              or (
                base_cluster_kerberos_configure_command is defined
                and base_cluster_kerberos_configure_command.json.id is defined
              )
            )
          }}

    - name: Restart Cloudera Management Service after security or First Run changes
      ansible.builtin.include_tasks: common_tasks/restart_cm_management_service_api.yml
      vars:
        cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
        cm_api_uri_delegate_to: "{{ cm_cluster_module_delegate_to }}"
      when: base_cluster_cms_restart_required | bool

    - name: Require completed Cloudera Management Service restart
      ansible.builtin.assert:
        that:
          - cms_service_state_for_restart.status | default(0) | int == 200
          - cms_service_state_for_restart.json.serviceState | default('') == 'STARTED'
          - cms_restart_api_cmd.json.id is defined
        fail_msg: >-
          Base cluster convergence completed, but Cloudera Management Service
          was not running or CM did not return a restart command. Do not record
          the cluster initialization marker.
      when: base_cluster_cms_restart_required | bool

    - name: Read final cluster state
      ansible.builtin.uri:
        url: "{{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}?view=full"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      register: base_cluster_final_state
      changed_when: false
      delegate_to: "{{ cm_cluster_module_delegate_to }}"

    - name: Require healthy enabled base cluster services
      ansible.builtin.import_tasks: common_tasks/verify_base_cluster_service_health.yml

    - name: Check ZooKeeper roles
      ansible.builtin.import_tasks: common_tasks/verify_base_cluster_zookeeper_servers.yml

    - name: Record completed base cluster initialization
      ansible.builtin.copy:
        dest: "{{ base_cluster_initialization_marker_path }}"
        owner: root
        group: root
        mode: "0600"
        content: |
          cluster={{ cdh_basecluster_name }}
          uuid={{ base_cluster_final_state.json.uuid }}
      become: true
      delegate_to: "{{ cm_manager_inventory_host }}"

    - name: Show cluster result
      ansible.builtin.debug:
        msg: >-
          Base cluster with name {{ cdh_basecluster_name }} is ready:
          state={{ base_cluster_final_state.json.clusterState | default('unknown') }},
          health={{ base_cluster_final_state.json.healthSummary | default('unknown') }}.

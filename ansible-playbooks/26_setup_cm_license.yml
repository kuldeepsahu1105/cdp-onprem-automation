### ansible-playbook -i inventory.ini 26_setup_cm_license.yml
# Run after 25_verify_cm.yml; CM API uses direct cldr-mngr :7180/:7183 (no Caddy proxy).
# vars:
#   cm_port: 7180
#   cm_admin_user: "admin"
#   cm_admin_pass: "admin"
#   license_file_name: "license.txt"

---
- import_playbook: ensure_collections.yml

- name: Setup Cloudera Manager License
  hosts: localhost
  gather_facts: true
  tasks:
    - name: Configure cm license
      ansible.builtin.import_role:
        name: cm_install
        tasks_from: configure_cm_license

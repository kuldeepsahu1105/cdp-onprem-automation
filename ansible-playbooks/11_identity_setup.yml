### ansible-playbook -i inventory.ini 11_identity_setup.yml
#
# Phase 2 identity router (auto-detects FreeIPA vs AD via 00_detect_identity.yml)
#
# FreeIPA ([ipaserver] in inventory): 12 -> 13 -> 14 -> 15 -> 16 -> 19
# Active Directory (ad_kdc_host only): 13 -> 16  (12/14/19 skipped automatically)
---
- import_playbook: 00_ensure_collections.yml

- name: Detect identity provider
  ansible.builtin.import_playbook: 00_detect_identity.yml

- name: FreeIPA server install
  ansible.builtin.import_playbook: 12_setup_freeipa_server.yml

- name: DNS and resolv.conf
  ansible.builtin.import_playbook: 13_update_resolv_conf.yml

- name: FreeIPA DNS records
  ansible.builtin.import_playbook: 14_setup_dns_records.yml

- name: Network sysconfig (domain/DNS)
  ansible.builtin.import_playbook: 15_update_syscfg_network.yml

- name: Identity client enrollment (FreeIPA or AD realm join)
  ansible.builtin.import_playbook: 16_setup_identity_client.yml

- name: FreeIPA wildcard DNS record
  ansible.builtin.import_playbook: 19_setup_wildcard.yml

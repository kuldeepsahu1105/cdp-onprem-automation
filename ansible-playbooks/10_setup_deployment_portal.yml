### ansible-playbook -i inventory.ini 10_setup_deployment_portal.yml
#
# Ops stack on ipaserver (auto) or cldr-mngr: Caddy index and pgAdmin.
# Monitoring is owned exclusively by playbook 32.
---
- import_playbook: ensure_collections.yml

- name: Build deployment portal facts
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Build deployment portal facts
      ansible.builtin.import_role:
        name: deployment_portal
        tasks_from: setup_controller

- name: Install deployment portal (Caddy and pgAdmin)
  hosts: deployment_portal_runtime
  become: true
  gather_facts: true
  vars:
    deployment_portal_verify_milestones:
      - portal
      - ipa
  tasks:
    - name: Install deployment portal stack
      ansible.builtin.import_role:
        name: deployment_portal
        tasks_from: install
      vars:
        deployment_portal_manage_monitoring_stack: false

- name: Verify external deployment portal URLs from Ansible controller (Tier B)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    deployment_portal_verify_milestones:
      - portal
      - ipa
  tasks:
    - name: Verify external deployment portal URLs from Ansible controller
      ansible.builtin.import_role:
        name: deployment_portal
        tasks_from: verify_external
      vars:
        deployment_portal_tier_b_skip_task_name: "SKIPPED PORTAL Tier B — Caddy stack disabled"

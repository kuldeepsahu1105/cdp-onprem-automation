### ansible-playbook -i inventory.ini 10_setup_deployment_portal.yml
#
# Ops stack on ipaserver (auto) or cldr-mngr: Caddy index, pgAdmin, Prometheus, Grafana,
# Alertmanager, cAdvisor. CM PostgreSQL remains on cldr-mngr (remote pgAdmin server entry).
---
- import_playbook: ensure_collections.yml

- name: Build deployment portal facts
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Build deployment portal facts
      ansible.builtin.import_role:
        name: deployment_portal
        tasks_from: setup_controller

- import_playbook: enroll_monitoring_exporters.yml
  when: hostvars['localhost'].monitoring_exporter_enrollment_enabled | default(false) | bool

- name: Install deployment portal and monitoring (Caddy, pgAdmin, Grafana, Prometheus, …)
  hosts: deployment_portal_runtime
  become: true
  gather_facts: true
  vars:
    deployment_portal_verify_milestones:
      - portal
      - ipa
  tasks:
    - name: Install deployment portal stack
      ansible.builtin.import_role:
        name: deployment_portal
        tasks_from: install

- name: Verify external deployment portal URLs from Ansible controller (Tier B)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    deployment_portal_verify_milestones:
      - portal
      - ipa
  tasks:
    - name: Verify external deployment portal URLs from Ansible controller
      ansible.builtin.import_role:
        name: deployment_portal
        tasks_from: verify_external
      vars:
        deployment_portal_tier_b_skip_task_name: "SKIPPED PORTAL Tier B — Caddy stack disabled"

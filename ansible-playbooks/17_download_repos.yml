### ansible-playbook -i inventory.ini 17_download_repos.yml
#
# Configure CM/CDH repositories:
#   cm_repo_source=public   — point hosts at archive.cloudera.com/p/ (default)
#   cm_repo_source=internal — mirror to cldr-mngr web server (RPM on RHEL, apt on Ubuntu/Debian)
---
- name: Validate CM repository configuration
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Print CM repository mode
      ansible.builtin.debug:
        msg:
          - "cm_repo_source: {{ cm_repo_source }}"
          - "parcel_repo: {{ parcel_repo }}"
          - "cm_repo_mirror_host: {{ cm_repo_mirror_host }}"
          - "cdh_parcel_os_suffix: {{ cdh_parcel_os_suffix | default('auto') }} (auto → jammy/noble/el8/el9 from workers)"

    - name: Require Cloudera archive credentials
      ansible.builtin.assert:
        that:
          - cm_repo_username | default('') | length > 0
          - cm_repo_username != '<username>'
          - cm_repo_password | default('') | length > 0
          - cm_repo_password != '<password>'
        fail_msg: >-
          Set cm_repo_username and cm_repo_password for archive.cloudera.com access.
          Required for both public and internal (mirror) modes.

- name: Mirror Cloudera Manager and CDH to internal web server
  hosts: cldr-mngr
  become: yes
  tasks:
    - name: Skip internal mirror tasks when using public repos
      ansible.builtin.meta: end_host
      when: cm_repo_source != 'internal'

    - name: Set OS-specific facts
      ansible.builtin.import_tasks: common_tasks/set_os_facts.yml

    - name: Set CM/CDH mirror facts
      ansible.builtin.import_tasks: common_tasks/set_cm_mirror_facts.yml

    - name: Mirror CM/CDH using yum/RPM (RHEL family)
      ansible.builtin.import_tasks: common_tasks/mirror_internal_cm_rhel.yml
      when: os.internal_mirror_format == 'rpm'

    - name: Mirror CM/CDH using apt (Debian family)
      ansible.builtin.import_tasks: common_tasks/mirror_internal_cm_apt.yml
      when: os.internal_mirror_format == 'apt'

    - name: Ensure web server is started for internal mirror
      ansible.builtin.service:
        name: "{{ os.web_server_service }}"
        state: started
        enabled: yes

- name: Configure cloudera-manager.repo on all cluster hosts
  hosts: all
  become: yes
  tasks:
    - name: Set OS-specific facts
      ansible.builtin.import_tasks: common_tasks/set_os_facts.yml

    - name: Configure Cloudera Manager repository
      ansible.builtin.import_tasks: common_tasks/configure_cm_repo.yml

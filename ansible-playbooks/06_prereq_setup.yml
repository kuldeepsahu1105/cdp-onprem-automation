### ansible-playbook -i inventory.ini 06_prereq_setup.yml

---
- import_playbook: ensure_collections.yml

- name: System Update and Package Installation
  hosts: all
  become: yes
  tasks:
    - name: Set OS-specific facts
      ansible.builtin.import_tasks: common_tasks/set_os_facts.yml

    - name: Find PGDG repository files on non-database RHEL hosts
      ansible.builtin.find:
        paths: /etc/yum.repos.d
        patterns: "pgdg*.repo"
        file_type: file
      register: prereq_pgdg_repo_files
      when:
        - ansible_os_family == "RedHat"
        - inventory_hostname != postgres_inventory_host

    - name: Disable PGDG repositories on non-database RHEL hosts
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: '^(enabled\s*=\s*)1\s*$'
        replace: '\g<1>0'
      loop: "{{ prereq_pgdg_repo_files.files | default([]) }}"
      loop_control:
        label: "{{ item.path }}"
      when:
        - ansible_os_family == "RedHat"
        - inventory_hostname != postgres_inventory_host

    - name: Install required base packages (RHEL family)
      ansible.builtin.dnf:
        name: "{{ os.prereq_packages }}"
        state: present
        disablerepo: "{{ os.prereq_disabled_repositories | default([]) }}"
      when: ansible_os_family == "RedHat"

    - name: Install required base packages (Debian family)
      ansible.builtin.apt:
        name: "{{ os.prereq_packages }}"
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Enable Python {{ python_version }} module (RHEL 8)
      ansible.builtin.command: "dnf module enable python{{ python_version | replace('.', '') }} -y"
      when:
        - ansible_os_family == "RedHat"
        - ansible_distribution_major_version == "8"
      changed_when: false
      failed_when: false

    - name: Install Python {{ python_version }} packages (RHEL family)
      ansible.builtin.dnf:
        name: "{{ os.python_packages }}"
        state: present
        disablerepo: "{{ os.prereq_disabled_repositories | default([]) }}"
      when: ansible_os_family == "RedHat"

    - name: Install Python {{ python_version }} packages (Debian family)
      ansible.builtin.apt:
        name: "{{ os.python_packages }}"
        state: present
      when: ansible_os_family == "Debian"

    - name: Upgrade pip to the latest version
      ansible.builtin.pip:
        name: pip
        state: latest
        executable: "{{ os.pip_executable }}"
      become: yes

    - name: Verify if Python is installed
      ansible.builtin.command: "{{ os.python_executable }} --version"
      register: python_version_output
      ignore_errors: yes
      changed_when: false

    - name: Print Python version
      ansible.builtin.debug:
        msg: "Python version: {{ python_version_output.stdout }}"
      when: python_version_output.rc == 0

    - name: Verify if Pip is installed
      ansible.builtin.command: "{{ os.pip_executable }} --version"
      register: pip_version_output
      ignore_errors: yes
      changed_when: false

    - name: Print Pip version
      ansible.builtin.debug:
        msg: "Pip version: {{ pip_version_output.stdout }}"
      when: pip_version_output.rc == 0

    - name: Ensure psycopg2 is installed for both Python interpreters
      ansible.builtin.import_tasks: common_tasks/ensure_python_psycopg2.yml
      vars:
        python_psycopg2_runtime_packages: "{{ os.python_packages }}"
        python_psycopg2_disabled_repositories: >-
          {{ os.prereq_disabled_repositories | default([]) }}

    - name: Install Java (RHEL family)
      ansible.builtin.dnf:
        name: "{{ os.java_packages }}"
        state: present
        disablerepo: "{{ os.prereq_disabled_repositories | default([]) }}"
      when: ansible_os_family == "RedHat"

    - name: Install Java (Debian family)
      ansible.builtin.apt:
        name: "{{ os.java_packages }}"
        state: present
      when: ansible_os_family == "Debian"

    - name: Verify Java installation
      ansible.builtin.command: java -version
      register: java_version_output
      changed_when: false

    - name: Display Java version
      ansible.builtin.debug:
        msg: "{{ java_version_output.stderr_lines | default(java_version_output.stdout_lines) }}"

    - name: Display psycopg2 installation
      ansible.builtin.debug:
        msg: "psycopg2 {{ item.stdout }} is available in {{ item.item }}."
      loop: "{{ python_psycopg2_verify.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Prepare IPAServer operator tools and deployment files
      ansible.builtin.import_tasks: common_tasks/prepare_ipaserver_operator_host.yml
      when:
        - ipa_server_in_inventory | bool
        - inventory_hostname == ipaserver_inventory_host

    - name: Disable firewall
      ansible.builtin.import_tasks: common_tasks/disable_firewall.yml

---
- name: CoreDNS Service probe | Remove stale readiness pod
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_data_services_dns_probe_namespace }}"
      - delete
      - pod
      - "{{ ecs_coredns_service_probe_pod_name }}"
      - --ignore-not-found
  changed_when: false
  become: true
  delegate_to: "{{ groups[ecs_cluster_master_group][0] }}"
  connection: ssh

- name: CoreDNS Service probe | Read every ready CoreDNS endpoint
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_coredns_namespace }}"
      - get
      - endpoints
      - "{{ ecs_coredns_service_name }}"
      - --output
      - 'jsonpath={range .subsets[*].addresses[*]}{.ip}{"\n"}{end}'
  register: ecs_coredns_service_probe_endpoints
  changed_when: false
  become: true
  delegate_to: "{{ groups[ecs_cluster_master_group][0] }}"
  connection: ssh

- name: CoreDNS Service probe | Resolve ready CoreDNS endpoint list
  ansible.builtin.set_fact:
    ecs_coredns_service_probe_endpoint_ips: >-
      {{
        ecs_coredns_service_probe_endpoints.stdout_lines
        | default([])
        | map('trim')
        | reject('equalto', '')
        | unique
        | list
      }}

- name: CoreDNS Service probe | Require ready CoreDNS endpoints
  ansible.builtin.assert:
    that:
      - ecs_coredns_service_probe_endpoint_ips | length > 0
    fail_msg: >-
      No ready endpoints are registered behind CoreDNS Service
      {{ ecs_coredns_service_name }} in namespace
      {{ ecs_coredns_namespace }}.

- name: CoreDNS Service probe | Start readiness pod
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_data_services_dns_probe_namespace }}"
      - run
      - "{{ ecs_coredns_service_probe_pod_name }}"
      - "--image={{ ecs_data_services_dns_probe_image }}"
      - --restart=Never
      - --command
      - --
      - python3
      - -c
      - |
        import ipaddress
        import json
        import socket
        import subprocess
        import sys
        import time

        records = json.loads(sys.argv[1])
        endpoints = json.loads(sys.argv[2])
        attempts = int(sys.argv[3])
        delay = int(sys.argv[4])
        service_pending = {
            record["fqdn"]: record
            for record in records
            if record.get("fqdn")
        }
        endpoint_pending = {
            (endpoint, record["fqdn"]): record
            for endpoint in endpoints
            for record in records
            if record.get("fqdn")
        }
        service_last_answers = {}
        endpoint_last_answers = {}

        def endpoint_answers(fqdn, endpoint):
            lookup = subprocess.run(
                ["nslookup", "-type=A", fqdn.rstrip(".") + ".", endpoint],
                check=False,
                capture_output=True,
                text=True,
            )
            answers = []
            for line in lookup.stdout.splitlines():
                if not line.startswith("Address:"):
                    continue
                candidate = line.split()[-1]
                try:
                    answers.append(str(ipaddress.IPv4Address(candidate)))
                except ipaddress.AddressValueError:
                    pass
            return sorted(set(answers))

        for attempt in range(1, attempts + 1):
            for fqdn, record in list(service_pending.items()):
                try:
                    answers = sorted({
                        item[4][0]
                        for item in socket.getaddrinfo(
                            fqdn,
                            None,
                            socket.AF_INET,
                            socket.SOCK_STREAM,
                        )
                    })
                except socket.gaierror as exc:
                    answers = [f"ERROR:{exc}"]
                service_last_answers[fqdn] = answers
                expected = record.get("address", "")
                if not expected or expected in answers:
                    print(
                        f"DNS_SERVICE_OK fqdn={fqdn} answers={answers}",
                        flush=True,
                    )
                    service_pending.pop(fqdn, None)

            for key, record in list(endpoint_pending.items()):
                endpoint, fqdn = key
                answers = endpoint_answers(fqdn, endpoint)
                endpoint_last_answers[key] = answers
                expected = record.get("address", "")
                if not expected or expected in answers:
                    print(
                        "DNS_ENDPOINT_OK "
                        f"endpoint={endpoint} fqdn={fqdn} answers={answers}",
                        flush=True,
                    )
                    endpoint_pending.pop(key, None)

            if not service_pending and not endpoint_pending:
                print("COREDNS_SERVICE_AND_ENDPOINTS_ALL_RECORDS_OK", flush=True)
                raise SystemExit(0)
            if attempt < attempts:
                time.sleep(delay)

        for fqdn, record in service_pending.items():
            print(
                "DNS_SERVICE_FAILED "
                f"fqdn={fqdn} expected={record.get('address', '')} "
                f"answers={service_last_answers.get(fqdn, [])}",
                file=sys.stderr,
            )
        for key, record in endpoint_pending.items():
            endpoint, fqdn = key
            print(
                "DNS_ENDPOINT_FAILED "
                f"endpoint={endpoint} fqdn={fqdn} "
                f"expected={record.get('address', '')} "
                f"answers={endpoint_last_answers.get(key, [])}",
                file=sys.stderr,
            )
        raise SystemExit(1)
      - "{{ ecs_coredns_required_dns_records | to_json }}"
      - "{{ ecs_coredns_service_probe_endpoint_ips | to_json }}"
      - "{{ ecs_data_services_dns_probe_attempts | default(3) | int }}"
      - "{{ ecs_data_services_dns_probe_retry_delay | int }}"
  register: ecs_coredns_service_probe_start
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ groups[ecs_cluster_master_group][0] }}"
  connection: ssh

- name: CoreDNS Service probe | Wait for readiness pod
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_data_services_dns_probe_namespace }}"
      - get
      - pod
      - "{{ ecs_coredns_service_probe_pod_name }}"
      - --output
      - jsonpath={.status.phase}
  register: ecs_coredns_service_probe_phase
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ groups[ecs_cluster_master_group][0] }}"
  connection: ssh
  retries: "{{ ecs_data_services_dns_probe_wait_retries | int + 6 }}"
  delay: "{{ ecs_data_services_dns_probe_wait_delay | int }}"
  until:
    - ecs_coredns_service_probe_phase.rc == 0
    - ecs_coredns_service_probe_phase.stdout in ['Succeeded', 'Failed']

- name: CoreDNS Service probe | Read readiness output
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_data_services_dns_probe_namespace }}"
      - logs
      - "{{ ecs_coredns_service_probe_pod_name }}"
  register: ecs_coredns_service_probe_logs
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ groups[ecs_cluster_master_group][0] }}"
  connection: ssh

- name: CoreDNS Service probe | Remove completed readiness pod
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_data_services_dns_probe_namespace }}"
      - delete
      - pod
      - "{{ ecs_coredns_service_probe_pod_name }}"
      - --ignore-not-found
  changed_when: false
  become: true
  delegate_to: "{{ groups[ecs_cluster_master_group][0] }}"
  connection: ssh

- name: CoreDNS Service probe | Record readiness
  ansible.builtin.set_fact:
    ecs_coredns_service_probe_succeeded: >-
      {{
        ecs_coredns_service_probe_phase.stdout | default('') == 'Succeeded'
        and (
          'COREDNS_SERVICE_AND_ENDPOINTS_ALL_RECORDS_OK'
          in ecs_coredns_service_probe_logs.stdout_lines | default([])
        )
      }}
    ecs_coredns_service_probe_output: >-
      {{
        ecs_coredns_service_probe_logs.stdout
        | default(ecs_coredns_service_probe_logs.stderr, true)
      }}

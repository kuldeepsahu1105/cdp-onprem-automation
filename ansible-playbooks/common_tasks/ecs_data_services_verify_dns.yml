---
- name: Require Cloudera Manager inventory for Data Services DNS verification
  ansible.builtin.assert:
    that:
      - groups.get('cldr-mngr', []) | length > 0
    fail_msg: >-
      Data Services DNS verification requires a Cloudera Manager host in the
      cldr-mngr inventory group.

- name: Resolve Cloudera Manager inventory host for DNS verification
  ansible.builtin.set_fact:
    ecs_coredns_cm_inventory_host: >-
      {{ ecs_coredns_cm_inventory_host | default(groups['cldr-mngr'] | first) }}

- name: Resolve required Cloudera Manager DNS answer for verification
  ansible.builtin.set_fact:
    ecs_coredns_cm_fqdn: >-
      {{
        ecs_coredns_cm_fqdn
        | default(
            hostvars[ecs_coredns_cm_inventory_host].cldr_hostname
            + '.'
            + cluster_domain
          )
      }}
    ecs_coredns_cm_private_ip: >-
      {{
        ecs_coredns_cm_private_ip
        | default(
            hostvars[ecs_coredns_cm_inventory_host].private_ip
            | default(
                hostvars[ecs_coredns_cm_inventory_host].ansible_host,
                true
              )
          )
      }}

- name: Require FreeIPA inventory for Data Services DNS verification
  ansible.builtin.assert:
    that:
      - groups.get('ipaserver', []) | length > 0
    fail_msg: >-
      FreeIPA-backed Data Services DNS verification requires an ipaserver
      inventory host.
  when: identity_provider_effective | default('freeipa') == 'freeipa'

- name: Resolve FreeIPA inventory host for DNS verification
  ansible.builtin.set_fact:
    ecs_coredns_ipa_inventory_host: >-
      {{ ecs_coredns_ipa_inventory_host | default(groups['ipaserver'] | first) }}
  when: identity_provider_effective | default('freeipa') == 'freeipa'

- name: Build required Data Services DNS verification records
  ansible.builtin.set_fact:
    ecs_data_services_dns_verification_records:
      - label: Cloudera Manager
        fqdn: "{{ ecs_coredns_cm_fqdn }}"
        address: "{{ ecs_coredns_cm_private_ip }}"
        port: "{{ ecs_data_services_cm_probe_port | int }}"
      - label: ECS Management Console
        fqdn: >-
          {{
            ecs_control_plane_url_effective
            | regex_replace('^https?://', '')
            | regex_replace('/.*$', '')
            | regex_replace(':.*$', '')
          }}
        address: >-
          {{
            hostvars[groups[ecs_cluster_master_group] | first].private_ip
            | default(
                hostvars[groups[ecs_cluster_master_group] | first].ansible_host,
                true
              )
          }}
        port: 0

- name: Add FreeIPA to required Data Services DNS verification records
  ansible.builtin.set_fact:
    ecs_data_services_dns_verification_records: >-
      {{
        ecs_data_services_dns_verification_records
        + [
          {
            'label': 'FreeIPA LDAP',
            'fqdn': (
              ipa_kdc_host
              | default(
                  hostvars[ecs_coredns_ipa_inventory_host].cldr_hostname
                  + '.'
                  + cluster_domain,
                  true
                )
            ),
            'address': (
              hostvars[ecs_coredns_ipa_inventory_host].private_ip
              | default(
                  hostvars[ecs_coredns_ipa_inventory_host].ansible_host,
                  true
                )
            ),
            'port': ecs_data_services_ldap_probe_port | int
          }
        ]
      }}
  when: identity_provider_effective | default('freeipa') == 'freeipa'

- name: Add Active Directory LDAP to required Data Services DNS verification records
  ansible.builtin.set_fact:
    ecs_data_services_dns_verification_records: >-
      {{
        ecs_data_services_dns_verification_records
        + [
          {
            'label': 'Active Directory LDAP',
            'fqdn': cm_ldap_host,
            'address': '',
            'port': ecs_data_services_ldap_probe_port | int
          }
        ]
      }}
  when: identity_provider_effective | default('') == 'ad'

- name: Remove stale Data Services DNS verification pod
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_data_services_dns_probe_namespace }}"
      - delete
      - pod
      - ansible-dns-check
      - --ignore-not-found
  changed_when: false
  become: true
  delegate_to: "{{ groups[ecs_cluster_master_group] | first }}"
  connection: ssh

- name: Start Data Services DNS verification pod
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_data_services_dns_probe_namespace }}"
      - run
      - ansible-dns-check
      - "--image={{ ecs_data_services_dns_probe_image }}"
      - --restart=Never
      - --command
      - --
      - python3
      - -c
      - |
        import json
        import socket
        import subprocess
        import sys
        import time

        retries = int(sys.argv[1])
        delay = int(sys.argv[2])
        timeout = int(sys.argv[3])
        records = json.loads(sys.argv[4])
        pending = {record["fqdn"]: record for record in records}
        last_errors = {}

        with open("/etc/resolv.conf", encoding="utf-8") as resolv_conf:
            print("RESOLV_CONF_BEGIN", flush=True)
            print(resolv_conf.read().strip(), flush=True)
            print("RESOLV_CONF_END", flush=True)

        for attempt in range(1, retries + 1):
            for host, record in list(pending.items()):
                expected = record.get("address", "")
                port = int(record.get("port", 0))
                try:
                    addresses = sorted({
                        answer[4][0]
                        for answer in socket.getaddrinfo(
                            host,
                            port or None,
                            family=socket.AF_INET,
                            type=socket.SOCK_STREAM,
                        )
                    })
                    if not addresses:
                        raise RuntimeError("no IPv4 answers")
                    if expected and addresses != [expected]:
                        raise RuntimeError(
                            f"expected {expected}, resolved {','.join(addresses)}"
                        )
                    if not expected and len(addresses) != 1:
                        raise RuntimeError(
                            "expected one IPv4 answer, resolved "
                            + ",".join(addresses)
                        )
                    connect_address = expected or addresses[0]
                    print(
                        f"DNS_A_OK fqdn={host} "
                        f"ipv4={','.join(addresses)}",
                        flush=True,
                    )
                    if port:
                        with socket.create_connection(
                            (connect_address, port),
                            timeout=timeout,
                        ):
                            pass
                        print(
                            f"TCP_OK fqdn={host} ipv4={connect_address} "
                            f"port={port}",
                            flush=True,
                        )
                    del pending[host]
                    last_errors.pop(host, None)
                except Exception as exc:
                    last_errors[host] = repr(exc)
                    print(
                        f"attempt {attempt}/{retries} host={host} "
                        f"failed: {last_errors[host]}",
                        file=sys.stderr,
                        flush=True,
                    )

            if not pending:
                print("ALL_PROBES_OK", flush=True)
                raise SystemExit(0)
            if attempt < retries:
                time.sleep(delay)

        for host, record in pending.items():
            try:
                lookup = subprocess.run(
                    ["nslookup", host],
                    check=False,
                    capture_output=True,
                    text=True,
                    timeout=timeout,
                )
                print(
                    f"NSLOOKUP_DIAGNOSTIC host={host} rc={lookup.returncode}",
                    file=sys.stderr,
                )
                print(lookup.stdout.strip(), file=sys.stderr)
                if lookup.stderr:
                    print(lookup.stderr.strip(), file=sys.stderr)
            except Exception as lookup_exc:
                print(
                    f"NSLOOKUP_DIAGNOSTIC_FAILED host={host} "
                    f"error={lookup_exc!r}",
                    file=sys.stderr,
                )
            print(
                f"PROBE_FAILED host={host} "
                f"expected={record.get('address', '')} "
                f"port={record.get('port', 0)} "
                f"error={last_errors.get(host, 'probe did not run')}",
                file=sys.stderr,
            )
        raise SystemExit(1)
      - "{{ ecs_data_services_dns_probe_wait_retries | int }}"
      - "{{ ecs_data_services_dns_probe_wait_delay | int }}"
      - "{{ ecs_data_services_tcp_probe_timeout | int }}"
      - "{{ ecs_data_services_dns_verification_records | to_json }}"
  register: ecs_data_services_dns_probe_starts
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ groups[ecs_cluster_master_group] | first }}"
  connection: ssh

- name: Wait for Data Services DNS verification pod
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_data_services_dns_probe_namespace }}"
      - get
      - pod
      - ansible-dns-check
      - --output
      - jsonpath={.status.phase}
  register: ecs_data_services_dns_probe_phases
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ groups[ecs_cluster_master_group] | first }}"
  connection: ssh
  retries: "{{ ecs_data_services_dns_probe_wait_retries | int + 6 }}"
  delay: "{{ ecs_data_services_dns_probe_wait_delay | int }}"
  until:
    - ecs_data_services_dns_probe_phases.rc == 0
    - ecs_data_services_dns_probe_phases.stdout in ['Succeeded', 'Failed']

- name: Read Data Services DNS verification output
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_data_services_dns_probe_namespace }}"
      - logs
      - ansible-dns-check
  register: ecs_data_services_dns_probe_logs
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ groups[ecs_cluster_master_group] | first }}"
  connection: ssh

- name: Remove completed Data Services DNS verification pod
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_data_services_dns_probe_namespace }}"
      - delete
      - pod
      - ansible-dns-check
      - --ignore-not-found
  changed_when: false
  become: true
  delegate_to: "{{ groups[ecs_cluster_master_group] | first }}"
  connection: ssh

- name: Require Data Services DNS resolution through CoreDNS
  ansible.builtin.assert:
    that:
      - ecs_data_services_dns_probe_logs.rc == 0
      - ecs_data_services_dns_probe_phases.stdout == 'Succeeded'
      - >-
        (
          'DNS_A_OK fqdn=' + item.fqdn + ' ipv4='
        ) in ecs_data_services_dns_probe_logs.stdout
      - >-
        item.address | default('') | length == 0
        or item.address in ecs_data_services_dns_probe_logs.stdout
      - >-
        item.port | default(0) | int == 0
        or (
          'TCP_OK fqdn=' + item.fqdn + ' ipv4='
        ) in ecs_data_services_dns_probe_logs.stdout
      - "'ALL_PROBES_OK' in ecs_data_services_dns_probe_logs.stdout"
    fail_msg: >-
      {{ item.label }} hostname {{ item.fqdn }} must return the
      required IPv4 answer
      {{ item.address | default('an address', true) }}
      {% if item.port | default(0) | int > 0 %}
      and accept TCP connections on port {{ item.port }}
      {% endif %}
      through the newly created Kubernetes probe pod before Data Services API calls
      are allowed. Probe output:
      {{
        ecs_data_services_dns_probe_logs.stdout
        | default(ecs_data_services_dns_probe_logs.stderr, true)
      }}
    quiet: true
  loop: "{{ ecs_data_services_dns_verification_records }}"
  loop_control:
    label: "{{ item.label }}: {{ item.fqdn }}"

---
# Required vars: cluster_parcel_cluster, cluster_parcel_product, cluster_parcel_version.
# Use CM stages directly because cloudera.cluster v4.4 parcel polling silently
# continues after its 600-second timeout and can request distribution too early.

- name: Require cluster parcel activation inputs
  ansible.builtin.assert:
    that:
      - cluster_parcel_cluster | string | trim | length > 0
      - cluster_parcel_product | string | trim | length > 0
      - cluster_parcel_version | string | trim | length > 0

- name: Resolve cluster parcel API endpoint
  ansible.builtin.set_fact:
    cluster_parcel_api_url: >-
      {{ cm_cluster_module_api_url }}/clusters/{{ cluster_parcel_cluster | urlencode
      }}/parcels/products/{{ cluster_parcel_product | urlencode
      }}/versions/{{ cluster_parcel_version | urlencode }}

- name: Read cluster parcel stage
  ansible.builtin.uri:
    url: "{{ cluster_parcel_api_url }}"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  register: cluster_parcel_initial_status
  changed_when: false
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Start cluster parcel download
  ansible.builtin.uri:
    url: "{{ cluster_parcel_api_url }}/commands/startDownload"
    method: POST
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200, 202]
    follow_redirects: none
  when: cluster_parcel_initial_status.json.stage == 'AVAILABLE_REMOTELY'
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Wait for cluster parcel download
  ansible.builtin.uri:
    url: "{{ cluster_parcel_api_url }}"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  register: cluster_parcel_download_status
  changed_when: false
  until: >-
    cluster_parcel_download_status.json.stage
    in ['DOWNLOADED', 'DISTRIBUTING', 'DISTRIBUTED', 'ACTIVATING', 'ACTIVATED']
  retries: "{{ cluster_parcel_poll_retries | default(480) }}"
  delay: "{{ cluster_parcel_poll_delay | default(15) }}"
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Require successful cluster parcel download
  ansible.builtin.assert:
    that:
      - >-
        cluster_parcel_download_status.json.stage
        in ['DOWNLOADED', 'DISTRIBUTING', 'DISTRIBUTED', 'ACTIVATING', 'ACTIVATED']
    fail_msg: >-
      {{ cluster_parcel_product }} parcel {{ cluster_parcel_version }} did not
      download successfully for cluster {{ cluster_parcel_cluster }}.
      Stage={{ cluster_parcel_download_status.json.stage | default('unknown') }};
      progress={{ (cluster_parcel_download_status.json.state | default({})).get('progress', 'unknown') }};
      errors={{ (cluster_parcel_download_status.json.state | default({})).get('errors', []) | join('; ') }}.

- name: Start cluster parcel distribution
  ansible.builtin.uri:
    url: "{{ cluster_parcel_api_url }}/commands/startDistribution"
    method: POST
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200, 202]
    follow_redirects: none
  when: cluster_parcel_download_status.json.stage == 'DOWNLOADED'
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Wait for cluster parcel distribution
  ansible.builtin.uri:
    url: "{{ cluster_parcel_api_url }}"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  register: cluster_parcel_distribution_status
  changed_when: false
  until: >-
    cluster_parcel_distribution_status.json.stage
    in ['DISTRIBUTED', 'ACTIVATING', 'ACTIVATED']
  retries: "{{ cluster_parcel_poll_retries | default(480) }}"
  delay: "{{ cluster_parcel_poll_delay | default(15) }}"
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Require successful cluster parcel distribution
  ansible.builtin.assert:
    that:
      - >-
        cluster_parcel_distribution_status.json.stage
        in ['DISTRIBUTED', 'ACTIVATING', 'ACTIVATED']
    fail_msg: >-
      {{ cluster_parcel_product }} parcel {{ cluster_parcel_version }} did not
      distribute successfully to cluster {{ cluster_parcel_cluster }}.
      Stage={{ cluster_parcel_distribution_status.json.stage | default('unknown') }};
      progress={{ (cluster_parcel_distribution_status.json.state | default({})).get('progress', 'unknown') }};
      errors={{ (cluster_parcel_distribution_status.json.state | default({})).get('errors', []) | join('; ') }}.

- name: Activate cluster parcel
  ansible.builtin.uri:
    url: "{{ cluster_parcel_api_url }}/commands/activate"
    method: POST
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200, 202]
    follow_redirects: none
  when: cluster_parcel_distribution_status.json.stage == 'DISTRIBUTED'
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Wait for cluster parcel activation
  ansible.builtin.uri:
    url: "{{ cluster_parcel_api_url }}"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  register: cluster_parcel_activation_status
  changed_when: false
  until: cluster_parcel_activation_status.json.stage == 'ACTIVATED'
  retries: "{{ cluster_parcel_poll_retries | default(480) }}"
  delay: "{{ cluster_parcel_poll_delay | default(15) }}"
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Require successful cluster parcel activation
  ansible.builtin.assert:
    that:
      - cluster_parcel_activation_status.json.stage == 'ACTIVATED'
    fail_msg: >-
      {{ cluster_parcel_product }} parcel {{ cluster_parcel_version }} did not
      activate successfully for cluster {{ cluster_parcel_cluster }}.
      Stage={{ cluster_parcel_activation_status.json.stage | default('unknown') }};
      progress={{ (cluster_parcel_activation_status.json.state | default({})).get('progress', 'unknown') }};
      errors={{ (cluster_parcel_activation_status.json.state | default({})).get('errors', []) | join('; ') }}.

# Requires cm_api_url / autotls_enabled from set_cm_api_url.yml in the same play (no second full API probe).

# - name: Print Cloudera Manager API URL
#   ansible.builtin.debug:
#     msg: "cm_api_url is set to {{ cm_api_url }}"

- name: Extract API version from cm_api_url when not already set
  ansible.builtin.set_fact:
    cm_api_version: >-
      {{
        (cm_api_url | default('') | regex_search('/api/(v[0-9]+)'))
        if (cm_api_url | default('') | length > 0)
        else ''
      }}
  when:
    - cm_api_version | default('') | length == 0
    - cm_api_url | default('') | length > 0
    - (cm_api_url | default('') | regex_search('/api/(v[0-9]+)')) | default('') | length > 0

# - name: Print extracted API version
#   ansible.builtin.debug:
#     msg: "cm_api_version is set to {{ cm_api_version }}"

- name: Get private (VPC) IP of CM server for display URLs
  ansible.builtin.set_fact:
    cm_private_ip: >-
      {{ hostvars[groups['cldr-mngr'][0]].private_ip
         | default(hostvars[groups['cldr-mngr'][0]].ansible_host) }}
    cm_public_inventory_ip: "{{ hostvars[groups['cldr-mngr'][0]].ansible_host }}"

# - name: Print Private IP
#   ansible.builtin.debug:
#     msg: "✏️  Cloudera Manager Private IP: {{ cm_private_ip }}"

- name: Set public access IP from cldr-mngr inventory ansible_host
  ansible.builtin.set_fact:
    cm_public_ip: >-
      {{
        cm_public_inventory_ip
        if (cm_public_inventory_ip | default('') | length > 0)
        else 'N/A'
      }}

# - name: Print Public IP
#   ansible.builtin.debug:
#     msg: "✏️  Cloudera Manager Public IP: {{ cm_public_ip }}"

- name: CM API — read Auto-TLS state from CM configuration for accurate TLS messaging
  ansible.builtin.import_tasks: fetch_cm_autotls_api_state.yml
  when: not (cm_autotls_config_fetched_this_play | default(false) | bool)

- name: Set Cloudera Manager TLS display flags for access URLs
  ansible.builtin.set_fact:
    _cm_display_autotls: >-
      {{
        (cm_api_https_active | default(false) | bool)
        or (cm_autotls_api_enabled | default(false) | bool)
        or (autotls_enabled | default(false) | bool)
        or (cm_protocol | default('') == 'https')
        or ((cm_api_port | default(0) | int) == (cm_https_port | default(7183) | int))
      }}

- name: Apply Cloudera Manager protocol and ports for access URLs
  ansible.builtin.set_fact:
    cm_protocol: >-
      {{
        'https'
        if (_cm_display_autotls | bool)
        else (cm_protocol | default('http', true))
      }}
    cm_port_ui: >-
      {{
        (cm_https_port | default(7183))
        if (_cm_display_autotls | bool)
        else (cm_api_port | default(cm_http_port | default(7180), true))
      }}
    cm_port_api: >-
      {{
        (cm_https_port | default(7183))
        if (_cm_display_autotls | bool)
        else (cm_api_port | default(cm_http_port | default(7180), true))
      }}

- name: Set Cloudera Manager URLs
  ansible.builtin.set_fact:
    cm_private_ui_url: "{{ cm_protocol }}://{{ cm_private_ip }}:{{ cm_port_ui }}"
    cm_private_api_url: "{{ cm_protocol }}://{{ cm_private_ip }}:{{ cm_port_api }}/api/{{ cm_api_version }}"
    cm_public_ui_url: "{{ cm_protocol }}://{{ cm_public_ip }}:{{ cm_port_ui }}"
    cm_public_api_url: "{{ cm_protocol }}://{{ cm_public_ip }}:{{ cm_port_api }}/api/{{ cm_api_version }}"

- name: Set Cloudera Manager Access Message (YAML formatted output)
  ansible.builtin.debug:
    msg: "{{ msg_content.split('\n') }}"
  vars:
    msg_content: |
      ✅ **Cloudera Manager Access Details**

      ♻️  **Private Access (Recommended for Internal Use)**  
      ➡️  UI URL: [Cloudera Manager]({{ cm_private_ui_url }})  
      ⚠️  API URL: [CM API]({{ cm_private_api_url }})  

      {% if cm_public_ip != 'N/A' %}
      ♻️  **Public Access (If Public IP is Configured)**  
      ➡️  UI URL: [Cloudera Manager]({{ cm_public_ui_url }})  
      ⚠️  API URL: [CM API]({{ cm_public_api_url }})  
      {% endif %}

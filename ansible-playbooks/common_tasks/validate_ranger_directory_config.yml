---
- name: Validate Ranger directory provider selection
  ansible.builtin.assert:
    that:
      - >-
        base_cluster_ranger_usersync_provider | lower
        in base_cluster_ranger_usersync_provider_allowed
      - >-
        base_cluster_ranger_usersync_provider_effective
        in ['freeipa', 'ad', 'external', 'none']
      - >-
        base_cluster_ranger_usersync_provider_effective not in ['freeipa', 'ad']
        or base_cluster_ranger_usersync_provider_effective == identity_provider_effective
    fail_msg: >-
      Invalid Ranger directory provider selection. Use auto, the active
      identity_provider_effective value, external, or none. Ranger never
      configures FreeIPA LDAP and Active Directory authentication together.

- name: Validate Ranger directory endpoint and mapping
  ansible.builtin.assert:
    that:
      - (base_cluster_ranger_usersync_ldap_url | urlsplit('scheme')) in ['ldap', 'ldaps']
      - base_cluster_ranger_usersync_ldap_url | urlsplit('hostname') | default('', true) | length > 0
      - >-
        base_cluster_ranger_usersync_ldap_url | urlsplit('port')
        | default(
            636
            if (base_cluster_ranger_usersync_ldap_url | urlsplit('scheme')) == 'ldaps'
            else 389,
            true
          )
        | int > 0
      - >-
        not (base_cluster_ranger_usersync_starttls | bool)
        or (base_cluster_ranger_usersync_ldap_url | urlsplit('scheme')) == 'ldap'
      - base_cluster_ranger_usersync_bind_dn | string | trim | length > 0
      - base_cluster_ranger_usersync_bind_password | string | length > 0
      - base_cluster_ranger_admin_base_dn | string | trim | length > 0
      - base_cluster_ranger_usersync_user_search_base | string | trim | length > 0
      - base_cluster_ranger_usersync_group_search_base | string | trim | length > 0
      - base_cluster_ranger_usersync_user_object_class | string | trim | length > 0
      - base_cluster_ranger_usersync_group_object_class | string | trim | length > 0
      - base_cluster_ranger_usersync_user_name_attribute | string | trim | length > 0
      - base_cluster_ranger_usersync_group_name_attribute | string | trim | length > 0
      - base_cluster_ranger_usersync_group_member_attribute | string | trim | length > 0
      - base_cluster_ranger_usersync_user_search_scope | lower in ['base', 'one', 'sub']
      - base_cluster_ranger_usersync_group_search_scope | lower in ['base', 'one', 'sub']
      - base_cluster_ranger_usersync_referral | lower in ['follow', 'ignore', 'throw']
      - >-
        base_cluster_ranger_usersync_username_case_conversion | lower
        in ['lower', 'upper', 'none']
      - >-
        base_cluster_ranger_usersync_groupname_case_conversion | lower
        in ['lower', 'upper', 'none']
      - base_cluster_ranger_usersync_unix_backend | lower in ['nss', 'passwd']
    fail_msg: >-
      Ranger directory integration is incomplete. Provide a valid ldap:// or
      ldaps:// endpoint, bind credential from vault/credentials, base/search
      DNs, object classes, filters, attributes, scopes, referral behavior, and
      case conversions. STARTTLS is valid only with ldap://.
  when: base_cluster_ranger_usersync_configure_effective | bool

- name: Validate FreeIPA Ranger directory inputs
  ansible.builtin.assert:
    that:
      - ipa_kdc_host | string | trim | length > 0
      - ipaserver_domain | string | trim | length > 0
      - ipa_ldap_dc_suffix | string | trim | length > 0
    fail_msg: >-
      Ranger FreeIPA integration requires the deployment IPA host, domain, and
      derived LDAP base DN. Run identity discovery/setup or provide those
      inventory-backed values before CDH_INSTALL.
  when: base_cluster_ranger_usersync_provider_effective == 'freeipa'

- name: Validate Active Directory Ranger directory inputs
  ansible.builtin.assert:
    that:
      - ad_kdc_host | string | trim | length > 0
      - ad_domain | string | trim | length > 0
      - ad_ldap_base_dn | string | trim | length > 0
      - ad_ldap_bind_dn | string | trim | length > 0
      - ad_ldap_user_search_base | string | trim | length > 0
      - ad_ldap_group_search_base | string | trim | length > 0
    fail_msg: >-
      Ranger Active Directory integration requires ad_kdc_host, ad_domain,
      ad_ldap_base_dn, ad_ldap_bind_dn, and user/group search bases. Supply
      deployment-specific values; sample domains and DNs are not used.
  when: base_cluster_ranger_usersync_provider_effective == 'ad'

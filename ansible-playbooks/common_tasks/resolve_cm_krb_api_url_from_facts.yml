---
# Set the mutation-safe CM API URL and execution host from facts established by set_cm_api_url.yml.

- name: CM API — determine whether security REST requires HTTPS
  ansible.builtin.set_fact:
    cm_security_api_https_required: >-
      {{
        (cm_api_use_https | default(false) | bool)
        or (cm_api_https_active | default(false) | bool)
        or (cm_autotls_api_enabled | default(false) | bool)
        or (cm_autotls_setup_intent | default(false) | bool)
        or (autotls_enabled | default(false) | bool)
      }}

- name: CM API — delegate HTTPS REST when the controller cannot reach CM TLS
  ansible.builtin.set_fact:
    cm_api_uri_delegate_to: "{{ cm_manager_inventory_host }}"
  when:
    - cm_security_api_https_required | bool
    - not (cm_api_controller_https_reachable | default(false) | bool)
    - cm_manager_inventory_host | default('') | length > 0
    - not (cm_api_runner_is_manager | default(false) | bool)

- name: CM API — execute REST locally when delegation is unnecessary
  ansible.builtin.set_fact:
    cm_api_uri_delegate_to: localhost
  when: cm_api_uri_delegate_to | default('') | length == 0

- name: CM API — resolve HTTPS API hostname for REST
  ansible.builtin.set_fact:
    _cm_krb_api_url_host: >-
      {{
        cm_api_probe_host
        if (
          (cm_api_uri_delegate_to | default('') | length > 0)
          and (cm_api_probe_host | default('') | length > 0)
          and (cm_api_probe_host not in ['127.0.0.1', 'localhost'])
        )
        else (
          _cm_api_url_host_resolved
          if (_cm_api_url_host_resolved | default('') | length > 0)
          else (
            _cm_api_url_host
            if (_cm_api_url_host | default('') | length > 0)
            else (
              cm_api_client_host
              if (cm_api_client_host | default('') | length > 0)
              else cm_host_public | default('')
            )
          )
        )
      }}
  when:
    - cm_security_api_https_required | bool

- name: CM API — use VPC bind for delegated HTTPS when probe host is public EIP
  ansible.builtin.set_fact:
    _cm_krb_api_url_host: >-
      {{
        cm_host_private
        if (cm_host_private | default('') | length > 0)
        else cm_host_fqdn
      }}
  when:
    - cm_security_api_https_required | bool
    - _cm_krb_api_url_host is defined
    - cm_api_uri_delegate_to != 'localhost'
    - (
        (_cm_krb_api_url_host | default('') == cm_host_public | default(''))
        or (_cm_krb_api_url_host | default('') in ['127.0.0.1', 'localhost', ''])
      )
    - (
        (cm_host_private | default('') | length > 0)
        or (cm_host_fqdn | default('') | length > 0)
      )

- name: CM API — use HTTPS API base for security mutations
  ansible.builtin.set_fact:
    cm_krb_api_url: >-
      {{
        'https://'
        ~ _cm_krb_api_url_host
        ~ ':'
        ~ (cm_https_port | default(7183) | string)
        ~ '/api/'
        ~ cm_api_version
      }}
  when:
    - cm_security_api_https_required | bool
    - _cm_krb_api_url_host is defined
    - _cm_krb_api_url_host | default('') | length > 0

- name: CM API — use discovered API URL when HTTPS is not required
  ansible.builtin.set_fact:
    cm_krb_api_url: "{{ cm_api_url }}"
  when: cm_krb_api_url is not defined

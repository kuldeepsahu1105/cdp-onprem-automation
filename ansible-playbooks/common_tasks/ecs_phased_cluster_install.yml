---
# Phased ECS install aligned with Cloudera Labs reference (cloudera.cluster v4.4.0).
# v4 has no control_plane or host_template modules — control plane uses cm_resource; templates use CM REST.

- name: Assert ECS console admin password meets complexity requirements
  ansible.builtin.assert:
    that:
      - ecs_console_admin_password | length >= 8
      - ecs_console_admin_password is regex('[A-Z]')
      - ecs_console_admin_password is regex('[a-z]')
      - ecs_console_admin_password is regex('[0-9]')
      - ecs_console_admin_password is regex('[#&*$%@^._!]')
    fail_msg: >-
      ecs_console_admin_password must be at least 8 characters and contain at least one
      uppercase letter, one lowercase letter, one number, and one symbol (#, &, *, $, %, @, ^, ., _, !).
    quiet: true

- name: Create ECS experience cluster shell (no services)
  cloudera.cluster.cluster:
    host: "{{ cm_cluster_module_host }}"
    port: "{{ cm_cluster_module_port }}"
    version: "{{ cm_api_version }}"
    force_tls: "{{ cm_cluster_module_force_tls }}"
    username: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    verify_tls: false
    name: "{{ ecs_cluster_name }}"
    display_name: "{{ ecs_cluster_name }}"
    cluster_version: "{{ ecs_parcel_version_effective }}"
    type: EXPERIENCE_CLUSTER
    state: present

- name: Attach ECS master to cluster
  cloudera.cluster.host:
    host: "{{ cm_cluster_module_host }}"
    port: "{{ cm_cluster_module_port }}"
    version: "{{ cm_api_version }}"
    force_tls: "{{ cm_cluster_module_force_tls }}"
    username: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    verify_tls: false
    cluster_hostname: "{{ ecs_master_fqdn }}"
    name: "{{ ecs_cluster_name }}"
    state: attached

- name: Attach ECS workers to cluster
  cloudera.cluster.host:
    host: "{{ cm_cluster_module_host }}"
    port: "{{ cm_cluster_module_port }}"
    version: "{{ cm_api_version }}"
    force_tls: "{{ cm_cluster_module_force_tls }}"
    username: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    verify_tls: false
    cluster_hostname: "{{ item }}"
    name: "{{ ecs_cluster_name }}"
    state: attached
  loop: "{{ ecs_worker_fqdns }}"
  loop_control:
    label: "{{ item }}"

- name: Activate ECS parcel on cluster
  cloudera.cluster.parcel:
    host: "{{ cm_cluster_module_host }}"
    port: "{{ cm_cluster_module_port }}"
    version: "{{ cm_api_version }}"
    force_tls: "{{ cm_cluster_module_force_tls }}"
    username: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    verify_tls: false
    cluster: "{{ ecs_cluster_name }}"
    name: ECS
    parcel_version: "{{ ecs_parcel_version_effective }}"
    state: activated

- name: Create Docker service on ECS cluster
  cloudera.cluster.service:
    host: "{{ cm_cluster_module_host }}"
    port: "{{ cm_cluster_module_port }}"
    version: "{{ cm_api_version }}"
    force_tls: "{{ cm_cluster_module_force_tls }}"
    username: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    verify_tls: false
    cluster: "{{ ecs_cluster_name }}"
    service: docker
    name: docker
    type: DOCKER
    state: present

- name: Configure Docker service data path
  cloudera.cluster.service_config:
    host: "{{ cm_cluster_module_host }}"
    port: "{{ cm_cluster_module_port }}"
    version: "{{ cm_api_version }}"
    force_tls: "{{ cm_cluster_module_force_tls }}"
    username: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    verify_tls: false
    cluster: "{{ ecs_cluster_name }}"
    service: docker
    parameters:
      defaultDataPath: "{{ ecs_docker_data_path }}"

- name: Create ECS service on cluster
  cloudera.cluster.service:
    host: "{{ cm_cluster_module_host }}"
    port: "{{ cm_cluster_module_port }}"
    version: "{{ cm_api_version }}"
    force_tls: "{{ cm_cluster_module_force_tls }}"
    username: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    verify_tls: false
    cluster: "{{ ecs_cluster_name }}"
    service: ecs
    name: ecs
    type: ECS
    state: present

- name: Configure ECS ingress credentials (sensitive)
  cloudera.cluster.service_config:
    host: "{{ cm_cluster_module_host }}"
    port: "{{ cm_cluster_module_port }}"
    version: "{{ cm_api_version }}"
    force_tls: "{{ cm_cluster_module_force_tls }}"
    username: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    verify_tls: false
    cluster: "{{ ecs_cluster_name }}"
    service: ecs
    parameters:
      cp_prometheus_ingress_password: "{{ ecs_cp_prometheus_ingress_password }}"
      infra_prometheus_ingress_password: "{{ ecs_infra_prometheus_ingress_password }}"
      k8s_webui_secret_admin_token: "{{ ecs_k8s_webui_secret_admin_token }}"
  no_log: true

- name: Configure ECS service
  cloudera.cluster.service_config:
    host: "{{ cm_cluster_module_host }}"
    port: "{{ cm_cluster_module_port }}"
    version: "{{ cm_api_version }}"
    force_tls: "{{ cm_cluster_module_force_tls }}"
    username: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    verify_tls: false
    cluster: "{{ ecs_cluster_name }}"
    service: ecs
    parameters:
      app_domain: "{{ ecs_app_domain }}"
      docker: docker
      cp_prometheus_ingress_user: "{{ ecs_cp_prometheus_ingress_user }}"
      infra_prometheus_ingress_user: "{{ ecs_infra_prometheus_ingress_user }}"
      longhorn_replication: "{{ ecs_longhorn_replication }}"
      lsoDataPath: "{{ ecs_lso_data_path }}"
      defaultDataPath: "{{ ecs_longhorn_data_path }}"
      nfs_over_provisioning: "{{ ecs_nfs_over_provisioning }}"

- name: Apply ECS host templates and role assignments
  ansible.builtin.import_tasks: ecs_apply_host_templates.yml

- name: Install ECS embedded control plane
  ansible.builtin.import_tasks: ecs_install_control_plane.yml

- name: Start ECS cluster services and roles
  cloudera.cluster.cluster:
    host: "{{ cm_cluster_module_host }}"
    port: "{{ cm_cluster_module_port }}"
    version: "{{ cm_api_version }}"
    force_tls: "{{ cm_cluster_module_force_tls }}"
    username: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    verify_tls: false
    name: "{{ ecs_cluster_name }}"
    state: started

---
# Align CM admin login with cm_admin_pass when CM still uses the factory bootstrap password.
# Skipped when cm_admin_pass equals cm_admin_bootstrap_pass (default admin/admin).

- name: Skip CM admin password reset when desired password is bootstrap default
  ansible.builtin.debug:
    msg: >-
      CM admin password matches bootstrap default ({{ cm_admin_bootstrap_pass }}); no API reset.
  when: cm_admin_pass == cm_admin_bootstrap_pass

- name: Align Cloudera Manager admin password with group_vars
  when: cm_admin_pass != cm_admin_bootstrap_pass
  vars:
    cm_ensure_api_host: "{{ cm_api_probe_host | default(cm_host) }}"
    cm_ensure_delegate: >-
      {{
        cm_api_probe_delegate_to
        if (cm_api_probe_delegate_to | default('') | length > 0)
        else inventory_hostname
      }}
  block:
    - name: Check CM API auth with configured admin password (HTTP)
      ansible.builtin.uri:
        url: "http://{{ cm_ensure_api_host }}:{{ cm_http_port }}/api/version"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        follow_redirects: none
        validate_certs: no
        status_code: [200, 301, 303, 401, 403]
      register: cm_auth_desired_http
      failed_when: false
      delegate_to: "{{ cm_ensure_delegate }}"

    - name: Check CM API auth with configured admin password (HTTPS)
      ansible.builtin.uri:
        url: "https://{{ cm_ensure_api_host }}:{{ cm_https_port }}/api/version"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200, 301, 303, 401, 403]
      register: cm_auth_desired_https
      failed_when: false
      when: cm_auth_desired_http.status | default(0) not in [200, 301, 303]
      delegate_to: "{{ cm_ensure_delegate }}"

    - name: Record whether configured CM password already works
      ansible.builtin.set_fact:
        cm_admin_password_already_valid: >-
          {{
            (cm_auth_desired_http.status | default(0) in [200, 301, 303])
            or (
              cm_auth_desired_https is defined
              and cm_auth_desired_https.status | default(0) in [200, 301, 303]
            )
          }}

    - name: Check CM API auth with bootstrap admin password (HTTP)
      ansible.builtin.uri:
        url: "http://{{ cm_ensure_api_host }}:{{ cm_http_port }}/api/version"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_bootstrap_pass }}"
        force_basic_auth: yes
        follow_redirects: none
        validate_certs: no
        status_code: [200, 301, 303, 401, 403]
      register: cm_auth_bootstrap_http
      failed_when: false
      when: not cm_admin_password_already_valid | bool
      delegate_to: "{{ cm_ensure_delegate }}"

    - name: Check CM API auth with bootstrap admin password (HTTPS)
      ansible.builtin.uri:
        url: "https://{{ cm_ensure_api_host }}:{{ cm_https_port }}/api/version"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_bootstrap_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200, 301, 303, 401, 403]
      register: cm_auth_bootstrap_https
      failed_when: false
      when:
        - not cm_admin_password_already_valid | bool
        - cm_auth_bootstrap_http.status | default(0) not in [200, 301, 303]
      delegate_to: "{{ cm_ensure_delegate }}"

    - name: Select CM API endpoint for password reset
      ansible.builtin.set_fact:
        cm_pw_reset_api_base: >-
          {{
            'https://' + cm_ensure_api_host + ':' + (cm_https_port | string)
            if (
              cm_auth_bootstrap_https is defined
              and cm_auth_bootstrap_https.status | default(0) in [200, 301, 303]
            )
            else 'http://' + cm_ensure_api_host + ':' + (cm_http_port | string)
          }}
        cm_pw_reset_auth_password: "{{ cm_admin_bootstrap_pass }}"
      when:
        - not cm_admin_password_already_valid | bool
        - (
            cm_auth_bootstrap_http.status | default(0) in [200, 301, 303]
            or (
              cm_auth_bootstrap_https is defined
              and cm_auth_bootstrap_https.status | default(0) in [200, 301, 303]
            )
          )

    - name: Fetch CM API version for password reset
      ansible.builtin.uri:
        url: "{{ cm_pw_reset_api_base }}/api/version"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_pw_reset_auth_password }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200, 301, 303]
        return_content: yes
      register: cm_pw_reset_version
      when: cm_pw_reset_api_base is defined
      delegate_to: "{{ cm_ensure_delegate }}"

    - name: Read CM admin user roles before password update
      ansible.builtin.uri:
        url: >-
          {{ cm_pw_reset_api_base }}/api/{{ cm_pw_reset_version.content | trim }}/users/{{ cm_admin_user }}
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_pw_reset_auth_password }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
      register: cm_admin_user_api
      failed_when: false
      when:
        - cm_pw_reset_api_base is defined
        - cm_pw_reset_version is succeeded
      delegate_to: "{{ cm_ensure_delegate }}"

    - name: Reset Cloudera Manager admin password via API
      ansible.builtin.uri:
        url: >-
          {{ cm_pw_reset_api_base }}/api/{{ cm_pw_reset_version.content | trim }}/users/{{ cm_admin_user }}
        method: PUT
        user: "{{ cm_admin_user }}"
        password: "{{ cm_pw_reset_auth_password }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        body_format: json
        body:
          name: "{{ cm_admin_user }}"
          password: "{{ cm_admin_pass }}"
          roles: >-
            {{
              cm_admin_user_api.json.roles
              if (
                cm_admin_user_api is defined
                and cm_admin_user_api.status | default(0) == 200
                and cm_admin_user_api.json.roles is defined
                and cm_admin_user_api.json.roles | length > 0
              )
              else ['ROLE_ADMIN']
            }}
      register: cm_admin_password_reset
      no_log: true
      when:
        - cm_pw_reset_api_base is defined
        - cm_pw_reset_version is succeeded
      delegate_to: "{{ cm_ensure_delegate }}"

    - name: Report CM admin password reset
      ansible.builtin.debug:
        msg: >-
          Cloudera Manager admin password updated for user '{{ cm_admin_user }}'
          (was bootstrap '{{ cm_admin_bootstrap_pass }}').
      when:
        - cm_admin_password_reset is defined
        - cm_admin_password_reset is succeeded

    - name: CM admin password could not be validated or reset
      ansible.builtin.fail:
        msg: >-
          CM API auth failed for user '{{ cm_admin_user }}' with both configured password
          and bootstrap password '{{ cm_admin_bootstrap_pass }}'. Set cm_admin_pass to the
          current CM password or restore bootstrap access before continuing.
      when:
        - not cm_admin_password_already_valid | bool
        - cm_pw_reset_api_base is not defined

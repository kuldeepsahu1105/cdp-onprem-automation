---
- name: Set OS-specific facts
  ansible.builtin.import_tasks: common_tasks/set_os_facts.yml

- name: Decide whether PostgreSQL requires a restart
  ansible.builtin.set_fact:
    postgres_restart_required: >-
      {{
        postgres_force_restart | default(false) | bool
        or not (postgresql_server_binary.stat.exists | default(false) | bool)
        or not (pg_data_stat.stat.exists | default(false) | bool)
        or (postgres_config_deploy is defined and postgres_config_deploy is changed)
        or (
          postgres_root_key_generation is defined
          and postgres_root_key_generation is changed
        )
        or (
          postgres_root_ca_generation is defined
          and postgres_root_ca_generation is changed
        )
        or (
          postgres_server_key_generation is defined
          and postgres_server_key_generation is changed
        )
        or (
          postgres_server_cert_generation is defined
          and postgres_server_cert_generation is changed
        )
      }}

- name: Report PostgreSQL restart decision
  ansible.builtin.debug:
    msg: >-
      PostgreSQL restart required={{ postgres_restart_required | bool }}
      (force={{ postgres_force_restart | default(false) | bool }},
      new_install={{ not (postgresql_server_binary.stat.exists | default(false) | bool) }},
      new_cluster={{ not (pg_data_stat.stat.exists | default(false) | bool) }},
      config_changed={{ postgres_config_deploy is defined and postgres_config_deploy is changed }},
      tls_changed={{
        (postgres_root_key_generation is defined and postgres_root_key_generation is changed)
        or (postgres_root_ca_generation is defined and postgres_root_ca_generation is changed)
        or (postgres_server_key_generation is defined and postgres_server_key_generation is changed)
        or (postgres_server_cert_generation is defined and postgres_server_cert_generation is changed)
      }}).

# CM holds JDBC pools to Postgres; restart CM on the manager host (not necessarily the Postgres host).
- name: Check if Cloudera Manager Server is running before PostgreSQL restart
  ansible.builtin.command: systemctl is-active cloudera-scm-server
  register: cm_active_before_pg_restart
  changed_when: false
  failed_when: cm_active_before_pg_restart.rc | int not in [0, 3]
  become: true
  delegate_to: "{{ cm_manager_inventory_host }}"
  when:
    - postgres_restart_required | bool
    - cm_manager_inventory_host | default('') | length > 0
    - cm_manager_inventory_host in hostvars

- name: Restart PostgreSQL to apply configuration (RHEL)
  ansible.builtin.systemd:
    name: "{{ os.postgres_service }}"
    state: restarted
    enabled: true
    daemon_reload: true
  when:
    - ansible_os_family == "RedHat"
    - postgres_restart_required | bool

- name: Restart PostgreSQL cluster to apply configuration (Ubuntu/Debian)
  ansible.builtin.command: "pg_ctlcluster {{ postgresql_version }} main restart"
  when:
    - ansible_os_family == "Debian"
    - postgres_restart_required | bool
  register: pg_cluster_restart
  changed_when: pg_cluster_restart.rc == 0
  failed_when: pg_cluster_restart.rc != 0

- name: Ensure PostgreSQL is enabled and started when restart is unnecessary
  ansible.builtin.systemd:
    name: "{{ os.postgres_service }}"
    state: started
    enabled: true
    daemon_reload: true
  when: not (postgres_restart_required | bool)

- name: Wait for PostgreSQL on localhost
  ansible.builtin.wait_for:
    port: "{{ postgres_port }}"
    host: 127.0.0.1
    delay: 2
    timeout: 60

- name: Wait for PostgreSQL on host IP (required for CM JDBC over TCP)
  ansible.builtin.wait_for:
    port: "{{ postgres_port }}"
    host: "{{ ansible_default_ipv4.address }}"
    delay: 2
    timeout: 60

- name: Show PostgreSQL listen sockets
  ansible.builtin.command: ss -ltn sport = :{{ postgres_port }}
  register: pg_listen_sockets
  changed_when: false

- name: Display PostgreSQL listen sockets
  ansible.builtin.debug:
    msg: "{{ pg_listen_sockets.stdout_lines }}"

- name: Assert PostgreSQL accepts remote TCP connections
  ansible.builtin.assert:
    that:
      - postgres_listen_accepts_remote_tcp | bool
    fail_msg: >-
      PostgreSQL is still bound to localhost only (127.0.0.1:{{ postgres_port }}).
      Expected listen_addresses='*' in {{ postgres_config_dir }}/postgresql.conf
      and a full cluster restart.
  vars:
    _pg_listen_port: "{{ postgres_port | string }}"
    _pg_host_listen: "{{ ansible_default_ipv4.address }}:{{ postgres_port }}"
    postgres_listen_accepts_remote_tcp: >-
      {{
        ('0.0.0.0:' ~ _pg_listen_port) in pg_listen_sockets.stdout
        or ('[::]:' ~ _pg_listen_port) in pg_listen_sockets.stdout
        or (_pg_host_listen in pg_listen_sockets.stdout)
      }}

- name: Restart Cloudera Manager after PostgreSQL restart (refresh DB connections)
  ansible.builtin.import_tasks: common_tasks/restart_cm_scm_server.yml
  when:
    - postgres_restart_required | bool
    - cm_manager_inventory_host | default('') | length > 0
    - cm_manager_inventory_host in hostvars
    - cm_active_before_pg_restart is defined
    - cm_active_before_pg_restart.rc | int == 0

- name: Wait for Cloudera Manager Server after PostgreSQL restart
  ansible.builtin.import_tasks: common_tasks/wait_for_cm_server_active.yml
  delegate_to: "{{ cm_manager_inventory_host }}"
  become: true
  when:
    - postgres_restart_required | bool
    - cm_manager_inventory_host | default('') | length > 0
    - cm_manager_inventory_host in hostvars
    - cm_active_before_pg_restart is defined
    - cm_active_before_pg_restart.rc | int == 0

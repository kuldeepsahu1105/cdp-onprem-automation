---
# Optional wait for scm-server :7183 (manual / post–Auto-TLS re-verify only).
# Not used by play 25 — set_cm_api_url.yml probes /api/version on the selected transport (HTTP :7180 before play 27).

- name: CM API — skip scm-server HTTPS port wait when API health already passed
  ansible.builtin.debug:
    msg: Skipping wait for CM HTTPS port — cm_api_health_ok is already true.
  when: cm_api_health_ok | default(false) | bool

- name: CM API — skip scm-server HTTPS port wait when feature disabled
  ansible.builtin.debug:
    msg: >-
      Skipping wait for CM HTTPS :{{ cm_https_port | default(7183) }} —
      cm_verify_wait_scm_https_port is false (default). Enable only for post–Auto-TLS HTTPS re-checks.
  when:
    - not (cm_api_health_ok | default(false) | bool)
    - not (cm_verify_wait_scm_https_port | default(false) | bool)

- name: CM API — skip scm-server HTTPS port wait before Auto-TLS / HTTP REST phase
  ansible.builtin.debug:
    msg: >-
      Skipping wait for CM HTTPS :{{ cm_https_port | default(7183) }} —
      CM REST uses {{ cm_protocol | default('http') }}:{{ cm_api_port | default(cm_http_port | default(7180)) }}
      until Auto-TLS completes (play 27). cm_autotls_api_enabled in CM config does not require :7183 here.
  when:
    - not (cm_api_health_ok | default(false) | bool)
    - cm_verify_wait_scm_https_port | default(false) | bool
    - not (cm_autotls_complete | default(false) | bool)
    - not (
        (cm_api_use_https | default(false) | bool)
        and ((cm_protocol | default('http')) == 'https')
      )

- name: CM API — resolve host for scm-server HTTPS port wait
  ansible.builtin.set_fact:
    _cm_scm_https_wait_host: >-
      {{
        cm_api_probe_host
        if (
          (cm_api_uri_delegate_to | default('') | length > 0)
          and (cm_api_probe_host | default('') | length > 0)
          and (cm_api_probe_host not in ['127.0.0.1', 'localhost'])
        )
        else cm_api_client_host
      }}
  when:
    - not (cm_api_health_ok | default(false) | bool)
    - cm_verify_wait_scm_https_port | default(false) | bool
    - cm_autotls_complete | default(false) | bool
      or (
        (cm_api_use_https | default(false) | bool)
        and ((cm_protocol | default('http')) == 'https')
      )

- name: CM API — wait for Cloudera Manager HTTPS API port (:7183)
  ansible.builtin.wait_for:
    host: "{{ _cm_scm_https_wait_host }}"
    port: "{{ cm_https_port | default(7183) }}"
    timeout: "{{ cm_verify_scm_https_port_timeout | default(30) | int }}"
    delay: 3
  register: _cm_scm_https_port_ready
  until: _cm_scm_https_port_ready is succeeded
  retries: "{{ cm_verify_scm_https_port_retries | default(6) | int }}"
  delay: 10
  delegate_to: "{{ cm_api_uri_delegate_to if (cm_api_uri_delegate_to | default('') | length > 0) else omit }}"
  when:
    - not (cm_api_health_ok | default(false) | bool)
    - cm_verify_wait_scm_https_port | default(false) | bool
    - _cm_scm_https_wait_host | default('') | length > 0
    - _cm_scm_https_wait_host not in ['127.0.0.1', 'localhost']
    - cm_autotls_complete | default(false) | bool
      or (
        (cm_api_use_https | default(false) | bool)
        and ((cm_protocol | default('http')) == 'https')
      )

---
# LDAP settings via PUT /cm/config (no cloudera.cluster.cm_config / cm_client).

- name: LDAP — validate Authentication Backend Order value
  ansible.builtin.assert:
    that:
      - cm_ldap_auth_backend_order in cm_ldap_auth_backend_order_allowed
    fail_msg: >-
      cm_ldap_auth_backend_order={{ cm_ldap_auth_backend_order }} is invalid.
      Allowed: {{ cm_ldap_auth_backend_order_allowed | join(', ') }}.

- name: LDAP — build desired CM LDAP configuration items
  ansible.builtin.set_fact:
    cm_ldap_desired_items:
      - { name: AUTH_BACKEND_ORDER, value: "{{ cm_ldap_auth_backend_order }}" }
      - { name: LDAP_TYPE, value: "{{ cm_ldap_type }}" }
      - { name: LDAP_URL, value: "{{ cm_ldap_url }}" }
      - { name: LDAP_BIND_DN, value: "{{ cm_ldap_bind_dn }}" }
      - { name: LDAP_BIND_PW, value: "{{ cm_ldap_bind_password }}" }
      - { name: LDAP_USER_SEARCH_BASE, value: "{{ cm_ldap_user_search_base }}" }
      - { name: LDAP_USER_SEARCH_FILTER, value: "{{ cm_ldap_user_search_filter }}" }
      - { name: LDAP_GROUP_SEARCH_BASE, value: "{{ cm_ldap_group_search_base }}" }
      - { name: LDAP_GROUP_SEARCH_FILTER, value: "{{ cm_ldap_group_search_filter }}" }
      - { name: LDAP_DN_PATTERN, value: "{{ cm_ldap_dn_pattern | default('') }}" }
  no_log: true

- name: LDAP — read current CM configuration
  ansible.builtin.uri:
    url: "{{ cm_krb_api_url }}/cm/config?view=full"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  delegate_to: "{{ cm_api_uri_delegate_to }}"
  register: cm_ldap_config_before
  changed_when: false

- name: LDAP — detect whether the bind password has ever been configured
  ansible.builtin.set_fact:
    cm_ldap_bind_password_present: >-
      {{
        (
          cm_ldap_config_before.json['items'] | default([])
          | selectattr('name', 'equalto', 'LDAP_BIND_PW')
          | list
          | length
        ) > 0
      }}

- name: LDAP — initialize configuration drift reasons
  ansible.builtin.set_fact:
    cm_ldap_drift_reasons: []

- name: LDAP — identify changed non-secret settings
  ansible.builtin.set_fact:
    cm_ldap_drift_reasons: "{{ cm_ldap_drift_reasons + [item.name] }}"
  loop: "{{ cm_ldap_desired_items | rejectattr('name', 'equalto', 'LDAP_BIND_PW') | list }}"
  when: >-
    (
      cm_ldap_config_before.json['items'] | default([])
      | selectattr('name', 'equalto', item.name)
      | map(attribute='value') | first | default('') | string
    ) != (item.value | string)

- name: LDAP — identify missing or intentionally rotated bind password
  ansible.builtin.set_fact:
    cm_ldap_drift_reasons: >-
      {{
        cm_ldap_drift_reasons
        + (['LDAP_BIND_PW is not configured'] if not (cm_ldap_bind_password_present | bool) else [])
        + (['LDAP_BIND_PW rotation requested'] if (cm_ldap_update_bind_password | default(false) | bool) else [])
      }}

- name: LDAP — detect CM LDAP configuration drift
  ansible.builtin.set_fact:
    cm_ldap_config_changed: "{{ cm_ldap_drift_reasons | length > 0 }}"

- name: LDAP — report configuration drift before CM update
  ansible.builtin.debug:
    msg: "LDAP CM configuration update required: {{ cm_ldap_drift_reasons | join(', ') }}"
  when: cm_ldap_config_changed | bool

- name: LDAP — apply CM LDAP configuration
  ansible.builtin.uri:
    url: "{{ cm_krb_api_url }}/cm/config"
    method: PUT
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    body_format: json
    body:
      items: "{{ cm_ldap_desired_items }}"
    status_code: [200, 204]
    follow_redirects: none
  delegate_to: "{{ cm_api_uri_delegate_to }}"
  register: cm_ldap_result
  when: cm_ldap_config_changed | bool
  changed_when: true
  no_log: true

- name: LDAP — mark Cloudera Manager restart required after config PUT
  ansible.builtin.set_fact:
    cm_restart_after_config_change: true
  when: cm_ldap_config_changed | bool

- name: LDAP — CM settings already match desired state
  ansible.builtin.debug:
    msg: LDAP CM configuration already matches group_vars; no PUT or CM restart.
  when: not (cm_ldap_config_changed | bool)

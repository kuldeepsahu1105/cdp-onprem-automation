---
# Copy SSH keys and credentials bundle to portal www; optional Caddy basicauth for /downloads.

- name: Stage localhost facts on play host for operator access template
  ansible.builtin.import_tasks: deployment_portal_operator_access_facts_from_localhost.yml

- name: Refresh portal SSH key paths on Ansible controller before sync
  delegate_to: localhost
  run_once: true
  become: false
  block:
    - name: Re-resolve deployment portal SSH private keys on controller
      ansible.builtin.import_tasks: resolve_deployment_portal_ssh_key.yml

    - name: Re-render deployment portal inventory hosts after SSH key resolution
      ansible.builtin.set_fact:
        deployment_portal_inventory_hosts: >-
          {{
            lookup('template', 'deployment_portal_inventory_hosts.j2') | from_yaml | default([], true)
          }}

    # Same as build_deployment_portal_operator_access: true/false bool; auto follows basic auth.
    - name: Recompute effective SSH key export flag on controller
      ansible.builtin.set_fact:
        deployment_portal_ssh_keys_expose_effective: >-
          {{
            deployment_portal_expose_ssh_keys | default(true) | bool
            if (deployment_portal_expose_ssh_keys | default(true) | string) not in ['auto', 'Auto', 'AUTO']
            else (
              deployment_portal_basic_auth_enabled | default(false) | bool
            )
          }}

    - name: Refresh operator access metadata after SSH key resolution
      ansible.builtin.set_fact:
        deployment_portal_operator_access: >-
          {{
            lookup('template', 'deployment_portal_operator_access.j2') | from_yaml | default({}, true)
          }}

    - name: Merge refreshed inventory hosts into deployment portal context on controller
      ansible.builtin.set_fact:
        deployment_portal_context: >-
          {{
            deployment_portal_context | default({})
            | combine(
                {
                  'inventory_hosts': deployment_portal_inventory_hosts | default([]),
                  'operator_access': deployment_portal_operator_access | default({}),
                },
                recursive=True
              )
          }}

- name: Adopt refreshed SSH export facts from controller
  ansible.builtin.set_fact:
    deployment_portal_ssh_export_keys: "{{ hostvars['localhost']['deployment_portal_ssh_export_keys'] | default([]) }}"
    deployment_portal_ssh_keys_expose_effective: "{{ hostvars['localhost']['deployment_portal_ssh_keys_expose_effective'] | default(false) | bool }}"
    deployment_portal_ssh_private_key_path: "{{ hostvars['localhost']['deployment_portal_ssh_private_key_path'] | default('') }}"
    deployment_portal_ssh_download_basename: "{{ hostvars['localhost']['deployment_portal_ssh_download_basename'] | default('cluster-access.pem') }}"
    deployment_portal_ssh_ec2_download_basename: "{{ hostvars['localhost']['deployment_portal_ssh_ec2_download_basename'] | default('') }}"
    deployment_portal_terraform_keypair_name: "{{ hostvars['localhost']['deployment_portal_terraform_keypair_name'] | default('') }}"
    deployment_portal_inventory_hosts: "{{ hostvars['localhost']['deployment_portal_inventory_hosts'] | default(deployment_portal_inventory_hosts | default([])) }}"
    deployment_portal_operator_access: "{{ hostvars['localhost']['deployment_portal_operator_access'] | default({}) }}"
    deployment_portal_context: >-
      {{
        deployment_portal_context | default({})
        | combine(
            {
              'operator_access': hostvars['localhost']['deployment_portal_operator_access'] | default({}),
              'inventory_hosts': hostvars['localhost']['deployment_portal_inventory_hosts'] | default(deployment_portal_context.inventory_hosts | default([])),
            },
            recursive=True
          )
      }}
  when: hostvars['localhost'] is defined

- name: Warn when SSH key export is enabled but no controller keys were found
  ansible.builtin.debug:
    msg: >-
      deployment_portal_ssh_keys_expose_effective=true but no SSH private keys were found on the Ansible controller
      (checked ANSIBLE_PRIVATE_KEY, ansible-playbooks/sshkey.pem, HOL_ANSIBLE_STATE_DIR, ~/.ssh).
      Set deployment_portal_ssh_pem_path or ensure Terraform/Jenkins restored sshkey.pem before PORTAL.
  when:
    - deployment_portal_ssh_keys_expose_effective | default(false) | bool
    - (deployment_portal_ssh_export_keys | default([]) | length) == 0

- name: Ensure portal downloads directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: root
    group: root
  loop:
    - "{{ deployment_portal_www_dir }}/downloads"
    - "{{ deployment_portal_www_dir }}/downloads/ssh"
  when: deployment_portal_expose_credentials | default(true) | bool

- name: Reset portal SSH download directory before key sync
  ansible.builtin.file:
    path: "{{ deployment_portal_www_dir }}/downloads/ssh"
    state: absent
  when: deployment_portal_ssh_keys_expose_effective | default(false) | bool

- name: Recreate portal SSH download directory
  ansible.builtin.file:
    path: "{{ deployment_portal_www_dir }}/downloads/ssh"
    state: directory
    mode: "0750"
    owner: root
    group: root
  when: deployment_portal_ssh_keys_expose_effective | default(false) | bool

- name: Copy SSH private keys into portal downloads
  ansible.builtin.copy:
    src: "{{ item.controller_path }}"
    dest: "{{ deployment_portal_www_dir }}/downloads/ssh/{{ item.basename }}"
    mode: "0640"
    owner: root
    group: root
  loop: "{{ deployment_portal_ssh_export_keys | default([]) }}"
  loop_control:
    label: "{{ item.basename | default('ssh-key') }}"
  no_log: true
  when:
    - deployment_portal_ssh_keys_expose_effective | default(false) | bool
    - (deployment_portal_ssh_export_keys | default([]) | length) > 0
    - item.controller_path | default('') | length > 0
    - item.basename | default('') | length > 0

- name: Remove stale SSH download when export disabled
  ansible.builtin.file:
    path: "{{ deployment_portal_www_dir }}/downloads/ssh"
    state: absent
  when: not (deployment_portal_ssh_keys_expose_effective | default(false) | bool)

- name: Recreate empty ssh download dir after cleanup
  ansible.builtin.file:
    path: "{{ deployment_portal_www_dir }}/downloads/ssh"
    state: directory
    mode: "0750"
  when: not (deployment_portal_ssh_keys_expose_effective | default(false) | bool)

- name: Render operator credentials JSON for download
  ansible.builtin.template:
    src: deployment_portal_operator_credentials.json.j2
    dest: "{{ deployment_portal_www_dir }}/downloads/operator-credentials.json"
    mode: "0640"
  when: deployment_portal_expose_credentials | default(true) | bool
  no_log: true

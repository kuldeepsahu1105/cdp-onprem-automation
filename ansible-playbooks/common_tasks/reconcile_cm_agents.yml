---
# Idempotent CM agent config (server_host, optional use_tls) and service restart.
# Run after Auto-TLS (27), when heartbeats are stale, or via 25_reconcile_cm_agents.yml.

- name: Resolve CM agent use_tls from localhost CM API probe when present
  ansible.builtin.set_fact:
    cm_agent_use_tls: >-
      {{
        hostvars['localhost'].cm_agent_use_tls
        | default(cm_agent_use_tls | default(autotls_enabled | default(false) | bool))
        | bool
      }}
  changed_when: false

- name: Reconcile CM agent configuration (server_host / use_tls)
  ansible.builtin.import_tasks: configure_cm_agent.yml

- name: Restart CM agent when config changed or agent not active
  ansible.builtin.import_tasks: restart_cm_agent_if_needed.yml


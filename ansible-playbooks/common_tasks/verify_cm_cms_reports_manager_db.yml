---
# Fail fast when Reports Manager cannot reach Postgres (common cause of CMS role crash loops).

- name: CMS — skip Reports Manager DB probe when disabled
  ansible.builtin.debug:
    msg: Reports Manager DB connectivity probe skipped (cm_cms_verify_reports_manager_db=false).
  when: not (cm_cms_verify_reports_manager_db | default(true) | bool)

- name: CMS — ensure PostgreSQL has Reports Manager database before probe
  ansible.builtin.import_tasks: ensure_cm_postgres_databases.yml
  when: cm_cms_verify_reports_manager_db | default(true) | bool

- name: CMS — probe Reports Manager database from CM host
  when: cm_cms_verify_reports_manager_db | default(true) | bool
  block:
    - name: CMS — TCP login to Reports Manager database (same path as CMS JDBC)
      community.postgresql.postgresql_ping:
        db: "{{ cm_cms_reports_manager_db_name }}"
        login_host: "{{ cm_cms_reports_manager_db_host }}"
        login_port: "{{ postgres_port }}"
        login_user: "{{ cm_cms_reports_manager_db_user }}"
        login_password: "{{ cm_cms_reports_manager_db_password }}"
      delegate_to: "{{ cm_manager_inventory_host }}"
      become: true
      register: cms_rman_db_ping
      no_log: true
      failed_when: false

    - name: CMS — fail when Reports Manager database is unreachable
      ansible.builtin.fail:
        msg: >-
          Reports Manager database "{{ cm_cms_reports_manager_db_name }}" is not reachable at
          {{ cm_cms_reports_manager_db_host }}:{{ postgres_port }} from
          {{ cms_target_hostname | default(cm_manager_inventory_host) }}
          (login user {{ cm_cms_reports_manager_db_user }}).
          Probe detail: {{ cms_rman_db_ping.msg | default('is_available=false') }}.
          If the database was missing, this play re-ran create_cm_dbs.sql.j2 on {{ cm_postgres_inventory_host }}.
          Otherwise re-run ansible-playbook -i inventory.ini 23_setup_postgres.yml, then 29_setup_cm_cms.yml.
          Manual test on the CM host:
          PGPASSWORD='***' psql -h {{ cm_cms_reports_manager_db_host }} -p {{ postgres_port }}
          -U {{ cm_cms_reports_manager_db_user }} -d {{ cm_cms_reports_manager_db_name }} -c 'SELECT 1'.
      when: not (cms_rman_db_ping.is_available | default(false) | bool)

  rescue:
    - name: CMS — fail with probe error (no credentials in output)
      ansible.builtin.fail:
        msg: >-
          Reports Manager database probe failed on {{ cm_manager_inventory_host }}
          connecting to {{ cm_cms_reports_manager_db_host }}:{{ postgres_port }}
          as user {{ cm_cms_reports_manager_db_user }}.
          {{ ansible_failed_result.msg | default(ansible_failed_result) | regex_replace('password[=:][^\\s]+', 'password=***') }}.
          Ensure playbook 06 (psycopg2 on all hosts) and 23 completed; confirm database
          "{{ cm_cms_reports_manager_db_name }}" exists on {{ cm_postgres_inventory_host }}.

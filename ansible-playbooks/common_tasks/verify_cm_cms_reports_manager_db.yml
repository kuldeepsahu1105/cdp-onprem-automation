---
# Fail fast when Reports Manager cannot reach Postgres (common cause of CMS role crash loops).

- name: CMS — skip Reports Manager DB probe when disabled
  ansible.builtin.debug:
    msg: Reports Manager DB connectivity probe skipped (cm_cms_verify_reports_manager_db=false).
  when: not (cm_cms_verify_reports_manager_db | default(true) | bool)

- name: CMS — ensure PostgreSQL has Reports Manager database before probe
  ansible.builtin.import_tasks: ensure_cm_postgres_databases.yml
  when: cm_cms_verify_reports_manager_db | default(true) | bool

- name: CMS — ensure psycopg2 is installed for the delegated database probe
  ansible.builtin.import_tasks: ensure_python_psycopg2.yml
  delegate_to: "{{ cm_manager_inventory_host }}"
  become: true
  vars:
    python_psycopg2_interpreter: >-
      {{
        hostvars[cm_manager_inventory_host].ansible_python_interpreter
        | default('/usr/bin/python3')
      }}
  when: cm_cms_verify_reports_manager_db | default(true) | bool

- name: CMS — probe Reports Manager database from CM host
  when: cm_cms_verify_reports_manager_db | default(true) | bool
  block:
    - name: CMS — TCP login to Reports Manager database (same path as CMS JDBC)
      community.postgresql.postgresql_ping:
        db: "{{ cm_cms_reports_manager_db_name }}"
        login_host: "{{ cm_cms_reports_manager_db_host }}"
        login_port: "{{ postgres_port }}"
        login_user: "{{ cm_cms_reports_manager_db_user }}"
        login_password: "{{ cm_cms_reports_manager_db_password }}"
      delegate_to: "{{ cm_manager_inventory_host }}"
      become: true
      register: cms_rman_db_ping
      no_log: true
      failed_when: false

    - name: CMS — reconcile Reports Manager database role after failed login
      community.postgresql.postgresql_user:
        login_db: "{{ postgres_db }}"
        login_host: "{{ postgres_ensure_cm_db_psql_host_effective }}"
        login_port: "{{ postgres_port }}"
        login_user: "{{ postgres_user }}"
        login_password: "{{ postgres_password }}"
        name: "{{ cm_cms_reports_manager_db_user }}"
        password: "{{ cm_cms_reports_manager_db_password }}"
        state: present
      delegate_to: "{{ postgres_inventory_host }}"
      become: true
      no_log: true
      when: not (cms_rman_db_ping.is_available | default(false) | bool)

    - name: CMS — retry Reports Manager database login after role reconciliation
      community.postgresql.postgresql_ping:
        db: "{{ cm_cms_reports_manager_db_name }}"
        login_host: "{{ cm_cms_reports_manager_db_host }}"
        login_port: "{{ postgres_port }}"
        login_user: "{{ cm_cms_reports_manager_db_user }}"
        login_password: "{{ cm_cms_reports_manager_db_password }}"
      delegate_to: "{{ cm_manager_inventory_host }}"
      become: true
      register: cms_rman_db_ping_after_repair
      no_log: true
      failed_when: false
      when: not (cms_rman_db_ping.is_available | default(false) | bool)

    - name: CMS — require Reports Manager database login
      ansible.builtin.assert:
        that:
          - >-
            (cms_rman_db_ping.is_available | default(false) | bool)
            or (cms_rman_db_ping_after_repair.is_available | default(false) | bool)
        fail_msg: >-
          Reports Manager database "{{ cm_cms_reports_manager_db_name }}" is not reachable at
          {{ cm_cms_reports_manager_db_host }}:{{ postgres_port }} from
          {{ cms_target_hostname | default(cm_manager_inventory_host) }}
          as user {{ cm_cms_reports_manager_db_user }}, even after reconciling that role.
          Probe detail: {{
            cms_rman_db_ping_after_repair.conn_err_msg
            | default(cms_rman_db_ping.conn_err_msg | default('is_available=false'))
            | regex_replace('password[=:][^\\s]+', '******')
          }}.
          Confirm PostgreSQL is listening on {{ cm_cms_reports_manager_db_host }}:{{ postgres_port }}
          and pg_hba.conf permits the CM host.

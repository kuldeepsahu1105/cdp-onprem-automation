---
# Probe `ipa` CLI with the same FILE ccache as kinit/klist (playbooks 14/19 verify).
- name: Probe IPA CLI with Kerberos FILE ccache (ipa --version)
  ansible.builtin.include_tasks: common_tasks/run_ipa_cli.yml
  vars:
    ipa_cli_task_name: Verify IPA CLI with Kerberos FILE ccache
    ipa_cli_argv:
      - --version

- name: Show IPA CLI version probe for debugging
  ansible.builtin.debug:
    msg: >-
      ipa --version (KRB5CCNAME=FILE:{{ ipa_kerberos_ccache_path }}):
      rc={{ ipa_cli_run.rc | default('n/a') }}
      {{ (ipa_cli_run.stdout | default('') | trim)
         or (ipa_cli_run.stderr | default('') | trim) }}

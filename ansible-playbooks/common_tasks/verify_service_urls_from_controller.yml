---
# Tier B: HTTP GET printed external service URLs from the Ansible controller (remote CI or laptop).
# Tier A runs on service hosts (portal ops host @ 127.0.0.1; CM on cldr-mngr via manager IP/FQDN).
# URL list is filtered by deployment_portal_verify_milestones_effective (see build_deployment_tier_b_url_checks.yml).
#
# All Tier B facts and URL checks run on localhost (Ansible controller), not the portal ops host.
#
# Modes (per service, precedence chain):
#   deployment_<service>_external_url_verify → deployment_external_url_verify → deployment_portal_external_url_verify (portal only) → warn
# Values: warn | fail | skip

- name: Build Tier B URL check list when not pre-supplied
  ansible.builtin.import_tasks: build_deployment_tier_b_url_checks.yml
  delegate_to: localhost
  run_once: true
  when: hostvars['localhost'].deployment_tier_b_url_checks | default([]) | length == 0

- name: Set Tier B controller verify defaults
  ansible.builtin.set_fact:
    _tier_b_url_codes: "{{ deployment_service_url_verify_status_codes | default(deployment_portal_url_verify_status_codes | default([200, 301, 302, 303, 307, 308])) }}"
    _tier_b_global_mode: "{{ deployment_external_url_verify | default(deployment_portal_external_url_verify | default('warn')) | lower | trim }}"
    _tier_b_ctx: >-
      {{
        hostvars['localhost'].deployment_portal_context
        | default(deployment_portal_context | default({}))
      }}
    _tier_b_url_checks_local: "{{ hostvars['localhost'].deployment_tier_b_url_checks | default([]) }}"
  delegate_to: localhost
  run_once: true

- name: Set Tier B reachability from portal access profile (ops/CM public vs private IPs)
  ansible.builtin.set_fact:
    ansible_control_reachability_effective: >-
      {{
        'public'
        if (
          hostvars['localhost'].deployment_portal_access_profile_effective
          | default('cloud')
        ) == 'cloud'
        else 'private'
      }}
    ansible_control_reach_public_only: >-
      {{
        (
          hostvars['localhost'].deployment_portal_access_profile_effective
          | default('cloud')
        ) == 'cloud'
      }}
  delegate_to: localhost
  run_once: true

- name: Set Tier B public-controller flag for IPA direct FQDN URL policy
  ansible.builtin.set_fact:
    _tier_b_public_controller: >-
      {{
        (ansible_control_reachability_effective | default('') == 'public')
        or (ansible_control_reach_public_only | default(false) | bool)
        or (ansible_control_remote_runner | default(false) | bool)
      }}
  delegate_to: localhost
  run_once: true

- name: Decide whether to omit Tier B direct FreeIPA cluster FQDN URL check
  ansible.builtin.set_fact:
    _tier_b_skip_ipa_direct_fqdn: >-
      {{
        (
          (deployment_ipa_direct_fqdn_external_url_verify | default('auto') | lower | trim) == 'skip'
        )
        or (
          (deployment_ipa_direct_fqdn_external_url_verify | default('auto') | lower | trim) == 'auto'
          and (_tier_b_public_controller | default(false) | bool)
        )
      }}
  delegate_to: localhost
  run_once: true

- name: Note Tier B direct FreeIPA cluster FQDN check omitted (public controller)
  ansible.builtin.debug:
    msg: >-
      Tier B: skipping direct FreeIPA cluster FQDN URL from Ansible controller
      (check Caddy IPA vhost URLs on :{{ deployment_portal_http_port | default(81) }} instead).
  when:
    - _tier_b_skip_ipa_direct_fqdn | default(false) | bool
    - >-
      (_tier_b_url_checks_local | default([])
      | selectattr('ipa_direct_fqdn', 'defined')
      | selectattr('ipa_direct_fqdn')
      | list
      | length) > 0
  delegate_to: localhost
  run_once: true

- name: Apply Tier B IPA direct cluster FQDN omission to URL list
  ansible.builtin.set_fact:
    _tier_b_url_checks_local: >-
      {%- set skip_ipa = _tier_b_skip_ipa_direct_fqdn | default(false) | bool -%}
      {%- set rows = _tier_b_url_checks_local | default([]) -%}
      {%- set out = [] -%}
      {%- for row in rows -%}
      {%- if not (skip_ipa and (row.ipa_direct_fqdn | default(false) | bool)) -%}
      {%- set _ = out.append(row) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}
  delegate_to: localhost
  run_once: true

- name: Resolve per-service Tier B verify mode on URL checks
  ansible.builtin.set_fact:
    deployment_tier_b_url_checks_effective: >-
      {%- set rows = _tier_b_url_checks_local | default([]) -%}
      {%- set out = [] -%}
      {%- for row in rows -%}
      {%- set svc = row.service | default('service') -%}
      {%- set mode = '' -%}
      {%- if (deployment_service_external_url_verify is defined) and (svc in deployment_service_external_url_verify) -%}
      {%- set mode = deployment_service_external_url_verify[svc] | default('') | string | trim | lower -%}
      {%- endif -%}
      {%- if mode | length == 0 -%}
      {%- set varname = 'deployment_' ~ svc ~ '_external_url_verify' -%}
      {%- if varname in vars and (vars[varname] | default('') | string | trim | length > 0) -%}
      {%- set mode = vars[varname] | string | trim | lower -%}
      {%- endif -%}
      {%- endif -%}
      {%- if mode | length == 0 -%}
      {%- set mode = _tier_b_global_mode -%}
      {%- endif -%}
      {%- set _ = out.append(row | combine({'_mode': mode})) -%}
      {%- endfor -%}
      {{ out }}
  delegate_to: localhost
  run_once: true
  when: _tier_b_url_checks_local | default([]) | length > 0

- name: Filter Tier B URL checks that are not skipped
  ansible.builtin.set_fact:
    deployment_tier_b_url_checks_to_probe: >-
      {{
        deployment_tier_b_url_checks_effective | default([])
        | rejectattr('_mode', 'equalto', 'skip')
        | list
      }}
  delegate_to: localhost
  run_once: true
  when: deployment_tier_b_url_checks_effective | default([]) | length > 0

- name: Set Tier B URL rows for run gate
  ansible.builtin.set_fact:
    _tier_b_probes_for_run: >-
      {{
        deployment_tier_b_url_checks_to_probe
        | default(deployment_tier_b_url_checks_effective | default(_tier_b_url_checks_local | default([])))
      }}
  delegate_to: localhost
  run_once: true

- name: Decide whether to run Tier B external URL checks
  ansible.builtin.set_fact:
    _tier_b_run_any: >-
      {{
        (_tier_b_probes_for_run | default([]) | length > 0)
        and (
          (_tier_b_ctx | length == 0)
          or (_tier_b_ctx.access.profile | default('') != 'private')
        )
        and (
          (ansible_control_remote_runner | default(false) | bool)
          or (ansible_control_reachability_effective | default('') == 'public')
          or (ansible_control_reach_public_only | default(false) | bool)
        )
      }}
  delegate_to: localhost
  run_once: true

- name: GET external service URLs from Ansible controller (Tier B)
  ansible.builtin.uri:
    url: "{{ item.url }}"
    method: GET
    headers: >-
      {{
        {'Host': item.http_host}
        if (item.http_host | default('') | length > 0)
        else omit
      }}
    status_code: "{{ _tier_b_url_codes }}"
    follow_redirects: none
    validate_certs: false
    timeout: 30
  loop: "{{ deployment_tier_b_url_checks_to_probe | default([]) }}"
  loop_control:
    label: "{{ item.name }}{% if item.http_host | default('') | length > 0 %} (Host: {{ item.http_host }}){% endif %}"
  register: deployment_tier_b_url_results
  failed_when: false
  delegate_to: localhost
  run_once: true
  when:
    - _tier_b_run_any | default(false) | bool
    - deployment_tier_b_url_checks_to_probe | default([]) | length > 0

- name: Compute Tier B FreeIPA Caddy vhost success (suppress redundant direct-FQDN warns)
  ansible.builtin.set_fact:
    _tier_b_ipa_caddy_ok: >-
      {%- set codes = _tier_b_url_codes | default([200, 301, 302, 303, 307, 308]) | map('int') | list -%}
      {%- set ns = namespace(any=false, ok=true) -%}
      {%- for r in deployment_tier_b_url_results.results | default([]) -%}
      {%- if (r.item.ipa_caddy_vhost | default(false) | bool) and not (r.skipped | default(false) | bool) -%}
      {%- set ns.any = true -%}
      {%- if (r.failed | default(false) | bool) or ((r.status | default(0) | int) not in codes) -%}
      {%- set ns.ok = false -%}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {{ (ns.any | bool) and (ns.ok | bool) }}
  delegate_to: localhost
  run_once: true
  when: deployment_tier_b_url_results is defined

- name: Warn when Tier B external service URL does not respond from controller
  ansible.builtin.debug:
    msg: >-
      Tier B warn: {{ item.item.name }} did not respond from controller
      (HTTP {{ item.status | default('n/a') }}; expected {{ _tier_b_url_codes | join('/') }}).
      Tier A may still pass — open SG to the Ansible controller or set deployment_{{ item.item.service | default('service') }}_external_url_verify: skip.
  loop: "{{ deployment_tier_b_url_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('URL') }}"
  when:
    - _tier_b_run_any | default(false) | bool
    - deployment_tier_b_url_results is defined
    - not (item.skipped | default(false) | bool)
    - item.item._mode | default('warn') == 'warn'
    - item.failed | default(false) or (item.status | default(0) | int not in _tier_b_url_codes)
    - not (
        item.item.ipa_direct_fqdn | default(false) | bool
        and (_tier_b_ipa_caddy_ok | default(false) | bool)
      )
  delegate_to: localhost
  run_once: true

- name: Fail when Tier B external service URL does not respond from controller
  ansible.builtin.fail:
    msg: >-
      Tier B fail: {{ item.item.name }} — {{ item.item.url }}
      (HTTP {{ item.status | default('n/a') }}; expected {{ _tier_b_url_codes | join('/') }}).
      Set deployment_{{ item.item.service | default('service') }}_external_url_verify: warn|skip or fix SG access.
  loop: "{{ deployment_tier_b_url_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('URL') }}"
  when:
    - _tier_b_run_any | default(false) | bool
    - deployment_tier_b_url_results is defined
    - not (item.skipped | default(false) | bool)
    - item.item._mode | default('warn') == 'fail'
    - item.failed | default(false) or (item.status | default(0) | int not in _tier_b_url_codes)
    - not (
        item.item.ipa_direct_fqdn | default(false) | bool
        and (_tier_b_ipa_caddy_ok | default(false) | bool)
      )
  delegate_to: localhost
  run_once: true

---
- name: Set OS-specific facts
  ansible.builtin.import_tasks: set_os_facts.yml

- name: Set IPA server FQDN
  ansible.builtin.set_fact:
    ipaserver: "ipaserver.{{ ipaserver_domain }}"

- name: Check if IPA client is configured
  ansible.builtin.stat:
    path: /etc/ipa/default.conf
  register: ipa_client_config

- name: Preflight hostname/DNS before ipa-client-install
  ansible.builtin.import_tasks: preflight_ipa_client_install.yml
  when: not ipa_client_config.stat.exists

- name: Install and configure FreeIPA client
  ansible.builtin.command: >
    ipa-client-install --unattended --force-join --force
    --realm={{ ipaserver_realm }} --domain={{ ipaserver_domain }} --server="{{ ipaserver }}"
    --principal={{ ipaadmin_principal }} --password={{ ipaadmin_password }}
    --mkhomedir --enable-dns-updates --ntp-server=pool.ntp.org
  register: ipa_client_output
  changed_when: ipa_client_output.rc == 0 and not ipa_client_config.stat.exists
  failed_when: false
  when: not ipa_client_config.stat.exists
  no_log: true

- name: Capture tail of ipaclient-install.log when client install failed
  ansible.builtin.shell: tail -n 50 /var/log/ipaclient-install.log 2>/dev/null || true
  register: ipa_client_install_log_tail
  changed_when: false
  when:
    - not ipa_client_config.stat.exists
    - ipa_client_output is defined
    - ipa_client_output.rc | default(0) != 0

- name: Fail with ipa-client-install diagnostics
  ansible.builtin.fail:
    msg: >-
      ipa-client-install failed on {{ inventory_hostname }} (rc={{ ipa_client_output.rc }}).
      stderr (truncated, secrets redacted): {{
        ipa_client_output.stderr | default('')
        | replace(ipaadmin_password, '***')
        | truncate(1500, True)
      }}
      Last 50 lines of /var/log/ipaclient-install.log:
      {{ ipa_client_install_log_tail.stdout | default('(log missing or empty)') }}
      Common causes on scaled or new nodes: hostname/FQDN mismatch (re-run 02 and 03),
      stale /etc/hosts on peers, missing IPA PTR/A for this host (re-run 14_setup_dns_records.yml),
      duplicate host entry in IPA, clock skew (chronyd), or corrupted gzip on https://{{ ipaserver }}/ipa/json
      (check ipaserver zz-ipa-caddy-proxy.conf — mod_substitute must not cover /ipa/json; re-run PORTAL).
      Re-run enrollment for one host: ansible-playbook -i inventory.ini 16_setup_identity_client.yml
      --limit {{ inventory_hostname }} -e ansible_no_log=false with ANSIBLE_PRIVATE_KEY set.
      See ansible-playbooks/docs/RUNBOOK.md identity troubleshooting.
  when:
    - not ipa_client_config.stat.exists
    - ipa_client_output is defined
    - ipa_client_output.rc | default(0) != 0

- name: Print IPA client installation output
  ansible.builtin.debug:
    msg: "{{ ipa_client_output.stderr_lines }}"
  when: ipa_client_output is changed

- name: Ensure Kerberos ticket is available
  ansible.builtin.command: klist
  register: klist_output
  changed_when: false
  failed_when: false

- name: Obtain Kerberos ticket if missing
  ansible.builtin.shell: echo "{{ ipaadmin_password }}" | kinit {{ ipaadmin_principal }}
  register: kinit_result
  changed_when: kinit_result.rc == 0
  no_log: true
  when: "'No credentials cache found' in klist_output.stderr or klist_output.rc != 0"

- name: Verify IPA domain enrollment
  ansible.builtin.command: ipa ping
  register: ipa_ping
  changed_when: false
  failed_when: "'did not receive Kerberos credentials' in ipa_ping.stderr"

- name: List current Kerberos ticket
  ansible.builtin.command: klist -e
  register: kerberos_ticket
  changed_when: false

- name: Print Kerberos ticket details
  ansible.builtin.debug:
    msg: "{{ kerberos_ticket.stdout.replace('\t', '    ').split('\n') }}"

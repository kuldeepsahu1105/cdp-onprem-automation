---
- name: Set OS-specific facts
  ansible.builtin.import_tasks: set_os_facts.yml

- name: Set IPA server FQDN
  ansible.builtin.set_fact:
    ipaserver: "ipaserver.{{ ipaserver_domain }}"

- name: Detect IPA client install state (default.conf vs partial debris)
  ansible.builtin.import_tasks: detect_ipa_client_install_state.yml

- name: Unattended ipa-client-install uninstall before fresh enroll (partial/broken only)
  ansible.builtin.command: ipa-client-install --uninstall --unattended
  register: ipa_client_preflight_uninstall
  changed_when: ipa_client_preflight_uninstall.rc == 0
  failed_when: false
  when:
    - not (ipa_client_has_default_conf | default(false) | bool)
    - ipa_client_has_partial_state | default(false) | bool

- name: Log ipa-client-install uninstall result before enroll
  ansible.builtin.debug:
    msg: >-
      ipa-client-install --uninstall --unattended rc={{
      ipa_client_preflight_uninstall.rc | default('n/a')
      }}{% if (ipa_client_preflight_uninstall.stderr | default('') | trim) %}
      (stderr: {{ ipa_client_preflight_uninstall.stderr | default('') | truncate(400, True) }}){% endif %}
  when:
    - ipa_client_preflight_uninstall is defined
    - ipa_client_preflight_uninstall is not skipped

- name: Preflight hostname/DNS before ipa-client-install
  ansible.builtin.import_tasks: preflight_ipa_client_install.yml
  when:
    - not (ipa_client_has_default_conf | default(false) | bool)
    - ipa_client_preflight_enabled | default(false) | bool

- name: Install and configure FreeIPA client
  ansible.builtin.command: >
    ipa-client-install --unattended --force-join --force
    --realm={{ ipaserver_realm }} --domain={{ ipaserver_domain }} --server="{{ ipaserver }}"
    --principal={{ ipaadmin_principal }} --password={{ ipaadmin_password }}
    --mkhomedir --enable-dns-updates --ntp-server=pool.ntp.org
  register: ipa_client_output
  changed_when: >-
    ipa_client_output.rc == 0
    and not (ipa_client_has_default_conf | default(false) | bool)
  failed_when: false
  when: not (ipa_client_has_default_conf | default(false) | bool)
  no_log: true

- name: Capture tail of ipaclient-install.log when client install failed
  ansible.builtin.shell: tail -n 50 /var/log/ipaclient-install.log 2>/dev/null || true
  register: ipa_client_install_log_tail
  changed_when: false
  when:
    - not (ipa_client_has_default_conf | default(false) | bool)
    - ipa_client_output is defined
    - ipa_client_output.rc | default(0) != 0

- name: Fail with ipa-client-install diagnostics
  ansible.builtin.fail:
    msg: >-
      ipa-client-install failed on {{ inventory_hostname }} (rc={{ ipa_client_output.rc }}).
      stderr (truncated, secrets redacted): {{
        ipa_client_output.stderr | default('')
        | replace(ipaadmin_password, '***')
        | truncate(1500, True)
      }}
      Last 50 lines of /var/log/ipaclient-install.log:
      {{ ipa_client_install_log_tail.stdout | default('(log missing or empty)') }}
      Common causes on scaled or new nodes: hostname/FQDN mismatch (re-run 02 and 03),
      stale /etc/hosts on peers, missing IPA PTR/A for this host (re-run 14_setup_dns_records.yml),
      duplicate host entry in IPA, clock skew (chronyd), partial install debris (playbook runs
      ipa-client-install --uninstall --unattended when sysrestore or /etc/ipa fragments exist without
      default.conf; manual: ipa-client-install --uninstall --unattended on the host), or corrupted gzip
      on https://{{ ipaserver }}/ipa/json (check ipaserver zz-ipa-caddy-proxy.conf — mod_substitute
      must not cover /ipa/json; re-run PORTAL).
      Re-run enrollment for one host: ansible-playbook -i inventory.ini 16_setup_identity_client.yml
      --limit {{ inventory_hostname }} -e ansible_no_log=false with ANSIBLE_PRIVATE_KEY set.
      See ansible-playbooks/docs/OPERATIONS_GUIDE.md identity troubleshooting.
  when:
    - not (ipa_client_has_default_conf | default(false) | bool)
    - ipa_client_output is defined
    - ipa_client_output.rc | default(0) != 0

- name: Print IPA client installation output
  ansible.builtin.debug:
    msg: "{{ ipa_client_output.stderr_lines }}"
  when: ipa_client_output is changed

- name: Stat IPA client default.conf before Kerberos verify
  ansible.builtin.stat:
    path: /etc/ipa/default.conf
  register: ipa_client_default_conf_now

- name: Ensure FreeIPA client CA bundle is present after enrollment
  ansible.builtin.import_tasks: ensure_freeipa_client_ca.yml

- name: Verify complete FreeIPA client enrollment
  ansible.builtin.import_tasks: verify_freeipa_client_enrollment.yml

- name: Keep KEYRING default_ccache_name commented in krb5.conf after IPA client enroll
  ansible.builtin.import_tasks: ensure_krb5_default_ccache_commented.yml
  when: ipa_client_default_conf_now.stat.exists | default(false)

- name: Ensure Kerberos ticket is available (Ansible FILE ccache)
  ansible.builtin.command: klist
  register: klist_output
  changed_when: false
  failed_when: false
  environment:
    KRB5CCNAME: "FILE:{{ ipa_kerberos_ccache_path }}"

- name: Derive whether a Kerberos ticket is needed for IPA CLI
  ansible.builtin.set_fact:
    ipa_client_need_kerberos_ticket: >-
      {{
        ('No credentials cache found' in (klist_output.stderr | default('')))
        or ('No credentials cache found' in (klist_output.stdout | default('')))
        or (klist_output.rc | default(0) | int != 0)
      }}

- name: Obtain Kerberos ticket via host keytab (enrolled client)
  ansible.builtin.command:
    argv:
      - kinit
      - -c
      - "FILE:{{ ipa_kerberos_ccache_path }}"
      - -k
      - -t
      - /etc/krb5.keytab
      - "host/{{ ansible_fqdn }}@{{ ipaserver_realm }}"
  environment:
    KRB5CCNAME: "FILE:{{ ipa_kerberos_ccache_path }}"
  register: kinit_host_keytab_result
  changed_when: false
  failed_when: false
  when:
    - ipa_client_need_kerberos_ticket | bool
    - ipa_client_default_conf_now.stat.exists | default(false) | bool

- name: Obtain Kerberos ticket via IPA admin password
  ansible.builtin.shell: kinit -c "FILE:{{ ipa_kerberos_ccache_path }}" "{{ ipaadmin_principal }}"
  args:
    stdin: "{{ ipaadmin_password }}"
  environment:
    KRB5CCNAME: "FILE:{{ ipa_kerberos_ccache_path }}"
  register: kinit_admin_result
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - ipa_client_need_kerberos_ticket | bool
    - not (kinit_host_keytab_result.rc | default(1) | int == 0)

- name: Fail with Kerberos kinit diagnostics
  ansible.builtin.fail:
    msg: >-
      Kerberos kinit failed on {{ inventory_hostname }} after IPA client enrollment
      (install skipped={{ ipa_client_has_default_conf | default(false) }}).
      Host keytab kinit rc={{ kinit_host_keytab_result.rc | default('skipped') }};
      admin kinit rc={{ kinit_admin_result.rc | default('skipped') }}.
      klist rc={{ klist_output.rc | default('n/a') }} stderr={{
        (klist_output.stderr | default('') | truncate(300, True))
      }}.
      Check: test -f /etc/ipa/default.conf; test -f /etc/krb5.conf;
      klist; kinit {{ ipaadmin_principal }} (password must match ipaadmin_password /
      Jenkins ANSIBLE_GROUP_VARS_YAML — same as FreeIPA install on ipaserver);
      chronyc tracking (clock skew); getent hosts ipaserver.{{ ipaserver_domain }};
      on enrolled hosts: kinit -k -t /etc/krb5.keytab host/$(hostname -f)@{{ ipaserver_realm }}.
      Re-run: ansible-playbook -i inventory.ini 16_setup_identity_client.yml
      --limit {{ inventory_hostname }} -e ansible_no_log=false.
      See ansible-playbooks/docs/OPERATIONS_GUIDE.md identity troubleshooting.
  when:
    - ipa_client_need_kerberos_ticket | bool
    - not (kinit_host_keytab_result.rc | default(1) | int == 0)
    - not (kinit_admin_result.rc | default(1) | int == 0)

- name: Verify IPA domain enrollment
  ansible.builtin.command: ipa ping
  register: ipa_ping
  changed_when: false
  environment:
    KRB5CCNAME: "FILE:{{ ipa_kerberos_ccache_path }}"
  failed_when: >-
    'did not receive Kerberos credentials' in (
      (ipa_ping.stderr | default('')) ~ (ipa_ping.stdout | default(''))
    )

- name: List current Kerberos ticket
  ansible.builtin.command: klist -e
  register: kerberos_ticket
  changed_when: false
  environment:
    KRB5CCNAME: "FILE:{{ ipa_kerberos_ccache_path }}"

- name: Print Kerberos ticket details
  ansible.builtin.debug:
    msg: "{{ kerberos_ticket.stdout.replace('\t', '    ').split('\n') }}"

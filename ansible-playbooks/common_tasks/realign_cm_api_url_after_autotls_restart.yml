---
# After CM server restart (Auto-TLS): wait on /cm/version without re-running the full set_cm_api_url probe chain.

- name: CM API — decide whether stored API URL is usable (realign)
  ansible.builtin.set_fact:
    _cm_api_url_stored_valid: >-
      {{
        (cm_api_url | default('') | length > 0)
        and ('/api/v' in (cm_api_url | default('')))
        and (
          cm_api_url | default('')
          | regex_replace('^https?://', '')
          | split('/') | first | default('')
          | split(':') | first | default('')
          | length > 0
        )
      }}

- name: CM API — full URL discovery when base URL or version slug missing or invalid
  ansible.builtin.import_tasks: set_cm_api_url.yml
  when: >-
    (cm_api_url | default('') | length == 0)
    or (cm_api_version | default('') | length == 0)
    or not (_cm_api_url_stored_valid | default(false) | bool)

- name: CM API — resolve API host for HTTPS realign after restart
  ansible.builtin.import_tasks: resolve_cm_api_url_host.yml
  when:
    - cm_api_version | default('') | length > 0

- name: CM API — point URL at HTTPS manager port after Auto-TLS restart (no /api/version probe chain)
  ansible.builtin.set_fact:
    cm_protocol: https
    cm_api_port: "{{ cm_https_port | default(7183) }}"
    cm_api_https_active: true
    cm_api_use_https: true
    cm_autotls_complete: true
    cm_api_url: >-
      {{
        'https://'
        ~ _cm_api_url_host_resolved
        ~ ':'
        ~ (cm_https_port | default(7183) | string)
        ~ '/api/'
        ~ cm_api_version
      }}
  when:
    - cm_api_version | default('') | length > 0
    - _cm_api_url_host_resolved | default('') | length > 0

- name: CM API — wait for local HTTPS listener after Auto-TLS restart
  block:
    - name: CM API — wait for scm-server HTTPS port on manager
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ cm_https_port | default(7183) }}"
        state: started
        delay: 5
        sleep: 5
        timeout: "{{ cm_autotls_https_startup_timeout | default(600) | int }}"
      delegate_to: "{{ cm_manager_inventory_host }}"
      become: true

  rescue:
    - name: CM API — collect scm-server service status after HTTPS startup failure
      ansible.builtin.command:
        argv:
          - systemctl
          - status
          - cloudera-scm-server
          - --no-pager
          - --lines=30
      delegate_to: "{{ cm_manager_inventory_host }}"
      become: true
      register: cm_autotls_scm_server_status
      changed_when: false
      failed_when: false

    - name: CM API — collect recent scm-server journal after HTTPS startup failure
      ansible.builtin.command:
        argv:
          - journalctl
          - --unit=cloudera-scm-server
          - --no-pager
          - --lines=50
      delegate_to: "{{ cm_manager_inventory_host }}"
      become: true
      register: cm_autotls_scm_server_journal
      changed_when: false
      failed_when: false

    - name: CM API — fail with scm-server startup diagnostics
      ansible.builtin.fail:
        msg: |-
          Cloudera Manager accepted generateCmca and was restarted, but HTTPS
          :{{ cm_https_port | default(7183) }} did not listen within
          {{ cm_autotls_https_startup_timeout | default(600) }} seconds.

          systemctl status:
          {{ cm_autotls_scm_server_status.stdout | default('unavailable') }}

          Recent journal:
          {{ cm_autotls_scm_server_journal.stdout | default('unavailable') }}

- name: CM API — wait for /cm/version after CM server restart
  ansible.builtin.import_tasks: wait_for_cm_api.yml

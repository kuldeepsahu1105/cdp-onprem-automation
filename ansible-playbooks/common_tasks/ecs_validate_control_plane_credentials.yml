---
- name: Resolve ECS control plane URL
  ansible.builtin.import_tasks: resolve_ecs_control_plane_url.yml

- name: Require ECS control plane URL when data services install is enabled
  ansible.builtin.assert:
    that:
      - ecs_control_plane_url_effective | default('') | length > 0
    fail_msg: >-
      Set ecs_control_plane_url or ecs_app_domain so the console URL can be derived
      (https://console.<ecs_app_domain>).

- name: Require ECS API access key id
  ansible.builtin.assert:
    that:
      - ecs_api_access_key_id | default('') | length > 0
    fail_msg: >-
      Set ecs_api_access_key_id from the credentials file downloaded in User Management.

- name: Require ECS API private key
  ansible.builtin.assert:
    that:
      - ecs_api_private_key | default('') | length > 0
    fail_msg: >-
      Set ecs_api_private_key (private key from the access-key credentials file).

- name: Probe ECS control plane console URL (TLS)
  ansible.builtin.uri:
    url: "{{ ecs_control_plane_url_effective.rstrip('/') }}/"
    method: GET
    validate_certs: "{{ ecs_control_plane_validate_certs | default(false) | bool }}"
    status_code: [200, 301, 302, 303, 401, 403]
    timeout: 30
  register: ecs_cp_probe
  failed_when: false

- name: Report control plane reachability
  ansible.builtin.debug:
    msg: >-
      Control plane {{ ecs_control_plane_url_effective }} responded HTTP {{ ecs_cp_probe.status | default('unreachable') }}.
      Signed API calls require cdpcurl or Altus signing (see playbook docs).

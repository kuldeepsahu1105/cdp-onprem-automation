---
# Install ECS embedded control plane (cloudera.cluster v4 has no control_plane module).

- name: Read ECS cluster identity for control plane values
  ansible.builtin.uri:
    url: >-
      {{ cm_cluster_module_api_url }}/clusters/{{
      ecs_cluster_name | urlencode }}?view=full
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  register: ecs_control_plane_cluster
  changed_when: false
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Resolve ECS container UID for control plane values
  ansible.builtin.set_fact:
    ecs_control_plane_container_uid_effective: >-
      {{
        ecs_control_plane_container_uid
        | default(ecs_control_plane_cluster.json.uuid | default(''), true)
        | trim
      }}

- name: Require ECS container UID for control plane installation
  ansible.builtin.assert:
    that:
      - ecs_control_plane_container_uid_effective | length > 0
    fail_msg: >-
      Cloudera Manager did not return the UUID for ECS cluster
      '{{ ecs_cluster_name }}'. The embedded control plane requires this value
      as Container.Uid in valuesYaml.

- name: Build ECS control plane values YAML
  ansible.builtin.set_fact:
    ecs_control_plane_values_yaml: "{{ lookup('template', 'ecs_control_plane_values.yaml.j2') }}"

- name: Install ECS embedded control plane via CM API
  cloudera.cluster.cm_resource:
    host: "{{ cm_cluster_module_host }}"
    port: "{{ cm_cluster_module_port }}"
    version: "{{ cm_api_version }}"
    force_tls: "{{ cm_cluster_module_force_tls }}"
    username: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    verify_tls: false
    path: /controlPlanes/commands/installEmbeddedControlPlane
    method: POST
    body:
      remoteRepoUrl: "{{ ecs_pvc_repository_url | regex_replace('/?parcels/.*$', '') }}"
      experienceClusterName: "{{ ecs_cluster_name }}"
      datalakeClusterName: "{{ cdh_basecluster_name }}"
      valuesYaml: "{{ ecs_control_plane_values_yaml }}"
  register: ecs_control_plane_install
  ignore_errors: true
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Fail when ECS control plane install returned an unexpected error
  ansible.builtin.fail:
    msg: "{{ ecs_control_plane_install.msg | default(ecs_control_plane_install) }}"
  when:
    - ecs_control_plane_install is failed
    - "'already' not in (ecs_control_plane_install.msg | default('') | lower)"
    - "'409' not in (ecs_control_plane_install.msg | default(''))"

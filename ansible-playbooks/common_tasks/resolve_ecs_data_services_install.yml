---
# Build ecs_data_services_install_names from per-service flags and/or ecs_data_services_install list.
# Per-service flags (ecs_deploy_cdw, ecs_deploy_cde, ecs_deploy_cai, ecs_deploy_cai_registry) union
# with ecs_data_services_install when set. Registry installs as model_registry internally.

- name: Normalize ecs_data_services_install list from group_vars
  ansible.builtin.set_fact:
    _ecs_data_services_from_list: >-
      {{
        (
          ecs_data_services_install
          | default([])
          | map('lower')
          | list
        )
        if (
          ecs_data_services_install | default([]) | length > 0
          and (ecs_data_services_install | first) is string
        )
        else (
          ecs_data_services_install
          | default([])
          | selectattr('enabled', 'defined')
          | selectattr('enabled')
          | map(attribute='name')
          | map('lower')
          | list
        )
      }}

- name: Normalize per-service deploy flags from environment
  ansible.builtin.set_fact:
    _ecs_deploy_cdw_flag: "{{ lookup('env', 'ECS_DEPLOY_CDW') | default('', true) | lower in ['1', 'true', 'yes'] }}"
    _ecs_deploy_cde_flag: "{{ lookup('env', 'ECS_DEPLOY_CDE') | default('', true) | lower in ['1', 'true', 'yes'] }}"
    _ecs_deploy_cai_flag: "{{ lookup('env', 'ECS_DEPLOY_CAI') | default('', true) | lower in ['1', 'true', 'yes'] }}"
    _ecs_deploy_cai_registry_flag: "{{ lookup('env', 'ECS_DEPLOY_CAI_REGISTRY') | default('', true) | lower in ['1', 'true', 'yes'] }}"

- name: Resolve ECS data services install names
  ansible.builtin.set_fact:
    ecs_data_services_install_names: >-
      {{
        (
          (['cdw'] if (ecs_deploy_cdw | default(false) | bool or _ecs_deploy_cdw_flag | bool) else [])
          + (['cde'] if (ecs_deploy_cde | default(false) | bool or _ecs_deploy_cde_flag | bool) else [])
          + (['cai'] if (ecs_deploy_cai | default(false) | bool or _ecs_deploy_cai_flag | bool) else [])
          + (
            ['model_registry']
            if (ecs_deploy_cai_registry | default(false) | bool or _ecs_deploy_cai_registry_flag | bool)
            else []
          )
          + (_ecs_data_services_from_list | default([]))
        )
        | unique
        | list
      }}

- name: Enable data services phase when any per-service deploy flag is set
  ansible.builtin.set_fact:
    ecs_data_services_deploy_enabled: true
  when:
    - not (ecs_data_services_deploy_enabled | default(false) | bool)
    - ecs_data_services_install_names | length > 0

---
# Prevent a brownfield FreeIPA deployment from being reconciled with a different
# inventory domain. On a fresh host, default.conf is absent and installation proceeds.

- name: Check existing FreeIPA server configuration for domain protection
  ansible.builtin.stat:
    path: /etc/ipa/default.conf
  delegate_to: "{{ ipaserver_inventory_host }}"
  become: true
  register: existing_ipa_domain_default_conf
  run_once: true
  when:
    - identity_provider_effective == 'freeipa'
    - ipa_server_in_inventory | default(false) | bool

- name: Read existing FreeIPA server configuration for domain protection
  ansible.builtin.slurp:
    path: /etc/ipa/default.conf
  delegate_to: "{{ ipaserver_inventory_host }}"
  become: true
  register: existing_ipa_domain_default_conf_content
  run_once: true
  when:
    - identity_provider_effective == 'freeipa'
    - ipa_server_in_inventory | default(false) | bool
    - existing_ipa_domain_default_conf.stat.exists | default(false) | bool

- name: Decode existing FreeIPA server configuration
  ansible.builtin.set_fact:
    existing_ipa_default_conf_text: >-
      {{
        existing_ipa_domain_default_conf_content.content
        | b64decode
      }}
  run_once: true
  when:
    - identity_provider_effective == 'freeipa'
    - ipa_server_in_inventory | default(false) | bool
    - existing_ipa_domain_default_conf.stat.exists | default(false) | bool

- name: Extract existing FreeIPA domain and realm
  ansible.builtin.set_fact:
    existing_ipa_domain_from_config: >-
      {{
        (
          existing_ipa_default_conf_text
          | regex_findall('(?im)^\\s*domain\\s*=\\s*([^\\s#;]+)')
          | first
          | default('')
        )
        | trim
        | lower
        | regex_replace('\\.$', '')
      }}
    existing_ipa_realm_from_config: >-
      {{
        (
          existing_ipa_default_conf_text
          | regex_findall('(?im)^\\s*realm\\s*=\\s*([^\\s#;]+)')
          | first
          | default('')
        )
        | trim
        | lower
        | regex_replace('\\.$', '')
      }}
  run_once: true
  when:
    - identity_provider_effective == 'freeipa'
    - ipa_server_in_inventory | default(false) | bool
    - existing_ipa_domain_default_conf.stat.exists | default(false) | bool

- name: Resolve existing FreeIPA domain
  ansible.builtin.set_fact:
    existing_ipa_domain: >-
      {{
        existing_ipa_domain_from_config
        if existing_ipa_domain_from_config | length > 0
        else existing_ipa_realm_from_config
      }}
    requested_ipa_domain_normalized: >-
      {{
        ipaserver_domain
        | trim
        | lower
        | regex_replace('\\.$', '')
      }}
  run_once: true
  when:
    - identity_provider_effective == 'freeipa'
    - ipa_server_in_inventory | default(false) | bool
    - existing_ipa_domain_default_conf.stat.exists | default(false) | bool

- name: Require a readable domain from existing FreeIPA configuration
  ansible.builtin.assert:
    that:
      - existing_ipa_domain | default('') | length > 0
    fail_msg: >-
      /etc/ipa/default.conf exists on {{ ipaserver_inventory_host }}, but neither
      a domain nor realm value could be read. This indicates an incomplete or
      malformed FreeIPA configuration, not confirmed domain drift. Run the
      FreeIPA recovery/install phase before hostname, DNS, wildcard, or portal
      reconciliation.
  run_once: true
  when:
    - identity_provider_effective == 'freeipa'
    - ipa_server_in_inventory | default(false) | bool
    - existing_ipa_domain_default_conf.stat.exists | default(false) | bool

- name: Refuse FreeIPA domain drift on an existing deployment
  ansible.builtin.assert:
    that:
      - existing_ipa_domain == requested_ipa_domain_normalized
    fail_msg: >-
      Existing FreeIPA is configured for domain "{{ existing_ipa_domain }}",
      but this run requests ipaserver_domain="{{ ipaserver_domain }}". Refusing
      to change hostnames, DNS records, wildcard records, or portal links across
      identity domains. Use the installed domain in ANSIBLE_GROUP_VARS_YAML. A
      domain migration requires a separate explicit migration procedure.
  run_once: true
  when:
    - identity_provider_effective == 'freeipa'
    - ipa_server_in_inventory | default(false) | bool
    - existing_ipa_domain_default_conf.stat.exists | default(false) | bool
    - existing_ipa_domain | default('') | length > 0

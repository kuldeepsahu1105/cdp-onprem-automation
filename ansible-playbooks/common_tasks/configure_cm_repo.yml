---
- name: Set CM repository OS version path (RHEL)
  ansible.builtin.set_fact:
    cm_repo_os_version: "{{ ansible_distribution | lower }}{{ ansible_distribution_major_version }}"
  when: ansible_os_family == "RedHat"

- name: Set CM repository OS version path (Ubuntu)
  ansible.builtin.set_fact:
    cm_repo_os_version: "ubuntu{{ ansible_distribution_version | replace('.', '') }}"
  when:
    - ansible_os_family == "Debian"
    - ansible_distribution == "Ubuntu"

- name: Set CM repository OS version path (Debian with Ubuntu repo fallback)
  ansible.builtin.set_fact:
    cm_repo_os_version: "ubuntu{{ cm_debian_ubuntu_compat_version }}"
  when:
    - ansible_os_family == "Debian"
    - ansible_distribution == "Debian"
    - cm_debian_use_ubuntu_repo | default(false) | bool

- name: Reject unsupported pure Debian CM apt repo path
  ansible.builtin.fail:
    msg: >-
      Cloudera Manager apt repositories are published for Ubuntu (ubuntu2204/ubuntu2404).
      Use Ubuntu for cldr-mngr, or set cm_debian_use_ubuntu_repo: true in group_vars/all.yml
      to use ubuntu{{ cm_debian_ubuntu_compat_version }} packages on Debian (unsupported by Cloudera).
  when:
    - ansible_os_family == "Debian"
    - ansible_distribution == "Debian"
    - not (cm_debian_use_ubuntu_repo | default(false) | bool)

- name: Download official Cloudera Manager yum repo file (RHEL, public)
  ansible.builtin.get_url:
    url: "{{ cm_repo_public_base_url }}/cm7/{{ cm_version }}/{{ cm_repo_os_version }}/yum/cloudera-manager.repo"
    dest: "{{ os.cm_repo_dir }}/{{ os.cm_repo_file }}"
    owner: root
    group: root
    mode: "0644"
    url_username: "{{ cm_repo_username }}"
    url_password: "{{ cm_repo_password }}"
    force_basic_auth: true
  when:
    - ansible_os_family == "RedHat"
    - cm_repo_source == 'public'

- name: Inject archive credentials into cloudera-manager.repo placeholders (RHEL)
  ansible.builtin.replace:
    path: "{{ os.cm_repo_dir }}/{{ os.cm_repo_file }}"
    regexp: "{{ item }}"
    replace: "{{ cm_repo_username }}:{{ cm_repo_password }}"
  loop:
    - 'username:password'
    - 'USERNAME:PASSWORD'
    - '\[username\]:\[password\]'
  when:
    - ansible_os_family == "RedHat"
    - cm_repo_source == 'public'

- name: Configure Cloudera Manager yum repository from template (internal mirror)
  ansible.builtin.template:
    src: templates/cloudera-manager.repo.j2
    dest: "{{ os.cm_repo_dir }}/{{ os.cm_repo_file }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - ansible_os_family == "RedHat"
    - cm_repo_source == 'internal'

- name: Download official Cloudera Manager apt sources list (Debian family, public)
  ansible.builtin.get_url:
    url: "{{ cm_repo_public_base_url }}/cm7/{{ cm_version }}/{{ cm_repo_os_version }}/apt/cloudera-manager.list"
    dest: "{{ os.cm_repo_dir }}/{{ os.cm_repo_file }}"
    owner: root
    group: root
    mode: "0644"
    url_username: "{{ cm_repo_username }}"
    url_password: "{{ cm_repo_password }}"
    force_basic_auth: true
  when:
    - ansible_os_family == "Debian"
    - cm_repo_source == 'public'

- name: Inject archive credentials into cloudera-manager.list placeholders
  ansible.builtin.replace:
    path: "{{ os.cm_repo_dir }}/{{ os.cm_repo_file }}"
    regexp: "{{ item }}"
    replace: "{{ cm_repo_username }}:{{ cm_repo_password }}"
  loop:
    - 'username:password'
    - 'USERNAME:PASSWORD'
    - '\[username\]:\[password\]'
  when:
    - ansible_os_family == "Debian"
    - cm_repo_source == 'public'

- name: Download Cloudera Manager apt archive signing key (Debian family, public)
  ansible.builtin.get_url:
    url: "{{ cm_repo_public_base_url }}/cm7/{{ cm_version }}/{{ cm_repo_os_version }}/apt/archive.key"
    dest: /tmp/cloudera-cm-archive.key
    mode: "0644"
    url_username: "{{ cm_repo_username }}"
    url_password: "{{ cm_repo_password }}"
    force_basic_auth: true
  when:
    - ansible_os_family == "Debian"
    - cm_repo_source == 'public'

- name: Import Cloudera Manager apt archive signing key (public)
  ansible.builtin.apt_key:
    file: /tmp/cloudera-cm-archive.key
    state: present
  when:
    - ansible_os_family == "Debian"
    - cm_repo_source == 'public'

- name: Set CM apt suite for internal mirror clients
  ansible.builtin.set_fact:
    cm_apt_suite: "{{ ansible_distribution_release }}-cm{{ cm_version.split('.')[:3] | join('.') }}"
  when:
    - ansible_os_family == "Debian"
    - cm_repo_source == 'internal'

- name: Download Cloudera Manager apt archive signing key (internal mirror)
  ansible.builtin.get_url:
    url: "http://{{ cm_repo_mirror_host }}/cloudera-repos/cloudera-manager/apt/archive.key"
    dest: /tmp/cloudera-cm-archive.key
    mode: "0644"
  when:
    - ansible_os_family == "Debian"
    - cm_repo_source == 'internal'

- name: Import Cloudera Manager apt archive signing key (internal mirror)
  ansible.builtin.apt_key:
    file: /tmp/cloudera-cm-archive.key
    state: present
  when:
    - ansible_os_family == "Debian"
    - cm_repo_source == 'internal'

- name: Configure Cloudera Manager apt repository from template (internal mirror)
  ansible.builtin.template:
    src: templates/cloudera-manager.list.j2
    dest: "{{ os.cm_repo_dir }}/{{ os.cm_repo_file }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - ansible_os_family == "Debian"
    - cm_repo_source == 'internal'

- name: Update apt cache after adding Cloudera Manager repository (Debian family)
  ansible.builtin.apt:
    update_cache: true
  when: ansible_os_family == "Debian"

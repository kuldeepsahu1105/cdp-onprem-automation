---
# Playbook 16 (localhost play): resolve Caddy gate and build portal facts for IPA HTTPD on ipaserver.
# ipaserver play runs sync_ipa_httpd_caddy_proxy_state_on_ipaserver.yml (manage apply/remove + preflight).
# Full PORTAL sync (10_setup_deployment_portal) runs manage_ipa_httpd_caddy_proxy_on_ipaserver.yml.

- name: Resolve deployment portal Caddy gate for IPA HTTPD snippet
  ansible.builtin.import_tasks: resolve_deployment_portal_caddy_enabled.yml

- name: Build deployment portal facts needed for IPA Caddy HTTPD mapping
  ansible.builtin.import_tasks: build_deployment_portal_facts.yml
  when:
    - deployment_portal_caddy_effective | default(false) | bool
    - groups.get('ipaserver', []) | length > 0

- name: Note when IPA HTTPD Caddy proxy was skipped (run PORTAL or enable Caddy vhosts)
  ansible.builtin.debug:
    msg: >-
      Skipped ensure_ipa_httpd_behind_caddy_before_client: deployment_portal_caddy_effective={{
      deployment_portal_caddy_effective | default(false) }}, ipa_caddy_public_hostname={{
      ipa_caddy_public_hostname | default('') | trim | length }} chars.
      When FreeIPA UI uses the ops Caddy vhost, run playbook 10_setup_deployment_portal (Jenkins PORTAL)
      or set deployment_portal_enabled and caddy_vhost_enabled before playbook 16.
  when:
    - not (
        (deployment_portal_caddy_effective | default(false) | bool)
        and (deployment_portal_has_ipa | default(false) | bool)
        and (ipa_caddy_public_hostname | default('') | length > 0)
      )

---
# Labs openshift pattern: render Caddy CM vhost (cm.<ops-ip>.pvc.cloudera-labs.com:81 → cldr-mngr :7180/:7183)
# and reload Caddy only — no Tier B verify, no monitoring stack churn.

- name: Detect monitoring on ops host (Caddy template flags)
  ansible.builtin.import_tasks: detect_deployment_portal_monitoring_on_host.yml

- name: Refresh monitoring flags for Caddy render
  ansible.builtin.import_tasks: refresh_deployment_portal_monitoring_context.yml

- name: Render deployment portal Caddyfile (CM + vhosts)
  ansible.builtin.template:
    src: deployment_portal_Caddyfile.j2
    dest: "{{ deployment_portal_config_dir }}/Caddyfile"
    mode: "0644"
  register: caddyfile_render

- name: Validate Caddyfile before reload
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - -v
      - "{{ deployment_portal_config_dir }}/Caddyfile:/etc/caddy/Caddyfile:ro,z"
      - "{{ deployment_portal_caddy_image }}"
      - caddy
      - validate
      - --config
      - /etc/caddy/Caddyfile
      - --adapter
      - caddyfile
  register: caddy_validate_pre_up
  changed_when: false

- name: Fail when CM Caddyfile is invalid
  ansible.builtin.fail:
    msg: >-
      Caddyfile failed validation on {{ inventory_hostname }}.
      CM upstream should target {{ deployment_portal_cm_upstream_host | default('') }}:{{ cm_http_port }} (HTTP)
      or :{{ cm_https_port }} when autotls_enabled.
      {{ caddy_validate_pre_up.stderr | default('') | trim }}
  when: caddy_validate_pre_up.rc != 0

- name: Ensure deployment portal compose stack is up
  ansible.builtin.command:
    argv: >-
      {{
        deployment_portal_compose_argv
        + ['-f', deployment_portal_config_dir ~ '/docker-compose.yml', 'up', '-d', '--remove-orphans']
      }}
  register: portal_compose_up
  changed_when: >-
    'Creating' in (portal_compose_up.stdout ~ portal_compose_up.stderr)
    or 'Starting' in (portal_compose_up.stdout ~ portal_compose_up.stderr)
    or 'Recreating' in (portal_compose_up.stdout ~ portal_compose_up.stderr)

- name: Recreate Caddy when Caddyfile changed (CM reverse proxy entry)
  ansible.builtin.command:
    argv: >-
      {{
        deployment_portal_compose_argv
        + ['-f', deployment_portal_config_dir ~ '/docker-compose.yml', 'up', '-d', '--force-recreate', 'caddy']
      }}
  when: caddyfile_render is changed
  register: caddy_recreate
  failed_when: caddy_recreate.rc != 0

- name: Update deployment portal index after CM Caddy sync
  ansible.builtin.template:
    src: deployment_portal_index.html.j2
    dest: "{{ deployment_portal_www_dir }}/index.html"
    mode: "0644"

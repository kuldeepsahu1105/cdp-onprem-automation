---
# Discover the CM-internal numeric ECS service ID and build browser links.
# Portal refresh must remain safe before CM/ECS exists, so all probes are optional.

- name: Initialize ECS Cloudera Manager portal links
  ansible.builtin.set_fact:
    deployment_portal_ecs_cm_links: []
    deployment_portal_ecs_service_id: ""

- name: Select browser-facing Cloudera Manager base URL for ECS links
  ansible.builtin.set_fact:
    deployment_portal_cm_ui_base_url: >-
      {{
        (cm_external_url | default('') | trim | regex_replace('/+$', ''))
        if (cm_external_url | default('') | trim | length > 0)
        else (
          'https://' + deployment_portal_cm_public_ip + ':' + (cm_https_port | string)
          if (
            deployment_portal_access_profile_effective == 'cloud'
            and deployment_portal_cm_public_ip | default('') | length > 0
          )
          else (
            'https://' + deployment_portal_cm_fqdn + ':' + (cm_https_port | string)
          )
        )
      }}
  when:
    - deployment_portal_ecs_present | default(false) | bool
    - deployment_portal_cm_fqdn | default('') | length > 0

- name: Select controller-reachable Cloudera Manager host for ECS service discovery
  ansible.builtin.set_fact:
    deployment_portal_cm_api_discovery_host: >-
      {{
        deployment_portal_cm_public_ip
        if (
          deployment_portal_access_profile_effective == 'cloud'
          and deployment_portal_cm_public_ip | default('') | length > 0
        )
        else (
          deployment_portal_cm_private_ip
          if deployment_portal_cm_private_ip | default('') | length > 0
          else deployment_portal_cm_fqdn
        )
      }}
  when:
    - deployment_portal_ecs_present | default(false) | bool
    - deployment_portal_cm_fqdn | default('') | length > 0

- name: Probe Cloudera Manager API version for ECS service discovery
  ansible.builtin.uri:
    url: "{{ item }}/api/version"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: true
    return_content: true
    follow_redirects: none
    validate_certs: false
    status_code: [200, 401, 403]
    timeout: 5
  loop:
    - "https://{{ deployment_portal_cm_api_discovery_host }}:{{ cm_https_port }}"
    - "http://{{ deployment_portal_cm_api_discovery_host }}:{{ cm_http_port }}"
  register: deployment_portal_cm_api_version_probes
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - deployment_portal_ecs_present | default(false) | bool
    - deployment_portal_cm_api_discovery_host | default('') | length > 0

- name: Select working Cloudera Manager API version response
  ansible.builtin.set_fact:
    deployment_portal_cm_api_version_probe: >-
      {{
        (
          deployment_portal_cm_api_version_probes.results
          | default([])
          | selectattr('status', 'defined')
          | selectattr('status', 'equalto', 200)
          | list
          | first
        )
        | default({})
      }}
  when: deployment_portal_cm_api_version_probes is defined

- name: Resolve Cloudera Manager API base for ECS service discovery
  ansible.builtin.set_fact:
    deployment_portal_cm_api_base_url: >-
      {{ deployment_portal_cm_api_version_probe.item | default('') | regex_replace('/+$', '') }}

- name: Resolve Cloudera Manager API version for ECS service discovery
  ansible.builtin.set_fact:
    deployment_portal_cm_api_version: >-
      {{
        deployment_portal_cm_api_version_probe.content
        | default('')
        | trim
        | regex_search('v[0-9]+')
        | default('', true)
      }}
  when: deployment_portal_cm_api_version_probe | default({}) | length > 0

- name: Query current ECS service from Cloudera Manager
  ansible.builtin.uri:
    url: >-
      {{ deployment_portal_cm_api_base_url }}/api/{{ deployment_portal_cm_api_version
      }}/clusters/{{ ecs_cluster_name | urlencode }}/services/ecs?view=full
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: true
    return_content: true
    validate_certs: false
    status_code: [200, 404]
    timeout: 10
  register: deployment_portal_ecs_cm_service
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - deployment_portal_cm_api_base_url | default('') | length > 0
    - deployment_portal_cm_api_version | default('') | length > 0

- name: Resolve numeric ECS service ID candidates from Cloudera Manager response
  ansible.builtin.set_fact:
    deployment_portal_ecs_service_id_field: >-
      {{
        deployment_portal_ecs_cm_service.json.serviceId
        | default(deployment_portal_ecs_cm_service.json.id | default(''))
        | string
        | trim
      }}
    deployment_portal_ecs_service_id_url: >-
      {{
        (
          deployment_portal_ecs_cm_service.json.serviceUrl
          | default('')
          | regex_findall('/cmf/services/([0-9]+)(?:/|$)')
          | first
        )
        | default('', true)
      }}
    deployment_portal_ecs_service_url: >-
      {{ deployment_portal_ecs_cm_service.json.serviceUrl | default('') | string | trim }}
  when:
    - deployment_portal_ecs_cm_service is defined
    - deployment_portal_ecs_cm_service.status | default(0) == 200
    - deployment_portal_ecs_cm_service.json is defined

- name: Resolve ECS service redirect URL when CM API did not expose a numeric path
  ansible.builtin.set_fact:
    deployment_portal_ecs_service_redirect_url: >-
      {{
        deployment_portal_ecs_service_url
        if deployment_portal_ecs_service_url is match('^https?://')
        else (
          deployment_portal_cm_api_base_url
          + '/'
          + (deployment_portal_ecs_service_url | regex_replace('^/+', ''))
        )
      }}
  when:
    - deployment_portal_ecs_service_id_field | default('') is not match('^[0-9]+$')
    - deployment_portal_ecs_service_id_url | default('') | length == 0
    - deployment_portal_ecs_service_url | default('') | length > 0

- name: Follow ECS service UI redirect to discover numeric CM service ID
  ansible.builtin.uri:
    url: "{{ deployment_portal_ecs_service_redirect_url }}"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: true
    return_content: false
    follow_redirects: none
    validate_certs: false
    status_code: [200, 301, 302, 303, 307, 308]
    timeout: 10
  register: deployment_portal_ecs_service_redirect
  changed_when: false
  failed_when: false
  no_log: true
  when: deployment_portal_ecs_service_redirect_url | default('') | length > 0

- name: Resolve numeric ECS service ID from CM UI redirect
  ansible.builtin.set_fact:
    deployment_portal_ecs_service_id_redirect: >-
      {{
        (
          deployment_portal_ecs_service_redirect.location
          | default(deployment_portal_ecs_service_redirect.url | default(''))
          | regex_findall('/cmf/services/([0-9]+)(?:/|$)')
          | first
        )
        | default('', true)
      }}
  when: deployment_portal_ecs_service_redirect is defined

- name: Select numeric ECS service ID
  ansible.builtin.set_fact:
    deployment_portal_ecs_service_id: >-
      {{
        deployment_portal_ecs_service_id_field
        if (
          deployment_portal_ecs_service_id_field
          | default('')
          is match('^[0-9]+$')
        )
        else (
          deployment_portal_ecs_service_id_url
          if deployment_portal_ecs_service_id_url | default('') | length > 0
          else deployment_portal_ecs_service_id_redirect | default('')
        )
      }}
  when:
    - deployment_portal_ecs_service_id_field is defined
      or deployment_portal_ecs_service_id_url is defined
      or deployment_portal_ecs_service_id_redirect is defined

- name: Build ECS Management and Longhorn portal links
  ansible.builtin.set_fact:
    deployment_portal_ecs_cm_links: >-
      {{
        lookup('template', 'deployment_portal_ecs_cm_links.j2')
        | from_yaml
        | default([], true)
      }}
  when:
    - deployment_portal_cm_ui_base_url | default('') | length > 0
    - deployment_portal_ecs_service_id | default('') is match('^[0-9]+$')

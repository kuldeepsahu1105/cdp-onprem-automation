---
# Tier B portal + CM + monitoring + IPA + ECS external URL checks from the Ansible controller.
# Tier A (127.0.0.1 + Caddy Host vhosts on the ops host) already ran in verify_deployment_portal_urls.yml.
# Tier C (hairpin to own public EIP on the ops host) is optional warn-only in that same file.

- name: Resolve deployment portal URL verify milestones for Tier B
  ansible.builtin.import_tasks: resolve_deployment_portal_verify_milestones.yml

- name: Verify external service URLs from Ansible controller (Tier B)
  ansible.builtin.import_tasks: verify_service_urls_from_controller.yml
  when: _portal_verify_milestones_effective | default([]) | length > 0

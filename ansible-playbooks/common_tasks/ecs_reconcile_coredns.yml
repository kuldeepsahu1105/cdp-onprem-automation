---
# Forward ECS DNS directly to the identity-provider DNS servers without requiring
# kubernetes.core or controller-side kubeconfig.

- name: Resolve ECS CoreDNS forwarders
  ansible.builtin.set_fact:
    ecs_coredns_forwarders_effective: >-
      {{
        ecs_coredns_forwarders
        if ecs_coredns_forwarders | default([]) | length > 0
        else (
          [
            hostvars[groups['ipaserver'][0]].private_ip
            | default(hostvars[groups['ipaserver'][0]].ansible_host, true)
          ]
          if (
            identity_provider_effective | default('freeipa') == 'freeipa'
            and groups.get('ipaserver', []) | length > 0
          )
          else (
            ad_dns_servers | default([])
            if identity_provider_effective | default('') == 'ad'
            else []
          )
        )
      }}

- name: Require ECS CoreDNS forwarders
  ansible.builtin.assert:
    that:
      - ecs_coredns_forwarders_effective | length > 0
      - ecs_coredns_forwarders_effective | reject('equalto', '') | list | length
        == ecs_coredns_forwarders_effective | length
    fail_msg: >-
      ECS CoreDNS requires direct identity-provider DNS forwarders. For FreeIPA,
      ensure the ipaserver inventory host has private_ip/ansible_host. For AD,
      set ad_dns_servers. To override either mode, set ecs_coredns_forwarders.

- name: Build ECS CoreDNS forward stanza
  ansible.builtin.set_fact:
    ecs_coredns_forward_stanza: >-
      forward . {{ ecs_coredns_forwarders_effective | join(' ') }}

- name: Check ECS kubectl binary
  ansible.builtin.stat:
    path: "{{ ecs_coredns_kubectl_path }}"
  register: ecs_coredns_kubectl
  become: yes
  delegate_to: "{{ groups[ecs_cluster_master_group][0] }}"
  until:
    - ecs_coredns_kubectl.stat.exists | default(false)
    - ecs_coredns_kubectl.stat.executable | default(false)
  retries: "{{ ecs_control_plane_install_poll_retries | default(240) }}"
  delay: "{{ ecs_control_plane_install_poll_delay | default(15) }}"

- name: Require ECS kubectl binary
  ansible.builtin.assert:
    that:
      - ecs_coredns_kubectl.stat.exists | default(false)
      - ecs_coredns_kubectl.stat.executable | default(false)
    fail_msg: >-
      ECS CoreDNS reconciliation requires {{ ecs_coredns_kubectl_path }} on
      {{ groups[ecs_cluster_master_group][0] }} after control-plane installation.

- name: Read ECS CoreDNS Corefile
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_coredns_namespace }}"
      - get
      - configmap
      - "{{ ecs_coredns_configmap_name }}"
      - --output
      - jsonpath={.data.Corefile}
  register: ecs_coredns_corefile
  changed_when: false
  become: yes
  delegate_to: "{{ groups[ecs_cluster_master_group][0] }}"
  until: ecs_coredns_corefile.rc == 0
  retries: "{{ ecs_control_plane_wait_retries | default(40) }}"
  delay: "{{ ecs_control_plane_wait_delay | default(15) }}"

- name: Build identity-aware ECS CoreDNS Corefile
  ansible.builtin.set_fact:
    ecs_coredns_corefile_sequential: >-
      {{
        ecs_coredns_corefile.stdout
        | regex_replace(
            '(?s)forward\\s+\\.\\s+[^\\n{]+(?:\\s*\\{.*?\\})?',
            ecs_coredns_forward_stanza
          )
      }}
  when: ecs_coredns_forward_stanza not in ecs_coredns_corefile.stdout

- name: Require replaceable ECS CoreDNS forward stanza
  ansible.builtin.assert:
    that:
      - ecs_coredns_corefile_sequential != ecs_coredns_corefile.stdout
    fail_msg: >-
      CoreDNS ConfigMap {{ ecs_coredns_configmap_name }} does not contain the expected
      forward stanza; refusing an unsafe replacement. Expected direct upstreams:
      {{ ecs_coredns_forwarders_effective | join(' ') }}.
  when: ecs_coredns_corefile_sequential is defined

- name: Apply direct ECS CoreDNS forwarding policy
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_coredns_namespace }}"
      - patch
      - configmap
      - "{{ ecs_coredns_configmap_name }}"
      - --type
      - merge
      - --patch
      - "{{ {'data': {'Corefile': ecs_coredns_corefile_sequential}} | to_json }}"
  register: ecs_coredns_patch
  changed_when: ecs_coredns_patch.rc == 0
  become: yes
  delegate_to: "{{ groups[ecs_cluster_master_group][0] }}"
  when: ecs_coredns_corefile_sequential is defined

- name: Restart ECS CoreDNS pods after configuration change
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_coredns_namespace }}"
      - delete
      - pods
      - --selector
      - k8s-app=kube-dns
  register: ecs_coredns_restart
  changed_when: ecs_coredns_restart.rc == 0
  become: yes
  delegate_to: "{{ groups[ecs_cluster_master_group][0] }}"
  when: ecs_coredns_patch is changed

- name: Record ECS CoreDNS reconciliation for this run
  ansible.builtin.set_fact:
    ecs_coredns_reconciled_this_run: true

---
# Same JSON-RPC probe as preflight_ipa_client_install.yml, run on ipaserver before workers enroll.

- name: Preflight IPA server — probe /ipa/json on canonical HTTPS (loopback)
  ansible.builtin.uri:
    url: "https://{{ deployment_portal_ipa_fqdn }}/ipa/json"
    method: POST
    body_format: json
    body:
      method: ping
      params: [[], {}]
      id: 0
    headers:
      Content-Type: application/json
      Accept-Encoding: gzip
    validate_certs: false
    return_content: true
    status_code: [200, 401, 403, 500]
    timeout: 30
  register: ipa_server_preflight_ipa_json
  failed_when: false

- name: Preflight IPA server — derive /ipa/json body shape
  ansible.builtin.set_fact:
    ipa_server_preflight_ipa_json_body_prefix: >-
      {{ (ipa_server_preflight_ipa_json.content | default('') | string | trim)[:1] }}
    ipa_server_preflight_ipa_json_content_type: >-
      {{ ipa_server_preflight_ipa_json.content_type | default('') | lower }}

- name: Preflight IPA server — set JSON-RPC probe success
  ansible.builtin.set_fact:
    ipa_server_preflight_ipa_json_ok: >-
      {{
        (ipa_server_preflight_ipa_json.status | default(0) | int) > 0
        and (
          'json' in ipa_server_preflight_ipa_json_content_type
          or ipa_server_preflight_ipa_json_body_prefix in ['{', '[']
        )
        and 'html' not in ipa_server_preflight_ipa_json_content_type
        and ipa_server_preflight_ipa_json_body_prefix != '<'
      }}

- name: Preflight IPA server — fail when /ipa/json returns HTML login instead of JSON-RPC
  ansible.builtin.fail:
    msg: >-
      https://{{ deployment_portal_ipa_fqdn }}/ipa/json on ipaserver returned HTML (or non-JSON), not gzip JSON-RPC.
      HTTP {{ ipa_server_preflight_ipa_json.status | default('n/a') }};
      Content-Type: {{ ipa_server_preflight_ipa_json.content_type | default('n/a') }}.
      Body preview: {{
        (ipa_server_preflight_ipa_json.content | default('') | string)[:200]
        | replace('\n', ' ')
      }}.
      Re-run Jenkins PORTAL or playbook 16 (removes zz-ipa-caddy-proxy.conf and ipa-rewrite Caddy markers by default),
      or set deployment_portal_ipa_httpd_proxy_enabled: true only if you need managed HTML rewrites.
      Then apachectl configtest && systemctl reload httpd.
      See ansible-playbooks/docs/RUNBOOK.md.
  when: not (ipa_server_preflight_ipa_json_ok | default(false) | bool)

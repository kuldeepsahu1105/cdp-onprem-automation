---
- name: CDW | Complete Data Warehouse installation
  when: "'cdw' in (ecs_data_services_install_names | default([]))"
  block:
    - name: Record Data Warehouse provisioning result
      ansible.builtin.set_fact:
        ecs_cdw_cluster_succeeded: >-
          {{
            ecs_cdw_cluster.finished | default(false) | bool
            and (ecs_cdw_cluster.cluster | default({})) is mapping
            and (ecs_cdw_cluster.cluster | default({})).id | default('') | length > 0
            and (ecs_cdw_cluster.cluster | default({})).status | default('') == 'Running'
          }}

    - name: Report Data Warehouse provisioning failure
      ansible.builtin.debug:
        msg: >-
          CDW provisioning did not return a cluster:
          {{ ecs_cdw_cluster.msg | default(ecs_cdw_cluster | to_json) }}
      when: not (ecs_cdw_cluster_succeeded | bool)

    - name: Collect CDW Kubernetes diagnostics after cluster failure
      ansible.builtin.include_tasks: ecs_data_service_cdw_diagnostics.yml
      when: not (ecs_cdw_cluster_succeeded | bool)

    - name: Remove Data Warehouse async result
      ansible.builtin.async_status:
        jid: "{{ ecs_cdw_cluster_job.ansible_job_id }}"
        mode: cleanup
      changed_when: false
      when:
        - ecs_cdw_cluster_job is defined
        - ecs_cdw_cluster.finished | default(false) | bool
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh

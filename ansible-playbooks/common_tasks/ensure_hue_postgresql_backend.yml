---
- name: Check psycopg 3 in Hue parcel environment
  ansible.builtin.command:
    argv:
      - "{{ base_cluster_hue_python_interpreter_effective }}"
      - -c
      - |
        import psycopg
        print(psycopg.__version__)
  register: base_cluster_hue_psycopg_check
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ base_cluster_hue_service_user }}"

- name: Install readable psycopg 3 binary driver for discovered Hue Python
  ansible.builtin.pip:
    name: >-
      {{
          'psycopg[binary]==' ~ base_cluster_hue_psycopg_binary_version
          if base_cluster_hue_psycopg_binary_version | default('') | length > 0
          else 'psycopg[binary]>=3.1.8,<4'
      }}
    executable: "{{ base_cluster_hue_python_interpreter_effective | dirname }}/pip"
    extra_args: --upgrade --force-reinstall
    umask: "0022"
  register: base_cluster_hue_psycopg_install
  when: base_cluster_hue_psycopg_check.rc | int != 0
  become: true

- name: Verify Hue Django PostgreSQL backend
  ansible.builtin.command:
    argv:
      - "{{ base_cluster_hue_python_interpreter_effective }}"
      - -c
      - |
        import django
        import psycopg
        import django.db.backends.postgresql.base as backend

        print(f"django={django.get_version()}")
        print(f"psycopg={psycopg.__version__}")
        print(f"backend={backend.__file__}")
  register: base_cluster_hue_postgresql_backend_verify
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ base_cluster_hue_service_user }}"

- name: Require working Hue Django PostgreSQL backend
  ansible.builtin.assert:
    that:
      - base_cluster_hue_postgresql_backend_verify.rc | int == 0
    fail_msg: >-
      Hue parcel Python {{ base_cluster_hue_python_runtime_version | default('unknown') }}
      at {{ base_cluster_hue_python_interpreter_effective }} cannot load Django's
      PostgreSQL backend as service user {{ base_cluster_hue_service_user }}
      after driver reconciliation.
      Initial psycopg stderr={{ base_cluster_hue_psycopg_check.stderr | default('') | trim }};
      final stdout={{ base_cluster_hue_postgresql_backend_verify.stdout | default('') | trim }};
      final stderr={{ base_cluster_hue_postgresql_backend_verify.stderr | default('') | trim }}.

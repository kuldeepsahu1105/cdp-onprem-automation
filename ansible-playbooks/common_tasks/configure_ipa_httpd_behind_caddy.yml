---
# FreeIPA Apache tweaks when UI is reached via deployment portal Caddy vhost (HTTP upstream).
# Complements Caddy header_up Host/Referer in deployment_portal_Caddyfile_vhosts.inc.j2.

- name: Resolve ipaserver OS family for delegated IPA HTTPD tasks
  ansible.builtin.set_fact:
    ipa_httpd_delegate_host: "{{ groups['ipaserver'][0] }}"
    ipa_httpd_os_family: >-
      {{
        hostvars[groups['ipaserver'][0]].ansible_os_family
        | default(ansible_os_family | default('RedHat'))
      }}

- name: Set IPA Apache paths from ipaserver OS family
  ansible.builtin.set_fact:
    ipa_httpd_conf_d_dir: "{{ os_vars[ipa_httpd_os_family].web_server_conf_d_dir }}"
    ipa_httpd_service_name: "{{ os_vars[ipa_httpd_os_family].web_server_service }}"

- name: Probe FreeIPA ipa-rewrite.conf location (RHEL httpd vs Debian apache2 layouts)
  ansible.builtin.stat:
    path: "{{ item }}/ipa-rewrite.conf"
  loop:
    - "{{ ipa_httpd_conf_d_dir }}"
    - /etc/httpd/conf.d
    - /etc/apache2/conf.d
  register: ipa_rewrite_conf_probe
  when:
    - deployment_portal_has_ipa | default(false) | bool
    - ipa_caddy_public_hostname | default('') | length > 0

- name: Choose effective FreeIPA Apache conf.d directory on ipaserver
  ansible.builtin.set_fact:
    ipa_httpd_conf_d_effective: >-
      {{
        (
          ipa_rewrite_conf_probe.results
          | default([])
          | selectattr('stat.exists', 'defined')
          | selectattr('stat.exists')
          | map(attribute='item')
          | list
          | first
        )
        | default(ipa_httpd_conf_d_dir, true)
      }}
  when:
    - deployment_portal_has_ipa | default(false) | bool
    - ipa_caddy_public_hostname | default('') | length > 0

- name: Check whether FreeIPA server is configured on ipaserver
  ansible.builtin.stat:
    path: /etc/ipa/default.conf
  register: ipa_server_configured
  when:
    - deployment_portal_has_ipa | default(false) | bool
    - ipa_caddy_public_hostname | default('') | length > 0

- name: Ensure Apache/httpd package is present on ipaserver for Caddy proxy snippets
  ansible.builtin.package:
    name: "{{ ipa_httpd_service_name }}"
    state: present
  when:
    - deployment_portal_has_ipa | default(false) | bool
    - ipa_caddy_public_hostname | default('') | length > 0
    - ipa_server_configured is defined
    - ipa_server_configured.stat.exists | default(false) | bool

- name: Ensure FreeIPA Apache conf.d directory exists on ipaserver
  ansible.builtin.file:
    path: "{{ ipa_httpd_conf_d_effective }}"
    state: directory
    mode: "0755"
  when:
    - deployment_portal_has_ipa | default(false) | bool
    - ipa_caddy_public_hostname | default('') | length > 0
    - ipa_httpd_conf_d_effective is defined
    - ipa_httpd_conf_d_effective | length > 0

- name: Install FreeIPA HTTPD snippet for deployment portal Caddy proxy
  ansible.builtin.template:
    src: ipa_httpd_caddy_proxy.conf.j2
    dest: "{{ ipa_httpd_conf_d_effective }}/zz-ipa-caddy-proxy.conf"
    mode: "0644"
  register: ipa_httpd_caddy_proxy_conf
  when:
    - deployment_portal_has_ipa | default(false) | bool
    - ipa_caddy_public_hostname | default('') | length > 0
    - ipa_httpd_conf_d_effective is defined
    - ipa_httpd_conf_d_effective | length > 0

- name: Stat FreeIPA ipa-rewrite.conf for HTTPS redirect tweaks
  ansible.builtin.stat:
    path: "{{ ipa_httpd_conf_d_effective }}/ipa-rewrite.conf"
  register: ipa_rewrite_conf
  when:
    - deployment_portal_has_ipa | default(false) | bool
    - ipa_httpd_conf_d_effective is defined

- name: Check whether FreeIPA ipa-rewrite HTTPS redirect is already disabled for Caddy
  ansible.builtin.command:
    cmd: "grep -q 'ANSIBLE_CADDY_HTTP_UPSTREAM' {{ ipa_httpd_conf_d_effective }}/ipa-rewrite.conf"
  register: ipa_rewrite_caddy_marker
  changed_when: false
  failed_when: false
  when:
    - deployment_portal_has_ipa | default(false) | bool
    - ipa_rewrite_conf is defined
    - ipa_rewrite_conf.stat.exists | default(false) | bool

- name: Disable FreeIPA ipa-rewrite forced HTTPS redirect for HTTP Caddy upstream
  ansible.builtin.replace:
    path: "{{ ipa_httpd_conf_d_effective }}/ipa-rewrite.conf"
    after: '# Redirect to the secure port if not displaying an error or retrieving'
    before: '# Rewrite for plugin'
    regexp: '^RewriteCond %\{SERVER_PORT\}  !\^443\$'
    replace: '# ANSIBLE_CADDY_HTTP_UPSTREAM — keep /ipa on HTTP when proxied from Caddy\n# RewriteCond %{SERVER_PORT}  !^443$'
  register: ipa_rewrite_https_cond
  when:
    - deployment_portal_has_ipa | default(false) | bool
    - ipa_rewrite_conf is defined
    - ipa_rewrite_conf.stat.exists | default(false) | bool
    - ipa_rewrite_caddy_marker is defined
    - ipa_rewrite_caddy_marker.rc != 0

- name: Comment remaining lines in ipa-rewrite HTTPS redirect block for Caddy
  ansible.builtin.replace:
    path: "{{ ipa_httpd_conf_d_effective }}/ipa-rewrite.conf"
    after: '# ANSIBLE_CADDY_HTTP_UPSTREAM'
    before: '# Rewrite for plugin'
    regexp: '^(RewriteCond %\{REQUEST_URI\}|RewriteRule \^/ipa/)'
    replace: '# \1'
  register: ipa_rewrite_https_block
  when:
    - deployment_portal_has_ipa | default(false) | bool
    - ipa_rewrite_conf is defined
    - ipa_rewrite_conf.stat.exists | default(false) | bool
    - ipa_rewrite_https_cond is defined
    - ipa_rewrite_https_cond is changed

- name: Reload Apache when FreeIPA Caddy proxy configuration changed
  ansible.builtin.service:
    name: "{{ ipa_httpd_service_name }}"
    state: reloaded
  when:
    - deployment_portal_has_ipa | default(false) | bool
    - ipa_httpd_service_name is defined
    - >-
      (ipa_httpd_caddy_proxy_conf is defined and ipa_httpd_caddy_proxy_conf is changed)
      or (ipa_rewrite_https_cond is defined and ipa_rewrite_https_cond is changed)
      or (ipa_rewrite_https_block is defined and ipa_rewrite_https_block is changed)

---
- name: Install PostgreSQL Python driver packages
  ansible.builtin.package:
    name: >-
      {{
        ['python3-pip', 'python3-psycopg2']
        + (python_psycopg2_runtime_packages | default([]))
      }}
    state: present

- name: Resolve Python interpreters that require psycopg2
  ansible.builtin.set_fact:
    python_psycopg2_interpreters_effective: >-
      {{
        (
          [
            python_psycopg2_interpreter
            | default(ansible_python_interpreter | default('/usr/bin/python3')),
            python_psycopg2_versioned_interpreter
            | default('/usr/bin/python' + (python_version | string))
          ]
          + (python_psycopg2_additional_interpreters | default([]))
        )
        | unique
        | list
      }}

- name: Check psycopg2 in each Python interpreter
  ansible.builtin.command:
    argv:
      - "{{ item }}"
      - -c
      - "import psycopg2; print(psycopg2.__version__)"
  loop: "{{ python_psycopg2_interpreters_effective }}"
  register: python_psycopg2_import
  changed_when: false
  failed_when: false

- name: Install psycopg2-binary in each Python interpreter when required
  ansible.builtin.command:
    argv:
      - "{{ item.item }}"
      - -m
      - pip
      - install
      - "{{ 'psycopg2-binary==' + psycopg2_binary_version if psycopg2_binary_version | default('') | length > 0 else 'psycopg2-binary' }}"
  environment:
    PIP_BREAK_SYSTEM_PACKAGES: "1"
  loop: "{{ python_psycopg2_import.results }}"
  when: item.rc | int != 0
  changed_when: true

- name: Verify psycopg2 in each Python interpreter
  ansible.builtin.command:
    argv:
      - "{{ item }}"
      - -c
      - "import psycopg2; print(psycopg2.__version__)"
  loop: "{{ python_psycopg2_interpreters_effective }}"
  register: python_psycopg2_verify
  changed_when: false

---
- name: Resolve psycopg2 target host
  ansible.builtin.set_fact:
    python_psycopg2_target_host_effective: >-
      {{ python_psycopg2_target_host | default(inventory_hostname) }}

- name: Gather distribution facts for psycopg2 target host when unavailable
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - distribution
  delegate_to: "{{ python_psycopg2_target_host_effective }}"
  delegate_facts: true
  when: hostvars[python_psycopg2_target_host_effective].ansible_os_family is not defined

- name: Resolve psycopg2 target OS family
  ansible.builtin.set_fact:
    python_psycopg2_os_family_effective: >-
      {{
        hostvars[python_psycopg2_target_host_effective].ansible_os_family
        | default(ansible_os_family | default(''))
      }}

- name: Require a supported psycopg2 target OS family
  ansible.builtin.assert:
    that:
      - python_psycopg2_os_family_effective in ['RedHat', 'Debian']
    fail_msg: >-
      Could not resolve a supported OS family for psycopg2 target
      {{ python_psycopg2_target_host_effective }}
      (resolved={{ python_psycopg2_os_family_effective | default('unknown') }}).

- name: Install PostgreSQL Python driver packages (RHEL family)
  ansible.builtin.dnf:
    name: >-
      {{
        ['python3-pip', 'python3-psycopg2']
        + (python_psycopg2_runtime_packages | default([]))
      }}
    state: present
    disablerepo: >-
      {{
        python_psycopg2_disabled_repositories
        | default(
            os_vars[python_psycopg2_os_family_effective].prereq_disabled_repositories
            | default([])
          )
      }}
  delegate_to: "{{ python_psycopg2_target_host_effective }}"
  when: python_psycopg2_os_family_effective == "RedHat"

- name: Install PostgreSQL Python driver packages (Debian family)
  ansible.builtin.apt:
    name: >-
      {{
        ['python3-pip', 'python3-psycopg2']
        + (python_psycopg2_runtime_packages | default([]))
      }}
    state: present
  delegate_to: "{{ python_psycopg2_target_host_effective }}"
  when: python_psycopg2_os_family_effective == "Debian"

- name: Resolve Python interpreters requiring psycopg2
  ansible.builtin.set_fact:
    python_psycopg2_interpreters: >-
      {{
        (
          [
            python_psycopg2_interpreter
            | default(
                hostvars[python_psycopg2_target_host_effective].ansible_python_interpreter
                | default('/usr/bin/python3')
              ),
            python_psycopg2_versioned_interpreter
            | default('/usr/bin/python' ~ (python_version | string))
          ]
          + (python_psycopg2_additional_interpreters | default([]))
        )
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | unique
        | list
      }}

- name: Check psycopg2 in each required Python interpreter
  ansible.builtin.command:
    argv:
      - "{{ item }}"
      - -c
      - "import psycopg2; print(psycopg2.__version__)"
  loop: "{{ python_psycopg2_interpreters }}"
  loop_control:
    label: "{{ item }}"
  delegate_to: "{{ python_psycopg2_target_host_effective }}"
  register: python_psycopg2_import
  changed_when: false
  failed_when: false

- name: Require each Python interpreter to run before installing psycopg2
  ansible.builtin.assert:
    that:
      - >-
        item.rc | int == 0
        or "No module named 'psycopg2'" in (item.stderr | default(''))
    fail_msg: >-
      Python interpreter {{ item.item }} cannot run successfully:
      {{ item.stderr | default(item.stdout | default('unknown interpreter error')) }}.
      Repair the interpreter runtime before installing psycopg2.
  loop: "{{ python_psycopg2_import.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Install psycopg2-binary in each Python interpreter when required
  ansible.builtin.command:
    argv:
      - "{{ item.item }}"
      - -m
      - pip
      - install
      - "{{ 'psycopg2-binary==' + psycopg2_binary_version if psycopg2_binary_version | default('') | length > 0 else 'psycopg2-binary' }}"
  environment:
    PIP_BREAK_SYSTEM_PACKAGES: "1"
  delegate_to: "{{ python_psycopg2_target_host_effective }}"
  loop: "{{ python_psycopg2_import.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.rc | int != 0
    - >-
      "No module named 'psycopg2'" in (item.stderr | default(''))
  changed_when: true

- name: Verify psycopg2 in each required Python interpreter
  ansible.builtin.command:
    argv:
      - "{{ item }}"
      - -c
      - "import psycopg2; print(psycopg2.__version__)"
  loop: "{{ python_psycopg2_interpreters }}"
  loop_control:
    label: "{{ item }}"
  delegate_to: "{{ python_psycopg2_target_host_effective }}"
  register: python_psycopg2_verify
  changed_when: false

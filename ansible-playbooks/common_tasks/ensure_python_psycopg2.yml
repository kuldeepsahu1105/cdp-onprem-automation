---
- name: Install PostgreSQL Python driver packages
  ansible.builtin.package:
    name:
      - python3-pip
      - python3-psycopg2
    state: present

- name: Check psycopg2 in the Ansible Python interpreter
  ansible.builtin.command:
    argv:
      - "{{ python_psycopg2_interpreter | default(ansible_python_interpreter | default('/usr/bin/python3')) }}"
      - -c
      - "import psycopg2; print(psycopg2.__version__)"
  register: python_psycopg2_import
  changed_when: false
  failed_when: false

- name: Install psycopg2-binary in the Ansible Python interpreter when required
  ansible.builtin.command:
    argv:
      - "{{ python_psycopg2_interpreter | default(ansible_python_interpreter | default('/usr/bin/python3')) }}"
      - -m
      - pip
      - install
      - "{{ 'psycopg2-binary==' + psycopg2_binary_version if psycopg2_binary_version | default('') | length > 0 else 'psycopg2-binary' }}"
  environment:
    PIP_BREAK_SYSTEM_PACKAGES: "1"
  when: python_psycopg2_import.rc | int != 0
  changed_when: true

- name: Verify psycopg2 in the Ansible Python interpreter
  ansible.builtin.command:
    argv:
      - "{{ python_psycopg2_interpreter | default(ansible_python_interpreter | default('/usr/bin/python3')) }}"
      - -c
      - "import psycopg2; print(psycopg2.__version__)"
  register: python_psycopg2_verify
  changed_when: false

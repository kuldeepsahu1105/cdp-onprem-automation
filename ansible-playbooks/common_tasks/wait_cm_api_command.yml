---
# Poll a Cloudera Manager async command until it completes.
# Required vars: cm_krb_api_url, cm_admin_user, cm_admin_pass, cm_api_command_id
# Bounds: cm_api_command_poll_retries × cm_api_command_poll_delay (defaults in group_vars/all.yml).

- name: Wait for CM API command {{ cm_api_command_id }}
  ansible.builtin.uri:
    url: "{{ cm_krb_api_url }}/commands/{{ cm_api_command_id }}"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200, 301, 303]
  register: cm_api_command_poll
  until: >
    cm_api_command_poll.json.active is defined
    and not (cm_api_command_poll.json.active | bool)
  retries: "{{ cm_api_command_poll_retries | default(90) }}"
  delay: "{{ cm_api_command_poll_delay | default(10) }}"
  ignore_errors: true

- name: Fail when CM API command poll timed out
  ansible.builtin.fail:
    msg: >-
      CM API command {{ cm_api_command_id }} did not finish within
      {{ (cm_api_command_poll_retries | default(90) | int) * (cm_api_command_poll_delay | default(10) | int) }}s
      ({{ cm_api_command_poll_retries | default(90) }} retries × {{ cm_api_command_poll_delay | default(10) }}s delay).
      Last state: active={{ cm_api_command_poll.json.active | default('unknown') }},
      success={{ cm_api_command_poll.json.success | default('unknown') }}.
  when: >
    cm_api_command_poll.json.active is not defined
    or (cm_api_command_poll.json.active | bool)

- name: Fail when CM API command did not succeed
  ansible.builtin.fail:
    msg: >-
      CM API command {{ cm_api_command_id }} failed:
      {{ cm_api_command_poll.json.resultMessage | default(cm_api_command_poll.json.result_message | default('unknown')) }}
  when:
    - cm_api_command_poll.json.active is defined
    - not (cm_api_command_poll.json.active | bool)
    - cm_api_command_poll.json.success is defined
    - not (cm_api_command_poll.json.success | bool)

---
# Poll a Cloudera Manager async command until it completes.
# Required vars: cm_krb_api_url, cm_admin_user, cm_admin_pass, cm_api_command_id
# Bounds: cm_api_command_poll_retries × cm_api_command_poll_delay (defaults in group_vars/all.yml).

- name: Wait for CM API command {{ cm_api_command_id }}
  ansible.builtin.uri:
    url: "{{ cm_krb_api_url }}/commands/{{ cm_api_command_id }}"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  delegate_to: "{{ cm_api_uri_delegate_to | default('localhost', true) }}"
  register: cm_api_command_poll
  until: >
    cm_api_command_poll.json.active is defined
    and not (cm_api_command_poll.json.active | bool)
  retries: "{{ cm_api_command_poll_retries | default(90) }}"
  delay: "{{ cm_api_command_poll_delay | default(10) }}"
  failed_when: false

- name: Fail when CM API command poll timed out
  ansible.builtin.fail:
    msg: >-
      CM API command {{ cm_api_command_id }} did not finish within
      {{ (cm_api_command_poll_retries | default(90) | int) * (cm_api_command_poll_delay | default(10) | int) }}s
      ({{ cm_api_command_poll_retries | default(90) }} retries × {{ cm_api_command_poll_delay | default(10) }}s delay).
      Last state: active={{ cm_api_command_poll.json.active | default('unknown') }},
      success={{ cm_api_command_poll.json.success | default('unknown') }}.
  when: >
    cm_api_command_poll.status | default(0) | int != 200
    or cm_api_command_poll.json.active is not defined
    or (cm_api_command_poll.json.active | bool)

- name: Resolve CM API command failure state
  ansible.builtin.set_fact:
    cm_api_command_failed: >-
      {{
        cm_api_command_poll.json.active is defined
        and not (cm_api_command_poll.json.active | bool)
        and cm_api_command_poll.json.success is defined
        and not (cm_api_command_poll.json.success | bool)
      }}
    cm_api_command_failure_allowed: >-
      {{
        (
          cm_api_command_allow_already_exists | default(false) | bool
          and 'already exists' in (
            cm_api_command_poll.json.resultMessage
            | default(cm_api_command_poll.json.result_message | default(''))
            | lower
          )
        )
        or (
          cm_api_command_allow_not_valid | default(false) | bool
          and 'command not valid for' in (
            cm_api_command_poll.json.resultMessage
            | default(cm_api_command_poll.json.result_message | default(''))
            | lower
          )
        )
      }}

- name: Read failed CM API command details
  ansible.builtin.uri:
    url: "{{ cm_krb_api_url }}/commands/{{ cm_api_command_id }}?view=full"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  delegate_to: "{{ cm_api_uri_delegate_to | default('localhost', true) }}"
  register: cm_api_failed_command_details
  changed_when: false
  when:
    - cm_api_command_failed | bool
    - not (cm_api_command_failure_allowed | bool)

- name: Read failed CM API child command details
  ansible.builtin.uri:
    url: "{{ cm_krb_api_url }}/commands/{{ item.id }}?view=full"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  loop: >-
    {{
      (cm_api_failed_command_details | default({})).get('json', {})
      .get('children', {}).get('items', [])
      | rejectattr('success', 'equalto', true)
      | list
    }}
  loop_control:
    label: >-
      {{
        item.get('serviceRef', {}).get(
          'serviceDisplayName',
          item.name | default(item.id | string)
        )
      }}
  delegate_to: "{{ cm_api_uri_delegate_to | default('localhost', true) }}"
  register: cm_api_failed_child_commands
  changed_when: false
  when:
    - cm_api_command_failed | bool
    - not (cm_api_command_failure_allowed | bool)
    - cm_api_failed_command_details.status | default(0) | int == 200

- name: Fail when CM API command did not succeed
  ansible.builtin.fail:
    msg: |-
      CM API command {{ cm_api_command_id }} failed:
      {{ cm_api_failed_command_details.json.resultMessage | default(cm_api_command_poll.json.resultMessage | default(cm_api_command_poll.json.result_message | default('unknown'))) }}
      {% for result in cm_api_failed_child_commands.results | default([]) %}
      - {{ result.json.get('serviceRef', {}).get('serviceDisplayName', result.json.name | default(result.item.name | default('unknown'))) }}: {{ result.json.resultMessage | default('unknown') }}
      {% for child in result.json.get('children', {}).get('items', []) if not (child.success | default(false) | bool) %}
        - {{ child.name | default(child.id | string) }}: {{ child.resultMessage | default('unknown') }}
      {% endfor %}
      {% endfor %}
  when:
    - cm_api_command_failed | bool
    - not (cm_api_command_failure_allowed | bool)

---
- name: IPAServer operator — install PostgreSQL client
  ansible.builtin.package:
    name: "{{ 'postgresql' if ansible_os_family == 'RedHat' else 'postgresql-client' }}"
    state: present

- name: IPAServer operator — check Ansible installation
  ansible.builtin.command: ansible --version
  register: _ipaserver_ansible_check
  changed_when: false
  failed_when: false

- name: IPAServer operator — install Ansible from OS packages
  when: _ipaserver_ansible_check.rc != 0
  block:
    - name: IPAServer operator — install ansible-core package
      ansible.builtin.package:
        name: ansible-core
        state: present
  rescue:
    - name: IPAServer operator — install ansible-core with active Python
      ansible.builtin.pip:
        name: ansible-core
        executable: pip3

- name: IPAServer operator — build controller key candidates
  ansible.builtin.set_fact:
    _ipaserver_key_candidates: >-
      {{
        (
          [lookup('env', 'ANSIBLE_PRIVATE_KEY')]
          if lookup('env', 'ANSIBLE_PRIVATE_KEY') | length > 0
          else []
        )
        + [
            (
              ansible_ssh_private_key_file
              if ansible_ssh_private_key_file.startswith('/')
              else playbook_dir ~ '/' ~ (ansible_ssh_private_key_file | regex_replace('^\\./', ''))
            ),
            playbook_dir ~ '/sshkey.pem'
          ]
        + query('fileglob', playbook_dir ~ '/*.pem')
        | unique
      }}

- name: IPAServer operator — inspect controller key candidates
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ _ipaserver_key_candidates }}"
  register: _ipaserver_key_candidate_stats
  delegate_to: localhost
  become: false

- name: IPAServer operator — select controller private key
  ansible.builtin.set_fact:
    _ipaserver_private_key_source: >-
      {{
        _ipaserver_key_candidate_stats.results
        | selectattr('stat.exists')
        | selectattr('stat.isreg')
        | map(attribute='item')
        | first
        | default('')
      }}

- name: IPAServer operator — require controller private key
  ansible.builtin.assert:
    that:
      - _ipaserver_private_key_source | length > 0
    fail_msg: >-
      No Ansible private key was found on the controller. Set ANSIBLE_PRIVATE_KEY,
      ansible_ssh_private_key_file, or place sshkey.pem in ansible-playbooks/.

- name: IPAServer operator — copy inventory to root home
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/inventory.ini"
    dest: /root/inventory.ini
    owner: root
    group: root
    mode: "0600"

- name: IPAServer operator — use private addresses for in-VPC Ansible connections
  ansible.builtin.lineinfile:
    path: /root/inventory.ini
    regexp: '^({{ item | regex_escape }}[ \t]+.*\bansible_host=)\S+(.*)$'
    line: '\g<1>{{ hostvars[item].private_ip }}\g<2>'
    backrefs: true
  loop: "{{ groups['all'] | default([]) }}"
  when: hostvars[item].private_ip | default('') | trim | length > 0

- name: IPAServer operator — copy private key to root home
  ansible.builtin.copy:
    src: "{{ _ipaserver_private_key_source }}"
    dest: /root/sshkey.pem
    owner: root
    group: root
    mode: "0400"
  no_log: true

- name: IPAServer operator — configure Ansible defaults for root
  ansible.builtin.copy:
    dest: /root/ansible.cfg
    owner: root
    group: root
    mode: "0600"
    content: |
      [defaults]
      inventory = /root/inventory.ini
      private_key_file = /root/sshkey.pem
      force_valid_group_names = ignore
      interpreter_python = auto_silent

      [ssh_connection]
      pipelining = True

- name: IPAServer operator — verify installed commands
  ansible.builtin.command:
    argv:
      - /bin/bash
      - -c
      - ansible --version >/dev/null && psql --version >/dev/null
  changed_when: false

- name: IPAServer operator — inspect installed deployment files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /root/inventory.ini
    - /root/sshkey.pem
    - /root/ansible.cfg
  register: _ipaserver_operator_file_stats

- name: IPAServer operator — require installed deployment files
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false) | bool
      - item.stat.isreg | default(false) | bool
      - item.stat.size | default(0) | int > 0
      - item.stat.mode == ('0400' if item.item == '/root/sshkey.pem' else '0600')
    fail_msg: >-
      {{ item.item }} is missing, empty, not a regular file, or has mode
      {{ item.stat.mode | default('unknown') }}; expected
      {{ '0400' if item.item == '/root/sshkey.pem' else '0600' }}.
  loop: "{{ _ipaserver_operator_file_stats.results }}"

- name: IPAServer operator — find inventory hosts not using their private IP
  ansible.builtin.shell: |
    awk '
      /^[^#;\[]/ {
        host=$1; ansible_host=""; private_ip="";
        for (i=2; i<=NF; i++) {
          if ($i ~ /^ansible_host=/) { split($i, value, "="); ansible_host=value[2] }
          if ($i ~ /^private_ip=/) { split($i, value, "="); private_ip=value[2] }
        }
        if (private_ip != "" && ansible_host != private_ip) {
          print host ": ansible_host=" ansible_host ", private_ip=" private_ip
        }
      }
    ' /root/inventory.ini
  args:
    executable: /bin/bash
  register: _ipaserver_operator_inventory_mismatches
  changed_when: false

- name: IPAServer operator — require private IPs in local inventory
  ansible.builtin.assert:
    that:
      - _ipaserver_operator_inventory_mismatches.stdout | trim | length == 0
    fail_msg: |-
      /root/inventory.ini still contains non-private Ansible targets:
      {{ _ipaserver_operator_inventory_mismatches.stdout }}

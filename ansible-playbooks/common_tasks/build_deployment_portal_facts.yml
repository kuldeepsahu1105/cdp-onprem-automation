---
# Build deployment_portal_context on localhost (play should gather_facts: true).

- name: Resolve portal install host and PostgreSQL host
  ansible.builtin.import_tasks: resolve_deployment_portal_host.yml

- name: Detect deployed monitoring stack on portal ops host
  ansible.builtin.import_tasks: detect_deployment_portal_monitoring.yml

- name: Set deployment portal anchor host facts (Caddy / Grafana / Prometheus / pgAdmin)
  ansible.builtin.set_fact:
    deployment_portal_anchor_inv: "{{ groups[deployment_portal_host_group_effective][0] }}"
    deployment_portal_anchor_fqdn: >-
      {{ hostvars[groups[deployment_portal_host_group_effective][0]].cldr_hostname }}.{{ cluster_domain }}
    deployment_portal_ops_public_ip: "{{ hostvars[groups[deployment_portal_host_group_effective][0]].ansible_host }}"
    deployment_portal_ops_private_ip: >-
      {{ hostvars[groups[deployment_portal_host_group_effective][0]].private_ip
         | default(hostvars[groups[deployment_portal_host_group_effective][0]].ansible_host) }}
    deployment_portal_anchor_ip: "{{ hostvars[groups[deployment_portal_host_group_effective][0]].ansible_host }}"
    deployment_portal_anchor_group: "{{ deployment_portal_host_group_effective }}"

- name: Resolve portal access profile (cloud vs private / bare metal)
  ansible.builtin.import_tasks: resolve_deployment_portal_access_profile.yml

- name: Render deployment portal node inventory
  ansible.builtin.set_fact:
    deployment_portal_nodes: "{{ lookup('template', 'deployment_portal_nodes.j2') | from_yaml | default([], true) }}"

- name: Render deployment portal host inventory (unique hosts with roles)
  ansible.builtin.set_fact:
    deployment_portal_inventory_hosts: >-
      {{
        lookup('template', 'deployment_portal_inventory_hosts.j2') | from_yaml | default([], true)
      }}

- name: Render planned/configured role map for portal index
  ansible.builtin.set_fact:
    deployment_portal_planned_roles: >-
      {{
        lookup('template', 'deployment_portal_planned_roles.j2') | from_yaml | default([], true)
      }}

- name: Set CM manager FQDN for portal links
  ansible.builtin.set_fact:
    deployment_portal_cm_fqdn: >-
      {{
        hostvars[groups['cldr-mngr'][0]].cldr_hostname ~ '.' ~ cluster_domain
        if ('cldr-mngr' in groups and groups['cldr-mngr'] | length > 0)
        else deployment_portal_anchor_fqdn
      }}

- name: Set CM upstream address for Caddy reverse_proxy on ops host
  ansible.builtin.set_fact:
    deployment_portal_cm_upstream_host: >-
      {{
        hostvars[groups['cldr-mngr'][0]].private_ip | default('')
        if (
          'cldr-mngr' in groups
          and groups['cldr-mngr'] | default([]) | length > 0
          and (hostvars[groups['cldr-mngr'][0]].private_ip | default('') | length > 0)
        )
        else ''
      }}
  when:
    - "'cldr-mngr' in groups"
    - groups['cldr-mngr'] | default([]) | length > 0

- name: Default CM upstream to ansible_host when private_ip unset
  ansible.builtin.set_fact:
    deployment_portal_cm_upstream_host: "{{ hostvars[groups['cldr-mngr'][0]].ansible_host }}"
  when:
    - "'cldr-mngr' in groups"
    - groups['cldr-mngr'] | default([]) | length > 0
    - deployment_portal_cm_upstream_host | default('') | length == 0

- name: Clear CM upstream when cldr-mngr absent
  ansible.builtin.set_fact:
    deployment_portal_cm_upstream_host: ""
  when: not (('cldr-mngr' in groups) and (groups['cldr-mngr'] | default([]) | length > 0))

- name: Detect FreeIPA server in inventory
  ansible.builtin.set_fact:
    deployment_portal_has_ipa: "{{ groups.get('ipaserver', []) | length > 0 }}"

- name: Set FreeIPA UI hostname
  ansible.builtin.set_fact:
    deployment_portal_ipa_fqdn: >-
      {{ hostvars[groups['ipaserver'][0]].cldr_hostname }}.{{ cluster_domain }}
  when: deployment_portal_has_ipa | bool

- name: Clear FreeIPA hostname when not in inventory
  ansible.builtin.set_fact:
    deployment_portal_ipa_fqdn: ""
  when: not deployment_portal_has_ipa | bool

- name: Detect ECS inventory
  ansible.builtin.set_fact:
    deployment_portal_ecs_present: >-
      {{
        (ecs_cluster_master_group in groups)
        and (groups[ecs_cluster_master_group] | default([]) | length > 0)
      }}

- name: Set base cluster master FQDN for service links
  ansible.builtin.set_fact:
    deployment_portal_base_master_fqdn: >-
      {{
        hostvars[groups[base_cluster_master_group][0]].cldr_hostname ~ '.' ~ cluster_domain
        if (
          base_cluster_master_group in groups
          and groups[base_cluster_master_group] | length > 0
        )
        else ''
      }}

- name: Initialize dynamic data service links
  ansible.builtin.set_fact:
    deployment_portal_dynamic_links: []

- name: Build dynamic data service links from enabled base cluster services
  ansible.builtin.set_fact:
    deployment_portal_dynamic_links: "{{ deployment_portal_dynamic_links + [item.link] }}"
  loop:
    - condition: "{{ base_cluster_install_services.hue | default(false) }}"
      link:
        name: Hue
        url: "http://{{ deployment_portal_base_master_fqdn }}:8888"
        description: Base cluster Hue UI
    - condition: "{{ base_cluster_install_services.ranger | default(false) }}"
      link:
        name: Ranger Admin
        url: "http://{{ deployment_portal_base_master_fqdn }}:6080"
        description: Base cluster Ranger
    - condition: "{{ base_cluster_install_services.knox | default(false) }}"
      link:
        name: Knox Gateway
        url: "https://{{ deployment_portal_base_master_fqdn }}:8443/gateway/homepage/home"
        description: Knox (default TLS port; verify in CM)
  when:
    - deployment_portal_base_master_fqdn | length > 0
    - item.condition | bool

- name: Build direct access URL map (public vs VPC private IP)
  ansible.builtin.set_fact:
    deployment_portal_access_urls: "{{ lookup('template', 'deployment_portal_access_urls.j2') | from_yaml }}"

- name: Set Caddy vhost IP for URL map (private network / bare metal)
  ansible.builtin.set_fact:
    caddy_vhost_ip_for_urls: "{{ deployment_portal_ops_private_ip }}"
  when:
    - caddy_vhost_enabled | default(false) | bool
    - deployment_portal_access_profile_effective == 'private'

- name: Build Caddy vhost external URL map (private network / bare metal)
  ansible.builtin.set_fact:
    caddy_vhost_urls_external: "{{ lookup('template', 'caddy_vhost_urls.j2') | from_yaml }}"
    caddy_vhost_urls_vpc: {}
  when:
    - caddy_vhost_enabled | default(false) | bool
    - deployment_portal_access_profile_effective == 'private'

- name: Set Caddy vhost IP for public URL map (cloud / external (internet))
  ansible.builtin.set_fact:
    caddy_vhost_ip_for_urls: "{{ deployment_portal_ops_public_ip }}"
  when:
    - caddy_vhost_enabled | default(false) | bool
    - deployment_portal_access_profile_effective == 'cloud'

- name: Build Caddy vhost external URL map for public IP (cloud / external (internet))
  ansible.builtin.set_fact:
    caddy_vhost_urls_external: "{{ lookup('template', 'caddy_vhost_urls.j2') | from_yaml }}"
  when:
    - caddy_vhost_enabled | default(false) | bool
    - deployment_portal_access_profile_effective == 'cloud'

- name: Set Caddy vhost IP for VPC URL map (in-VPC clients on cloud)
  ansible.builtin.set_fact:
    caddy_vhost_ip_for_urls: "{{ deployment_portal_ops_private_ip }}"
  when:
    - caddy_vhost_enabled | default(false) | bool
    - deployment_portal_access_profile_effective == 'cloud'
    - caddy_vhost_register_private_ip | default(true) | bool
    - deployment_portal_ops_private_ip != deployment_portal_ops_public_ip

- name: Build Caddy vhost VPC URL map (in-VPC clients on cloud)
  ansible.builtin.set_fact:
    caddy_vhost_urls_vpc: "{{ lookup('template', 'caddy_vhost_urls.j2') | from_yaml }}"
  when:
    - caddy_vhost_enabled | default(false) | bool
    - deployment_portal_access_profile_effective == 'cloud'
    - caddy_vhost_register_private_ip | default(true) | bool
    - deployment_portal_ops_private_ip != deployment_portal_ops_public_ip

- name: Default empty Caddy VPC vhost map on cloud when private slug not used
  ansible.builtin.set_fact:
    caddy_vhost_urls_vpc: {}
  when:
    - caddy_vhost_enabled | default(false) | bool
    - deployment_portal_access_profile_effective == 'cloud'
    - not (
        caddy_vhost_register_private_ip | default(true) | bool
        and deployment_portal_ops_private_ip != deployment_portal_ops_public_ip
      )

- name: Set primary Caddy vhost map for portal context
  ansible.builtin.set_fact:
    caddy_vhost_urls: "{{ caddy_vhost_urls_external }}"
  when: caddy_vhost_enabled | default(false) | bool

- name: Set IPA Caddy vhost hostname for HTTPD Referer mapping
  ansible.builtin.set_fact:
    ipa_caddy_public_hostname: "{{ caddy_vhost_urls.ipa.hostname | default('') }}"
  when:
    - deployment_portal_has_ipa | bool
    - caddy_vhost_enabled | default(false) | bool
    - caddy_vhost_urls.ipa.hostname | default('') | length > 0

- name: Clear IPA Caddy vhost hostname when IPA or Caddy vhosts are disabled
  ansible.builtin.set_fact:
    ipa_caddy_public_hostname: ""
  when: not (deployment_portal_has_ipa | bool and caddy_vhost_enabled | default(false) | bool)

- name: Default empty Caddy vhost map when disabled
  ansible.builtin.set_fact:
    caddy_vhost_urls: {}
    caddy_vhost_urls_external: {}
  when: not (caddy_vhost_enabled | default(false) | bool)

- name: Initialize ECS data service portal links
  ansible.builtin.set_fact:
    deployment_portal_ecs_ds_links: []

- name: Add ECS data service URLs to portal when configured
  ansible.builtin.set_fact:
    deployment_portal_ecs_ds_links: "{{ deployment_portal_ecs_ds_links + [item.link] }}"
  loop:
    - key: cdw
    - key: cde
    - key: cai
  vars:
    _cat: "{{ ecs_data_services_catalog[item.key] | default({}) }}"
    _url: "{{ _cat.url | default('') }}"
    link:
      name: "{{ _cat.name | default(item.key | upper) }}"
      url: "{{ _url }}"
      description: "{{ _cat.description | default('ECS data service') }}"
  when: _url | length > 0

- name: Resolve Caddy pgAdmin public URL facts
  ansible.builtin.import_tasks: resolve_caddy_service_public_urls.yml

- name: Render deployment portal service endpoints list
  ansible.builtin.set_fact:
    deployment_portal_endpoints: >-
      {{
        lookup('template', 'deployment_portal_endpoints.j2') | from_yaml | default([], true)
      }}

- name: Build deployment portal operator access (credentials and SSH download metadata)
  ansible.builtin.import_tasks: build_deployment_portal_operator_access.yml

- name: Prefer Caddy vhost URLs for monitoring in external access map
  ansible.builtin.set_fact:
    deployment_portal_access_urls: >-
      {{
        deployment_portal_access_urls | combine(
          {
            'external': (
              deployment_portal_access_urls.external | default({})
              | combine(
                  {
                    'grafana': caddy_vhost_urls_external.grafana.url | default(''),
                    'prometheus': caddy_vhost_urls_external.prometheus.url | default(''),
                    'alertmanager': caddy_vhost_urls_external.alertmanager.url | default(''),
                  },
                  recursive=True
                )
            )
          },
          recursive=True
        )
      }}
  when:
    - caddy_vhost_enabled | default(false) | bool
    - (monitoring_stack_enabled | default(false) | bool) or (deployment_portal_monitoring_deployed | default(false) | bool)
    - deployment_portal_access_profile_effective == 'cloud'
    - caddy_vhost_urls_external.grafana.url | default('') | length > 0

- name: Prefer Caddy vhost URLs for monitoring in VPC access map
  ansible.builtin.set_fact:
    deployment_portal_access_urls: >-
      {{
        deployment_portal_access_urls | combine(
          {
            'vpc': (
              deployment_portal_access_urls.vpc | default({})
              | combine(
                  {
                    'grafana': caddy_vhost_urls_vpc.grafana.url | default(''),
                    'prometheus': caddy_vhost_urls_vpc.prometheus.url | default(''),
                    'alertmanager': caddy_vhost_urls_vpc.alertmanager.url | default(''),
                  },
                  recursive=True
                )
            )
          },
          recursive=True
        )
      }}
  when:
    - caddy_vhost_enabled | default(false) | bool
    - (monitoring_stack_enabled | default(false) | bool) or (deployment_portal_monitoring_deployed | default(false) | bool)
    - deployment_portal_access_profile_effective == 'cloud'
    - caddy_vhost_urls_vpc.grafana.url | default('') | length > 0

- name: Assemble deployment portal context
  ansible.builtin.set_fact:
    deployment_portal_context:
      generated_at: "{{ ansible_date_time.iso8601 | default(lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ')) }}"
      cluster_domain: "{{ cluster_domain }}"
      cluster_realm: "{{ cluster_realm }}"
      identity_provider: "{{ identity_provider_effective }}"
      versions:
        cm: "{{ cm_version }}"
        cdh: "{{ cdh_version }}"
        ecs_cds: "{{ ecs_pvc_ds_version }}"
      anchor:
        fqdn: "{{ deployment_portal_anchor_fqdn }}"
        public_ip: "{{ deployment_portal_ops_public_ip }}"
        private_ip: "{{ deployment_portal_ops_private_ip }}"
      access:
        profile: "{{ deployment_portal_access_urls.profile }}"
        environment: "{{ deployment_portal_access_urls.environment }}"
        primary: "{{ deployment_portal_access_urls.primary | default({}) }}"
        external: "{{ deployment_portal_access_urls.external | default({}) }}"
        vpc: "{{ deployment_portal_access_urls.vpc | default({}) }}"
      caddy_vhosts:
        enabled: "{{ caddy_vhost_enabled | default(false) | bool }}"
        dns_mode: "{{ caddy_vhost_dns_mode }}"
        public_base: "{{ caddy_vhost_public_base }}"
        urls_public: "{{ caddy_vhost_urls_external | default({}) }}"
        urls_vpc: "{{ caddy_vhost_urls_vpc | default({}) }}"
      portal:
        index_url: >-
          {{
            deployment_portal_access_urls.primary.portal
            if (deployment_portal_access_profile_effective == 'private')
            else deployment_portal_access_urls.external.portal
          }}
        pgadmin_url_direct: >-
          {{
            deployment_portal_access_urls.primary.pgadmin
            if (deployment_portal_access_profile_effective == 'private')
            else deployment_portal_access_urls.external.pgadmin
          }}
        pgadmin_caddy_url: "{{ pgadmin_caddy_public_url | default('') }}"
        pgadmin_url: >-
          {{
            pgadmin_caddy_public_url
            if (pgadmin_caddy_public_url | default('') | length > 0)
            else (
              deployment_portal_access_urls.primary.pgadmin
              if (deployment_portal_access_profile_effective == 'private')
              else deployment_portal_access_urls.external.pgadmin
            )
          }}
        index_url_vpc: "{{ deployment_portal_access_urls.vpc.portal | default('') }}"
        pgadmin_url_vpc: "{{ deployment_portal_access_urls.vpc.pgadmin | default('') }}"
      identity:
        ipa_ui_url: "{{ ('https://' + deployment_portal_ipa_fqdn) if deployment_portal_has_ipa | bool else '' }}"
        ipa_caddy_url: >-
          {{
            caddy_vhost_urls_external.ipa.url | default('')
            if (
              caddy_vhost_enabled | default(false) | bool
              and deployment_portal_has_ipa | bool
            )
            else ''
          }}
        ipa_caddy_modern_url: >-
          {{
            (
              caddy_vhost_urls_external.ipa.url | default('') | trim | regex_replace('/+$', '')
              + '/ipa/modern-ui/'
            )
            if (
              caddy_vhost_enabled | default(false) | bool
              and deployment_portal_has_ipa | bool
            )
            else ''
          }}
        ipa_caddy_legacy_url: >-
          {{
            (
              caddy_vhost_urls_external.ipa.url | default('') | trim | regex_replace('/+$', '')
              + '/ipa/ui'
            )
            if (
              caddy_vhost_enabled | default(false) | bool
              and deployment_portal_has_ipa | bool
            )
            else ''
          }}
        ipa_ui_label: "FreeIPA / IdM"
        ipa_ui_modern_label: "FreeIPA (modern UI)"
        ipa_ui_legacy_label: "FreeIPA (legacy UI)"
      cloudera_manager:
        host_fqdn: "{{ deployment_portal_cm_fqdn }}"
        cm_installed: false
        caddy_public_url: ""
        frontend_url: "{{ cm_frontend_url_effective | default('') }}"
        ui_url_http: "http://{{ deployment_portal_cm_fqdn }}:{{ cm_http_port }}"
        ui_url_https: "https://{{ deployment_portal_cm_fqdn }}:{{ cm_https_port }}"
        caddy_url: ""
        caddy_url_vpc: ""
        ui_url_public: "http://{{ deployment_portal_cm_fqdn }}:{{ cm_http_port }}"
        ui_url_vpc: "http://{{ deployment_portal_cm_fqdn }}:{{ cm_http_port }}"
        cluster_name: "{{ cdh_basecluster_name }}"
      postgresql:
        host_fqdn: "{{ deployment_portal_postgres_fqdn }}"
        port: "{{ postgres_port }}"
        database_host_note: >-
          PostgreSQL for CM on {{ deployment_portal_postgres_fqdn }}:{{ postgres_port }}
          (ops UI host: {{ deployment_portal_anchor_fqdn }})
      ops_host:
        fqdn: "{{ deployment_portal_anchor_fqdn }}"
        inventory_group: "{{ deployment_portal_anchor_group }}"
        services: "Caddy index, pgAdmin, Prometheus, Grafana, Alertmanager, cAdvisor"
      ecs:
        deployed: "{{ deployment_portal_ecs_present | bool }}"
        cluster_name: "{{ ecs_cluster_name }}"
        app_domain: "{{ ecs_app_domain }}"
        console_hint: "https://console.{{ ecs_app_domain }}"
        console_url_direct: "https://console.{{ ecs_app_domain }}"
        caddy_url: ""
        apps_wildcard: "https://*.{{ ecs_app_domain }}"
      data_services:
        links: >-
          {{
            deployment_portal_data_service_links
            + (deployment_portal_dynamic_links | default([]))
            + (deployment_portal_ecs_ds_links | default([]))
          }}
      monitoring:
        enabled: >-
          {{
            (monitoring_stack_enabled | default(false) | bool)
            or (deployment_portal_monitoring_deployed | default(false) | bool)
            or (deployment_portal_monitoring_routes_enabled | default(false) | bool)
          }}
        routes_enabled: "{{ deployment_portal_monitoring_routes_enabled | default(false) | bool }}"
        grafana_path_url: >-
          {{
            ('http://' + deployment_portal_ops_public_ip + ':' + (deployment_portal_http_port | string) + '/grafana/')
            if (deployment_portal_access_profile_effective == 'cloud')
            else ('http://' + deployment_portal_ops_client_host + ':' + (deployment_portal_http_port | string) + '/grafana/')
          }}
        prometheus_path_url: >-
          {{
            ('http://' + deployment_portal_ops_public_ip + ':' + (deployment_portal_http_port | string) + '/prometheus/')
            if (deployment_portal_access_profile_effective == 'cloud')
            else ('http://' + deployment_portal_ops_client_host + ':' + (deployment_portal_http_port | string) + '/prometheus/')
          }}
        alertmanager_path_url: >-
          {{
            ('http://' + deployment_portal_ops_public_ip + ':' + (deployment_portal_http_port | string) + '/alertmanager/')
            if (deployment_portal_access_profile_effective == 'cloud')
            else ('http://' + deployment_portal_ops_client_host + ':' + (deployment_portal_http_port | string) + '/alertmanager/')
          }}
        grafana_caddy_url: "{{ caddy_vhost_urls_external.grafana.url | default('') if (caddy_vhost_enabled | default(false) | bool) else '' }}"
        prometheus_caddy_url: "{{ caddy_vhost_urls_external.prometheus.url | default('') if (caddy_vhost_enabled | default(false) | bool) else '' }}"
        alertmanager_caddy_url: "{{ caddy_vhost_urls_external.alertmanager.url | default('') if (caddy_vhost_enabled | default(false) | bool) else '' }}"
        grafana_url_direct: >-
          {{
            deployment_portal_access_urls.primary.grafana
            if (deployment_portal_access_profile_effective == 'private')
            else deployment_portal_access_urls.external.grafana
          }}
        prometheus_url_direct: >-
          {{
            deployment_portal_access_urls.primary.prometheus
            if (deployment_portal_access_profile_effective == 'private')
            else deployment_portal_access_urls.external.prometheus
          }}
        alertmanager_url_direct: >-
          {{
            deployment_portal_access_urls.primary.alertmanager
            if (deployment_portal_access_profile_effective == 'private')
            else deployment_portal_access_urls.external.alertmanager
          }}
        grafana_url: >-
          {{
            (
              caddy_vhost_urls_external.grafana.url | default('')
              if (
                caddy_vhost_enabled | default(false) | bool
                and (caddy_vhost_urls_external.grafana.url | default('') | length > 0)
              )
              else ''
            )
            or (
              deployment_portal_access_urls.primary.grafana
              if (deployment_portal_access_profile_effective == 'private')
              else deployment_portal_access_urls.external.grafana
            )
          }}
        grafana_url_tier_b: "{{ deployment_portal_access_urls.external.grafana | default('') if (deployment_portal_access_profile_effective == 'cloud') else deployment_portal_access_urls.primary.grafana | default('') }}"
        prometheus_url: >-
          {{
            (
              caddy_vhost_urls_external.prometheus.url | default('')
              if (
                caddy_vhost_enabled | default(false) | bool
                and (caddy_vhost_urls_external.prometheus.url | default('') | length > 0)
              )
              else ''
            )
            or (
              deployment_portal_access_urls.primary.prometheus
              if (deployment_portal_access_profile_effective == 'private')
              else deployment_portal_access_urls.external.prometheus
            )
          }}
        prometheus_url_tier_b: "{{ deployment_portal_access_urls.external.prometheus | default('') if (deployment_portal_access_profile_effective == 'cloud') else deployment_portal_access_urls.primary.prometheus | default('') }}"
        alertmanager_url: >-
          {{
            (
              caddy_vhost_urls_external.alertmanager.url | default('')
              if (
                caddy_vhost_enabled | default(false) | bool
                and (caddy_vhost_urls_external.alertmanager.url | default('') | length > 0)
              )
              else ''
            )
            or (
              deployment_portal_access_urls.primary.alertmanager
              if (deployment_portal_access_profile_effective == 'private')
              else deployment_portal_access_urls.external.alertmanager
            )
          }}
        alertmanager_url_tier_b: "{{ deployment_portal_access_urls.external.alertmanager | default('') if (deployment_portal_access_profile_effective == 'cloud') else deployment_portal_access_urls.primary.alertmanager | default('') }}"
        cadvisor_url: >-
          {{
            deployment_portal_access_urls.primary.cadvisor
            if (deployment_portal_access_profile_effective == 'private')
            else deployment_portal_access_urls.external.cadvisor
          }}
        grafana_url_vpc: "{{ deployment_portal_access_urls.vpc.grafana | default('') }}"

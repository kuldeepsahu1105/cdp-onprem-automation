---
- name: Validate CM manager inventory group
  ansible.builtin.import_tasks: validate_inventory_groups.yml
  vars:
    required_inventory_group: cldr-mngr

- name: Resolve reachable CM API host (127.0.0.1 on cldr-mngr, else private/public IP)
  ansible.builtin.import_tasks: resolve_cm_connect_host.yml

- name: Pick reachable CM API probe address on delegated cldr-mngr
  ansible.builtin.import_tasks: select_cm_api_probe_host.yml

- name: Ensure CM admin password matches group_vars when not factory default
  ansible.builtin.import_tasks: ensure_cm_admin_password.yml

- name: Probe Cloudera Manager HTTPS API first (public Jenkins controller)
  ansible.builtin.uri:
    url: "https://{{ cm_api_probe_host }}:{{ cm_https_port }}/api/version"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    return_content: no
    validate_certs: no
    status_code: [200, 301, 303]
  register: cm_tls_probe_https
  until: cm_tls_probe_https is succeeded
  retries: 2
  delay: 3
  timeout: 15
  ignore_errors: yes
  when:
    - cm_api_probe_https_first | default(false) | bool
    - not (cm_api_probe_use_caddy_vhost | default(false) | bool)
    - cm_api_probe_delegate_to | default('') | length > 0
  delegate_to: "{{ cm_api_probe_delegate_to }}"

- name: Probe Cloudera Manager HTTPS API first on play host (public controller)
  ansible.builtin.uri:
    url: "https://{{ cm_api_probe_host }}:{{ cm_https_port }}/api/version"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    return_content: no
    validate_certs: no
    status_code: [200, 301, 303]
  register: cm_tls_probe_https
  until: cm_tls_probe_https is succeeded
  retries: 2
  delay: 3
  timeout: 15
  ignore_errors: yes
  when:
    - cm_api_probe_https_first | default(false) | bool
    - not (cm_api_probe_use_caddy_vhost | default(false) | bool)
    - cm_api_probe_delegate_to | default('') | length == 0

- name: Probe Cloudera Manager HTTP API via Caddy vhost (public controller)
  ansible.builtin.uri:
    url: "http://{{ cm_api_probe_host }}:{{ deployment_portal_http_port }}/api/version"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    follow_redirects: none
    return_content: no
    validate_certs: no
    status_code: [200, 301, 303]
  register: cm_tls_probe_http
  until: cm_tls_probe_http is succeeded
  retries: 2
  delay: 3
  timeout: 15
  ignore_errors: yes
  when:
    - cm_api_probe_use_caddy_vhost | default(false) | bool
    - cm_api_probe_delegate_to | default('') | length == 0

- name: Probe Cloudera Manager HTTP API (Auto-TLS redirect detection)
  ansible.builtin.uri:
    url: "http://{{ cm_api_probe_host }}:{{ cm_http_port }}/api/version"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    follow_redirects: none
    return_content: no
    validate_certs: no
    status_code: [200, 301, 303]
  register: cm_tls_probe_http
  until: cm_tls_probe_http is succeeded
  retries: 2
  delay: 3
  timeout: 15
  ignore_errors: yes
  delegate_to: "{{ cm_api_probe_delegate_to }}"
  when:
    - cm_api_probe_delegate_to | default('') | length > 0
    - not (cm_api_probe_use_caddy_vhost | default(false) | bool)
    - not (
        (cm_api_probe_https_first | default(false) | bool)
        and (cm_tls_probe_https is defined)
        and (cm_tls_probe_https is succeeded)
        and (cm_tls_probe_https.status | default(0) in [200, 301, 303])
      )

- name: Probe Cloudera Manager HTTP API on play host when not delegating
  ansible.builtin.uri:
    url: "http://{{ cm_api_probe_host }}:{{ cm_http_port }}/api/version"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    follow_redirects: none
    return_content: no
    validate_certs: no
    status_code: [200, 301, 303]
  register: cm_tls_probe_http
  until: cm_tls_probe_http is succeeded
  retries: 2
  delay: 3
  timeout: 15
  ignore_errors: yes
  when:
    - cm_api_probe_delegate_to | default('') | length == 0
    - not (cm_api_probe_use_caddy_vhost | default(false) | bool)
    - not (
        (cm_api_probe_https_first | default(false) | bool)
        and (cm_tls_probe_https is defined)
        and (cm_tls_probe_https is succeeded)
        and (cm_tls_probe_https.status | default(0) in [200, 301, 303])
      )

- name: Probe Cloudera Manager HTTPS API (fallback when HTTP is unavailable)
  ansible.builtin.uri:
    url: "https://{{ cm_api_probe_host }}:{{ cm_https_port }}/api/version"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    return_content: no
    validate_certs: no
    status_code: [200, 301, 303]
  register: cm_tls_probe_https
  until: cm_tls_probe_https is succeeded
  retries: 2
  delay: 3
  timeout: 15
  ignore_errors: yes
  when:
    - not (cm_api_probe_https_first | default(false) | bool)
    - not (cm_api_probe_use_caddy_vhost | default(false) | bool)
    - cm_tls_probe_http is failed or (cm_tls_probe_http.status | default(0) not in [200, 301, 303])
    - cm_api_probe_delegate_to | default('') | length > 0
  delegate_to: "{{ cm_api_probe_delegate_to }}"

- name: Probe Cloudera Manager HTTPS API on play host when not delegating
  ansible.builtin.uri:
    url: "https://{{ cm_api_probe_host }}:{{ cm_https_port }}/api/version"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    return_content: no
    validate_certs: no
    status_code: [200, 301, 303]
  register: cm_tls_probe_https
  until: cm_tls_probe_https is succeeded
  retries: 2
  delay: 3
  timeout: 15
  ignore_errors: yes
  when:
    - not (cm_api_probe_https_first | default(false) | bool)
    - not (cm_api_probe_use_caddy_vhost | default(false) | bool)
    - cm_tls_probe_http is failed or (cm_tls_probe_http.status | default(0) not in [200, 301, 303])
    - cm_api_probe_delegate_to | default('') | length == 0

- name: Set CM protocol and port based on probe results
  ansible.builtin.set_fact:
    autotls_enabled: >-
      {{
        (cm_tls_probe_http.status | default(0) in [301, 303])
        or (cm_tls_probe_https is defined and cm_tls_probe_https is succeeded and cm_tls_probe_https.status | default(0) == 200)
      }}
    cm_protocol: >-
      {{
        'http'
        if (cm_api_probe_use_caddy_vhost | default(false) | bool)
        else (
          'https' if (
            (cm_tls_probe_http.status | default(0) in [301, 303])
            or (cm_tls_probe_https is defined and cm_tls_probe_https is succeeded and cm_tls_probe_https.status | default(0) == 200)
          ) else 'http'
        )
      }}
    cm_api_port: >-
      {{
        deployment_portal_http_port
        if (cm_api_probe_use_caddy_vhost | default(false) | bool)
        else (
          cm_https_port if (
            (cm_tls_probe_http.status | default(0) in [301, 303])
            or (cm_tls_probe_https is defined and cm_tls_probe_https is succeeded and cm_tls_probe_https.status | default(0) == 200)
          ) else cm_http_port
        )
      }}

- name: Fail CM API probes with connect target when HTTP and HTTPS checks did not succeed
  ansible.builtin.fail:
    msg: >-
      Cloudera Manager API unreachable at http://{{ cm_api_probe_host }}:{{ cm_http_port }} or
      https://{{ cm_api_probe_host }}:{{ cm_https_port }} (probe on
      {{ cm_api_probe_delegate_to if (cm_api_probe_delegate_to | default('') | length > 0) else inventory_hostname | default('localhost') }}).
      Client host for this play: {{ cm_api_client_host }}.
      Delegated probes tried: {{ cm_api_probe_host_candidates | default([cm_api_probe_host]) | join(', ') }}.
      Jenkins/outside-VPC controllers use the CM public IP for uri from localhost; discovery runs on cldr-mngr (127.0.0.1, ansible_host, FQDN; HTTPS {{ cm_https_port }} OK without {{ cm_http_port }}).
      Set ansible_control_reachability: public (or legacy ansible_controller_outside_vpc: true / cm_api_prefer_private_ip: false).
  when:
    - not (
        (cm_api_probe_use_caddy_vhost | default(false) | bool)
        and (cm_tls_probe_http is defined)
        and (cm_tls_probe_http is succeeded)
        and (cm_tls_probe_http.status | default(0) in [200, 301, 303])
      )
    - not (
        (cm_api_probe_https_first | default(false) | bool)
        and (cm_tls_probe_https is defined)
        and (cm_tls_probe_https is succeeded)
        and (cm_tls_probe_https.status | default(0) in [200, 301, 303])
      )
    - cm_tls_probe_http is not defined or cm_tls_probe_http is failed or (cm_tls_probe_http.status | default(0) not in [200, 301, 303])
    - cm_tls_probe_https is not defined or cm_tls_probe_https is failed or (cm_tls_probe_https.status | default(0) not in [200, 301, 303])

- name: Get Cloudera Manager API version
  ansible.builtin.uri:
    url: "{{ cm_protocol }}://{{ cm_api_probe_host }}:{{ cm_api_port }}/api/version"
    method: GET
    status_code: [200, 301, 303]
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    return_content: yes
    validate_certs: no
  register: cm_api_version_result
  until: cm_api_version_result is succeeded
  retries: 10
  delay: 6
  timeout: 30
  delegate_to: "{{ cm_api_probe_delegate_to }}"
  when: cm_api_probe_delegate_to | default('') | length > 0

- name: Get Cloudera Manager API version on play host when not delegating
  ansible.builtin.uri:
    url: "{{ cm_protocol }}://{{ cm_api_probe_host }}:{{ cm_api_port }}/api/version"
    method: GET
    status_code: [200, 301, 303]
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    return_content: yes
    validate_certs: no
  register: cm_api_version_result
  until: cm_api_version_result is succeeded
  retries: 10
  delay: 6
  timeout: 30
  when: cm_api_probe_delegate_to | default('') | length == 0

- name: Use discovered probe host for Jenkins/localhost CM API client URL
  ansible.builtin.set_fact:
    cm_api_client_host: "{{ cm_api_probe_host }}"
  when:
    - cm_api_controller_is_localhost | default(false) | bool
    - cm_api_probe_delegate_to | default('') | length > 0
    - cm_api_probe_host | default('') | length > 0
    - cm_tls_probe_https is defined
    - cm_tls_probe_https is succeeded
    - cm_tls_probe_https.status | default(0) in [200, 301, 303]

- name: Set base Cloudera Manager API URL
  ansible.builtin.set_fact:
    cm_api_version: "{{ cm_api_version_result.content | trim }}"
    cm_api_url: "{{ cm_protocol }}://{{ cm_api_client_host }}:{{ cm_api_port }}/api/{{ cm_api_version_result.content | trim }}"
    cm_api_url_delegated: "{{ cm_protocol }}://{{ cm_api_probe_host }}:{{ cm_api_port }}/api/{{ cm_api_version_result.content | trim }}"
    cm_host: "{{ cm_api_client_host }}"

- name: Print Cloudera Manager API URL
  ansible.builtin.debug:
    msg:
      - "cm_api_url: {{ cm_api_url }}"
      - "Auto-TLS enabled: {{ autotls_enabled | default(false) }}"

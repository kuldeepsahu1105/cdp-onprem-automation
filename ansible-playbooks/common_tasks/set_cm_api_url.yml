---
- name: Validate CM manager inventory group
  ansible.builtin.import_tasks: validate_inventory_groups.yml
  vars:
    required_inventory_group: cldr-mngr

- name: Set Cloudera Manager host
  ansible.builtin.import_tasks: resolve_cm_connect_host.yml

- name: Find working CM API bind address on cldr-mngr
  ansible.builtin.import_tasks: select_cm_api_probe_host.yml
  when: not (cm_api_probe_from_controller_public | default(false) | bool)

- name: Use Cloudera Manager public address for API checks from controller
  ansible.builtin.set_fact:
    cm_host: "{{ cm_api_client_host }}"
    cm_api_probe_host: "{{ cm_api_client_host }}"
  when: cm_api_probe_from_controller_public | default(false) | bool

- name: Ensure CM admin password matches group_vars when not factory default
  ansible.builtin.import_tasks: ensure_cm_admin_password.yml

- name: Probe Cloudera Manager HTTPS API on cldr-mngr
  ansible.builtin.uri:
    url: "https://{{ cm_api_probe_host }}:{{ cm_https_port }}/api/version"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    return_content: no
    validate_certs: no
    status_code: [200, 301, 303, 401, 403]
  register: cm_tls_probe_https
  until: cm_tls_probe_https is succeeded
  retries: 2
  delay: 3
  timeout: 15
  ignore_errors: yes
  when:
    - cm_api_probe_https_first | default(false) | bool
    - not (cm_api_probe_use_caddy_vhost | default(false) | bool)
    - cm_api_probe_delegate_to | default('') | length > 0
    - not (cm_api_discovery_succeeded | default(false) | bool)
  delegate_to: "{{ cm_api_probe_delegate_to }}"

- name: Probe Cloudera Manager HTTPS API (Auto-TLS redirect detection)
  ansible.builtin.uri:
    url: "https://{{ cm_api_client_host }}:{{ cm_https_port }}/api/version"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    return_content: no
    validate_certs: no
    status_code: [200, 301, 303, 401, 403]
  register: cm_tls_probe_https
  until: cm_tls_probe_https is succeeded
  retries: 2
  delay: 3
  timeout: 15
  ignore_errors: yes
  when:
    - cm_api_probe_https_first | default(false) | bool
    - not (cm_api_probe_use_caddy_vhost | default(false) | bool)
    - cm_api_probe_delegate_to | default('') | length == 0
    - not (cm_api_probe_on_manager_local | default(false) | bool)
    - not (cm_api_discovery_succeeded | default(false) | bool)

- name: Probe Cloudera Manager HTTP API on cldr-mngr
  ansible.builtin.uri:
    url: "http://{{ cm_api_probe_host }}:{{ cm_http_port }}/api/version"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    follow_redirects: none
    return_content: no
    validate_certs: no
    status_code: [200, 301, 303, 401, 403]
  register: cm_tls_probe_http
  until: cm_tls_probe_http is succeeded
  retries: 2
  delay: 3
  timeout: 15
  ignore_errors: yes
  delegate_to: "{{ cm_api_probe_delegate_to }}"
  when:
    - cm_api_probe_delegate_to | default('') | length > 0
    - not (cm_api_probe_use_caddy_vhost | default(false) | bool)
    - not (
        (cm_api_probe_https_first | default(false) | bool)
        and (cm_tls_probe_https is defined)
        and (cm_tls_probe_https is succeeded)
        and (cm_tls_probe_https.status | default(0) in [200, 301, 303, 401, 403])
      )
    - not (cm_api_discovery_succeeded | default(false) | bool)

- name: Probe Cloudera Manager HTTP API (Auto-TLS redirect detection)
  ansible.builtin.uri:
    url: "http://{{ cm_api_client_host }}:{{ cm_http_port }}/api/version"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    follow_redirects: none
    return_content: no
    validate_certs: no
    status_code: [200, 301, 303, 401, 403]
  register: cm_tls_probe_http
  until: cm_tls_probe_http is succeeded
  retries: 2
  delay: 3
  timeout: 15
  ignore_errors: yes
  when:
    - cm_api_probe_delegate_to | default('') | length == 0
    - not (cm_api_probe_use_caddy_vhost | default(false) | bool)
    - not (
        (cm_api_probe_https_first | default(false) | bool)
        and (cm_tls_probe_https is defined)
        and (cm_tls_probe_https is succeeded)
        and (cm_tls_probe_https.status | default(0) in [200, 301, 303, 401, 403])
      )
    - not (cm_api_discovery_succeeded | default(false) | bool)

- name: Probe Cloudera Manager HTTPS API on cldr-mngr (fallback when HTTP is unavailable)
  ansible.builtin.uri:
    url: "https://{{ cm_api_probe_host }}:{{ cm_https_port }}/api/version"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    return_content: no
    validate_certs: no
    status_code: [200, 301, 303, 401, 403]
  register: cm_tls_probe_https
  until: cm_tls_probe_https is succeeded
  retries: 2
  delay: 3
  timeout: 15
  ignore_errors: yes
  when:
    - not (cm_api_probe_https_first | default(false) | bool)
    - not (cm_api_probe_use_caddy_vhost | default(false) | bool)
    - cm_tls_probe_http is failed or (cm_tls_probe_http.status | default(0) not in [200, 301, 303, 401, 403])
    - cm_api_probe_delegate_to | default('') | length > 0
    - not (cm_api_discovery_succeeded | default(false) | bool)
  delegate_to: "{{ cm_api_probe_delegate_to }}"

- name: Probe Cloudera Manager HTTPS API (fallback when HTTP is unavailable)
  ansible.builtin.uri:
    url: "https://{{ cm_api_client_host }}:{{ cm_https_port }}/api/version"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    return_content: no
    validate_certs: no
    status_code: [200, 301, 303, 401, 403]
  register: cm_tls_probe_https
  until: cm_tls_probe_https is succeeded
  retries: 2
  delay: 3
  timeout: 15
  ignore_errors: yes
  when:
    - not (cm_api_probe_https_first | default(false) | bool)
    - not (cm_api_probe_use_caddy_vhost | default(false) | bool)
    - cm_tls_probe_http is failed or (cm_tls_probe_http.status | default(0) not in [200, 301, 303, 401, 403])
    - cm_api_probe_delegate_to | default('') | length == 0
    - not (cm_api_probe_on_manager_local | default(false) | bool)
    - not (cm_api_discovery_succeeded | default(false) | bool)

- name: Set CM protocol and port based on probe results (cldr-mngr bind scan)
  ansible.builtin.set_fact:
    autotls_enabled: >-
      {{
        (
          cm_api_probe_https_discovery.results | default([])
          | selectattr('status', 'defined')
          | selectattr('status', 'in', [200, 301, 303, 401, 403])
          | list
          | length > 0
        )
        or (
          cm_api_probe_host_discovery.results | default([])
          | selectattr('status', 'defined')
          | selectattr('status', 'in', [301, 303])
          | list
          | length > 0
        )
      }}
    cm_protocol: >-
      {{
        'https'
        if (
          (
            cm_api_probe_https_discovery.results | default([])
            | selectattr('status', 'defined')
            | selectattr('status', 'in', [200, 301, 303, 401, 403])
            | list
            | length > 0
          )
          or (
            cm_api_probe_host_discovery.results | default([])
            | selectattr('status', 'defined')
            | selectattr('status', 'in', [301, 303])
            | list
            | length > 0
          )
        )
        else 'http'
      }}
    cm_api_port: >-
      {{
        cm_https_port
        if (
          (
            cm_api_probe_https_discovery.results | default([])
            | selectattr('status', 'defined')
            | selectattr('status', 'in', [200, 301, 303, 401, 403])
            | list
            | length > 0
          )
          or (
            cm_api_probe_host_discovery.results | default([])
            | selectattr('status', 'defined')
            | selectattr('status', 'in', [301, 303])
            | list
            | length > 0
          )
        )
        else cm_http_port
      }}
  when:
    - cm_api_discovery_succeeded | default(false) | bool
    - not (cm_api_probe_use_caddy_vhost | default(false) | bool)

- name: Set CM protocol and port based on probe results
  ansible.builtin.set_fact:
    autotls_enabled: >-
      {{
        (cm_tls_probe_http.status | default(0) in [301, 303])
        or (
          cm_tls_probe_https is defined
          and cm_tls_probe_https is succeeded
          and cm_tls_probe_https.status | default(0) in [200, 401, 403]
        )
      }}
    cm_protocol: >-
      {{
        'http'
        if (cm_api_probe_use_caddy_vhost | default(false) | bool)
        else (
          'https' if (
            (cm_tls_probe_http.status | default(0) in [301, 303])
            or (
              cm_tls_probe_https is defined
              and cm_tls_probe_https is succeeded
              and cm_tls_probe_https.status | default(0) in [200, 401, 403]
            )
          ) else 'http'
        )
      }}
    cm_api_port: >-
      {{
        deployment_portal_http_port
        if (cm_api_probe_use_caddy_vhost | default(false) | bool)
        else (
          cm_https_port if (
            (cm_tls_probe_http.status | default(0) in [301, 303])
            or (
              cm_tls_probe_https is defined
              and cm_tls_probe_https is succeeded
              and cm_tls_probe_https.status | default(0) in [200, 401, 403]
            )
          ) else cm_http_port
        )
      }}
  when: not (cm_api_discovery_succeeded | default(false) | bool)

- name: Fail when CM API HTTP and HTTPS checks did not succeed
  ansible.builtin.fail:
    msg: >-
      Cloudera Manager API unreachable at http://{{ cm_api_client_host }}:{{ cm_http_port }}
      or https://{{ cm_api_client_host }}:{{ cm_https_port }} from
      {{ inventory_hostname | default('localhost') }}.
      {% if cm_api_probe_from_controller_public | default(false) | bool %}
      Jenkins/public controller must reach the manager public IP (cm_api_connect_host / ansible_host), not 127.0.0.1 or VPC private addresses.
      If the CM UI works in a browser but this fails, security groups likely block :7180/:7183 from the Jenkins agent to {{ cm_api_client_host }}.
      {% else %}
      Checked on {{ cm_api_probe_delegate_to if (cm_api_probe_delegate_to | default('') | length > 0) else inventory_hostname | default('localhost') }}
      at bind addresses: {{ cm_api_probe_host_candidates | default([cm_api_probe_host]) | join(', ') }}.
      {% endif %}
  when:
    - (cm_api_verify_mode | default('fail') | lower) != 'warn'
    - not (cm_api_discovery_succeeded | default(false) | bool)
    - not (
        (cm_api_probe_https_first | default(false) | bool)
        and (cm_tls_probe_https is defined)
        and (cm_tls_probe_https is succeeded)
        and (cm_tls_probe_https.status | default(0) in [200, 301, 303, 401, 403])
      )
    - cm_tls_probe_http is not defined or cm_tls_probe_http is failed or (cm_tls_probe_http.status | default(0) not in [200, 301, 303, 401, 403])
    - cm_tls_probe_https is not defined or cm_tls_probe_https is failed or (cm_tls_probe_https.status | default(0) not in [200, 301, 303, 401, 403])

- name: Get Cloudera Manager API version on cldr-mngr
  ansible.builtin.uri:
    url: "{{ cm_protocol }}://{{ cm_api_probe_host }}:{{ cm_api_port }}/api/version"
    method: GET
    status_code: [200, 301, 303]
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    return_content: yes
    validate_certs: no
  register: cm_api_version_on_probe_delegate
  until: cm_api_version_on_probe_delegate is succeeded
  retries: 10
  delay: 6
  timeout: 30
  delegate_to: "{{ cm_api_probe_delegate_to }}"
  when:
    - cm_api_probe_delegate_to | default('') | length > 0
    - cm_api_uri_delegate_to | default('') | length == 0

- name: Get Cloudera Manager API version on cldr-mngr (delegated uri)
  ansible.builtin.uri:
    url: "{{ cm_protocol }}://{{ cm_api_probe_host }}:{{ cm_api_port }}/api/version"
    method: GET
    status_code: [200, 301, 303]
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    return_content: yes
    validate_certs: no
  register: cm_api_version_on_uri_delegate
  until: cm_api_version_on_uri_delegate is succeeded
  retries: 10
  delay: 6
  timeout: 30
  delegate_to: "{{ cm_api_uri_delegate_to }}"
  when: cm_api_uri_delegate_to | default('') | length > 0

- name: Get Cloudera Manager API version
  ansible.builtin.uri:
    url: "{{ cm_protocol }}://{{ cm_api_client_host }}:{{ cm_api_port }}/api/version"
    method: GET
    status_code: [200, 301, 303]
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    return_content: yes
    validate_certs: no
  register: cm_api_version_on_play_host
  until: cm_api_version_on_play_host is succeeded
  retries: 10
  delay: 6
  timeout: 30
  when:
    - cm_api_probe_delegate_to | default('') | length == 0
    - cm_api_uri_delegate_to | default('') | length == 0

- name: Resolve Cloudera Manager API version string from /api/version results
  ansible.builtin.set_fact:
    _cm_api_version_content: >-
      {{
        (
          cm_api_version_on_play_host.content
          if (
            cm_api_version_on_play_host is defined
            and cm_api_version_on_play_host is succeeded
            and (cm_api_version_on_play_host.content is defined)
          )
          else (
            cm_api_version_on_uri_delegate.content
            if (
              cm_api_version_on_uri_delegate is defined
              and cm_api_version_on_uri_delegate is succeeded
              and (cm_api_version_on_uri_delegate.content is defined)
            )
            else (
              cm_api_version_on_probe_delegate.content
              if (
                cm_api_version_on_probe_delegate is defined
                and cm_api_version_on_probe_delegate is succeeded
                and (cm_api_version_on_probe_delegate.content is defined)
              )
              else ''
            )
          )
        ) | default('', true) | trim
      }}

- name: Fail when CM API /api/version did not return a version string
  ansible.builtin.fail:
    msg: >-
      Cloudera Manager /api/version did not return a version string after HTTP/HTTPS checks succeeded
      (check host={{ cm_api_probe_delegate_to if (cm_api_probe_delegate_to | default('') | length > 0) else inventory_hostname | default('localhost') }},
      uri on cldr-mngr={{ cm_api_uri_delegate_to | default('') }},
      address={{ cm_api_probe_host }}).
  when: _cm_api_version_content | default('') | length == 0

- name: Avoid loopback CM API URL on the Ansible controller when not delegating uri to cldr-mngr
  ansible.builtin.set_fact:
    _cm_api_url_host_prefer_public: >-
      {{
        cm_api_connect_host
        if (cm_api_connect_host | default('') | length > 0)
        else cm_host_public
      }}
  when:
    - cm_api_controller_is_localhost | default(false) | bool
    - not (cm_api_runner_is_manager | default(false) | bool)
    - cm_api_uri_delegate_to | default('') | length == 0
    - (
        (cm_api_client_host | default('') in ['127.0.0.1', 'localhost', ''])
        or (cm_api_probe_host | default('') in ['127.0.0.1', 'localhost'])
      )
    - (
        (cm_api_connect_host | default('') | length > 0)
        or (cm_host_public | default('') | length > 0)
      )

- name: Resolve CM API URL host for uri tasks on this play (loopback only when delegating uri to cldr-mngr)
  ansible.builtin.set_fact:
    _cm_api_url_host: >-
      {{
        cm_api_probe_host
        if (cm_api_uri_delegate_to | default('') | length > 0)
        else (
          _cm_api_url_host_prefer_public
          if (_cm_api_url_host_prefer_public is defined)
          else (
            cm_api_connect_host
            if (
              (cm_api_connect_host | default('') | length > 0)
              and (cm_api_controller_is_localhost | default(false) | bool)
              and not (cm_api_runner_is_manager | default(false) | bool)
            )
            else (
              cm_host_public
              if (
                (cm_api_controller_is_localhost | default(false) | bool)
                and not (cm_api_runner_is_manager | default(false) | bool)
                and (cm_api_client_host | default('') in ['127.0.0.1', 'localhost', ''])
                and (cm_host_public | default('') | length > 0)
              )
              else cm_api_client_host
            )
          )
        )
      }}

- name: Set base Cloudera Manager API URL
  ansible.builtin.set_fact:
    cm_api_version: "{{ _cm_api_version_content }}"
    cm_api_url: >-
      {{
        cm_protocol + '://' + _cm_api_url_host + ':' + (cm_api_port | string) + '/api/' + _cm_api_version_content
      }}
    cm_api_url_delegated: "{{ cm_protocol }}://{{ cm_api_probe_host }}:{{ cm_api_port }}/api/{{ _cm_api_version_content }}"
    cm_host: "{{ cm_api_client_host }}"
  when: _cm_api_version_content | default('') | length > 0

- name: Print Cloudera Manager API URL
  ansible.builtin.debug:
    msg:
      - "cm_api_url: {{ cm_api_url }}"
      - "Auto-TLS enabled: {{ autotls_enabled | default(false) }}"

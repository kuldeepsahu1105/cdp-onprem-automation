---
# Resolve Hue's parcel-managed Python interpreter for psycopg2 install (playbook 31).
# CDP 7.3.2+ Hue uses lib/hue/build/env; older layouts use build/venvs/pythonX.Y.
- name: Wait for Hue parcel Python interpreter (build/env layout)
  ansible.builtin.stat:
    path: "{{ base_cluster_hue_parcel_hue_root }}/build/env/bin/python"
  register: base_cluster_hue_env_python
  until: base_cluster_hue_env_python.stat.exists | default(false) | bool
  retries: "{{ base_cluster_hue_venv_wait_retries }}"
  delay: "{{ base_cluster_hue_venv_wait_delay }}"
  failed_when: false
  become: true
  connection: ssh

- name: Discover Hue parcel Python environment (legacy build/venvs layout)
  ansible.builtin.find:
    paths: "{{ base_cluster_hue_parcel_hue_root }}/build/venvs"
    patterns: "python{{ base_cluster_hue_python_version }}"
    file_type: directory
    recurse: false
    follow: true
  register: base_cluster_hue_python_environments
  become: true
  connection: ssh
  when: not (base_cluster_hue_env_python.stat.exists | default(false) | bool)

- name: Require Hue parcel Python environment
  ansible.builtin.assert:
    that:
      - >-
        (base_cluster_hue_env_python.stat.exists | default(false) | bool)
        or (base_cluster_hue_python_environments.matched | default(0) | int == 1)
    fail_msg: >-
      Hue is enabled but no parcel-managed Python environment was found under
      {{ base_cluster_hue_parcel_hue_root }} on {{ inventory_hostname }}.
      Expected {{ base_cluster_hue_parcel_hue_root }}/build/env/bin/python (Python 3.11+ Hue)
      or exactly one {{ base_cluster_hue_parcel_hue_root }}/build/venvs/python{{ base_cluster_hue_python_version }}
      directory. Confirm the CDH parcel is activated on this host and
      base_cluster_hue_python_version={{ base_cluster_hue_python_version }} matches the parcel.

- name: Resolve Hue parcel Python interpreter
  ansible.builtin.set_fact:
    base_cluster_hue_python_interpreter_effective: >-
      {{
        (base_cluster_hue_parcel_hue_root ~ '/build/env/bin/python')
        if (base_cluster_hue_env_python.stat.exists | default(false) | bool)
        else (base_cluster_hue_python_environments.files[0].path ~ '/bin/python')
      }}

- name: Check Hue parcel Python interpreter runtime
  ansible.builtin.command:
    argv:
      - "{{ base_cluster_hue_python_interpreter_effective }}"
      - --version
  register: base_cluster_hue_python_runtime_check
  changed_when: false
  failed_when: false

- name: Resolve missing Hue libpython runtime version
  ansible.builtin.set_fact:
    base_cluster_hue_missing_python_runtime_version: >-
      {{
        (
          (
            base_cluster_hue_python_runtime_check.stderr | default('')
            ~ '\n'
            ~ base_cluster_hue_python_runtime_check.stdout | default('')
          )
          | regex_findall('libpython([0-9]+[.][0-9]+)[.]so')
          | first
          | default('')
        )
      }}
  when: base_cluster_hue_python_runtime_check.rc | default(1) | int != 0

- name: Require diagnosable Hue parcel Python runtime failure
  ansible.builtin.assert:
    that:
      - base_cluster_hue_missing_python_runtime_version | default('') | length > 0
    fail_msg: >-
      Hue parcel Python {{ base_cluster_hue_python_interpreter_effective }} failed
      with rc={{ base_cluster_hue_python_runtime_check.rc | default('unknown') }},
      but its output did not identify a missing libpythonX.Y.so runtime.
      stdout={{ base_cluster_hue_python_runtime_check.stdout | default('') | trim }};
      stderr={{ base_cluster_hue_python_runtime_check.stderr | default('') | trim }}.
  when: base_cluster_hue_python_runtime_check.rc | default(1) | int != 0

- name: Gather Hue host distribution facts for missing libpython repair
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - distribution
  delegate_facts: true
  when: base_cluster_hue_missing_python_runtime_version | default('') | length > 0

- name: Require supported Hue libpython runtime package mapping
  ansible.builtin.assert:
    that:
      - >-
        hostvars[groups[base_cluster_master_group][0]].ansible_facts.os_family
        | default('') in ['RedHat', 'Debian']
    fail_msg: >-
      Hue parcel Python requires libpython{{ base_cluster_hue_missing_python_runtime_version }},
      but no runtime package mapping exists for
      {{ hostvars[groups[base_cluster_master_group][0]].ansible_facts.os_family | default('unknown OS family') }}.
  when: base_cluster_hue_missing_python_runtime_version | default('') | length > 0

- name: Install missing Hue libpython runtime
  ansible.builtin.package:
    name: >-
      {{
        'python' ~ base_cluster_hue_missing_python_runtime_version ~ '-libs'
        if (
          hostvars[groups[base_cluster_master_group][0]].ansible_facts.os_family
          | default('')
        ) == 'RedHat'
        else 'libpython' ~ base_cluster_hue_missing_python_runtime_version
      }}
    state: present
  when: base_cluster_hue_missing_python_runtime_version | default('') | length > 0

- name: Verify Hue parcel Python interpreter runtime
  ansible.builtin.command:
    argv:
      - "{{ base_cluster_hue_python_interpreter_effective }}"
      - -c
      - "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}')"
  register: base_cluster_hue_python_runtime_verify
  changed_when: false
  failed_when: base_cluster_hue_python_runtime_verify.rc | int != 0

- name: Record discovered Hue parcel Python runtime version
  ansible.builtin.set_fact:
    base_cluster_hue_python_runtime_version: >-
      {{ base_cluster_hue_python_runtime_verify.stdout | trim }}

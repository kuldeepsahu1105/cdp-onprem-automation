---
- name: Read HDFS authentication before the first secure start
  ansible.builtin.uri:
    url: >-
      {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
      }}/services/hdfs/config?view=full
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  register: base_cluster_pre_start_hdfs_auth_config
  changed_when: false
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Resolve HDFS authentication before the first secure start
  ansible.builtin.set_fact:
    base_cluster_pre_start_hdfs_authentication: >-
      {{
        (
          base_cluster_pre_start_hdfs_auth_config.json['items'] | default([])
          | selectattr('name', 'equalto', 'hadoop_security_authentication')
          | map(attribute='value')
          | first
        )
        | default(
            (
              base_cluster_pre_start_hdfs_auth_config.json['items'] | default([])
              | selectattr('name', 'equalto', 'hadoop_security_authentication')
              | map(attribute='default')
              | first
            ),
            true
          )
        | default('simple', true)
        | lower
      }}
    base_cluster_pre_start_has_running_services: >-
      {{
        existing_cluster_services.json['items'] | default([])
        | selectattr('serviceState', 'defined')
        | selectattr('serviceState', 'equalto', 'STARTED')
        | list
        | length > 0
      }}

- name: Decide whether the complete pre-start Kerberos workflow must run
  ansible.builtin.set_fact:
    base_cluster_pre_start_kerberos_workflow_required: >-
      {{
        base_cluster_pre_start_hdfs_authentication != 'kerberos'
      }}

- name: Resolve pre-start KDC credential marker
  ansible.builtin.set_fact:
    base_cluster_pre_start_kdc_admin_principal: >-
      {{
        krb5_kdc_admin_user
        if ('@' in (krb5_kdc_admin_user | string))
        else (krb5_kdc_admin_user ~ '@' ~ cluster_realm)
      }}
    base_cluster_pre_start_kdc_credentials_marker: >-
      {{
        cm_krb_credentials_marker_path
        ~ '-'
        ~ (
          (
            (
              krb5_kdc_admin_user
              if ('@' in (krb5_kdc_admin_user | string))
              else (krb5_kdc_admin_user ~ '@' ~ cluster_realm)
            )
            ~ '|' ~ cluster_realm ~ '|' ~ kdc_host
          )
          | hash('sha256')
        )
      }}

- name: Check pre-start KDC account-manager credentials
  ansible.builtin.stat:
    path: "{{ base_cluster_pre_start_kdc_credentials_marker }}"
  register: base_cluster_pre_start_kdc_credentials
  changed_when: false
  become: true
  delegate_to: "{{ cm_manager_inventory_host }}"

- name: Check KDC reachability before secure cluster start
  ansible.builtin.wait_for:
    host: "{{ kdc_host }}"
    port: 88
    state: started
    connect_timeout: 5
    timeout: "{{ cm_krb_kdc_preflight_timeout }}"
  changed_when: false
  delegate_to: "{{ cm_manager_inventory_host }}"

- name: Require KDC integration before secure cluster start
  ansible.builtin.assert:
    that:
      - base_cluster_pre_start_kdc_credentials.stat.exists | default(false) | bool
    fail_msg: >-
      Refusing to start cluster services without Kerberos. Run
      30_setup_cm_krbs.yml successfully first so CM has KDC account-manager
      credentials for {{ base_cluster_pre_start_kdc_admin_principal }}.

- name: Stop partially running cluster before Kerberos configuration
  ansible.builtin.uri:
    url: >-
      {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}/commands/stop
    method: POST
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  register: base_cluster_pre_start_stop_command
  delegate_to: "{{ cm_cluster_module_delegate_to }}"
  when:
    - base_cluster_pre_start_kerberos_workflow_required | bool
    - base_cluster_pre_start_has_running_services | bool

- name: Wait for partially running cluster to stop
  ansible.builtin.include_tasks: wait_cm_api_command.yml
  vars:
    cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
    cm_api_command_id: "{{ base_cluster_pre_start_stop_command.json.id }}"
    cm_api_command_allow_already_exists: false
  when:
    - base_cluster_pre_start_stop_command is defined
    - base_cluster_pre_start_stop_command.json.id is defined

- name: Configure cluster for Kerberos before service start
  ansible.builtin.uri:
    url: >-
      {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
      }}/commands/configureForKerberos
    method: POST
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    body_format: json
    body: {}
    status_code: [200]
    follow_redirects: none
  register: base_cluster_pre_start_kerberos_configure_command
  delegate_to: "{{ cm_cluster_module_delegate_to }}"
  when: base_cluster_pre_start_kerberos_workflow_required | bool

- name: Wait for pre-start Kerberos configuration
  ansible.builtin.include_tasks: wait_cm_api_command.yml
  vars:
    cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
    cm_api_command_id: "{{ base_cluster_pre_start_kerberos_configure_command.json.id }}"
    cm_api_command_allow_already_exists: false
  when:
    - base_cluster_pre_start_kerberos_workflow_required | bool
    - base_cluster_pre_start_kerberos_configure_command.json.id is defined

- name: Generate Kerberos credentials for the initial cluster transition
  ansible.builtin.uri:
    url: "{{ cm_cluster_module_api_url }}/cm/commands/generateCredentials"
    method: POST
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  register: base_cluster_pre_start_kerberos_credentials_command
  delegate_to: "{{ cm_cluster_module_delegate_to }}"
  when: base_cluster_pre_start_kerberos_workflow_required | bool

- name: Wait for pre-start Kerberos credentials
  ansible.builtin.include_tasks: wait_cm_api_command.yml
  vars:
    cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
    cm_api_command_id: "{{ base_cluster_pre_start_kerberos_credentials_command.json.id }}"
    cm_api_command_allow_already_exists: false
  when:
    - base_cluster_pre_start_kerberos_workflow_required | bool
    - base_cluster_pre_start_kerberos_credentials_command.json.id is defined

- name: Build pre-start Kerberos configuration checks
  ansible.builtin.set_fact:
    base_cluster_pre_start_security_checks: >-
      {%- set checks = [] -%}
      {%- if base_cluster_install_services.core_settings | default(true) | bool -%}
        {%- set _ = checks.append({'service': base_cluster_core_settings_service_name | default('core-settings'), 'name': 'hadoop_security_authentication', 'value': 'kerberos'}) -%}
        {%- set _ = checks.append({'service': base_cluster_core_settings_service_name | default('core-settings'), 'name': 'hadoop_security_authorization', 'value': 'true'}) -%}
      {%- endif -%}
      {%- if base_cluster_install_services.zookeeper | default(true) | bool -%}
        {%- set _ = checks.append({'service': 'zookeeper', 'name': 'quorum_auth_enable_sasl', 'value': 'true'}) -%}
        {%- set _ = checks.append({'service': 'zookeeper', 'name': 'enableSecurity', 'value': 'true'}) -%}
      {%- endif -%}
      {%- if base_cluster_install_services.hdfs | default(true) | bool -%}
        {%- set _ = checks.append({'service': 'hdfs', 'name': 'hadoop_security_authentication', 'value': 'kerberos'}) -%}
      {%- endif -%}
      {%- if base_cluster_install_services.ozone | default(true) | bool -%}
        {%- set _ = checks.append({'service': 'ozone', 'name': 'ozone.security.enabled', 'value': 'true'}) -%}
      {%- endif -%}
      {%- if base_cluster_install_services.yarn | default(true) | bool -%}
        {%- set _ = checks.append({'service': 'yarn', 'name': 'hadoop_secure_web_ui', 'value': 'true'}) -%}
      {%- endif -%}
      {%- if base_cluster_install_services.kafka | default(true) | bool -%}
        {%- set _ = checks.append({'service': 'kafka', 'name': 'kerberos.auth.enable', 'value': 'true'}) -%}
      {%- endif -%}
      {%- if base_cluster_install_services.hbase | default(true) | bool -%}
        {%- set _ = checks.append({'service': 'hbase', 'name': 'hbase_security_authentication', 'value': 'kerberos'}) -%}
        {%- set _ = checks.append({'service': 'hbase', 'name': 'hbase_security_authorization', 'value': 'true'}) -%}
      {%- endif -%}
      {%- if base_cluster_install_services.atlas | default(true) | bool -%}
        {%- set _ = checks.append({'service': 'atlas', 'name': 'kerberos.auth.enable', 'value': 'true'}) -%}
      {%- endif -%}
      {%- if base_cluster_install_services.knox | default(true) | bool -%}
        {%- set _ = checks.append({'service': 'knox', 'name': 'kerberos.auth.enabled', 'value': 'true'}) -%}
      {%- endif -%}
      {%- if base_cluster_install_services.solr | default(true) | bool -%}
        {%- set _ = checks.append({'service': 'solr', 'name': 'solr_security_authentication', 'value': 'kerberos'}) -%}
      {%- endif -%}
      {{ checks }}

- name: Read security-sensitive service configuration before First Run
  ansible.builtin.uri:
    url: >-
      {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
      }}/services/{{ item.service }}/config?view=full
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  loop: "{{ base_cluster_pre_start_security_checks }}"
  loop_control:
    label: "{{ item.service }}.{{ item.name }}"
  register: base_cluster_pre_start_security_config
  changed_when: false
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Require complete Kerberos configuration before First Run
  ansible.builtin.assert:
    that:
      - >-
        (
          item.json['items'] | default([])
          | selectattr('name', 'equalto', item.item.name)
          | map(attribute='value')
          | first
          | default(
              (
                item.json['items'] | default([])
                | selectattr('name', 'equalto', item.item.name)
                | map(attribute='default')
                | first
              ),
              true
            )
          | default('', true)
          | string
          | lower
        ) == item.item.value
    fail_msg: >-
      {{ item.item.service }}.{{ item.item.name }} is not {{ item.item.value }}
      after Kerberos reconciliation. Refusing CM First Run to prevent a
      partially secured cluster.
  loop: "{{ base_cluster_pre_start_security_config.results }}"
  loop_control:
    label: "{{ item.item.service }}.{{ item.item.name }}"

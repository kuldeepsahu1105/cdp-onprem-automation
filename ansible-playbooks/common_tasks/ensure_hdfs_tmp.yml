---
# Creates HDFS namespace /tmp through the supported CM command when available,
# then verifies and repairs it through an available base-node HDFS client.

- name: Read authoritative HDFS authentication mode for temporary-directory repair
  ansible.builtin.uri:
    url: >-
      {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
      }}/services/hdfs/config?view=full
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  register: base_cluster_hdfs_tmp_auth_config
  changed_when: false
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Resolve authoritative HDFS authentication mode for temporary-directory repair
  ansible.builtin.set_fact:
    base_cluster_hdfs_tmp_authentication: >-
      {{
        (
          base_cluster_hdfs_tmp_auth_config.json['items'] | default([])
          | selectattr('name', 'equalto', 'hadoop_security_authentication')
          | map(attribute='value')
          | first
        )
        | default(
            (
              base_cluster_hdfs_tmp_auth_config.json['items'] | default([])
              | selectattr('name', 'equalto', 'hadoop_security_authentication')
              | map(attribute='default')
              | first
            ),
            true
          )
        | default('simple', true)
        | lower
      }}

- name: Resolve a base-node HDFS client
  ansible.builtin.include_tasks: resolve_hdfs_client.yml

- name: Submit CM HDFS temporary-directory command
  ansible.builtin.uri:
    url: >-
      {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
      }}/services/hdfs/commands/hdfsCreateTmpDir
    method: POST
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200, 400]
    follow_redirects: none
  register: base_cluster_hdfs_tmp_command
  failed_when: >-
    base_cluster_hdfs_tmp_command.status | int == 400
    and 'command not valid for' not in (
      base_cluster_hdfs_tmp_command.json.message
      | default(base_cluster_hdfs_tmp_command.msg | default(''))
      | lower
    )
    and 'already exists' not in (
      base_cluster_hdfs_tmp_command.json.message
      | default(base_cluster_hdfs_tmp_command.msg | default(''))
      | lower
    )
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Wait for CM HDFS temporary-directory command
  ansible.builtin.include_tasks: wait_cm_api_command.yml
  vars:
    cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
    cm_api_command_id: "{{ base_cluster_hdfs_tmp_command.json.id }}"
    cm_api_command_allow_already_exists: true
    cm_api_command_allow_not_valid: true
    cm_api_uri_delegate_to: "{{ cm_cluster_module_delegate_to }}"
  when:
    - base_cluster_hdfs_tmp_command.status | int == 200
    - base_cluster_hdfs_tmp_command.json.id is defined

- name: Note CM HDFS temporary-directory fallback
  ansible.builtin.debug:
    msg: >-
      CM could not run hdfsCreateTmpDir for this service layout:
      {{
        base_cluster_hdfs_tmp_command.json.message
        | default(base_cluster_hdfs_tmp_command.msg | default('command unavailable'))
      }}.
      Verifying and repairing HDFS /tmp through the discovered base-node client
      on {{ base_cluster_hdfs_client_host }}.
  when: base_cluster_hdfs_tmp_command.status | int == 400

- name: Ensure HDFS temporary directory and sticky permissions
  ansible.builtin.shell: |
    set -euo pipefail
    hdfs_cli={{ base_cluster_hdfs_client_path | quote }}
    changed=false
    hdfs_authentication={{ base_cluster_hdfs_tmp_authentication | quote }}

    if [ "$hdfs_authentication" = "kerberos" ]; then
      hdfs_keytab=""
      while IFS= read -r candidate; do
        if [ -z "$hdfs_keytab" ] || [ "$candidate" -nt "$hdfs_keytab" ]; then
          hdfs_keytab="$candidate"
        fi
      done < <(
        find /var/run/cloudera-scm-agent/process -maxdepth 3 \
          -type f -name hdfs.keytab -print 2>/dev/null
      )

      if [ -z "$hdfs_keytab" ]; then
        echo "HDFS uses Kerberos, but no active CM-generated hdfs.keytab was found." >&2
        exit 1
      fi
      hadoop_conf_dir=$(dirname "$hdfs_keytab")

      hdfs_principal=$(
        klist -k "$hdfs_keytab" \
          | awk '$NF ~ /^hdfs(\/|@)/ { print $NF; exit }'
      )
      if [ -z "$hdfs_principal" ]; then
        echo "No hdfs principal was found in $hdfs_keytab." >&2
        exit 1
      fi

      export KRB5CCNAME="FILE:/tmp/ansible-hdfs-tmp-$$"
      trap 'kdestroy -c "$KRB5CCNAME" >/dev/null 2>&1 || rm -f "${KRB5CCNAME#FILE:}"' EXIT
      kinit -c "$KRB5CCNAME" -kt "$hdfs_keytab" "$hdfs_principal"

      hdfs_dfs() {
        env KRB5CCNAME="$KRB5CCNAME" HADOOP_CONF_DIR="$hadoop_conf_dir" \
          "$hdfs_cli" dfs "$@"
      }
    elif [ "$hdfs_authentication" = "simple" ]; then
      hdfs_dfs() {
        env HADOOP_USER_NAME=hdfs HADOOP_CONF_DIR=/etc/hadoop/conf \
          "$hdfs_cli" dfs "$@"
      }
    else
      echo "Unsupported HDFS authentication mode: $hdfs_authentication" >&2
      exit 1
    fi

    if ! hdfs_dfs -test -d /tmp; then
      hdfs_dfs -mkdir -p /tmp
      changed=true
    fi

    permissions=$(hdfs_dfs -stat '%a' /tmp)
    if [ "$permissions" != "1777" ]; then
      hdfs_dfs -chmod 1777 /tmp
      changed=true
    fi

    hdfs_dfs -test -d /tmp
    test "$(hdfs_dfs -stat '%a' /tmp)" = "1777"
    hdfs_dfs -ls -d /tmp
    echo "changed=${changed}"
  args:
    executable: /bin/bash
  register: base_cluster_hdfs_tmp_reconcile
  changed_when: "'changed=true' in base_cluster_hdfs_tmp_reconcile.stdout"
  become: true
  connection: ssh
  delegate_to: "{{ base_cluster_hdfs_client_host }}"

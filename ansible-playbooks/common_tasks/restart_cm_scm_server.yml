---
# Restart cloudera-scm-server on the CM inventory host and prove its process changed.

- name: Resolve Cloudera Manager restart connection
  ansible.builtin.set_fact:
    cm_scm_server_restart_manager_host: "{{ cm_manager_inventory_host | default('cldr-mngr') }}"
    cm_scm_server_restart_bastion_host: "{{ (groups['ipaserver'] | default([]) | first) | default('') }}"

- name: Select Cloudera Manager restart route
  ansible.builtin.set_fact:
    cm_scm_server_restart_via_ipaserver: >-
      {{
        ansible_controller_outside_vpc | default(false) | bool
        and cm_scm_server_restart_bastion_host | length > 0
        and (
          hostvars[cm_scm_server_restart_manager_host].private_ip
          | default('')
          | length > 0
        )
        and (
          hostvars[cm_scm_server_restart_bastion_host].public_ip
          | default(
              hostvars[cm_scm_server_restart_bastion_host].ansible_host
              | default('')
            )
          | length > 0
        )
      }}

- name: Register private Cloudera Manager restart target through IPAServer
  ansible.builtin.add_host:
    name: cm-autotls-restart-target
    ansible_host: "{{ hostvars[cm_scm_server_restart_manager_host].private_ip }}"
    ansible_user: >-
      {{
        hostvars[cm_scm_server_restart_manager_host].ansible_user
        | default(ansible_user | default('ec2-user'))
      }}
    ansible_port: "{{ hostvars[cm_scm_server_restart_manager_host].ansible_port | default(22) }}"
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -o ProxyJump={{
        hostvars[cm_scm_server_restart_bastion_host].ansible_user
        | default(ansible_user | default('ec2-user'))
      }}@{{
        hostvars[cm_scm_server_restart_bastion_host].public_ip
        | default(hostvars[cm_scm_server_restart_bastion_host].ansible_host)
      }}
  when: cm_scm_server_restart_via_ipaserver | bool

- name: Select Cloudera Manager restart delegate
  ansible.builtin.set_fact:
    cm_scm_server_restart_delegate: >-
      {{
        'cm-autotls-restart-target'
        if cm_scm_server_restart_via_ipaserver | bool
        else cm_scm_server_restart_manager_host
      }}

- name: Identify Cloudera Manager restart target
  ansible.builtin.command: hostname -f
  become: true
  delegate_to: "{{ cm_scm_server_restart_delegate }}"
  register: cm_scm_server_restart_hostname
  changed_when: false

- name: Print Cloudera Manager restart target
  ansible.builtin.debug:
    msg: >-
      Restarting CM on inventory host {{ cm_manager_inventory_host | default('cldr-mngr') }}
      (restart route={{
        'private IP via IPAServer'
        if cm_scm_server_restart_via_ipaserver | bool
        else 'inventory ansible_host'
      }}, target={{ hostvars[cm_scm_server_restart_delegate].ansible_host
        | default(cm_scm_server_restart_delegate) }},
      remote hostname={{ cm_scm_server_restart_hostname.stdout | trim }}).

- name: Detect Cloudera Manager systemd unit
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - cloudera-scm-server.service
      - --property=LoadState
      - --value
  become: true
  delegate_to: "{{ cm_scm_server_restart_delegate }}"
  register: cm_scm_server_systemd_load_state
  changed_when: false
  failed_when: false

- name: Detect Cloudera Manager SysV init script
  ansible.builtin.stat:
    path: /etc/init.d/cloudera-scm-server
  become: true
  delegate_to: "{{ cm_scm_server_restart_delegate }}"
  register: cm_scm_server_init_script

- name: Select Cloudera Manager restart mechanism
  ansible.builtin.set_fact:
    cm_scm_server_restart_mechanism: >-
      {{
        'systemd'
        if (cm_scm_server_systemd_load_state.stdout | default('') | trim) == 'loaded'
        else (
          'sysv'
          if (
            cm_scm_server_init_script.stat.exists | default(false) | bool
            and cm_scm_server_init_script.stat.executable | default(false) | bool
          )
          else ''
        )
      }}

- name: Require a Cloudera Manager service restart mechanism
  ansible.builtin.assert:
    that:
      - cm_scm_server_restart_mechanism | length > 0
    fail_msg: >-
      Cloudera Manager is reachable on {{ cm_api_url | default('its API') }}, but
      {{ cm_scm_server_restart_hostname.stdout | default('the delegated CM host') | trim }}
      has neither a loaded cloudera-scm-server.service unit nor executable
      /etc/init.d/cloudera-scm-server. Verify that inventory host
      {{ cm_manager_inventory_host | default('cldr-mngr') }} points to the machine
      actually serving CM.

- name: Read Cloudera Manager server PID before restart
  ansible.builtin.shell: |
    pid="$(ps -eo pid=,args= | awk '/[c]om\.cloudera\.server\.cmf\.Main/ { print $1; exit }')"
    if [ -z "${pid}" ]; then
      pid="$(ss -ltnpH | grep -E ':(7180|7183)[[:space:]]' | sed -nE 's/.*pid=([0-9]+).*/\1/p' | head -1)"
    fi
    printf '%s\n' "${pid}"
  args:
    executable: /bin/bash
  become: true
  delegate_to: "{{ cm_scm_server_restart_delegate }}"
  register: cm_scm_server_pid_before_restart
  changed_when: false
  failed_when: false

- name: Restart Cloudera Manager server with systemd
  ansible.builtin.command:
    argv:
      - systemctl
      - restart
      - cloudera-scm-server.service
  become: true
  delegate_to: "{{ cm_scm_server_restart_delegate }}"
  register: cm_scm_server_systemd_restart
  changed_when: cm_scm_server_systemd_restart.rc == 0
  when: cm_scm_server_restart_mechanism == 'systemd'

- name: Restart Cloudera Manager server with SysV init script
  ansible.builtin.command:
    argv:
      - /etc/init.d/cloudera-scm-server
      - restart
  become: true
  delegate_to: "{{ cm_scm_server_restart_delegate }}"
  register: cm_scm_server_sysv_restart
  changed_when: cm_scm_server_sysv_restart.rc == 0
  when: cm_scm_server_restart_mechanism == 'sysv'

- name: Wait for a new Cloudera Manager server process
  ansible.builtin.shell: |
    pid="$(ps -eo pid=,args= | awk '/[c]om\.cloudera\.server\.cmf\.Main/ { print $1; exit }')"
    if [ -z "${pid}" ]; then
      pid="$(ss -ltnpH | grep -E ':(7180|7183)[[:space:]]' | sed -nE 's/.*pid=([0-9]+).*/\1/p' | head -1)"
    fi
    printf '%s\n' "${pid}"
  args:
    executable: /bin/bash
  become: true
  delegate_to: "{{ cm_scm_server_restart_delegate }}"
  register: cm_scm_server_pid_after_restart
  changed_when: false
  failed_when: false
  retries: 60
  delay: 5
  until:
    - cm_scm_server_pid_after_restart.stdout | trim | length > 0
    - (cm_scm_server_pid_after_restart.stdout | trim) != (cm_scm_server_pid_before_restart.stdout | trim)

- name: Require a new Cloudera Manager server process
  ansible.builtin.assert:
    that:
      - cm_scm_server_pid_after_restart.stdout | trim | length > 0
      - (cm_scm_server_pid_after_restart.stdout | trim) != (cm_scm_server_pid_before_restart.stdout | trim)
    fail_msg: >-
      The {{ cm_scm_server_restart_mechanism }} restart command ran on
      {{ cm_scm_server_restart_hostname.stdout | default(cm_manager_inventory_host) | trim }},
      but the CM Java PID did not change. Before={{
      cm_scm_server_pid_before_restart.stdout | default('not found') | trim }},
      after={{ cm_scm_server_pid_after_restart.stdout | default('not found') | trim }}.

- name: Confirm Cloudera Manager server restart
  ansible.builtin.debug:
    msg: >-
      cloudera-scm-server restarted via {{ cm_scm_server_restart_mechanism }} on
      {{ cm_scm_server_restart_hostname.stdout | trim }}
      (target={{ hostvars[cm_scm_server_restart_delegate].ansible_host
        | default(cm_scm_server_restart_delegate) }}): PID {{
      cm_scm_server_pid_before_restart.stdout | default('unknown') | trim }}
      -> {{ cm_scm_server_pid_after_restart.stdout | trim }}.

---
# Restart only cloudera-scm-server on the CM host (same pattern as restart_cm_services.yml).

- name: Restart Cloudera Manager server after configuration change
  ansible.builtin.shell: |
    set -euo pipefail
    systemctl daemon-reload 2>/dev/null || true
    unit=cloudera-scm-server
    if systemctl cat "${unit}" >/dev/null 2>&1; then
      systemctl restart "${unit}"
      echo "restarted ${unit}"
    else
      echo "WARN: systemd unit ${unit} not found — skip"
      exit 0
    fi
  args:
    executable: /bin/bash
  become: true
  delegate_to: "{{ cm_manager_inventory_host | default('cldr-mngr') }}"
  register: cm_scm_server_restart_cmd
  changed_when: "'restarted' in cm_scm_server_restart_cmd.stdout"

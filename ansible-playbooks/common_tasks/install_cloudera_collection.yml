---
- name: Resolve ansible-galaxy path
  ansible.builtin.command: which ansible-galaxy
  register: galaxy_path
  changed_when: false
  failed_when: galaxy_path.rc != 0

- name: Install cloudera.cluster collection (pinned for PyPI cm_client)
  ansible.builtin.shell:
    cmd: >
      {{ galaxy_path.stdout }} collection install --force
      git+https://github.com/cloudera-labs/cloudera.cluster.git,{{ cloudera_cluster_collection_git_ref }}
  register: cloudera_collection_result
  retries: 3
  delay: 5
  until: cloudera_collection_result.rc == 0
  changed_when: cloudera_collection_result.rc == 0

- name: Install controller Python deps (urllib3 1.x pin + cm_client)
  ansible.builtin.import_tasks: install_cm_client_python.yml

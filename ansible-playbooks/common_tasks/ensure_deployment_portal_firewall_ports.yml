---
# Open portal Caddy (8088) and pgAdmin (5050) when firewalld is active on the ops host.
# PREREQS normally disable firewalld; this is idempotent when an admin re-enables it.

- name: Check firewalld service state on portal host
  ansible.builtin.systemd:
    name: firewalld
  register: _portal_firewalld_svc
  failed_when: false
  changed_when: false

- name: Allow deployment portal HTTP and pgAdmin ports in firewalld
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - "{{ deployment_portal_http_port | int }}"
    - "{{ deployment_portal_pgadmin_host_port | int }}"
  when:
    - _portal_firewalld_svc is succeeded
    - (_portal_firewalld_svc.status.ActiveState | default('inactive')) == 'active'

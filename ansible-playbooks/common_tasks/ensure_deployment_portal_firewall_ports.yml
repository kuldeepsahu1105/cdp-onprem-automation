---
# Open portal Caddy (deployment_portal_http_port), pgAdmin (5050), monitoring UIs, and cAdvisor when firewalld is active on the ops host.
# PREREQS normally disable firewalld; this is idempotent when an admin re-enables it.

- name: Check firewalld service state on portal host
  ansible.builtin.systemd:
    name: firewalld
  register: _portal_firewalld_svc
  failed_when: false
  changed_when: false

- name: Allow deployment portal, pgAdmin, and monitoring ports in firewalld
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  loop: >-
    {{
      [
        deployment_portal_http_port | int,
        deployment_portal_pgadmin_host_port | int,
        monitoring_grafana_host_port | int,
        monitoring_prometheus_host_port | int,
        monitoring_alertmanager_host_port | int,
        monitoring_cadvisor_host_port | int,
      ] | unique
    }}
  when:
    - _portal_firewalld_svc is succeeded
    - (_portal_firewalld_svc.status.ActiveState | default('inactive')) == 'active'

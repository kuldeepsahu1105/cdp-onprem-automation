---
# HTTPS CM API base for Kerberos REST (PUT /cm/config rejects HTTP :7180 with 303).

- name: Kerberos — refresh CM API URL when not resolved in this play
  ansible.builtin.import_tasks: set_cm_api_url.yml
  when: cm_api_url | default('') | length == 0

- name: Kerberos — derive HTTPS CM API URL from CM facts
  ansible.builtin.import_tasks: resolve_cm_krb_api_url_from_facts.yml

- name: Kerberos — build KDC admin principal for CM import
  ansible.builtin.set_fact:
    cm_krb_kdc_admin_principal: >-
      {{
        krb5_kdc_admin_user
        if ('@' in (krb5_kdc_admin_user | string))
        else (krb5_kdc_admin_user ~ '@' ~ cluster_realm)
      }}

---
- name: Stat cached ECS API credentials on controller
  ansible.builtin.stat:
    path: "{{ ecs_api_credentials_cache_path }}"
  register: ecs_api_credentials_cache_stat
  when:
    - >-
      ecs_api_access_key_id | default('') | length == 0
      or ecs_api_private_key | default('') | length == 0
    - ecs_api_credentials_cache_path | default('') | length > 0

- name: Resolve configured IAM bootstrap access key for cache identity
  ansible.builtin.set_fact:
    ecs_api_credentials_expected_bootstrap_access_key_id: >-
      {{
        ecs_iam_bootstrap_access_key_id
        | default(lookup('env', 'ECS_IAM_BOOTSTRAP_ACCESS_KEY_ID'), true)
        | default('', true)
        | trim
      }}
  no_log: true
  when:
    - ecs_api_credentials_cache_stat is defined
    - ecs_api_credentials_cache_stat.stat.exists | default(false) | bool

- name: Read current installer IAM credentials for cache identity
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - -n
      - "{{ ecs_iam_installer_secret_namespace }}"
      - get
      - secret
      - "{{ ecs_iam_installer_secret_name }}"
      - -o
      - json
  register: ecs_api_credentials_installer_secret
  changed_when: false
  failed_when: false
  no_log: true
  become: true
  delegate_to: "{{ groups[ecs_cluster_master_group][0] }}"
  connection: ssh
  when:
    - ecs_api_credentials_cache_stat is defined
    - ecs_api_credentials_cache_stat.stat.exists | default(false) | bool
    - ecs_iam_use_installer_credentials | default(true) | bool
    - ecs_api_credentials_expected_bootstrap_access_key_id | length == 0

- name: Apply current installer IAM access key as cache identity
  ansible.builtin.set_fact:
    ecs_api_credentials_expected_bootstrap_access_key_id: >-
      {{
        (
          (
            (ecs_api_credentials_installer_secret.stdout | from_json).data[
              ecs_iam_installer_secret_key
            ]
            | b64decode
            | from_json
          ).access_key_id
        )
      }}
  no_log: true
  when:
    - ecs_api_credentials_installer_secret is defined
    - ecs_api_credentials_installer_secret.rc | default(1) == 0
    - ecs_api_credentials_installer_secret.stdout | default('') | length > 0
    - >-
      ecs_iam_installer_secret_key
      in ((ecs_api_credentials_installer_secret.stdout | from_json).data | default({}))

- name: Validate cached ECS API credentials
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ playbook_dir }}/files/parse_ecs_api_credentials_cache.py"
      - "{{ ecs_api_credentials_cache_path }}"
  register: ecs_api_credentials_cache_parse
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - ecs_api_credentials_cache_stat is defined
    - ecs_api_credentials_cache_stat.stat.exists | default(false) | bool

- name: Apply cached ECS API credentials
  ansible.builtin.set_fact:
    ecs_api_credentials_cache_parsed: "{{ ecs_api_credentials_cache_parse.stdout | from_json }}"
    ecs_api_access_key_id: "{{ (ecs_api_credentials_cache_parse.stdout | from_json).access_key_id }}"
    ecs_api_private_key: "{{ (ecs_api_credentials_cache_parse.stdout | from_json).private_key }}"
  no_log: true
  when:
    - ecs_api_credentials_cache_parse is defined
    - ecs_api_credentials_cache_parse.rc | default(1) == 0
    - >-
      ecs_api_credentials_expected_bootstrap_access_key_id | default('') | length == 0
      or (
        (ecs_api_credentials_cache_parse.stdout | from_json).bootstrap_access_key_id
        == ecs_api_credentials_expected_bootstrap_access_key_id
      )

- name: Report ECS API credential cache from another cluster
  ansible.builtin.debug:
    msg: >-
      Ignoring ECS API credential cache {{ ecs_api_credentials_cache_path }}
      because it was created with a different installer IAM credential.
      A new automation access key will be generated for the current ECS cluster.
  when:
    - ecs_api_credentials_cache_parse is defined
    - ecs_api_credentials_cache_parse.rc | default(1) == 0
    - ecs_api_credentials_expected_bootstrap_access_key_id | default('') | length > 0
    - >-
      (ecs_api_credentials_cache_parse.stdout | from_json).bootstrap_access_key_id
      != ecs_api_credentials_expected_bootstrap_access_key_id

- name: Report invalid ECS API credentials cache
  ansible.builtin.debug:
    msg: >-
      ECS API credential cache {{ ecs_api_credentials_cache_path }} is invalid.
      It will be replaced only if automation must generate a new access key.
  when:
    - ecs_api_credentials_cache_parse is defined
    - ecs_api_credentials_cache_parse.rc | default(0) != 0

- name: Report cached ECS API credentials reused
  ansible.builtin.debug:
    msg: >-
      Reusing ECS automation API credentials from
      {{ ecs_api_credentials_cache_path }}.
  when:
    - ecs_api_credentials_cache_parse is defined
    - ecs_api_credentials_cache_parse.rc | default(1) == 0
    - >-
      ecs_api_credentials_expected_bootstrap_access_key_id | default('') | length == 0
      or (
        (ecs_api_credentials_cache_parse.stdout | from_json).bootstrap_access_key_id
        == ecs_api_credentials_expected_bootstrap_access_key_id
      )

---
- name: Stop and disable firewall service
  ansible.builtin.service:
    name: "{{ os_vars[ansible_os_family].firewall_service }}"
    state: stopped
    enabled: false
  register: firewall_disable
  failed_when: false
  changed_when: firewall_disable is changed

- name: Note when firewall service is not installed
  ansible.builtin.debug:
    msg: >-
      Firewall service {{ os_vars[ansible_os_family].firewall_service }} not present on
      {{ inventory_hostname }} — skipped (expected on minimal AMIs without firewalld)
  when: firewall_disable.failed | default(false)

- name: Disable UFW firewall (Debian family)
  ansible.builtin.command: ufw disable
  when: ansible_os_family == "Debian"
  register: ufw_disable
  changed_when: "'Firewall stopped and disabled' in ufw_disable.stdout"
  failed_when: false

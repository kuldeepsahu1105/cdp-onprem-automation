---
# Align ECS control plane LDAP with FreeIPA (reference: updateLdapProvider / cdp iam update-ldap-provider).

- name: LDAP | Skip when disabled or not using FreeIPA
  ansible.builtin.debug:
    msg: "Skipping ECS LDAP provider sync (configure_ldap={{ ecs_data_services_configure_ldap | default(true) }}, idp={{ identity_provider_effective }})."
  when: >-
    not (ecs_data_services_configure_ldap | default(true) | bool)
    or identity_provider_effective != 'freeipa'

- name: LDAP | Resolve FreeIPA CA URL
  ansible.builtin.set_fact:
    ecs_freeipa_ca_url: >-
      {{
        'https://' + (caddy_vhost_urls_external.ipa.hostname | default(''))
        + '/ipa/config/ca.crt'
        if (
          caddy_vhost_urls_external is defined
          and (caddy_vhost_urls_external.ipa.hostname | default('') | length > 0)
        )
        else ('https://' + ipa_kdc_host + '/ipa/config/ca.crt')
      }}
  when:
    - ecs_data_services_configure_ldap | default(true) | bool
    - identity_provider_effective == 'freeipa'

- name: LDAP | Fetch FreeIPA CA certificate
  ansible.builtin.uri:
    url: "{{ ecs_freeipa_ca_url }}"
    method: GET
    validate_certs: false
    return_content: true
  register: ecs_freeipa_ca_cert
  when:
    - ecs_data_services_configure_ldap | default(true) | bool
    - identity_provider_effective == 'freeipa'

- name: LDAP | Write FreeIPA CA to temp file for CDP CLI
  ansible.builtin.copy:
    dest: "{{ ecs_ds_cdp_profile_dir.path }}/freeipa-ca.crt"
    mode: "0600"
    content: "{{ ecs_freeipa_ca_cert.content }}"
  when:
    - ecs_data_services_configure_ldap | default(true) | bool
    - identity_provider_effective == 'freeipa'
    - ecs_freeipa_ca_cert.content is defined

- name: LDAP | Update control plane LDAP provider (cm-ldap)
  ansible.builtin.command:
    argv:
      - cdp
      - --profile
      - default
      - iam
      - update-ldap-provider
      - --ldap-provider-name
      - "{{ ecs_ldap_provider_name }}"
      - --url
      - "ldaps://{{ groups['ipaserver'] | first }}"
      - --user-search-base
      - "cn=users,cn=accounts,{{ ipa_ldap_dc_suffix }}"
      - --user-search-filter
      - "(uid={0})"
      - --group-search-base
      - "cn=groups,cn=accounts,{{ ipa_ldap_dc_suffix }}"
      - --group-search-filter
      - "(&(member={0})(objectClass=posixgroup)(!(|(cn=admins)(cn=ipausers))))"
      - --username-mapping-attribute
      - uid
      - --bind-dn
      - "uid={{ ipaadmin_principal }},cn=users,cn=accounts,{{ ipa_ldap_dc_suffix }}"
      - --bind-password
      - "{{ ipaadmin_password }}"
      - --tls-ca-certificates
      - "file://{{ ecs_ds_cdp_profile_dir.path }}/freeipa-ca.crt"
      - --skip-group-sync-on-login
  environment: "{{ ecs_cdp_cli_environment }}"
  register: ecs_ldap_update
  failed_when: >-
    ecs_ldap_update.rc != 0
    and ('not found' not in (ecs_ldap_update.stderr | default('') | lower))
  when:
    - ecs_data_services_configure_ldap | default(true) | bool
    - identity_provider_effective == 'freeipa'

- name: LDAP | Create control plane LDAP provider when missing
  ansible.builtin.command:
    argv:
      - cdp
      - --profile
      - default
      - iam
      - create-ldap-provider
      - --ldap-provider-name
      - "{{ ecs_ldap_provider_name }}"
      - --url
      - "ldaps://{{ groups['ipaserver'] | first }}"
      - --user-search-base
      - "cn=users,cn=accounts,{{ ipa_ldap_dc_suffix }}"
      - --user-search-filter
      - "(uid={0})"
      - --group-search-base
      - "cn=groups,cn=accounts,{{ ipa_ldap_dc_suffix }}"
      - --group-search-filter
      - "(&(member={0})(objectClass=posixgroup)(!(|(cn=admins)(cn=ipausers))))"
      - --username-mapping-attribute
      - uid
      - --bind-dn
      - "uid={{ ipaadmin_principal }},cn=users,cn=accounts,{{ ipa_ldap_dc_suffix }}"
      - --bind-password
      - "{{ ipaadmin_password }}"
      - --tls-ca-certificates
      - "file://{{ ecs_ds_cdp_profile_dir.path }}/freeipa-ca.crt"
      - --skip-group-sync-on-login
  environment: "{{ ecs_cdp_cli_environment }}"
  when:
    - ecs_data_services_configure_ldap | default(true) | bool
    - identity_provider_effective == 'freeipa'
    - ecs_ldap_update is defined
    - ecs_ldap_update.rc != 0
    - "'not found' in (ecs_ldap_update.stderr | default('') | lower)"

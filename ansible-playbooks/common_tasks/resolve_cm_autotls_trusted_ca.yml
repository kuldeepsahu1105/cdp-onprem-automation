---
# Cloudera Labs cm_autotls reference: trust the FreeIPA CA bundle on the CM host before generateCmca
# (auto-tls*.json.j2 → trustedCaCerts=/etc/ipa/ca.crt). use_freeipa_for_crt_mgmt defaults to true when
# identity_provider_effective == freeipa (group_vars/all.yml) but the file must actually exist on the
# CM host — verify it here instead of trusting the toggle blindly, so a not-yet-joined/broken FreeIPA
# client host does not send generateCmca a trustedCaCerts path CM cannot read.

- name: Auto-TLS trusted CA — default effective flag from configured intent
  ansible.builtin.set_fact:
    cm_autotls_trust_freeipa_ca_effective: "{{ use_freeipa_for_crt_mgmt | default(false) | bool }}"

- name: Auto-TLS trusted CA — verify FreeIPA CA bundle exists on CM host
  ansible.builtin.stat:
    path: "{{ cm_autotls_freeipa_ca_cert_path | default('/etc/ipa/ca.crt') }}"
  delegate_to: "{{ cm_manager_inventory_host }}"
  become: true
  register: cm_autotls_freeipa_ca_stat
  when: cm_autotls_trust_freeipa_ca_effective | bool

- name: Auto-TLS trusted CA — read authoritative CA bundle from FreeIPA server
  ansible.builtin.slurp:
    src: /etc/ipa/ca.crt
  delegate_to: "{{ groups['ipaserver'][0] }}"
  become: true
  register: cm_autotls_freeipa_ca_source
  when:
    - cm_autotls_trust_freeipa_ca_effective | bool
    - not (cm_autotls_freeipa_ca_stat.stat.exists | default(false) | bool)
    - groups.get('ipaserver', []) | length > 0

- name: Auto-TLS trusted CA — ensure target directory exists on CM host
  ansible.builtin.file:
    path: "{{ cm_autotls_freeipa_ca_cert_path | default('/etc/ipa/ca.crt') | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  delegate_to: "{{ cm_manager_inventory_host }}"
  become: true
  when:
    - cm_autotls_trust_freeipa_ca_effective | bool
    - not (cm_autotls_freeipa_ca_stat.stat.exists | default(false) | bool)
    - cm_autotls_freeipa_ca_source.content | default('') | length > 0

- name: Auto-TLS trusted CA — copy FreeIPA CA bundle to CM host
  ansible.builtin.copy:
    content: "{{ cm_autotls_freeipa_ca_source.content | b64decode }}"
    dest: "{{ cm_autotls_freeipa_ca_cert_path | default('/etc/ipa/ca.crt') }}"
    owner: root
    group: root
    mode: "0644"
  delegate_to: "{{ cm_manager_inventory_host }}"
  become: true
  when:
    - cm_autotls_trust_freeipa_ca_effective | bool
    - not (cm_autotls_freeipa_ca_stat.stat.exists | default(false) | bool)
    - cm_autotls_freeipa_ca_source.content | default('') | length > 0

- name: Auto-TLS trusted CA — verify CA bundle after copy
  ansible.builtin.stat:
    path: "{{ cm_autotls_freeipa_ca_cert_path | default('/etc/ipa/ca.crt') }}"
  delegate_to: "{{ cm_manager_inventory_host }}"
  become: true
  register: cm_autotls_freeipa_ca_stat
  when: cm_autotls_trust_freeipa_ca_effective | bool

- name: Auto-TLS trusted CA — require FreeIPA CA bundle when configured
  ansible.builtin.assert:
    that:
      - cm_autotls_freeipa_ca_stat.stat.exists | default(false) | bool
      - cm_autotls_freeipa_ca_stat.stat.isreg | default(false) | bool
      - cm_autotls_freeipa_ca_stat.stat.size | default(0) | int > 0
    fail_msg: >-
      use_freeipa_for_crt_mgmt=true requires
      {{ cm_autotls_freeipa_ca_cert_path | default('/etc/ipa/ca.crt') }} on
      {{ cm_manager_inventory_host | default('cldr-mngr') }} before generateCmca.
      Automatic copy from the FreeIPA server did not produce the configured CA path.
      Verify [ipaserver] inventory, /etc/ipa/ca.crt on the IPA server, and SSH access to both hosts.
  when:
    - cm_autotls_trust_freeipa_ca_effective | bool

- name: Auto-TLS trusted CA — verify complete FreeIPA enrollment on CM host
  ansible.builtin.include_tasks: verify_freeipa_client_enrollment.yml
  vars:
    freeipa_client_validation_host: "{{ cm_manager_inventory_host }}"
  when: cm_autotls_trust_freeipa_ca_effective | bool

---
- name: CAI | List live workspaces in target environment
  cloudera.cloud.ml_info:
    environment: "{{ ecs_cdp_environment_name }}"
    endpoint_tls: "{{ ecs_data_services_verify_tls | default(false) | bool }}"
  environment: "{{ ecs_cdp_cli_environment }}"
  register: ecs_cai_workspace_inventory
  changed_when: false
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when: "'cai' in (ecs_data_services_install_names | default([]))"

- name: CAI | Initialize effective workspace name candidates
  ansible.builtin.set_fact:
    ecs_cai_live_workspaces: "{{ ecs_cai_workspace_inventory.workspaces | default([]) }}"
    ecs_cai_workspace_candidate_names: []
    ecs_cai_subdomain_candidate_names: []
    ecs_cai_workspace_name_effective: ""
    ecs_cai_static_subdomain_effective: ""
    ecs_cai_existing_workspace: {}
  when: "'cai' in (ecs_data_services_install_names | default([]))"

- name: CAI | Build bounded workspace name candidates
  ansible.builtin.set_fact:
    ecs_cai_workspace_candidate_names: >-
      {{ ecs_cai_workspace_candidate_names + [_ecs_cai_candidate_name] }}
  vars:
    _ecs_cai_candidate_suffix: "{{ '' if item == 1 else '-' + (item | string) }}"
    _ecs_cai_candidate_base: >-
      {{
        ecs_cai_workspace_name[
          0:
          (
            ecs_cai_workspace_name_max_length | int
            - (_ecs_cai_candidate_suffix | length)
          )
        ]
        | regex_replace('-+$', '')
      }}
    _ecs_cai_candidate_name: >-
      {{ _ecs_cai_candidate_base + _ecs_cai_candidate_suffix }}
  loop: "{{ range(1, (ecs_cai_workspace_name_attempts | int) + 1) | list }}"
  when: "'cai' in (ecs_data_services_install_names | default([]))"

- name: CAI | Build matching bounded endpoint candidates
  ansible.builtin.set_fact:
    ecs_cai_subdomain_candidate_names: >-
      {{ ecs_cai_subdomain_candidate_names + [_ecs_cai_endpoint_candidate] }}
  vars:
    _ecs_cai_endpoint_suffix: "{{ '' if item == 1 else '-' + (item | string) }}"
    _ecs_cai_endpoint_base: >-
      {{
        ecs_cai_static_subdomain[
          0:
          (
            15
            - (_ecs_cai_endpoint_suffix | length)
          )
        ]
        | regex_replace('-+$', '')
      }}
    _ecs_cai_endpoint_candidate: >-
      {{ _ecs_cai_endpoint_base + _ecs_cai_endpoint_suffix }}
  loop: "{{ range(1, (ecs_cai_workspace_name_attempts | int) + 1) | list }}"
  when: "'cai' in (ecs_data_services_install_names | default([]))"

- name: CAI | Reuse first real active or provisioning workspace candidate
  ansible.builtin.set_fact:
    ecs_cai_workspace_name_effective: "{{ item }}"
    ecs_cai_existing_workspace: "{{ _ecs_cai_candidate_workspace }}"
  vars:
    _ecs_cai_candidate_workspace: >-
      {{
        ecs_cai_live_workspaces
        | selectattr('instanceName', 'defined')
        | selectattr('instanceName', 'equalto', item)
        | list
        | first
        | default({})
      }}
  loop: "{{ ecs_cai_workspace_candidate_names }}"
  when:
    - "'cai' in (ecs_data_services_install_names | default([]))"
    - ecs_cai_workspace_name_effective | length == 0
    - _ecs_cai_candidate_workspace | length > 0
    - >-
      _ecs_cai_candidate_workspace.instanceStatus | default('')
      is not search('(?i)(failed$|create_failed|deleted$|delet|remov|terminat)')
    - >-
      _ecs_cai_candidate_workspace.instanceStatus | default('')
      is search(
        '(?i)(progress|pending|creat|install|provision|start|running|ready|active|finished|modify)'
      )

- name: CAI | Select first candidate not present in live workspace inventory
  ansible.builtin.set_fact:
    ecs_cai_workspace_name_effective: "{{ item }}"
  vars:
    _ecs_cai_live_workspace_names: >-
      {{
        ecs_cai_live_workspaces
        | selectattr('instanceName', 'defined')
        | map(attribute='instanceName')
        | list
      }}
  loop: "{{ ecs_cai_workspace_candidate_names }}"
  when:
    - "'cai' in (ecs_data_services_install_names | default([]))"
    - ecs_cai_workspace_name_effective | length == 0
    - item not in _ecs_cai_live_workspace_names

- name: CAI | Require a bounded effective workspace name
  ansible.builtin.assert:
    that:
      - ecs_cai_workspace_name_effective | length > 0
      - ecs_cai_workspace_name_effective | length <= ecs_cai_workspace_name_max_length | int
    fail_msg: >-
      Unable to select a CAI workspace name from
      {{ ecs_cai_workspace_name_attempts }} bounded candidates derived from
      {{ ecs_cai_workspace_name }}.
  when: "'cai' in (ecs_data_services_install_names | default([]))"

- name: CAI | Match initial endpoint to effective workspace candidate
  ansible.builtin.set_fact:
    ecs_cai_static_subdomain_effective: >-
      {{
        (
          ecs_cai_existing_workspace.instanceUrl
          | regex_replace('^https?://', '')
          | regex_replace('/.*$', '')
          | regex_replace(':.*$', '')
          | split('.')
          | first
        )
        if (
          ecs_cai_existing_workspace | length > 0
          and ecs_cai_existing_workspace.instanceUrl | default('') | length > 0
        )
        else (
          ecs_cai_subdomain_candidate_names[
            ecs_cai_workspace_candidate_names.index(ecs_cai_workspace_name_effective)
          ]
        )
      }}
  when: "'cai' in (ecs_data_services_install_names | default([]))"

- name: CAI | Preserve deterministic workspace create attempt order
  ansible.builtin.set_fact:
    ecs_cai_workspace_create_candidates: >-
      {{
        ecs_cai_workspace_candidate_names[
          ecs_cai_workspace_candidate_names.index(ecs_cai_workspace_name_effective):
        ]
      }}
  when: "'cai' in (ecs_data_services_install_names | default([]))"

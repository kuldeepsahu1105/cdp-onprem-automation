---
# Run on localhost after CM config changes (replaces handler chain in 27/28).

- name: CM API — clear stale health flag before systemctl restart (HTTPS may already be up)
  ansible.builtin.set_fact:
    cm_api_health_ok: false

- name: Restart Cloudera Manager server on CM host (before any agent restart)
  ansible.builtin.import_tasks: restart_cm_scm_server.yml

- name: CM API — realign URL if needed and wait for /cm/version after server restart
  ansible.builtin.import_tasks: realign_cm_api_url_after_autotls_restart.yml

- name: Abort when CM API is not healthy after server restart
  ansible.builtin.fail:
    msg: >-
      Cloudera Manager Server was restarted but /cm/version is not reachable.
      Fix CM Server on {{ cm_manager_inventory_host | default('cldr-mngr') }} before
      restarting agents (see RUNBOOK.md — CM agent heartbeat recovery).
  when: not (cm_api_health_ok | default(false) | bool)

- name: Restart Cloudera Manager agent on CM host after API is healthy
  ansible.builtin.import_tasks: restart_cm_scm_agent_on_manager.yml
  when: >-
    (cm_scm_server_restart_manager_agent | default('auto')) == 'always'
    or (
      (cm_scm_server_restart_manager_agent | default('auto')) == 'auto'
      and (
        hostvars['localhost'].cm_restart_after_autotls_this_run | default(false) | bool
        or hostvars['localhost'].autotls_applied_this_run | default(false) | bool
      )
    )

---
# Always probe /api/version (not cm_api_url/version). Use cm_api_client_host from set_cm_api_url (public IP from Jenkins).

- name: Wait for Cloudera Manager API to respond (delegated to CM host when play is on localhost)
  ansible.builtin.uri:
    url: "{{ cm_protocol }}://{{ cm_api_probe_host }}:{{ cm_api_port }}/api/version"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200, 301, 303, 401, 403]
  register: cm_api_wait
  until: cm_api_wait.status in [200, 301, 303, 401, 403]
  retries: 30
  delay: 10
  timeout: 30
  delegate_to: "{{ cm_api_probe_delegate_to }}"
  when:
    - cm_api_probe_delegate_to is defined
    - cm_api_probe_delegate_to | length > 0

- name: Wait for Cloudera Manager API to respond on play host
  ansible.builtin.uri:
    url: "{{ cm_protocol }}://{{ cm_api_client_host }}:{{ cm_api_port }}/api/version"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200, 301, 303, 401, 403]
  register: cm_api_wait
  until: cm_api_wait.status in [200, 301, 303, 401, 403]
  retries: 30
  delay: 10
  timeout: 30
  when: cm_api_probe_delegate_to is not defined or cm_api_probe_delegate_to | length == 0

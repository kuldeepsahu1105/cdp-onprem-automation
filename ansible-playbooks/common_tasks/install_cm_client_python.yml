---
# Controller-side deps for cloudera.cluster.* (runs from playbooks 28–31, 33 via install_cloudera_collection.yml).
# urllib3 2.x breaks cm_client RESTClientObject (TypeError in pool maxsize during endpoint discovery).

- name: Resolve Python for Ansible controller pip installs
  ansible.builtin.set_fact:
    _cm_controller_python: "{{ ansible_playbook_python | default(ansible_python_interpreter | default('python3')) }}"

- name: Check cm_client and urllib3 on controller Python
  ansible.builtin.command:
    argv:
      - "{{ _cm_controller_python }}"
      - -c
      - |
        import cm_client
        import urllib3
        assert urllib3.__version__.split(".")[0] == "1"
  register: cm_client_import
  changed_when: false
  failed_when: false

- name: Detect whether controller Python is a virtual environment
  ansible.builtin.command:
    argv:
      - "{{ _cm_controller_python }}"
      - -c
      - import sys; print("yes" if sys.prefix != sys.base_prefix else "no")
  register: _cm_controller_python_venv
  changed_when: false
  when: cm_client_import.rc != 0

- name: Install compatible dependencies into controller Python
  when: cm_client_import.rc != 0
  block:
    - name: Install into the selected controller Python
      ansible.builtin.command:
        argv: >-
          {{
            [_cm_controller_python, '-m', 'pip', 'install']
            + ([] if _cm_controller_python_venv.stdout == 'yes' else ['--user'])
            + ['cm_client', 'urllib3>=1.26.5,<2']
          }}
      register: _cm_controller_pip_install
      changed_when: "'Successfully installed' in (_cm_controller_pip_install.stdout | default(''))"
  rescue:
    - name: Install into externally managed controller Python
      ansible.builtin.command:
        argv:
          - "{{ _cm_controller_python }}"
          - -m
          - pip
          - install
          - --user
          - --break-system-packages
          - cm_client
          - "urllib3>=1.26.5,<2"
      register: _cm_controller_pip_install_external
      changed_when: "'Successfully installed' in (_cm_controller_pip_install_external.stdout | default(''))"

- name: Verify cm_client import after pip install
  ansible.builtin.command:
    argv:
      - "{{ _cm_controller_python }}"
      - -c
      - |
        import cm_client
        import urllib3
        assert urllib3.__version__.split(".")[0] == "1"
  changed_when: false
  failed_when: false
  register: cm_client_import_after
  when: cm_client_import.rc != 0

- name: Fail when cm_client is not available on controller
  ansible.builtin.fail:
    msg: >-
      cm_client could not be imported by {{ _cm_controller_python }}.
      Install manually with that interpreter:
      {{ _cm_controller_python }} -m pip install cm_client 'urllib3>=1.26.5,<2'
  when:
    - cm_client_import.rc != 0
    - cm_client_import_after is defined
    - cm_client_import_after.rc != 0

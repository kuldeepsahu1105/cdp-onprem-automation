---
- name: CAI attempt | Resolve live candidate workspace
  ansible.builtin.set_fact:
    ecs_cai_candidate_workspace: >-
      {{
        ecs_cai_live_workspaces
        | selectattr('instanceName', 'defined')
        | selectattr('instanceName', 'equalto', ecs_cai_workspace_candidate)
        | list
        | first
        | default({})
      }}

- name: CAI attempt | Adopt reusable live candidate
  ansible.builtin.set_fact:
    ecs_cai_workspace_name_effective: "{{ ecs_cai_workspace_candidate }}"
    ecs_cai_existing_workspace: "{{ ecs_cai_candidate_workspace }}"
  when:
    - ecs_cai_candidate_workspace | length > 0
    - >-
      ecs_cai_candidate_workspace.instanceStatus | default('')
      is not search('(?i)(failed$|create_failed|deleted$|delet|remov|terminat)')
    - >-
      ecs_cai_candidate_workspace.instanceStatus | default('')
      is search(
        '(?i)(progress|pending|creat|install|provision|start|running|ready|active|finished|modify)'
      )

- name: CAI attempt | Record unavailable live candidate
  ansible.builtin.set_fact:
    ecs_cai_workspace_collision_evidence: >-
      {{
        ecs_cai_workspace_collision_evidence
        + [
            {
              'name': ecs_cai_workspace_candidate,
              'status': ecs_cai_candidate_workspace.instanceStatus | default('unknown'),
              'reason': 'live workspace is not reusable'
            }
          ]
      }}
  when:
    - ecs_cai_candidate_workspace | length > 0
    - >-
      (
        ecs_cai_candidate_workspace.instanceStatus | default('')
        is search('(?i)(failed$|create_failed|deleted$|delet|remov|terminat)')
      )
      or
      (
        ecs_cai_candidate_workspace.instanceStatus | default('')
        is not search(
          '(?i)(progress|pending|creat|install|provision|start|running|ready|active|finished|modify)'
        )
      )

- name: CAI attempt | Submit workspace creation for unused candidate
  cloudera.cloud.ml:
    environment: "{{ ecs_cdp_environment_name }}"
    name: "{{ ecs_cai_workspace_candidate }}"
    governance: "{{ ecs_cai_enable_governance | default(true) | bool }}"
    metrics: "{{ ecs_cai_enable_metrics | default(true) | bool }}"
    tls: "{{ ecs_cai_enable_tls | default(true) | bool }}"
    monitoring: "{{ ecs_cai_enable_monitoring | default(true) | bool }}"
    namespace: "{{ ecs_cai_k8s_namespace }}"
    subdomain: "{{ ecs_cai_static_subdomain }}"
    resource_pool: "{{ ecs_cai_resource_pool }}"
    endpoint_tls: "{{ ecs_data_services_verify_tls | default(false) | bool }}"
    wait: false
    state: present
  environment: "{{ ecs_cdp_cli_environment }}"
  register: ecs_cai_workspace_attempt
  failed_when: false
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when: ecs_cai_candidate_workspace | length == 0

- name: CAI attempt | Resolve submission error text
  ansible.builtin.set_fact:
    ecs_cai_workspace_attempt_error: >-
      {{
        ecs_cai_workspace_attempt.msg
        | default(ecs_cai_workspace_attempt.stderr | default(''))
      }}
  when: ecs_cai_candidate_workspace | length == 0

- name: CAI attempt | Reject non-collision submission error
  ansible.builtin.assert:
    that:
      - ecs_cai_workspace_attempt.workspace is defined
      - ecs_cai_workspace_attempt_error | length == 0
    fail_msg: >-
      CAI workspace creation failed for {{ ecs_cai_workspace_candidate }}:
      {{ ecs_cai_workspace_attempt_error
         | default(ecs_cai_workspace_attempt | to_json, true) }}.
  when:
    - ecs_cai_candidate_workspace | length == 0
    - ecs_cai_workspace_attempt_error | lower is not search('already exists')

- name: CAI attempt | Record successful submission
  ansible.builtin.set_fact:
    ecs_cai_workspace_name_effective: "{{ ecs_cai_workspace_candidate }}"
    ecs_cai_workspace_start: "{{ ecs_cai_workspace_attempt }}"
    ecs_cai_workspace_create_succeeded: true
  when:
    - ecs_cai_candidate_workspace | length == 0
    - ecs_cai_workspace_attempt.workspace is defined
    - ecs_cai_workspace_attempt_error | length == 0

- name: CAI attempt | Refresh inventory after already-exists response
  cloudera.cloud.ml_info:
    environment: "{{ ecs_cdp_environment_name }}"
    endpoint_tls: "{{ ecs_data_services_verify_tls | default(false) | bool }}"
  environment: "{{ ecs_cdp_cli_environment }}"
  register: ecs_cai_collision_inventory
  changed_when: false
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when:
    - ecs_cai_candidate_workspace | length == 0
    - ecs_cai_workspace_attempt_error | lower is search('already exists')

- name: CAI attempt | Update live inventory after collision
  ansible.builtin.set_fact:
    ecs_cai_live_workspaces: "{{ ecs_cai_collision_inventory.workspaces | default([]) }}"
    ecs_cai_collision_workspace: >-
      {{
        ecs_cai_collision_inventory.workspaces | default([])
        | selectattr('instanceName', 'defined')
        | selectattr('instanceName', 'equalto', ecs_cai_workspace_candidate)
        | list
        | first
        | default({})
      }}
  when:
    - ecs_cai_candidate_workspace | length == 0
    - ecs_cai_workspace_attempt_error | lower is search('already exists')

- name: CAI attempt | Adopt real workspace returned after collision
  ansible.builtin.set_fact:
    ecs_cai_workspace_name_effective: "{{ ecs_cai_workspace_candidate }}"
    ecs_cai_existing_workspace: "{{ ecs_cai_collision_workspace }}"
  when:
    - ecs_cai_collision_workspace | default({}) | length > 0
    - >-
      ecs_cai_collision_workspace.instanceStatus | default('')
      is not search('(?i)(failed$|create_failed|deleted$|delet|remov|terminat)')
    - >-
      ecs_cai_collision_workspace.instanceStatus | default('')
      is search(
        '(?i)(progress|pending|creat|install|provision|start|running|ready|active|finished|modify)'
      )

- name: CAI attempt | Record unresolved or unusable collision
  ansible.builtin.set_fact:
    ecs_cai_workspace_collision_evidence: >-
      {{
        ecs_cai_workspace_collision_evidence
        + [
            {
              'name': ecs_cai_workspace_candidate,
              'status': ecs_cai_collision_workspace.instanceStatus
                        | default('not returned'),
              'reason': (
                'already exists but list/describe returned no workspace'
                if (ecs_cai_collision_workspace | default({}) | length == 0)
                else 'already exists workspace is not reusable'
              )
            }
          ]
      }}
  when:
    - ecs_cai_candidate_workspace | length == 0
    - ecs_cai_workspace_attempt_error | lower is search('already exists')
    - >-
      ecs_cai_collision_workspace | default({}) | length == 0
      or (
        ecs_cai_collision_workspace.instanceStatus | default('')
        is search('(?i)(failed$|create_failed|deleted$|delet|remov|terminat)')
      )
      or (
        ecs_cai_collision_workspace.instanceStatus | default('')
        is not search(
          '(?i)(progress|pending|creat|install|provision|start|running|ready|active|finished|modify)'
        )
      )

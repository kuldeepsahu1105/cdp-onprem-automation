---
- name: CDE | List existing services without describing their CM cluster
  ansible.builtin.command:
    argv: "{{ ecs_data_services_cdp_cli_prefix + ['de', 'list-services'] }}"
  environment: "{{ ecs_cdp_cli_environment }}"
  register: ecs_cde_preflight_service_list
  changed_when: false
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh

- name: CDE | Select existing service summary
  ansible.builtin.set_fact:
    ecs_cde_preflight_service: >-
      {{
        (
          (ecs_cde_preflight_service_list.stdout | from_json).services
          | default([])
          | selectattr('name', 'equalto', ecs_cde_service_name)
          | selectattr('environmentName', 'equalto', ecs_cdp_environment_name)
          | list
          | first
        )
        | default({})
      }}

- name: CDE | Select terminal failed service
  ansible.builtin.set_fact:
    ecs_cde_failed_service: >-
      {{
        ecs_cde_preflight_service
        if (
          ecs_cde_preflight_service.status | default('')
        is search('(?i)failed$')
        )
        else {}
      }}

- name: CDE | Refuse to mutate a terminal failed service
  ansible.builtin.assert:
    that:
      - ecs_cde_failed_service | length == 0
    fail_msg: >-
      Existing CDE service {{ ecs_cde_failed_service.name | default(ecs_cde_service_name) }}
      (clusterId={{ ecs_cde_failed_service.clusterId | default('unknown') }})
      is in terminal status
      {{ ecs_cde_failed_service.status | default('unknown') }}. Automation will
      not disable, delete, or recreate a failed service. Resolve or remove it
      through the supported control-plane workflow, then rerun.

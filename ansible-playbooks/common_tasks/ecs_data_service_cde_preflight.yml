---
- name: CDE | List existing services without describing their CM cluster
  ansible.builtin.command:
    argv: "{{ ecs_data_services_cdp_cli_prefix + ['de', 'list-services', '--no-remove-deleted'] }}"
  environment: "{{ ecs_cdp_cli_environment }}"
  register: ecs_cde_preflight_service_list
  changed_when: false
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh

- name: CDE | Resolve one healthy reference service for CM reachability
  ansible.builtin.set_fact:
    ecs_cde_reference_service_name: >-
      {%- set services = (ecs_cde_preflight_service_list.stdout | from_json).services | default([]) -%}
      {%- set ns = namespace(name='') -%}
      {%- for service in services if ns.name | length == 0 -%}
      {%- if (
        service.environmentName | default('') == ecs_cdp_environment_name
        and service.status | default('') | lower
        in (ecs_cde_service_green_statuses | map('lower') | list)
      ) -%}
      {%- set ns.name = service.name -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.name }}

- name: CDE | Verify Management Console can describe healthy reference service
  cloudera.cloud.de_info:
    environment: "{{ ecs_cdp_environment_name }}"
    name: "{{ ecs_cde_reference_service_name }}"
    endpoint_tls: "{{ ecs_data_services_verify_tls | default(false) | bool }}"
  environment: "{{ ecs_cdp_cli_environment }}"
  register: ecs_cde_reference_service_info
  until: ecs_cde_reference_service_info is succeeded
  retries: "{{ ecs_data_services_dns_probe_attempts | default(3) | int }}"
  delay: "{{ ecs_data_services_dns_probe_retry_delay | int }}"
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when: ecs_cde_reference_service_name | length > 0

- name: CDE | Report Management Console to CM reference probe
  ansible.builtin.debug:
    msg: >-
      CDE Management Console successfully described healthy reference service
      {{ ecs_cde_reference_service_name }} before new-service submission.
  when: ecs_cde_reference_service_name | length > 0

- name: CDE | Build bounded deterministic service names
  ansible.builtin.set_fact:
    ecs_cde_service_candidate_names: >-
      {%- set result = [] -%}
      {%- for attempt in range(1, (ecs_cde_service_name_attempts | int) + 1) -%}
      {%- set suffix = '' if attempt == 1 else '-' + (attempt | string) -%}
      {%- set stem_length = (ecs_cde_service_name_max_length | int) - (suffix | length) -%}
      {%- set candidate = (ecs_cde_service_name[:stem_length] + suffix) -%}
      {%- set _ = result.append(candidate) -%}
      {%- endfor -%}
      {{ result }}

- name: CDE | Select reusable or first unused service name
  ansible.builtin.set_fact:
    ecs_cde_service_selection: >-
      {%- set services = (ecs_cde_preflight_service_list.stdout | from_json).services | default([]) -%}
      {%- set ns = namespace(selected={}) -%}
      {%- for candidate in ecs_cde_service_candidate_names if ns.selected | length == 0 -%}
      {%- set matches = services
        | selectattr('name', 'equalto', candidate)
        | selectattr('environmentName', 'equalto', ecs_cdp_environment_name)
        | list -%}
      {%- if matches | length == 0 -%}
      {%- set ns.selected = {'name': candidate, 'existing': false, 'status': 'Absent'} -%}
      {%- elif (
        matches[0].status | default('') | lower
        in (
          (
            ecs_cde_service_green_statuses
            + ecs_cde_service_transitional_statuses
          )
          | map('lower')
          | list
        )
      ) -%}
      {%- set ns.selected = {
        'name': candidate,
        'existing': true,
        'status': matches[0].status | default('Unknown'),
        'service': matches[0]
      } -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.selected }}

- name: CDE | Require an available bounded service name
  ansible.builtin.assert:
    that:
      - ecs_cde_service_selection | length > 0
    fail_msg: >-
      CDE could not find a reusable or unused name after
      {{ ecs_cde_service_name_attempts }} bounded attempts. Failed, deleted, and
      otherwise unusable services are not deleted automatically.

- name: CDE | Record effective service name and prior state
  ansible.builtin.set_fact:
    ecs_cde_service_name_effective: "{{ ecs_cde_service_selection.name }}"
    ecs_cde_service_existing: "{{ ecs_cde_service_selection.existing | bool }}"
    ecs_cde_service_prior_status: "{{ ecs_cde_service_selection.status }}"

- name: CDE | Report selected existing service without capacity mutation
  ansible.builtin.debug:
    msg: >-
      CDE Service: Existing resource selected for mutation-free reuse.
      name={{ ecs_cde_service_name_effective }};
      observed_status={{ ecs_cde_service_prior_status }};
      clusterId={{
      (ecs_cde_service_selection.service | default({})).clusterId
      | default('not returned') }};
      environment={{
      (ecs_cde_service_selection.service | default({})).environmentName
      | default(ecs_cdp_environment_name) }}.
      Existing CPU and memory capacity will not be resized.
  when: ecs_cde_service_existing | bool

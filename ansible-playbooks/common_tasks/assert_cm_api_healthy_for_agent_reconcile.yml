---
# Gate cluster-wide agent restarts on a live CM API (/cm/version). Used after Auto-TLS CM server restart.

- name: CM API — clear health flag before pre-agent-reconcile probe
  ansible.builtin.set_fact:
    cm_api_health_ok: false
    cm_api_url_force_refresh: true

- name: CM API — refresh URL before agent reconcile health check
  ansible.builtin.import_tasks: set_cm_api_url.yml

- name: CM API — wait for /cm/version before cluster-wide agent restart
  ansible.builtin.import_tasks: wait_for_cm_api.yml

- name: Fail when CM API is not healthy (skip mass agent restart)
  ansible.builtin.fail:
    msg: >-
      Cloudera Manager API is not healthy on /cm/version after CM Server restart
      (port {{ cm_api_port | default(cm_https_port | default(7183)) }}).
      Cluster-wide cloudera-scm-agent restart was skipped to avoid losing host heartbeats.
      Recovery on cldr-mngr: systemctl restart cloudera-scm-server; wait until
      https://<manager-fqdn>:7183/api/vXX/cm/version responds; then restart agents
      (see ansible-playbooks/docs/RUNBOOK.md — CM agent heartbeat recovery).
  when: not (cm_api_health_ok | default(false) | bool)

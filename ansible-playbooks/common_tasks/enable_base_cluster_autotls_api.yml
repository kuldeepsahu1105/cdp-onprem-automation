---
# Enable CDP cluster-wide Auto-TLS (POST .../commands/configureAutoTlsServices).
# Requires CM-level generateCmca (play 27) first. Play 31 runs this after
# configureForKerberos/generateCredentials and before First Run or cluster start.
# Skips when GET .../isTlsEnabled is true.

- name: Read base cluster Auto-TLS enabled state
  ansible.builtin.uri:
    url: >-
      {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name }}/isTlsEnabled
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  register: base_cluster_is_tls_enabled
  changed_when: false
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Read HDFS TLS and secure DataNode configuration
  ansible.builtin.uri:
    url: >-
      {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
      }}/services/hdfs/config?view=full
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  register: base_cluster_hdfs_tls_config
  changed_when: false
  delegate_to: "{{ cm_cluster_module_delegate_to }}"
  when: base_cluster_install_services.hdfs | default(true) | bool

- name: Read HDFS role config groups before Auto-TLS
  ansible.builtin.uri:
    url: >-
      {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
      }}/services/hdfs/roleConfigGroups
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  register: base_cluster_hdfs_role_groups_before_tls
  changed_when: false
  delegate_to: "{{ cm_cluster_module_delegate_to }}"
  when: base_cluster_install_services.hdfs | default(true) | bool

- name: Resolve DataNode base role config group
  ansible.builtin.set_fact:
    base_cluster_hdfs_datanode_base_group: >-
      {{
        base_cluster_hdfs_role_groups_before_tls.json['items'] | default([])
        | selectattr('roleType', 'equalto', 'DATANODE')
        | selectattr('base', 'equalto', true)
        | map(attribute='name')
        | first
        | default('')
      }}
  when: base_cluster_install_services.hdfs | default(true) | bool

- name: Require DataNode base role config group before Auto-TLS
  ansible.builtin.assert:
    that:
      - base_cluster_hdfs_datanode_base_group | length > 0
    fail_msg: >-
      HDFS has no DataNode base role config group. Refusing Auto-TLS and First
      Run because CM cannot validate the secure DataNode port tuple.
  when: base_cluster_install_services.hdfs | default(true) | bool

- name: Read DataNode ports before Auto-TLS
  ansible.builtin.uri:
    url: >-
      {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
      }}/services/hdfs/roleConfigGroups/{{ base_cluster_hdfs_datanode_base_group
      }}/config?view=full
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  register: base_cluster_hdfs_datanode_config_before_tls
  changed_when: false
  delegate_to: "{{ cm_cluster_module_delegate_to }}"
  when:
    - base_cluster_install_services.hdfs | default(true) | bool
    - base_cluster_hdfs_datanode_base_group | length > 0

- name: Resolve base cluster Auto-TLS enabled flag
  ansible.builtin.set_fact:
    base_cluster_tls_already_enabled: >-
      {{
        (
          base_cluster_is_tls_enabled.json
          if (base_cluster_is_tls_enabled.json is boolean)
          else (base_cluster_is_tls_enabled.json | default(false) | bool)
        )
        and (
          not (base_cluster_install_services.hdfs | default(true) | bool)
          or (
            (
              base_cluster_hdfs_tls_config.json['items'] | default([])
              | selectattr('name', 'equalto', 'hdfs_hadoop_ssl_enabled')
              | map(attribute='value')
              | first
              | default(false, true)
              | bool
            )
            and (
              base_cluster_hdfs_tls_config.json['items'] | default([])
              | selectattr('name', 'equalto', 'dfs_data_transfer_protection')
              | map(attribute='value')
              | first
              | default('', true)
              | lower
              in ['authentication', 'integrity', 'privacy']
            )
            and (
              base_cluster_hdfs_datanode_config_before_tls.json['items'] | default([])
              | selectattr('name', 'equalto', 'dfs_datanode_port')
              | map(attribute='value')
              | first
              | default(
                  (
                    base_cluster_hdfs_datanode_config_before_tls.json['items'] | default([])
                    | selectattr('name', 'equalto', 'dfs_datanode_port')
                    | map(attribute='default')
                    | first
                  ),
                  true
                )
              | default(0, true)
              | int
              >= 1024
            )
            and (
              base_cluster_hdfs_datanode_config_before_tls.json['items'] | default([])
              | selectattr('name', 'equalto', 'dfs_datanode_https_port')
              | map(attribute='value')
              | first
              | default(
                  (
                    base_cluster_hdfs_datanode_config_before_tls.json['items'] | default([])
                    | selectattr('name', 'equalto', 'dfs_datanode_https_port')
                    | map(attribute='default')
                    | first
                  ),
                  true
                )
              | default(0, true)
              | int
              >= 1024
            )
          )
        )
      }}

- name: Show base cluster Auto-TLS state
  ansible.builtin.debug:
    msg: >-
      Cluster {{ cdh_basecluster_name }} isTlsEnabled={{
      base_cluster_is_tls_enabled.json | default(false) }}, complete HDFS secure
      DataNode TLS={{ base_cluster_tls_already_enabled | default(false) }}
      (CM Auto-TLS configured={{ cm_autotls_api_enabled | default(false) }}).

- name: Require CM Auto-TLS before enabling cluster services TLS
  ansible.builtin.assert:
    that:
      - cm_autotls_api_enabled | default(false) | bool
    fail_msg: >-
      base_cluster_enable_autotls is true but Cloudera Manager does not report Auto-TLS
      (AUTO_TLS_TYPE). Run 27_setup_cm_autotls.yml and the CM_TLS_KRB_LDAP phase before
      playbook 31.
  when:
    - not (base_cluster_tls_already_enabled | default(false) | bool)

- name: Submit configureAutoTlsServices for base cluster
  ansible.builtin.uri:
    url: >-
      {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
      }}/commands/configureAutoTlsServices
    method: POST
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  register: base_cluster_configure_autotls_services
  delegate_to: "{{ cm_cluster_module_delegate_to }}"
  when: not (base_cluster_tls_already_enabled | default(false) | bool)

- name: Wait for configureAutoTlsServices command
  ansible.builtin.include_tasks: wait_cm_api_command.yml
  vars:
    cm_krb_api_url: "{{ cm_cluster_module_api_url }}"
    cm_api_command_id: "{{ base_cluster_configure_autotls_services.json.id }}"
    cm_api_command_allow_already_exists: false
  when:
    - base_cluster_configure_autotls_services is defined
    - base_cluster_configure_autotls_services.json.id is defined

- name: Record cluster Auto-TLS enablement this run
  ansible.builtin.set_fact:
    base_cluster_cluster_autotls_applied_this_run: true
  when:
    - base_cluster_configure_autotls_services is defined
    - base_cluster_configure_autotls_services.json.id is defined

- name: Read final HDFS secure DataNode configuration
  ansible.builtin.uri:
    url: >-
      {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
      }}/services/hdfs/config?view=full
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  register: base_cluster_final_hdfs_tls_config
  changed_when: false
  delegate_to: "{{ cm_cluster_module_delegate_to }}"
  when: base_cluster_install_services.hdfs | default(true) | bool

- name: Read final DataNode port configuration
  ansible.builtin.uri:
    url: >-
      {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
      }}/services/hdfs/roleConfigGroups/{{ base_cluster_hdfs_datanode_base_group
      }}/config?view=full
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  register: base_cluster_final_hdfs_datanode_config
  changed_when: false
  delegate_to: "{{ cm_cluster_module_delegate_to }}"
  when:
    - base_cluster_install_services.hdfs | default(true) | bool
    - base_cluster_hdfs_datanode_base_group | length > 0

- name: Require valid secure DataNode TLS configuration
  ansible.builtin.assert:
    that:
      - >-
        (
          base_cluster_final_hdfs_tls_config.json['items'] | default([])
          | selectattr('name', 'equalto', 'hdfs_hadoop_ssl_enabled')
          | map(attribute='value')
          | first
          | default(false, true)
          | bool
        )
      - >-
        (
          base_cluster_final_hdfs_tls_config.json['items'] | default([])
          | selectattr('name', 'equalto', 'dfs_data_transfer_protection')
          | map(attribute='value')
          | first
          | default('', true)
          | lower
        ) in ['authentication', 'integrity', 'privacy']
      - >-
        (
          base_cluster_final_hdfs_datanode_config.json['items'] | default([])
          | selectattr('name', 'equalto', 'dfs_datanode_port')
          | map(attribute='value')
          | first
          | default(
              (
                base_cluster_final_hdfs_datanode_config.json['items'] | default([])
                | selectattr('name', 'equalto', 'dfs_datanode_port')
                | map(attribute='default')
                | first
              ),
              true
            )
          | default(0, true)
          | int
        ) >= 1024
      - >-
        (
          base_cluster_final_hdfs_datanode_config.json['items'] | default([])
          | selectattr('name', 'equalto', 'dfs_datanode_https_port')
          | map(attribute='value')
          | first
          | default(
              (
                base_cluster_final_hdfs_datanode_config.json['items'] | default([])
                | selectattr('name', 'equalto', 'dfs_datanode_https_port')
                | map(attribute='default')
                | first
              ),
              true
            )
          | default(0, true)
          | int
        ) >= 1024
    fail_msg: >-
      HDFS secure DataNode mode is incomplete after configureAutoTlsServices.
      Refusing First Run until Hadoop TLS is enabled and Data Transfer
      Protection is set, with DataNode transceiver and HTTPS ports >= 1024.
  when: base_cluster_install_services.hdfs | default(true) | bool

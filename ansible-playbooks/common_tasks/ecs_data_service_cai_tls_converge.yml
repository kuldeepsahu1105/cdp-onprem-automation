---
- name: CAI TLS | Resolve deterministic hostname and certificate provider
  ansible.builtin.set_fact:
    ecs_cai_expected_base_hostname: >-
      {{ ecs_cai_static_subdomain | lower }}.{{ ecs_app_domain | lower }}
    ecs_cai_workbench_hostname: >-
      {{ ecs_cai_static_subdomain | lower }}.{{ ecs_app_domain | lower }}
    ecs_cai_tls_provider_effective: >-
      {{
        'freeipa'
        if groups.get('ipaserver', []) | length > 0
        else 'external'
      }}

- name: CAI TLS | Validate deterministic hostname and external input pairing
  ansible.builtin.assert:
    that:
      - ecs_cai_static_subdomain | length > 0
      - ecs_cai_static_subdomain is match('^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$')
      - ecs_cai_tls_minimum_validity_seconds | int > 0
      - >-
        (ecs_cai_tls_certificate_path | default('') | length > 0)
        == (ecs_cai_tls_private_key_path | default('') | length > 0)
    fail_msg: >-
      CAI TLS configuration is invalid. ecs_cai_static_subdomain must be one
      DNS label, minimum validity must be positive, and external certificate
      and private-key paths must be configured together.

- name: CAI TLS | Preserve adopted workspace endpoint contract
  ansible.builtin.assert:
    that:
      - >-
        (
          ecs_cai_existing_workspace.instanceUrl
          | default('')
          | regex_replace('^https?://', '')
          | regex_replace('/.*$', '')
          | regex_replace(':.*$', '')
          | lower
        )
        == (ecs_cai_expected_base_hostname | lower)
    fail_msg: >-
      Existing CAI workspace {{ ecs_cai_workspace_name }} uses endpoint
      {{ ecs_cai_existing_workspace.instanceUrl }}, but deterministic
      pre-create TLS is configured for {{ ecs_cai_expected_base_hostname }}.
      Refusing to replace the existing workspace secret with a certificate for
      another hostname. Set ecs_cai_static_subdomain to the existing endpoint
      label and rerun.
  when:
    - ecs_cai_existing_workspace | default({}) | length > 0
    - ecs_cai_existing_workspace.instanceUrl | default('') | length > 0

- name: CAI TLS | Ensure Kubernetes Python client is installed on ECS master
  ansible.builtin.pip:
    name: kubernetes
    state: present
  become: true
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh

- name: CAI TLS | Ensure workspace namespace exists before createWorkspace
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ ecs_coredns_kubeconfig_path }}"
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ ecs_cai_k8s_namespace }}"
  become: true
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh

- name: CAI TLS | Read existing TLS secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ ecs_cai_k8s_namespace }}"
    name: "{{ ecs_cai_tls_secret_name }}"
    kubeconfig: "{{ ecs_coredns_kubeconfig_path }}"
  register: ecs_cai_existing_tls_secret
  become: true
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  no_log: true

- name: CAI TLS | Read FreeIPA trust anchor
  ansible.builtin.slurp:
    src: /etc/ipa/ca.crt
  register: ecs_cai_freeipa_ca
  delegate_to: "{{ groups.get('ipaserver', []) | first }}"
  become: true
  when: ecs_cai_tls_provider_effective == 'freeipa'
  no_log: true

- name: CAI TLS | Require external trust anchor when FreeIPA is unavailable
  ansible.builtin.assert:
    that:
      - ecs_cai_tls_ca_bundle_path | default('') | length > 0
      - lookup('ansible.builtin.fileglob', ecs_cai_tls_ca_bundle_path) | length > 0
    fail_msg: >-
      CAI TLS requires a trusted certificate before createWorkspace. No
      FreeIPA server is present, so configure ecs_cai_tls_ca_bundle_path and
      either provide ecs_cai_tls_certificate_path plus
      ecs_cai_tls_private_key_path or pre-create a valid
      {{ ecs_cai_tls_secret_name }} secret in namespace
      {{ ecs_cai_k8s_namespace }}. AD and identity-provider-free deployments
      must use their externally managed PKI; automation never creates a
      temporary or self-signed certificate.
  when: ecs_cai_tls_provider_effective == 'external'

- name: CAI TLS | Create remote validation directory
  ansible.builtin.tempfile:
    state: directory
    prefix: cai_tls_
  register: ecs_cai_tls_validation_dir
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh

- name: CAI TLS | Stage trust anchor for validation
  ansible.builtin.copy:
    dest: "{{ ecs_cai_tls_validation_dir.path }}/ca.pem"
    mode: "0600"
    content: >-
      {{
        (ecs_cai_freeipa_ca.content | b64decode)
        if ecs_cai_tls_provider_effective == 'freeipa'
        else lookup('ansible.builtin.file', ecs_cai_tls_ca_bundle_path)
      }}
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  no_log: true

- name: CAI TLS | Stage existing secret for validation
  ansible.builtin.copy:
    dest: "{{ ecs_cai_tls_validation_dir.path }}/{{ item.name }}"
    mode: "0600"
    content: "{{ item.content | b64decode }}"
  loop:
    - name: tls.crt
      content: >-
        {{
          (
            (
              ecs_cai_existing_tls_secret.resources | default([])
              | first | default({})
            ).data | default({})
          )['tls.crt'] | default('')
        }}
    - name: tls.key
      content: >-
        {{
          (
            (
              ecs_cai_existing_tls_secret.resources | default([])
              | first | default({})
            ).data | default({})
          )['tls.key'] | default('')
        }}
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when:
    - ecs_cai_existing_tls_secret.resources | default([]) | length > 0
    - >-
      (
        ecs_cai_existing_tls_secret.resources | first
      ).type | default('') == 'kubernetes.io/tls'
  no_log: true

- name: CAI TLS | Validate existing secret certificate, key, hostname, and trust
  ansible.builtin.command:
    argv:
      - bash
      - -c
      - |
        set -euo pipefail
        cert=$1
        key=$2
        ca=$3
        host=$4
        validity=$5
        test -s "$cert"
        test -s "$key"
        openssl x509 -in "$cert" -noout -checkend "$validity"
        openssl x509 -in "$cert" -noout -checkhost "$host"
        openssl x509 -in "$cert" -noout -checkhost "probe.$host"
        test \
          "$(openssl x509 -in "$cert" -noout -subject -nameopt RFC2253)" != \
          "$(openssl x509 -in "$cert" -noout -issuer -nameopt RFC2253 | sed 's/^issuer=/subject=/')"
        openssl verify -CAfile "$ca" "$cert"
        test \
          "$(openssl x509 -in "$cert" -pubkey -noout | openssl pkey -pubin -outform DER | openssl sha256)" = \
          "$(openssl pkey -in "$key" -pubout -outform DER | openssl sha256)"
      - cai-tls-validate
      - "{{ ecs_cai_tls_validation_dir.path }}/tls.crt"
      - "{{ ecs_cai_tls_validation_dir.path }}/tls.key"
      - "{{ ecs_cai_tls_validation_dir.path }}/ca.pem"
      - "{{ ecs_cai_expected_base_hostname }}"
      - "{{ ecs_cai_tls_minimum_validity_seconds | int | string }}"
  register: ecs_cai_existing_tls_validation
  changed_when: false
  failed_when: false
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when:
    - ecs_cai_existing_tls_secret.resources | default([]) | length > 0
    - >-
      (
        ecs_cai_existing_tls_secret.resources | first
      ).type | default('') == 'kubernetes.io/tls'
  no_log: true

- name: CAI TLS | Record whether the existing secret is reusable
  ansible.builtin.set_fact:
    ecs_cai_existing_tls_secret_valid: >-
      {{
        ecs_cai_existing_tls_secret.resources | default([]) | length > 0
        and (
          ecs_cai_existing_tls_secret.resources | first
        ).type | default('') == 'kubernetes.io/tls'
        and ecs_cai_existing_tls_validation.rc | default(1) == 0
      }}

- name: CAI TLS | Reconcile FreeIPA certificate when existing secret is invalid
  when:
    - not (ecs_cai_existing_tls_secret_valid | bool)
    - ecs_cai_tls_provider_effective == 'freeipa'
  block:
    - name: CAI TLS | Ensure FreeIPA wildcard certificate profile
      ansible.builtin.include_role:
        name: cloudera.exe.freeipa_server_wildcard_profile
        apply:
          delegate_to: "{{ groups.get('ipaserver', []) | first }}"
          become: true
          connection: ssh
      vars:
        freeipa_wildcard_profile_name: "{{ ecs_cai_wildcard_cert_profile }}"

    - name: CAI TLS | Issue deterministic workbench wildcard certificate
      ansible.builtin.include_role:
        name: cloudera.exe.freeipa_server_unenrolled_tls
        apply:
          delegate_to: "{{ groups.get('ipaserver', []) | first }}"
          become: true
          connection: ssh
      vars:
        unenrolled_hostname: "{{ ecs_cai_expected_base_hostname }}"
        unenrolled_description: "Cloudera AI workbench wildcard certificate"
        unenrolled_cert_profile: "{{ ecs_cai_wildcard_cert_profile }}"

    - name: CAI TLS | Install FreeIPA-issued TLS secret
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ ecs_coredns_kubeconfig_path }}"
        namespace: "{{ ecs_cai_k8s_namespace }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ ecs_cai_tls_secret_name }}"
          type: kubernetes.io/tls
          data:
            tls.crt: "{{ lookup('ansible.builtin.file', ecs_cai_expected_base_hostname + '.crt') | b64encode }}"
            tls.key: "{{ lookup('ansible.builtin.file', ecs_cai_expected_base_hostname + '.pem') | b64encode }}"
      become: true
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      no_log: true

- name: CAI TLS | Require explicit external certificate material when secret is invalid
  ansible.builtin.assert:
    that:
      - ecs_cai_tls_certificate_path | default('') | length > 0
      - ecs_cai_tls_private_key_path | default('') | length > 0
      - lookup('ansible.builtin.fileglob', ecs_cai_tls_certificate_path) | length > 0
      - lookup('ansible.builtin.fileglob', ecs_cai_tls_private_key_path) | length > 0
    fail_msg: >-
      Existing {{ ecs_cai_tls_secret_name }} is absent or invalid for
      {{ ecs_cai_expected_base_hostname }}. Configure trusted external
      ecs_cai_tls_certificate_path, ecs_cai_tls_private_key_path, and
      ecs_cai_tls_ca_bundle_path before creating CAI. No workspace request was
      submitted and no temporary/self-signed certificate was created.
  when:
    - not (ecs_cai_existing_tls_secret_valid | bool)
    - ecs_cai_tls_provider_effective == 'external'

- name: CAI TLS | Install externally managed TLS secret when required
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ ecs_coredns_kubeconfig_path }}"
    namespace: "{{ ecs_cai_k8s_namespace }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ ecs_cai_tls_secret_name }}"
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ lookup('ansible.builtin.file', ecs_cai_tls_certificate_path) | b64encode }}"
        tls.key: "{{ lookup('ansible.builtin.file', ecs_cai_tls_private_key_path) | b64encode }}"
  become: true
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when:
    - not (ecs_cai_existing_tls_secret_valid | bool)
    - ecs_cai_tls_provider_effective == 'external'
  no_log: true

- name: CAI TLS | Read converged TLS secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ ecs_cai_k8s_namespace }}"
    name: "{{ ecs_cai_tls_secret_name }}"
    kubeconfig: "{{ ecs_coredns_kubeconfig_path }}"
  register: ecs_cai_converged_tls_secret
  become: true
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  no_log: true

- name: CAI TLS | Stage converged secret for final validation
  ansible.builtin.copy:
    dest: "{{ ecs_cai_tls_validation_dir.path }}/{{ item.name }}"
    mode: "0600"
    content: "{{ item.content | b64decode }}"
  loop:
    - name: tls.crt
      content: >-
        {{
          (
            (
              ecs_cai_converged_tls_secret.resources | default([])
              | first | default({})
            ).data | default({})
          )['tls.crt'] | default('')
        }}
    - name: tls.key
      content: >-
        {{
          (
            (
              ecs_cai_converged_tls_secret.resources | default([])
              | first | default({})
            ).data | default({})
          )['tls.key'] | default('')
        }}
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  no_log: true

- name: CAI TLS | Validate converged secret before createWorkspace
  ansible.builtin.command:
    argv:
      - bash
      - -c
      - |
        set -euo pipefail
        cert=$1
        key=$2
        ca=$3
        host=$4
        validity=$5
        test -s "$cert"
        test -s "$key"
        openssl x509 -in "$cert" -noout -checkend "$validity"
        openssl x509 -in "$cert" -noout -checkhost "$host"
        openssl x509 -in "$cert" -noout -checkhost "probe.$host"
        test \
          "$(openssl x509 -in "$cert" -noout -subject -nameopt RFC2253)" != \
          "$(openssl x509 -in "$cert" -noout -issuer -nameopt RFC2253 | sed 's/^issuer=/subject=/')"
        openssl verify -CAfile "$ca" "$cert"
        test \
          "$(openssl x509 -in "$cert" -pubkey -noout | openssl pkey -pubin -outform DER | openssl sha256)" = \
          "$(openssl pkey -in "$key" -pubout -outform DER | openssl sha256)"
      - cai-tls-validate
      - "{{ ecs_cai_tls_validation_dir.path }}/tls.crt"
      - "{{ ecs_cai_tls_validation_dir.path }}/tls.key"
      - "{{ ecs_cai_tls_validation_dir.path }}/ca.pem"
      - "{{ ecs_cai_expected_base_hostname }}"
      - "{{ ecs_cai_tls_minimum_validity_seconds | int | string }}"
  register: ecs_cai_converged_tls_validation
  changed_when: false
  failed_when: false
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  no_log: true

- name: CAI TLS | Gate workspace creation on validated trusted secret
  ansible.builtin.set_fact:
    ecs_cai_tls_secret_valid: >-
      {{
        ecs_cai_converged_tls_secret.resources | default([]) | length == 1
        and (
          ecs_cai_converged_tls_secret.resources | first
        ).type | default('') == 'kubernetes.io/tls'
        and ecs_cai_converged_tls_validation.rc | default(1) == 0
      }}

- name: CAI TLS | Require validated trusted secret
  ansible.builtin.assert:
    that:
      - ecs_cai_tls_secret_valid | bool
    fail_msg: >-
      Refusing CAI createWorkspace because {{ ecs_cai_tls_secret_name }} did
      not validate for {{ ecs_cai_expected_base_hostname }} and
      *.{{ ecs_cai_expected_base_hostname }} with a matching private key,
      configured trust anchor, and at least
      {{ ecs_cai_tls_minimum_validity_seconds }} seconds of remaining validity.

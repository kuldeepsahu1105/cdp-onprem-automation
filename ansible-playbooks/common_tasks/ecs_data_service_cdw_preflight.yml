---
- name: CDW | Check for an existing Data Warehouse cluster
  cloudera.cloud.dw_cluster_info:
    environment: "{{ ecs_cdp_environment_name }}"
    endpoint_tls: "{{ ecs_data_services_verify_tls | default(false) | bool }}"
  environment: "{{ ecs_cdp_cli_environment }}"
  register: ecs_cdw_preflight_cluster_info
  changed_when: false
  until: ecs_cdw_preflight_cluster_info is succeeded
  retries: "{{ ecs_data_services_dns_probe_attempts | default(3) | int }}"
  delay: "{{ ecs_data_services_dns_probe_retry_delay | int }}"
  vars:
    ansible_python_interpreter: "{{ hostvars['localhost'].ecs_data_services_remote_venv_path }}/bin/python"
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when: "'cdw' in (ecs_data_services_install_names | default([]))"

- name: CDW | Select deactivated cluster records
  ansible.builtin.set_fact:
    ecs_cdw_deactivated_clusters: >-
      {{
        ecs_cdw_preflight_cluster_info.clusters
        | default([])
        | selectattr('status', 'defined')
        | selectattr('status', 'search', '(?i)^deactivated$')
        | list
      }}
  when: "'cdw' in (ecs_data_services_install_names | default([]))"

- name: CDW | Refuse to mutate deactivated clusters
  ansible.builtin.assert:
    that:
      - ecs_cdw_deactivated_clusters | default([]) | length == 0
    fail_msg: >-
      An existing CDW cluster is Deactivated. The pinned cloudera.cloud
      dw_cluster module cannot reactivate an existing Deactivated cluster. In
      the observed UI failure, the cluster-specific t-shirt-sizes endpoint
      returned HTTP 404 (404 page not found / NOT_FOUND_ERROR), so the UI did
      not submit the activation POST. Automation will not activate, delete,
      recreate, or restart the cluster. Repair and use the supported DWX
      UI/backend activation path, activate the cluster manually, then rerun
      this playbook.
  when:
    - "'cdw' in (ecs_data_services_install_names | default([]))"

- name: CDW | Resolve effective Kerberos service hostname
  ansible.builtin.set_fact:
    ecs_cdw_kerberos_principal_hostname_effective: >-
      {{
        (
          ecs_cdw_private_cloud_config
          | default({})
        ).custom_kerberos_principal_hostname
        | default(
            'dwx-env-' + ecs_cdp_environment_name + '.cdp.local',
            true
          )
      }}
  when: "'cdw' in (ecs_data_services_install_names | default([]))"

- name: CDW | Require FreeIPA server for principal host preparation
  ansible.builtin.assert:
    that:
      - ipa_server_in_inventory | bool
      - ipaserver_inventory_host | default('') | length > 0
      - ecs_cdw_freeipa_keytab_admin_principal | default('') | length > 0
      - ecs_cdw_freeipa_keytab_admin_password | default('') | length > 0
    fail_msg: >-
      CDW FreeIPA principal-host preparation requires an ipaserver or
      ipa_server inventory host plus
      ecs_cdw_freeipa_keytab_admin_principal/password. Set
      ecs_cdw_ensure_freeipa_principal_host=false only when the complete host
      object and key initialization are managed externally.
  when:
    - "'cdw' in (ecs_data_services_install_names | default([]))"
    - identity_provider_effective | default('freeipa') == 'freeipa'
    - ecs_cdw_ensure_freeipa_principal_host | default(true) | bool

- name: CDW | Select terminal failed cluster records
  ansible.builtin.set_fact:
    ecs_cdw_failed_clusters: >-
      {{
        ecs_cdw_preflight_cluster_info.clusters
        | default([])
        | selectattr('status', 'defined')
        | selectattr('status', 'search', '(?i)(error|failed)$')
        | list
      }}
  when: "'cdw' in (ecs_data_services_install_names | default([]))"

- name: CDW | Refuse to mutate terminal failed clusters
  ansible.builtin.assert:
    that:
      - ecs_cdw_failed_clusters | default([]) | length == 0
    fail_msg: >-
      Existing CDW cluster records are terminally failed:
      {{ ecs_cdw_failed_clusters | default([]) | to_json }}. Automation will
      not delete or recreate failed clusters. Resolve or remove them through
      the supported control-plane workflow, then rerun.
  when:
    - "'cdw' in (ecs_data_services_install_names | default([]))"

- name: CDW | Ensure FreeIPA host principal prerequisite
  freeipa.ansible_freeipa.ipahost:
    ipaadmin_password: "{{ ipaadmin_password }}"
    ipaadmin_principal: "{{ ipaadmin_principal }}"
    name: "{{ ecs_cdw_kerberos_principal_hostname_effective }}"
    force: true
    state: present
  delegate_to: "{{ ipaserver_inventory_host }}"
  connection: ssh
  when:
    - "'cdw' in (ecs_data_services_install_names | default([]))"
    - identity_provider_effective | default('freeipa') == 'freeipa'
    - ipa_server_in_inventory | bool
    - ecs_cdw_ensure_freeipa_principal_host | default(true) | bool

- name: CDW | Resolve FreeIPA keytab administrator user
  ansible.builtin.set_fact:
    ecs_cdw_freeipa_keytab_admin_user: >-
      {{
        ecs_cdw_freeipa_keytab_admin_principal
        | regex_replace('/.*$', '')
        | regex_replace('@.*$', '')
      }}
  when:
    - "'cdw' in (ecs_data_services_install_names | default([]))"
    - identity_provider_effective | default('freeipa') == 'freeipa'
    - ipa_server_in_inventory | bool
    - ecs_cdw_ensure_freeipa_principal_host | default(true) | bool

- name: CDW | Allow administrator to initialize and retrieve host key
  freeipa.ansible_freeipa.ipahost:
    ipaadmin_password: "{{ ipaadmin_password }}"
    ipaadmin_principal: "{{ ipaadmin_principal }}"
    action: member
    name: "{{ ecs_cdw_kerberos_principal_hostname_effective }}"
    allow_create_keytab_user:
      - "{{ ecs_cdw_freeipa_keytab_admin_user }}"
    allow_retrieve_keytab_user:
      - "{{ ecs_cdw_freeipa_keytab_admin_user }}"
    state: present
  delegate_to: "{{ ipaserver_inventory_host }}"
  connection: ssh
  when:
    - "'cdw' in (ecs_data_services_install_names | default([]))"
    - identity_provider_effective | default('freeipa') == 'freeipa'
    - ipa_server_in_inventory | bool
    - ecs_cdw_ensure_freeipa_principal_host | default(true) | bool

- name: CDW | Obtain FreeIPA administrator ticket for host key inspection
  ansible.builtin.command:
    argv:
      - kinit
      - -c
      - "FILE:{{ ipa_kerberos_ccache_path }}"
      - "{{ ecs_cdw_freeipa_keytab_admin_principal }}"
    stdin: "{{ ecs_cdw_freeipa_keytab_admin_password }}"
  environment:
    KRB5CCNAME: "FILE:{{ ipa_kerberos_ccache_path }}"
  register: ecs_cdw_freeipa_kinit
  changed_when: false
  failed_when: false
  no_log: true
  delegate_to: "{{ ipaserver_inventory_host }}"
  connection: ssh
  when:
    - "'cdw' in (ecs_data_services_install_names | default([]))"
    - identity_provider_effective | default('freeipa') == 'freeipa'
    - ipa_server_in_inventory | bool
    - ecs_cdw_ensure_freeipa_principal_host | default(true) | bool

- name: CDW | Require FreeIPA administrator ticket
  ansible.builtin.assert:
    that:
      - ecs_cdw_freeipa_kinit.rc == 0
    fail_msg: >-
      FreeIPA Kerberos authentication for
      {{ ecs_cdw_freeipa_keytab_admin_principal }} failed on
      {{ ipaserver_inventory_host }} with rc
      {{ ecs_cdw_freeipa_kinit.rc }}:
      {{
        ecs_cdw_freeipa_kinit.stderr
        | default('')
        | regex_replace(
            '(?i)(password|secret|access[ _-]?key)(\\s*[=:]\\s*)\\S+',
            '\\1\\2<redacted>'
          )
        | trim
      }}
  when:
    - "'cdw' in (ecs_data_services_install_names | default([]))"
    - identity_provider_effective | default('freeipa') == 'freeipa'
    - ipa_server_in_inventory | bool
    - ecs_cdw_ensure_freeipa_principal_host | default(true) | bool

- name: CDW | Inspect FreeIPA host key state
  ansible.builtin.command:
    argv:
      - ipa
      - host-show
      - "{{ ecs_cdw_kerberos_principal_hostname_effective }}"
      - --all
      - --raw
  environment:
    KRB5CCNAME: "FILE:{{ ipa_kerberos_ccache_path }}"
  register: ecs_cdw_freeipa_host_show_before
  changed_when: false
  delegate_to: "{{ ipaserver_inventory_host }}"
  connection: ssh
  when:
    - "'cdw' in (ecs_data_services_install_names | default([]))"
    - identity_provider_effective | default('freeipa') == 'freeipa'
    - ipa_server_in_inventory | bool
    - ecs_cdw_ensure_freeipa_principal_host | default(true) | bool

- name: CDW | Resolve whether FreeIPA host key is initialized
  ansible.builtin.set_fact:
    ecs_cdw_freeipa_host_has_keytab_before: >-
      {{
        (
          ecs_cdw_freeipa_host_show_before.stdout
          | regex_search(
              '(?im)^\\s*(?:has_keytab|Keytab):\\s*(?:TRUE|True)\\s*$'
            )
        )
        is not none
      }}
  when:
    - ecs_cdw_freeipa_host_show_before is not skipped

- name: CDW | Require readable FreeIPA host key state
  ansible.builtin.assert:
    that:
      - >-
        (
          ecs_cdw_freeipa_host_show_before.stdout
          | regex_search(
              '(?im)^\\s*(?:has_keytab|Keytab):\\s*'
              + '(?:TRUE|FALSE|True|False)\\s*$'
            )
        )
        is not none
    fail_msg: >-
      FreeIPA did not report the keytab state for
      host/{{ ecs_cdw_kerberos_principal_hostname_effective }}.
      ipa host-show output:
      {{ ecs_cdw_freeipa_host_show_before.stdout | default('') }}
  when:
    - ecs_cdw_freeipa_host_show_before is not skipped

- name: CDW | Initialize missing FreeIPA host key exactly once
  when:
    - ecs_cdw_freeipa_host_has_keytab_before is defined
    - not (ecs_cdw_freeipa_host_has_keytab_before | bool)
  block:
    - name: CDW | Create temporary host keytab directory
      ansible.builtin.tempfile:
        state: directory
        prefix: ansible_cdw_host_keytab_
      register: ecs_cdw_freeipa_temporary_keytab_dir
      delegate_to: "{{ ipaserver_inventory_host }}"
      connection: ssh

    - name: CDW | Generate initial FreeIPA host key
      ansible.builtin.command:
        argv:
          - ipa-getkeytab
          - -p
          - >-
            host/{{ ecs_cdw_kerberos_principal_hostname_effective
            }}@{{ ipaserver_realm }}
          - -k
          - "{{ ecs_cdw_freeipa_temporary_keytab_dir.path }}/host.keytab"
      environment:
        KRB5CCNAME: "FILE:{{ ipa_kerberos_ccache_path }}"
      changed_when: true
      delegate_to: "{{ ipaserver_inventory_host }}"
      connection: ssh
  always:
    - name: CDW | Remove temporary host keytab directory
      ansible.builtin.file:
        path: "{{ ecs_cdw_freeipa_temporary_keytab_dir.path }}"
        state: absent
      delegate_to: "{{ ipaserver_inventory_host }}"
      connection: ssh
      when:
        - ecs_cdw_freeipa_temporary_keytab_dir is defined
        - ecs_cdw_freeipa_temporary_keytab_dir.path | default('') | length > 0

- name: CDW | Verify FreeIPA host key is initialized
  ansible.builtin.command:
    argv:
      - ipa
      - host-show
      - "{{ ecs_cdw_kerberos_principal_hostname_effective }}"
      - --all
      - --raw
  environment:
    KRB5CCNAME: "FILE:{{ ipa_kerberos_ccache_path }}"
  register: ecs_cdw_freeipa_host_show_after
  changed_when: false
  delegate_to: "{{ ipaserver_inventory_host }}"
  connection: ssh
  when:
    - "'cdw' in (ecs_data_services_install_names | default([]))"
    - identity_provider_effective | default('freeipa') == 'freeipa'
    - ipa_server_in_inventory | bool
    - ecs_cdw_ensure_freeipa_principal_host | default(true) | bool

- name: CDW | Require initialized FreeIPA host key
  ansible.builtin.assert:
    that:
      - >-
        (
          ecs_cdw_freeipa_host_show_after.stdout
          | regex_search(
              '(?im)^\\s*(?:has_keytab|Keytab):\\s*(?:TRUE|True)\\s*$'
            )
        )
        is not none
    fail_msg: >-
      FreeIPA host/{{ ecs_cdw_kerberos_principal_hostname_effective }}
      still reports Keytab: False after initialization.
  when:
    - ecs_cdw_freeipa_host_show_after is not skipped

- name: CDW | Resolve Hive service principal
  ansible.builtin.set_fact:
    ecs_cdw_hive_service_principal_effective: >-
      hive/{{ ecs_cdw_kerberos_principal_hostname_effective }}
  when:
    - "'cdw' in (ecs_data_services_install_names | default([]))"
    - identity_provider_effective | default('freeipa') == 'freeipa'
    - ipa_server_in_inventory | bool
    - ecs_cdw_ensure_freeipa_principal_host | default(true) | bool

- name: CDW | Ensure FreeIPA Hive service principal prerequisite
  freeipa.ansible_freeipa.ipaservice:
    ipaadmin_password: "{{ ipaadmin_password }}"
    ipaadmin_principal: "{{ ipaadmin_principal }}"
    name: "{{ ecs_cdw_hive_service_principal_effective }}"
    force: true
    state: present
  delegate_to: "{{ ipaserver_inventory_host }}"
  connection: ssh
  when:
    - ecs_cdw_hive_service_principal_effective is defined

- name: CDW | Allow administrator to initialize and retrieve Hive service key
  freeipa.ansible_freeipa.ipaservice:
    ipaadmin_password: "{{ ipaadmin_password }}"
    ipaadmin_principal: "{{ ipaadmin_principal }}"
    action: member
    name: "{{ ecs_cdw_hive_service_principal_effective }}"
    allow_create_keytab_user:
      - "{{ ecs_cdw_freeipa_keytab_admin_user }}"
    allow_retrieve_keytab_user:
      - "{{ ecs_cdw_freeipa_keytab_admin_user }}"
    state: present
  delegate_to: "{{ ipaserver_inventory_host }}"
  connection: ssh
  when:
    - ecs_cdw_hive_service_principal_effective is defined

- name: CDW | Inspect FreeIPA Hive service key state
  ansible.builtin.command:
    argv:
      - ipa
      - service-show
      - "{{ ecs_cdw_hive_service_principal_effective }}"
      - --all
      - --raw
  environment:
    KRB5CCNAME: "FILE:{{ ipa_kerberos_ccache_path }}"
  register: ecs_cdw_freeipa_hive_service_show_before
  changed_when: false
  delegate_to: "{{ ipaserver_inventory_host }}"
  connection: ssh
  when:
    - ecs_cdw_hive_service_principal_effective is defined

- name: CDW | Resolve whether FreeIPA Hive service key is initialized
  ansible.builtin.set_fact:
    ecs_cdw_freeipa_hive_service_has_keytab_before: >-
      {{
        (
          ecs_cdw_freeipa_hive_service_show_before.stdout
          | regex_search(
              '(?im)^\\s*(?:has_keytab|Keytab):\\s*(?:TRUE|True)\\s*$'
            )
        )
        is not none
      }}
  when:
    - ecs_cdw_freeipa_hive_service_show_before is not skipped

- name: CDW | Require readable FreeIPA Hive service key state
  ansible.builtin.assert:
    that:
      - >-
        (
          ecs_cdw_freeipa_hive_service_show_before.stdout
          | regex_search(
              '(?im)^\\s*(?:has_keytab|Keytab):\\s*'
              + '(?:TRUE|FALSE|True|False)\\s*$'
            )
        )
        is not none
    fail_msg: >-
      FreeIPA did not report the keytab state for
      {{ ecs_cdw_hive_service_principal_effective }}.
      ipa service-show output:
      {{ ecs_cdw_freeipa_hive_service_show_before.stdout | default('') }}
  when:
    - ecs_cdw_freeipa_hive_service_show_before is not skipped

- name: CDW | Initialize missing FreeIPA Hive service key exactly once
  when:
    - ecs_cdw_freeipa_hive_service_has_keytab_before is defined
    - not (ecs_cdw_freeipa_hive_service_has_keytab_before | bool)
  block:
    - name: CDW | Create temporary Hive service keytab directory
      ansible.builtin.tempfile:
        state: directory
        prefix: ansible_cdw_hive_keytab_
      register: ecs_cdw_freeipa_hive_temporary_keytab_dir
      delegate_to: "{{ ipaserver_inventory_host }}"
      connection: ssh

    - name: CDW | Generate initial FreeIPA Hive service key
      ansible.builtin.command:
        argv:
          - ipa-getkeytab
          - -p
          - >-
            {{ ecs_cdw_hive_service_principal_effective
            }}@{{ ipaserver_realm }}
          - -k
          - >-
            {{ ecs_cdw_freeipa_hive_temporary_keytab_dir.path
            }}/hive.keytab
      environment:
        KRB5CCNAME: "FILE:{{ ipa_kerberos_ccache_path }}"
      changed_when: true
      delegate_to: "{{ ipaserver_inventory_host }}"
      connection: ssh
  always:
    - name: CDW | Remove temporary Hive service keytab directory
      ansible.builtin.file:
        path: "{{ ecs_cdw_freeipa_hive_temporary_keytab_dir.path }}"
        state: absent
      delegate_to: "{{ ipaserver_inventory_host }}"
      connection: ssh
      when:
        - ecs_cdw_freeipa_hive_temporary_keytab_dir is defined
        - >-
          ecs_cdw_freeipa_hive_temporary_keytab_dir.path
          | default('')
          | length > 0

- name: CDW | Verify FreeIPA Hive service key is initialized
  ansible.builtin.command:
    argv:
      - ipa
      - service-show
      - "{{ ecs_cdw_hive_service_principal_effective }}"
      - --all
      - --raw
  environment:
    KRB5CCNAME: "FILE:{{ ipa_kerberos_ccache_path }}"
  register: ecs_cdw_freeipa_hive_service_show_after
  changed_when: false
  delegate_to: "{{ ipaserver_inventory_host }}"
  connection: ssh
  when:
    - ecs_cdw_hive_service_principal_effective is defined

- name: CDW | Require initialized FreeIPA Hive service key
  ansible.builtin.assert:
    that:
      - >-
        (
          ecs_cdw_freeipa_hive_service_show_after.stdout
          | regex_search(
              '(?im)^\\s*(?:has_keytab|Keytab):\\s*(?:TRUE|True)\\s*$'
            )
        )
        is not none
    fail_msg: >-
      FreeIPA {{ ecs_cdw_hive_service_principal_effective }} still reports
      Keytab: False after initialization.
  when:
    - ecs_cdw_freeipa_hive_service_show_after is not skipped

- name: CDW | Validate Hive principal ticket acquisition without rotating its key
  when:
    - ecs_cdw_hive_service_principal_effective is defined
  block:
    - name: CDW | Create temporary Hive principal validation directory
      ansible.builtin.tempfile:
        state: directory
        prefix: ansible_cdw_hive_validate_
      register: ecs_cdw_freeipa_hive_validation_dir
      delegate_to: "{{ ipaserver_inventory_host }}"
      connection: ssh

    - name: CDW | Retrieve the existing Hive service key for validation
      ansible.builtin.command:
        argv:
          - ipa-getkeytab
          - -r
          - -p
          - >-
            {{ ecs_cdw_hive_service_principal_effective
            }}@{{ ipaserver_realm }}
          - -k
          - "{{ ecs_cdw_freeipa_hive_validation_dir.path }}/hive.keytab"
      environment:
        KRB5CCNAME: "FILE:{{ ipa_kerberos_ccache_path }}"
      changed_when: false
      delegate_to: "{{ ipaserver_inventory_host }}"
      connection: ssh

    - name: CDW | Acquire a Kerberos ticket with the Hive service key
      ansible.builtin.command:
        argv:
          - kinit
          - -c
          - "FILE:{{ ecs_cdw_freeipa_hive_validation_dir.path }}/hive.ccache"
          - -kt
          - "{{ ecs_cdw_freeipa_hive_validation_dir.path }}/hive.keytab"
          - >-
            {{ ecs_cdw_hive_service_principal_effective
            }}@{{ ipaserver_realm }}
      changed_when: false
      delegate_to: "{{ ipaserver_inventory_host }}"
      connection: ssh

    - name: CDW | Require a valid Hive service Kerberos ticket
      ansible.builtin.command:
        argv:
          - klist
          - -s
          - -c
          - "FILE:{{ ecs_cdw_freeipa_hive_validation_dir.path }}/hive.ccache"
      changed_when: false
      delegate_to: "{{ ipaserver_inventory_host }}"
      connection: ssh
  always:
    - name: CDW | Remove temporary Hive principal validation directory
      ansible.builtin.file:
        path: "{{ ecs_cdw_freeipa_hive_validation_dir.path }}"
        state: absent
      delegate_to: "{{ ipaserver_inventory_host }}"
      connection: ssh
      when:
        - ecs_cdw_freeipa_hive_validation_dir is defined
        - ecs_cdw_freeipa_hive_validation_dir.path | default('') | length > 0

---
# Single source of truth: scripts/lib/ansible_env.sh (pvc_setup, clone wrapper, Jenkins, manual playbooks).
- name: Ensure Ansible collections (shared control-node helper)
  ansible.builtin.command:
    cmd: >-
      bash -lc 'source "{{ playbook_dir }}/../scripts/lib/ansible_env.sh"
      && ansible_install_collections_if_needed "{{ playbook_dir }}/requirements.yml"'
    chdir: "{{ playbook_dir }}"
  register: galaxy_ensure
  changed_when: "'Installing Ansible collections' in (galaxy_ensure.stdout | default(''))"
  failed_when: galaxy_ensure.rc != 0

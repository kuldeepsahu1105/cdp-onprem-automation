---
# Idempotent Galaxy install for manual playbook runs (pvc_setup.sh skips when already satisfied).
- name: Install Ansible collections from requirements.yml
  ansible.builtin.command:
    cmd: ansible-galaxy collection install -r requirements.yml
    chdir: "{{ playbook_dir }}"
  register: galaxy_requirements_install
  changed_when: >-
    'Installing' in (galaxy_requirements_install.stdout | default(''))
    or 'Installed' in (galaxy_requirements_install.stdout | default(''))
    or ' upgraded ' in (galaxy_requirements_install.stdout | default(''))
  failed_when: galaxy_requirements_install.rc != 0

---
# Re-render portal index, Caddy, pgAdmin, and optional monitoring from deployment_portal_context.
# Requires deployment_portal_context (and related facts) on the play host.

- name: Detect monitoring stack on portal ops host before Caddy/index render
  ansible.builtin.import_tasks: detect_deployment_portal_monitoring_on_host.yml

- name: Refresh portal context monitoring flags and endpoints after ops-host probe
  ansible.builtin.import_tasks: refresh_deployment_portal_monitoring_context.yml

- name: Create deployment portal directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ deployment_portal_config_dir }}"
    - "{{ deployment_portal_www_dir }}"
    - "{{ monitoring_config_dir }}"

- name: Sync operator credentials and SSH downloads to portal www
  ansible.builtin.import_tasks: sync_deployment_portal_operator_access.yml
  when: deployment_portal_expose_credentials | default(true) | bool

- name: Render deployment portal index page
  ansible.builtin.template:
    src: deployment_portal_index.html.j2
    dest: "{{ deployment_portal_www_dir }}/index.html"
    mode: "0644"

- name: Render deployment portal live stats JSON
  ansible.builtin.template:
    src: deployment_portal_live_stats.json.j2
    dest: "{{ deployment_portal_www_dir }}/live-stats.json"
    mode: "0644"

- name: Render pgAdmin server preset
  ansible.builtin.template:
    src: deployment_portal_pgadmin-servers.json.j2
    dest: "{{ deployment_portal_config_dir }}/pgadmin-servers.json"
    mode: "0644"
  register: pgadmin_servers_render

- name: Render Caddy configuration
  ansible.builtin.template:
    src: deployment_portal_Caddyfile.j2
    dest: "{{ deployment_portal_config_dir }}/Caddyfile"
    mode: "0644"
  register: caddyfile_render

- name: Configure FreeIPA HTTPD on ipaserver for deployment portal Caddy proxy
  ansible.builtin.import_tasks: configure_ipa_httpd_behind_caddy.yml
  delegate_to: "{{ groups['ipaserver'][0] }}"
  run_once: true
  when:
    - deployment_portal_has_ipa | default(false) | bool
    - groups.get('ipaserver', []) | length > 0
    - ipa_caddy_public_hostname | default('') | length > 0

- name: Validate pgAdmin default email (pgAdmin 8 rejects .local and non-TLD addresses)
  ansible.builtin.assert:
    that:
      - _pgadmin_default_email | length > 0
      - _pgadmin_default_email is match('^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$')
      - not (_pgadmin_default_email is search('\\.local$'))
    fail_msg: >-
      pgadmin_default_email '{{ pgadmin_default_email }}' is not accepted by pgAdmin 8 (PGADMIN_DEFAULT_EMAIL).
      Use a lab address with a real TLD (default admin@{{ caddy_vhost_public_base }}), not admin@<cluster_domain> when the domain is .local.
  vars:
    _pgadmin_default_email: "{{ pgadmin_default_email | trim }}"

- name: Render deployment portal Docker Compose environment file
  ansible.builtin.template:
    src: deployment_portal_docker-compose.env.j2
    dest: "{{ deployment_portal_config_dir }}/.env"
    mode: "0600"
  register: portal_env_render

- name: Render deployment portal Docker Compose file
  ansible.builtin.template:
    src: deployment_portal_docker-compose.yml.j2
    dest: "{{ deployment_portal_config_dir }}/docker-compose.yml"
    mode: "0644"
  register: portal_compose_render

- name: Validate Caddyfile before compose up
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - -v
      - "{{ deployment_portal_config_dir }}/Caddyfile:/etc/caddy/Caddyfile:ro,z"
      - "{{ deployment_portal_caddy_image }}"
      - caddy
      - validate
      - --config
      - /etc/caddy/Caddyfile
      - --adapter
      - caddyfile
  register: caddy_validate_pre_up
  changed_when: false

- name: Fail when rendered Caddyfile is invalid
  ansible.builtin.fail:
    msg: >-
      Caddyfile failed validation on {{ inventory_hostname }} before docker compose up.
      Check caddy_vhost facts (ops public/private IP) and monitoring routes.
      {{ caddy_validate_pre_up.stderr | default('') | trim }}
  when: caddy_validate_pre_up.rc != 0

- name: Ensure deployment portal stack is running
  ansible.builtin.command:
    argv: >-
      {{
        deployment_portal_compose_argv
        + ['-f', deployment_portal_config_dir ~ '/docker-compose.yml', 'up', '-d', '--remove-orphans']
      }}
  register: portal_compose_up
  failed_when: portal_compose_up.rc != 0
  changed_when: >-
    'Creating' in (portal_compose_up.stdout ~ portal_compose_up.stderr)
    or 'Starting' in (portal_compose_up.stdout ~ portal_compose_up.stderr)
    or 'Recreating' in (portal_compose_up.stdout ~ portal_compose_up.stderr)

- name: Recreate Caddy when Caddyfile changed
  ansible.builtin.command:
    argv: >-
      {{
        deployment_portal_compose_argv
        + ['-f', deployment_portal_config_dir ~ '/docker-compose.yml', 'up', '-d', '--force-recreate', 'caddy']
      }}
  when: caddyfile_render is changed
  register: caddy_recreate
  failed_when: caddy_recreate.rc != 0

- name: Recreate Caddy when compose file changed
  ansible.builtin.command:
    argv: >-
      {{
        deployment_portal_compose_argv
        + ['-f', deployment_portal_config_dir ~ '/docker-compose.yml', 'up', '-d', '--force-recreate', 'caddy']
      }}
  when:
    - portal_compose_render is changed or portal_env_render is changed
    - not (caddyfile_render is changed)
  register: caddy_recreate_compose
  failed_when: caddy_recreate_compose.rc != 0

- name: Recreate pgAdmin when compose file changed (port publish / image)
  ansible.builtin.command:
    argv: >-
      {{
        deployment_portal_compose_argv
        + ['-f', deployment_portal_config_dir ~ '/docker-compose.yml', 'up', '-d', '--force-recreate', 'pgadmin']
      }}
  when: portal_compose_render is changed or portal_env_render is changed
  register: pgadmin_recreate_compose
  failed_when: pgadmin_recreate_compose.rc != 0

- name: Recreate pgAdmin when server preset changed
  ansible.builtin.command:
    argv: >-
      {{
        deployment_portal_compose_argv
        + ['-f', deployment_portal_config_dir ~ '/docker-compose.yml', 'up', '-d', '--force-recreate', 'pgadmin']
      }}
  when:
    - pgadmin_servers_render is changed
    - not (portal_compose_render is changed)
    - not (portal_env_render is changed)
  register: pgadmin_recreate_servers
  failed_when: pgadmin_recreate_servers.rc != 0

- name: Ensure portal and monitoring ports are allowed when firewalld is active
  ansible.builtin.import_tasks: ensure_deployment_portal_firewall_ports.yml

- name: Sync monitoring stack configuration
  when: deployment_portal_monitoring_routes_enabled | default(false) | bool
  block:
    - name: Render Prometheus configuration
      ansible.builtin.template:
        src: monitoring_prometheus.yml.j2
        dest: "{{ monitoring_config_dir }}/prometheus.yml"
        mode: "0644"
      register: monitoring_prometheus_render

    - name: Render Alertmanager configuration
      ansible.builtin.template:
        src: monitoring_alertmanager.yml.j2
        dest: "{{ monitoring_config_dir }}/alertmanager.yml"
        mode: "0644"
      register: monitoring_alertmanager_render

    - name: Render monitoring Docker Compose environment file
      ansible.builtin.template:
        src: monitoring_docker-compose.env.j2
        dest: "{{ monitoring_config_dir }}/.env"
        mode: "0600"
      register: monitoring_env_render

    - name: Render monitoring Docker Compose file
      ansible.builtin.template:
        src: monitoring_docker-compose.yml.j2
        dest: "{{ monitoring_config_dir }}/docker-compose.yml"
        mode: "0644"
      register: monitoring_compose_render

    - name: Force-recreate monitoring containers when rendered config changed
      ansible.builtin.command:
        argv: >-
          {{
            deployment_portal_compose_argv
            + ['-f', monitoring_config_dir ~ '/docker-compose.yml', 'up', '-d', '--force-recreate', '--remove-orphans']
          }}
      when: >-
        monitoring_compose_render is changed
        or monitoring_env_render is changed
        or monitoring_prometheus_render is changed
        or monitoring_alertmanager_render is changed
      register: monitoring_stack_force_recreate
      failed_when: monitoring_stack_force_recreate.rc != 0
      changed_when: true

    - name: Ensure monitoring stack is running
      ansible.builtin.command:
        argv: >-
          {{
            deployment_portal_compose_argv
            + ['-f', monitoring_config_dir ~ '/docker-compose.yml', 'up', '-d', '--remove-orphans']
          }}
      when: >-
        not (monitoring_compose_render is changed)
        and not (monitoring_env_render is changed)
        and not (monitoring_prometheus_render is changed)
        and not (monitoring_alertmanager_render is changed)
      register: monitoring_compose_up
      changed_when: >-
        'Creating' in monitoring_compose_up.stdout
        or 'Starting' in monitoring_compose_up.stdout

    - name: Re-render Caddy with monitoring routes after monitoring sync
      ansible.builtin.template:
        src: deployment_portal_Caddyfile.j2
        dest: "{{ deployment_portal_config_dir }}/Caddyfile"
        mode: "0644"
      register: caddyfile_after_monitoring

    - name: Recreate Caddy after monitoring route update
      ansible.builtin.command:
        argv: >-
          {{
            deployment_portal_compose_argv
            + ['-f', deployment_portal_config_dir ~ '/docker-compose.yml', 'up', '-d', '--force-recreate', 'caddy']
          }}
      when: caddyfile_after_monitoring is changed
      register: caddy_recreate_after_monitoring
      failed_when: caddy_recreate_after_monitoring.rc != 0

    - name: Refresh deployment index after monitoring sync
      ansible.builtin.template:
        src: deployment_portal_index.html.j2
        dest: "{{ deployment_portal_www_dir }}/index.html"
        mode: "0644"

    - name: Refresh deployment portal live stats JSON after monitoring sync
      ansible.builtin.template:
        src: deployment_portal_live_stats.json.j2
        dest: "{{ deployment_portal_www_dir }}/live-stats.json"
        mode: "0644"

- name: Verify monitoring UIs via Caddy path routes (monitoring milestone)
  ansible.builtin.import_tasks: verify_deployment_portal_monitoring.yml
  when: deployment_portal_monitoring_routes_enabled | default(false) | bool

- name: Verify Caddy container and portal or monitoring URLs (after stacks are up)
  ansible.builtin.import_tasks: verify_deployment_portal_caddy.yml

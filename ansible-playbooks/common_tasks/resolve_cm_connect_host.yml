---
# Pick a reachable address for CM API probes (avoids same-host public-EIP timeout on cldr-mngr).

- name: Resolve Cloudera Manager API connection address
  ansible.builtin.set_fact:
    cm_manager_host_inv: "{{ cm_manager_inventory_host }}"
    cm_host_public: >-
      {{
        cm_api_connect_host
        if (cm_api_connect_host | default('') | length > 0)
        else (
          hostvars[cm_manager_inventory_host].public_ip | default('')
          if (
            (hostvars[cm_manager_inventory_host].public_ip | default('') | length > 0)
            and not (
              hostvars[cm_manager_inventory_host].public_ip is match('^10\\.')
              or hostvars[cm_manager_inventory_host].public_ip is match('^192\\.168\\.')
              or hostvars[cm_manager_inventory_host].public_ip is match('^172\\.(1[6-9]|2[0-9]|3[0-1])\\.')
            )
          )
          else (
            hostvars[cm_manager_inventory_host].ansible_host | default(cm_manager_inventory_host)
            if not (
              (hostvars[cm_manager_inventory_host].ansible_host | default('')) is match('^10\\.')
              or (hostvars[cm_manager_inventory_host].ansible_host | default('')) is match('^192\\.168\\.')
              or (hostvars[cm_manager_inventory_host].ansible_host | default('')) is match('^172\\.(1[6-9]|2[0-9]|3[0-1])\\.')
            )
            else (
              hostvars[cm_manager_inventory_host].ec2_public_ip | default('')
              if (hostvars[cm_manager_inventory_host].ec2_public_ip | default('') | length > 0)
              else hostvars[cm_manager_inventory_host].ansible_host | default(cm_manager_inventory_host)
            )
          )
        )
      }}
    cm_host_private: "{{ hostvars[cm_manager_inventory_host].private_ip | default('') }}"
    cm_host_fqdn: >-
      {{ hostvars[cm_manager_inventory_host].cldr_hostname | default(cm_manager_inventory_host) }}.{{ cluster_domain }}

- name: Detect Ansible control reachability profile (public vs VPC-private)
  ansible.builtin.import_tasks: detect_ansible_control_reachability.yml

- name: Detect whether this play host is the CM manager
  ansible.builtin.set_fact:
    cm_api_runner_is_manager: >-
      {{
        inventory_hostname is defined
        and (inventory_hostname == cm_manager_inventory_host)
      }}
    cm_api_controller_is_localhost: >-
      {{
        (inventory_hostname | default('localhost')) in ['localhost', '127.0.0.1']
      }}
    cm_host_private_is_rfc1918: >-
      {{
        cm_host_private | length > 0
        and (
          cm_host_private is match('^10\\.')
          or cm_host_private is match('^192\\.168\\.')
          or cm_host_private is match('^172\\.(1[6-9]|2[0-9]|3[0-1])\\.')
        )
      }}

- name: Decide whether CM API must avoid VPC private addresses from this controller
  ansible.builtin.set_fact:
    cm_api_avoid_private_ip: >-
      {{
        (
          hostvars['localhost'].ansible_control_reach_public_only
          | default(ansible_control_reach_public_only | default(false))
          | bool
        )
        or (
          (cm_api_controller_is_localhost | bool)
          and (cm_host_private_is_rfc1918 | bool)
          and (cm_host_private | length > 0)
          and (cm_host_private != cm_host_public)
        )
      }}

- name: Set CM connect host for API probes (legacy cm_connect_host)
  ansible.builtin.set_fact:
    cm_connect_host: >-
      {{
        cm_api_connect_host
        if (cm_api_connect_host | default('') | length > 0)
        else (
          '127.0.0.1'
          if cm_api_runner_is_manager | bool
          else (
            cm_host_public
            if (cm_api_avoid_private_ip | bool)
            else (
              cm_host_private
              if (
                (cm_api_prefer_private_ip | default(true) | bool)
                and (cm_host_private | length > 0)
              )
              else cm_host_public
            )
          )
        )
      }}

- name: Test CM private IP reachability from Ansible controller
  ansible.builtin.wait_for:
    host: "{{ cm_host_private }}"
    port: "{{ cm_http_port }}"
    timeout: "{{ cm_api_private_reachability_timeout | default(5) | int }}"
    state: started
  register: cm_private_reach_test
  failed_when: false
  when:
    - not (cm_api_runner_is_manager | bool)
    - cm_api_connect_host | default('') | length == 0
    - not (cm_api_avoid_private_ip | bool)
    - cm_api_prefer_private_ip | default(true) | bool
    - cm_host_private | length > 0
    - cm_host_private != cm_host_public

- name: Set CM API client host (URL base for uri tasks on this play host)
  ansible.builtin.set_fact:
    cm_api_client_host: >-
      {{
        cm_api_connect_host
        if (cm_api_connect_host | default('') | length > 0)
        else (
          '127.0.0.1'
          if cm_api_runner_is_manager | bool
          else (
            cm_host_public
            if (cm_api_avoid_private_ip | bool)
            else (
              cm_host_private
              if (
                (cm_api_prefer_private_ip | default(true) | bool)
                and (cm_host_private | length > 0)
                and (
                  cm_host_private == cm_host_public
                  or (cm_private_reach_test is defined and cm_private_reach_test is succeeded)
                )
              )
              else cm_host_public
            )
          )
        )
      }}

- name: Decide whether CM API probes run on the public controller (Jenkins) vs cldr-mngr
  ansible.builtin.set_fact:
    cm_api_probe_from_controller_public: >-
      {{
        (cm_api_controller_is_localhost | bool)
        and not (cm_api_runner_is_manager | bool)
        and (
          (
            hostvars['localhost'].ansible_control_reachability_effective
            | default(ansible_control_reachability_effective | default(''))
          ) == 'public'
          or (
            hostvars['localhost'].ansible_control_reach_public_only
            | default(ansible_control_reach_public_only | default(false))
            | bool
          )
          or (cm_api_avoid_private_ip | bool)
        )
      }}

- name: Set CM API probe target for public Ansible controller (no delegate — probe from controller)
  ansible.builtin.set_fact:
    cm_api_probe_delegate_to: ""
    cm_api_probe_host: "{{ cm_api_client_host }}"
    cm_api_probe_https_first: true
  when:
    - cm_api_probe_from_controller_public | default(false) | bool

- name: Set CM API probe delegation (in-VPC — discover bind address on cldr-mngr)
  ansible.builtin.set_fact:
    cm_api_probe_delegate_to: "{{ cm_manager_inventory_host }}"
    cm_api_probe_host: "{{ cm_connect_host }}"
  when:
    - not (cm_api_runner_is_manager | bool)
    - cm_api_delegate_probes_to_manager | default(true) | bool
    - not (cm_api_probe_from_controller_public | default(false) | bool)

- name: Set CM API probe target when running on CM manager
  ansible.builtin.set_fact:
    cm_api_probe_delegate_to: ""
    cm_api_probe_host: "{{ cm_connect_host }}"
  when: cm_api_runner_is_manager | bool

- name: Set CM API probe target when probe delegation is disabled
  ansible.builtin.set_fact:
    cm_api_probe_delegate_to: ""
    cm_api_probe_host: "{{ cm_connect_host }}"
  when:
    - not (cm_api_runner_is_manager | bool)
    - not (cm_api_delegate_probes_to_manager | default(true) | bool)

- name: Mirror CM client host to cm_host for API tasks
  ansible.builtin.set_fact:
    cm_host: "{{ cm_api_client_host }}"
    cm_api_uri_delegate_to: ""

- name: Explain CM API connection target when it differs from browser URL
  ansible.builtin.debug:
    msg:
      - "CM API client host (this play): {{ cm_api_client_host }} (inventory runner: {{ inventory_hostname | default('localhost') }})"
      - "CM API discovery probes: {{ cm_api_probe_host }} on {{ cm_api_probe_delegate_to if (cm_api_probe_delegate_to | default('') | length > 0) else inventory_hostname | default('localhost') }} (public controller={{ cm_api_probe_from_controller_public | default(false) }}; delegated discovery tries private IP, ansible_host, FQDN, then 127.0.0.1 on cldr-mngr)"
      - "Control reachability: {{ ansible_control_reachability_effective | default('unknown') }} (avoid VPC private from controller={{ cm_api_avoid_private_ip | default(false) }})"
      - "Browser/public CM URL may use: {{ cm_host_public }}:{{ cm_http_port }} (public IP often times out from the CM host itself on AWS)"
      - "Override with cm_api_connect_host, cm_api_prefer_private_ip, or cm_api_delegate_probes_to_manager in group_vars if needed"

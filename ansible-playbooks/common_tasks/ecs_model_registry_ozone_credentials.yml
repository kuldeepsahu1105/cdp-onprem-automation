---
- name: Ozone S3 | Inspect CLI candidates on selected Ozone host
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
  loop:
    - /usr/bin/ozone
    - /opt/cloudera/parcels/CDH/bin/ozone
  register: ecs_ozone_cli_candidates
  changed_when: false
  delegate_to: "{{ ecs_model_registry_ozone_hosts | first }}"
  connection: ssh
  run_once: true
  vars:
    ansible_python_interpreter: >-
      {{
        hostvars[ecs_model_registry_ozone_hosts | first].ansible_python_interpreter
        | default('/usr/bin/python3', true)
      }}

- name: Ozone S3 | Inspect client configuration on selected Ozone host
  ansible.builtin.stat:
    path: /etc/ozone/conf/ozone-site.xml
    follow: true
  register: ecs_ozone_client_config
  changed_when: false
  delegate_to: "{{ ecs_model_registry_ozone_hosts | first }}"
  connection: ssh
  run_once: true
  vars:
    ansible_python_interpreter: >-
      {{
        hostvars[ecs_model_registry_ozone_hosts | first].ansible_python_interpreter
        | default('/usr/bin/python3', true)
      }}

- name: Ozone S3 | Set CLI and configuration paths
  ansible.builtin.set_fact:
    ecs_ozone_cli_path: >-
      {{
        ecs_ozone_cli_candidates.results
        | selectattr('stat.exists')
        | selectattr('stat.executable')
        | map(attribute='item')
        | first
        | default('')
      }}
    ecs_ozone_conf_dir: /etc/ozone/conf
  run_once: true

- name: Ozone S3 | Require CLI and client configuration
  ansible.builtin.assert:
    that:
      - ecs_ozone_cli_path | length > 0
      - ecs_ozone_client_config.stat.exists | default(false)
      - ecs_ozone_client_config.stat.isreg | default(false)
    fail_msg: >-
      Could not resolve the Ozone CLI and client configuration on
      {{ ecs_model_registry_ozone_hosts | first }}. Neither /usr/bin/ozone nor
      /opt/cloudera/parcels/CDH/bin/ozone is executable, or
      /etc/ozone/conf/ozone-site.xml is not a regular file.
  run_once: true

- name: Ozone S3 | Create isolated Kerberos credential cache
  ansible.builtin.tempfile:
    state: file
    prefix: ansible-ozone-s3-
    suffix: .ccache
  register: ecs_ozone_krb5_cache
  changed_when: false
  delegate_to: "{{ ecs_model_registry_ozone_hosts | first }}"
  connection: ssh
  run_once: true
  no_log: true

- name: Ozone S3 | Authenticate to Kerberos on selected Ozone host
  ansible.builtin.command:
    argv:
      - kinit
      - -c
      - "FILE:{{ ecs_ozone_krb5_cache.path }}"
      - "{{ ipaadmin_principal }}"
    stdin: "{{ common_password | default(ipaadmin_password, true) }}"
  register: ecs_ozone_kinit
  changed_when: false
  failed_when: false
  no_log: true
  delegate_to: "{{ ecs_model_registry_ozone_hosts | first }}"
  connection: ssh
  run_once: true
  vars:
    ansible_python_interpreter: >-
      {{
        hostvars[ecs_model_registry_ozone_hosts | first].ansible_python_interpreter
        | default('/usr/bin/python3', true)
      }}

- name: Ozone S3 | Read secret on selected Ozone host
  ansible.builtin.command:
    argv:
      - "{{ ecs_ozone_cli_path }}"
      - s3
      - getsecret
      - "--om-service-id={{ ecs_model_registry_ozone_service_id }}"
  environment:
    HADOOP_CONF_DIR: "{{ ecs_ozone_conf_dir }}"
    KRB5CCNAME: "FILE:{{ ecs_ozone_krb5_cache.path }}"
    OZONE_CONF_DIR: "{{ ecs_ozone_conf_dir }}"
  register: ecs_ozone_getsecret
  changed_when: false
  failed_when: false
  no_log: true
  delegate_to: "{{ ecs_model_registry_ozone_hosts | first }}"
  connection: ssh
  run_once: true
  when: ecs_ozone_kinit.rc == 0
  vars:
    ansible_python_interpreter: >-
      {{
        hostvars[ecs_model_registry_ozone_hosts | first].ansible_python_interpreter
        | default('/usr/bin/python3', true)
      }}

- name: Ozone S3 | Remove isolated Kerberos credential cache
  ansible.builtin.file:
    path: "{{ ecs_ozone_krb5_cache.path }}"
    state: absent
  changed_when: false
  delegate_to: "{{ ecs_model_registry_ozone_hosts | first }}"
  connection: ssh
  run_once: true
  no_log: true

- name: Ozone S3 | Require Kerberos authentication
  ansible.builtin.assert:
    that:
      - ecs_ozone_kinit.rc == 0
    fail_msg: >-
      Kerberos authentication for {{ ipaadmin_principal }} failed on
      {{ ecs_model_registry_ozone_hosts | first }} with rc
      {{ ecs_ozone_kinit.rc }}. Verify the principal/password and Kerberos
      client configuration on the selected Ozone host. Error:
      {{
        ecs_ozone_kinit.stderr
        | default('')
        | regex_replace(
            '(?i)(password|secret|access[ _-]?key)(\\s*[=:]\\s*)\\S+',
            '\\1\\2<redacted>'
          )
        | trim
      }}
  run_once: true

- name: Ozone S3 | Require successful secret retrieval
  ansible.builtin.assert:
    that:
      - ecs_ozone_getsecret.rc == 0
    fail_msg: >-
      Ozone S3 secret retrieval failed on
      {{ ecs_model_registry_ozone_hosts | first }} with rc
      {{ ecs_ozone_getsecret.rc }} using service ID
      {{ ecs_model_registry_ozone_service_id }}. Verify that the Ozone service
      is healthy and the authenticated principal may request an S3 secret.
      Error:
      {{
        ecs_ozone_getsecret.stderr
        | default('')
        | regex_replace(
            '(?i)(awsAccessKey|awsSecret|password|secret|access[ _-]?key)(\\s*[=:]\\s*)\\S+',
            '\\1\\2<redacted>'
          )
        | trim
      }}
  run_once: true

- name: Ozone S3 | Parse credentials on selected Ozone host
  ansible.builtin.set_fact:
    ozone_s3_access_key: >-
      {{
        ecs_ozone_getsecret.stdout_lines
        | select('match', '^awsAccessKey=')
        | map('regex_replace', '^awsAccessKey=', '')
        | first
        | default('')
      }}
    ozone_s3_secret_key: >-
      {{
        ecs_ozone_getsecret.stdout_lines
        | select('match', '^awsSecret=')
        | map('regex_replace', '^awsSecret=', '')
        | first
        | default('')
      }}
  delegate_to: "{{ ecs_model_registry_ozone_hosts | first }}"
  delegate_facts: true
  run_once: true
  no_log: true

- name: Ozone S3 | Require parsed credentials
  ansible.builtin.assert:
    that:
      - >-
        hostvars[ecs_model_registry_ozone_hosts | first].ozone_s3_access_key
        | default('') | length > 0
      - >-
        hostvars[ecs_model_registry_ozone_hosts | first].ozone_s3_secret_key
        | default('') | length > 0
    fail_msg: >-
      ozone s3 getsecret succeeded but did not return both awsAccessKey and
      awsSecret on {{ ecs_model_registry_ozone_hosts | first }}. Returned
      {{ ecs_ozone_getsecret.stdout_lines | default([]) | length }} line(s);
      credential values remain redacted.
  run_once: true

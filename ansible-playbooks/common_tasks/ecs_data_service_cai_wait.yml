---
- name: CAI | Wait for ML workspace provisioning job
  when: "'cai' in (ecs_data_services_install_names | default([]))"
  block:
    - name: CAI | Read ML workspace provisioning result
      ansible.builtin.async_status:
        jid: "{{ ecs_cai_workspace_job.ansible_job_id }}"
      register: ecs_cai_workspace
      until: ecs_cai_workspace.finished | default(false) | bool
      retries: "{{ ecs_data_services_async_poll_retries | int }}"
      delay: "{{ ecs_data_services_async_poll_delay | int }}"
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh

  rescue:
    - name: CAI | Record ML workspace provisioning failure
      ansible.builtin.set_fact:
        ecs_cai_workspace: "{{ ansible_failed_result }}"

- name: CAI | Complete ML workspace provisioning
  ansible.builtin.include_tasks: ecs_data_service_cai.yml
  when: "'cai' in (ecs_data_services_install_names | default([]))"

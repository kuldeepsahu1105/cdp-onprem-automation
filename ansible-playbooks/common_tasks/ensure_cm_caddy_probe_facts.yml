---
# Minimal Caddy CM vhost URLs on localhost for Jenkins CM API probes (no full portal fact build).
# Ops host (ipaserver) public IP is the usual nip.io slug; also try CM public IP when it differs.
#
# Simulated Jenkins probe (ops @ 52.221.251.41, CM public @ 52.76.123.34):
#   curl -sk 'https://52.76.123.34:7183/api/version'                 # 401 = API reachable (no creds)
#   curl -sk -u admin:PASS 'http://cm.52-221-251-41.pvc.cloudera-labs.com:81/api/version'
#   curl -sk -u admin:PASS 'https://52.76.123.34:7183/api/version'   # often blocked by SG from Jenkins
# Ansible uri probes on /api/version accept status_code [200, 301, 303, 401, 403] (see LEARNINGS.md).

- name: Resolve deployment portal Caddy gate (monitoring_stack_enabled)
  ansible.builtin.import_tasks: resolve_deployment_portal_caddy_enabled.yml

- name: Resolve deployment portal ops host inventory name for Caddy slug
  ansible.builtin.set_fact:
    _cm_caddy_ops_inv: >-
      {{
        groups[deployment_portal_host_group | default('ipaserver')][0]
        if (
          (deployment_portal_host_group | default('ipaserver')) in groups
          and groups[deployment_portal_host_group | default('ipaserver')] | default([]) | length > 0
        )
        else (
          groups['ipaserver'][0]
          if ('ipaserver' in groups and groups['ipaserver'] | default([]) | length > 0)
          else ''
        )
      }}

- name: Resolve ops and CM public IPs for synthetic Caddy CM probes
  ansible.builtin.set_fact:
    _cm_caddy_ops_public_ip: >-
      {{
        hostvars[_cm_caddy_ops_inv].ansible_host | default('')
        if (_cm_caddy_ops_inv | default('') | length > 0)
        else ''
      }}
    _cm_caddy_ops_private_ip: >-
      {{
        hostvars[_cm_caddy_ops_inv].private_ip | default('')
        if (_cm_caddy_ops_inv | default('') | length > 0)
        else ''
      }}
    _cm_caddy_cm_public_ip: "{{ cm_host_public | default('') }}"
  when: _cm_caddy_ops_inv is defined

- name: Build dashed-IP slug list for Caddy CM vhost probe URLs
  ansible.builtin.set_fact:
    cm_api_caddy_probe_slug_ips: >-
      {{
        (
          [_cm_caddy_ops_public_ip]
          + (
            [_cm_caddy_cm_public_ip]
            if (
              (_cm_caddy_cm_public_ip | default('') | length > 0)
              and (_cm_caddy_cm_public_ip != _cm_caddy_ops_public_ip)
            )
            else []
          )
        )
        | unique
        | reject('equalto', '')
        | list
      }}
  when:
    - _cm_caddy_ops_public_ip is defined
    - _cm_caddy_ops_public_ip | default('') | length > 0

- name: Synthesize Caddy vhost URL facts on localhost when missing (ops public IP slug)
  ansible.builtin.set_fact:
    caddy_vhost_urls_external: "{{ lookup('template', 'caddy_vhost_urls.j2') | from_yaml }}"
  vars:
    deployment_portal_ops_public_ip: "{{ _cm_caddy_ops_public_ip }}"
    deployment_portal_ops_private_ip: >-
      {{
        _cm_caddy_ops_private_ip
        if (_cm_caddy_ops_private_ip | default('') | length > 0)
        else _cm_caddy_ops_public_ip
      }}
    caddy_vhost_ip_for_urls: "{{ _cm_caddy_ops_public_ip }}"
  when:
    - caddy_vhost_enabled | default(false) | bool
    - (caddy_vhost_urls_external | default({})).cm.url | default('') | length == 0
    - _cm_caddy_ops_public_ip | default('') | length > 0

- name: Build ordered Caddy CM API probe URL candidates (ops slug, then CM public slug)
  ansible.builtin.set_fact:
    cm_api_caddy_probe_urls: >-
      {%- set slugs = cm_api_caddy_probe_slug_ips | default([]) -%}
      {%- set vhost_base = caddy_vhost_public_base | default('pvc.cloudera-labs.com') -%}
      {%- set http_port = deployment_portal_http_port | default(81) | int -%}
      {%- set port_suffix = (':' ~ (http_port | string)) if (http_port != 80) else '' -%}
      {%- set out = [] -%}
      {%- for item in slugs -%}
      {%- set _ = out.append('http://cm.' ~ (item | replace('.', '-')) ~ '.' ~ vhost_base ~ port_suffix) -%}
      {%- endfor -%}
      {%- set ext_url = hostvars['localhost'].caddy_vhost_urls_external.cm.url | default('') | trim | regex_replace('/+$', '') -%}
      {%- if ext_url | length > 0 -%}
      {%- set _ = out.append(ext_url) -%}
      {%- endif -%}
      {{ out | unique | reject('equalto', '') | list }}
  when:
    - (deployment_portal_caddy_effective | default(false) | bool)
    - (cm_config_api_via_caddy_proxy | default('auto') | lower) in ['auto', 'true', '1', 'yes', 'on']
    - cm_api_caddy_probe_slug_ips is defined
    - cm_api_caddy_probe_slug_ips | length > 0

---
# Pin RHEL before any full DNF upgrade. This works with both subscription-manager
# and AWS RHUI, where subscription-manager release locking is commonly unavailable.

- name: Resolve effective RHEL minor release pin
  ansible.builtin.set_fact:
    rhel_release_pin_effective: >-
      {{
        ansible_distribution_version
        if (rhel_release_pin | default('auto') | string | lower) == 'auto'
        else (rhel_release_pin | string)
      }}
  when: ansible_distribution == "RedHat"

- name: Validate RHEL minor release pin
  ansible.builtin.assert:
    that:
      - rhel_release_pin_effective is match('^[0-9]+\.[0-9]+$')
    fail_msg: >-
      rhel_release_pin must be "auto" or a major.minor release such as "9.6";
      resolved value={{ rhel_release_pin_effective | default('unset') }}.
  when: ansible_distribution == "RedHat"

- name: Refuse silent RHEL minor-version drift
  ansible.builtin.assert:
    that:
      - ansible_distribution_version == rhel_release_pin_effective
    fail_msg: >-
      {{ inventory_hostname }} is already RHEL {{ ansible_distribution_version }}, but
      rhel_release_pin={{ rhel_release_pin_effective }}. A release pin prevents future
      upgrades; it does not safely downgrade an already-upgraded operating system.
      Rebuild this node from the RHEL {{ rhel_release_pin_effective }} AMI, or intentionally
      change rhel_release_pin to {{ ansible_distribution_version }}.
  when: ansible_distribution == "RedHat"

- name: Ensure DNF variables directory exists
  ansible.builtin.file:
    path: /etc/dnf/vars
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ansible_distribution == "RedHat"

- name: Persist RHEL release pin for DNF and AWS RHUI
  ansible.builtin.copy:
    content: "{{ rhel_release_pin_effective }}\n"
    dest: /etc/dnf/vars/releasever
    owner: root
    group: root
    mode: "0644"
  when: ansible_distribution == "RedHat"

- name: Query subscription-manager release support
  ansible.builtin.command: subscription-manager release --show
  register: subscription_release_show
  changed_when: false
  failed_when: false
  when: ansible_distribution == "RedHat"

- name: Pin subscription-manager release when available
  ansible.builtin.command: "subscription-manager release --set={{ rhel_release_pin_effective }}"
  register: subscription_release_set
  changed_when: subscription_release_set.rc == 0
  failed_when: false
  when:
    - ansible_distribution == "RedHat"
    - subscription_release_show.rc | default(1) == 0
    - (subscription_release_show.stdout | regex_replace('(?i)^Release:\\s*', '') | trim)
      != rhel_release_pin_effective

- name: Verify persistent DNF release pin
  ansible.builtin.command: cat /etc/dnf/vars/releasever
  register: rhel_release_pin_verify
  changed_when: false
  failed_when: (rhel_release_pin_verify.stdout | trim) != rhel_release_pin_effective
  when: ansible_distribution == "RedHat"

---
# Kerberos CM settings via REST (credentials import runs once in 30_setup_cm_krbs.yml).

- name: Kerberos — build Kerberos encryption types value
  ansible.builtin.set_fact:
    cm_krb_enc_types_value: >-
      {{
        krb5_enc_types if (krb5_enc_types is string)
        else (krb5_enc_types | join(' '))
      }}

- name: Kerberos — read CM kerberosInfo before /cm/config reconcile
  ansible.builtin.uri:
    url: "{{ cm_krb_api_url }}/cm/kerberosInfo"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  delegate_to: "{{ cm_api_uri_delegate_to }}"
  register: cm_krb_kerberized_before_info
  changed_when: false

- name: Kerberos — record whether CM reports KDC integration enabled
  ansible.builtin.set_fact:
    cm_krb_kerberized_before: >-
      {{ cm_krb_kerberized_before_info.json.kerberized | default(false) | bool }}

- name: Kerberos — read full CM configuration
  ansible.builtin.uri:
    url: "{{ cm_krb_api_url }}/cm/config"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  delegate_to: "{{ cm_api_uri_delegate_to }}"
  register: cm_krb_config_before
  changed_when: false

- name: Kerberos — resolve CM libdefaults safety valve for managed krb5.conf
  ansible.builtin.set_fact:
    cm_krb_libdefaults_safety_valve_effective: >-
      {{
        (krb5_cm_libdefaults_safety_valve | default('') | string | trim)
        if (krb5_cm_managed_krb5_conf | default(true) | bool)
        else ''
      }}

- name: Kerberos — build desired CM Kerberos configuration items
  ansible.builtin.set_fact:
    cm_krb_desired_items: >-
      {{
        [
          { 'name': 'KRB_ENC_TYPES', 'value': cm_krb_enc_types_value },
          { 'name': 'SECURITY_REALM', 'value': cluster_realm },
          { 'name': 'KDC_TYPE', 'value': krb5_kdc_type },
          { 'name': 'KDC_ADMIN_HOST', 'value': kdc_host },
          { 'name': 'KDC_HOST', 'value': kdc_host },
          { 'name': 'KRB_MANAGE_KRB5_CONF', 'value': (krb5_cm_managed_krb5_conf | bool | lower) },
          { 'name': 'KRB_KRB5_CONF_PATH', 'value': (krb5_conf_path | default('/etc/krb5.conf')) },
        ]
        + (
          [{ 'name': 'KRB_LIBDEFAULTS_SAFETY_VALVE', 'value': cm_krb_libdefaults_safety_valve_effective }]
          if (cm_krb_libdefaults_safety_valve_effective | length) > 0
          else []
        )
      }}

- name: Kerberos — collect CM configuration drift details
  ansible.builtin.set_fact:
    cm_kerberos_config_drift_details: >-
      {{
        [
          {
            'name': item.name,
            'current': (
              cm_krb_config_before.json['items'] | default([])
              | selectattr('name', 'equalto', item.name)
              | map(attribute='value')
              | first
              | default(item.default)
              | string
              | trim
            ),
            'desired': item.value | string | trim
          }
        ]
        if (
          (
            cm_krb_config_before.json['items'] | default([])
            | selectattr('name', 'equalto', item.name)
            | map(attribute='value')
            | first
            | default(item.default)
            | string
            | trim
          ) != (item.value | string | trim)
        )
        else []
      }}
  loop:
    - name: SECURITY_REALM
      value: "{{ cluster_realm }}"
      default: ""
    - name: KDC_TYPE
      value: "{{ krb5_kdc_type }}"
      default: ""
    - name: KRB_ENC_TYPES
      value: "{{ cm_krb_enc_types_value }}"
      default: ""
    - name: KDC_HOST
      value: "{{ kdc_host }}"
      default: ""
    - name: KDC_ADMIN_HOST
      value: "{{ kdc_host }}"
      default: ""
    - name: KRB_MANAGE_KRB5_CONF
      value: "{{ krb5_cm_managed_krb5_conf | bool | lower }}"
      default: "false"
    - name: KRB_KRB5_CONF_PATH
      value: "{{ krb5_conf_path | default('/etc/krb5.conf') }}"
      default: "/etc/krb5.conf"
    - name: KRB_LIBDEFAULTS_SAFETY_VALVE
      value: "{{ cm_krb_libdefaults_safety_valve_effective }}"
      default: ""
  when:
    - item.name != 'KRB_LIBDEFAULTS_SAFETY_VALVE'
      or (cm_krb_libdefaults_safety_valve_effective | default('') | length) > 0
  register: cm_kerberos_config_drift_detail_results

- name: Kerberos — flatten CM configuration drift details
  ansible.builtin.set_fact:
    cm_kerberos_config_drift_details: >-
      {{
        cm_kerberos_config_drift_detail_results.results | default([])
        | selectattr('ansible_facts', 'defined')
        | map(attribute='ansible_facts.cm_kerberos_config_drift_details')
        | flatten
      }}

- name: Kerberos — detect whether CM Kerberos settings need update
  ansible.builtin.set_fact:
    cm_kerberos_config_changed: >-
      {{ cm_kerberos_config_drift_details | length > 0 }}

- name: Kerberos — apply CM Kerberos configuration
  ansible.builtin.uri:
    url: "{{ cm_krb_api_url }}/cm/config"
    method: PUT
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    body_format: json
    body:
      items: "{{ cm_krb_desired_items }}"
    status_code: [200, 204]
    follow_redirects: none
  delegate_to: "{{ cm_api_uri_delegate_to }}"
  register: cm_kerberos_api_result
  when: cm_kerberos_config_changed | bool
  changed_when: true

- name: Kerberos — mark Cloudera Manager restart required after config PUT
  ansible.builtin.set_fact:
    cm_restart_after_config_change: true
  when: cm_kerberos_config_changed | bool

- name: Kerberos — CM Kerberos settings already match desired state
  ansible.builtin.debug:
    msg: >-
      Kerberos CM /cm/config matches group_vars and CM reports kerberized=true;
      skipped PUT and pre-import CM restart.
  when:
    - not (cm_kerberos_config_changed | bool)
    - cm_krb_kerberized_before | default(false) | bool

- name: Kerberos — CM Kerberos settings match group_vars but KDC is not enabled yet
  ansible.builtin.debug:
    msg: >-
      CM /cm/config matches group_vars while kerberosInfo.kerberized=false.
      This pre-cluster state is not configuration drift; skipping the redundant
      configuration PUT and pre-import CM restart.
  when:
    - not (cm_kerberos_config_changed | bool)
    - not (cm_krb_kerberized_before | default(false) | bool)

- name: Kerberos — report CM Kerberos configuration drift
  ansible.builtin.debug:
    msg: >-
      CM Kerberos settings differ from group_vars; applying only because these values differ:
      {{ cm_kerberos_config_drift_details | to_json }}.
  when: cm_kerberos_config_changed | bool

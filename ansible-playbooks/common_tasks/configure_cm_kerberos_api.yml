---
# Kerberos CM settings via REST (credentials import runs once in 30_setup_cm_krbs.yml).

- name: Kerberos — build Kerberos encryption types value
  ansible.builtin.set_fact:
    cm_krb_enc_types_value: >-
      {{
        krb5_enc_types if (krb5_enc_types is string)
        else (krb5_enc_types | join(' '))
      }}

- name: Kerberos — read full CM configuration
  ansible.builtin.uri:
    url: "{{ cm_krb_api_url }}/cm/config"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  delegate_to: "{{ cm_api_uri_delegate_to }}"
  register: cm_krb_config_before
  changed_when: false

- name: Kerberos — build desired CM Kerberos configuration items
  ansible.builtin.set_fact:
    cm_krb_desired_items:
      - { name: KRB_ENC_TYPES, value: "{{ cm_krb_enc_types_value }}" }
      - { name: SECURITY_REALM, value: "{{ cluster_realm }}" }
      - { name: KDC_TYPE, value: "{{ krb5_kdc_type }}" }
      - { name: KDC_ADMIN_HOST, value: "{{ kdc_host }}" }
      - { name: KDC_HOST, value: "{{ kdc_host }}" }

- name: Kerberos — detect whether CM Kerberos settings need update
  ansible.builtin.set_fact:
    cm_kerberos_config_changed: >-
      {{
        not (cm_krb_kerberized_before | default(true) | bool)
        or (
          (cm_krb_config_before.json['items'] | default([])
           | selectattr('name', 'equalto', 'SECURITY_REALM')
           | map(attribute='value') | first | default('')) != cluster_realm
        )
        or (
          (cm_krb_config_before.json['items'] | default([])
           | selectattr('name', 'equalto', 'KDC_TYPE')
           | map(attribute='value') | first | default('')) != krb5_kdc_type
        )
        or (
          (cm_krb_config_before.json['items'] | default([])
           | selectattr('name', 'equalto', 'KRB_ENC_TYPES')
           | map(attribute='value') | first | default('')) != cm_krb_enc_types_value
        )
        or (
          (cm_krb_config_before.json['items'] | default([])
           | selectattr('name', 'equalto', 'KDC_HOST')
           | map(attribute='value') | first | default('')) != kdc_host
        )
        or (
          (cm_krb_config_before.json['items'] | default([])
           | selectattr('name', 'equalto', 'KDC_ADMIN_HOST')
           | map(attribute='value') | first | default('')) != kdc_host
        )
      }}

- name: Kerberos — apply CM Kerberos configuration
  ansible.builtin.uri:
    url: "{{ cm_krb_api_url }}/cm/config"
    method: PUT
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    body_format: json
    body:
      items: "{{ cm_krb_desired_items }}"
    status_code: [200, 204]
    follow_redirects: none
  delegate_to: "{{ cm_api_uri_delegate_to }}"
  register: cm_kerberos_api_result
  when: cm_kerberos_config_changed | bool
  changed_when: true

- name: Kerberos — mark Cloudera Manager restart required after config PUT
  ansible.builtin.set_fact:
    cm_restart_after_config_change: true
  when: cm_kerberos_config_changed | bool

- name: Kerberos — CM Kerberos settings already match desired state
  ansible.builtin.debug:
    msg: >-
      Kerberos CM /cm/config matches group_vars and CM reports kerberized=true;
      skipped PUT and pre-import CM restart.
  when:
    - not (cm_kerberos_config_changed | bool)
    - cm_krb_kerberized_before | default(true) | bool

- name: Kerberos — CM Kerberos settings match group_vars but KDC is not enabled yet
  ansible.builtin.debug:
    msg: >-
      CM /cm/config matches group_vars but kerberized=false — will PUT Kerberos settings and restart
      CM before importAdminCredentials (realm={{ cluster_realm }}, kdc={{ kdc_host }}).
  when:
    - cm_kerberos_config_changed | bool
    - not (cm_krb_kerberized_before | default(true) | bool)

- name: Kerberos — read CM Kerberos status after configuration
  ansible.builtin.uri:
    url: "{{ cm_krb_api_url }}/cm/kerberosInfo"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  delegate_to: "{{ cm_api_uri_delegate_to }}"
  register: cm_krb_info
  changed_when: false

---
# Ask Cloudera Manager whether Auto-TLS is configured (do not infer only from :7183 probes).

- name: CM API — GET CM global configuration
  ansible.builtin.uri:
    url: "{{ cm_api_url }}/cm/config"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200, 301, 303]
  register: _cm_autotls_config_api
  delegate_to: "{{ cm_api_uri_delegate_to if (cm_api_uri_delegate_to | default('') | length > 0) else omit }}"

- name: CM API — parse Auto-TLS flags from CM configuration
  ansible.builtin.set_fact:
    _cm_autotls_config_flag_hits: >-
      {{
        (
          _cm_config_items
          | selectattr('name', 'defined')
          | selectattr('name', 'in', _cm_autotls_config_flag_names)
          | selectattr('value', 'defined')
          | selectattr('value', 'in', [true, 'true', 'True', 'TRUE', 'yes', 'Yes', '1'])
          | map(attribute='name')
          | list
        )
        + (
          _cm_config_items
          | selectattr('name', 'defined')
          | selectattr('name', 'match', '(?i).*auto[_-]?tls.*')
          | selectattr('value', 'defined')
          | selectattr('value', 'in', [true, 'true', 'True', 'TRUE', 'yes', 'Yes', '1', 'enabled', 'ENABLED'])
          | map(attribute='name')
          | list
        )
        | unique
      }}
    _cm_autotls_ca_cert_value: >-
      {{
        (
          _cm_config_items
          | selectattr('name', 'defined')
          | selectattr('name', 'match', '(?i).*auto[_-]?tls.*ca.*cert.*')
          | map(attribute='value')
          | first
          | default('', true)
        )
        if (
          _cm_config_items
          | selectattr('name', 'defined')
          | selectattr('name', 'match', '(?i).*auto[_-]?tls.*ca.*cert.*')
          | list
          | length > 0
        )
        else (
          _cm_config_items
          | selectattr('name', 'defined')
          | selectattr('name', 'in', ['auto_tls_ca_cert', 'AUTO_TLS_CA_CERT'])
          | map(attribute='value')
          | first
          | default('', true)
        )
      }}
  vars:
    _cm_config_items: "{{ _cm_autotls_config_api.json['items'] | default([]) }}"
    _cm_autotls_config_flag_names:
      - enable_auto_tls
      - ENABLE_AUTO_TLS
      - autoTlsEnabled
      - auto_tls_enabled

- name: CM API — set Auto-TLS enabled from CM configuration
  ansible.builtin.set_fact:
    cm_autotls_api_enabled: >-
      {{
        (_cm_autotls_config_flag_hits | default([]) | length > 0)
        or ((_cm_autotls_ca_cert_value | default('') | trim | length) > 0)
      }}

- name: CM API — set TLS mode from CM config and working API protocol
  ansible.builtin.set_fact:
    cm_api_https_active: >-
      {{
        (cm_protocol | default('http')) == 'https'
        or (autotls_enabled | default(false) | bool)
        or ((cm_api_port | default(0) | int) == (cm_https_port | default(7183) | int))
      }}
    cm_tls_mode: >-
      {{
        'auto_tls'
        if (cm_autotls_api_enabled | default(false) | bool)
        else (
          'https'
          if (
            (cm_protocol | default('http')) == 'https'
            or (autotls_enabled | default(false) | bool)
            or ((cm_api_port | default(0) | int) == (cm_https_port | default(7183) | int))
          )
          else 'http'
        )
      }}

- name: CM API — set agent use_tls from working HTTPS API (not Auto-TLS flags alone)
  ansible.builtin.set_fact:
    cm_agent_use_tls: >-
      {{
        (cm_api_https_active | default(false) | bool)
        or (cm_autotls_api_enabled | default(false) | bool)
        or (autotls_enabled | default(false) | bool)
      }}

- name: CM API — print TLS / Auto-TLS state from CM API configuration
  ansible.builtin.debug:
    msg: >-
      CM TLS mode={{ cm_tls_mode | default('unknown') }}
      (HTTPS API active={{ cm_api_https_active | default(false) | bool }},
      protocol={{ cm_protocol | default('unset') }}:{{ cm_api_port | default('?') }},
      Auto-TLS in CM config={{ cm_autotls_api_enabled | default(false) | bool }},
      probe autotls_enabled={{ autotls_enabled | default(false) | bool }}).
      Agents should use use_tls={{ cm_agent_use_tls | default(false) | bool }}.
      Auto-TLS generateCmca skip uses CM config flags / CA cert, not HTTPS UI alone.

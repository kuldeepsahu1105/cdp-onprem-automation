---
# cloudera.cluster.host_template was added in v5. Use the equivalent CM API
# with pinned cloudera.cluster v4.4.0, preserving the reference lifecycle.

- name: Query Docker role config groups
  ansible.builtin.uri:
    url: >-
      {{ cm_cluster_module_api_url }}/clusters/{{ ecs_cluster_name
      }}/services/docker/roleConfigGroups
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  register: ecs_docker_rcg_response
  changed_when: false
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Query ECS role config groups
  ansible.builtin.uri:
    url: >-
      {{ cm_cluster_module_api_url }}/clusters/{{ ecs_cluster_name
      }}/services/ecs/roleConfigGroups
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  register: ecs_service_rcg_response
  changed_when: false
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Resolve ECS base role config group names
  ansible.builtin.set_fact:
    ecs_rcg_docker_server: >-
      {{
        ecs_docker_rcg_response.json['items']
        | selectattr('roleType', 'equalto', 'DOCKER_SERVER')
        | selectattr('base', 'equalto', true)
        | map(attribute='name')
        | first
      }}
    ecs_rcg_ecs_server: >-
      {{
        ecs_service_rcg_response.json['items']
        | selectattr('roleType', 'equalto', 'ECS_SERVER')
        | selectattr('base', 'equalto', true)
        | map(attribute='name')
        | first
      }}
    ecs_rcg_ecs_agent: >-
      {{
        ecs_service_rcg_response.json['items']
        | selectattr('roleType', 'equalto', 'ECS_AGENT')
        | selectattr('base', 'equalto', true)
        | map(attribute='name')
        | first
      }}

- name: Require ECS role config groups for host templates
  ansible.builtin.assert:
    that:
      - ecs_rcg_docker_server | default('') | length > 0
      - ecs_rcg_ecs_server | default('') | length > 0
      - ecs_rcg_ecs_agent | default('') | length > 0
    fail_msg: >-
      Could not resolve base role config groups for Docker and ECS on
      {{ ecs_cluster_name }}.

- name: Build ECS host template payloads
  ansible.builtin.set_fact:
    ecs_host_template_payloads:
      - name: ECSMaster
        roleConfigGroupRefs:
          - roleConfigGroupName: "{{ ecs_rcg_docker_server }}"
          - roleConfigGroupName: "{{ ecs_rcg_ecs_server }}"
      - name: ECSWorker
        roleConfigGroupRefs:
          - roleConfigGroupName: "{{ ecs_rcg_docker_server }}"
          - roleConfigGroupName: "{{ ecs_rcg_ecs_agent }}"

- name: Read existing ECS host templates
  ansible.builtin.uri:
    url: "{{ cm_cluster_module_api_url }}/clusters/{{ ecs_cluster_name }}/hostTemplates"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  register: ecs_existing_host_templates
  changed_when: false
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Index existing ECS host templates
  ansible.builtin.set_fact:
    ecs_existing_host_template_names: >-
      {{
        ecs_existing_host_templates.json['items'] | default([])
        | map(attribute='name')
        | list
      }}

- name: Create missing ECS host templates
  ansible.builtin.uri:
    url: "{{ cm_cluster_module_api_url }}/clusters/{{ ecs_cluster_name }}/hostTemplates"
    method: POST
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
    body_format: json
    body:
      items:
        - "{{ item }}"
  loop: "{{ ecs_host_template_payloads }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in ecs_existing_host_template_names
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Reconcile existing ECS host templates
  ansible.builtin.uri:
    url: >-
      {{ cm_cluster_module_api_url }}/clusters/{{ ecs_cluster_name
      }}/hostTemplates/{{ item.name | urlencode }}
    method: PUT
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
    body_format: json
    body: "{{ item }}"
  loop: "{{ ecs_host_template_payloads }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name in ecs_existing_host_template_names
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Resolve ECS host IDs for template application
  ansible.builtin.uri:
    url: "{{ cm_cluster_module_api_url }}/hosts/{{ item | urlencode }}"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  loop: "{{ [ecs_master_fqdn] + ecs_worker_fqdns }}"
  loop_control:
    label: "{{ item }}"
  register: ecs_host_id_lookups
  changed_when: false
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Apply ECSMaster template without starting roles
  ansible.builtin.uri:
    url: >-
      {{ cm_cluster_module_api_url }}/clusters/{{ ecs_cluster_name
      }}/hostTemplates/ECSMaster/commands/applyHostTemplate?startRoles=false&runConfigRules=false
    method: POST
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
    body_format: json
    body:
      items:
        - hostId: "{{ ecs_host_id_lookups.results[0].json.hostId }}"
  register: ecs_master_template_apply
  changed_when: true
  failed_when: >-
    ecs_master_template_apply.status != 200
    or not (ecs_master_template_apply.json.success | default(false) | bool)
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Build ECSWorker host references
  ansible.builtin.set_fact:
    ecs_worker_host_apply_items: >-
      {{
        ecs_worker_host_apply_items | default([])
        + [{'hostId': item.json.hostId}]
      }}
  loop: "{{ ecs_host_id_lookups.results[1:] }}"
  loop_control:
    label: "{{ item.item }}"
  when: ecs_worker_fqdns | length > 0

- name: Apply ECSWorker template without starting roles
  ansible.builtin.uri:
    url: >-
      {{ cm_cluster_module_api_url }}/clusters/{{ ecs_cluster_name
      }}/hostTemplates/ECSWorker/commands/applyHostTemplate?startRoles=false&runConfigRules=false
    method: POST
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
    body_format: json
    body:
      items: "{{ ecs_worker_host_apply_items }}"
  register: ecs_worker_template_apply
  changed_when: true
  failed_when: >-
    ecs_worker_template_apply.status != 200
    or not (ecs_worker_template_apply.json.success | default(false) | bool)
  when: ecs_worker_fqdns | length > 0
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

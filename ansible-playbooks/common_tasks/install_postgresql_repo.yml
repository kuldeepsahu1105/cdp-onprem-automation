---
- name: Enable RHEL Repositories (if RHEL-based)
  ansible.builtin.command: >
    subscription-manager repos
    --enable=rhel-{{ ansible_distribution_major_version }}-for-{{ ansible_architecture }}-baseos-rpms
    --enable=rhel-{{ ansible_distribution_major_version }}-for-{{ ansible_architecture }}-appstream-rpms
  when: ansible_os_family == "RedHat" and ansible_distribution == "RedHat"
  changed_when: false
  failed_when: false

- name: Enable CentOS Stream AppStream Repos (if CentOS)
  ansible.builtin.command: dnf config-manager --set-enabled appstream
  when: ansible_os_family == "RedHat" and ansible_distribution == "CentOS"
  changed_when: false
  failed_when: false

- name: Install PostgreSQL PGDG repository (RHEL family)
  ansible.builtin.dnf:
    name: "{{ os_vars[ansible_os_family].postgres_repo_url }}"
    state: present
    disable_gpg_check: true
    disablerepo:
      - "pgdg*"
  when: ansible_os_family == "RedHat"

- name: Find installed PostgreSQL PGDG repository definitions
  ansible.builtin.find:
    paths: /etc/yum.repos.d
    patterns: "pgdg*.repo"
    file_type: file
  register: postgresql_pgdg_repo_files
  when: ansible_os_family == "RedHat"

- name: Keep PostgreSQL PGDG repositories disabled by default
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: '^(enabled\s*=\s*)1\s*$'
    replace: '\g<1>0'
  loop: "{{ postgresql_pgdg_repo_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: ansible_os_family == "RedHat"

- name: Normalize versioned PostgreSQL PGDG repository
  ansible.builtin.include_tasks: normalize_postgresql_pgdg_repository.yml
  when: ansible_os_family == "RedHat"

- name: Install PostgreSQL APT repository key (Debian family)
  ansible.builtin.get_url:
    url: "{{ os_vars[ansible_os_family].postgres_apt_key_url }}"
    dest: /tmp/postgresql.asc
    mode: "0644"
  when: ansible_os_family == "Debian"

- name: Dearmor PostgreSQL APT key
  ansible.builtin.command: gpg --dearmor -o /usr/share/keyrings/postgresql.gpg /tmp/postgresql.asc
  args:
    creates: /usr/share/keyrings/postgresql.gpg
  when: ansible_os_family == "Debian"

- name: Add PostgreSQL APT repository (Debian family)
  ansible.builtin.apt_repository:
    repo: "{{ os_vars[ansible_os_family].postgres_apt_repo }}"
    state: present
    filename: pgdg
  when: ansible_os_family == "Debian"

- name: Update apt cache after adding PostgreSQL repo (Debian family)
  ansible.builtin.apt:
    update_cache: true
  when: ansible_os_family == "Debian"

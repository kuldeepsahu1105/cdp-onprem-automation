---
- name: CAI | Complete ML workspace installation
  when: "'cai' in (ecs_data_services_install_names | default([]))"
  block:
    - name: Wait for ML workspace provisioning
      ansible.builtin.async_status:
        jid: "{{ ecs_cai_workspace_job.ansible_job_id }}"
      register: ecs_cai_workspace
      until: ecs_cai_workspace.finished | bool
      retries: "{{ ecs_data_services_async_poll_retries | default(480) }}"
      delay: "{{ ecs_data_services_async_poll_delay | default(30) }}"
      failed_when: false
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh

    - name: Record ML workspace provisioning result
      ansible.builtin.set_fact:
        ecs_cai_workspace_succeeded: >-
          {{
            ecs_cai_workspace.finished | default(false) | bool
            and (ecs_cai_workspace.workspace | default({})) is mapping
            and (ecs_cai_workspace.workspace | default({})).instanceUrl | default('') | length > 0
          }}

    - name: Report ML workspace provisioning failure
      ansible.builtin.debug:
        msg: >-
          CAI provisioning did not return an activated workspace:
          {{ ecs_cai_workspace.msg | default(ecs_cai_workspace | to_json) }}
      when: not (ecs_cai_workspace_succeeded | bool)

    - name: Remove ML workspace async result
      ansible.builtin.async_status:
        jid: "{{ ecs_cai_workspace_job.ansible_job_id }}"
        mode: cleanup
      changed_when: false
      when: ecs_cai_workspace.finished | default(false) | bool
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh

    - name: Derive workbench hostname token
      ansible.builtin.set_fact:
        ecs_cai_workbench_id: >-
          {{
            ecs_cai_workspace.workspace.instanceUrl
            | regex_replace('^https://', '')
            | regex_replace('(\\..*$)', '')
          }}
      when:
        - ecs_cai_workspace_succeeded | bool

    - name: Register workbench ingress for Caddy
      ansible.builtin.set_fact:
        ecs_caddy_data_service_routes: >-
          {{
            (ecs_caddy_data_service_routes | default([]))
            + [
              {
                'id': 'cai-' + ecs_cai_workspace_name,
                'external_hostname': ecs_cai_workbench_id + '.' + ecs_app_domain,
                'backend_host': ecs_master_fqdn,
                'backend_port': 443,
                'backend_scheme': 'https'
              }
            ]
          }}
      when:
        - ecs_cai_workspace_succeeded | bool

    - name: Update portal catalog URL for CAI
      ansible.builtin.set_fact:
        ecs_data_services_catalog: >-
          {{
            ecs_data_services_catalog | combine(
              {
                'cai': ecs_data_services_catalog.cai | default({}) | combine(
                  {
                    'url': 'https://' + ecs_cai_workbench_id + '.' + ecs_app_domain
                  }
                )
              },
              recursive=True
            )
          }}
      when:
        - ecs_cai_workspace_succeeded | bool

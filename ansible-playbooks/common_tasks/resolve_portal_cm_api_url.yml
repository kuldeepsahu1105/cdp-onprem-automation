---
# Portal live-stats only: CM manager public or private IP with :7183 / :7180 (no install-time API discovery chain).

- name: Set CM manager public and private IPs from inventory
  ansible.builtin.set_fact:
    _portal_cm_public: >-
      {{
        hostvars[groups['cldr-mngr'][0]].ansible_host | default('') | trim
        if ('cldr-mngr' in groups and groups['cldr-mngr'] | length > 0)
        else ''
      }}
    _portal_cm_private: >-
      {{
        hostvars[groups['cldr-mngr'][0]].private_ip | default('') | trim
        if ('cldr-mngr' in groups and groups['cldr-mngr'] | length > 0)
        else ''
      }}

- name: Choose CM API host for portal (public from controller; private in-VPC)
  ansible.builtin.set_fact:
    cm_api_client_host: >-
      {{
        _portal_cm_public
        if (deployment_portal_access_profile_effective | default('cloud') == 'cloud')
        else _portal_cm_private
      }}
    cm_api_uri_delegate_to: ""
    cm_api_url: ""

- name: Probe Cloudera Manager HTTPS API
  ansible.builtin.uri:
    url: "https://{{ cm_api_client_host }}:{{ cm_https_port }}/api/version"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200, 301, 303, 401, 403]
    timeout: 15
  register: _portal_cm_https_probe
  failed_when: false

- name: Probe Cloudera Manager HTTP API
  ansible.builtin.uri:
    url: "http://{{ cm_api_client_host }}:{{ cm_http_port }}/api/version"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: true
    follow_redirects: none
    validate_certs: false
    status_code: [200, 301, 303, 401, 403]
    timeout: 15
  register: _portal_cm_http_probe
  failed_when: false
  when: (_portal_cm_https_probe.status | default(0) | int) not in [200, 301, 303, 401, 403]

- name: Set CM API URL from portal probes
  ansible.builtin.set_fact:
    cm_api_url: >-
      {{
        'https://' ~ cm_api_client_host ~ ':' ~ (cm_https_port | string)
        if ((_portal_cm_https_probe.status | default(0) | int) in [200, 301, 303, 401, 403])
        else ('http://' ~ cm_api_client_host ~ ':' ~ (cm_http_port | string))
      }}

---
- name: Check whether ECS cluster exists
  ansible.builtin.uri:
    url: "{{ cm_api_url }}/clusters/{{ ecs_cluster_name }}"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200, 404]
    follow_redirects: none
  register: ecs_cluster_before_delete

- name: Stop ECS cluster services via API
  ansible.builtin.uri:
    url: "{{ cm_api_url }}/clusters/{{ ecs_cluster_name }}/commands/stop"
    method: POST
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  register: stop_ecs_cluster
  when:
    - ecs_cluster_before_delete.status == 200
    - ecs_cluster_before_delete.json.clusterState | default('') != 'STOPPED'

- name: Require ECS cluster stop command ID
  ansible.builtin.assert:
    that:
      - stop_ecs_cluster.json.id is defined
    fail_msg: CM did not return a command ID while stopping {{ ecs_cluster_name }}.
  when: stop_ecs_cluster is not skipped

- name: Wait for ECS cluster stop command
  ansible.builtin.import_tasks: common_tasks/wait_cm_api_command.yml
  vars:
    cm_krb_api_url: "{{ cm_api_url }}"
    cm_api_command_id: "{{ stop_ecs_cluster.json.id }}"
  when: stop_ecs_cluster is not skipped

- name: Delete ECS cluster via API
  ansible.builtin.uri:
    url: "{{ cm_api_url }}/clusters/{{ ecs_cluster_name }}"
    method: DELETE
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  register: delete_ecs_cluster
  when: ecs_cluster_before_delete.status == 200

- name: Confirm ECS cluster is absent
  ansible.builtin.uri:
    url: "{{ cm_api_url }}/clusters/{{ ecs_cluster_name }}"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [404]
    follow_redirects: none
  register: ecs_cluster_deleted
  retries: 12
  delay: 5
  until: ecs_cluster_deleted.status == 404

- name: Print ECS cluster API delete result
  ansible.builtin.debug:
    msg: >-
      ECS cluster {{ ecs_cluster_name }} is absent
      (initial status {{ ecs_cluster_before_delete.status }}).

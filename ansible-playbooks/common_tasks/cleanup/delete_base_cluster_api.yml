---
- name: Check whether base cluster exists
  ansible.builtin.uri:
    url: "{{ cm_api_url }}/clusters/{{ cdh_basecluster_name | urlencode }}"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200, 404]
    follow_redirects: none
  register: base_cluster_before_delete

- name: Check legacy base clusters when the prefixed default is absent
  ansible.builtin.uri:
    url: "{{ cm_api_url }}/clusters/{{ item | urlencode }}"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200, 404]
    follow_redirects: none
  loop: >-
    {{
      base_cluster_legacy_names
      | default([base_cluster_legacy_name | default('')])
      | reject('equalto', '')
      | reject('equalto', cdh_basecluster_name)
      | list
    }}
  loop_control:
    label: "{{ item }}"
  register: legacy_base_cluster_delete_lookups
  when:
    - base_cluster_before_delete.status == 404
    - cdh_basecluster_name == base_cluster_default_name

- name: Require one unambiguous legacy base cluster for cleanup
  ansible.builtin.assert:
    that:
      - >-
        (
          legacy_base_cluster_delete_lookups.results | default([])
          | selectattr('status', 'defined')
          | selectattr('status', 'equalto', 200)
          | list
          | length
        ) <= 1
    fail_msg: >-
      Multiple legacy base clusters exist:
      {{
        legacy_base_cluster_delete_lookups.results | default([])
        | selectattr('status', 'defined')
        | selectattr('status', 'equalto', 200)
        | map(attribute='item')
        | join(', ')
      }}. Set cdh_basecluster_name explicitly before cleanup.

- name: Select legacy base cluster cleanup lookup
  ansible.builtin.set_fact:
    legacy_base_cluster_before_delete: >-
      {{
        (
          legacy_base_cluster_delete_lookups.results | default([])
          | selectattr('status', 'defined')
          | selectattr('status', 'equalto', 200)
          | first
        )
        | default({'status': 404}, true)
      }}

- name: Resolve base cluster API cleanup name
  ansible.builtin.set_fact:
    cleanup_base_cluster_api_name: >-
      {{
        legacy_base_cluster_before_delete.item
        if (legacy_base_cluster_before_delete.status | default(404) == 200)
        else cdh_basecluster_name
      }}
    cleanup_base_cluster_api_exists: >-
      {{
        base_cluster_before_delete.status == 200
        or (
          legacy_base_cluster_before_delete.status | default(404) == 200
        )
      }}

- name: Stop base cluster services via API
  ansible.builtin.uri:
    url: "{{ cm_api_url }}/clusters/{{ cleanup_base_cluster_api_name | urlencode }}/commands/stop"
    method: POST
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  register: stop_base_cluster
  when:
    - cleanup_base_cluster_api_exists | bool
    - >-
      (
        legacy_base_cluster_before_delete.json.clusterState
        if (
          legacy_base_cluster_before_delete.status | default(404) == 200
        )
        else base_cluster_before_delete.json.clusterState
      ) | default('') != 'STOPPED'

- name: Require base cluster stop command ID
  ansible.builtin.assert:
    that:
      - stop_base_cluster.json.id is defined
    fail_msg: CM did not return a command ID while stopping {{ cleanup_base_cluster_api_name }}.
  when: stop_base_cluster is not skipped

- name: Wait for base cluster stop command
  ansible.builtin.import_tasks: common_tasks/wait_cm_api_command.yml
  vars:
    cm_krb_api_url: "{{ cm_api_url }}"
    cm_api_command_id: "{{ stop_base_cluster.json.id }}"
  when: stop_base_cluster is not skipped

- name: Delete base cluster via API
  ansible.builtin.uri:
    url: "{{ cm_api_url }}/clusters/{{ cleanup_base_cluster_api_name | urlencode }}"
    method: DELETE
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  register: delete_base_cluster
  when: cleanup_base_cluster_api_exists | bool

- name: Confirm base cluster is absent
  ansible.builtin.uri:
    url: "{{ cm_api_url }}/clusters/{{ cleanup_base_cluster_api_name | urlencode }}"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [404]
    follow_redirects: none
  register: base_cluster_deleted
  retries: 12
  delay: 5
  until: base_cluster_deleted.status == 404

- name: Print base cluster API delete result
  ansible.builtin.debug:
    msg: >-
      Base cluster {{ cleanup_base_cluster_api_name }} is absent
      (initial status {{ base_cluster_before_delete.status }}).

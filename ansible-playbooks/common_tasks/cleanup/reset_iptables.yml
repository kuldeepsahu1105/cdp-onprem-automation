---
- name: Reset iptables policies to ACCEPT and flush chains
  ansible.builtin.shell: |
    set -e
    declare -A chains=(
      [filter]="INPUT:FORWARD:OUTPUT"
      [raw]="PREROUTING:OUTPUT"
      [mangle]="PREROUTING:INPUT:FORWARD:OUTPUT:POSTROUTING"
      [security]="INPUT:FORWARD:OUTPUT"
      [nat]="PREROUTING:INPUT:OUTPUT:POSTROUTING"
    )
    for table in "${!chains[@]}"; do
      echo "${chains[$table]}" | tr : "\n" | while IFS= read -r chain; do
        [ -n "$chain" ] && iptables -t "$table" -P "$chain" ACCEPT || true
      done
      iptables -t "$table" -F || true
      iptables -t "$table" -X || true
    done
    iptables -F || true
    iptables -L || true
    rm -rf /etc/rancher /var/lib/rancher /var/log/rancher
  args:
    warn: false
  changed_when: true
  failed_when: false

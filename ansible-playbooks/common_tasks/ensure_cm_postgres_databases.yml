---
# Idempotent CM DBs (scm + Reports Manager rman) on postgres_inventory_host (e.g. cldr-mngr).
# Ansible controller may be Mac, Ubuntu, or RHEL — irrelevant: every list/create task delegates to the
# DB host only (no psql, postgresql modules, or RHEL-specific DB paths on localhost/controller).
# Root + PGPASSWORD + TCP (postgres_ensure_cm_db_psql_host) — no become_user postgres.
# When both databases exist: one debug line and no further tasks in this import.

- name: Resolve PostgreSQL inventory host for CM databases
  ansible.builtin.import_tasks: resolve_postgres_inventory.yml

- name: Gather minimal facts on PostgreSQL inventory host when OS family unknown
  ansible.builtin.setup:
    gather_subset:
      - min
  delegate_to: "{{ postgres_inventory_host }}"
  delegate_facts: true
  when:
    - postgres_db_host_os_family is not defined
    - hostvars[postgres_inventory_host]['ansible_os_family'] is not defined
    - ansible_os_family is not defined or inventory_hostname != postgres_inventory_host

- name: Record PostgreSQL DB host OS family on play host for delegated package tasks
  ansible.builtin.set_fact:
    postgres_db_host_os_family: >-
      {{
        hostvars[postgres_inventory_host]['ansible_os_family']
        | default(ansible_os_family | default(''))
      }}
  when: postgres_db_host_os_family is not defined

- name: Require PostgreSQL DB host OS family for client package install
  ansible.builtin.assert:
    that:
      - postgres_db_host_os_family in ['RedHat', 'Debian']
    fail_msg: >-
      Could not determine OS family for PostgreSQL host {{ postgres_inventory_host }}.
      Ensure the host is reachable and facts can be gathered, or set postgres_db_host_os_family.

- name: Stat versioned psql binary on PostgreSQL DB host
  ansible.builtin.stat:
    path: >-
      {{
        '/usr/pgsql-' ~ (postgresql_version | string) ~ '/bin/psql'
        if postgres_db_host_os_family == 'RedHat'
        else '/usr/lib/postgresql/' ~ (postgresql_version | string) ~ '/bin/psql'
      }}
  delegate_to: "{{ postgres_inventory_host }}"
  become: true
  register: postgres_db_host_psql_versioned_stat

- name: Resolve psql in PATH on PostgreSQL DB host when versioned binary missing
  ansible.builtin.command:
    cmd: which psql
  delegate_to: "{{ postgres_inventory_host }}"
  become: true
  register: postgres_db_host_which_psql
  changed_when: false
  failed_when: false
  when: not (postgres_db_host_psql_versioned_stat.stat.exists | default(false))

- name: Record whether PostgreSQL client is already on DB host
  ansible.builtin.set_fact:
    postgres_db_host_psql_present: >-
      {{
        (postgres_db_host_psql_versioned_stat.stat.exists | default(false))
        or (
          (postgres_db_host_which_psql.rc | default(1) | int) == 0
          and (postgres_db_host_which_psql.stdout | default('') | trim) | length > 0
        )
      }}

- name: Record PostgreSQL DB host psql path from versioned install
  ansible.builtin.set_fact:
    postgres_db_host_psql_cmd: >-
      {{
        '/usr/pgsql-' ~ (postgresql_version | string) ~ '/bin/psql'
        if postgres_db_host_os_family == 'RedHat'
        else '/usr/lib/postgresql/' ~ (postgresql_version | string) ~ '/bin/psql'
      }}
  when:
    - postgres_db_host_psql_cmd is not defined
    - postgres_db_host_psql_versioned_stat.stat.exists | default(false)

- name: Record PostgreSQL DB host psql path from PATH
  ansible.builtin.set_fact:
    postgres_db_host_psql_cmd: "{{ postgres_db_host_which_psql.stdout | trim }}"
  when:
    - postgres_db_host_psql_cmd is not defined
    - (postgres_db_host_which_psql.rc | default(1) | int) == 0
    - (postgres_db_host_which_psql.stdout | default('') | trim) | length > 0

- name: Default PostgreSQL DB host psql command when client install will provide PATH
  ansible.builtin.set_fact:
    postgres_db_host_psql_cmd: psql
  when: postgres_db_host_psql_cmd is not defined

- name: Install PostgreSQL PGDG repository on DB host (RedHat family)
  ansible.builtin.package:
    name: >-
      https://download.postgresql.org/pub/repos/yum/reporpms/EL-{{
        hostvars[postgres_inventory_host].ansible_distribution_major_version
      }}-{{ hostvars[postgres_inventory_host].ansible_architecture }}/pgdg-redhat-repo-latest.noarch.rpm
    state: present
    disable_gpg_check: true
  delegate_to: "{{ postgres_inventory_host }}"
  become: true
  when:
    - not (postgres_db_host_psql_present | bool)
    - postgres_db_host_os_family == 'RedHat'

- name: Ensure PostgreSQL client on DB host (RedHat family)
  ansible.builtin.package:
    name: "postgresql{{ postgresql_version }}"
    state: present
  delegate_to: "{{ postgres_inventory_host }}"
  become: true
  when:
    - not (postgres_db_host_psql_present | bool)
    - postgres_db_host_os_family == 'RedHat'

- name: Ensure PostgreSQL client on DB host (Debian family)
  ansible.builtin.package:
    name: "postgresql-client-{{ postgresql_version }}"
    state: present
  delegate_to: "{{ postgres_inventory_host }}"
  become: true
  when:
    - not (postgres_db_host_psql_present | bool)
    - postgres_db_host_os_family == 'Debian'

- name: List CM scm and Reports Manager databases on PostgreSQL
  ansible.builtin.command:
    argv:
      - "{{ postgres_db_host_psql_cmd }}"
      - -h
      - "{{ postgres_ensure_cm_db_psql_host }}"
      - -p
      - "{{ postgres_port | string }}"
      - -U
      - "{{ postgres_user }}"
      - -d
      - "{{ postgres_db }}"
      - -tAc
      - "SELECT datname FROM pg_database WHERE datname IN ('{{ scm_db_name }}','{{ cm_cms_reports_manager_db_name }}')"
  environment:
    PGPASSWORD: "{{ postgres_password }}"
  delegate_to: "{{ postgres_inventory_host }}"
  become: true
  register: cm_db_list
  changed_when: false

- name: CM DBs present — skipping
  ansible.builtin.debug:
    msg: CM DBs present — skipping
  when:
    - scm_db_name in (cm_db_list.stdout_lines | map('trim') | list)
    - cm_cms_reports_manager_db_name in (cm_db_list.stdout_lines | map('trim') | list)

- name: Create CM PostgreSQL databases when scm or Reports Manager database is missing
  when: >
    scm_db_name not in (cm_db_list.stdout_lines | map('trim') | list)
    or cm_cms_reports_manager_db_name not in (cm_db_list.stdout_lines | map('trim') | list)
  block:
    - name: Generate CM database init SQL script from template
      ansible.builtin.template:
        src: templates/create_cm_dbs.sql.j2
        dest: /tmp/init.sql
        mode: "0644"
      delegate_to: "{{ postgres_inventory_host }}"
      become: true

    - name: Run CM database init SQL on PostgreSQL
      ansible.builtin.command:
        argv:
          - "{{ postgres_db_host_psql_cmd }}"
          - -v
          - ON_ERROR_STOP=1
          - -h
          - "{{ postgres_ensure_cm_db_psql_host }}"
          - -p
          - "{{ postgres_port | string }}"
          - -U
          - "{{ postgres_user }}"
          - -d
          - "{{ postgres_db }}"
          - -f
          - /tmp/init.sql
      environment:
        PGPASSWORD: "{{ postgres_password }}"
      delegate_to: "{{ postgres_inventory_host }}"
      become: true
      register: cm_db_init_sql
      changed_when: cm_db_init_sql.rc == 0
      failed_when: cm_db_init_sql.rc | default(1) | int != 0

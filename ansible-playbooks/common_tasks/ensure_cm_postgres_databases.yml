---
# Idempotent CM DBs (scm + Reports Manager rman) on postgres_inventory_host (e.g. cldr-mngr).
# Ansible controller may be Mac, Ubuntu, or RHEL — irrelevant: every list/create task delegates to the
# DB host only (no psql, postgresql modules, or RHEL-specific DB paths on localhost/controller).
# Root + PGPASSWORD + TCP to 127.0.0.1 only — no become_user postgres.
# When both databases exist: one debug line and no further tasks in this import.

- name: Gather minimal facts on PostgreSQL inventory host when OS family unknown
  ansible.builtin.setup:
    gather_subset:
      - min
  delegate_to: "{{ postgres_inventory_host }}"
  when: hostvars[postgres_inventory_host].ansible_os_family is not defined

- name: Ensure PostgreSQL client on DB host (RedHat family)
  ansible.builtin.package:
    name: "{{ os_vars.RedHat.postgres_client_packages }}"
    state: present
  delegate_to: "{{ postgres_inventory_host }}"
  become: true
  when: hostvars[postgres_inventory_host].ansible_os_family == 'RedHat'

- name: Ensure PostgreSQL client on DB host (Debian family)
  ansible.builtin.package:
    name: "{{ os_vars.Debian.postgres_client_packages }}"
    state: present
  delegate_to: "{{ postgres_inventory_host }}"
  become: true
  when: hostvars[postgres_inventory_host].ansible_os_family == 'Debian'

- name: List CM scm and Reports Manager databases on PostgreSQL
  ansible.builtin.command:
    argv:
      - psql
      - -h
      - 127.0.0.1
      - -p
      - "{{ postgres_port | string }}"
      - -U
      - "{{ postgres_user }}"
      - -d
      - "{{ postgres_db }}"
      - -tAc
      - "SELECT datname FROM pg_database WHERE datname IN ('{{ scm_db_name }}','{{ cm_cms_reports_manager_db_name }}')"
  environment:
    PGPASSWORD: "{{ postgres_password }}"
  delegate_to: "{{ postgres_inventory_host }}"
  become: true
  register: cm_db_list
  changed_when: false

- name: CM DBs present — skipping
  ansible.builtin.debug:
    msg: CM DBs present — skipping
  when:
    - scm_db_name in (cm_db_list.stdout_lines | map('trim') | list)
    - cm_cms_reports_manager_db_name in (cm_db_list.stdout_lines | map('trim') | list)

- name: Create CM PostgreSQL databases when scm or Reports Manager database is missing
  when: >
    scm_db_name not in (cm_db_list.stdout_lines | map('trim') | list)
    or cm_cms_reports_manager_db_name not in (cm_db_list.stdout_lines | map('trim') | list)
  block:
    - name: Generate CM database init SQL script from template
      ansible.builtin.template:
        src: templates/create_cm_dbs.sql.j2
        dest: /tmp/init.sql
        mode: "0644"
      delegate_to: "{{ postgres_inventory_host }}"
      become: true

    - name: Run CM database init SQL on PostgreSQL
      ansible.builtin.command:
        argv:
          - psql
          - -v
          - ON_ERROR_STOP=1
          - -h
          - 127.0.0.1
          - -p
          - "{{ postgres_port | string }}"
          - -U
          - "{{ postgres_user }}"
          - -d
          - "{{ postgres_db }}"
          - -f
          - /tmp/init.sql
      environment:
        PGPASSWORD: "{{ postgres_password }}"
      delegate_to: "{{ postgres_inventory_host }}"
      become: true
      register: cm_db_init_sql
      changed_when: cm_db_init_sql.rc == 0
      failed_when: cm_db_init_sql.rc | default(1) | int != 0

---
# Idempotent CM DBs (scm + Reports Manager rman) on postgres_inventory_host (e.g. cldr-mngr).
# Ansible controller may be Mac, Ubuntu, or RHEL — irrelevant: every list/create task delegates to the
# DB host only (no psql, postgresql modules, or RHEL-specific DB paths on localhost/controller).
# Root + PGPASSWORD + TCP (postgres_ensure_cm_db_psql_host) — no become_user postgres.
# When both databases exist: one debug line and no further tasks in this import.

- name: Resolve PostgreSQL inventory host for CM databases
  ansible.builtin.import_tasks: resolve_postgres_inventory.yml

- name: Stat versioned psql on PostgreSQL DB host (RHEL PGDG path, before OS family / PGDG)
  ansible.builtin.stat:
    path: "/usr/pgsql-{{ postgresql_version }}/bin/psql"
  delegate_to: "{{ postgres_inventory_host }}"
  become: true
  register: postgres_db_host_psql_rhel_stat

- name: Stat versioned psql on PostgreSQL DB host (Debian path)
  ansible.builtin.stat:
    path: "/usr/lib/postgresql/{{ postgresql_version }}/bin/psql"
  delegate_to: "{{ postgres_inventory_host }}"
  become: true
  register: postgres_db_host_psql_debian_stat

- name: Resolve psql in PATH on PostgreSQL DB host when versioned binaries missing
  ansible.builtin.command:
    cmd: which psql
  delegate_to: "{{ postgres_inventory_host }}"
  become: true
  register: postgres_db_host_which_psql
  changed_when: false
  failed_when: false
  when:
    - not (postgres_db_host_psql_rhel_stat.stat.exists | default(false))
    - not (postgres_db_host_psql_debian_stat.stat.exists | default(false))

- name: Record whether PostgreSQL client is already on DB host
  ansible.builtin.set_fact:
    postgres_db_host_psql_present: >-
      {{
        (postgres_db_host_psql_rhel_stat.stat.exists | default(false))
        or (postgres_db_host_psql_debian_stat.stat.exists | default(false))
        or (
          (postgres_db_host_which_psql.rc | default(1) | int) == 0
          and (postgres_db_host_which_psql.stdout | default('') | trim) | length > 0
        )
      }}

- name: Record PostgreSQL DB host psql path from RHEL versioned install
  ansible.builtin.set_fact:
    postgres_db_host_psql_cmd: "/usr/pgsql-{{ postgresql_version }}/bin/psql"
  when:
    - postgres_db_host_psql_cmd is not defined
    - postgres_db_host_psql_rhel_stat.stat.exists | default(false)

- name: Record PostgreSQL DB host psql path from Debian versioned install
  ansible.builtin.set_fact:
    postgres_db_host_psql_cmd: "/usr/lib/postgresql/{{ postgresql_version }}/bin/psql"
  when:
    - postgres_db_host_psql_cmd is not defined
    - postgres_db_host_psql_debian_stat.stat.exists | default(false)

- name: Record PostgreSQL DB host psql path from PATH
  ansible.builtin.set_fact:
    postgres_db_host_psql_cmd: "{{ postgres_db_host_which_psql.stdout | trim }}"
  when:
    - postgres_db_host_psql_cmd is not defined
    - (postgres_db_host_which_psql.rc | default(1) | int) == 0
    - (postgres_db_host_which_psql.stdout | default('') | trim) | length > 0

- name: PostgreSQL client on DB host — skipping PGDG install
  ansible.builtin.debug:
    msg: >-
      psql already present on {{ postgres_inventory_host }}
      ({{ postgres_db_host_psql_cmd }}) — skipping PGDG repo and client install
  when: postgres_db_host_psql_present | bool

- name: PostgreSQL client and PGDG on DB host when psql is missing
  when: not (postgres_db_host_psql_present | bool)
  block:
    - name: Gather minimal facts on PostgreSQL inventory host when OS family unknown
      ansible.builtin.setup:
        gather_subset:
          - min
      delegate_to: "{{ postgres_inventory_host }}"
      delegate_facts: true
      when:
        - postgres_db_host_os_family is not defined
        - hostvars[postgres_inventory_host]['ansible_os_family'] is not defined
        - ansible_os_family is not defined or inventory_hostname != postgres_inventory_host

    - name: Query RHEL macro on PostgreSQL DB host to detect RedHat OS family
      ansible.builtin.command:
        argv:
          - rpm
          - -E
          - '%{rhel}'
      delegate_to: "{{ postgres_inventory_host }}"
      become: true
      register: postgres_db_host_rhel_macro_detect
      changed_when: false
      failed_when: false
      when: postgres_db_host_os_family is not defined

    - name: Record PostgreSQL DB host OS family as RedHat from rpm RHEL macro
      ansible.builtin.set_fact:
        postgres_db_host_os_family: RedHat
      when:
        - postgres_db_host_os_family is not defined
        - postgres_db_host_rhel_macro_detect.stdout | default('') | trim in ['8', '9']

    - name: Record PostgreSQL DB host OS family from DB host RedHat distribution facts
      ansible.builtin.set_fact:
        postgres_db_host_os_family: RedHat
      when:
        - postgres_db_host_os_family is not defined
        - hostvars[postgres_inventory_host]['ansible_distribution'] | default('') == 'RedHat'

    - name: Record PostgreSQL DB host OS family from DB host Debian-family distribution facts
      ansible.builtin.set_fact:
        postgres_db_host_os_family: Debian
      when:
        - postgres_db_host_os_family is not defined
        - hostvars[postgres_inventory_host]['ansible_distribution'] | default('') in ['Debian', 'Ubuntu']

    - name: Record PostgreSQL DB host OS family from play host when play runs on DB host
      ansible.builtin.set_fact:
        postgres_db_host_os_family: "{{ ansible_os_family }}"
      when:
        - postgres_db_host_os_family is not defined
        - inventory_hostname == postgres_inventory_host
        - ansible_os_family is defined
        - ansible_os_family in ['RedHat', 'Debian']

    - name: Record PostgreSQL DB host OS family from DB host hostvars as last resort
      ansible.builtin.set_fact:
        postgres_db_host_os_family: >-
          {{ hostvars[postgres_inventory_host]['ansible_os_family'] | default('') }}
      when:
        - postgres_db_host_os_family is not defined
        - hostvars[postgres_inventory_host]['ansible_os_family'] | default('') in ['RedHat', 'Debian']

    - name: Require PostgreSQL DB host OS family for client package install
      ansible.builtin.assert:
        that:
          - postgres_db_host_os_family in ['RedHat', 'Debian']
        fail_msg: >-
          Could not determine OS family for PostgreSQL host {{ postgres_inventory_host }}.
          Ensure the host is reachable and facts can be gathered, or set postgres_db_host_os_family.

    - name: Default PostgreSQL DB host psql command when client install will provide PATH
      ansible.builtin.set_fact:
        postgres_db_host_psql_cmd: psql
      when: postgres_db_host_psql_cmd is not defined

    - name: Query RHEL major on PostgreSQL DB host for PGDG (rpm macro)
      ansible.builtin.command:
        argv:
          - rpm
          - -E
          - '%{rhel}'
      delegate_to: "{{ postgres_inventory_host }}"
      become: true
      register: rhel_major_cmd
      changed_when: false
      when: postgres_db_host_os_family == 'RedHat'

    - name: Record PostgreSQL DB host EL major from rpm on DB host
      ansible.builtin.set_fact:
        postgres_db_host_el_major: "{{ rhel_major_cmd.stdout | trim }}"
      when:
        - postgres_db_host_os_family == 'RedHat'
        - postgres_db_host_el_major is not defined
        - rhel_major_cmd.stdout | default('') | trim in ['8', '9']

    - name: Record PostgreSQL DB host EL major from RedHat distribution facts on DB host
      ansible.builtin.set_fact:
        postgres_db_host_el_major: >-
          {{ hostvars[postgres_inventory_host]['ansible_distribution_major_version'] | string }}
      when:
        - postgres_db_host_os_family == 'RedHat'
        - postgres_db_host_el_major is not defined
        - hostvars[postgres_inventory_host]['ansible_distribution'] | default('') == 'RedHat'

    - name: Read PostgreSQL DB host redhat-release when EL major still unknown
      ansible.builtin.command:
        cmd: cat /etc/redhat-release
      delegate_to: "{{ postgres_inventory_host }}"
      become: true
      register: postgres_db_host_redhat_release
      changed_when: false
      when:
        - postgres_db_host_os_family == 'RedHat'
        - postgres_db_host_el_major is not defined

    - name: Record PostgreSQL DB host EL major from redhat-release text
      ansible.builtin.set_fact:
        postgres_db_host_el_major: >-
          {{
            '9'
            if ' 9' in (postgres_db_host_redhat_release.stdout | default(''))
            else '8'
            if ' 8' in (postgres_db_host_redhat_release.stdout | default(''))
            else ''
          }}
      when:
        - postgres_db_host_os_family == 'RedHat'
        - postgres_db_host_el_major is not defined
        - (postgres_db_host_redhat_release.stdout | default('') | trim) | length > 0

    - name: Query machine hardware name on PostgreSQL DB host for PGDG RPM URL
      ansible.builtin.command:
        cmd: uname -m
      delegate_to: "{{ postgres_inventory_host }}"
      become: true
      register: postgres_db_host_uname_m
      changed_when: false
      when:
        - postgres_db_host_os_family == 'RedHat'
        - postgres_db_host_architecture is not defined

    - name: Record PostgreSQL DB host architecture from uname on DB host
      ansible.builtin.set_fact:
        postgres_db_host_architecture: >-
          {{
            'aarch64'
            if postgres_db_host_uname_m.stdout | trim in ['aarch64', 'arm64']
            else 'x86_64'
            if postgres_db_host_uname_m.stdout | trim in ['x86_64', 'amd64']
            else postgres_db_host_uname_m.stdout | trim
          }}
      when:
        - postgres_db_host_os_family == 'RedHat'
        - postgres_db_host_architecture is not defined
        - (postgres_db_host_uname_m.stdout | default('') | trim) | length > 0

    - name: Record PostgreSQL DB host architecture from RedHat host facts when uname missing
      ansible.builtin.set_fact:
        postgres_db_host_architecture: >-
          {{
            'aarch64'
            if hostvars[postgres_inventory_host]['ansible_architecture'] in ['aarch64', 'arm64']
            else 'x86_64'
            if hostvars[postgres_inventory_host]['ansible_architecture'] in ['x86_64', 'amd64']
            else hostvars[postgres_inventory_host]['ansible_architecture'] | default('') | string
          }}
      when:
        - postgres_db_host_os_family == 'RedHat'
        - postgres_db_host_architecture is not defined
        - hostvars[postgres_inventory_host]['ansible_distribution'] | default('') == 'RedHat'

    - name: Require supported RHEL major version for PGDG repository RPM URL
      ansible.builtin.assert:
        that:
          - postgres_db_host_el_major | string in ['8', '9']
        fail_msg: >-
          PostgreSQL DB host {{ postgres_inventory_host }} resolved EL major
          '{{ postgres_db_host_el_major }}' (expected rpm -E %%{rhel} on the DB host; ignore
          polluted hostvars such as Amazon Linux 2023 major 2023).
          PGDG reporpms URLs use EL-8 or EL-9 only.
      when: postgres_db_host_os_family == 'RedHat'

    - name: Download PostgreSQL PGDG repository RPM on DB host (RedHat family)
      ansible.builtin.get_url:
        url: >-
          https://download.postgresql.org/pub/repos/yum/reporpms/EL-{{
            postgres_db_host_el_major
          }}-{{ postgres_db_host_architecture }}/pgdg-redhat-repo-latest.noarch.rpm
        dest: /tmp/pgdg-redhat-repo-latest.noarch.rpm
        mode: "0644"
      delegate_to: "{{ postgres_inventory_host }}"
      become: true
      when: postgres_db_host_os_family == 'RedHat'

    - name: Stat PostgreSQL PGDG repository RPM on DB host (RedHat family)
      ansible.builtin.stat:
        path: /tmp/pgdg-redhat-repo-latest.noarch.rpm
      delegate_to: "{{ postgres_inventory_host }}"
      become: true
      register: postgres_db_host_pgdg_rpm_stat
      when: postgres_db_host_os_family == 'RedHat'

    - name: Install PostgreSQL PGDG repository from local RPM on DB host (RedHat family)
      ansible.builtin.dnf:
        name: /tmp/pgdg-redhat-repo-latest.noarch.rpm
        state: present
        disable_gpg_check: true
      delegate_to: "{{ postgres_inventory_host }}"
      become: true
      when:
        - postgres_db_host_os_family == 'RedHat'
        - postgres_db_host_pgdg_rpm_stat.stat.exists | default(false)

    - name: Ensure PostgreSQL client on DB host (RedHat family)
      ansible.builtin.package:
        name: "postgresql{{ postgresql_version }}"
        state: present
      delegate_to: "{{ postgres_inventory_host }}"
      become: true
      when: postgres_db_host_os_family == 'RedHat'

    - name: Ensure PostgreSQL client on DB host (Debian family)
      ansible.builtin.package:
        name: "postgresql-client-{{ postgresql_version }}"
        state: present
      delegate_to: "{{ postgres_inventory_host }}"
      become: true
      when: postgres_db_host_os_family == 'Debian'

- name: List CM scm and Reports Manager databases on PostgreSQL
  ansible.builtin.command:
    argv:
      - "{{ postgres_db_host_psql_cmd }}"
      - -h
      - "{{ postgres_ensure_cm_db_psql_host }}"
      - -p
      - "{{ postgres_port | string }}"
      - -U
      - "{{ postgres_user }}"
      - -d
      - "{{ postgres_db }}"
      - -tAc
      - "SELECT datname FROM pg_database WHERE datname IN ('{{ scm_db_name }}','{{ cm_cms_reports_manager_db_name }}')"
  environment:
    PGPASSWORD: "{{ postgres_password }}"
  delegate_to: "{{ postgres_inventory_host }}"
  become: true
  register: cm_db_list
  changed_when: false

- name: CM DBs present — skipping
  ansible.builtin.debug:
    msg: CM DBs present — skipping
  when:
    - scm_db_name in (cm_db_list.stdout_lines | map('trim') | list)
    - cm_cms_reports_manager_db_name in (cm_db_list.stdout_lines | map('trim') | list)

- name: Create CM PostgreSQL databases when scm or Reports Manager database is missing
  when: >
    scm_db_name not in (cm_db_list.stdout_lines | map('trim') | list)
    or cm_cms_reports_manager_db_name not in (cm_db_list.stdout_lines | map('trim') | list)
  block:
    - name: Generate CM database init SQL script from template
      ansible.builtin.template:
        src: templates/create_cm_dbs.sql.j2
        dest: /tmp/init.sql
        mode: "0644"
      delegate_to: "{{ postgres_inventory_host }}"
      become: true

    - name: Run CM database init SQL on PostgreSQL
      ansible.builtin.command:
        argv:
          - "{{ postgres_db_host_psql_cmd }}"
          - -v
          - ON_ERROR_STOP=1
          - -h
          - "{{ postgres_ensure_cm_db_psql_host }}"
          - -p
          - "{{ postgres_port | string }}"
          - -U
          - "{{ postgres_user }}"
          - -d
          - "{{ postgres_db }}"
          - -f
          - /tmp/init.sql
      environment:
        PGPASSWORD: "{{ postgres_password }}"
      delegate_to: "{{ postgres_inventory_host }}"
      become: true
      register: cm_db_init_sql
      changed_when: cm_db_init_sql.rc == 0
      failed_when: cm_db_init_sql.rc | default(1) | int != 0

---
# Idempotent CM PostgreSQL databases (roles + CREATE DATABASE). Same SQL as playbook 23.
# Delegates to postgres_inventory_host when scm or Reports Manager (rman) database is missing
# (e.g. partial 23 init after CREATE DATABASE failed inside PL/pgSQL, or scm created via scm_prepare only).
# Use postgres_host_fqdn (not ansible_fqdn): imported from localhost plays (29) without gather_facts.
# TCP login_user/login_password on the delegated host (become root only); do not become_user postgres
# (RHEL targets often lack ACL support for Ansible's unprivileged temp-file chmod).

- name: Check whether CM scm database exists in PostgreSQL
  ansible.builtin.shell: |
    PGPASSWORD={{ postgres_password }} psql -h {{ postgres_host_fqdn }} -p {{ postgres_port }} -U {{ postgres_user }} -d {{ postgres_db }} -tAc "SELECT 1 FROM pg_database WHERE datname='{{ scm_db_name }}'"
  delegate_to: "{{ postgres_inventory_host }}"
  become: true
  register: cm_scm_database_check
  changed_when: false
  failed_when: cm_scm_database_check.rc | default(1) | int != 0
  no_log: true

- name: Check whether Reports Manager database exists in PostgreSQL
  ansible.builtin.shell: |
    PGPASSWORD={{ postgres_password }} psql -h {{ postgres_host_fqdn }} -p {{ postgres_port }} -U {{ postgres_user }} -d {{ postgres_db }} -tAc "SELECT 1 FROM pg_database WHERE datname='{{ cm_cms_reports_manager_db_name }}'"
  delegate_to: "{{ postgres_inventory_host }}"
  become: true
  register: cm_rman_database_check
  changed_when: false
  failed_when: cm_rman_database_check.rc | default(1) | int != 0
  no_log: true

- name: Create CM PostgreSQL databases and roles when scm or Reports Manager database is missing
  when: >
    (cm_scm_database_check.stdout | default('') | trim != '1')
    or (cm_rman_database_check.stdout | default('') | trim != '1')
  block:
    - name: Generate CM database init SQL script from template
      ansible.builtin.template:
        src: templates/create_cm_dbs.sql.j2
        dest: /tmp/init.sql
        owner: postgres
        group: postgres
        mode: "0644"
      delegate_to: "{{ postgres_inventory_host }}"

    - name: Run CM database init SQL on PostgreSQL
      ansible.builtin.shell: |
        PGPASSWORD={{ postgres_password }} psql -v ON_ERROR_STOP=1 -h {{ postgres_host_fqdn }} -p {{ postgres_port }} -U {{ postgres_user }} -d {{ postgres_db }} -f /tmp/init.sql
      delegate_to: "{{ postgres_inventory_host }}"
      register: cm_db_init_sql
      changed_when: cm_db_init_sql.rc == 0
      failed_when: >
        (cm_db_init_sql.rc | default(1) | int != 0) or
        ('ERROR' in (cm_db_init_sql.stderr | default('')))

    - name: Display CM database init SQL output
      ansible.builtin.debug:
        msg: "{{ cm_db_init_sql.stdout | default('') | replace('\t', '    ') | split('\n') }}"
      when: cm_db_init_sql.stdout is defined

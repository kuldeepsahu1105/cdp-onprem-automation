---
- name: Load deployment portal context from localhost
  ansible.builtin.set_fact:
    deployment_portal_context: "{{ hostvars['localhost']['deployment_portal_context'] }}"
    deployment_portal_anchor_fqdn: "{{ hostvars['localhost']['deployment_portal_anchor_fqdn'] }}"
    caddy_vhost_urls: "{{ hostvars['localhost']['caddy_vhost_urls'] | default({}) }}"
    caddy_vhost_urls_external: "{{ hostvars['localhost']['caddy_vhost_urls_external'] | default({}) }}"
    caddy_vhost_urls_vpc: "{{ hostvars['localhost']['caddy_vhost_urls_vpc'] | default({}) }}"
    deployment_portal_cm_fqdn: "{{ hostvars['localhost']['deployment_portal_cm_fqdn'] }}"
    deployment_portal_postgres_fqdn: >-
      {{
        hostvars['localhost']['deployment_portal_postgres_fqdn']
        | default(postgres_host_fqdn)
      }}
    deployment_portal_cm_upstream_host: "{{ hostvars['localhost']['deployment_portal_cm_upstream_host'] | default('') }}"
    deployment_portal_ops_public_ip: "{{ hostvars['localhost']['deployment_portal_ops_public_ip'] | default('') }}"
    deployment_portal_ops_private_ip: "{{ hostvars['localhost']['deployment_portal_ops_private_ip'] | default('') }}"
    deployment_portal_ops_client_host: "{{ hostvars['localhost']['deployment_portal_ops_client_host'] | default('') }}"
    deployment_portal_access_profile_effective: "{{ hostvars['localhost']['deployment_portal_access_profile_effective'] | default('cloud') }}"
    deployment_portal_access_urls: "{{ hostvars['localhost']['deployment_portal_access_urls'] | default({}) }}"
    deployment_portal_ipa_fqdn: "{{ hostvars['localhost']['deployment_portal_ipa_fqdn'] | default('') }}"
    ipa_caddy_public_hostname: "{{ hostvars['localhost']['ipa_caddy_public_hostname'] | default('') }}"
    deployment_portal_has_ipa: "{{ hostvars['localhost']['deployment_portal_has_ipa'] | default(false) }}"
    deployment_portal_ecs_present: "{{ hostvars['localhost']['deployment_portal_ecs_present'] | default(false) }}"
    deployment_portal_base_master_fqdn: >-
      {{
        hostvars['localhost']['deployment_portal_base_master_fqdn']
        | default(deployment_portal_base_master_fqdn | default(''))
      }}
    pgadmin_caddy_public_url: "{{ hostvars['localhost']['pgadmin_caddy_public_url'] | default('') }}"
    deployment_portal_public_host: "{{ hostvars['localhost']['deployment_portal_public_host'] | default('') }}"
    cm_frontend_url_effective: "{{ hostvars['localhost']['cm_frontend_url_effective'] | default('') }}"
    deployment_portal_monitoring_deployed: "{{ hostvars['localhost']['deployment_portal_monitoring_deployed'] | default(false) }}"
    deployment_portal_monitoring_routes_enabled: >-
      {{
        hostvars['localhost']['deployment_portal_monitoring_routes_enabled']
        | default(hostvars['localhost']['deployment_portal_context'].monitoring.enabled | default(false))
        | bool
      }}
    deployment_portal_operator_access: "{{ hostvars['localhost']['deployment_portal_operator_access'] | default({}) }}"
    deployment_portal_ssh_private_key_path: "{{ hostvars['localhost']['deployment_portal_ssh_private_key_path'] | default('') }}"
    deployment_portal_ssh_download_basename: "{{ hostvars['localhost']['deployment_portal_ssh_download_basename'] | default('cluster-access.pem') }}"
    deployment_portal_ssh_ec2_key_path: "{{ hostvars['localhost']['deployment_portal_ssh_ec2_key_path'] | default('') }}"
    deployment_portal_ssh_autotls_key_path: "{{ hostvars['localhost']['deployment_portal_ssh_autotls_key_path'] | default('') }}"
    deployment_portal_ssh_export_keys: "{{ hostvars['localhost']['deployment_portal_ssh_export_keys'] | default([]) }}"
    deployment_portal_ssh_keys_expose_effective: "{{ hostvars['localhost']['deployment_portal_ssh_keys_expose_effective'] | default(false) }}"
    deployment_portal_basic_auth_hash: "{{ hostvars['localhost']['deployment_portal_basic_auth_hash'] | default('') }}"
    deployment_portal_inventory_hosts: "{{ hostvars['localhost']['deployment_portal_inventory_hosts'] | default([]) }}"
    deployment_portal_ecs_api_cache: "{{ hostvars['localhost']['deployment_portal_ecs_api_cache'] | default({}) }}"
    ipa_caddy_modern_public_url: "{{ hostvars['localhost']['ipa_caddy_modern_public_url'] | default('') }}"
    ipa_caddy_legacy_public_url: "{{ hostvars['localhost']['ipa_caddy_legacy_public_url'] | default('') }}"

- name: Ensure operator-access template facts from localhost on ops host
  ansible.builtin.import_tasks: deployment_portal_operator_access_facts_from_localhost.yml

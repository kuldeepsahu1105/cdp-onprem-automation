---
# Top-level facts for Caddy vhost URLs (portal context). CM/ECS are not served via Caddy.
# Requires caddy_vhost_urls_external (from build_deployment_portal_facts) when Caddy is enabled.

- name: Default empty Caddy service public URLs when vhosts disabled
  ansible.builtin.set_fact:
    deployment_portal_public_host: ""
    pgadmin_caddy_public_url: ""
    ipa_caddy_public_url: ""
    ipa_caddy_modern_public_url: ""
    ipa_caddy_legacy_public_url: ""
  when: not (caddy_vhost_enabled | default(false) | bool)

- name: Set deployment portal public host and pgAdmin Caddy URL from vhost map
  ansible.builtin.set_fact:
    deployment_portal_public_host: "{{ caddy_vhost_urls_external.portal.hostname | default('') | trim }}"
    pgadmin_caddy_public_url: "{{ caddy_vhost_urls_external.pgadmin.url | default('') | trim }}"
  when:
    - caddy_vhost_enabled | default(false) | bool
    - caddy_vhost_urls_external is defined
    - caddy_vhost_urls_external.portal is defined
    - caddy_vhost_urls_external.pgadmin is defined

- name: Set FreeIPA Caddy public URLs from vhost map
  ansible.builtin.set_fact:
    ipa_caddy_public_url: "{{ caddy_vhost_urls_external.ipa.url | default('') | trim }}"
    ipa_caddy_modern_public_url: >-
      {{
        (caddy_vhost_urls_external.ipa.url | default('') | trim | regex_replace('/+$', ''))
        + '/ipa/modern-ui/'
      }}
    ipa_caddy_legacy_public_url: >-
      {{
        (caddy_vhost_urls_external.ipa.url | default('') | trim | regex_replace('/+$', ''))
        + '/ipa/ui'
      }}
  when:
    - caddy_vhost_enabled | default(false) | bool
    - deployment_portal_has_ipa | default(false) | bool
    - caddy_vhost_urls_external is defined
    - caddy_vhost_urls_external.ipa is defined
    - caddy_vhost_urls_external.ipa.url | default('') | length > 0

- name: Clear FreeIPA Caddy public URLs when IPA vhost is absent
  ansible.builtin.set_fact:
    ipa_caddy_public_url: ""
    ipa_caddy_modern_public_url: ""
    ipa_caddy_legacy_public_url: ""
  when:
    - caddy_vhost_enabled | default(false) | bool
    - not (
        deployment_portal_has_ipa | default(false) | bool
        and caddy_vhost_urls_external is defined
        and caddy_vhost_urls_external.ipa is defined
        and (caddy_vhost_urls_external.ipa.url | default('') | length > 0)
      )

- name: Resolve CM frontend URL for Cloudera Manager (direct only; optional cm_external_url override)
  ansible.builtin.set_fact:
    cm_frontend_url_effective: >-
      {{
        (cm_external_url | default('') | trim | regex_replace('/+$', ''))
      }}

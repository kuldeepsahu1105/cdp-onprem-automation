---
# RKE2 automatically applies manifests from this directory while bootstrapping.
# Stage CoreDNS values before CM starts First Run so the first CoreDNS pods use
# identity DNS instead of racing a later ConfigMap repair.

- name: Resolve ECS CoreDNS bootstrap forwarders
  ansible.builtin.set_fact:
    ecs_coredns_bootstrap_forwarders: >-
      {{
        (
          ecs_coredns_forwarders
          if ecs_coredns_forwarders | default([]) | length > 0
          else (
            [
              hostvars[groups['ipaserver'][0]].private_ip | default(''),
              hostvars[groups['ipaserver'][0]].ansible_host | default('')
            ]
            if identity_provider_effective | default('freeipa') == 'freeipa'
            and groups.get('ipaserver', []) | length > 0
            else (
              ad_dns_servers | default([])
              if identity_provider_effective | default('') == 'ad'
              else []
            )
          )
        )
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | unique
        | list
      }}

- name: Require ECS CoreDNS bootstrap forwarders before First Run
  ansible.builtin.assert:
    that:
      - ecs_coredns_bootstrap_forwarders | length > 0
    fail_msg: >-
      Refusing to start ECS First Run without an initial CoreDNS identity-DNS
      forwarder. Set ecs_coredns_forwarders, provide a FreeIPA inventory
      address, or configure ad_dns_servers.

- name: Require ECS bootstrap inventory hosts
  ansible.builtin.assert:
    that:
      - groups.get('cldr-mngr', []) | length > 0
      - groups.get(ecs_cluster_master_group, []) | length > 0
    fail_msg: >-
      ECS First Run requires Cloudera Manager and ECS master inventory hosts
      before the initial CoreDNS policy can be staged.

- name: Resolve ECS CoreDNS bootstrap static records
  ansible.builtin.set_fact:
    ecs_coredns_bootstrap_static_records: >-
      {{
        [
          {
            'fqdn': (
              hostvars[groups['cldr-mngr'][0]].cldr_hostname
              + '.'
              + cluster_domain
            ),
            'address': (
              hostvars[groups['cldr-mngr'][0]].private_ip
              | default(
                  hostvars[groups['cldr-mngr'][0]].ansible_host,
                  true
                )
            )
          },
          {
            'fqdn': ecs_console_host_prefix + '.' + ecs_app_domain,
            'address': (
              hostvars[groups[ecs_cluster_master_group][0]].private_ip
              | default(
                  hostvars[groups[ecs_cluster_master_group][0]].ansible_host,
                  true
                )
            )
          }
        ]
        + (
          [
            {
              'fqdn': ipa_kdc_host,
              'address': (
                hostvars[groups['ipaserver'][0]].private_ip
                | default(
                    hostvars[groups['ipaserver'][0]].ansible_host,
                    true
                  )
              )
            }
          ]
          if identity_provider_effective | default('freeipa') == 'freeipa'
          and groups.get('ipaserver', []) | length > 0
          else []
        )
      }}

- name: Require ECS CoreDNS bootstrap static records
  ansible.builtin.assert:
    that:
      - ecs_coredns_bootstrap_static_records | length >= 2
      - >-
        ecs_coredns_bootstrap_static_records
        | map(attribute='fqdn')
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | list
        | length
        == ecs_coredns_bootstrap_static_records | length
      - >-
        ecs_coredns_bootstrap_static_records
        | map(attribute='address')
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | list
        | length
        == ecs_coredns_bootstrap_static_records | length
    fail_msg: >-
      ECS First Run requires static bootstrap A records for Cloudera Manager,
      the ECS console, and FreeIPA when selected.

- name: Render ECS CoreDNS bootstrap hosts configuration
  ansible.builtin.set_fact:
    ecs_coredns_bootstrap_hosts_config: |-
      {% for record in ecs_coredns_bootstrap_static_records %}
      {{ record.address }} {{ record.fqdn }}
      {% endfor %}
      fallthrough

- name: Create RKE2 server manifest directory before First Run
  ansible.builtin.file:
    path: "{{ ecs_rke2_server_manifests_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  delegate_to: "{{ groups[ecs_cluster_master_group][0] }}"
  connection: ssh

- name: Stage initial RKE2 CoreDNS forwarding policy before First Run
  ansible.builtin.copy:
    dest: "{{ ecs_rke2_coredns_helm_config_path }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      apiVersion: helm.cattle.io/v1
      kind: HelmChartConfig
      metadata:
        name: rke2-coredns
        namespace: kube-system
      spec:
        valuesContent: |-
          servers:
            - zones:
                - zone: .
              use_tcp: true
              port: 53
              plugins:
                - name: errors
                - name: health
                  configBlock: |-
                    lameduck 10s
                - name: ready
                - name: kubernetes
                  parameters: cluster.local in-addr.arpa ip6.arpa
                  configBlock: |-
                    pods insecure
                    fallthrough in-addr.arpa ip6.arpa
                    ttl 30
                - name: prometheus
                  parameters: 0.0.0.0:9153
                - name: hosts
                  configBlock: |-
      {{ ecs_coredns_bootstrap_hosts_config | indent(20, true) }}
                - name: forward
                  parameters: ". {{ ecs_coredns_bootstrap_forwarders | join(' ') }}"
                - name: cache
                  parameters: "30"
                - name: loop
                - name: reload
                - name: loadbalance
  become: true
  delegate_to: "{{ groups[ecs_cluster_master_group][0] }}"
  connection: ssh

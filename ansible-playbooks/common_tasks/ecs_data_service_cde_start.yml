---
- name: CDE | Resolve human service creator CRN
  ansible.builtin.set_fact:
    ecs_cde_creator_crn_effective: >-
      {{
        ecs_cde_creator_crn | default('') | trim
        if (ecs_cde_creator_crn | default('') | trim | length > 0)
        else ecs_ldap_admin_user_crn | default('') | trim
      }}
  when: not (ecs_cde_service_existing | default(false) | bool)

- name: CDE | Require human service creator CRN
  ansible.builtin.assert:
    that:
      - ecs_cde_creator_crn_effective | length > 0
      - "':user:' in ecs_cde_creator_crn_effective"
      - "':machineuser:' not in (ecs_cde_creator_crn_effective | lower)"
    fail_msg: >-
      Fresh CDE creation requires a human user CRN because private-cloud CDE
      copies the authenticated workload username into the Kubernetes
      Owner label. Machine-user workload usernames contain '/', which is not
      valid in a Kubernetes label value. Set ecs_cde_creator_crn or enable the
      ECS LDAP admin lookup so ecs_ldap_admin_user_crn is available.
  when: not (ecs_cde_service_existing | default(false) | bool)

- name: CDE | Create temporary access key for human service creator
  ansible.builtin.command:
    argv: >-
      {{
        ecs_data_services_cdp_cli_prefix
        + [
          'iam',
          'create-user-access-key',
          '--user',
          ecs_cde_creator_crn_effective,
          '--type',
          'V2'
        ]
      }}
  environment: "{{ ecs_cdp_cli_environment }}"
  register: ecs_cde_creator_access_key_create
  no_log: true
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when: not (ecs_cde_service_existing | default(false) | bool)

- name: CDE | Parse temporary creator access key response
  ansible.builtin.set_fact:
    ecs_cde_creator_access_key_response: >-
      {{ ecs_cde_creator_access_key_create.stdout | from_json }}
  no_log: true
  when: not (ecs_cde_service_existing | default(false) | bool)

- name: CDE | Resolve temporary creator access key
  ansible.builtin.set_fact:
    ecs_cde_creator_access_key: >-
      {{
        {
          'accessKeyId': (
            ecs_cde_creator_access_key_response.get('accessKey', {}).get(
              'accessKeyId',
              ecs_cde_creator_access_key_response.get('accessKeyId', '')
            )
          ),
          'actorCrn': (
            ecs_cde_creator_access_key_response.get('accessKey', {}).get(
              'actorCrn',
              ecs_cde_creator_access_key_response.get('actorCrn', '')
            )
          ),
          'privateKey': (
            ecs_cde_creator_access_key_response.get(
              'privateKey',
              ecs_cde_creator_access_key_response.get('accessKey', {}).get(
                'privateKey',
                ''
              )
            )
          )
        }
      }}
  no_log: true
  when: not (ecs_cde_service_existing | default(false) | bool)

- name: CDE | Require temporary key to belong to human service creator
  ansible.builtin.assert:
    that:
      - ecs_cde_creator_access_key.actorCrn == ecs_cde_creator_crn_effective
      - ecs_cde_creator_access_key.accessKeyId | length > 0
      - ecs_cde_creator_access_key.privateKey | length > 0
    fail_msg: >-
      IAM did not return a usable temporary access key owned by
      {{ ecs_cde_creator_crn_effective }}.
  when: not (ecs_cde_service_existing | default(false) | bool)

- name: CDE | Write temporary human creator credentials
  ansible.builtin.copy:
    dest: "{{ ecs_ds_cdp_profile_dir.path }}/cde-creator-credentials"
    mode: "0600"
    content: |
      [default]
      cdp_access_key_id = {{ ecs_cde_creator_access_key.accessKeyId }}
      cdp_private_key = {{ ecs_cde_creator_access_key.privateKey | trim }}
  no_log: true
  changed_when: false
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when: not (ecs_cde_service_existing | default(false) | bool)

- name: CDE | Resolve human creator CLI environment
  ansible.builtin.set_fact:
    ecs_cde_creator_cli_environment: >-
      {{
        ecs_cdp_cli_environment
        | combine(
            {
              'CDP_SHARED_CREDENTIALS_FILE':
                ecs_ds_cdp_profile_dir.path + '/cde-creator-credentials',
              'CDP_CREDENTIALS_PATH':
                ecs_ds_cdp_profile_dir.path + '/cde-creator-credentials'
            }
          )
      }}
  when: not (ecs_cde_service_existing | default(false) | bool)

- name: CDE | Launch Data Engineering provisioning
  cloudera.cloud.de:
    environment: "{{ ecs_cdp_environment_name }}"
    name: "{{ ecs_cde_service_name_effective }}"
    instance_type: "{{ ecs_cde_instance_type }}"
    cpu_requests: "{{ ecs_cde_cpu_requests_effective }}"
    memory_requests: "{{ ecs_cde_memory_requests_effective }}"
    resource_pool: "{{ ecs_cde_resource_pool_effective }}"
    endpoint_tls: "{{ ecs_data_services_verify_tls | default(false) | bool }}"
    wait: true
    timeout: "{{ ecs_data_services_module_wait_timeout | int }}"
    delay: "{{ ecs_data_services_status_wait_delay | int }}"
    state: present
  environment: "{{ ecs_cde_creator_cli_environment }}"
  async: "{{ ecs_data_services_async_timeout | int }}"
  poll: 0
  register: ecs_cde_service_job
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when:
    - "'cde' in (ecs_data_services_install_names | default([]))"
    - not (ecs_cde_service_existing | default(false) | bool)

- name: CDE | Wait for adopted service without mutating its sizing
  cloudera.cloud.de_info:
    environment: "{{ ecs_cdp_environment_name }}"
    name: "{{ ecs_cde_service_name_effective }}"
    endpoint_tls: "{{ ecs_data_services_verify_tls | default(false) | bool }}"
  environment: "{{ ecs_cdp_cli_environment }}"
  register: ecs_cde_existing_info
  until: >-
    (
      ecs_cde_existing_info.services | default([])
      | first | default({})
    ).status | default('') | lower
    in (ecs_cde_service_green_statuses | map('lower') | list)
    or (
      (
        ecs_cde_existing_info.services | default([])
        | first | default({})
      ).status | default('') | lower
      not in (ecs_cde_service_transitional_statuses | map('lower') | list)
    )
  retries: "{{ ecs_data_services_status_wait_retries | int }}"
  delay: "{{ ecs_data_services_status_wait_delay | int }}"
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when:
    - "'cde' in (ecs_data_services_install_names | default([]))"
    - ecs_cde_service_existing | default(false) | bool

- name: CDE | Record adopted service result
  ansible.builtin.set_fact:
    ecs_cde_service:
      finished: true
      service: "{{ ecs_cde_existing_info.services | first | default({}) }}"
      msg: >-
        Existing CDE service {{ ecs_cde_service_name_effective }} reached
        {{ (ecs_cde_existing_info.services | first | default({})).status | default('unknown') }}.
  when:
    - "'cde' in (ecs_data_services_install_names | default([]))"
    - ecs_cde_service_existing | default(false) | bool

---
- name: CDE | Launch Data Engineering provisioning
  cloudera.cloud.de:
    environment: "{{ ecs_cdp_environment_name }}"
    name: "{{ ecs_cde_service_name_effective }}"
    instance_type: "{{ ecs_cde_instance_type }}"
    cpu_requests: "{{ ecs_cde_cpu_requests }}"
    memory_requests: "{{ ecs_cde_memory_requests }}"
    resource_pool: "{{ ecs_cde_resource_pool }}"
    endpoint_tls: "{{ ecs_data_services_verify_tls | default(false) | bool }}"
    wait: true
    timeout: "{{ ecs_data_services_module_wait_timeout | int }}"
    delay: "{{ ecs_data_services_status_wait_delay | int }}"
    state: present
  environment: "{{ ecs_cdp_cli_environment }}"
  async: "{{ ecs_data_services_async_timeout | int }}"
  poll: 0
  register: ecs_cde_service_job
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when:
    - "'cde' in (ecs_data_services_install_names | default([]))"
    - not (ecs_cde_service_existing | default(false) | bool)

- name: CDE | Wait for adopted service without mutating its sizing
  cloudera.cloud.de_info:
    environment: "{{ ecs_cdp_environment_name }}"
    name: "{{ ecs_cde_service_name_effective }}"
    endpoint_tls: "{{ ecs_data_services_verify_tls | default(false) | bool }}"
  environment: "{{ ecs_cdp_cli_environment }}"
  register: ecs_cde_existing_info
  until: >-
    (
      ecs_cde_existing_info.services | default([])
      | first | default({})
    ).status | default('')
    is search('(?i)^(clustercreationcompleted|failed|create_failed|deleted)$')
  retries: "{{ ecs_data_services_status_wait_retries | int }}"
  delay: "{{ ecs_data_services_status_wait_delay | int }}"
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when:
    - "'cde' in (ecs_data_services_install_names | default([]))"
    - ecs_cde_service_existing | default(false) | bool

- name: CDE | Record adopted service result
  ansible.builtin.set_fact:
    ecs_cde_service:
      finished: true
      service: "{{ ecs_cde_existing_info.services | first | default({}) }}"
      msg: >-
        Existing CDE service {{ ecs_cde_service_name_effective }} reached
        {{ (ecs_cde_existing_info.services | first | default({})).status | default('unknown') }}.
  when:
    - "'cde' in (ecs_data_services_install_names | default([]))"
    - ecs_cde_service_existing | default(false) | bool

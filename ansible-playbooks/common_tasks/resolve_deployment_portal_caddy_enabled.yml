---
# Caddy reverse proxy (portal index, cm/ipa/pgadmin vhosts, monitoring UIs) is optional.
# Gate uses deployment_portal_enabled + caddy_vhost_enabled only.
# monitoring_stack_enabled controls monitoring container install inside sync (see
# deployment_portal_monitoring_routes_enabled); PORTAL bootstrap may pass -e monitoring_stack_enabled=false
# to defer Grafana/Prometheus to playbook 32 without skipping Caddy.

- name: Resolve whether deployment portal Caddy stack should run
  ansible.builtin.set_fact:
    deployment_portal_caddy_effective: >-
      {{
        (deployment_portal_enabled | default(true) | bool)
        and (caddy_vhost_enabled | default(true) | bool)
      }}

- name: Report deployment portal Caddy gate (Jenkins / PORTAL stage)
  ansible.builtin.debug:
    msg:
      - "deployment_portal_caddy_effective={{ deployment_portal_caddy_effective | bool }}"
      - "deployment_portal_enabled={{ deployment_portal_enabled | default(true) | bool }}"
      - "caddy_vhost_enabled={{ caddy_vhost_enabled | default(true) | bool }}"
      - "monitoring_stack_enabled={{ monitoring_stack_enabled | default(true) | bool }} (sync install/routes only; does not gate Caddy)"

- name: Fail when portal install was required but Caddy gate is off
  ansible.builtin.fail:
    msg: >-
      PORTAL stage expected a Caddy/portal install but deployment_portal_caddy_effective=false.
      deployment_portal_enabled={{ deployment_portal_enabled | default('unset') }},
      caddy_vhost_enabled={{ caddy_vhost_enabled | default('unset') }}.
      Enable deployment_portal_enabled and caddy_vhost_enabled (Jenkins DEPLOYMENT_PORTAL_ENABLED / group_vars),
      or unset deployment_portal_install_required when a skip is intentional.
  when:
    - deployment_portal_install_required | default(false) | bool
    - not (deployment_portal_caddy_effective | default(false) | bool)

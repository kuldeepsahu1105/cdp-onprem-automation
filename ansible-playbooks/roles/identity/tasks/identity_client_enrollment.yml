---
- name: Join FreeIPA domain
  ansible.builtin.import_tasks: join_freeipa_client.yml
  when: identity_provider_effective == 'freeipa'

- name: Join Active Directory realm
  ansible.builtin.import_tasks: join_ad_realm.yml
  when: identity_provider_effective == 'ad'

- name: Configure renewable Kerberos ticket defaults
  ansible.builtin.import_tasks: configure_krb5_ticket_renewal.yml

- name: Restore managed resolver configuration after identity enrollment
  ansible.builtin.import_tasks: configure_resolv_conf.yml

- name: Verify resolver configuration after identity enrollment
  ansible.builtin.import_tasks: verify_identity_dns.yml

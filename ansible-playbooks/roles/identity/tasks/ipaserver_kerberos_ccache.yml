---
- name: Install krb5.conf.d ansible-ccache-note.conf on ipaserver
  ansible.builtin.import_tasks: ensure_krb5_ansible_ccache_note.yml
  when: hostvars['localhost']['identity_provider_effective'] | default('') == 'freeipa'

- name: Restore KEYRING default_ccache_name on ipaserver (clients stay commented in later plays)
  ansible.builtin.import_tasks: ensure_krb5_default_ccache_commented.yml
  when: hostvars['localhost']['identity_provider_effective'] | default('') == 'freeipa'

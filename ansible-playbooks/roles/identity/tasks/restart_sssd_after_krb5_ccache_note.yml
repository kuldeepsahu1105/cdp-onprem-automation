---
# Enrolled FreeIPA hosts — restart SSSD after credential-cache policy changes when it is already running.

- name: Kerberos — probe whether SSSD is active before restart
  ansible.builtin.command: systemctl is-active sssd
  register: krb5_ccache_sssd_active_probe
  changed_when: false
  failed_when: false

- name: Kerberos — restart SSSD after credential-cache policy change
  ansible.builtin.systemd:
    name: sssd
    state: restarted
  when: krb5_ccache_sssd_active_probe.rc | default(1) | int == 0

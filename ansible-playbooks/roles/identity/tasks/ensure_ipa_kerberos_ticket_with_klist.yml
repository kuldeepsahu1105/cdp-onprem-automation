---
# Admin kinit into FILE ccache (see ensure_ipa_kerberos_ticket.yml) then klist for Jenkins diagnostics.
- name: Ensure Kerberos ticket for IPA CLI
  ansible.builtin.import_tasks: ensure_ipa_kerberos_ticket.yml

- name: List Kerberos ticket for IPA CLI (FILE ccache)
  ansible.builtin.command: klist -e
  register: _ipa_kerberos_klist
  changed_when: false
  environment:
    KRB5CCNAME: "FILE:{{ ipa_kerberos_ccache_path }}"

- name: Show Kerberos ticket for IPA CLI debugging
  ansible.builtin.debug:
    msg: "{{ _ipa_kerberos_klist.stdout.replace('\t', '    ').split('\n') }}"

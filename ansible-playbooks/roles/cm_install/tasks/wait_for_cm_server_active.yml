---
# Strict systemd wait (install/restart paths). After wait_for_cm_api, cm_api_health_ok skips this — see 27_setup_cm_autotls.yml.
- name: Skip systemd wait when CM API health already passed
  ansible.builtin.debug:
    msg: >-
      CM API /cm/version is healthy; skipping systemd is-active wait here
      (strict is-active is enforced in 25_verify_cm.yml).
  when: cm_api_health_ok | default(false) | bool

- name: Wait for Cloudera Manager Server systemd active
  when: not (cm_api_health_ok | default(false) | bool)
  block:
    # systemctl is-active: 0=active, 3=inactive/activating (wait below). Fail only on unknown rc (e.g. 4).
    - name: Check if Cloudera Manager Server is already running
      ansible.builtin.command: systemctl is-active cloudera-scm-server
      register: cm_status
      changed_when: false
      failed_when: cm_status.rc | int not in [0, 3]
      become: true

    - name: Print Cloudera SCM Server startup status - ALREADY RUNNING
      ansible.builtin.debug:
        msg: "Cloudera SCM Server is already running (systemctl rc=0)."
      when: cm_status.rc | int == 0

    - name: Wait for Cloudera Manager Server port
      ansible.builtin.wait_for:
        port: "{{ cm_api_port | default(cm_https_port) | default(cm_http_port) | default(7180) }}"
        host: 127.0.0.1
        delay: 2
        timeout: 120
      when: cm_status.rc | int != 0

    - name: Wait until Cloudera Manager Server is active (systemctl exit code 0 only)
      ansible.builtin.command: systemctl is-active cloudera-scm-server
      register: cm_active_check
      until: cm_active_check.rc | int == 0
      retries: 36
      delay: 5
      changed_when: false
      failed_when: cm_active_check.rc | int not in [0, 3]
      become: true
      when: cm_status.rc | int != 0

    - name: Print Cloudera SCM Server startup status - SUCCESS
      ansible.builtin.debug:
        msg: "Cloudera SCM Server is active (systemctl rc=0)."

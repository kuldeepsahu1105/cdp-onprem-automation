---
- name: Set OS-specific facts for {{ cm_package_task_subject | default('Cloudera Manager') }} package installation
  ansible.builtin.import_tasks: "{{ playbook_dir }}/common_tasks/set_os_facts.yml"

- name: Require Cloudera archive credentials for {{ cm_package_task_subject | default('Cloudera Manager') }} packages
  ansible.builtin.assert:
    that:
      - cm_repo_username | default('') | length > 0
      - cm_repo_username != '<username>'
      - cm_repo_password | default('') | length > 0
      - cm_repo_password != '<password>'
    fail_msg: >-
      Set cm_repo_username and cm_repo_password (archive.cloudera.com credentials).
      Debian/Ubuntu hosts require cm_repo_source: public in group_vars/all.yml.
  when: cm_repo_source == 'public'

- name: Configure repository for {{ cm_package_task_subject | default('Cloudera Manager') }} packages
  ansible.builtin.import_tasks: configure_cm_repo.yml

- name: Apply Debian-family prerequisites for {{ cm_package_task_subject | default('Cloudera Manager') }} packages
  ansible.builtin.import_tasks: prepare_debian_cm_install.yml

- name: Install {{ cm_package_task_subject | default('Cloudera Manager') }} packages
  ansible.builtin.package:
    name: "{{ cm_package_list }}"
    state: present
  environment: "{{ {'DEBIAN_FRONTEND': 'noninteractive'} if ansible_os_family == 'Debian' else {} }}"

---
- name: Resolve PostgreSQL install host from inventory
  ansible.builtin.import_tasks: resolve_postgres_inventory.yml

- name: Set OS-specific facts
  ansible.builtin.import_tasks: "{{ playbook_dir }}/common_tasks/set_os_facts.yml"

- name: Check whether PostgreSQL server is already installed
  ansible.builtin.stat:
    path: "{{ os.postgres_bin_dir }}/postgres"
  register: postgresql_server_binary

- name: Install PostgreSQL repository
  ansible.builtin.import_tasks: install_postgresql_repo.yml
  when: not (postgresql_server_binary.stat.exists | bool)

- name: Verify versioned PostgreSQL server repository
  ansible.builtin.import_tasks: "{{ playbook_dir }}/common_tasks/verify_postgresql_pgdg_repository.yml"
  vars:
    postgres_pgdg_required_packages:
      - "postgresql{{ postgresql_version }}"
      - "postgresql{{ postgresql_version }}-server"
      - "postgresql{{ postgresql_version }}-libs"
  when:
    - ansible_os_family == "RedHat"
    - not (postgresql_server_binary.stat.exists | bool)

- name: "Install PostgreSQL {{ postgresql_version }}"
  ansible.builtin.dnf:
    name: "{{ os.postgres_server_packages }}"
    state: present
    enablerepo:
      - "{{ postgres_pgdg_package_repository }}"
  when:
    - ansible_os_family == "RedHat"
    - not (postgresql_server_binary.stat.exists | bool)
  register: postgresql_server_install_redhat
  retries: "{{ postgres_pgdg_package_retries }}"
  delay: "{{ postgres_pgdg_package_retry_delay }}"
  until: postgresql_server_install_redhat is succeeded

- name: "Install PostgreSQL {{ postgresql_version }} on Debian"
  ansible.builtin.apt:
    name: "{{ os.postgres_server_packages }}"
    state: present
  when:
    - ansible_os_family == "Debian"
    - not (postgresql_server_binary.stat.exists | bool)

- name: Initialize PostgreSQL database
  ansible.builtin.import_tasks: init_postgresql.yml

- name: Verify PostgreSQL server binary after installation
  ansible.builtin.stat:
    path: "{{ os.postgres_bin_dir }}/postgres"
  register: postgresql_server_binary_after_install

- name: Require PostgreSQL server binary
  ansible.builtin.assert:
    that:
      - postgresql_server_binary_after_install.stat.exists | default(false) | bool
      - postgresql_server_binary_after_install.stat.executable | default(false) | bool
    fail_msg: >-
      PostgreSQL {{ postgresql_version }} package transaction completed but
      {{ os.postgres_bin_dir }}/postgres is not an executable file.

- name: Verify PostgreSQL version
  ansible.builtin.command: "cat {{ postgres_data_dir }}/PG_VERSION"
  register: pg_version
  changed_when: false

- name: Display PostgreSQL version
  ansible.builtin.debug:
    msg: "PostgreSQL version is {{ pg_version.stdout }}"

- name: Ensure psycopg2 is installed for both Python interpreters
  ansible.builtin.import_tasks: "{{ playbook_dir }}/common_tasks/ensure_python_psycopg2.yml"
  vars:
    python_psycopg2_runtime_packages: "{{ os.python_packages }}"

##### Postgres Configuration updates
- name: Deploy updated PostgreSQL configuration files
  ansible.builtin.template:
    src: "templates/{{ item.src }}"
    dest: "{{ postgres_config_dir }}/{{ item.dest }}"
    owner: "{{ postgres_user }}"
    group: "{{ postgres_group | default(postgres_user) }}"
    mode: "0640"
    backup: yes
  loop:
    - { src: "pg_hba.conf.j2", dest: "pg_hba.conf" }
    - { src: "postgresql.conf.j2", dest: "postgresql.conf" }
  register: postgres_config_deploy

- name: Show listen_addresses from deployed postgresql.conf
  ansible.builtin.shell: grep -E '^listen_addresses' "{{ postgres_config_dir }}/postgresql.conf"
  register: postgres_listen_config
  changed_when: false

- name: Display PostgreSQL listen_addresses setting
  ansible.builtin.debug:
    msg: "{{ postgres_listen_config.stdout }}"

- name: Ensure LC_ALL is set to C.UTF-8 (RHEL)
  ansible.builtin.lineinfile:
    path: /etc/locale.conf
    line: '{{ item }}="C.UTF-8"'
    create: yes
    backup: yes
  loop:
    - LANG
    - LC_CTYPE
  when: ansible_os_family == "RedHat"

- name: Ensure LC_ALL is set to C.UTF-8 (Ubuntu)
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    line: '{{ item }}=C.UTF-8'
    create: yes
    backup: yes
  loop:
    - LANG
    - LC_CTYPE
  when: ansible_os_family == "Debian"


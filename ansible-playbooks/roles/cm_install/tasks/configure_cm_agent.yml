---
- name: Validate cldr-mngr inventory group
  ansible.builtin.import_tasks: "{{ playbook_dir }}/common_tasks/validate_inventory_groups.yml"
  vars:
    required_inventory_group: cldr-mngr

- name: Set Cloudera Manager server FQDN for agent config
  ansible.builtin.set_fact:
    cm_server_fqdn: "{{ hostvars[cm_manager_inventory_host].cldr_hostname }}.{{ cluster_domain }}"

- name: Resolve CM agent reported hostname from inventory
  ansible.builtin.set_fact:
    cm_agent_reported_hostname_effective: >-
      {{
        cm_agent_reported_hostname | default('') | trim
        if (cm_agent_reported_hostname | default('') | trim | length > 0)
        else (
          cldr_hostname
          if (cldr_hostname | string).endswith('.' ~ cluster_domain)
          else cldr_hostname ~ '.' ~ cluster_domain
        )
      }}
    cm_agent_expected_ipv4: >-
      {{
        private_ip
        | default(ansible_default_ipv4.address | default(ansible_host), true)
        | string
        | trim
      }}

- name: Read operating-system FQDN before pinning CM agent identity
  ansible.builtin.command: hostname -f
  register: cm_agent_hostname_f
  changed_when: false

- name: Require operating-system FQDN to match CM agent identity
  ansible.builtin.assert:
    that:
      - cm_agent_reported_hostname_effective | length > 0
      - cm_agent_reported_hostname_effective is match('^[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9]$')
      - (cm_agent_hostname_f.stdout | trim | lower) == (cm_agent_reported_hostname_effective | lower)
    fail_msg: >-
      CM agent reported_hostname would be {{ cm_agent_reported_hostname_effective }}, but
      hostname -f returned {{ cm_agent_hostname_f.stdout | default('') | trim }} on
      {{ inventory_hostname }}. Re-run 02_set_hostname.yml and 03_create_etc_hosts.yml
      before CM installation or certificate generation.

- name: Require CM agent reported hostname to resolve over IPv4
  ansible.builtin.command:
    argv:
      - getent
      - ahostsv4
      - "{{ cm_agent_reported_hostname_effective }}"
  register: cm_agent_reported_hostname_ipv4
  changed_when: false
  failed_when: false

- name: Fail when CM agent reported hostname has no IPv4 resolution
  ansible.builtin.assert:
    that:
      - cm_agent_reported_hostname_ipv4.rc | int == 0
      - cm_agent_reported_hostname_ipv4.stdout | trim | length > 0
      - cm_agent_expected_ipv4 in cm_agent_reported_hostname_ipv4.stdout.split()
    fail_msg: >-
      {{ cm_agent_reported_hostname_effective }} does not resolve to expected host IPv4
      {{ cm_agent_expected_ipv4 }} on {{ inventory_hostname }}. Resolver output:
      {{ cm_agent_reported_hostname_ipv4.stdout | default('no result') | trim }}.
      Fix /etc/hosts or DNS before starting the CM agent.
      This check prevents CM agent FQDN/IP discovery from producing unstable host
      identity and Auto-TLS certificates on IPv4-only nodes.

- name: Point CM agent at Cloudera Manager server (not localhost)
  ansible.builtin.lineinfile:
    path: /etc/cloudera-scm-agent/config.ini
    regexp: '^#?\s*server_host\s*=.*'
    line: "server_host={{ cm_server_fqdn }}"
  register: cm_agent_config_server_host

- name: Pin CM agent reported hostname to inventory FQDN
  ansible.builtin.lineinfile:
    path: /etc/cloudera-scm-agent/config.ini
    regexp: '^#?\s*reported_hostname\s*=.*'
    line: "reported_hostname={{ cm_agent_reported_hostname_effective }}"
    insertafter: '^\[General\]'
  register: cm_agent_config_reported_hostname

- name: Record CM agent identity change for Auto-TLS certificate remediation
  ansible.builtin.file:
    path: "{{ cm_agent_reported_hostname_change_marker_path }}"
    state: touch
    owner: root
    group: root
    mode: "0600"
    modification_time: preserve
    access_time: preserve
  when: cm_agent_config_reported_hostname.changed | default(false) | bool

- name: Enable CM agent TLS when Cloudera Manager uses Auto-TLS
  ansible.builtin.lineinfile:
    path: /etc/cloudera-scm-agent/config.ini
    regexp: '^#?\s*use_tls\s*=.*'
    line: "use_tls=1"
  when: cm_agent_use_tls | default(autotls_enabled | default(false) | bool) | bool
  register: cm_agent_config_use_tls_enable

- name: Disable CM agent TLS when Cloudera Manager is HTTP-only
  ansible.builtin.lineinfile:
    path: /etc/cloudera-scm-agent/config.ini
    regexp: '^#?\s*use_tls\s*=.*'
    line: "use_tls=0"
  when: not (cm_agent_use_tls | default(autotls_enabled | default(false) | bool) | bool)
  register: cm_agent_config_use_tls_disable

- name: Verify CM agent identity settings in config.ini
  ansible.builtin.command:
    cmd: grep -E '^(server_host|reported_hostname)=' /etc/cloudera-scm-agent/config.ini
  register: cm_agent_identity_lines
  changed_when: false

- name: Display CM agent identity settings
  ansible.builtin.debug:
    msg: "{{ cm_agent_identity_lines.stdout_lines }}"

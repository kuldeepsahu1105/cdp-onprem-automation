---
- name: Skip internal mirror tasks when using public repos
  ansible.builtin.meta: end_host
  when: cm_repo_source != 'internal'

- name: Set OS-specific facts
  ansible.builtin.import_tasks: "{{ playbook_dir }}/common_tasks/set_os_facts.yml"

- name: Set CM/CDH mirror facts
  ansible.builtin.import_tasks: set_cm_mirror_facts.yml

- name: Mirror CM/CDH using yum/RPM (RHEL family)
  ansible.builtin.import_tasks: mirror_internal_cm_rhel.yml
  when: os.internal_mirror_format == 'rpm'

- name: Mirror CM/CDH using apt (Debian family)
  ansible.builtin.import_tasks: mirror_internal_cm_apt.yml
  when: os.internal_mirror_format == 'apt'

- name: Ensure web server is started for internal mirror
  ansible.builtin.service:
    name: "{{ os.web_server_service }}"
    state: started
    enabled: yes

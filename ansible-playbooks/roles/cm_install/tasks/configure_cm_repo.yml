---
- name: Set CM repository OS version path (RHEL)
  ansible.builtin.set_fact:
    cm_repo_os_version: "{{ ansible_distribution | lower }}{{ ansible_distribution_major_version }}"
  when: ansible_os_family == "RedHat"

- name: Set CM repository OS version path (Ubuntu)
  ansible.builtin.set_fact:
    cm_repo_os_version: "ubuntu{{ ansible_distribution_version | replace('.', '') }}"
  when:
    - ansible_os_family == "Debian"
    - ansible_distribution == "Ubuntu"

- name: Set CM repository OS version path (Debian with Ubuntu repo fallback)
  ansible.builtin.set_fact:
    cm_repo_os_version: "ubuntu{{ cm_debian_ubuntu_compat_version }}"
  when:
    - ansible_os_family == "Debian"
    - ansible_distribution == "Debian"
    - cm_debian_use_ubuntu_repo | default(false) | bool

- name: Reject unsupported pure Debian CM apt repo path
  ansible.builtin.fail:
    msg: >-
      Cloudera Manager apt repositories are published for Ubuntu (ubuntu2204/ubuntu2404).
      Use Ubuntu for cldr-mngr, or set cm_debian_use_ubuntu_repo: true in group_vars/all.yml
      to use ubuntu{{ cm_debian_ubuntu_compat_version }} packages on Debian (unsupported by Cloudera).
  when:
    - ansible_os_family == "Debian"
    - ansible_distribution == "Debian"
    - not (cm_debian_use_ubuntu_repo | default(false) | bool)

- name: Download official Cloudera Manager yum repo file (RHEL, public)
  block:
    - name: Download Cloudera Manager yum repo over IPv4
      ansible.builtin.command:
        argv:
          - curl
          - --config
          - "-"
      args:
        stdin: |
          url = {{ (cm_repo_public_base_url ~ '/cm7/' ~ (cm_repo_version_path | default(cm_version)) ~ '/' ~ cm_repo_os_version ~ '/yum/cloudera-manager.repo') | to_json }}
          output = {{ (os.cm_repo_dir ~ '/' ~ os.cm_repo_file ~ '.ipv4-download') | to_json }}
          user = {{ (cm_repo_username ~ ':' ~ cm_repo_password) | to_json }}
          ipv4
          fail
          location
          silent
          show-error
          retry = 3
          retry-connrefused
          connect-timeout = 15
          max-time = 120
      register: cm_repo_ipv4_download
      changed_when: false
      failed_when: false
      no_log: true

    - name: Require successful Cloudera Manager yum repo IPv4 download
      ansible.builtin.assert:
        that:
          - cm_repo_ipv4_download.rc | int == 0
        fail_msg: >-
          Cloudera Manager repository download failed over IPv4 on
          {{ inventory_hostname }}. curl rc={{
          cm_repo_ipv4_download.rc | default('unknown') }} stderr={{
          cm_repo_ipv4_download.stderr | default('') | trim }}. Verify this host
          has an IPv4 default route/NAT path to archive.cloudera.com.

    - name: Install downloaded Cloudera Manager yum repo
      ansible.builtin.copy:
        src: "{{ os.cm_repo_dir }}/{{ os.cm_repo_file }}.ipv4-download"
        dest: "{{ os.cm_repo_dir }}/{{ os.cm_repo_file }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
  always:
    - name: Remove temporary Cloudera Manager yum repo download
      ansible.builtin.file:
        path: "{{ os.cm_repo_dir }}/{{ os.cm_repo_file }}.ipv4-download"
        state: absent
  when:
    - ansible_os_family == "RedHat"
    - cm_repo_source == 'public'

- name: Inject archive credentials into cloudera-manager.repo placeholders (RHEL)
  ansible.builtin.replace:
    path: "{{ os.cm_repo_dir }}/{{ os.cm_repo_file }}"
    regexp: "{{ item }}"
    replace: "{{ cm_repo_username }}:{{ cm_repo_password }}"
  loop:
    - 'username:password'
    - 'USERNAME:PASSWORD'
    - '\[username\]:\[password\]'
  when:
    - ansible_os_family == "RedHat"
    - cm_repo_source == 'public'

- name: Force IPv4 for Cloudera Manager yum repository access
  community.general.ini_file:
    path: "{{ os.cm_repo_dir }}/{{ os.cm_repo_file }}"
    section: cloudera-manager
    option: ip_resolve
    value: "4"
    no_extra_spaces: true
    mode: "0644"
  when:
    - ansible_os_family == "RedHat"
    - cm_repo_source == 'public'

- name: Configure Cloudera Manager yum repository from template (internal mirror)
  ansible.builtin.template:
    src: templates/cloudera-manager.repo.j2
    dest: "{{ os.cm_repo_dir }}/{{ os.cm_repo_file }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - ansible_os_family == "RedHat"
    - cm_repo_source == 'internal'

- name: Download official Cloudera Manager apt sources list (Debian family, public)
  ansible.builtin.get_url:
    url: "{{ cm_repo_public_base_url }}/cm7/{{ cm_repo_version_path | default(cm_version) }}/{{ cm_repo_os_version }}/apt/cloudera-manager.list"
    dest: "{{ os.cm_repo_dir }}/{{ os.cm_repo_file }}"
    owner: root
    group: root
    mode: "0644"
    url_username: "{{ cm_repo_username }}"
    url_password: "{{ cm_repo_password }}"
    force_basic_auth: true
  when:
    - ansible_os_family == "Debian"
    - cm_repo_source == 'public'

- name: Inject archive credentials into cloudera-manager.list placeholders
  ansible.builtin.replace:
    path: "{{ os.cm_repo_dir }}/{{ os.cm_repo_file }}"
    regexp: "{{ item }}"
    replace: "{{ cm_repo_username }}:{{ cm_repo_password }}"
  loop:
    - 'username:password'
    - 'USERNAME:PASSWORD'
    - '\[username\]:\[password\]'
  when:
    - ansible_os_family == "Debian"
    - cm_repo_source == 'public'

- name: Download Cloudera Manager apt archive signing key (Debian family, public)
  ansible.builtin.get_url:
    url: "{{ cm_repo_public_base_url }}/cm7/{{ cm_repo_version_path | default(cm_version) }}/{{ cm_repo_os_version }}/apt/archive.key"
    dest: /usr/share/keyrings/cloudera-cm-archive-keyring.asc
    owner: root
    group: root
    mode: "0644"
    url_username: "{{ cm_repo_username }}"
    url_password: "{{ cm_repo_password }}"
    force_basic_auth: true
  when:
    - ansible_os_family == "Debian"
    - cm_repo_source == 'public'

- name: Configure signed-by for Cloudera Manager apt repository (public)
  ansible.builtin.replace:
    path: "{{ os.cm_repo_dir }}/{{ os.cm_repo_file }}"
    regexp: '^deb \[(?!signed-by=)'
    replace: 'deb [signed-by=/usr/share/keyrings/cloudera-cm-archive-keyring.asc '
  when:
    - ansible_os_family == "Debian"
    - cm_repo_source == 'public'

- name: Set CM apt suite for internal mirror clients
  ansible.builtin.set_fact:
    cm_apt_suite: "{{ ansible_distribution_release }}-cm{{ cm_version.split('.')[:3] | join('.') }}"
  when:
    - ansible_os_family == "Debian"
    - cm_repo_source == 'internal'

- name: Download Cloudera Manager apt archive signing key (internal mirror)
  ansible.builtin.get_url:
    url: "http://{{ cm_repo_mirror_host }}/cloudera-repos/cloudera-manager/apt/archive.key"
    dest: /usr/share/keyrings/cloudera-cm-archive-keyring.asc
    owner: root
    group: root
    mode: "0644"
  when:
    - ansible_os_family == "Debian"
    - cm_repo_source == 'internal'

- name: Configure Cloudera Manager apt repository from template (internal mirror)
  ansible.builtin.template:
    src: templates/cloudera-manager.list.j2
    dest: "{{ os.cm_repo_dir }}/{{ os.cm_repo_file }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - ansible_os_family == "Debian"
    - cm_repo_source == 'internal'

- name: Update apt cache after adding Cloudera Manager repository (Debian family)
  ansible.builtin.apt:
    update_cache: true
  when: ansible_os_family == "Debian"

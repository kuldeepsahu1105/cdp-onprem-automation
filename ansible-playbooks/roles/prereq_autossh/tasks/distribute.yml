---
- name: Ensure .ssh directory exists
  ansible.builtin.file:
    path: "{{ ssh_dir }}"
    state: directory
    mode: "0700"
    owner: root
    group: root

- name: Copy private key from controller
  ansible.builtin.copy:
    src: "/tmp/ansible_ssh_keys/id_rsa"
    dest: "{{ private_key_path }}"
    mode: "0600"
    owner: root
    group: root

- name: Copy public key from controller
  ansible.builtin.copy:
    src: "/tmp/ansible_ssh_keys/id_rsa.pub"
    dest: "{{ public_key_path }}"
    mode: "0644"
    owner: root
    group: root

- name: Read public key from ipaserver
  ansible.builtin.slurp:
    src: "{{ public_key_path }}"
  register: pubkey_raw

- name: Add public key to authorized_keys
  ansible.posix.authorized_key:
    user: root
    key: "{{ pubkey_raw.content | b64decode }}"
    state: present

---
- name: Resolve portal install host
  ansible.builtin.import_tasks: "{{ playbook_dir }}/common_tasks/resolve_deployment_portal_host.yml"

- name: Register deployment portal runtime host
  ansible.builtin.add_host:
    name: "{{ groups[deployment_portal_host_group_effective][0] }}"
    groups: deployment_portal_runtime
  changed_when: false

- name: Validate SSH reachability of monitoring/Caddy target host before connecting
  ansible.builtin.import_tasks: "{{ playbook_dir }}/common_tasks/validate_ansible_ssh_reachability.yml"
  vars:
    ansible_ssh_reachability_check_group: "{{ deployment_portal_host_group_effective }}"

- name: Enable monitoring in portal context for this run
  ansible.builtin.set_fact:
    monitoring_stack_enabled: true

- name: Build deployment portal context from inventory
  ansible.builtin.import_tasks: "{{ playbook_dir }}/common_tasks/build_deployment_portal_facts.yml"

- import_playbook: enroll_monitoring_exporters.yml

---
# Knox KNOX_GATEWAY ssl_client_truststore_* for CM HTTPS discovery (CDP cdp-proxy* topologies).
# Run after cluster configureAutoTlsServices so the in-cluster truststore and password exist.

- name: Use SSH for Knox host delegation from localhost play
  ansible.builtin.add_host:
    name: "{{ groups[base_cluster_master_group][0] }}"
    ansible_connection: ssh
  changed_when: false

- name: Read Knox Gateway Auto-TLS client truststore schema
  ansible.builtin.uri:
    url: >-
      {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
      }}/services/knox/roleConfigGroups/{{ base_cluster_knox_gateway_group }}/config?view=full
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  register: base_cluster_knox_gateway_config_schema
  changed_when: false
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Require Knox Gateway Auto-TLS client truststore settings
  ansible.builtin.assert:
    that:
      - >-
        base_cluster_knox_gateway_config_schema.json['items'] | default([])
        | selectattr('name', 'equalto', 'ssl_client_truststore_location')
        | list | length == 1
      - >-
        base_cluster_knox_gateway_config_schema.json['items'] | default([])
        | selectattr('name', 'equalto', 'ssl_client_truststore_password')
        | list | length == 1
    fail_msg: >-
      The Knox Gateway role schema does not expose ssl_client_truststore_location and
      ssl_client_truststore_password. Available truststore settings:
      {{
        base_cluster_knox_gateway_config_schema.json['items'] | default([])
        | map(attribute='name')
        | select('search', 'truststore')
        | list
        | join(', ')
      }}.

- name: Check Knox Auto-TLS client truststore
  ansible.builtin.stat:
    path: "{{ base_cluster_knox_autotls_truststore_path }}"
  register: base_cluster_knox_autotls_truststore
  delegate_to: "{{ groups[base_cluster_master_group][0] }}"
  become: true

- name: Restart CM agent on Knox host when in-cluster truststore is missing
  ansible.builtin.shell: |
    set -euo pipefail
    if systemctl cat cloudera-scm-agent >/dev/null 2>&1; then
      systemctl daemon-reload
      systemctl enable cloudera-scm-agent >/dev/null 2>&1
      systemctl restart cloudera-scm-agent
      echo restarted-systemd
    elif [ -x /etc/init.d/cloudera-scm-agent ]; then
      service cloudera-scm-agent restart
      echo restarted-sysv
    else
      echo "cloudera-scm-agent service is not installed on $(hostname -f)" >&2
      exit 3
    fi
  args:
    executable: /bin/bash
  register: base_cluster_knox_autotls_agent_restart
  changed_when: >-
    'restarted-' in (base_cluster_knox_autotls_agent_restart.stdout | default(''))
  delegate_to: "{{ groups[base_cluster_master_group][0] }}"
  become: true
  when:
    - >-
      base_cluster_tls_already_enabled | default(false) | bool
      or base_cluster_cluster_autotls_applied_this_run | default(false) | bool
    - not (base_cluster_knox_autotls_truststore.stat.exists | default(false) | bool)

- name: Wait for Knox Auto-TLS client truststore after agent restart
  ansible.builtin.stat:
    path: "{{ base_cluster_knox_autotls_truststore_path }}"
  register: base_cluster_knox_autotls_truststore_after_restart
  delegate_to: "{{ groups[base_cluster_master_group][0] }}"
  become: true
  until:
    - base_cluster_knox_autotls_truststore_after_restart.stat.exists | default(false) | bool
    - base_cluster_knox_autotls_truststore_after_restart.stat.isreg | default(false) | bool
  retries: "{{ cm_autotls_truststore_wait_retries | default(12) }}"
  delay: "{{ cm_autotls_truststore_wait_delay | default(10) }}"
  failed_when: false
  when: base_cluster_knox_autotls_agent_restart is changed

- name: Resolve Knox Auto-TLS client truststore readiness
  ansible.builtin.set_fact:
    base_cluster_knox_autotls_truststore_ready: >-
      {{
        (
          base_cluster_knox_autotls_truststore.stat.exists | default(false) | bool
          and base_cluster_knox_autotls_truststore.stat.isreg | default(false) | bool
        )
        or (
          (
            base_cluster_knox_autotls_truststore_after_restart | default({})
          ).get('stat', {}).get('exists', false) | bool
          and (
            base_cluster_knox_autotls_truststore_after_restart | default({})
          ).get('stat', {}).get('isreg', false) | bool
        )
      }}

- name: Require Knox Auto-TLS client truststore
  ansible.builtin.assert:
    that:
      - base_cluster_knox_autotls_truststore_ready | bool
    fail_msg: >-
      Knox cannot discover cluster services over the Auto-TLS CM API because
      {{ base_cluster_knox_autotls_truststore_path }} is missing on
      {{ groups[base_cluster_master_group][0] }} even after reconciling the CM agent.
      Cluster Auto-TLS was already enabled={{
      base_cluster_tls_already_enabled | default(false) }} or was enabled this run={{
      base_cluster_cluster_autotls_applied_this_run | default(false) }}.
      Check cloudera-scm-agent status/logs on that host; CM-level generateCmca alone
      cannot create this cluster-specific truststore.

- name: Read Auto-TLS truststore password for Knox
  ansible.builtin.uri:
    url: "{{ cm_cluster_module_api_url }}/certs/truststorePassword"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    return_content: yes
    status_code: [200]
    follow_redirects: none
  register: base_cluster_knox_truststore_password_api
  delegate_to: "{{ cm_cluster_module_delegate_to }}"
  no_log: true

- name: Require Auto-TLS truststore password for Knox
  ansible.builtin.assert:
    that:
      - base_cluster_knox_truststore_password_api.content | default('') | trim | length > 0
    fail_msg: >-
      CM Auto-TLS did not return a truststore password for Knox service discovery.
      Re-run 27_setup_cm_autotls.yml and verify the CM cert API before retrying.
  no_log: true

- name: Configure Knox Auto-TLS client truststore
  ansible.builtin.include_tasks: reconcile_cm_config_api.yml
  vars:
    cm_config_display_name: Knox Gateway Auto-TLS client truststore
    cm_config_endpoint: >-
      {{ cm_cluster_module_api_url }}/clusters/{{ cdh_basecluster_name
      }}/services/knox/roleConfigGroups/{{ base_cluster_knox_gateway_group }}/config
    cm_config_desired:
      ssl_client_truststore_location: "{{ base_cluster_knox_autotls_truststore_path }}"
      ssl_client_truststore_password: >-
        {{ base_cluster_knox_truststore_password_api.content | trim }}
    cm_config_secret_names:
      - ssl_client_truststore_password
    base_cluster_force_secret_update: >-
      {{
        base_cluster_knox_update_autotls_truststore_password | default(false) | bool
        or autotls_applied_this_run | default(false) | bool
        or base_cluster_cluster_autotls_applied_this_run | default(false) | bool
        or base_cluster_initialization_incomplete | default(false) | bool
      }}

- name: Record Knox Auto-TLS client truststore update
  ansible.builtin.set_fact:
    base_cluster_knox_autotls_trust_changed: "{{ cm_config_updates | length > 0 }}"

---
- name: Base data context | Validate required shared services
  ansible.builtin.assert:
    that:
      - base_cluster_data_context_name | string | length > 0
      - base_cluster_data_context_services | length > 0
      - "'HDFS' in (base_cluster_data_context_services | map('upper') | list)"
    fail_msg: >-
      Base-cluster Data Context configuration is invalid. Set a non-empty
      base_cluster_data_context_name and include HDFS in
      base_cluster_data_context_services.

- name: Base data context | Read current CM Data Contexts
  ansible.builtin.uri:
    url: "{{ cm_cluster_module_api_url }}/dataContexts?view=full"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  register: base_cluster_data_contexts_before
  changed_when: false
  delegate_to: "{{ cm_cluster_module_delegate_to }}"
  connection: ssh

- name: Base data context | Resolve existing configured context
  ansible.builtin.set_fact:
    base_cluster_data_context_existing: >-
      {{
        (
          base_cluster_data_contexts_before.json['items'] | default([])
          | selectattr('name', 'equalto', base_cluster_data_context_name)
          | list
          | first
        )
        | default({}, true)
      }}

- name: Base data context | Create configured context for fresh cluster
  ansible.builtin.uri:
    url: "{{ cm_cluster_module_api_url }}/dataContexts"
    method: POST
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    body_format: json
    body:
      name: "{{ base_cluster_data_context_name }}"
      displayName: "{{ base_cluster_data_context_name }}"
      services: >-
        {%- set services = [] -%}
        {%- for service_type in base_cluster_data_context_services -%}
        {%- set _ = services.append(
          {
            'serviceName': service_type | lower,
            'serviceType': service_type | upper,
            'clusterName': cdh_basecluster_name
          }
        ) -%}
        {%- endfor -%}
        {{ services }}
    status_code: [200]
    follow_redirects: none
  register: base_cluster_data_context_create
  delegate_to: "{{ cm_cluster_module_delegate_to }}"
  connection: ssh
  when: base_cluster_data_context_existing | length == 0

- name: Base data context | Read created or existing context
  ansible.builtin.uri:
    url: "{{ cm_cluster_module_api_url }}/dataContexts?view=full"
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  register: base_cluster_data_contexts_after
  changed_when: false
  until: >-
    (
      base_cluster_data_contexts_after.json['items'] | default([])
      | selectattr('name', 'equalto', base_cluster_data_context_name)
      | list
      | length
    ) == 1
  retries: "{{ base_cluster_data_context_wait_retries | int }}"
  delay: "{{ base_cluster_data_context_wait_delay | int }}"
  delegate_to: "{{ cm_cluster_module_delegate_to }}"
  connection: ssh

- name: Base data context | Resolve authoritative context
  ansible.builtin.set_fact:
    base_cluster_data_context_effective: >-
      {{
        (
          base_cluster_data_contexts_after.json['items'] | default([])
          | selectattr('name', 'equalto', base_cluster_data_context_name)
          | list
          | first
        )
        | default({}, true)
      }}

- name: Base data context | Resolve observed shared service names
  ansible.builtin.set_fact:
    base_cluster_data_context_observed_services: >-
      {%- set result = [] -%}
      {%- for service in base_cluster_data_context_effective.services | default([]) -%}
      {%- set name = service.serviceName
        | default(service.service_name | default(''), true)
        | lower -%}
      {%- if name | length > 0 -%}
      {%- set _ = result.append(name) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ result | unique | list }}

- name: Base data context | Require complete fresh-install prerequisite
  ansible.builtin.assert:
    that:
      - base_cluster_data_context_effective | length > 0
      - >-
        (
          base_cluster_data_context_services
          | map('lower')
          | list
          | difference(base_cluster_data_context_observed_services)
        )
        | length == 0
    fail_msg: >-
      CM Data Context '{{ base_cluster_data_context_name }}' is absent or does
      not contain every required shared service for cluster
      '{{ cdh_basecluster_name }}'. Expected={{
      base_cluster_data_context_services | map('lower') | list }}; observed={{
      base_cluster_data_context_observed_services }}. Fresh CDE installation
      will fail with "Unable to get remote data context" until playbook 31
      completes this prerequisite.

- name: Base data context | Report fresh-install prerequisite
  ansible.builtin.debug:
    msg: >-
      Base cluster Data Context is ready for fresh Data Services installation:
      name={{ base_cluster_data_context_name }};
      cluster={{ cdh_basecluster_name }};
      services={{ base_cluster_data_context_observed_services | join(',') }};
      health={{
      base_cluster_data_context_effective.healthSummary
      | default(base_cluster_data_context_effective.health_summary | default('not returned')) }}.

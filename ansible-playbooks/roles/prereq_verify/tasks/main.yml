---
- name: Set OS-specific facts
  ansible.builtin.import_tasks: "{{ playbook_dir }}/common_tasks/set_os_facts.yml"

- name: Print service facts
  ansible.builtin.debug:
    var: ansible_facts.selinux.status

- name: Verify swappiness value
  ansible.builtin.shell: sysctl vm.swappiness
  register: swappiness_status
  changed_when: false

- ansible.builtin.debug:
    var: swappiness_status.stdout_lines

- name: Verify enabled hugepage value
  ansible.builtin.shell: cat /sys/kernel/mm/transparent_hugepage/enabled
  register: enabled_hugepage_value
  changed_when: false

- ansible.builtin.debug:
    var: enabled_hugepage_value.stdout_lines

- name: Verify defrag hugepage value
  ansible.builtin.shell: cat /sys/kernel/mm/transparent_hugepage/defrag
  register: defrag_hugepage_value
  changed_when: false

- ansible.builtin.debug:
    var: defrag_hugepage_value.stdout_lines

- name: Print chronyd state
  ansible.builtin.systemd:
    name: "{{ os.chrony_service }}"
  register: chronyd_status

- ansible.builtin.debug:
    var: chronyd_status.status.ActiveState

- name: Verify if chrony is enabled to run on reboot
  ansible.builtin.shell: systemctl is-enabled {{ os.chrony_service }}
  register: chronyd_enabled_status
  changed_when: false

- ansible.builtin.debug:
    var: chronyd_enabled_status.stdout_lines

- name: Print firewall state
  ansible.builtin.systemd:
    name: "{{ os.firewall_service }}"
  register: firewall_status
  failed_when: false

- name: Show firewall active state
  ansible.builtin.debug:
    var: firewall_status.status.ActiveState
  when: firewall_status is succeeded

- name: Note missing firewall service
  ansible.builtin.debug:
    msg: "Firewall service {{ os.firewall_service }} not installed on {{ inventory_hostname }}"
  when: firewall_status is failed

- name: Check rc.local
  ansible.builtin.shell: cat {{ os.rc_local_path }}
  register: rc_local_status
  changed_when: false

- ansible.builtin.debug:
    var: rc_local_status.stdout_lines

- name: Wait for 15 seconds
  ansible.builtin.pause:
    seconds: 15

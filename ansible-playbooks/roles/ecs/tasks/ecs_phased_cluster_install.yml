---
# Phased ECS install aligned with the supplied Cloudera Labs reference.
# Pinned v4.4 lacks host_template and control_plane modules, so those phases use
# their exact CM API equivalents through cm_resource.

- name: Assert ECS console admin password meets complexity requirements
  ansible.builtin.assert:
    that:
      - ecs_console_admin_password | length >= 8
      - ecs_console_admin_password is regex('[A-Z]')
      - ecs_console_admin_password is regex('[a-z]')
      - ecs_console_admin_password is regex('[0-9]')
      - ecs_console_admin_password is regex('[#&*$%@^._!]')
    fail_msg: >-
      ecs_console_admin_password must be at least 8 characters and contain at least one
      uppercase letter, one lowercase letter, one number, and one symbol (#, &, *, $, %, @, ^, ., _, !).
    quiet: true

- name: Create ECS experience cluster shell (no services)
  cloudera.cluster.cluster:
    host: "{{ cm_cluster_module_host }}"
    port: "{{ cm_cluster_module_port }}"
    version: "{{ cm_api_version }}"
    force_tls: "{{ cm_cluster_module_force_tls }}"
    username: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    verify_tls: false
    name: "{{ ecs_cluster_name }}"
    display_name: "{{ ecs_cluster_name }}"
    cluster_version: "{{ ecs_parcel_version_effective }}"
    type: EXPERIENCE_CLUSTER
    state: present
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Attach ECS master to cluster
  cloudera.cluster.host:
    host: "{{ cm_cluster_module_host }}"
    port: "{{ cm_cluster_module_port }}"
    version: "{{ cm_api_version }}"
    force_tls: "{{ cm_cluster_module_force_tls }}"
    username: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    verify_tls: false
    cluster_hostname: "{{ ecs_master_fqdn }}"
    host_ip: "{{ ecs_master_ip }}"
    name: "{{ ecs_cluster_name }}"
    state: attached
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Attach ECS workers to cluster
  cloudera.cluster.host:
    host: "{{ cm_cluster_module_host }}"
    port: "{{ cm_cluster_module_port }}"
    version: "{{ cm_api_version }}"
    force_tls: "{{ cm_cluster_module_force_tls }}"
    username: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    verify_tls: false
    cluster_hostname: "{{ item.name }}"
    host_ip: "{{ item.host_ip }}"
    name: "{{ ecs_cluster_name }}"
    state: attached
  loop: "{{ ecs_worker_host_entries }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Activate ECS parcel on cluster
  ansible.builtin.include_tasks: activate_cluster_parcel.yml
  vars:
    cluster_parcel_cluster: "{{ ecs_cluster_name }}"
    cluster_parcel_product: ECS
    cluster_parcel_version: "{{ ecs_parcel_version_effective }}"

- name: Create Docker service on ECS cluster
  cloudera.cluster.service:
    host: "{{ cm_cluster_module_host }}"
    port: "{{ cm_cluster_module_port }}"
    version: "{{ cm_api_version }}"
    force_tls: "{{ cm_cluster_module_force_tls }}"
    username: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    verify_tls: false
    cluster: "{{ ecs_cluster_name }}"
    service: docker
    name: docker
    display_name: DOCKER
    type: DOCKER
    state: present
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Configure Docker service data path
  cloudera.cluster.service_config:
    host: "{{ cm_cluster_module_host }}"
    port: "{{ cm_cluster_module_port }}"
    version: "{{ cm_api_version }}"
    force_tls: "{{ cm_cluster_module_force_tls }}"
    username: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    verify_tls: false
    cluster: "{{ ecs_cluster_name }}"
    service: docker
    parameters:
      defaultDataPath: "{{ ecs_docker_data_path }}"
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Create ECS service on cluster
  cloudera.cluster.service:
    host: "{{ cm_cluster_module_host }}"
    port: "{{ cm_cluster_module_port }}"
    version: "{{ cm_api_version }}"
    force_tls: "{{ cm_cluster_module_force_tls }}"
    username: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    verify_tls: false
    cluster: "{{ ecs_cluster_name }}"
    service: ecs
    name: ecs
    display_name: ECS
    type: ECS
    state: present
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Configure ECS ingress credentials (sensitive)
  cloudera.cluster.service_config:
    host: "{{ cm_cluster_module_host }}"
    port: "{{ cm_cluster_module_port }}"
    version: "{{ cm_api_version }}"
    force_tls: "{{ cm_cluster_module_force_tls }}"
    username: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    verify_tls: false
    cluster: "{{ ecs_cluster_name }}"
    service: ecs
    parameters:
      cp_prometheus_ingress_password: "{{ ecs_cp_prometheus_ingress_password }}"
      infra_prometheus_ingress_password: "{{ ecs_infra_prometheus_ingress_password }}"
      k8s_webui_secret_admin_token: "{{ ecs_k8s_webui_secret_admin_token }}"
  no_log: true
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Configure ECS service
  cloudera.cluster.service_config:
    host: "{{ cm_cluster_module_host }}"
    port: "{{ cm_cluster_module_port }}"
    version: "{{ cm_api_version }}"
    force_tls: "{{ cm_cluster_module_force_tls }}"
    username: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    verify_tls: false
    cluster: "{{ ecs_cluster_name }}"
    service: ecs
    parameters:
      app_domain: "{{ ecs_application_domain }}"
      cluster_cidr: "{{ ecs_cluster_cidr }}"
      service_cidr: "{{ ecs_service_cidr }}"
      image_basepath: "{{ ecs_image_basepath }}"
      docker_registry: "{{ ecs_docker_registry }}"
      external_registry_enabled: >-
        {{ 'true' if ecs_external_registry_enabled | bool else 'false' }}
      docker: docker
      cp_prometheus_ingress_user: "{{ ecs_cp_prometheus_ingress_user }}"
      infra_prometheus_ingress_user: "{{ ecs_infra_prometheus_ingress_user }}"
      longhorn_replication: "{{ ecs_longhorn_replication }}"
      lsoDataPath: "{{ ecs_lso_data_path }}"
      defaultDataPath: "{{ ecs_longhorn_data_path }}"
      nfs_over_provisioning: "{{ ecs_nfs_over_provisioning }}"
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Read rendered ECS service configuration
  ansible.builtin.uri:
    url: >-
      {{ cm_cluster_module_api_url }}/clusters/{{
      ecs_cluster_name | urlencode }}/services/ecs/config?view=full
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  register: ecs_service_config_check
  changed_when: false
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Require lowercase ECS external registry Boolean
  ansible.builtin.assert:
    that:
      - >-
        (
          ecs_service_config_check.json['items']
          | selectattr('name', 'equalto', 'external_registry_enabled')
          | map(attribute='value')
          | first
          | default('')
        ) == ('true' if ecs_external_registry_enabled | bool else 'false')
    fail_msg: >-
      Cloudera Manager must store ECS external_registry_enabled as lowercase
      '{{ 'true' if ecs_external_registry_enabled | bool else 'false' }}';
      received {{
        ecs_service_config_check.json['items']
        | selectattr('name', 'equalto', 'external_registry_enabled')
        | map(attribute='value')
        | first
        | default('(missing)')
      }}.

- name: Require reference ECS storage configuration
  ansible.builtin.assert:
    that:
      - >-
        (
          ecs_service_config_check.json['items']
          | selectattr('name', 'equalto', 'lsoDataPath')
          | map(attribute='value')
          | first
          | default('')
        ) == ecs_lso_data_path
      - >-
        (
          ecs_service_config_check.json['items']
          | selectattr('name', 'equalto', 'defaultDataPath')
          | map(attribute='value')
          | first
          | default('')
        ) == ecs_longhorn_data_path
      - >-
        (
          ecs_service_config_check.json['items']
          | selectattr('name', 'equalto', 'longhorn_replication')
          | map(attribute='value')
          | first
          | default('')
          | string
        ) == (ecs_longhorn_replication | string)
      - >-
        (
          ecs_service_config_check.json['items']
          | selectattr('name', 'equalto', 'nfs_over_provisioning')
          | map(attribute='value')
          | first
          | default('')
          | string
        ) == (ecs_nfs_over_provisioning | string)
    fail_msg: >-
      Cloudera Manager did not persist the supplied reference ECS storage
      configuration. Expected lsoDataPath={{ ecs_lso_data_path }},
      defaultDataPath={{ ecs_longhorn_data_path }},
      longhorn_replication={{ ecs_longhorn_replication }}, and
      nfs_over_provisioning={{ ecs_nfs_over_provisioning }}.

- name: Apply ECS host templates and role assignments
  ansible.builtin.import_tasks: ecs_apply_host_templates.yml

- name: Install ECS embedded control plane
  ansible.builtin.import_tasks: ecs_install_control_plane.yml

- name: Reconcile ECS CoreDNS while control-plane First Run is active
  ansible.builtin.import_tasks: ecs_reconcile_coredns.yml
  when: ecs_reconcile_coredns | default(true) | bool

- name: Wait for ECS control-plane First Run after CoreDNS reconciliation
  ansible.builtin.import_tasks: ecs_wait_control_plane_first_run.yml

- name: Start ECS cluster services and roles
  cloudera.cluster.cluster:
    host: "{{ cm_cluster_module_host }}"
    port: "{{ cm_cluster_module_port }}"
    version: "{{ cm_api_version }}"
    force_tls: "{{ cm_cluster_module_force_tls }}"
    username: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    verify_tls: false
    name: "{{ ecs_cluster_name }}"
    state: started
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

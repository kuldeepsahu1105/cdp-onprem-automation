---
- name: CM DNS | Require Cloudera Manager inventory host
  ansible.builtin.assert:
    that:
      - groups.get('cldr-mngr', []) | length > 0
    fail_msg: "Data Services require a host in the cldr-mngr inventory group."

- name: CM DNS | Resolve Cloudera Manager inventory host
  ansible.builtin.set_fact:
    ecs_data_services_cm_inventory_host: "{{ groups['cldr-mngr'] | first }}"

- name: CM DNS | Resolve Cloudera Manager hostname
  ansible.builtin.set_fact:
    ecs_data_services_cm_hostname: >-
      {{ hostvars[ecs_data_services_cm_inventory_host].cldr_hostname }}
    ecs_data_services_cm_fqdn: >-
      {{
        hostvars[ecs_data_services_cm_inventory_host].cldr_hostname
        + (
          '.' + cluster_domain
          if cluster_domain | default('') | length > 0
          else ''
        )
      }}
    ecs_data_services_cm_private_ip: >-
      {{
        hostvars[ecs_data_services_cm_inventory_host].private_ip
        | default(hostvars[ecs_data_services_cm_inventory_host].ansible_host, true)
      }}

- name: Critical DNS | Resolve ECS master private IP
  ansible.builtin.set_fact:
    ecs_data_services_ecs_master_private_ip: >-
      {{
        hostvars[groups[ecs_cluster_master_group] | first].private_ip
        | default(
            hostvars[groups[ecs_cluster_master_group] | first]
            .get('ansible_default_ipv4', {})
            .get(
              'address',
              hostvars[groups[ecs_cluster_master_group] | first].ansible_host
            ),
            true
          )
      }}

- name: Critical DNS | Initialize required Data Services records
  ansible.builtin.set_fact:
    ecs_data_services_critical_dns_records:
      - label: Cloudera Manager
        name: "{{ ecs_data_services_cm_hostname }}"
        zone: "{{ ipaserver_domain | default(cluster_domain) }}"
        fqdn: "{{ ecs_data_services_cm_fqdn }}"
        address: "{{ ecs_data_services_cm_private_ip }}"
      - label: ECS Management Console
        name: "{{ ecs_console_host_prefix }}.apps"
        zone: "{{ ipaserver_domain | default(cluster_domain) }}"
        fqdn: >-
          {{
            ecs_control_plane_url_effective
            | regex_replace('^https?://', '')
            | regex_replace('/.*$', '')
            | regex_replace(':.*$', '')
          }}
        address: "{{ ecs_data_services_ecs_master_private_ip }}"

- name: Critical DNS | Resolve FreeIPA inventory host
  ansible.builtin.set_fact:
    ecs_data_services_ipa_inventory_host: "{{ groups['ipaserver'] | first }}"
  when:
    - identity_provider_effective | default('freeipa') == 'freeipa'
    - groups.get('ipaserver', []) | length > 0

- name: Critical DNS | Add FreeIPA LDAP record requirement
  ansible.builtin.set_fact:
    ecs_data_services_critical_dns_records: >-
      {{
        ecs_data_services_critical_dns_records
        + [
          {
            'label': 'FreeIPA LDAP',
            'name': (
              ipa_kdc_host
              | default(
                  hostvars[ecs_data_services_ipa_inventory_host].cldr_hostname
                  + '.'
                  + cluster_domain,
                  true
                )
            ).split('.')[0],
            'zone': ipaserver_domain,
            'fqdn': (
              ipa_kdc_host
              | default(
                  hostvars[ecs_data_services_ipa_inventory_host].cldr_hostname
                  + '.'
                  + cluster_domain,
                  true
                )
            ),
            'address': (
              hostvars[ecs_data_services_ipa_inventory_host].private_ip
              | default(
                  hostvars[ecs_data_services_ipa_inventory_host].ansible_host,
                  true
                )
            )
          }
        ]
      }}
  when: ecs_data_services_ipa_inventory_host is defined

- name: Critical DNS | Build Kubernetes DNS verification records
  ansible.builtin.set_fact:
    ecs_data_services_dns_verification_records: >-
      {{ ecs_data_services_critical_dns_records }}

- name: Critical DNS | Read ECS CoreDNS configuration
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_coredns_namespace }}"
      - get
      - configmap
      - "{{ ecs_coredns_configmap_name }}"
      - --output
      - json
  register: ecs_data_services_coredns_config
  changed_when: false
  become: true
  delegate_to: "{{ groups[ecs_cluster_master_group] | first }}"
  connection: ssh

- name: Critical DNS | Decode ECS CoreDNS configuration
  ansible.builtin.set_fact:
    ecs_data_services_coredns_config_data: >-
      {{
        (ecs_data_services_coredns_config.stdout | from_json).data
        | default({})
      }}

- name: Critical DNS | Build deterministic CoreDNS private-zone policy
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import json
        import re
        import sys

        existing = sys.argv[1]
        records = json.loads(sys.argv[2])
        forwarders = json.loads(sys.argv[3])
        begin = "# BEGIN ANSIBLE DATA SERVICES PRIVATE DNS"
        end = "# END ANSIBLE DATA SERVICES PRIVATE DNS"
        managed = re.compile(
            rf"(?ms)^{re.escape(begin)}\n.*?^{re.escape(end)}\n?"
        )
        corefile = managed.sub("", existing).rstrip()
        zones = sorted({
            record["zone"].rstrip(".").lower()
            for record in records
            if record.get("zone")
        })
        blocks = []
        for zone in zones:
            if re.search(
                rf"(?m)^\s*{re.escape(zone)}(?::53)?\s*{chr(123)}",
                corefile,
            ):
                raise SystemExit(
                    f"CoreDNS already has an unmanaged server block for {zone}"
                )
            zone_records = [
                record for record in records
                if record.get("address")
                and record.get("zone", "").rstrip(".").lower() == zone
            ]
            lines = [
                f"{zone}:53 " + chr(123),
                "    errors",
                "    hosts {",
            ]
            lines.extend(
                f'        {record["address"]} {record["fqdn"]}'
                for record in zone_records
            )
            lines.extend([
                "        fallthrough",
                "    }",
                f'    forward . {" ".join(forwarders)}',
                "    cache 30",
                "}",
            ])
            blocks.append("\n".join(lines))
        print(
            corefile
            + "\n\n"
            + begin
            + "\n"
            + "\n\n".join(blocks)
            + "\n"
            + end
            + "\n"
        )
      - "{{ ecs_data_services_coredns_config_data.Corefile | default('') }}"
      - "{{ ecs_data_services_critical_dns_records | to_json }}"
      - "{{ ecs_coredns_forwarders_effective | to_json }}"
  register: ecs_data_services_coredns_private_zone
  changed_when: false
  become: false
  delegate_to: "{{ groups[ecs_cluster_master_group] | first }}"
  connection: ssh

- name: Critical DNS | Install deterministic CoreDNS private-zone policy
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_coredns_namespace }}"
      - patch
      - configmap
      - "{{ ecs_coredns_configmap_name }}"
      - --type
      - merge
      - --patch
      - "{{ {'data': {'Corefile': ecs_data_services_coredns_private_zone.stdout}} | to_json }}"
  register: ecs_data_services_coredns_private_zone_patch
  changed_when: >-
    ecs_data_services_coredns_private_zone.stdout
    != (ecs_data_services_coredns_config_data.Corefile | default(''))
  become: true
  delegate_to: "{{ groups[ecs_cluster_master_group] | first }}"
  connection: ssh

- name: Critical DNS | Gather FreeIPA operating system facts
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - min
  delegate_to: "{{ ecs_data_services_ipa_inventory_host }}"
  delegate_facts: true
  connection: ssh
  when: ecs_data_services_ipa_inventory_host is defined

- name: Critical DNS | Ensure FreeIPA module Kerberos client dependency
  ansible.builtin.package:
    name: >-
      {{
        freeipa_ansible_module_kerberos_packages[
          hostvars[ecs_data_services_ipa_inventory_host].ansible_os_family
        ]
      }}
    state: present
  become: true
  delegate_to: "{{ ecs_data_services_ipa_inventory_host }}"
  connection: ssh
  when: ecs_data_services_ipa_inventory_host is defined

- name: Critical DNS | Verify FreeIPA module Kerberos client dependency
  ansible.builtin.stat:
    path: /usr/bin/kinit
  register: ecs_data_services_ipa_kinit_binary
  delegate_to: "{{ ecs_data_services_ipa_inventory_host }}"
  connection: ssh
  when: ecs_data_services_ipa_inventory_host is defined

- name: Critical DNS | Require FreeIPA module Kerberos client dependency
  ansible.builtin.assert:
    that:
      - ecs_data_services_ipa_kinit_binary.stat.exists
      - ecs_data_services_ipa_kinit_binary.stat.executable
    fail_msg: >-
      /usr/bin/kinit is required by FreeIPA Ansible modules but is not
      installed or executable on {{ ecs_data_services_ipa_inventory_host }}.
  when: ecs_data_services_ipa_inventory_host is defined

- name: Critical DNS | Ensure FreeIPA module Python dependencies
  ansible.builtin.package:
    name: "{{ freeipa_ansible_module_python_packages }}"
    state: present
  become: true
  delegate_to: "{{ groups.get('ipaserver', []) | default(['localhost'], true) | first }}"
  connection: ssh
  when:
    - identity_provider_effective | default('freeipa') == 'freeipa'
    - groups.get('ipaserver', []) | length > 0

- name: Critical DNS | Verify FreeIPA module Python dependencies
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - import netaddr, gssapi, ipalib, ipapython, ipaplatform
  changed_when: false
  become: false
  delegate_to: "{{ groups.get('ipaserver', []) | default(['localhost'], true) | first }}"
  connection: ssh
  when:
    - identity_provider_effective | default('freeipa') == 'freeipa'
    - groups.get('ipaserver', []) | length > 0

- name: Critical DNS | Require FreeIPA administrator password
  ansible.builtin.assert:
    that:
      - ipaadmin_password | default('') | string | length > 0
    fail_msg: >-
      ipaadmin_password must be set before reconciling critical Data Services
      DNS records in FreeIPA.
  no_log: true
  when:
    - identity_provider_effective | default('freeipa') == 'freeipa'
    - groups.get('ipaserver', []) | length > 0

- name: Critical DNS | Reconcile FreeIPA forward records
  freeipa.ansible_freeipa.ipadnsrecord:
    ipaadmin_password: "{{ ipaadmin_password }}"
    name: "{{ item.name }}"
    zone_name: "{{ item.zone }}"
    record_type: A
    record_value: "{{ item.address }}"
    state: present
  register: ecs_data_services_critical_dns_reconcile
  delegate_to: "{{ groups.get('ipaserver', []) | default(['localhost'], true) | first }}"
  connection: ssh
  loop: "{{ ecs_data_services_critical_dns_records }}"
  loop_control:
    label: "{{ item.label }}: {{ item.fqdn }} -> {{ item.address }}"
  when:
    - identity_provider_effective | default('freeipa') == 'freeipa'
    - groups.get('ipaserver', []) | length > 0

- name: Critical DNS | Reconcile FreeIPA wildcard application record
  freeipa.ansible_freeipa.ipadnsrecord:
    ipaadmin_password: "{{ ipaadmin_password }}"
    name: "{{ wildcard_dns_record | default('*.apps') }}"
    zone_name: "{{ ipaserver_domain }}"
    record_type: A
    record_value: "{{ ecs_data_services_ecs_master_private_ip }}"
    state: present
  register: ecs_data_services_wildcard_dns_reconcile
  delegate_to: "{{ groups.get('ipaserver', []) | default(['localhost'], true) | first }}"
  connection: ssh
  when:
    - identity_provider_effective | default('freeipa') == 'freeipa'
    - groups.get('ipaserver', []) | length > 0

- name: Critical DNS | Flush ECS CoreDNS cache after record reconciliation
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_coredns_namespace }}"
      - delete
      - pods
      - --selector
      - k8s-app=kube-dns
  register: ecs_data_services_coredns_restart
  changed_when: ecs_data_services_coredns_restart.rc == 0
  become: true
  delegate_to: "{{ groups[ecs_cluster_master_group] | first }}"
  connection: ssh
  when:
    - identity_provider_effective | default('freeipa') == 'freeipa'
    - groups.get('ipaserver', []) | length > 0

- name: Critical DNS | Wait for ECS CoreDNS rollout
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_coredns_namespace }}"
      - rollout
      - status
      - "deployment/{{ ecs_coredns_deployment_name }}"
      - "--timeout={{ ecs_data_services_cm_dns_wait_retries | int * ecs_data_services_cm_dns_wait_delay | int }}s"
  changed_when: false
  become: true
  delegate_to: "{{ groups[ecs_cluster_master_group] | first }}"
  connection: ssh
  when: ecs_data_services_coredns_restart is changed

- name: Critical DNS | Read ECS CoreDNS service address
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_coredns_namespace }}"
      - get
      - service
      - "{{ ecs_coredns_service_name }}"
      - --output
      - jsonpath={.spec.clusterIP}
  register: ecs_data_services_coredns_service
  changed_when: false
  become: true
  delegate_to: "{{ groups[ecs_cluster_master_group] | first }}"
  connection: ssh

- name: Critical DNS | Wait for ECS CoreDNS service routing
  ansible.builtin.command:
    argv:
      - dig
      - "@{{ ecs_data_services_coredns_service.stdout | trim }}"
      - +short
      - "{{ item.fqdn }}"
      - A
  register: ecs_data_services_coredns_service_lookups
  changed_when: false
  failed_when: false
  become: false
  delegate_to: "{{ groups[ecs_cluster_master_group] | first }}"
  connection: ssh
  loop: "{{ ecs_data_services_dns_verification_records }}"
  loop_control:
    label: "{{ item.label }}: {{ item.fqdn }}"
  retries: "{{ ecs_data_services_cm_dns_wait_retries | int }}"
  delay: "{{ ecs_data_services_cm_dns_wait_delay | int }}"
  until:
    - ecs_data_services_coredns_service_lookups.rc == 0
    - item.address in ecs_data_services_coredns_service_lookups.stdout_lines

- name: Critical DNS | Resolve required names from ECS master
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - >-
        import socket,sys;
        print('\n'.join(sorted({
        result[4][0] for result in
        socket.getaddrinfo(sys.argv[1], None, socket.AF_INET)
        })))
      - "{{ item.fqdn }}"
  register: ecs_data_services_critical_dns_lookups
  changed_when: false
  failed_when: false
  become: false
  delegate_to: "{{ groups[ecs_cluster_master_group] | first }}"
  connection: ssh
  loop: "{{ ecs_data_services_dns_verification_records }}"
  loop_control:
    label: "{{ item.label }}: {{ item.fqdn }}"
  retries: "{{ ecs_data_services_cm_dns_wait_retries | int }}"
  delay: "{{ ecs_data_services_cm_dns_wait_delay | int }}"
  until:
    - ecs_data_services_critical_dns_lookups.rc == 0
    - >-
      item.address | length == 0
      or item.address in ecs_data_services_critical_dns_lookups.stdout

- name: Critical DNS | Require private service resolution
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - >-
        item.item.address | length == 0
        or item.item.address in item.stdout
    fail_msg: >-
      {{ item.item.label }} hostname {{ item.item.fqdn }} must resolve
      {{ 'to ' + item.item.address if item.item.address | length > 0 else '' }}
      from the ECS master before enabling CDE/CDW/CAI. Resolver output:
      {{ item.stdout | default(item.stderr, true) }}
  loop: "{{ ecs_data_services_critical_dns_lookups.results }}"
  loop_control:
    label: "{{ item.item.label }}: {{ item.item.fqdn }}"

- name: Critical DNS | Remove stale Kubernetes DNS probe pods
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_data_services_dns_probe_namespace }}"
      - delete
      - pod
      - "ansible-dns-check-{{ item }}"
      - --ignore-not-found
  changed_when: false
  become: true
  delegate_to: "{{ groups[ecs_cluster_master_group] | first }}"
  connection: ssh
  loop: "{{ range(1, ecs_data_services_dns_verification_records | length + 1) | list }}"

- name: Critical DNS | Start Kubernetes DNS probe pods
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_data_services_dns_probe_namespace }}"
      - run
      - "ansible-dns-check-{{ ansible_loop.index }}"
      - "--image={{ ecs_data_services_dns_probe_image }}"
      - --restart=Never
      - --command
      - --
      - nslookup
      - -type=A
      - "{{ item.fqdn }}"
  register: ecs_data_services_pod_dns_starts
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ groups[ecs_cluster_master_group] | first }}"
  connection: ssh
  loop: "{{ ecs_data_services_dns_verification_records }}"
  loop_control:
    extended: true
    label: "{{ item.label }}: {{ item.fqdn }}"

- name: Critical DNS | Wait for Kubernetes DNS probe pods
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_data_services_dns_probe_namespace }}"
      - get
      - pod
      - "ansible-dns-check-{{ ansible_loop.index }}"
      - --output
      - jsonpath={.status.phase}
  register: ecs_data_services_pod_dns_phases
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ groups[ecs_cluster_master_group] | first }}"
  connection: ssh
  loop: "{{ ecs_data_services_dns_verification_records }}"
  loop_control:
    extended: true
    label: "{{ item.label }}: {{ item.fqdn }}"
  retries: "{{ ecs_data_services_dns_probe_wait_retries | int }}"
  delay: "{{ ecs_data_services_dns_probe_wait_delay | int }}"
  until:
    - ecs_data_services_pod_dns_phases.rc == 0
    - ecs_data_services_pod_dns_phases.stdout in ['Succeeded', 'Failed']

- name: Critical DNS | Read Kubernetes DNS probe output
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_data_services_dns_probe_namespace }}"
      - logs
      - "ansible-dns-check-{{ ansible_loop.index }}"
  register: ecs_data_services_pod_dns_logs
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ groups[ecs_cluster_master_group] | first }}"
  connection: ssh
  loop: "{{ ecs_data_services_dns_verification_records }}"
  loop_control:
    extended: true
    label: "{{ item.label }}: {{ item.fqdn }}"

- name: Critical DNS | Remove completed Kubernetes DNS probe pods
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_data_services_dns_probe_namespace }}"
      - delete
      - pod
      - "ansible-dns-check-{{ item }}"
      - --ignore-not-found
  changed_when: false
  become: true
  delegate_to: "{{ groups[ecs_cluster_master_group] | first }}"
  connection: ssh
  loop: "{{ range(1, ecs_data_services_dns_verification_records | length + 1) | list }}"

- name: Critical DNS | Require Kubernetes pod service resolution
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - >-
        ecs_data_services_pod_dns_phases.results[ansible_loop.index0].stdout
        == 'Succeeded'
      - >-
        item.item.address | length == 0
        or item.item.address in item.stdout
    fail_msg: >-
      {{ item.item.label }} hostname {{ item.item.fqdn }} must resolve
      {{ 'to ' + item.item.address if item.item.address | length > 0 else '' }}
      through Kubernetes cluster DNS before enabling CDE/CDW/CAI.
      Pod resolver output:
      {{ item.stdout | default(item.stderr, true) }}
  loop: "{{ ecs_data_services_pod_dns_logs.results }}"
  loop_control:
    extended: true
    label: "{{ item.item.label }}: {{ item.item.fqdn }}"

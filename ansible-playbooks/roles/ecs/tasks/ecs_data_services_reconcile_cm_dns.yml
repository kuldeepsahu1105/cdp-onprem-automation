---
- name: Reconcile reference-aligned ECS CoreDNS forwarding
  ansible.builtin.import_tasks: ecs_reconcile_coredns.yml
  when:
    - ecs_data_services_install_names | default([]) | length > 0
    - ecs_reconcile_coredns | default(true) | bool

- name: Verify Data Services DNS through Kubernetes pods
  ansible.builtin.import_tasks: ecs_data_services_verify_dns.yml
  when:
    - ecs_data_services_install_names | default([]) | length > 0
    - identity_provider_effective | default('freeipa') == 'freeipa'

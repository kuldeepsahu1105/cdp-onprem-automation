---
- name: CAI TLS | Create isolated FreeIPA profile Kerberos cache
  ansible.builtin.tempfile:
    state: file
    prefix: ansible-cai-profile-
    suffix: .ccache
  register: ecs_cai_profile_krb5_cache
  changed_when: false
  delegate_to: "{{ groups.get('ipaserver', []) | first }}"
  connection: ssh
  become: true
  no_log: true

- name: CAI TLS | Authenticate for FreeIPA profile import
  ansible.builtin.command:
    argv:
      - kinit
      - -c
      - "FILE:{{ ecs_cai_profile_krb5_cache.path }}"
      - "{{ ipaadmin_principal }}"
    stdin: "{{ common_password | default(ipaadmin_password, true) }}"
  register: ecs_cai_profile_kinit
  changed_when: false
  failed_when: false
  delegate_to: "{{ groups.get('ipaserver', []) | first }}"
  connection: ssh
  become: true
  no_log: true

- name: CAI TLS | Render FreeIPA wildcard certificate profile
  ansible.builtin.template:
    src: ecs_cai_freeipa_wildcard_profile.cfg.j2
    dest: "/etc/pki/pki-tomcat/ca/{{ ecs_cai_wildcard_cert_profile }}.cfg"
    mode: "0600"
    owner: pkiuser
    group: pkiuser
  delegate_to: "{{ groups.get('ipaserver', []) | first }}"
  connection: ssh
  become: true
  when: ecs_cai_profile_kinit.rc == 0

- name: CAI TLS | Check FreeIPA wildcard certificate profile
  ansible.builtin.command:
    argv:
      - ipa
      - certprofile-show
      - "{{ ecs_cai_wildcard_cert_profile }}"
  environment:
    KRB5CCNAME: "FILE:{{ ecs_cai_profile_krb5_cache.path }}"
  register: ecs_cai_profile_existing
  changed_when: false
  failed_when: false
  delegate_to: "{{ groups.get('ipaserver', []) | first }}"
  connection: ssh
  become: true
  when: ecs_cai_profile_kinit.rc == 0

- name: CAI TLS | Reconcile FreeIPA wildcard certificate profile
  ansible.builtin.command:
    argv:
      - ipa
      - >-
        {{
          'certprofile-mod'
          if ecs_cai_profile_existing.rc | default(1) == 0
          else 'certprofile-import'
        }}
      - "{{ ecs_cai_wildcard_cert_profile }}"
      - --desc
      - SAN wildcard certificate profile
      - --store
      - "1"
      - --file
      - "/etc/pki/pki-tomcat/ca/{{ ecs_cai_wildcard_cert_profile }}.cfg"
  environment:
    KRB5CCNAME: "FILE:{{ ecs_cai_profile_krb5_cache.path }}"
  register: ecs_cai_profile_reconcile
  changed_when: ecs_cai_profile_reconcile.rc == 0
  failed_when: false
  delegate_to: "{{ groups.get('ipaserver', []) | first }}"
  connection: ssh
  become: true
  when: ecs_cai_profile_kinit.rc == 0

- name: CAI TLS | Remove FreeIPA profile Kerberos cache
  ansible.builtin.file:
    path: "{{ ecs_cai_profile_krb5_cache.path }}"
    state: absent
  changed_when: false
  delegate_to: "{{ groups.get('ipaserver', []) | first }}"
  connection: ssh
  become: true
  no_log: true

- name: CAI TLS | Require FreeIPA profile Kerberos authentication
  ansible.builtin.assert:
    that:
      - ecs_cai_profile_kinit.rc == 0
    fail_msg: >-
      Kerberos authentication for FreeIPA wildcard profile reconciliation
      failed on {{ groups.get('ipaserver', []) | first }} with rc
      {{ ecs_cai_profile_kinit.rc }}. Verify {{ ipaadmin_principal }} and the
      configured IPA administrator password.

- name: CAI TLS | Require FreeIPA wildcard certificate profile
  ansible.builtin.assert:
    that:
      - ecs_cai_profile_reconcile.rc | default(1) == 0
    fail_msg: >-
      FreeIPA wildcard certificate profile
      {{ ecs_cai_wildcard_cert_profile }} could not be reconciled on
      {{ groups.get('ipaserver', []) | first }}. rc={{
      ecs_cai_profile_reconcile.rc | default('unknown') }}; error={{
      ecs_cai_profile_reconcile.stderr | default('') | trim }}.

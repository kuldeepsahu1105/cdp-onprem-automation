---
- name: CDE VC | List authoritative Virtual Clusters
  ansible.builtin.command:
    argv: >-
      {{
        ecs_data_services_cdp_cli_prefix
        + [
          'de', 'list-vcs',
          '--cluster-id', ecs_cde_service.service.clusterId
        ]
      }}
  environment: "{{ ecs_cdp_cli_environment }}"
  register: ecs_cde_vc_list
  changed_when: false
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh

- name: CDE VC | Build bounded deterministic names
  ansible.builtin.set_fact:
    ecs_cde_vc_candidate_names: >-
      {%- set base_name = (
        ecs_cde_virtual_cluster_name
        | regex_replace('[^a-zA-Z0-9-]+', '-')
        | regex_replace('^-+', '')
        | regex_replace('-+$', '')
      ) -%}
      {%- set result = [] -%}
      {%- for attempt in range(1, (ecs_cde_virtual_cluster_name_attempts | int) + 1) -%}
      {%- set suffix = '' if attempt == 1 else '-' + ((attempt - 1) | string) -%}
      {%- set stem_length = (ecs_cde_virtual_cluster_name_max_length | int) - (suffix | length) -%}
      {%- set stem = base_name[:stem_length] | regex_replace('-+$', '') -%}
      {%- set _ = result.append(stem + suffix) -%}
      {%- endfor -%}
      {{ result }}

- name: CDE VC | Validate API-compatible candidate names
  ansible.builtin.assert:
    that:
      - ecs_cde_vc_candidate_names | length > 0
      - ecs_cde_vc_candidate_names | reject('equalto', '') | list | length == ecs_cde_vc_candidate_names | length
      - >-
        ecs_cde_vc_candidate_names | map('length') | max
        <= ecs_cde_virtual_cluster_name_max_length | int
      - >-
        ecs_cde_vc_candidate_names
        | select('match', '^[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?$')
        | list
        | length == ecs_cde_vc_candidate_names | length
    fail_msg: >-
      CDE Virtual Cluster names must be non-empty, at most 30 characters,
      contain only letters, numbers, or hyphens, and start and end with an
      alphanumeric character.
      Configured candidates={{ ecs_cde_vc_candidate_names }}.

- name: CDE VC | Record authoritative Virtual Cluster inventory
  ansible.builtin.set_fact:
    ecs_cde_vc_inventory: >-
      {{
        (ecs_cde_vc_list.stdout | from_json).vcs
        | default([])
      }}

- name: CDE VC | Classify terminal-failed configured names
  ansible.builtin.set_fact:
    ecs_cde_vc_terminal_failed_records: >-
      {%- set result = [] -%}
      {%- for resource in ecs_cde_vc_inventory -%}
      {%- if (
        resource.vcName | default('') in ecs_cde_vc_candidate_names
        and resource.status | default('') | lower
          in (
            ecs_cde_virtual_cluster_terminal_failure_statuses
            | map('lower')
            | list
          )
      ) -%}
      {%- set _ = result.append({
        'name': resource.vcName | default('unknown'),
        'status': resource.status | default('Unknown'),
        'id': resource.vcId | default('not returned')
      }) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ result }}

- name: CDE VC | Report bounded terminal-failure recovery
  ansible.builtin.debug:
    msg: >-
      Removing terminal-failed CDE Virtual Cluster record(s) before recreating
      the configured stable name: {{ ecs_cde_vc_terminal_failed_records }}.
      The healthy CDE service and all healthy, transitional, deleting, unknown,
      or differently named Virtual Clusters are unchanged.
  when:
    - ecs_cde_virtual_cluster_recreate_terminal_failed | bool
    - ecs_cde_vc_terminal_failed_records | length > 0

- name: CDE VC | Remove terminal-failed configured Virtual Cluster
  cloudera.cloud.de_virtual_cluster:
    name: "{{ item.name }}"
    environment: "{{ ecs_cdp_environment_name }}"
    service_name: "{{ ecs_cde_service_name_effective }}"
    endpoint_tls: "{{ ecs_data_services_verify_tls | default(false) | bool }}"
    wait: true
    timeout: "{{ ecs_data_services_module_wait_timeout | int }}"
    delay: "{{ ecs_data_services_status_wait_delay | int }}"
    state: absent
  environment: "{{ ecs_cdp_cli_environment }}"
  register: ecs_cde_vc_terminal_cleanup
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  loop: "{{ ecs_cde_vc_terminal_failed_records }}"
  loop_control:
    label: "{{ item.name }}: {{ item.status }}"
  when:
    - ecs_cde_virtual_cluster_recreate_terminal_failed | bool
    - ecs_cde_vc_terminal_failed_records | length > 0

- name: CDE VC | Refresh inventory after terminal-failure recovery
  ansible.builtin.command:
    argv: >-
      {{
        ecs_data_services_cdp_cli_prefix
        + [
          'de', 'list-vcs',
          '--cluster-id', ecs_cde_service.service.clusterId
        ]
      }}
  environment: "{{ ecs_cdp_cli_environment }}"
  register: ecs_cde_vc_list_after_terminal_cleanup
  changed_when: false
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when:
    - ecs_cde_virtual_cluster_recreate_terminal_failed | bool
    - ecs_cde_vc_terminal_failed_records | length > 0

- name: CDE VC | Record recovered Virtual Cluster inventory
  ansible.builtin.set_fact:
    ecs_cde_vc_inventory: >-
      {{
        (ecs_cde_vc_list_after_terminal_cleanup.stdout | from_json).vcs
        | default([])
      }}
  when:
    - ecs_cde_virtual_cluster_recreate_terminal_failed | bool
    - ecs_cde_vc_terminal_failed_records | length > 0

- name: CDE VC | Classify records still blocking configured names
  ansible.builtin.set_fact:
    ecs_cde_vc_blocking_records: >-
      {%- set result = [] -%}
      {%- for resource in ecs_cde_vc_inventory -%}
      {%- if resource.vcName | default('') in ecs_cde_vc_candidate_names -%}
      {%- set _ = result.append({
        'name': resource.vcName | default('unknown'),
        'status': resource.status | default('Unknown'),
        'id': resource.vcId | default('not returned')
      }) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ result }}

- name: CDE VC | Classify retained completed-deletion history
  ansible.builtin.set_fact:
    ecs_cde_vc_deleted_history: >-
      {%- set result = [] -%}
      {%- for resource in ecs_cde_vc_inventory -%}
      {%- if (
        resource.vcName | default('') in ecs_cde_vc_candidate_names
        and resource.status | default('') | lower
          in (
            ecs_cde_virtual_cluster_deleted_statuses
            | map('lower')
            | list
          )
      ) -%}
      {%- set _ = result.append({
        'name': resource.vcName | default('unknown'),
        'status': resource.status | default('Unknown'),
        'id': resource.vcId | default('not returned')
      }) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ result }}

- name: CDE VC | Report retained completed-deletion history
  ansible.builtin.debug:
    msg: >-
      Completed-deletion history still reserves configured CDE Virtual Cluster
      name(s), so selection will try the next deterministic suffix:
      {{ ecs_cde_vc_deleted_history }}.
  when: ecs_cde_vc_deleted_history | length > 0

- name: CDE VC | Select reusable or first unused name
  ansible.builtin.set_fact:
    ecs_cde_vc_selection: >-
      {%- set resources = ecs_cde_vc_inventory -%}
      {%- set ns = namespace(selected={}, blocked=false) -%}
      {%- for candidate in ecs_cde_vc_candidate_names
        if ns.selected | length == 0 and not ns.blocked -%}
      {%- set matches = resources | selectattr('vcName', 'equalto', candidate) | list -%}
      {%- if matches | length == 0 -%}
      {%- set ns.selected = {'name': candidate, 'existing': false, 'status': 'Absent'} -%}
      {%- else -%}
      {%- set candidate_state = namespace(reusable={}, deleted_count=0) -%}
      {%- for match in matches -%}
      {%- if (
        match.status | default('') | lower
        in (ecs_cde_virtual_cluster_deleted_statuses | map('lower') | list)
      ) -%}
      {%- set candidate_state.deleted_count = candidate_state.deleted_count + 1 -%}
      {%- elif (
        candidate_state.reusable | length == 0
        and match.status | default('') | lower
          in (
            (
              ecs_cde_virtual_cluster_green_statuses
              + ecs_cde_virtual_cluster_transitional_statuses
            )
            | map('lower')
            | list
          )
      ) -%}
      {%- set candidate_state.reusable = match -%}
      {%- endif -%}
      {%- endfor -%}
      {%- if candidate_state.reusable | length > 0 -%}
      {%- set ns.selected = {
        'name': candidate,
        'existing': true,
        'status': candidate_state.reusable.status | default('Unknown'),
        'id': candidate_state.reusable.vcId | default('')
      } -%}
      {%- elif candidate_state.deleted_count != matches | length -%}
      {%- set ns.blocked = true -%}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.selected }}

- name: CDE VC | Require an available bounded name
  ansible.builtin.assert:
    that:
      - ecs_cde_vc_selection | length > 0
    fail_msg: >-
      CDE Virtual Cluster could not find a reusable or unused name after
      {{ ecs_cde_virtual_cluster_name_attempts }} attempts. Failed, deleted,
      deleting, and stale-reserved resources are retained. Stable fresh-install
      naming does not append a number by default. Blocking records={{
      ecs_cde_vc_blocking_records }}. Terminal-failed records are automatically
      recreated only when ecs_cde_virtual_cluster_recreate_terminal_failed is
      enabled. Intentionally remove any other stale Virtual Cluster through the
      supported CDP workflow before retrying, or explicitly increase
      ecs_cde_virtual_cluster_name_attempts to create a separately suffixed
      Virtual Cluster.

- name: CDE VC | Record effective name and prior status
  ansible.builtin.set_fact:
    ecs_cde_virtual_cluster_name_effective: "{{ ecs_cde_vc_selection.name }}"
    ecs_cde_virtual_cluster_existing: "{{ ecs_cde_vc_selection.existing | bool }}"
    ecs_cde_virtual_cluster_prior_status: "{{ ecs_cde_vc_selection.status }}"

- name: CDE VC | Report selected existing Virtual Cluster
  ansible.builtin.debug:
    msg: >-
      CDE Virtual Cluster: Existing resource selected for mutation-free reuse.
      name={{ ecs_cde_virtual_cluster_name_effective }};
      observed_status={{ ecs_cde_virtual_cluster_prior_status }};
      vcId={{ ecs_cde_vc_selection.id | default('not returned') }};
      service={{ ecs_cde_service_name_effective }}.
      Existing compute settings will not be updated.
  when: ecs_cde_virtual_cluster_existing | bool

- name: CDE VC | Create unused Virtual Cluster
  cloudera.cloud.de_virtual_cluster:
    name: "{{ ecs_cde_virtual_cluster_name_effective }}"
    environment: "{{ ecs_cdp_environment_name }}"
    service_name: "{{ ecs_cde_service_name_effective }}"
    cpu_requests: "{{ ecs_cde_virtual_cluster_cpu_requests }}"
    memory_requests: "{{ ecs_cde_virtual_cluster_memory_requests }}"
    tier: "{{ ecs_cde_virtual_cluster_tier }}"
    endpoint_tls: "{{ ecs_data_services_verify_tls | default(false) | bool }}"
    wait: false
    state: present
  environment: "{{ ecs_cdp_cli_environment }}"
  register: ecs_cde_vc_create
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when: not (ecs_cde_virtual_cluster_existing | bool)

- name: CDE VC | Wait for effective Virtual Cluster
  cloudera.cloud.de_virtual_cluster_info:
    name: "{{ ecs_cde_virtual_cluster_name_effective }}"
    environment: "{{ ecs_cdp_environment_name }}"
    service_name: "{{ ecs_cde_service_name_effective }}"
    endpoint_tls: "{{ ecs_data_services_verify_tls | default(false) | bool }}"
  environment: "{{ ecs_cdp_cli_environment }}"
  register: ecs_cde_vc_info
  until:
    - ecs_cde_vc_info.virtual_clusters | default([]) | length > 0
    - >-
      (
        ecs_cde_vc_info.virtual_clusters | default([])
        | first | default({})
      ).status | default('') | lower
      in (
        (
          ecs_cde_virtual_cluster_green_statuses
          + ecs_cde_virtual_cluster_terminal_failure_statuses
        )
        | map('lower')
        | list
      )
  retries: "{{ ecs_data_services_status_wait_retries | int }}"
  delay: "{{ ecs_data_services_status_wait_delay | int }}"
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh

- name: CDE VC | Record final Virtual Cluster
  ansible.builtin.set_fact:
    ecs_cde_virtual_cluster: >-
      {{
        ecs_cde_vc_info.virtual_clusters
        | default([])
        | first
        | default({})
      }}

- name: CDE VC | Require healthy terminal state
  ansible.builtin.assert:
    that:
      - >-
        ecs_cde_virtual_cluster.status | default('') | lower
        in (ecs_cde_virtual_cluster_green_statuses | map('lower') | list)
    fail_msg: >-
      CDE Virtual Cluster {{ ecs_cde_virtual_cluster_name_effective }} reached
      {{ ecs_cde_virtual_cluster.status | default('unknown') }} instead of a
      configured healthy status
      ({{ ecs_cde_virtual_cluster_green_statuses | join(', ') }}).
      Explicit terminal failure statuses are
      {{ ecs_cde_virtual_cluster_terminal_failure_statuses | join(', ') }}.
      Empty or unknown discovery responses are polled until the configured
      timeout rather than being treated as terminal. Automation does not delete
      the failed resource.

- name: CDE VC | Resolve native UI URL
  ansible.builtin.set_fact:
    ecs_cde_virtual_cluster_ui_url: >-
      {{
        ecs_cde_virtual_cluster.VcUiUrl
        | default(
            ecs_cde_virtual_cluster.vcUiUrl | default(''),
            true
          )
        | regex_replace('/+$', '')
      }}

- name: CDE VC | Report Virtual Cluster convergence
  ansible.builtin.debug:
    msg: >-
      CDE Virtual Cluster: {{
      'Existing and healthy; reused without create or compute mutation'
      if ecs_cde_virtual_cluster_existing | bool
      else 'Created successfully'
      }}. name={{ ecs_cde_virtual_cluster_name_effective }};
      observed_status={{ ecs_cde_virtual_cluster.status | default('unknown') }};
      vcId={{ ecs_cde_virtual_cluster.vcId | default('not returned') }};
      native_ui={{ ecs_cde_virtual_cluster_ui_url | default('not returned', true) }};
      service={{ ecs_cde_service_name_effective }}.

- name: CDE VC | Record green result and catalog metadata
  ansible.builtin.set_fact:
    ecs_cde_virtual_cluster_succeeded: true
    ecs_cde_virtual_cluster_status: >-
      {{
        'Existing and running (green)'
        if ecs_cde_virtual_cluster_existing | bool
        else 'Created successfully (green)'
      }}
    ecs_data_services_catalog: >-
      {{
        ecs_data_services_catalog | combine(
          {
            'cde': ecs_data_services_catalog.cde | default({}) | combine(
              {
                'virtual_cluster': {
                  'name': ecs_cde_virtual_cluster_name,
                  'effective_name': ecs_cde_virtual_cluster_name_effective,
                  'status': ecs_cde_virtual_cluster.status,
                  'url': ecs_cde_virtual_cluster_ui_url
                }
              },
              recursive=True
            )
          },
          recursive=True
        )
      }}

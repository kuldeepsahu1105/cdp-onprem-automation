---
- name: Inspect controller workspace ownership for CDP CLI state
  ansible.builtin.stat:
    path: >-
      {{
        lookup('env', 'WORKSPACE')
        | default(playbook_dir, true)
      }}
  register: ecs_cdp_cli_workspace_stat

- name: Resolve controller checkout owner's home directory
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -c
      - "import pwd, sys; print(pwd.getpwnam(sys.argv[1]).pw_dir)"
      - "{{ ecs_cdp_cli_workspace_stat.stat.pw_name }}"
  register: ecs_cdp_cli_owner_home
  changed_when: false

- name: Resolve isolated CDP CLI path
  ansible.builtin.set_fact:
    ecs_cdp_cli_venv_path: >-
      {{
        ecs_cdp_cli_venv_path | trim
        if (ecs_cdp_cli_venv_path | default('') | trim | length > 0)
        else (
          ecs_cdp_cli_owner_home.stdout | trim
          + '/.local/state/cdp-onprem-automation/cdpcli-0.9.164'
        )
      }}

- name: Create persistent CDP CLI state directory
  ansible.builtin.file:
    path: "{{ ecs_cdp_cli_venv_path | dirname }}"
    state: directory
    owner: "{{ ecs_cdp_cli_workspace_stat.stat.pw_name }}"
    group: "{{ ecs_cdp_cli_workspace_stat.stat.gr_name }}"
    mode: "0700"

- name: Install isolated CDP CLI for cloudera.cloud modules
  ansible.builtin.pip:
    name: cdpcli==0.9.164
    state: present
    virtualenv: "{{ ecs_cdp_cli_venv_path }}"
    virtualenv_command: "{{ ansible_playbook_python }} -m venv"
  become: "{{ ansible_user_id != ecs_cdp_cli_workspace_stat.stat.pw_name }}"
  become_user: "{{ ecs_cdp_cli_workspace_stat.stat.pw_name }}"

- name: Inspect installed CDP CLI executable
  ansible.builtin.stat:
    path: "{{ ecs_cdp_cli_venv_path }}/bin/cdp"
  register: ecs_cdp_cli_executable_stat

- name: Publish installed CDP CLI executable
  ansible.builtin.set_fact:
    ecs_cdp_cli_executable: "{{ ecs_cdp_cli_venv_path }}/bin/cdp"
    ecs_cdp_cli_bin: "{{ ecs_cdp_cli_venv_path }}/bin"
  when:
    - ecs_cdp_cli_executable_stat.stat.exists | default(false)
    - ecs_cdp_cli_executable_stat.stat.executable | default(false)

- name: Require installed CDP CLI executable
  ansible.builtin.assert:
    that:
      - ecs_cdp_cli_executable is defined
      - ecs_cdp_cli_executable | length > 0
    fail_msg: >-
      cdpcli 0.9.164 was installed into {{ ecs_cdp_cli_venv_path }}, but its
      dedicated cdp executable is missing or not executable.

- name: Verify private-cloud LDAP commands are available
  ansible.builtin.command:
    argv:
      - "{{ ecs_cdp_cli_executable }}"
      - --form-factor
      - private
      - iam
      - "{{ item }}"
      - help
  register: ecs_cdp_cli_private_ldap_help
  changed_when: false
  loop:
    - update-ldap-provider
    - create-ldap-provider
  when:
    - >-
      (ecs_ldap_enabled | default(false) | bool)
      or (ecs_ldap_admin_user_enabled | default(false) | bool)

- name: Install Cloudera Labs CDPy for cloudera.cloud modules
  ansible.builtin.pip:
    name: git+https://github.com/cloudera-labs/cdpy.git@v2.1.0#egg=cdpy
    state: present
    extra_args: --user --no-deps
  become: false

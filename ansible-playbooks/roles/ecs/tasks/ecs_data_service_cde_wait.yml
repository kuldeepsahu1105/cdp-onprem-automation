---
- name: CDE | Wait for Data Engineering provisioning job
  when: "'cde' in (ecs_data_services_install_names | default([]))"
  block:
    - name: CDE | Read Data Engineering provisioning result
      ansible.builtin.async_status:
        jid: "{{ ecs_cde_service_job.ansible_job_id }}"
      register: ecs_cde_service
      until: ecs_cde_service.finished | default(false) | bool
      retries: "{{ ecs_data_services_async_poll_retries | int }}"
      delay: "{{ ecs_data_services_async_poll_delay | int }}"
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh

  rescue:
    - name: CDE | Record Data Engineering provisioning failure
      ansible.builtin.set_fact:
        ecs_cde_service: "{{ ansible_failed_result }}"

- name: CDE | Complete Data Engineering provisioning
  ansible.builtin.include_tasks: ecs_data_service_cde.yml
  when: "'cde' in (ecs_data_services_install_names | default([]))"

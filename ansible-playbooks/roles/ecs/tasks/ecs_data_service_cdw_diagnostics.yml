---
- name: CDW diagnostics | Resolve expected Kerberos identity
  ansible.builtin.set_fact:
    ecs_cdw_diagnostic_principal_hostname: "dwx-env-{{ ecs_cdp_environment_name }}.cdp.local"
    ecs_cdw_diagnostic_environment_payload: {}
    ecs_cdw_diagnostic_environment: {}
    ecs_cdw_diagnostic_ipa_ccache: >-
      /tmp/ansible-cdw-diagnostics-{{
        ecs_cdp_environment_name | hash('sha256')
      }}.ccache

- name: CDW diagnostics | Describe control-plane environment
  ansible.builtin.command:
    argv: >-
      {{
        ecs_data_services_cdp_cli_prefix
        + [
          'environments',
          'describe-environment',
          '--environment-name',
          ecs_cdp_environment_name
        ]
      }}
  environment: "{{ ecs_cdp_cli_environment }}"
  register: ecs_cdw_diagnostic_environment_command
  changed_when: false
  failed_when: false
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh

- name: CDW diagnostics | Parse control-plane environment
  ansible.builtin.set_fact:
    ecs_cdw_diagnostic_environment_payload: >-
      {{ ecs_cdw_diagnostic_environment_command.stdout | from_json }}
  when:
    - ecs_cdw_diagnostic_environment_command.rc | default(1) | int == 0
    - ecs_cdw_diagnostic_environment_command.stdout | default('') | trim is match('^[{]')

- name: CDW diagnostics | Select control-plane environment details
  ansible.builtin.set_fact:
    ecs_cdw_diagnostic_environment: >-
      {{
        ecs_cdw_diagnostic_environment_payload.environment
        | default(ecs_cdw_diagnostic_environment_payload, true)
      }}

- name: CDW diagnostics | Resolve CM diagnostic endpoint
  ansible.builtin.set_fact:
    ecs_cdw_diagnostic_cm_protocol: "{{ ecs_cm_api_protocol }}"
    ecs_cdw_diagnostic_cm_host: "{{ ecs_cm_api_host }}"
    ecs_cdw_diagnostic_cm_port: "{{ ecs_cm_api_port }}"
    ecs_cdw_diagnostic_cm_api_version: "{{ ecs_cm_api_version }}"

- name: CDW diagnostics | Read CM Kerberos state
  ansible.builtin.uri:
    url: >-
      {{ ecs_cdw_diagnostic_cm_protocol }}://{{ ecs_cdw_diagnostic_cm_host }}:{{
      ecs_cdw_diagnostic_cm_port }}/api/{{
      ecs_cdw_diagnostic_cm_api_version }}/cm/kerberosInfo
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200]
    follow_redirects: none
  register: ecs_cdw_diagnostic_cm_kerberos
  changed_when: false
  failed_when: false
  delegate_to: "{{ cm_manager_inventory_host }}"
  connection: ssh

- name: CDW diagnostics | Read base-cluster HDFS authentication
  ansible.builtin.uri:
    url: >-
      {{ ecs_cdw_diagnostic_cm_protocol }}://{{ ecs_cdw_diagnostic_cm_host }}:{{
      ecs_cdw_diagnostic_cm_port }}/api/{{
      ecs_cdw_diagnostic_cm_api_version }}/clusters/{{
      cdh_basecluster_name | urlencode
      }}/services/hdfs/config?view=full
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200]
    follow_redirects: none
  register: ecs_cdw_diagnostic_hdfs_config
  changed_when: false
  failed_when: false
  delegate_to: "{{ cm_manager_inventory_host }}"
  connection: ssh

- name: CDW diagnostics | Resolve CM and base-cluster Kerberos evidence
  ansible.builtin.set_fact:
    ecs_cdw_diagnostic_cm_kerberos_succeeded: >-
      {{
        ecs_cdw_diagnostic_cm_kerberos is succeeded
        and ecs_cdw_diagnostic_cm_kerberos.status | default(0) | int == 200
      }}
    ecs_cdw_diagnostic_hdfs_config_succeeded: >-
      {{
        ecs_cdw_diagnostic_hdfs_config is succeeded
        and ecs_cdw_diagnostic_hdfs_config.status | default(0) | int == 200
      }}
    ecs_cdw_diagnostic_cm_kerberized: >-
      {{
        ecs_cdw_diagnostic_cm_kerberos.get('json', {}).get('kerberized', false)
        | default(false)
        | bool
      }}
    ecs_cdw_diagnostic_cm_realm: >-
      {{
        ecs_cdw_diagnostic_cm_kerberos.get('json', {}).get('kerberosRealm', '')
        | default(
            ecs_cdw_diagnostic_cm_kerberos.get('json', {}).get('securityRealm', ''),
            true
          )
        | trim
      }}
    ecs_cdw_diagnostic_cm_kdc_host: >-
      {{
        ecs_cdw_diagnostic_cm_kerberos.get('json', {}).get('kdcHost', '')
        | default('')
        | trim
      }}
    ecs_cdw_diagnostic_hdfs_authentication: >-
      {{
        ecs_cdw_diagnostic_hdfs_config.get('json', {}).get('items', [])
        | default([])
        | selectattr('name', 'equalto', 'hadoop_security_authentication')
        | map(attribute='value')
        | first
        | default('', true)
        | lower
      }}

- name: CDW diagnostics | Collect recent CM Kerberos errors
  ansible.builtin.shell: >-
    set -o pipefail;
    tail -n 10000 /var/log/cloudera-scm-server/cloudera-scm-server.log
    | grep -Ei -- {{
        (
          ecs_cdw_diagnostic_principal_hostname
          ~ '|KDC_ERR|PREAUTH|CLIENT_NOT_FOUND|ImportCredentials'
        ) | quote
      }}
    | awk 'NF && !seen[$0]++'
  args:
    executable: /bin/bash
  register: ecs_cdw_diagnostic_cm_kerberos_log
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ cm_manager_inventory_host }}"
  connection: ssh

- name: CDW diagnostics | Obtain isolated FreeIPA administrator ticket
  ansible.builtin.command:
    argv:
      - kinit
      - -c
      - "FILE:{{ ecs_cdw_diagnostic_ipa_ccache }}"
      - "{{ ipaadmin_principal }}"
    stdin: "{{ ipaadmin_password }}"
  environment:
    KRB5CCNAME: "FILE:{{ ecs_cdw_diagnostic_ipa_ccache }}"
  register: ecs_cdw_diagnostic_ipa_kinit
  changed_when: false
  failed_when: false
  no_log: true
  delegate_to: "{{ ipaserver_inventory_host }}"
  connection: ssh
  when:
    - identity_provider_effective | default('freeipa') == 'freeipa'
    - ipa_server_in_inventory | default(false) | bool
    - ipaserver_inventory_host | default('') | length > 0

- name: CDW diagnostics | Record FreeIPA administrator ticket result
  ansible.builtin.set_fact:
    ecs_cdw_diagnostic_ipa_kinit_succeeded: >-
      {{
        ecs_cdw_diagnostic_ipa_kinit is defined
        and ecs_cdw_diagnostic_ipa_kinit is succeeded
        and not (ecs_cdw_diagnostic_ipa_kinit.skipped | default(false) | bool)
        and ecs_cdw_diagnostic_ipa_kinit.rc | default(1) | int == 0
      }}

- name: CDW diagnostics | Inspect expected FreeIPA host principal
  ansible.builtin.command:
    argv:
      - ipa
      - host-show
      - "{{ ecs_cdw_diagnostic_principal_hostname }}"
      - --all
      - --raw
  environment:
    KRB5CCNAME: "FILE:{{ ecs_cdw_diagnostic_ipa_ccache }}"
  register: ecs_cdw_diagnostic_ipa_host
  changed_when: false
  failed_when: false
  delegate_to: "{{ ipaserver_inventory_host }}"
  connection: ssh
  when: ecs_cdw_diagnostic_ipa_kinit_succeeded | bool

- name: CDW diagnostics | Inspect expected FreeIPA Hive service principal
  ansible.builtin.command:
    argv:
      - ipa
      - service-show
      - "hive/{{ ecs_cdw_diagnostic_principal_hostname }}"
      - --all
      - --raw
  environment:
    KRB5CCNAME: "FILE:{{ ecs_cdw_diagnostic_ipa_ccache }}"
  register: ecs_cdw_diagnostic_ipa_hive_service
  changed_when: false
  failed_when: false
  delegate_to: "{{ ipaserver_inventory_host }}"
  connection: ssh
  when: ecs_cdw_diagnostic_ipa_kinit_succeeded | bool

- name: CDW diagnostics | Record FreeIPA principal read results
  ansible.builtin.set_fact:
    ecs_cdw_diagnostic_ipa_host_succeeded: >-
      {{
        ecs_cdw_diagnostic_ipa_host is defined
        and ecs_cdw_diagnostic_ipa_host is succeeded
        and not (ecs_cdw_diagnostic_ipa_host.skipped | default(false) | bool)
        and ecs_cdw_diagnostic_ipa_host.rc | default(1) | int == 0
      }}
    ecs_cdw_diagnostic_ipa_hive_service_succeeded: >-
      {{
        ecs_cdw_diagnostic_ipa_hive_service is defined
        and ecs_cdw_diagnostic_ipa_hive_service is succeeded
        and not (
          ecs_cdw_diagnostic_ipa_hive_service.skipped
          | default(false)
          | bool
        )
        and ecs_cdw_diagnostic_ipa_hive_service.rc | default(1) | int == 0
      }}

- name: CDW diagnostics | Remove isolated FreeIPA ticket cache
  ansible.builtin.file:
    path: "{{ ecs_cdw_diagnostic_ipa_ccache }}"
    state: absent
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ ipaserver_inventory_host }}"
  connection: ssh
  when:
    - identity_provider_effective | default('freeipa') == 'freeipa'
    - ipa_server_in_inventory | default(false) | bool
    - ipaserver_inventory_host | default('') | length > 0

- name: CDW diagnostics | Report control-plane and Kerberos boundary
  ansible.builtin.debug:
    msg:
      - >-
        Environment command rc={{
          ecs_cdw_diagnostic_environment_command.rc | default('unknown')
        }}, name={{
          ecs_cdw_diagnostic_environment.environmentName
          | default(ecs_cdw_diagnostic_environment.name | default('unknown'))
        }}, status={{
          ecs_cdw_diagnostic_environment.status
          | default(
              ecs_cdw_diagnostic_environment.environmentStatus
              | default('unknown')
            )
        }}.
      - >-
        CM kerberosInfo HTTP={{
          ecs_cdw_diagnostic_cm_kerberos.status
          if ecs_cdw_diagnostic_cm_kerberos_succeeded | bool
          else 'unreachable'
        }}, kerberized={{ ecs_cdw_diagnostic_cm_kerberized }},
        realm={{ ecs_cdw_diagnostic_cm_realm | default('unset', true) }},
        kdcHost={{ ecs_cdw_diagnostic_cm_kdc_host | default('unset', true) }};
        HDFS authentication={{
          ecs_cdw_diagnostic_hdfs_authentication
          if ecs_cdw_diagnostic_hdfs_config_succeeded | bool
          else 'unavailable'
        }}; expected realm={{ cluster_realm }}, KDC={{ kdc_host }}.
      - >-
        FreeIPA admin ticket={{
          'valid'
          if ecs_cdw_diagnostic_ipa_kinit_succeeded | bool
          else (
            'not applicable'
            if identity_provider_effective | default('freeipa') != 'freeipa'
            else 'failed'
          )
        }}; host/{{ ecs_cdw_diagnostic_principal_hostname }}={{
          'present'
          if ecs_cdw_diagnostic_ipa_host_succeeded | bool
          else 'absent or unreadable'
        }}; hive/{{ ecs_cdw_diagnostic_principal_hostname }}={{
          'present'
          if ecs_cdw_diagnostic_ipa_hive_service_succeeded | bool
          else 'absent or unreadable'
        }}.
      - >-
        Likely failing boundary={{
          'ECS environment lookup or binding'
          if ecs_cdw_diagnostic_environment_command.rc | default(1) | int != 0
          else (
            'Cloudera Manager Kerberos configuration'
            if (
              not (ecs_cdw_diagnostic_cm_kerberized | bool)
              or ecs_cdw_diagnostic_cm_realm != cluster_realm
              or ecs_cdw_diagnostic_cm_kdc_host != kdc_host
              or ecs_cdw_diagnostic_hdfs_authentication != 'kerberos'
            )
            else (
              'FreeIPA administrator credential or KDC access'
              if (
                identity_provider_effective | default('freeipa') == 'freeipa'
                and not (ecs_cdw_diagnostic_ipa_kinit_succeeded | bool)
              )
              else (
                'DWX-to-CM/KDC account-manager principal creation'
                if (
                  identity_provider_effective | default('freeipa') == 'freeipa'
                  and (
                    not (ecs_cdw_diagnostic_ipa_host_succeeded | bool)
                    or not (
                      ecs_cdw_diagnostic_ipa_hive_service_succeeded | bool
                    )
                  )
                )
                else 'CDW principal/keytab handoff or workload startup'
              )
            )
          )
        }}.
      - >-
        Latest relevant Cloudera Manager Kerberos evidence:
        {{
          ecs_cdw_diagnostic_cm_kerberos_log.stdout_lines
          | default([])
          | last
          | default('No matching CM log lines were found.', true)
        }}

- name: CDW diagnostics | List matching warehouse namespaces
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - get
      - namespaces
      - --output
      - name
  register: ecs_cdw_failed_namespaces
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh

- name: Collect failed CDW pod status
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_cdw_kubernetes_namespace }}"
      - get
      - pods
      - --output
      - >-
        custom-columns=NAME:.metadata.name,PHASE:.status.phase,READY:.status.containerStatuses[*].ready,WAITING:.status.containerStatuses[*].state.waiting.reason,TERMINATED:.status.containerStatuses[*].state.terminated.reason,RESTARTS:.status.containerStatuses[*].restartCount,NODE:.spec.nodeName
  register: ecs_cdw_failed_pods
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh

- name: Collect failed metastore StatefulSet FILE cache
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_cdw_kubernetes_namespace }}"
      - get
      - statefulset
      - metastore
      - --output
      - >-
        jsonpath=KRB5CCNAME={.spec.template.spec.containers[?(@.name=="metastore")].env[?(@.name=="KRB5CCNAME")].value}{' desired='}{.spec.replicas}{' current='}{.status.currentReplicas}{' ready='}{.status.readyReplicas}{' updated='}{.status.updatedReplicas}{' generation='}{.metadata.generation}{' observedGeneration='}{.status.observedGeneration}{'\n'}
  register: ecs_cdw_failed_metastore_statefulset
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh

- name: Collect failed metastore logs
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_cdw_kubernetes_namespace }}"
      - logs
      - metastore-0
      - --container=metastore
      - --tail=300
  register: ecs_cdw_failed_metastore_logs
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh

- name: Collect previous failed metastore logs
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_cdw_kubernetes_namespace }}"
      - logs
      - metastore-0
      - --container=metastore
      - --previous
      - --tail=300
  register: ecs_cdw_failed_metastore_previous_logs
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh

- name: Collect failed CDW persistent volume claims
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_cdw_kubernetes_namespace }}"
      - get
      - persistentvolumeclaims
      - --output
      - >-
        custom-columns=NAME:.metadata.name,STATUS:.status.phase,REQUESTED:.spec.resources.requests.storage,CAPACITY:.status.capacity.storage,CLASS:.spec.storageClassName,VOLUME:.spec.volumeName
  register: ecs_cdw_failed_pvcs
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh

- name: Collect failed Hue query processor logs
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_cdw_kubernetes_namespace }}"
      - logs
      - hue-query-processor-0
      - --all-containers=true
      - --tail=200
  register: ecs_cdw_hue_query_processor_logs
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh

- name: Collect previous failed Hue query processor logs
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_cdw_kubernetes_namespace }}"
      - logs
      - hue-query-processor-0
      - --all-containers=true
      - --previous
      - --tail=200
  register: ecs_cdw_hue_query_processor_previous_logs
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh

- name: Collect recent failed CDW namespace events
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_cdw_kubernetes_namespace }}"
      - get
      - events
      - --field-selector=type=Warning
      - --sort-by=.lastTimestamp
      - --output
      - >-
        custom-columns=LAST:.lastTimestamp,REASON:.reason,OBJECT:.involvedObject.name,MESSAGE:.message
  register: ecs_cdw_failed_events
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh

- name: Report failed CDW Kubernetes diagnostics
  ansible.builtin.debug:
    msg:
      - >-
        CDW result=FAILED; workload snapshot={{
          'NOT READY'
          if ecs_cdw_failed_pods.stdout | default('')
          is search('(?i)(false|pending|failed|unknown|error|crashloopbackoff|init:)')
          else 'READY at diagnostic time'
        }}; namespace={{ ecs_cdw_kubernetes_namespace }}; matching namespaces={{
        (
          ecs_cdw_failed_namespaces.stdout_lines
          | default([])
          | select('search', '(?i)(warehouse|dwx|cdw)')
          | list
          | join(', ')
        )
        | default('none found', true)
        }}
      - >-
        Pods={{
        (
          ecs_cdw_failed_pods.stdout_lines
          | default(
              [ecs_cdw_failed_pods.stderr | default('unavailable', true)],
              true
            )
          | join(' | ')
        )
        }}
      - >-
        Metastore StatefulSet={{
        ecs_cdw_failed_metastore_statefulset.stdout
        | default(ecs_cdw_failed_metastore_statefulset.stderr, true)
        | default('unavailable', true)
        }}
      - >-
        Storage={{
        (
        ecs_cdw_failed_pvcs.stdout_lines
        | default(
            [ecs_cdw_failed_pvcs.stderr | default('unavailable', true)],
            true
          )
        | join(' | ')
        )
        }}
      - >-
        Latest warning event={{
        (
          ecs_cdw_failed_events.stdout_lines
          | default([])
        )[1:]
        | last
        | default(
            ecs_cdw_failed_events.stderr
            | default('no Warning events returned', true),
            true
          )
        }}
      - >-
        Root-cause log evidence: metastore={{
        (
          (
            ecs_cdw_failed_metastore_logs.stdout_lines | default([], true)
          )
          + (
            ecs_cdw_failed_metastore_previous_logs.stdout_lines
            | default([], true)
          )
        )
        | select(
            'search',
            '(?i)(error|fatal|exception|failed|failure|denied|forbidden|unauthorized|timed out|timeout|unable|refused|not found|no such|oomkilled|back-off)'
          )
        | reject('search', '(?i)InsecureRequestWarning')
        | list
        | last
        | default('no error signature found', true)
        }}; hue={{
        (
          (
            ecs_cdw_hue_query_processor_logs.stdout_lines
            | default([], true)
          )
          + (
            ecs_cdw_hue_query_processor_previous_logs.stdout_lines
            | default([], true)
          )
        )
        | select(
            'search',
            '(?i)(error|fatal|exception|failed|failure|denied|forbidden|unauthorized|timed out|timeout|unable|refused|not found|no such|oomkilled|back-off)'
          )
        | reject('search', '(?i)InsecureRequestWarning')
        | list
        | last
        | default('no error signature found', true)
        }}

- name: CDW diagnostics | Record diagnostics completion
  ansible.builtin.set_fact:
    ecs_cdw_diagnostics_collected: true

---
- name: ECS API credentials | Validate current access key
  ansible.builtin.command:
    argv: >-
      {{
        ecs_remote_cdp_cli_prefix
        + ['iam', 'list-users']
      }}
  environment: "{{ ecs_remote_cdp_cli_environment }}"
  register: ecs_api_access_key_validation
  changed_when: false
  failed_when: false
  no_log: true
  become: false
  delegate_to: "{{ groups[ecs_cluster_master_group][0] }}"
  connection: ssh

- name: ECS API credentials | Classify stale access key
  ansible.builtin.set_fact:
    ecs_api_access_key_stale: >-
      {{
        ecs_api_access_key_validation.rc | int != 0
        and (
          (
            ecs_api_access_key_validation.stderr
            | default(ecs_api_access_key_validation.stdout, true)
          )
          is search(
            '(?i)(no access key found|not_found|status code: 401|'
            ~ 'unauthenticated|invalid[^\\n]*access key|signature)'
          )
        )
      }}

- name: ECS API credentials | Reject non-authentication validation failures
  ansible.builtin.fail:
    msg: >-
      ECS automation API credential validation failed for a reason other than
      a missing or invalid access key (rc={{ ecs_api_access_key_validation.rc }}):
      {{
        ecs_api_access_key_validation.stderr
        | default(ecs_api_access_key_validation.stdout, true)
      }}
  when:
    - ecs_api_access_key_validation.rc | int != 0
    - not (ecs_api_access_key_stale | bool)

- name: ECS API credentials | Replace stale cached automation key
  when: ecs_api_access_key_stale | bool
  block:
    - name: ECS API credentials | Report stale cached key recovery
      ansible.builtin.debug:
        msg: >-
          Cached ECS automation access key {{ ecs_api_access_key_id }} no longer
          exists or is no longer accepted by IAM. Replacing it through the
          configured installer/bootstrap credential before LDAP reconciliation.

    - name: ECS API credentials | Remove stale remote profile
      ansible.builtin.file:
        path: "{{ ecs_remote_cdp_profile_dir.path }}"
        state: absent
      changed_when: false
      become: false
      delegate_to: "{{ groups[ecs_cluster_master_group][0] }}"
      connection: ssh

    - name: ECS API credentials | Remove stale controller cache
      ansible.builtin.file:
        path: "{{ ecs_api_credentials_cache_path }}"
        state: absent
      when: ecs_api_credentials_cache_path | default('') | length > 0
      delegate_to: localhost
      connection: local

    - name: ECS API credentials | Clear stale credential facts
      ansible.builtin.set_fact:
        ecs_api_access_key_id: ""
        ecs_api_private_key: ""
      no_log: true

    - name: ECS API credentials | Provision replacement automation key
      ansible.builtin.include_tasks: ecs_provision_iam_machine_access_key.yml

    - name: ECS API credentials | Rebuild remote runtime with replacement key
      ansible.builtin.include_tasks: ecs_control_plane_remote_runtime.yml

    - name: ECS API credentials | Validate replacement access key
      ansible.builtin.command:
        argv: >-
          {{
            ecs_remote_cdp_cli_prefix
            + ['iam', 'list-users']
          }}
      environment: "{{ ecs_remote_cdp_cli_environment }}"
      register: ecs_api_access_key_replacement_validation
      changed_when: false
      no_log: true
      become: false
      delegate_to: "{{ groups[ecs_cluster_master_group][0] }}"
      connection: ssh

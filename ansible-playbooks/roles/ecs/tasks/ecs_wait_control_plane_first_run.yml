---
# Wait only after the CoreDNS forwarding policy is corrected. During ECS First
# Run, RKE2 and CoreDNS become available before the parent CM command completes.

- name: Wait for submitted ECS control plane First Run command
  block:
    - name: Poll submitted ECS control plane First Run command
      ansible.builtin.import_tasks: "{{ playbook_dir }}/common_tasks/wait_cm_api_command.yml"
      vars:
        cm_api_command_id: "{{ ecs_control_plane_install_command_id }}"
        cm_api_command_poll_retries: "{{ ecs_control_plane_install_poll_retries }}"
        cm_api_command_poll_delay: "{{ ecs_control_plane_install_poll_delay }}"
  rescue:
    - name: Collect uncensored ECS First Run failure diagnostics
      ansible.builtin.import_tasks: ecs_first_run_failure_diagnostics.yml

    - name: Fail with ECS First Run diagnostics location
      ansible.builtin.fail:
        msg: >-
          ECS First Run command {{ ecs_control_plane_install_command_id }} failed.
          The original CM failure was:
          {{ ansible_failed_result.msg | default('unknown CM command failure') }}
          Kubernetes ingress pods, events, node listeners, and runtime process
          state were printed immediately above without no_log.
  when:
    - not (ecs_control_plane_existing | bool)
    - ecs_control_plane_install is succeeded
    - ecs_control_plane_install_command_id | string | length > 0

- name: Wait for active CM commands during adopted ECS First Run
  ansible.builtin.include_tasks: "{{ playbook_dir }}/common_tasks/wait_cm_api_command.yml"
  vars:
    cm_api_command_id: "{{ ecs_active_control_plane_command.id }}"
    cm_api_command_poll_retries: "{{ ecs_control_plane_install_poll_retries }}"
    cm_api_command_poll_delay: "{{ ecs_control_plane_install_poll_delay }}"
  loop: "{{ ecs_control_plane_active_commands.json['items'] | default([]) }}"
  loop_control:
    loop_var: ecs_active_control_plane_command
    label: >-
      {{
        ecs_active_control_plane_command.name
        | default(ecs_active_control_plane_command.id)
      }}
  when:
    - ecs_control_plane_existing | bool
    - ecs_control_plane_active_commands.json['items'] | default([]) | length > 0

- name: Wait for adopted ECS First Run services after CoreDNS repair
  ansible.builtin.uri:
    url: >-
      {{ cm_cluster_module_api_url }}/clusters/{{
      ecs_cluster_name | urlencode }}/services?view=summary
    method: GET
    user: "{{ cm_admin_user }}"
    password: "{{ cm_admin_pass }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200]
    follow_redirects: none
  register: ecs_adopted_first_run_services
  changed_when: false
  until: >-
    (ecs_adopted_first_run_services.json['items'] | default([]) | length > 0)
    and
    (
      ecs_adopted_first_run_services.json['items'] | default([])
      | rejectattr('serviceState', 'equalto', 'STARTED')
      | list
      | length == 0
    )
  retries: "{{ ecs_control_plane_install_poll_retries }}"
  delay: "{{ ecs_control_plane_install_poll_delay }}"
  when: ecs_control_plane_existing | bool
  delegate_to: "{{ cm_cluster_module_delegate_to }}"

- name: Require adopted ECS First Run to complete
  ansible.builtin.assert:
    that:
      - ecs_adopted_first_run_services.json['items'] | default([]) | length > 0
      - >-
        (
          ecs_adopted_first_run_services.json['items'] | default([])
          | rejectattr('serviceState', 'equalto', 'STARTED')
          | list
          | length
        ) == 0
    fail_msg: >-
      The adopted ECS control-plane First Run did not bring every service in
      cluster '{{ ecs_cluster_name }}' to STARTED state after the CoreDNS repair.
      Last CM service states: {{
      ecs_adopted_first_run_services.json['items'] | default([])
      | map(attribute='name')
      | zip(
          ecs_adopted_first_run_services.json['items'] | default([])
          | map(attribute='serviceState')
        )
      | list }}.
      Do not submit another First Run; inspect the active command and its failed
      child commands in Cloudera Manager.
  when: ecs_control_plane_existing | bool

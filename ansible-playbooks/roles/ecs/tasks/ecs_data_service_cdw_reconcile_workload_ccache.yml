---
- name: CDW | Wait briefly for the warehouse namespace
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - get
      - namespace
      - "{{ ecs_cdw_kubernetes_namespace }}"
      - --output=name
  register: ecs_cdw_warehouse_namespace
  changed_when: false
  failed_when: false
  ignore_errors: true
  until: ecs_cdw_warehouse_namespace.rc | default(1) | int == 0
  retries: "{{ ecs_cdw_workload_reconcile_wait_retries | int }}"
  delay: "{{ ecs_cdw_workload_reconcile_wait_delay | int }}"
  become: true
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh

- name: CDW | Wait for the metastore StatefulSet
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_cdw_kubernetes_namespace }}"
      - get
      - statefulset
      - metastore
      - --output=json
  register: ecs_cdw_metastore_statefulset
  changed_when: false
  failed_when: false
  ignore_errors: true
  until: ecs_cdw_metastore_statefulset.rc | default(1) | int == 0
  retries: "{{ ecs_cdw_workload_reconcile_wait_retries | int }}"
  delay: "{{ ecs_cdw_workload_reconcile_wait_delay | int }}"
  become: true
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when: ecs_cdw_warehouse_namespace.rc | default(1) | int == 0

- name: CDW | Resolve metastore credential-cache environment
  ansible.builtin.set_fact:
    ecs_cdw_metastore_container: >-
      {{
        (
          (
            ecs_cdw_metastore_statefulset.stdout
            | from_json
          ).get('spec', {}).get('template', {}).get(
            'spec', {}
          ).get('containers', [])
          | selectattr('name', 'equalto', 'metastore')
          | first
          | default({})
        )
      }}
  when: ecs_cdw_metastore_statefulset.rc | default(1) | int == 0

- name: CDW | Resolve current metastore credential cache
  ansible.builtin.set_fact:
    ecs_cdw_metastore_krb5ccname_current: >-
      {{
        (
          ecs_cdw_metastore_container.env | default([])
          | selectattr('name', 'equalto', 'KRB5CCNAME')
          | map(attribute='value')
          | first
          | default('')
        )
      }}
  when: ecs_cdw_metastore_statefulset.rc | default(1) | int == 0

- name: CDW | Route metastore Kerberos tickets to a FILE cache
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_cdw_kubernetes_namespace }}"
      - set
      - env
      - statefulset/metastore
      - --containers=metastore
      - "KRB5CCNAME={{ ecs_cdw_workload_krb5ccname }}"
  register: ecs_cdw_metastore_ccache_update
  changed_when: true
  become: true
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when:
    - ecs_cdw_metastore_statefulset.rc | default(1) | int == 0
    - ecs_cdw_metastore_krb5ccname_current != ecs_cdw_workload_krb5ccname

- name: CDW | Recreate the initial metastore pod with FILE cache settings
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_cdw_kubernetes_namespace }}"
      - delete
      - pod
      - metastore-0
      - --ignore-not-found=true
  changed_when: true
  become: true
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when: ecs_cdw_metastore_ccache_update is changed

- name: CDW | Wait for metastore FILE-cache rollout
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_cdw_kubernetes_namespace }}"
      - rollout
      - status
      - statefulset/metastore
      - "--timeout={{ ecs_cdw_workload_rollout_timeout }}"
  changed_when: false
  become: true
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when: ecs_cdw_metastore_ccache_update is changed

- name: CDW | Read reconciled metastore StatefulSet
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_cdw_kubernetes_namespace }}"
      - get
      - statefulset
      - metastore
      - --output=jsonpath={.spec.template.spec.containers[?(@.name=="metastore")].env[?(@.name=="KRB5CCNAME")].value}
  register: ecs_cdw_metastore_ccache_verify
  changed_when: false
  become: true
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when: ecs_cdw_metastore_statefulset.rc | default(1) | int == 0

- name: CDW | Require metastore FILE credential cache
  ansible.builtin.assert:
    that:
      - >-
        ecs_cdw_metastore_ccache_verify.stdout | default('') | trim
        == ecs_cdw_workload_krb5ccname
    fail_msg: >-
      The generated CDW metastore workload still uses a non-FILE Kerberos
      credential cache. Containers do not run a KCM daemon; kinit fails with
      "No KCM server found" unless KRB5CCNAME={{ ecs_cdw_workload_krb5ccname }}.
  when: ecs_cdw_metastore_statefulset.rc | default(1) | int == 0

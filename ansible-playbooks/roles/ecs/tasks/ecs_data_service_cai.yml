---
- name: CAI | Complete ML workspace installation
  when: "'cai' in (ecs_data_services_install_names | default([]))"
  block:
    - name: Record ML workspace provisioning result
      ansible.builtin.set_fact:
        ecs_cai_workspace_succeeded: >-
          {{
            ecs_cai_workspace.finished | default(false) | bool
            and (ecs_cai_workspace.workspace | default({})) is mapping
            and (ecs_cai_workspace.workspace | default({})).instanceUrl | default('') | length > 0
            and (
              (ecs_cai_workspace.workspace | default({})).instanceStatus | default('')
              in ['installation:finished', 'modify:finished']
            )
          }}

    - name: Report ML workspace provisioning failure
      ansible.builtin.debug:
        msg: >-
          CAI provisioning did not return an activated workspace:
          {{ ecs_cai_workspace.msg | default(ecs_cai_workspace | to_json) }}
      when: not (ecs_cai_workspace_succeeded | bool)

    - name: Record CAI effective workspace status
      ansible.builtin.set_fact:
        ecs_cai_status: >-
          {{
            (
              'Existing and running (green)'
              if (ecs_cai_existing_workspace | default({}) | length > 0)
              else 'Created successfully (green)'
            )
            + ': effective_name='
            + ecs_cai_workspace_name_effective
            + ', status='
            + (
                (ecs_cai_workspace.workspace | default({})).instanceStatus
                | default('unknown')
              )
            + (
                ', skipped='
                + (ecs_cai_workspace_collision_evidence | default([]) | to_json)
                if (ecs_cai_workspace_collision_evidence | default([]) | length > 0)
                else ''
              )
          }}
      when: ecs_cai_workspace_succeeded | bool

    - name: Record workbench endpoint
      ansible.builtin.set_fact:
        ecs_cai_workspace_url: "{{ ecs_cai_workspace.workspace.instanceUrl | regex_replace('/+$', '') }}"
        ecs_cai_workbench_hostname: >-
          {{
            ecs_cai_workspace.workspace.instanceUrl
            | regex_replace('^https?://', '')
            | regex_replace('/.*$', '')
            | regex_replace(':.*$', '')
          }}
      when:
        - ecs_cai_workspace_succeeded | bool

    - name: Report CAI Workbench outcome
      ansible.builtin.debug:
        msg: >-
          CAI Workbench: {{
          'Existing and running; reused without create or rename'
          if ecs_cai_existing_workspace | default({}) | length > 0
          else 'Created successfully'
          }}. instanceName={{ ecs_cai_workspace_name_effective }};
          observed_status={{
          (ecs_cai_workspace.workspace | default({})).instanceStatus
          | default('unknown') }};
          endpoint={{ ecs_cai_workspace_url | default('not returned') }};
          environment={{
          (ecs_cai_workspace.workspace | default({})).environmentName
          | default(ecs_cdp_environment_name) }}.
      when: ecs_cai_workspace_succeeded | bool

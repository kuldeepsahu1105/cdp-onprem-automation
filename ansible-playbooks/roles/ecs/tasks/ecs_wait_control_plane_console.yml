---
- name: Resolve ECS control plane URL
  ansible.builtin.import_tasks: resolve_ecs_control_plane_url.yml

- name: Require ECS master for Management Console probe
  ansible.builtin.assert:
    that:
      - groups.get(ecs_cluster_master_group, []) | length > 0
    fail_msg: >-
      ECS Management Console validation requires a host in inventory group
      '{{ ecs_cluster_master_group }}'.

- name: Use SSH for ECS Management Console probe delegation
  ansible.builtin.add_host:
    name: "{{ groups[ecs_cluster_master_group][0] }}"
    ansible_connection: ssh
  changed_when: false

- name: Wait for ECS Management Console to respond
  ansible.builtin.uri:
    url: "{{ ecs_control_plane_url_effective.rstrip('/') }}/"
    method: GET
    validate_certs: "{{ ecs_control_plane_validate_certs | default(false) | bool }}"
    status_code: [200, 301, 302, 303, 401, 403]
    timeout: 20
  register: ecs_console_wait
  until: ecs_console_wait.status | default(0) in [200, 301, 302, 303, 401, 403]
  retries: "{{ ecs_control_plane_wait_retries | default(40) }}"
  delay: "{{ ecs_control_plane_wait_delay | default(15) }}"
  failed_when: false
  delegate_to: "{{ groups[ecs_cluster_master_group][0] }}"

- name: Fail when ECS console did not become reachable
  ansible.builtin.fail:
    msg: >-
      ECS console was not reachable from {{ groups[ecs_cluster_master_group][0] }}
      at {{ ecs_control_plane_url_effective }} after waiting. Last status={{
      ecs_console_wait.status | default('unreachable') }}, message={{
      ecs_console_wait.msg | default('none') }}. Confirm ECS cluster services are
      started and DNS resolves for
      {{ ecs_console_host_prefix }}.{{ ecs_app_domain }}.
  when: ecs_console_wait.status | default(0) not in [200, 301, 302, 303, 401, 403]

---
- name: CDW | Check for an existing Data Warehouse cluster
  cloudera.cloud.dw_cluster_info:
    environment: "{{ ecs_cdp_environment_name }}"
    endpoint_tls: "{{ ecs_data_services_verify_tls | default(false) | bool }}"
  environment: "{{ ecs_cdp_cli_environment }}"
  register: ecs_cdw_preflight_cluster_info
  changed_when: false
  until: ecs_cdw_preflight_cluster_info is succeeded
  retries: "{{ ecs_data_services_dns_probe_attempts | default(3) | int }}"
  delay: "{{ ecs_data_services_dns_probe_retry_delay | int }}"
  vars:
    ansible_python_interpreter: "{{ hostvars['localhost'].ecs_data_services_remote_venv_path }}/bin/python"
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when: "'cdw' in (ecs_data_services_install_names | default([]))"

- name: CDW | Select deactivated cluster records
  ansible.builtin.set_fact:
    ecs_cdw_deactivated_clusters: >-
      {{
        ecs_cdw_preflight_cluster_info.clusters
        | default([])
        | selectattr('status', 'defined')
        | selectattr('status', 'search', '(?i)^deactivated$')
        | list
      }}
  when: "'cdw' in (ecs_data_services_install_names | default([]))"

- name: CDW | Refuse to mutate deactivated clusters
  ansible.builtin.assert:
    that:
      - ecs_cdw_deactivated_clusters | default([]) | length == 0
    fail_msg: >-
      An existing CDW cluster is Deactivated. The pinned cloudera.cloud
      dw_cluster module cannot reactivate an existing Deactivated cluster. In
      the observed UI failure, the cluster-specific t-shirt-sizes endpoint
      returned HTTP 404 (404 page not found / NOT_FOUND_ERROR), so the UI did
      not submit the activation POST. Automation will not activate, delete,
      recreate, or restart the cluster. Repair and use the supported DWX
      UI/backend activation path, activate the cluster manually, then rerun
      this playbook.
  when:
    - "'cdw' in (ecs_data_services_install_names | default([]))"

- name: CDW | Select terminal failed cluster records
  ansible.builtin.set_fact:
    ecs_cdw_failed_clusters: >-
      {{
        ecs_cdw_preflight_cluster_info.clusters
        | default([])
        | selectattr('status', 'defined')
        | selectattr('status', 'search', '(?i)(error|failed)$')
        | list
      }}
  when: "'cdw' in (ecs_data_services_install_names | default([]))"

- name: CDW | Refuse to mutate terminal failed clusters
  ansible.builtin.assert:
    that:
      - ecs_cdw_failed_clusters | default([]) | length == 0
    fail_msg: >-
      Existing CDW cluster records are terminally failed:
      {{ ecs_cdw_failed_clusters | default([]) | to_json }}. Automation will
      not delete or recreate failed clusters. Resolve or remove them through
      the supported control-plane workflow, then rerun.
  when:
    - "'cdw' in (ecs_data_services_install_names | default([]))"

- name: CDW | Resolve legacy automation principal cleanup identity
  ansible.builtin.set_fact:
    ecs_cdw_legacy_principal_hostnames: >-
      {{
        [
          'dwx-env-' + ecs_cdp_environment_name + '.cdp.local',
          'dwx-env-' + ecs_cdp_environment_name + '.' + ipaserver_domain
        ]
        | unique
        | list
      }}
    ecs_cdw_legacy_principal_cleanup_marker: >-
      {{ ecs_cdw_legacy_principal_cleanup_marker_dir }}/cdw-product-owned-v2-{{
        ecs_cdp_environment_name | hash('sha256')
      }}
  when:
    - "'cdw' in (ecs_data_services_install_names | default([]))"
    - identity_provider_effective | default('freeipa') == 'freeipa'
    - ipa_server_in_inventory | default(false) | bool
    - ipaserver_inventory_host | default('') | length > 0
    - ecs_cdw_cleanup_legacy_automation_principals | default(true) | bool
    - ecs_cdw_preflight_cluster_info.clusters | default([]) | length == 0

- name: CDW | Check legacy principal cleanup marker
  ansible.builtin.stat:
    path: "{{ ecs_cdw_legacy_principal_cleanup_marker }}"
  register: ecs_cdw_legacy_principal_cleanup_marker_stat
  delegate_to: "{{ ipaserver_inventory_host }}"
  connection: ssh
  when:
    - ecs_cdw_legacy_principal_cleanup_marker is defined

- name: CDW | Remove legacy automation-owned principals exactly once
  when:
    - ecs_cdw_legacy_principal_cleanup_marker_stat is defined
    - not (ecs_cdw_legacy_principal_cleanup_marker_stat.stat.exists | default(false) | bool)
  block:
    - name: CDW | Remove legacy automation-owned Hive principal
      freeipa.ansible_freeipa.ipaservice:
        ipaadmin_password: "{{ ipaadmin_password }}"
        ipaadmin_principal: "{{ ipaadmin_principal }}"
        name: "hive/{{ item }}"
        state: absent
      loop: "{{ ecs_cdw_legacy_principal_hostnames }}"
      loop_control:
        label: "hive/{{ item }}"
      delegate_to: "{{ ipaserver_inventory_host }}"
      connection: ssh

    - name: CDW | Remove legacy automation-owned host principal
      freeipa.ansible_freeipa.ipahost:
        ipaadmin_password: "{{ ipaadmin_password }}"
        ipaadmin_principal: "{{ ipaadmin_principal }}"
        name: "{{ item }}"
        state: absent
      loop: "{{ ecs_cdw_legacy_principal_hostnames }}"
      loop_control:
        label: "{{ item }}"
      delegate_to: "{{ ipaserver_inventory_host }}"
      connection: ssh

    - name: CDW | Record product-owned principal lifecycle migration
      ansible.builtin.copy:
        dest: "{{ ecs_cdw_legacy_principal_cleanup_marker }}"
        owner: root
        group: root
        mode: "0600"
        content: |
          environment={{ ecs_cdp_environment_name }}
          hostnames={{ ecs_cdw_legacy_principal_hostnames | join(',') }}
          lifecycle=product-owned
      delegate_to: "{{ ipaserver_inventory_host }}"
      connection: ssh
      become: true

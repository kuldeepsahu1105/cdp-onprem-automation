---
- name: DataViz | List authoritative cluster resources
  ansible.builtin.command:
    argv: "{{ ecs_data_services_cdp_cli_prefix + ['dw', 'list-data-visualizations', '--cluster-id', ecs_cdw_cluster.cluster.id] }}"
  environment: "{{ ecs_cdp_cli_environment }}"
  register: ecs_cdw_dataviz_list
  changed_when: false
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh

- name: DataViz | Build bounded deterministic names
  ansible.builtin.set_fact:
    ecs_cdw_dataviz_candidate_names: >-
      {%- set result = [] -%}
      {%- for attempt in range(1, (ecs_cdw_dataviz_name_attempts | int) + 1) -%}
      {%- set suffix = '' if attempt == 1 else '-' + (attempt | string) -%}
      {%- set stem_length = (ecs_cdw_dataviz_name_max_length | int) - (suffix | length) -%}
      {%- set _ = result.append(ecs_cdw_dataviz_name[:stem_length] + suffix) -%}
      {%- endfor -%}
      {{ result }}

- name: DataViz | Select reusable or first unused name
  ansible.builtin.set_fact:
    ecs_cdw_dataviz_selection: >-
      {%- set resources = (ecs_cdw_dataviz_list.stdout | from_json).dataVisualizations | default([]) -%}
      {%- set ns = namespace(selected={}) -%}
      {%- for candidate in ecs_cdw_dataviz_candidate_names if ns.selected | length == 0 -%}
      {%- set matches = resources | selectattr('name', 'equalto', candidate) | list -%}
      {%- if matches | length == 0 -%}
      {%- set ns.selected = {'name': candidate, 'existing': false, 'status': 'Absent'} -%}
      {%- elif (
        matches[0].status | default('')
        is search('(?i)^(running|creating|created|accepted|starting|stopping|stopped|updating|preupdate|upgrading|preupgrade|restarting|waiting)$')
      ) -%}
      {%- set ns.selected = {
        'name': candidate,
        'existing': true,
        'status': matches[0].status | default('Unknown'),
        'id': matches[0].id | default('')
      } -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.selected }}

- name: DataViz | Require an available bounded name
  ansible.builtin.assert:
    that:
      - ecs_cdw_dataviz_selection | length > 0
    fail_msg: >-
      Data Visualization could not find a reusable or unused name after
      {{ ecs_cdw_dataviz_name_attempts }} attempts. Failed, Error, and Deleting
      resources are retained and skipped; automation does not delete them.

- name: DataViz | Record effective name
  ansible.builtin.set_fact:
    ecs_cdw_dataviz_name_effective: "{{ ecs_cdw_dataviz_selection.name }}"

- name: DataViz | Create unused resource
  ansible.builtin.command:
    argv: >-
      {{
        ecs_data_services_cdp_cli_prefix
        + [
          'dw', 'create-data-visualization',
          '--cluster-id', ecs_cdw_cluster.cluster.id,
          '--name', ecs_cdw_dataviz_name_effective,
          '--config', {
            'userGroups': ecs_cdw_dataviz_user_groups,
            'adminGroups': ecs_cdw_dataviz_admin_groups
          } | to_json
        ]
        + (
          ['--resource-template', ecs_cdw_dataviz_resource_template]
          if ecs_cdw_dataviz_resource_template | length > 0 else []
        )
        + (
          ['--resource-pool', ecs_cdw_dataviz_resource_pool]
          if ecs_cdw_dataviz_resource_pool | length > 0 else []
        )
      }}
  environment: "{{ ecs_cdp_cli_environment }}"
  register: ecs_cdw_dataviz_create
  changed_when: ecs_cdw_dataviz_create.rc == 0
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when: not (ecs_cdw_dataviz_selection.existing | bool)

- name: DataViz | Wait for effective resource
  ansible.builtin.command:
    argv: "{{ ecs_data_services_cdp_cli_prefix + ['dw', 'list-data-visualizations', '--cluster-id', ecs_cdw_cluster.cluster.id] }}"
  environment: "{{ ecs_cdp_cli_environment }}"
  register: ecs_cdw_dataviz_wait
  changed_when: false
  until: >-
    (
      (ecs_cdw_dataviz_wait.stdout | from_json).dataVisualizations
      | default([])
      | selectattr('name', 'equalto', ecs_cdw_dataviz_name_effective)
      | map(attribute='status')
      | first
      | default('')
    ) is search('(?i)^(running|failed|error)$')
  retries: "{{ ecs_cdw_dataviz_wait_retries | int }}"
  delay: "{{ ecs_cdw_dataviz_wait_delay | int }}"
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh

- name: DataViz | Record final state
  ansible.builtin.set_fact:
    ecs_cdw_dataviz_final: >-
      {{
        (
          (ecs_cdw_dataviz_wait.stdout | from_json).dataVisualizations
          | default([])
          | selectattr('name', 'equalto', ecs_cdw_dataviz_name_effective)
          | list
          | first
        ) | default({})
      }}

- name: DataViz | Require Running state
  ansible.builtin.assert:
    that:
      - ecs_cdw_dataviz_final.status | default('') == 'Running'
    fail_msg: >-
      Data Visualization {{ ecs_cdw_dataviz_name_effective }} reached
      {{ ecs_cdw_dataviz_final.status | default('unknown') }} instead of Running.

- name: DataViz | Record green result and catalog metadata
  ansible.builtin.set_fact:
    ecs_cdw_dataviz_succeeded: true
    ecs_cdw_dataviz_status: >-
      {{
        'Existing and running (green)'
        if ecs_cdw_dataviz_selection.existing | bool
        else 'Created successfully (green)'
      }}
    ecs_data_services_catalog: >-
      {{
        ecs_data_services_catalog | combine(
          {
            'cdw': ecs_data_services_catalog.cdw | default({}) | combine(
              {
                'data_visualization': {
                  'name': ecs_cdw_dataviz_name,
                  'effective_name': ecs_cdw_dataviz_name_effective,
                  'status': ecs_cdw_dataviz_final.status
                }
              },
              recursive=True
            )
          },
          recursive=True
        )
      }}

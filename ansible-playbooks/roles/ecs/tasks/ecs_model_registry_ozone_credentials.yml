---
- name: Ozone S3 | Authenticate to Kerberos on selected Ozone host
  ansible.builtin.command:
    argv:
      - kinit
      - "{{ ipaadmin_principal }}"
    stdin: "{{ common_password | default(ipaadmin_password, true) }}"
  changed_when: false
  no_log: true
  delegate_to: "{{ ecs_model_registry_ozone_hosts | first }}"
  connection: ssh
  run_once: true
  vars:
    ansible_python_interpreter: >-
      {{
        hostvars[ecs_model_registry_ozone_hosts | first].ansible_python_interpreter
        | default('/usr/bin/python3', true)
      }}

- name: Ozone S3 | Read secret on selected Ozone host
  ansible.builtin.command:
    cmd: ozone s3 getsecret --om-service-id={{ ecs_model_registry_ozone_service_id }}
  register: ecs_ozone_getsecret
  changed_when: false
  no_log: true
  delegate_to: "{{ ecs_model_registry_ozone_hosts | first }}"
  connection: ssh
  run_once: true
  vars:
    ansible_python_interpreter: >-
      {{
        hostvars[ecs_model_registry_ozone_hosts | first].ansible_python_interpreter
        | default('/usr/bin/python3', true)
      }}

- name: Ozone S3 | Parse credentials on selected Ozone host
  ansible.builtin.set_fact:
    ozone_s3_access_key: >-
      {{
        ecs_ozone_getsecret.stdout_lines
        | select('match', '^awsAccessKey=')
        | map('regex_replace', '^awsAccessKey=', '')
        | first
        | default('')
      }}
    ozone_s3_secret_key: >-
      {{
        ecs_ozone_getsecret.stdout_lines
        | select('match', '^awsSecret=')
        | map('regex_replace', '^awsSecret=', '')
        | first
        | default('')
      }}
  delegate_to: "{{ ecs_model_registry_ozone_hosts | first }}"
  delegate_facts: true
  run_once: true
  no_log: true

- name: Ozone S3 | Require parsed credentials
  ansible.builtin.assert:
    that:
      - >-
        hostvars[ecs_model_registry_ozone_hosts | first].ozone_s3_access_key
        | default('') | length > 0
      - >-
        hostvars[ecs_model_registry_ozone_hosts | first].ozone_s3_secret_key
        | default('') | length > 0
    fail_msg: >-
      ozone s3 getsecret did not return both awsAccessKey and awsSecret on
      {{ ecs_model_registry_ozone_hosts | first }}.
  no_log: true
  run_once: true

---
- name: Initialize Data Warehouse follow-up result
  ansible.builtin.set_fact:
    ecs_cdw_catalog_succeeded: false
    ecs_cdw_dataviz_succeeded: false

- name: CDW | Complete database catalog and Virtual Warehouses
  when:
    - "'cdw' in (ecs_data_services_install_names | default([]))"
    - ecs_cdw_cluster_succeeded | default(false) | bool
  block:
    - name: Wait for default database catalog record
      cloudera.cloud.dw_database_catalog_info:
        cluster_id: "{{ ecs_cdw_cluster.cluster.id }}"
        verify_tls: "{{ ecs_data_services_verify_tls | default(false) | bool }}"
      environment: "{{ ecs_cdp_cli_environment }}"
      register: ecs_cdw_dbc_info
      until: ecs_cdw_dbc_info.database_catalogs | default([]) | length > 0
      retries: "{{ ecs_cdw_dbc_wait_retries | default(40) }}"
      delay: "{{ ecs_cdw_dbc_wait_delay | default(30) }}"
      failed_when: false
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh

    - name: Set default database catalog id
      ansible.builtin.set_fact:
        ecs_cdw_catalog_id: >-
          {{
            ecs_cdw_dbc_info.database_catalogs
            | default([])
            | map(attribute='id')
            | list
            | first
          }}
        ecs_cdw_catalog_initial_status: >-
          {{
            ecs_cdw_dbc_info.database_catalogs
            | default([])
            | map(attribute='status')
            | list
            | first
            | default('', true)
          }}
      when: ecs_cdw_dbc_info.database_catalogs | default([]) | length > 0

    - name: Read database catalog service configuration
      ansible.builtin.command:
        argv: >-
          {{
            ecs_data_services_cdp_cli_prefix
            + [
                'dw',
                'describe-dbc-config',
                '--cluster-id',
                ecs_cdw_cluster.cluster.id,
                '--dbc-id',
                ecs_cdw_catalog_id
              ]
          }}
      environment: "{{ ecs_cdp_cli_environment }}"
      register: ecs_cdw_dbc_config
      changed_when: false
      until: ecs_cdw_dbc_config.rc == 0
      retries: "{{ ecs_cdw_submission_recovery_retries | int }}"
      delay: "{{ ecs_cdw_submission_recovery_delay | int }}"
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when:
        - ecs_cdw_catalog_id | default('') | length > 0
        - ecs_cdw_workload_file_ccache_reconcile | default(true) | bool

    - name: Read initial generated metastore FILE credential cache
      ansible.builtin.command:
        argv:
          - "{{ ecs_coredns_kubectl_path }}"
          - --kubeconfig
          - "{{ ecs_coredns_kubeconfig_path }}"
          - --namespace
          - "{{ ecs_cdw_kubernetes_namespace }}"
          - get
          - pod
          - metastore-0
          - --output
          - >-
            jsonpath={.spec.containers[?(@.name=="metastore")].env[?(@.name=="KRB5CCNAME")].value}
      register: ecs_cdw_metastore_krb5ccname_initial
      changed_when: false
      failed_when: false
      become: true
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when:
        - ecs_cdw_catalog_id | default('') | length > 0
        - ecs_cdw_workload_file_ccache_reconcile | default(true) | bool

    - name: Read initial generated metastore readiness
      ansible.builtin.command:
        argv:
          - "{{ ecs_coredns_kubectl_path }}"
          - --kubeconfig
          - "{{ ecs_coredns_kubeconfig_path }}"
          - --namespace
          - "{{ ecs_cdw_kubernetes_namespace }}"
          - get
          - pod
          - metastore-0
          - --output
          - >-
            jsonpath={.status.containerStatuses[?(@.name=="metastore")].ready}
      register: ecs_cdw_metastore_ready_initial
      changed_when: false
      failed_when: false
      become: true
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when:
        - ecs_cdw_catalog_id | default('') | length > 0
        - ecs_cdw_workload_file_ccache_reconcile | default(true) | bool

    - name: Read initial generated metastore logs
      ansible.builtin.command:
        argv:
          - "{{ ecs_coredns_kubectl_path }}"
          - --kubeconfig
          - "{{ ecs_coredns_kubeconfig_path }}"
          - --namespace
          - "{{ ecs_cdw_kubernetes_namespace }}"
          - logs
          - pod/metastore-0
          - --container=metastore
          - --tail=100
      register: ecs_cdw_metastore_logs_initial
      changed_when: false
      failed_when: false
      become: true
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when:
        - ecs_cdw_catalog_id | default('') | length > 0
        - ecs_cdw_workload_file_ccache_reconcile | default(true) | bool

    - name: Read previous generated metastore logs
      ansible.builtin.command:
        argv:
          - "{{ ecs_coredns_kubectl_path }}"
          - --kubeconfig
          - "{{ ecs_coredns_kubeconfig_path }}"
          - --namespace
          - "{{ ecs_cdw_kubernetes_namespace }}"
          - logs
          - pod/metastore-0
          - --container=metastore
          - --previous
          - --tail=100
      register: ecs_cdw_metastore_previous_logs_initial
      changed_when: false
      failed_when: false
      become: true
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when:
        - ecs_cdw_catalog_id | default('') | length > 0
        - ecs_cdw_workload_file_ccache_reconcile | default(true) | bool

    - name: Check database catalog FILE credential cache configuration
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json
            import sys

            desired_patch = json.loads(sys.argv[1])
            desired = (
                desired_patch["applicationConfigs"]["metastore"]["configBlocks"][0]
                ["content"]["keyValues"]["KRB5CCNAME"]
            )
            payload = json.load(sys.stdin)
            if isinstance(payload, str):
                payload = json.loads(payload)
            config = payload.get("config", payload)
            blocks = (
                config.get("applicationConfigs", {})
                .get("metastore", {})
                .get("configBlocks", [])
            )
            current = ""
            for block in blocks:
                if block.get("id") == "env":
                    current = (
                        block.get("content", {})
                        .get("keyValues", {})
                        .get("KRB5CCNAME", "")
                    )
                    break
            print(current)
            raise SystemExit(0 if current == desired else 3)
          - "{{ ecs_cdw_dbc_file_ccache_config | to_json }}"
        stdin: "{{ ecs_cdw_dbc_config.stdout | to_json }}"
      register: ecs_cdw_dbc_ccache_check
      changed_when: false
      failed_when: ecs_cdw_dbc_ccache_check.rc not in [0, 3]
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when:
        - ecs_cdw_dbc_config is defined
        - ecs_cdw_dbc_config.rc | default(1) == 0

    - name: Merge database catalog FILE cache into live metastore configuration
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import copy
            import json
            import sys

            desired_patch = json.loads(sys.argv[1])
            desired = (
                desired_patch["applicationConfigs"]["metastore"]["configBlocks"][0]
                ["content"]["keyValues"]["KRB5CCNAME"]
            )
            payload = json.load(sys.stdin)
            if isinstance(payload, str):
                payload = json.loads(payload)
            config = payload.get("config", payload)
            blocks = (
                config.get("applicationConfigs", {})
                .get("metastore", {})
                .get("configBlocks", [])
            )
            env = next(
                (copy.deepcopy(block) for block in blocks if block.get("id") == "env"),
                None,
            )
            if env is None:
                env = {"id": "env", "content": {"keyValues": {}}}
            content = env.setdefault("content", {})
            key_values = content.setdefault("keyValues", {})
            key_values["KRB5CCNAME"] = desired
            patch = {
                "applicationConfigs": {
                    "metastore": {
                        "configBlocks": [env],
                    },
                },
            }
            print(json.dumps(patch, separators=(",", ":"), sort_keys=True))
          - "{{ ecs_cdw_dbc_file_ccache_config | to_json }}"
        stdin: "{{ ecs_cdw_dbc_config.stdout | to_json }}"
      register: ecs_cdw_dbc_file_ccache_config_effective
      changed_when: false
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when:
        - ecs_cdw_dbc_config is defined
        - ecs_cdw_dbc_config.rc | default(1) == 0

    - name: Detect fresh catalog FILE cache bootstrap requirement
      ansible.builtin.set_fact:
        ecs_cdw_dbc_starting_ccache_bootstrap_required: >-
          {{
            (
              (
                ecs_cdw_metastore_krb5ccname_initial.stdout
                | default('')
                | trim
                != ecs_cdw_workload_krb5ccname
              )
              or (
                ecs_cdw_metastore_ready_initial.stdout
                | default('')
                | trim
                != 'true'
                and (
                  (
                    ecs_cdw_metastore_logs_initial.stdout
                    | default('')
                  )
                  ~ '\n'
                  ~ (
                    ecs_cdw_metastore_logs_initial.stderr
                    | default('')
                  )
                  ~ '\n'
                  ~ (
                    ecs_cdw_metastore_previous_logs_initial.stdout
                    | default('')
                  )
                  ~ '\n'
                  ~ (
                    ecs_cdw_metastore_previous_logs_initial.stderr
                    | default('')
                  )
                )
                is search(
                  '(?i)(No KCM server|default ccache.*KCM|KCM server)'
                )
              )
            )
            and (
              ecs_cdw_catalog_initial_status | default('')
              is not search(
                '(?i)^(running|stopped|suspended|deactivated|'
                ~ 'failed|error|deleted|deleting)$'
              )
            )
          }}
      when:
        - ecs_cdw_metastore_krb5ccname_initial is defined
        - ecs_cdw_metastore_ready_initial is defined
        - ecs_cdw_metastore_logs_initial is defined
        - ecs_cdw_metastore_previous_logs_initial is defined

    - name: Keep metastore on FILE cache until CDW persists the catalog setting
      ansible.builtin.shell: |
        set -o pipefail

        desired={{ ecs_cdw_workload_krb5ccname | quote }}
        attempts={{ ecs_cdw_dbc_wait_retries | int }}
        delay={{ ecs_cdw_dbc_wait_delay | int }}
        last_update_output=""

        config_is_converged() {
          local config_json="$1"
          CONFIG_JSON="${config_json}" DESIRED="${desired}" python3 -c '
        import json
        import os
        import sys

        payload = json.loads(os.environ["CONFIG_JSON"])
        if isinstance(payload, str):
            payload = json.loads(payload)
        blocks = (
            payload.get("config", payload)
            .get("applicationConfigs", {})
            .get("metastore", {})
            .get("configBlocks", [])
        )
        current = ""
        for block in blocks:
            if block.get("id") == "env":
                current = block.get("content", {}).get("keyValues", {}).get("KRB5CCNAME", "")
                break
        raise SystemExit(0 if current == os.environ["DESIRED"] else 3)
        '
        }

        for ((attempt = 1; attempt <= attempts; attempt++)); do
          template_cache="$(
            {{ ecs_coredns_kubectl_path | quote }}
            --kubeconfig {{ ecs_coredns_kubeconfig_path | quote }}
            --namespace {{ ecs_cdw_kubernetes_namespace | quote }}
            get statefulset/metastore
            --output 'jsonpath={.spec.template.spec.containers[?(@.name=="metastore")].env[?(@.name=="KRB5CCNAME")].value}'
            2>/dev/null || true
          )"
          if [[ "${template_cache}" != "${desired}" ]]; then
            {{ ecs_coredns_kubectl_path | quote }}
            --kubeconfig {{ ecs_coredns_kubeconfig_path | quote }}
            --namespace {{ ecs_cdw_kubernetes_namespace | quote }}
            set env statefulset/metastore --containers=metastore
            "KRB5CCNAME=${desired}" >/dev/null
          fi

          pod_exists=false
          if {{ ecs_coredns_kubectl_path | quote }} \
            --kubeconfig {{ ecs_coredns_kubeconfig_path | quote }} \
            --namespace {{ ecs_cdw_kubernetes_namespace | quote }} \
            get pod/metastore-0 >/dev/null 2>&1; then
            pod_exists=true
          fi
          pod_cache="$(
            {{ ecs_coredns_kubectl_path | quote }}
            --kubeconfig {{ ecs_coredns_kubeconfig_path | quote }}
            --namespace {{ ecs_cdw_kubernetes_namespace | quote }}
            get pod/metastore-0
            --output 'jsonpath={.spec.containers[?(@.name=="metastore")].env[?(@.name=="KRB5CCNAME")].value}'
            2>/dev/null || true
          )"
          pod_ready="$(
            {{ ecs_coredns_kubectl_path | quote }}
            --kubeconfig {{ ecs_coredns_kubeconfig_path | quote }}
            --namespace {{ ecs_cdw_kubernetes_namespace | quote }}
            get pod/metastore-0
            --output 'jsonpath={.status.containerStatuses[?(@.name=="metastore")].ready}'
            2>/dev/null || true
          )"
          kcm_failure=false
          if [[ "${pod_exists}" == true ]]; then
            pod_logs="$(
              {{ ecs_coredns_kubectl_path | quote }}
              --kubeconfig {{ ecs_coredns_kubeconfig_path | quote }}
              --namespace {{ ecs_cdw_kubernetes_namespace | quote }}
              logs pod/metastore-0 --container=metastore --tail=100
              2>&1 || true
            )"
            pod_previous_logs="$(
              {{ ecs_coredns_kubectl_path | quote }}
              --kubeconfig {{ ecs_coredns_kubeconfig_path | quote }}
              --namespace {{ ecs_cdw_kubernetes_namespace | quote }}
              logs pod/metastore-0 --container=metastore --previous --tail=100
              2>&1 || true
            )"
            if grep -Eqi "No KCM server|default ccache.*KCM|KCM server" \
              <<<"${pod_logs}"$'\n'"${pod_previous_logs}"; then
              kcm_failure=true
            fi
          fi
          if [[ "${pod_exists}" == true ]] && {
            [[ "${pod_cache}" != "${desired}" ]] ||
            {
              [[ "${pod_ready}" != true ]] &&
              [[ "${kcm_failure}" == true ]];
            }
          }; then
            {{ ecs_coredns_kubectl_path | quote }}
            --kubeconfig {{ ecs_coredns_kubeconfig_path | quote }}
            --namespace {{ ecs_cdw_kubernetes_namespace | quote }}
            delete pod/metastore-0 --wait=false --ignore-not-found=true >/dev/null
          fi

          set +e
          current_config="$(
            {{ ecs_data_services_cdp_cli_prefix | map('quote') | join(' ') }}
            dw describe-dbc-config
            --cluster-id {{ ecs_cdw_cluster.cluster.id | quote }}
            --dbc-id {{ ecs_cdw_catalog_id | quote }}
            2>/dev/null
          )"
          config_rc=$?
          set -e
          if [[ ${config_rc} -eq 0 ]] && config_is_converged "${current_config}"; then
            echo "CDW API already persists ${desired}."
            exit 0
          fi

          set +e
          last_update_output="$(
            {{ ecs_data_services_cdp_cli_prefix | map('quote') | join(' ') }}
            dw update-dbc
            --cluster-id {{ ecs_cdw_cluster.cluster.id | quote }}
            --dbc-id {{ ecs_cdw_catalog_id | quote }}
            --config {{ ecs_cdw_dbc_file_ccache_config_effective.stdout | quote }}
            2>&1
          )"
          update_rc=$?
          set -e
          if [[ ${update_rc} -eq 0 ]]; then
            printf '%s\n' "${last_update_output}"
            exit 0
          fi
          if ! grep -Eqi \
            "failed to acquire lease|already leased by operation|operation is not allowed in '(starting|stopping|updating)' state" \
            <<<"${last_update_output}"; then
            printf '%s\n' "${last_update_output}" >&2
            exit "${update_rc}"
          fi

          sleep "${delay}"
        done

        printf '%s\n' "${last_update_output}" >&2
        exit 1
      args:
        executable: /bin/bash
      environment: "{{ ecs_cdp_cli_environment }}"
      register: ecs_cdw_dbc_ccache_guarded_update
      changed_when: ecs_cdw_dbc_ccache_guarded_update.rc | default(1) == 0
      become: true
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when: ecs_cdw_dbc_starting_ccache_bootstrap_required | default(false) | bool

    - name: Persist database catalog FILE credential cache through CDW API
      ansible.builtin.command:
        argv: >-
          {{
            ecs_data_services_cdp_cli_prefix
            + [
                'dw',
                'update-dbc',
                '--cluster-id',
                ecs_cdw_cluster.cluster.id,
                '--dbc-id',
                ecs_cdw_catalog_id,
                '--config',
                ecs_cdw_dbc_file_ccache_config_effective.stdout
              ]
          }}
      environment: "{{ ecs_cdp_cli_environment }}"
      register: ecs_cdw_dbc_ccache_update
      changed_when: ecs_cdw_dbc_ccache_update.rc | default(1) == 0
      failed_when: false
      until: >-
        ecs_cdw_dbc_ccache_update.rc | default(1) == 0
        or (
          ecs_cdw_dbc_ccache_update.stderr | default('')
          is not search(
            "(?i)(failed to acquire lease|already leased by operation|"
            ~ "operation is not allowed in '(starting|stopping|updating)' state)"
          )
        )
      retries: "{{ ecs_cdw_workload_refresh_retries | int }}"
      delay: "{{ ecs_cdw_workload_refresh_delay | int }}"
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when:
        - ecs_cdw_dbc_ccache_check is defined
        - ecs_cdw_dbc_ccache_check.rc | default(0) == 3
        - ecs_cdw_dbc_file_ccache_config_effective is defined
        - ecs_cdw_dbc_file_ccache_config_effective.rc | default(1) == 0
        - not (ecs_cdw_dbc_starting_ccache_bootstrap_required | default(false) | bool)

    - name: Require database catalog FILE cache update
      ansible.builtin.assert:
        that:
          - >-
            ecs_cdw_virtual_warehouse_types
            | default(['hive'])
            | type_debug
            == 'list'
          - >-
            (
              ecs_cdw_dbc_ccache_guarded_update.rc
              if ecs_cdw_dbc_ccache_guarded_update is defined
              and not (
                ecs_cdw_dbc_ccache_guarded_update.skipped
                | default(false)
                | bool
              )
              else ecs_cdw_dbc_ccache_update.rc | default(0)
            ) == 0
        fail_msg: >-
          CDW database catalog FILE-cache update failed after waiting for any
          active update lease or transient lifecycle state to clear (rc={{
            ecs_cdw_dbc_ccache_guarded_update.rc
            if ecs_cdw_dbc_ccache_guarded_update is defined
            and not (
              ecs_cdw_dbc_ccache_guarded_update.skipped | default(false) | bool
            )
            else ecs_cdw_dbc_ccache_update.rc | default('unknown')
          }}):
          {{
            ecs_cdw_dbc_ccache_guarded_update.stderr
            | default(ecs_cdw_dbc_ccache_guarded_update.stdout, true)
            if ecs_cdw_dbc_ccache_guarded_update is defined
            and not (
              ecs_cdw_dbc_ccache_guarded_update.skipped | default(false) | bool
            )
            else ecs_cdw_dbc_ccache_update.stderr
            | default(ecs_cdw_dbc_ccache_update.stdout, true)
          }}
      when:
        - >-
          (
            ecs_cdw_dbc_ccache_guarded_update is defined
            and not (
              ecs_cdw_dbc_ccache_guarded_update.skipped | default(false) | bool
            )
          )
          or (
            ecs_cdw_dbc_ccache_update is defined
            and not (
              ecs_cdw_dbc_ccache_update.skipped | default(false) | bool
            )
          )

    - name: Read generated metastore FILE credential cache
      ansible.builtin.command:
        argv:
          - "{{ ecs_coredns_kubectl_path }}"
          - --kubeconfig
          - "{{ ecs_coredns_kubeconfig_path }}"
          - --namespace
          - "{{ ecs_cdw_kubernetes_namespace }}"
          - get
          - pod
          - metastore-0
          - --output
          - >-
            jsonpath={.spec.containers[?(@.name=="metastore")].env[?(@.name=="KRB5CCNAME")].value}
      register: ecs_cdw_metastore_krb5ccname
      changed_when: false
      failed_when: false
      become: true
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh

    - name: Refresh database catalog workloads after FILE cache reconciliation
      ansible.builtin.command:
        argv: >-
          {{
            ecs_data_services_cdp_cli_prefix
            + [
                'dw',
                'start-dbc',
                '--cluster-id',
                ecs_cdw_cluster.cluster.id,
                '--dbc-id',
                ecs_cdw_catalog_id,
                '--force-refresh'
              ]
          }}
      environment: "{{ ecs_cdp_cli_environment }}"
      register: ecs_cdw_dbc_ccache_refresh
      changed_when: ecs_cdw_dbc_ccache_refresh.rc | default(1) == 0
      failed_when: false
      until: >-
        ecs_cdw_dbc_ccache_refresh.rc | default(1) == 0
        or (
          ecs_cdw_dbc_ccache_refresh.stderr | default('')
          is not search(
            '(?i)(another operation[^\\n]*already in progress|'
            ~ 'failed to acquire lease|already leased by operation|'
            ~ "can't start DB Catalog in status "
            ~ "'(starting|stopping|updating)')"
          )
        )
      retries: "{{ ecs_cdw_workload_refresh_retries | int }}"
      delay: "{{ ecs_cdw_workload_refresh_delay | int }}"
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when:
        - ecs_cdw_catalog_id | default('') | length > 0
        - ecs_cdw_workload_file_ccache_reconcile | default(true) | bool
        - >-
          ecs_cdw_catalog_initial_status | default('')
          is search('(?i)^(stopped|suspended|deactivated)$')

    - name: Require database catalog workload refresh
      ansible.builtin.assert:
        that:
          - ecs_cdw_dbc_ccache_refresh.rc | default(0) == 0
        fail_msg: >-
          CDW database catalog force refresh failed after waiting for any
          active operation lease or transient lifecycle state to clear (rc={{
            ecs_cdw_dbc_ccache_refresh.rc | default('unknown')
          }}):
          {{
            ecs_cdw_dbc_ccache_refresh.stderr
            | default(ecs_cdw_dbc_ccache_refresh.stdout, true)
          }}
      when:
        - ecs_cdw_dbc_ccache_refresh is defined
        - not (ecs_cdw_dbc_ccache_refresh.skipped | default(false) | bool)

    - name: Read converged database catalog service configuration
      ansible.builtin.command:
        argv: >-
          {{
            ecs_data_services_cdp_cli_prefix
            + [
                'dw',
                'describe-dbc-config',
                '--cluster-id',
                ecs_cdw_cluster.cluster.id,
                '--dbc-id',
                ecs_cdw_catalog_id
              ]
          }}
      environment: "{{ ecs_cdp_cli_environment }}"
      register: ecs_cdw_dbc_config_converged
      changed_when: false
      failed_when: false
      until:
        - ecs_cdw_dbc_config_converged.rc == 0
        - >-
          ecs_cdw_dbc_config_converged.stdout
          | default('')
          is search('"id"\s*:\s*"env"')
        - >-
          ecs_cdw_dbc_config_converged.stdout
          | default('')
          is search(
            '"KRB5CCNAME"\s*:\s*"'
            ~ (ecs_cdw_workload_krb5ccname | regex_escape)
            ~ '"'
          )
      retries: "{{ ecs_cdw_workload_refresh_retries | int }}"
      delay: "{{ ecs_cdw_workload_refresh_delay | int }}"
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when:
        - ecs_cdw_catalog_id | default('') | length > 0
        - ecs_cdw_workload_file_ccache_reconcile | default(true) | bool

    - name: Verify converged database catalog FILE credential cache configuration
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json
            import sys

            desired = sys.argv[1]
            payload = json.load(sys.stdin)
            if isinstance(payload, str):
                payload = json.loads(payload)
            config = payload.get("config", payload)
            blocks = (
                config.get("applicationConfigs", {})
                .get("metastore", {})
                .get("configBlocks", [])
            )
            matches = [
                block
                for block in blocks
                if (
                    block.get("id") == "env"
                    and (
                        block.get("content", {})
                        .get("keyValues", {})
                        .get("KRB5CCNAME", "")
                    ) == desired
                )
            ]
            env_blocks = [block for block in blocks if block.get("id") == "env"]
            print(json.dumps(env_blocks, sort_keys=True))
            raise SystemExit(0 if len(matches) == 1 else 3)
          - "{{ ecs_cdw_workload_krb5ccname }}"
        stdin: "{{ ecs_cdw_dbc_config_converged.stdout | to_json }}"
      register: ecs_cdw_dbc_ccache_converged
      changed_when: false
      failed_when: ecs_cdw_dbc_ccache_converged.rc != 0
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when:
        - ecs_cdw_dbc_config_converged is defined
        - ecs_cdw_dbc_config_converged.rc | default(1) == 0

    - name: Verify generated metastore FILE credential cache
      ansible.builtin.command:
        argv:
          - "{{ ecs_coredns_kubectl_path }}"
          - --kubeconfig
          - "{{ ecs_coredns_kubeconfig_path }}"
          - --namespace
          - "{{ ecs_cdw_kubernetes_namespace }}"
          - get
          - pod
          - metastore-0
          - --output
          - >-
            jsonpath={.spec.containers[?(@.name=="metastore")].env[?(@.name=="KRB5CCNAME")].value}
      register: ecs_cdw_metastore_krb5ccname_converged
      changed_when: false
      until:
        - ecs_cdw_metastore_krb5ccname_converged.rc == 0
        - >-
          ecs_cdw_metastore_krb5ccname_converged.stdout | trim
          == ecs_cdw_workload_krb5ccname
      retries: "{{ ecs_cdw_workload_refresh_retries | int }}"
      delay: "{{ ecs_cdw_workload_refresh_delay | int }}"
      become: true
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when:
        - ecs_cdw_catalog_id | default('') | length > 0
        - ecs_cdw_workload_file_ccache_reconcile | default(true) | bool

    - name: Wait for default database catalog
      cloudera.cloud.dw_database_catalog_info:
        cluster_id: "{{ ecs_cdw_cluster.cluster.id }}"
        verify_tls: "{{ ecs_data_services_verify_tls | default(false) | bool }}"
      environment: "{{ ecs_cdp_cli_environment }}"
      register: ecs_cdw_dbc_running
      until:
        - ecs_cdw_dbc_running.database_catalogs | default([]) | length > 0
        - ecs_cdw_dbc_running.database_catalogs[0].status == 'Running'
      retries: "{{ ecs_cdw_dbc_wait_retries | default(40) }}"
      delay: "{{ ecs_cdw_dbc_wait_delay | default(30) }}"
      failed_when: false
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh

    - name: Read database catalog namespace pods after stale API status
      ansible.builtin.command:
        argv:
          - "{{ ecs_coredns_kubectl_path }}"
          - --kubeconfig
          - "{{ ecs_coredns_kubeconfig_path }}"
          - --namespace
          - "{{ ecs_cdw_kubernetes_namespace }}"
          - get
          - pods
          - --output
          - json
      register: ecs_cdw_catalog_kubernetes_pods
      changed_when: false
      failed_when: false
      become: true
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when:
        - ecs_cdw_catalog_kubernetes_health_fallback | default(true) | bool
        - ecs_cdw_dbc_running.database_catalogs | default([]) | length > 0
        - ecs_cdw_dbc_running.database_catalogs[0].status | default('') != 'Running'

    - name: Verify database catalog namespace health after stale API status
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json
            import sys

            payload = json.load(sys.stdin)
            if isinstance(payload, str):
                payload = json.loads(payload)
            required_apps = {"metastore", "hue-query-processor"}
            observed_apps = set()
            unhealthy = []
            active_count = 0

            for pod in payload.get("items", []):
                metadata = pod.get("metadata", {})
                spec = pod.get("spec", {})
                status = pod.get("status", {})
                owners = metadata.get("ownerReferences", [])
                if any(owner.get("kind") == "Job" for owner in owners):
                    continue

                active_count += 1
                name = metadata.get("name", "unknown")
                app = metadata.get("labels", {}).get("app", "")
                if app:
                    observed_apps.add(app)

                if status.get("phase") != "Running":
                    unhealthy.append(f"{name}:phase={status.get('phase', 'unknown')}")
                    continue

                containers = status.get("containerStatuses", [])
                expected = len(spec.get("containers", []))
                ready = sum(1 for container in containers if container.get("ready"))
                if expected == 0 or ready != expected:
                    unhealthy.append(f"{name}:ready={ready}/{expected}")

            missing = sorted(required_apps - observed_apps)
            summary = {
                "activePods": active_count,
                "observedApps": sorted(observed_apps),
                "missingRequiredApps": missing,
                "unhealthyPods": unhealthy,
            }
            print(json.dumps(summary, sort_keys=True))
            raise SystemExit(
                0
                if active_count > 0 and not missing and not unhealthy
                else 3
            )
        stdin: >-
          {{
            ecs_cdw_catalog_kubernetes_pods.stdout
            | default({})
            | to_json
          }}
      register: ecs_cdw_catalog_kubernetes_health
      changed_when: false
      failed_when: ecs_cdw_catalog_kubernetes_health.rc not in [0, 3]
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when:
        - ecs_cdw_catalog_kubernetes_pods is defined
        - ecs_cdw_catalog_kubernetes_pods.rc | default(1) == 0

    - name: Record default database catalog result
      ansible.builtin.set_fact:
        ecs_cdw_catalog_succeeded: >-
          {{
            (
              ecs_cdw_dbc_running.database_catalogs | default([]) | length > 0
              and ecs_cdw_dbc_running.database_catalogs[0].status
              | default('') == 'Running'
            )
            or (
              ecs_cdw_catalog_kubernetes_health is defined
              and ecs_cdw_catalog_kubernetes_health.rc | default(3) == 0
            )
          }}

    - name: Warn when healthy database catalog workloads override stale API status
      ansible.builtin.debug:
        msg: >-
          CDW database catalog API status remained
          '{{ ecs_cdw_dbc_running.database_catalogs[0].status | default('unknown') }}',
          but {{ ecs_cdw_kubernetes_namespace }} has healthy metastore and Hue
          Query Processor workloads with every non-Job pod Ready. Continuing
          without mutating or restarting generated Kubernetes workloads.
          Health={{ ecs_cdw_catalog_kubernetes_health.stdout | default('{}') }}.
      when:
        - ecs_cdw_catalog_succeeded | bool
        - ecs_cdw_dbc_running.database_catalogs | default([]) | length > 0
        - ecs_cdw_dbc_running.database_catalogs[0].status | default('') != 'Running'
        - ecs_cdw_catalog_kubernetes_health is defined
        - ecs_cdw_catalog_kubernetes_health.rc | default(3) == 0

    - name: Report default database catalog failure
      ansible.builtin.debug:
        msg: >-
          CDW database catalog did not reach Running:
          {{ ecs_cdw_dbc_running.database_catalogs | default([]) | to_json }}
      when: not (ecs_cdw_catalog_succeeded | bool)

    - name: Collect CDW Kubernetes diagnostics after catalog failure
      ansible.builtin.include_tasks: ecs_data_service_cdw_diagnostics.yml
      when: not (ecs_cdw_catalog_succeeded | bool)

    - name: Validate selected CDW Virtual Warehouse types
      ansible.builtin.assert:
        that:
          - >-
            (
              ecs_cdw_virtual_warehouse_types
              | default(['hive'])
              | map('lower')
              | list
              | difference(['hive', 'impala', 'trino'])
            )
            | length == 0
        fail_msg: >-
          ecs_cdw_virtual_warehouse_types must be a list containing only hive,
          impala, and/or trino.
      when: ecs_cdw_catalog_succeeded | bool

    - name: Resolve selected CDW Virtual Warehouse types
      ansible.builtin.set_fact:
        ecs_cdw_virtual_warehouse_types_effective: >-
          {{
            ecs_cdw_virtual_warehouse_types
            | default(['hive'])
            | map('lower')
            | unique
            | list
          }}
      when: ecs_cdw_catalog_succeeded | bool

    - name: Define selected smallest CDW Virtual Warehouses
      ansible.builtin.set_fact:
        ecs_cdw_hive_vw_name_effective: "{{ ecs_cdw_hive_vw_name }}"
        ecs_cdw_impala_vw_name_effective: "{{ ecs_cdw_impala_vw_name }}"
        ecs_cdw_desired_virtual_warehouses: >-
          {{
            (
              [{'name': ecs_cdw_hive_vw_name, 'type': 'hive'}]
              if 'hive' in ecs_cdw_virtual_warehouse_types_effective
              else []
            )
            + (
              [{'name': ecs_cdw_impala_vw_name, 'type': 'impala'}]
              if 'impala' in ecs_cdw_virtual_warehouse_types_effective
              else []
            )
            + (
              [{'name': ecs_cdw_trino_vw_name, 'type': 'trino'}]
              if 'trino' in ecs_cdw_virtual_warehouse_types_effective
              else []
            )
          }}
      when: ecs_cdw_catalog_succeeded | bool

    - name: Validate configured Impala Virtual Warehouse settings
      ansible.builtin.assert:
        that:
          - >-
            ecs_cdw_impala_ha_settings.highAvailabilityMode
            | default('DISABLED')
            in ['DISABLED', 'ACTIVE_PASSIVE', 'ACTIVE_ACTIVE']
          - ecs_cdw_impala_ha_settings.shutdownOfCoordinatorDelaySeconds | default(0) | int >= 0
          - ecs_cdw_impala_autoscaling.minClusters | default(1) | int >= 1
          - >-
            ecs_cdw_impala_autoscaling.maxClusters
            | default(ecs_cdw_impala_autoscaling.minClusters | default(1))
            | int
            >= ecs_cdw_impala_autoscaling.minClusters | default(1) | int
          - ecs_cdw_impala_autoscaling.autoSuspendTimeoutSeconds | default(1) | int > 0
          - ecs_cdw_impala_autoscaling.impalaScaleUpDelaySeconds | default(0) | int >= 0
          - ecs_cdw_impala_autoscaling.impalaScaleDownDelaySeconds | default(0) | int >= 0
          - ecs_cdw_impala_additional_quota.cpu | default(0) | float >= 0
          - ecs_cdw_impala_additional_quota.memory | default(0) | int >= 0
          - ecs_cdw_impala_options.scratchSpaceLimit | default(0) | int >= 0
          - >-
            not (
              ecs_cdw_impala_options.spillToS3Uri | default('') | length > 0
              and ecs_cdw_impala_options.scratchSpaceLimit | default(0) | int > 0
            )
        fail_msg: >-
          Invalid Impala Virtual Warehouse configuration. Use a supported HA
          mode, positive executor-group bounds and autosuspend timeout,
          nonnegative delays/quotas, and configure only one of spillToS3Uri
          or scratchSpaceLimit.
      when:
        - ecs_cdw_catalog_succeeded | bool
        - "'impala' in ecs_cdw_virtual_warehouse_types_effective"

    - name: Validate configured Trino Virtual Warehouse settings
      ansible.builtin.assert:
        that:
          - ecs_cdw_trino_autoscaling.trinoMinWorkerCount | default(1) | int >= 1
          - >-
            ecs_cdw_trino_autoscaling.trinoMaxWorkerCount
            | default(ecs_cdw_trino_autoscaling.trinoMinWorkerCount | default(1))
            | int
            >= ecs_cdw_trino_autoscaling.trinoMinWorkerCount | default(1) | int
          - ecs_cdw_trino_autoscaling.trinoShutdownGracePeriod | default(0) | int >= 0
          - ecs_cdw_trino_autoscaling.trinoScaleUpDelaySeconds | default(0) | int >= 0
          - ecs_cdw_trino_autoscaling.trinoScaleDownDelaySeconds | default(0) | int >= 0
          - ecs_cdw_trino_additional_quota.cpu | default(0) | float >= 0
          - ecs_cdw_trino_additional_quota.memory | default(0) | int >= 0
        fail_msg: >-
          Invalid Trino Virtual Warehouse configuration. Use positive worker
          bounds with max greater than or equal to min, and nonnegative grace
          periods, scaling delays, and additional quotas.
      when:
        - ecs_cdw_catalog_succeeded | bool
        - "'trino' in ecs_cdw_virtual_warehouse_types_effective"

    - name: Converge CDW Virtual Warehouses sequentially
      ansible.builtin.include_tasks: ecs_data_service_cdw_virtual_warehouse.yml
      loop: "{{ ecs_cdw_desired_virtual_warehouses }}"
      loop_control:
        loop_var: ecs_cdw_vw
        label: "{{ ecs_cdw_vw.type }}={{ ecs_cdw_vw.name }}"
      when: ecs_cdw_catalog_succeeded | bool

    - name: Provision automatic Data Visualization
      ansible.builtin.include_tasks: ecs_data_service_cdw_dataviz.yml
      when: ecs_cdw_catalog_succeeded | bool

    - name: Register Hue ingress hostnames for Caddy
      ansible.builtin.set_fact:
        ecs_caddy_data_service_routes: >-
          {{
            (ecs_caddy_data_service_routes | default([]))
            + (
              [
                {
                  'id': 'cdw-hive',
                  'external_hostname': 'hue-' + ecs_cdw_hive_vw_name_effective + '.' + ecs_app_domain,
                  'backend_host': ecs_master_fqdn,
                  'backend_port': 443,
                  'backend_scheme': 'https'
                }
              ]
              if 'hive' in ecs_cdw_virtual_warehouse_types_effective
              else []
            )
            + (
              [
                {
                  'id': 'cdw-impala',
                  'external_hostname': 'hue-' + ecs_cdw_impala_vw_name_effective + '.' + ecs_app_domain,
                  'backend_host': ecs_master_fqdn,
                  'backend_port': 443,
                  'backend_scheme': 'https'
                }
              ]
              if 'impala' in ecs_cdw_virtual_warehouse_types_effective
              else []
            )
          }}
      when: ecs_cdw_catalog_succeeded | bool

    - name: Update portal catalog URL for CDW
      ansible.builtin.set_fact:
        ecs_data_services_catalog: >-
          {{
            ecs_data_services_catalog | combine(
              {
                'cdw': ecs_data_services_catalog.cdw | default({}) | combine(
                  {
                    'url': 'https://hue-' + ecs_cdw_hive_vw_name_effective + '.' + ecs_app_domain,
                    'hive_virtual_warehouse': ecs_cdw_hive_vw_name_effective
                  }
                )
              },
              recursive=True
            )
          }}
      when:
        - ecs_cdw_catalog_succeeded | bool
        - "'hive' in ecs_cdw_virtual_warehouse_types_effective"

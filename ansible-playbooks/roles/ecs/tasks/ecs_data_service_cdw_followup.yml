---
- name: Initialize Data Warehouse follow-up result
  ansible.builtin.set_fact:
    ecs_cdw_catalog_succeeded: false
    ecs_cdw_dataviz_succeeded: false

- name: CDW | Complete database catalog and Virtual Warehouses
  when:
    - "'cdw' in (ecs_data_services_install_names | default([]))"
    - ecs_cdw_cluster_succeeded | default(false) | bool
  block:
    - name: Wait for default database catalog record
      cloudera.cloud.dw_database_catalog_info:
        cluster_id: "{{ ecs_cdw_cluster.cluster.id }}"
        verify_tls: "{{ ecs_data_services_verify_tls | default(false) | bool }}"
      environment: "{{ ecs_cdp_cli_environment }}"
      register: ecs_cdw_dbc_info
      until: ecs_cdw_dbc_info.database_catalogs | default([]) | length > 0
      retries: "{{ ecs_cdw_dbc_wait_retries | default(40) }}"
      delay: "{{ ecs_cdw_dbc_wait_delay | default(30) }}"
      failed_when: false
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh

    - name: Set default database catalog id
      ansible.builtin.set_fact:
        ecs_cdw_catalog_id: >-
          {{
            ecs_cdw_dbc_info.database_catalogs
            | default([])
            | map(attribute='id')
            | list
            | first
          }}
        ecs_cdw_catalog_initial_status: >-
          {{
            ecs_cdw_dbc_info.database_catalogs
            | default([])
            | map(attribute='status')
            | list
            | first
            | default('', true)
          }}
      when: ecs_cdw_dbc_info.database_catalogs | default([]) | length > 0

    - name: Read database catalog service configuration
      ansible.builtin.command:
        argv: >-
          {{
            ecs_data_services_cdp_cli_prefix
            + [
                'dw',
                'describe-dbc-config',
                '--cluster-id',
                ecs_cdw_cluster.cluster.id,
                '--dbc-id',
                ecs_cdw_catalog_id
              ]
          }}
      environment: "{{ ecs_cdp_cli_environment }}"
      register: ecs_cdw_dbc_config
      changed_when: false
      until: ecs_cdw_dbc_config.rc == 0
      retries: "{{ ecs_cdw_submission_recovery_retries | int }}"
      delay: "{{ ecs_cdw_submission_recovery_delay | int }}"
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when:
        - ecs_cdw_catalog_id | default('') | length > 0
        - ecs_cdw_workload_file_ccache_reconcile | default(true) | bool

    - name: Check database catalog FILE credential cache configuration
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json
            import sys

            desired = sys.argv[1]
            payload = json.load(sys.stdin)
            if isinstance(payload, str):
                payload = json.loads(payload)
            config = payload.get("config", payload)
            blocks = (
                config.get("commonConfigs", {})
                .get("configBlocks", [])
            )
            current = ""
            for block in blocks:
                if block.get("id") == "env":
                    current = (
                        block.get("content", {})
                        .get("keyValues", {})
                        .get("KRB5CCNAME", "")
                    )
                    break
            print(current)
            raise SystemExit(0 if current == desired else 3)
          - "{{ ecs_cdw_workload_krb5ccname }}"
        stdin: "{{ ecs_cdw_dbc_config.stdout | to_json }}"
      register: ecs_cdw_dbc_ccache_check
      changed_when: false
      failed_when: ecs_cdw_dbc_ccache_check.rc not in [0, 3]
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when:
        - ecs_cdw_dbc_config is defined
        - ecs_cdw_dbc_config.rc | default(1) == 0

    - name: Persist database catalog FILE credential cache through CDW API
      ansible.builtin.command:
        argv: >-
          {{
            ecs_data_services_cdp_cli_prefix
            + [
                'dw',
                'update-dbc',
                '--cluster-id',
                ecs_cdw_cluster.cluster.id,
                '--dbc-id',
                ecs_cdw_catalog_id,
                '--config',
                ecs_cdw_dbc_file_ccache_config | to_json
              ]
          }}
      environment: "{{ ecs_cdp_cli_environment }}"
      register: ecs_cdw_dbc_ccache_update_initial
      changed_when: ecs_cdw_dbc_ccache_update_initial.rc | default(1) == 0
      failed_when: false
      until: >-
        ecs_cdw_dbc_ccache_update_initial.rc | default(1) == 0
        or (
          ecs_cdw_dbc_ccache_update_initial.stderr | default('')
          is not search(
            "(?i)(failed to acquire lease|already leased by operation|"
            ~ "operation is not allowed in '(stopping|updating)' state)"
          )
        )
      retries: "{{ ecs_cdw_workload_refresh_retries | int }}"
      delay: "{{ ecs_cdw_workload_refresh_delay | int }}"
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when:
        - ecs_cdw_dbc_ccache_check is defined
        - ecs_cdw_dbc_ccache_check.rc | default(0) == 3

    - name: Detect fresh catalog FILE cache bootstrap deadlock
      ansible.builtin.set_fact:
        ecs_cdw_dbc_starting_ccache_bootstrap_required: >-
          {{
            ecs_cdw_dbc_ccache_update_initial.rc | default(0) != 0
            and (
              ecs_cdw_dbc_ccache_update_initial.stderr | default('')
              is search(
                "(?i)operation is not allowed in 'starting' state"
              )
            )
          }}
      when: ecs_cdw_dbc_ccache_update_initial is defined

    - name: Bootstrap metastore FILE cache during fresh catalog startup
      ansible.builtin.command:
        argv:
          - "{{ ecs_coredns_kubectl_path }}"
          - --kubeconfig
          - "{{ ecs_coredns_kubeconfig_path }}"
          - --namespace
          - "{{ ecs_cdw_kubernetes_namespace }}"
          - set
          - env
          - statefulset/metastore
          - --containers=metastore
          - "KRB5CCNAME={{ ecs_cdw_workload_krb5ccname }}"
      register: ecs_cdw_dbc_ccache_bootstrap
      changed_when: >-
        'env updated' in (
          ecs_cdw_dbc_ccache_bootstrap.stdout | default('') | lower
        )
      until: ecs_cdw_dbc_ccache_bootstrap.rc | default(1) == 0
      retries: "{{ ecs_cdw_submission_recovery_retries | int }}"
      delay: "{{ ecs_cdw_submission_recovery_delay | int }}"
      become: true
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when: ecs_cdw_dbc_starting_ccache_bootstrap_required | default(false) | bool

    - name: Recreate failed metastore pod from bootstrapped template
      ansible.builtin.command:
        argv:
          - "{{ ecs_coredns_kubectl_path }}"
          - --kubeconfig
          - "{{ ecs_coredns_kubeconfig_path }}"
          - --namespace
          - "{{ ecs_cdw_kubernetes_namespace }}"
          - delete
          - pod
          - metastore-0
          - --wait=false
          - --ignore-not-found=true
      changed_when: true
      become: true
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when: ecs_cdw_dbc_starting_ccache_bootstrap_required | default(false) | bool

    - name: Wait for recreated metastore pod record
      ansible.builtin.command:
        argv:
          - "{{ ecs_coredns_kubectl_path }}"
          - --kubeconfig
          - "{{ ecs_coredns_kubeconfig_path }}"
          - --namespace
          - "{{ ecs_cdw_kubernetes_namespace }}"
          - get
          - pod
          - metastore-0
      register: ecs_cdw_dbc_ccache_bootstrap_pod
      changed_when: false
      failed_when: false
      until: ecs_cdw_dbc_ccache_bootstrap_pod.rc | default(1) == 0
      retries: "{{ ecs_cdw_submission_recovery_retries | int }}"
      delay: "{{ ecs_cdw_submission_recovery_delay | int }}"
      become: true
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when: ecs_cdw_dbc_starting_ccache_bootstrap_required | default(false) | bool

    - name: Wait for bootstrapped metastore pod readiness
      ansible.builtin.command:
        argv:
          - "{{ ecs_coredns_kubectl_path }}"
          - --kubeconfig
          - "{{ ecs_coredns_kubeconfig_path }}"
          - --namespace
          - "{{ ecs_cdw_kubernetes_namespace }}"
          - wait
          - pod/metastore-0
          - --for=condition=Ready
          - >-
            --timeout={{
              (ecs_cdw_workload_refresh_retries | int)
              * (ecs_cdw_workload_refresh_delay | int)
            }}s
      changed_when: false
      become: true
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when: ecs_cdw_dbc_starting_ccache_bootstrap_required | default(false) | bool

    - name: Persist bootstrapped database catalog FILE credential cache
      ansible.builtin.command:
        argv: >-
          {{
            ecs_data_services_cdp_cli_prefix
            + [
                'dw',
                'update-dbc',
                '--cluster-id',
                ecs_cdw_cluster.cluster.id,
                '--dbc-id',
                ecs_cdw_catalog_id,
                '--config',
                ecs_cdw_dbc_file_ccache_config | to_json
              ]
          }}
      environment: "{{ ecs_cdp_cli_environment }}"
      register: ecs_cdw_dbc_ccache_update_after_bootstrap
      changed_when: ecs_cdw_dbc_ccache_update_after_bootstrap.rc | default(1) == 0
      failed_when: false
      until: >-
        ecs_cdw_dbc_ccache_update_after_bootstrap.rc | default(1) == 0
        or (
          ecs_cdw_dbc_ccache_update_after_bootstrap.stderr | default('')
          is not search(
            "(?i)(failed to acquire lease|already leased by operation|"
            ~ "operation is not allowed in '(starting|stopping|updating)' state)"
          )
        )
      retries: "{{ ecs_cdw_workload_refresh_retries | int }}"
      delay: "{{ ecs_cdw_workload_refresh_delay | int }}"
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when: ecs_cdw_dbc_starting_ccache_bootstrap_required | default(false) | bool

    - name: Select database catalog FILE cache update result
      ansible.builtin.set_fact:
        ecs_cdw_dbc_ccache_update: >-
          {{
            ecs_cdw_dbc_ccache_update_after_bootstrap
            if (
              ecs_cdw_dbc_ccache_update_after_bootstrap is defined
              and not (
                ecs_cdw_dbc_ccache_update_after_bootstrap.skipped
                | default(false)
                | bool
              )
            )
            else ecs_cdw_dbc_ccache_update_initial
          }}
      when:
        - ecs_cdw_dbc_ccache_update_initial is defined
        - not (ecs_cdw_dbc_ccache_update_initial.skipped | default(false) | bool)

    - name: Require database catalog FILE cache update
      ansible.builtin.assert:
        that:
          - ecs_cdw_dbc_ccache_update.rc | default(0) == 0
        fail_msg: >-
          CDW database catalog FILE-cache update failed after waiting for any
          active update lease or transient lifecycle state to clear (rc={{
            ecs_cdw_dbc_ccache_update.rc | default('unknown')
          }}):
          {{
            ecs_cdw_dbc_ccache_update.stderr
            | default(ecs_cdw_dbc_ccache_update.stdout, true)
          }}
      when:
        - ecs_cdw_dbc_ccache_update is defined
        - not (ecs_cdw_dbc_ccache_update.skipped | default(false) | bool)

    - name: Read generated metastore FILE credential cache
      ansible.builtin.command:
        argv:
          - "{{ ecs_coredns_kubectl_path }}"
          - --kubeconfig
          - "{{ ecs_coredns_kubeconfig_path }}"
          - --namespace
          - "{{ ecs_cdw_kubernetes_namespace }}"
          - get
          - pod
          - metastore-0
          - --output
          - >-
            jsonpath={.spec.containers[?(@.name=="metastore")].env[?(@.name=="KRB5CCNAME")].value}
      register: ecs_cdw_metastore_krb5ccname
      changed_when: false
      failed_when: false
      become: true
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh

    - name: Refresh database catalog workloads after FILE cache reconciliation
      ansible.builtin.command:
        argv: >-
          {{
            ecs_data_services_cdp_cli_prefix
            + [
                'dw',
                'start-dbc',
                '--cluster-id',
                ecs_cdw_cluster.cluster.id,
                '--dbc-id',
                ecs_cdw_catalog_id,
                '--force-refresh'
              ]
          }}
      environment: "{{ ecs_cdp_cli_environment }}"
      register: ecs_cdw_dbc_ccache_refresh
      changed_when: ecs_cdw_dbc_ccache_refresh.rc | default(1) == 0
      failed_when: false
      until: >-
        ecs_cdw_dbc_ccache_refresh.rc | default(1) == 0
        or (
          ecs_cdw_dbc_ccache_refresh.stderr | default('')
          is not search(
            '(?i)(another operation[^\\n]*already in progress|'
            ~ 'failed to acquire lease|already leased by operation)'
          )
        )
      retries: "{{ ecs_cdw_workload_refresh_retries | int }}"
      delay: "{{ ecs_cdw_workload_refresh_delay | int }}"
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when:
        - ecs_cdw_catalog_id | default('') | length > 0
        - ecs_cdw_workload_file_ccache_reconcile | default(true) | bool
        - >-
          (
            ecs_cdw_dbc_ccache_update is defined
            and not (ecs_cdw_dbc_ccache_update.skipped | default(false) | bool)
          )
          or (
            ecs_cdw_metastore_krb5ccname.stdout | default('') | trim
            != ecs_cdw_workload_krb5ccname
          )
          or (
            ecs_cdw_catalog_initial_status | default('')
            is search('(?i)^(stopped|suspended|deactivated)$')
          )

    - name: Require database catalog workload refresh
      ansible.builtin.assert:
        that:
          - ecs_cdw_dbc_ccache_refresh.rc | default(0) == 0
        fail_msg: >-
          CDW database catalog force refresh failed after waiting for any
          active operation lease to clear (rc={{
            ecs_cdw_dbc_ccache_refresh.rc | default('unknown')
          }}):
          {{
            ecs_cdw_dbc_ccache_refresh.stderr
            | default(ecs_cdw_dbc_ccache_refresh.stdout, true)
          }}
      when:
        - ecs_cdw_dbc_ccache_refresh is defined
        - not (ecs_cdw_dbc_ccache_refresh.skipped | default(false) | bool)

    - name: Read converged database catalog service configuration
      ansible.builtin.command:
        argv: >-
          {{
            ecs_data_services_cdp_cli_prefix
            + [
                'dw',
                'describe-dbc-config',
                '--cluster-id',
                ecs_cdw_cluster.cluster.id,
                '--dbc-id',
                ecs_cdw_catalog_id
              ]
          }}
      environment: "{{ ecs_cdp_cli_environment }}"
      register: ecs_cdw_dbc_config_converged
      changed_when: false
      until: ecs_cdw_dbc_config_converged.rc == 0
      retries: "{{ ecs_cdw_submission_recovery_retries | int }}"
      delay: "{{ ecs_cdw_submission_recovery_delay | int }}"
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when:
        - ecs_cdw_catalog_id | default('') | length > 0
        - ecs_cdw_workload_file_ccache_reconcile | default(true) | bool

    - name: Verify converged database catalog FILE credential cache configuration
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json
            import sys

            desired = sys.argv[1]
            payload = json.load(sys.stdin)
            if isinstance(payload, str):
                payload = json.loads(payload)
            config = payload.get("config", payload)
            blocks = (
                config.get("commonConfigs", {})
                .get("configBlocks", [])
            )
            matches = [
                block
                for block in blocks
                if (
                    block.get("id") == "env"
                    and (
                        block.get("content", {})
                        .get("keyValues", {})
                        .get("KRB5CCNAME", "")
                    ) == desired
                )
            ]
            print(json.dumps(blocks, sort_keys=True))
            raise SystemExit(0 if len(matches) == 1 else 3)
          - "{{ ecs_cdw_workload_krb5ccname }}"
        stdin: "{{ ecs_cdw_dbc_config_converged.stdout | to_json }}"
      register: ecs_cdw_dbc_ccache_converged
      changed_when: false
      failed_when: ecs_cdw_dbc_ccache_converged.rc != 0
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when:
        - ecs_cdw_dbc_config_converged is defined
        - ecs_cdw_dbc_config_converged.rc | default(1) == 0

    - name: Verify generated metastore FILE credential cache
      ansible.builtin.command:
        argv:
          - "{{ ecs_coredns_kubectl_path }}"
          - --kubeconfig
          - "{{ ecs_coredns_kubeconfig_path }}"
          - --namespace
          - "{{ ecs_cdw_kubernetes_namespace }}"
          - get
          - pod
          - metastore-0
          - --output
          - >-
            jsonpath={.spec.containers[?(@.name=="metastore")].env[?(@.name=="KRB5CCNAME")].value}
      register: ecs_cdw_metastore_krb5ccname_converged
      changed_when: false
      until:
        - ecs_cdw_metastore_krb5ccname_converged.rc == 0
        - >-
          ecs_cdw_metastore_krb5ccname_converged.stdout | trim
          == ecs_cdw_workload_krb5ccname
      retries: "{{ ecs_cdw_workload_refresh_retries | int }}"
      delay: "{{ ecs_cdw_workload_refresh_delay | int }}"
      become: true
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when:
        - ecs_cdw_catalog_id | default('') | length > 0
        - ecs_cdw_workload_file_ccache_reconcile | default(true) | bool

    - name: Wait for default database catalog
      cloudera.cloud.dw_database_catalog_info:
        cluster_id: "{{ ecs_cdw_cluster.cluster.id }}"
        verify_tls: "{{ ecs_data_services_verify_tls | default(false) | bool }}"
      environment: "{{ ecs_cdp_cli_environment }}"
      register: ecs_cdw_dbc_running
      until:
        - ecs_cdw_dbc_running.database_catalogs | default([]) | length > 0
        - ecs_cdw_dbc_running.database_catalogs[0].status == 'Running'
      retries: "{{ ecs_cdw_dbc_wait_retries | default(40) }}"
      delay: "{{ ecs_cdw_dbc_wait_delay | default(30) }}"
      failed_when: false
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh

    - name: Read database catalog namespace pods after stale API status
      ansible.builtin.command:
        argv:
          - "{{ ecs_coredns_kubectl_path }}"
          - --kubeconfig
          - "{{ ecs_coredns_kubeconfig_path }}"
          - --namespace
          - "{{ ecs_cdw_kubernetes_namespace }}"
          - get
          - pods
          - --output
          - json
      register: ecs_cdw_catalog_kubernetes_pods
      changed_when: false
      failed_when: false
      become: true
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when:
        - ecs_cdw_catalog_kubernetes_health_fallback | default(true) | bool
        - ecs_cdw_dbc_running.database_catalogs | default([]) | length > 0
        - ecs_cdw_dbc_running.database_catalogs[0].status | default('') != 'Running'

    - name: Verify database catalog namespace health after stale API status
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json
            import sys

            payload = json.load(sys.stdin)
            if isinstance(payload, str):
                payload = json.loads(payload)
            required_apps = {"metastore", "hue-query-processor"}
            observed_apps = set()
            unhealthy = []
            active_count = 0

            for pod in payload.get("items", []):
                metadata = pod.get("metadata", {})
                spec = pod.get("spec", {})
                status = pod.get("status", {})
                owners = metadata.get("ownerReferences", [])
                if any(owner.get("kind") == "Job" for owner in owners):
                    continue

                active_count += 1
                name = metadata.get("name", "unknown")
                app = metadata.get("labels", {}).get("app", "")
                if app:
                    observed_apps.add(app)

                if status.get("phase") != "Running":
                    unhealthy.append(f"{name}:phase={status.get('phase', 'unknown')}")
                    continue

                containers = status.get("containerStatuses", [])
                expected = len(spec.get("containers", []))
                ready = sum(1 for container in containers if container.get("ready"))
                if expected == 0 or ready != expected:
                    unhealthy.append(f"{name}:ready={ready}/{expected}")

            missing = sorted(required_apps - observed_apps)
            summary = {
                "activePods": active_count,
                "observedApps": sorted(observed_apps),
                "missingRequiredApps": missing,
                "unhealthyPods": unhealthy,
            }
            print(json.dumps(summary, sort_keys=True))
            raise SystemExit(
                0
                if active_count > 0 and not missing and not unhealthy
                else 3
            )
        stdin: >-
          {{
            ecs_cdw_catalog_kubernetes_pods.stdout
            | default({})
            | to_json
          }}
      register: ecs_cdw_catalog_kubernetes_health
      changed_when: false
      failed_when: ecs_cdw_catalog_kubernetes_health.rc not in [0, 3]
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when:
        - ecs_cdw_catalog_kubernetes_pods is defined
        - ecs_cdw_catalog_kubernetes_pods.rc | default(1) == 0

    - name: Record default database catalog result
      ansible.builtin.set_fact:
        ecs_cdw_catalog_succeeded: >-
          {{
            (
              ecs_cdw_dbc_running.database_catalogs | default([]) | length > 0
              and ecs_cdw_dbc_running.database_catalogs[0].status
              | default('') == 'Running'
            )
            or (
              ecs_cdw_catalog_kubernetes_health is defined
              and ecs_cdw_catalog_kubernetes_health.rc | default(3) == 0
            )
          }}

    - name: Warn when healthy database catalog workloads override stale API status
      ansible.builtin.debug:
        msg: >-
          CDW database catalog API status remained
          '{{ ecs_cdw_dbc_running.database_catalogs[0].status | default('unknown') }}',
          but {{ ecs_cdw_kubernetes_namespace }} has healthy metastore and Hue
          Query Processor workloads with every non-Job pod Ready. Continuing
          without mutating or restarting generated Kubernetes workloads.
          Health={{ ecs_cdw_catalog_kubernetes_health.stdout | default('{}') }}.
      when:
        - ecs_cdw_catalog_succeeded | bool
        - ecs_cdw_dbc_running.database_catalogs | default([]) | length > 0
        - ecs_cdw_dbc_running.database_catalogs[0].status | default('') != 'Running'
        - ecs_cdw_catalog_kubernetes_health is defined
        - ecs_cdw_catalog_kubernetes_health.rc | default(3) == 0

    - name: Report default database catalog failure
      ansible.builtin.debug:
        msg: >-
          CDW database catalog did not reach Running:
          {{ ecs_cdw_dbc_running.database_catalogs | default([]) | to_json }}
      when: not (ecs_cdw_catalog_succeeded | bool)

    - name: Collect CDW Kubernetes diagnostics after catalog failure
      ansible.builtin.include_tasks: ecs_data_service_cdw_diagnostics.yml
      when: not (ecs_cdw_catalog_succeeded | bool)

    - name: Define desired smallest CDW Virtual Warehouses
      ansible.builtin.set_fact:
        ecs_cdw_hive_vw_name_effective: "{{ ecs_cdw_hive_vw_name }}"
        ecs_cdw_impala_vw_name_effective: "{{ ecs_cdw_impala_vw_name }}"
        ecs_cdw_desired_virtual_warehouses:
          - name: "{{ ecs_cdw_hive_vw_name }}"
            type: hive
          - name: "{{ ecs_cdw_impala_vw_name }}"
            type: impala
          - name: "{{ ecs_cdw_trino_vw_name }}"
            type: trino
      when: ecs_cdw_catalog_succeeded | bool

    - name: Inspect desired CDW Virtual Warehouses
      cloudera.cloud.dw_virtual_warehouse_info:
        cluster_id: "{{ ecs_cdw_cluster.cluster.id }}"
        name: "{{ item.name }}"
        endpoint_tls: "{{ ecs_data_services_verify_tls | default(false) | bool }}"
      environment: "{{ ecs_cdp_cli_environment }}"
      register: ecs_cdw_vw_existing
      loop: "{{ ecs_cdw_desired_virtual_warehouses }}"
      loop_control:
        label: "{{ item.type }}={{ item.name }}"
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when: ecs_cdw_catalog_succeeded | bool

    - name: Validate configured Impala Virtual Warehouse settings
      ansible.builtin.assert:
        that:
          - >-
            ecs_cdw_impala_ha_settings.highAvailabilityMode
            | default('DISABLED')
            in ['DISABLED', 'ACTIVE_PASSIVE', 'ACTIVE_ACTIVE']
          - ecs_cdw_impala_ha_settings.shutdownOfCoordinatorDelaySeconds | default(0) | int >= 0
          - ecs_cdw_impala_autoscaling.minClusters | default(1) | int >= 1
          - >-
            ecs_cdw_impala_autoscaling.maxClusters
            | default(ecs_cdw_impala_autoscaling.minClusters | default(1))
            | int
            >= ecs_cdw_impala_autoscaling.minClusters | default(1) | int
          - ecs_cdw_impala_autoscaling.autoSuspendTimeoutSeconds | default(1) | int > 0
          - ecs_cdw_impala_autoscaling.impalaScaleUpDelaySeconds | default(0) | int >= 0
          - ecs_cdw_impala_autoscaling.impalaScaleDownDelaySeconds | default(0) | int >= 0
          - ecs_cdw_impala_additional_quota.cpu | default(0) | float >= 0
          - ecs_cdw_impala_additional_quota.memory | default(0) | int >= 0
          - ecs_cdw_impala_options.scratchSpaceLimit | default(0) | int >= 0
          - >-
            not (
              ecs_cdw_impala_options.spillToS3Uri | default('') | length > 0
              and ecs_cdw_impala_options.scratchSpaceLimit | default(0) | int > 0
            )
        fail_msg: >-
          Invalid Impala Virtual Warehouse configuration. Use a supported HA
          mode, positive executor-group bounds and autosuspend timeout,
          nonnegative delays/quotas, and configure only one of spillToS3Uri
          or scratchSpaceLimit.
      when: ecs_cdw_catalog_succeeded | bool

    - name: Validate configured Trino Virtual Warehouse settings
      ansible.builtin.assert:
        that:
          - ecs_cdw_trino_autoscaling.trinoMinWorkerCount | default(1) | int >= 1
          - >-
            ecs_cdw_trino_autoscaling.trinoMaxWorkerCount
            | default(ecs_cdw_trino_autoscaling.trinoMinWorkerCount | default(1))
            | int
            >= ecs_cdw_trino_autoscaling.trinoMinWorkerCount | default(1) | int
          - ecs_cdw_trino_autoscaling.trinoShutdownGracePeriod | default(0) | int >= 0
          - ecs_cdw_trino_autoscaling.trinoScaleUpDelaySeconds | default(0) | int >= 0
          - ecs_cdw_trino_autoscaling.trinoScaleDownDelaySeconds | default(0) | int >= 0
          - ecs_cdw_trino_additional_quota.cpu | default(0) | float >= 0
          - ecs_cdw_trino_additional_quota.memory | default(0) | int >= 0
        fail_msg: >-
          Invalid Trino Virtual Warehouse configuration. Use positive worker
          bounds with max greater than or equal to min, and nonnegative grace
          periods, scaling delays, and additional quotas.
      when: ecs_cdw_catalog_succeeded | bool

    - name: Create missing smallest CDW Virtual Warehouses in the CDW resource pool
      ansible.builtin.command:
        argv: >-
          {{
            ecs_data_services_cdp_cli_prefix
            + [
                'dw',
                'create-vw',
                '--cluster-id',
                ecs_cdw_cluster.cluster.id,
                '--dbc-id',
                ecs_cdw_catalog_id,
                '--vw-type',
                item.item.type,
                '--name',
                item.item.name,
                '--t-shirt-size',
                ecs_cdw_vw_tshirt_size,
                '--resource-pool',
                ecs_cdw_vw_resource_pool,
                '--config',
                ecs_cdw_vw_file_ccache_config | to_json
              ]
            + (
                [
                  '--impala-options',
                  ecs_cdw_impala_options | to_json
                ]
                if (
                  item.item.type == 'impala'
                  and ecs_cdw_impala_options | default({}) | length > 0
                )
                else []
              )
            + (
                [
                  '--impala-ha-settings',
                  ecs_cdw_impala_ha_settings | to_json,
                  '--autoscaling',
                  ecs_cdw_impala_autoscaling | to_json
                ]
                if item.item.type == 'impala'
                else []
              )
            + (
                [
                  '--additional-quota',
                  ecs_cdw_impala_additional_quota | to_json
                ]
                if (
                  item.item.type == 'impala'
                  and (
                    ecs_cdw_impala_additional_quota.cpu | default(0) | float > 0
                    or ecs_cdw_impala_additional_quota.memory | default(0) | int > 0
                  )
                )
                else []
              )
            + (
                [
                  '--autoscaling',
                  ecs_cdw_trino_autoscaling | to_json
                ]
                if (
                  item.item.type == 'trino'
                  and ecs_cdw_trino_autoscaling | default({}) | length > 0
                )
                else []
              )
            + (
                [
                  '--additional-quota',
                  ecs_cdw_trino_additional_quota | to_json
                ]
                if (
                  item.item.type == 'trino'
                  and (
                    ecs_cdw_trino_additional_quota.cpu | default(0) | float > 0
                    or ecs_cdw_trino_additional_quota.memory | default(0) | int > 0
                  )
                )
                else []
              )
          }}
      environment: "{{ ecs_cdp_cli_environment }}"
      register: ecs_cdw_vw_create_results
      changed_when: true
      loop: "{{ ecs_cdw_vw_existing.results | default([]) }}"
      loop_control:
        label: "{{ item.item.type }}={{ item.item.name }}"
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when:
        - ecs_cdw_catalog_succeeded | bool
        - item.virtual_warehouses | default([]) | length == 0

    - name: Wait for desired CDW Virtual Warehouse records
      cloudera.cloud.dw_virtual_warehouse_info:
        cluster_id: "{{ ecs_cdw_cluster.cluster.id }}"
        name: "{{ item.name }}"
        endpoint_tls: "{{ ecs_data_services_verify_tls | default(false) | bool }}"
      environment: "{{ ecs_cdp_cli_environment }}"
      register: ecs_cdw_vw_records
      until: ecs_cdw_vw_records.virtual_warehouses | default([]) | length > 0
      retries: "{{ ecs_cdw_submission_recovery_retries | int }}"
      delay: "{{ ecs_cdw_submission_recovery_delay | int }}"
      loop: "{{ ecs_cdw_desired_virtual_warehouses }}"
      loop_control:
        label: "{{ item.type }}={{ item.name }}"
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when: ecs_cdw_catalog_succeeded | bool

    - name: Wait for desired CDW Virtual Warehouses to finish provisioning
      cloudera.cloud.dw_virtual_warehouse_info:
        cluster_id: "{{ ecs_cdw_cluster.cluster.id }}"
        name: "{{ item.name }}"
        endpoint_tls: "{{ ecs_data_services_verify_tls | default(false) | bool }}"
      environment: "{{ ecs_cdp_cli_environment }}"
      register: ecs_cdw_vw_status
      until:
        - ecs_cdw_vw_status.virtual_warehouses | default([]) | length > 0
        - >-
          (
            ecs_cdw_vw_status.virtual_warehouses
            | first
            | default({})
          ).status
          | default('')
          is search('(?i)^(running|failed|error)$')
      retries: "{{ ecs_cdw_vw_wait_retries | int }}"
      delay: "{{ ecs_cdw_vw_wait_delay | int }}"
      failed_when: false
      loop: "{{ ecs_cdw_desired_virtual_warehouses }}"
      loop_control:
        label: "{{ item.type }}={{ item.name }}"
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when: ecs_cdw_catalog_succeeded | bool

    - name: Require all desired CDW Virtual Warehouses to be running
      ansible.builtin.assert:
        that:
          - item.virtual_warehouses | default([]) | length > 0
          - >-
            (
              item.virtual_warehouses
              | first
              | default({})
            ).status
            | default('')
            == 'Running'
        fail_msg: >-
          CDW {{ item.item.type }} Virtual Warehouse
          {{ item.item.name }} did not reach Running:
          {{ item.virtual_warehouses | default([]) | to_json }}.
      loop: "{{ ecs_cdw_vw_status.results | default([]) }}"
      loop_control:
        label: "{{ item.item.type }}={{ item.item.name }}"
      when: ecs_cdw_catalog_succeeded | bool

    - name: Provision automatic Data Visualization
      ansible.builtin.include_tasks: ecs_data_service_cdw_dataviz.yml
      when: ecs_cdw_catalog_succeeded | bool

    - name: Register Hue ingress hostnames for Caddy
      ansible.builtin.set_fact:
        ecs_caddy_data_service_routes: >-
          {{
            (ecs_caddy_data_service_routes | default([]))
            + [
              {
                'id': 'cdw-hive',
                'external_hostname': 'hue-' + ecs_cdw_hive_vw_name_effective + '.' + ecs_app_domain,
                'backend_host': ecs_master_fqdn,
                'backend_port': 443,
                'backend_scheme': 'https'
              },
              {
                'id': 'cdw-impala',
                'external_hostname': 'hue-' + ecs_cdw_impala_vw_name_effective + '.' + ecs_app_domain,
                'backend_host': ecs_master_fqdn,
                'backend_port': 443,
                'backend_scheme': 'https'
              }
            ]
          }}
      when: ecs_cdw_catalog_succeeded | bool

    - name: Update portal catalog URL for CDW
      ansible.builtin.set_fact:
        ecs_data_services_catalog: >-
          {{
            ecs_data_services_catalog | combine(
              {
                'cdw': ecs_data_services_catalog.cdw | default({}) | combine(
                  {
                    'url': 'https://hue-' + ecs_cdw_hive_vw_name_effective + '.' + ecs_app_domain,
                    'hive_virtual_warehouse': ecs_cdw_hive_vw_name_effective,
                    'impala_virtual_warehouse': ecs_cdw_impala_vw_name_effective
                  }
                )
              },
              recursive=True
            )
          }}
      when: ecs_cdw_catalog_succeeded | bool

---
- name: Initialize Data Warehouse follow-up result
  ansible.builtin.set_fact:
    ecs_cdw_catalog_succeeded: false

- name: CDW | Complete database catalog and Virtual Warehouses
  when:
    - "'cdw' in (ecs_data_services_install_names | default([]))"
    - ecs_cdw_cluster_succeeded | default(false) | bool
  block:
    - name: Wait for default database catalog
      cloudera.cloud.dw_database_catalog_info:
        cluster_id: "{{ ecs_cdw_cluster.cluster.id }}"
        verify_tls: "{{ ecs_data_services_verify_tls | default(false) | bool }}"
      environment: "{{ ecs_cdp_cli_environment }}"
      register: ecs_cdw_dbc_info
      until:
        - ecs_cdw_dbc_info.database_catalogs | default([]) | length > 0
        - ecs_cdw_dbc_info.database_catalogs[0].status == 'Running'
      retries: "{{ ecs_cdw_dbc_wait_retries | default(40) }}"
      delay: "{{ ecs_cdw_dbc_wait_delay | default(30) }}"
      failed_when: false
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh

    - name: Record default database catalog result
      ansible.builtin.set_fact:
        ecs_cdw_catalog_succeeded: >-
          {{
            ecs_cdw_dbc_info.database_catalogs | default([]) | length > 0
            and ecs_cdw_dbc_info.database_catalogs[0].status | default('') == 'Running'
          }}

    - name: Report default database catalog failure
      ansible.builtin.debug:
        msg: >-
          CDW database catalog did not reach Running:
          {{ ecs_cdw_dbc_info.database_catalogs | default([]) | to_json }}
      when: not (ecs_cdw_catalog_succeeded | bool)

    - name: Collect CDW Kubernetes diagnostics after catalog failure
      ansible.builtin.include_tasks: ecs_data_service_cdw_diagnostics.yml
      when: not (ecs_cdw_catalog_succeeded | bool)

    - name: Set default database catalog id
      ansible.builtin.set_fact:
        ecs_cdw_catalog_id: "{{ ecs_cdw_dbc_info.database_catalogs | map(attribute='id') | list | first }}"
      when: ecs_cdw_catalog_succeeded | bool

    - name: Define desired smallest CDW Virtual Warehouses
      ansible.builtin.set_fact:
        ecs_cdw_desired_virtual_warehouses:
          - name: "{{ ecs_cdw_hive_vw_name }}"
            type: hive
          - name: "{{ ecs_cdw_impala_vw_name }}"
            type: impala
          - name: "{{ ecs_cdw_trino_vw_name }}"
            type: trino
      when: ecs_cdw_catalog_succeeded | bool

    - name: Inspect desired CDW Virtual Warehouses
      cloudera.cloud.dw_virtual_warehouse_info:
        cluster_id: "{{ ecs_cdw_cluster.cluster.id }}"
        name: "{{ item.name }}"
        endpoint_tls: "{{ ecs_data_services_verify_tls | default(false) | bool }}"
      environment: "{{ ecs_cdp_cli_environment }}"
      register: ecs_cdw_vw_existing
      loop: "{{ ecs_cdw_desired_virtual_warehouses }}"
      loop_control:
        label: "{{ item.type }}={{ item.name }}"
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when: ecs_cdw_catalog_succeeded | bool

    - name: Create missing smallest CDW Virtual Warehouses in the CDW resource pool
      ansible.builtin.command:
        argv: >-
          {{
            ecs_data_services_cdp_cli_prefix
            + [
                'dw',
                'create-vw',
                '--cluster-id',
                ecs_cdw_cluster.cluster.id,
                '--dbc-id',
                ecs_cdw_catalog_id,
                '--vw-type',
                item.item.type,
                '--name',
                item.item.name,
                '--t-shirt-size',
                ecs_cdw_vw_tshirt_size,
                '--resource-pool',
                ecs_cdw_vw_resource_pool
              ]
          }}
      environment: "{{ ecs_cdp_cli_environment }}"
      register: ecs_cdw_vw_create_results
      changed_when: true
      loop: "{{ ecs_cdw_vw_existing.results | default([]) }}"
      loop_control:
        label: "{{ item.item.type }}={{ item.item.name }}"
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when:
        - ecs_cdw_catalog_succeeded | bool
        - item.virtual_warehouses | default([]) | length == 0

    - name: Reconcile Virtual Warehouse workload Kerberos credential caches
      ansible.builtin.include_tasks: ecs_data_service_cdw_reconcile_vw_ccaches.yml
      when:
        - ecs_cdw_catalog_succeeded | bool
        - ecs_cdw_workload_file_ccache_reconcile | default(true) | bool

    - name: Wait for desired CDW Virtual Warehouses to finish provisioning
      cloudera.cloud.dw_virtual_warehouse_info:
        cluster_id: "{{ ecs_cdw_cluster.cluster.id }}"
        name: "{{ item.name }}"
        endpoint_tls: "{{ ecs_data_services_verify_tls | default(false) | bool }}"
      environment: "{{ ecs_cdp_cli_environment }}"
      register: ecs_cdw_vw_status
      until:
        - ecs_cdw_vw_status.virtual_warehouses | default([]) | length > 0
        - >-
          (
            ecs_cdw_vw_status.virtual_warehouses
            | first
            | default({})
          ).status
          | default('')
          is search('(?i)^(running|failed|error)$')
      retries: "{{ ecs_cdw_vw_wait_retries | int }}"
      delay: "{{ ecs_cdw_vw_wait_delay | int }}"
      failed_when: false
      loop: "{{ ecs_cdw_desired_virtual_warehouses }}"
      loop_control:
        label: "{{ item.type }}={{ item.name }}"
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when: ecs_cdw_catalog_succeeded | bool

    - name: Require all desired CDW Virtual Warehouses to be running
      ansible.builtin.assert:
        that:
          - item.virtual_warehouses | default([]) | length > 0
          - >-
            (
              item.virtual_warehouses
              | first
              | default({})
            ).status
            | default('')
            == 'Running'
        fail_msg: >-
          CDW {{ item.item.type }} Virtual Warehouse
          {{ item.item.name }} did not reach Running:
          {{ item.virtual_warehouses | default([]) | to_json }}.
      loop: "{{ ecs_cdw_vw_status.results | default([]) }}"
      loop_control:
        label: "{{ item.item.type }}={{ item.item.name }}"
      when: ecs_cdw_catalog_succeeded | bool

    - name: Register Hue ingress hostnames for Caddy
      ansible.builtin.set_fact:
        ecs_caddy_data_service_routes: >-
          {{
            (ecs_caddy_data_service_routes | default([]))
            + [
              {
                'id': 'cdw-hive',
                'external_hostname': 'hue-' + ecs_cdw_hive_vw_name + '.' + ecs_app_domain,
                'backend_host': ecs_master_fqdn,
                'backend_port': 443,
                'backend_scheme': 'https'
              },
              {
                'id': 'cdw-impala',
                'external_hostname': 'hue-' + ecs_cdw_impala_vw_name + '.' + ecs_app_domain,
                'backend_host': ecs_master_fqdn,
                'backend_port': 443,
                'backend_scheme': 'https'
              }
            ]
          }}
      when: ecs_cdw_catalog_succeeded | bool

    - name: Update portal catalog URL for CDW
      ansible.builtin.set_fact:
        ecs_data_services_catalog: >-
          {{
            ecs_data_services_catalog | combine(
              {
                'cdw': ecs_data_services_catalog.cdw | default({}) | combine(
                  {
                    'url': 'https://hue-' + ecs_cdw_hive_vw_name + '.' + ecs_app_domain
                  }
                )
              },
              recursive=True
            )
          }}
      when: ecs_cdw_catalog_succeeded | bool

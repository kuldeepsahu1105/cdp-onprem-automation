---
- name: "CDW VW | Inspect {{ ecs_cdw_vw.type }} Virtual Warehouse"
  cloudera.cloud.dw_virtual_warehouse_info:
    cluster_id: "{{ ecs_cdw_cluster.cluster.id }}"
    name: "{{ ecs_cdw_vw.name }}"
    endpoint_tls: "{{ ecs_data_services_verify_tls | default(false) | bool }}"
  environment: "{{ ecs_cdp_cli_environment }}"
  register: ecs_cdw_vw_existing
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh

- name: "CDW VW | Report {{ ecs_cdw_vw.type }} provisioning action"
  ansible.builtin.debug:
    msg: >-
      CDW Virtual Warehouse: type={{ ecs_cdw_vw.type }};
      name={{ ecs_cdw_vw.name }};
      status={{
        (
          ecs_cdw_vw_existing.virtual_warehouses
          | default([])
          | first
          | default({})
        ).status
        | default('Absent')
      }};
      action={{
        'REUSE'
        if ecs_cdw_vw_existing.virtual_warehouses | default([]) | length > 0
        else 'CREATE'
      }}.

- name: "CDW VW | Create missing {{ ecs_cdw_vw.type }} Virtual Warehouse"
  ansible.builtin.command:
    argv: >-
      {{
        ecs_data_services_cdp_cli_prefix
        + [
            'dw',
            'create-vw',
            '--cluster-id',
            ecs_cdw_cluster.cluster.id,
            '--dbc-id',
            ecs_cdw_catalog_id,
            '--vw-type',
            ecs_cdw_vw.type,
            '--name',
            ecs_cdw_vw.name,
            '--t-shirt-size',
            ecs_cdw_vw_tshirt_size,
            '--resource-pool',
            ecs_cdw_vw_resource_pool,
            '--config',
            ecs_cdw_vw_file_ccache_config | to_json
          ]
        + (
            [
              '--resource-template',
              ecs_cdw_vw_resource_template_ids[ecs_cdw_vw.type]
            ]
            if ecs_cdw_vw_resource_template_name | default('') | length > 0
            else []
          )
        + (
            [
              '--impala-options',
              ecs_cdw_impala_options | to_json
            ]
            if (
              ecs_cdw_vw.type == 'impala'
              and ecs_cdw_impala_options | default({}) | length > 0
            )
            else []
          )
        + (
            [
              '--impala-ha-settings',
              ecs_cdw_impala_ha_settings | to_json,
              '--autoscaling',
              ecs_cdw_impala_autoscaling | to_json
            ]
            if ecs_cdw_vw.type == 'impala'
            else []
          )
        + (
            [
              '--additional-quota',
              ecs_cdw_impala_additional_quota | to_json
            ]
            if (
              ecs_cdw_vw.type == 'impala'
              and (
                ecs_cdw_impala_additional_quota.cpu | default(0) | float > 0
                or ecs_cdw_impala_additional_quota.memory | default(0) | int > 0
              )
            )
            else []
          )
        + (
            [
              '--autoscaling',
              ecs_cdw_trino_autoscaling | to_json
            ]
            if (
              ecs_cdw_vw.type == 'trino'
              and ecs_cdw_trino_autoscaling | default({}) | length > 0
            )
            else []
          )
        + (
            [
              '--additional-quota',
              ecs_cdw_trino_additional_quota | to_json
            ]
            if (
              ecs_cdw_vw.type == 'trino'
              and (
                ecs_cdw_trino_additional_quota.cpu | default(0) | float > 0
                or ecs_cdw_trino_additional_quota.memory | default(0) | int > 0
              )
            )
            else []
          )
      }}
  environment: "{{ ecs_cdp_cli_environment }}"
  register: ecs_cdw_vw_create_result
  changed_when: true
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when: ecs_cdw_vw_existing.virtual_warehouses | default([]) | length == 0

- name: "CDW VW | Wait for {{ ecs_cdw_vw.type }} record"
  cloudera.cloud.dw_virtual_warehouse_info:
    cluster_id: "{{ ecs_cdw_cluster.cluster.id }}"
    name: "{{ ecs_cdw_vw.name }}"
    endpoint_tls: "{{ ecs_data_services_verify_tls | default(false) | bool }}"
  environment: "{{ ecs_cdp_cli_environment }}"
  register: ecs_cdw_vw_record
  until: ecs_cdw_vw_record.virtual_warehouses | default([]) | length > 0
  retries: "{{ ecs_cdw_submission_recovery_retries | int }}"
  delay: "{{ ecs_cdw_submission_recovery_delay | int }}"
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh

- name: "CDW VW | Record {{ ecs_cdw_vw.type }} identifier"
  ansible.builtin.set_fact:
    ecs_cdw_vw_id: >-
      {{
        (
          ecs_cdw_vw_record.virtual_warehouses
          | first
          | default({})
        ).id
        | default('')
      }}

- name: "CDW VW | Read {{ ecs_cdw_vw.type }} service configuration"
  ansible.builtin.command:
    argv: >-
      {{
        ecs_data_services_cdp_cli_prefix
        + [
            'dw',
            'describe-vw-config',
            '--cluster-id',
            ecs_cdw_cluster.cluster.id,
            '--vw-id',
            ecs_cdw_vw_id
          ]
      }}
  environment: "{{ ecs_cdp_cli_environment }}"
  register: ecs_cdw_vw_config
  changed_when: false
  until: ecs_cdw_vw_config.rc | default(1) == 0
  retries: "{{ ecs_cdw_submission_recovery_retries | int }}"
  delay: "{{ ecs_cdw_submission_recovery_delay | int }}"
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when: ecs_cdw_vw.type in ecs_cdw_vw_file_ccache_reconcile_types

- name: "CDW VW | Merge FILE cache into {{ ecs_cdw_vw.type }} applications"
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import copy
        import json
        import sys

        payload = json.load(sys.stdin)
        if isinstance(payload, str):
            payload = json.loads(payload)
        config = payload.get("config", payload)
        desired = sys.argv[1]
        required_apps = json.loads(sys.argv[2])

        def env_block(application):
            blocks = application.get("configBlocks", [])
            env = next(
                (copy.deepcopy(block) for block in blocks if block.get("id") == "env"),
                {"id": "env", "content": {"keyValues": {}}},
            )
            content = env.setdefault("content", {})
            key_values = content.setdefault("keyValues", {})
            key_values["KRB5CCNAME"] = desired
            return {
                "id": "env",
                "content": {
                    "keyValues": key_values,
                },
            }

        common = config.get("commonConfigs", {})
        patch = {
            "commonConfigs": {
                "configBlocks": [env_block(common)],
            },
            "applicationConfigs": {},
        }
        applications = config.get("applicationConfigs", {})
        for name in sorted(set(applications) | set(required_apps)):
            patch["applicationConfigs"][name] = {
                "configBlocks": [
                    env_block(applications.get(name, {})),
                ],
            }
        print(json.dumps(patch, separators=(",", ":"), sort_keys=True))
      - "{{ ecs_cdw_vw_krb5ccname }}"
      - >-
        {{
          ecs_cdw_vw_file_ccache_applications[ecs_cdw_vw.type]
          | default([])
          | to_json
        }}
    stdin: "{{ ecs_cdw_vw_config.stdout | to_json }}"
  register: ecs_cdw_vw_file_ccache_config_effective
  changed_when: false
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when: ecs_cdw_vw.type in ecs_cdw_vw_file_ccache_reconcile_types

- name: "CDW VW | Check {{ ecs_cdw_vw.type }} FILE credential cache"
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import json
        import sys

        payload = json.load(sys.stdin)
        if isinstance(payload, str):
            payload = json.loads(payload)
        config = payload.get("config", payload)
        desired = sys.argv[1]
        required_apps = json.loads(sys.argv[2])

        def value(application):
            for block in application.get("configBlocks", []):
                if block.get("id") == "env":
                    return (
                        block.get("content", {})
                        .get("keyValues", {})
                        .get("KRB5CCNAME", "")
                    )
            return ""

        common_matches = value(config.get("commonConfigs", {})) == desired
        applications = config.get("applicationConfigs", {})
        apps_match = all(
            value(applications.get(name, {})) == desired
            for name in required_apps
        )
        print(json.dumps({
            "applications": {
                name: value(applications.get(name, {}))
                for name in required_apps
            },
            "common": value(config.get("commonConfigs", {})),
        }, sort_keys=True))
        raise SystemExit(0 if common_matches and apps_match else 3)
      - "{{ ecs_cdw_vw_krb5ccname }}"
      - >-
        {{
          ecs_cdw_vw_file_ccache_applications[ecs_cdw_vw.type]
          | default([])
          | to_json
        }}
    stdin: "{{ ecs_cdw_vw_config.stdout | to_json }}"
  register: ecs_cdw_vw_ccache_check
  changed_when: false
  failed_when: ecs_cdw_vw_ccache_check.rc not in [0, 3]
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when: ecs_cdw_vw.type in ecs_cdw_vw_file_ccache_reconcile_types

- name: "CDW VW | Persist {{ ecs_cdw_vw.type }} FILE credential cache"
  ansible.builtin.command:
    argv: >-
      {{
        ecs_data_services_cdp_cli_prefix
        + [
            'dw',
            'update-vw',
            '--cluster-id',
            ecs_cdw_cluster.cluster.id,
            '--vw-id',
            ecs_cdw_vw_id,
            '--config',
            ecs_cdw_vw_file_ccache_config_effective.stdout
          ]
      }}
  environment: "{{ ecs_cdp_cli_environment }}"
  register: ecs_cdw_vw_ccache_update
  changed_when: ecs_cdw_vw_ccache_update.rc | default(1) == 0
  failed_when: false
  until: ecs_cdw_vw_ccache_update.rc | default(1) == 0
  retries: "{{ ecs_cdw_workload_refresh_retries | int }}"
  delay: "{{ ecs_cdw_workload_refresh_delay | int }}"
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when:
    - ecs_cdw_vw.type in ecs_cdw_vw_file_ccache_reconcile_types
    - ecs_cdw_vw_ccache_check.rc | default(3) == 3

- name: "CDW VW | Require {{ ecs_cdw_vw.type }} FILE credential cache update"
  ansible.builtin.assert:
    that:
      - >-
        ecs_cdw_vw_ccache_check.rc | default(3) == 0
        or ecs_cdw_vw_ccache_update.rc | default(1) == 0
    fail_msg: >-
      CDW did not accept the FILE credential-cache configuration for
      {{ ecs_cdw_vw.type }} Virtual Warehouse {{ ecs_cdw_vw.name }}.
      {{ ecs_cdw_vw_ccache_update.stderr
         | default(ecs_cdw_vw_ccache_update.stdout, true)
         | default('No API error was returned.', true) }}
  when: ecs_cdw_vw.type in ecs_cdw_vw_file_ccache_reconcile_types

- name: "CDW VW | Wait for Hive pods to use FILE credential cache"
  ansible.builtin.shell: |
    set -o pipefail
    {{ ecs_coredns_kubectl_path | quote }} \
      --kubeconfig {{ ecs_coredns_kubeconfig_path | quote }} \
      --namespace {{ ('compute-' ~ ecs_cdw_vw.name) | quote }} \
      get pods hiveserver2-0 query-executor-0-0 \
      --output json |
      python3 -c '
    import json
    import sys

    desired = sys.argv[1]
    required = {
        "hiveserver2-0": "hiveserver2",
        "query-executor-0-0": "query-executor",
    }
    payload = json.load(sys.stdin)
    observed = {}
    for pod in payload.get("items", []):
        pod_name = pod.get("metadata", {}).get("name", "")
        container_name = required.get(pod_name)
        if not container_name:
            continue
        container = next(
            (
                item
                for item in pod.get("spec", {}).get("containers", [])
                if item.get("name") == container_name
            ),
            {},
        )
        env = {
            item.get("name"): item.get("value", "")
            for item in container.get("env", [])
        }
        observed[pod_name] = env.get("KRB5CCNAME", "")
    print(json.dumps(observed, sort_keys=True))
    raise SystemExit(
        0
        if set(observed) == set(required)
        and all(value == desired for value in observed.values())
        else 3
    )
    ' {{ ecs_cdw_vw_krb5ccname | quote }}
  args:
    executable: /bin/bash
  register: ecs_cdw_hive_vw_ccache
  changed_when: false
  failed_when: false
  until: ecs_cdw_hive_vw_ccache.rc | default(1) == 0
  retries: "{{ ecs_cdw_workload_refresh_retries | int }}"
  delay: "{{ ecs_cdw_workload_refresh_delay | int }}"
  become: true
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when: ecs_cdw_vw.type == 'hive'

- name: "CDW VW | Require Hive pods to use FILE credential cache"
  ansible.builtin.assert:
    that:
      - ecs_cdw_hive_vw_ccache.rc | default(1) == 0
    fail_msg: >-
      Hive Virtual Warehouse {{ ecs_cdw_vw.name }} still uses the unavailable
      KCM cache after the supported CDW configuration update. Observed={{
        ecs_cdw_hive_vw_ccache.stdout | default('{}')
      }}.
  when: ecs_cdw_vw.type == 'hive'

- name: "CDW VW | Read {{ ecs_cdw_vw.type }} reduced-resource pod"
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "compute-{{ ecs_cdw_vw.name }}"
      - get
      - pod
      - query-executor-0-0
      - --output
      - json
  register: ecs_cdw_hive_executor_pod
  changed_when: false
  until: ecs_cdw_hive_executor_pod.rc | default(1) == 0
  retries: "{{ ecs_cdw_submission_recovery_retries | int }}"
  delay: "{{ ecs_cdw_submission_recovery_delay | int }}"
  failed_when: false
  become: true
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when:
    - ecs_cdw_vw.type == 'hive'
    - ecs_cdw_vw_resource_template_name | default('') | length > 0

- name: "CDW VW | Verify {{ ecs_cdw_vw.type }} reduced-resource memory"
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import json
        import re
        import sys

        payload = json.load(sys.stdin)
        if isinstance(payload, str):
            payload = json.loads(payload)
        limit_gib = float(sys.argv[1])
        containers = payload.get("spec", {}).get("containers", [])
        executor = next(
            (item for item in containers if item.get("name") == "query-executor"),
            {},
        )
        quantity = (
            executor.get("resources", {})
            .get("requests", {})
            .get("memory", "")
        )
        match = re.fullmatch(r"([0-9]+(?:\.[0-9]+)?)([EPTGMK]i?|)", quantity)
        if not match:
            print(json.dumps({"memoryRequest": quantity, "error": "unrecognized"}))
            raise SystemExit(4)
        value = float(match.group(1))
        suffix = match.group(2)
        decimal = {"": 1, "K": 10**3, "M": 10**6, "G": 10**9,
                   "T": 10**12, "P": 10**15, "E": 10**18}
        binary = {"Ki": 2**10, "Mi": 2**20, "Gi": 2**30,
                  "Ti": 2**40, "Pi": 2**50, "Ei": 2**60}
        bytes_value = value * (binary.get(suffix) or decimal[suffix])
        actual_gib = bytes_value / (2**30)
        print(json.dumps({
            "memoryRequest": quantity,
            "memoryGiB": round(actual_gib, 2),
            "maximumGiB": limit_gib,
        }, sort_keys=True))
        raise SystemExit(0 if actual_gib <= limit_gib else 3)
      - "{{ ecs_cdw_hive_reduced_executor_memory_max_gib }}"
    stdin: "{{ ecs_cdw_hive_executor_pod.stdout | default('{}') | to_json }}"
  register: ecs_cdw_hive_executor_resources
  changed_when: false
  failed_when: ecs_cdw_hive_executor_resources.rc not in [0, 3, 4]
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when:
    - ecs_cdw_vw.type == 'hive'
    - ecs_cdw_vw_resource_template_name | default('') | length > 0
    - ecs_cdw_hive_executor_pod.rc | default(1) == 0

- name: "CDW VW | Require {{ ecs_cdw_vw.type }} reduced-resource memory"
  ansible.builtin.assert:
    that:
      - ecs_cdw_hive_executor_resources.rc | default(4) == 0
    fail_msg: >-
      Hive {{ ecs_cdw_vw.name }} did not apply the
      '{{ ecs_cdw_vw_resource_template_name }}' template. Executor resources={{
        ecs_cdw_hive_executor_resources.stdout | default('unavailable')
      }}. Delete this creation-time Virtual Warehouse and rerun playbook 34;
      automation will recreate it with resourceTemplate={{
        ecs_cdw_vw_resource_template_ids[ecs_cdw_vw.type]
      }}.
  when:
    - ecs_cdw_vw.type == 'hive'
    - ecs_cdw_vw_resource_template_name | default('') | length > 0
    - ecs_cdw_hive_executor_pod.rc | default(1) == 0

- name: "CDW VW | Require {{ ecs_cdw_vw.type }} reduced-resource pod"
  ansible.builtin.assert:
    that:
      - ecs_cdw_hive_executor_pod.rc | default(1) == 0
    fail_msg: >-
      Hive query-executor pod was not generated in compute-{{ ecs_cdw_vw.name }},
      so the '{{ ecs_cdw_vw_resource_template_name }}' template could not be
      verified.
  when:
    - ecs_cdw_vw.type == 'hive'
    - ecs_cdw_vw_resource_template_name | default('') | length > 0

- name: "CDW VW | Wait for {{ ecs_cdw_vw.type }} terminal status"
  cloudera.cloud.dw_virtual_warehouse_info:
    cluster_id: "{{ ecs_cdw_cluster.cluster.id }}"
    name: "{{ ecs_cdw_vw.name }}"
    endpoint_tls: "{{ ecs_data_services_verify_tls | default(false) | bool }}"
  environment: "{{ ecs_cdp_cli_environment }}"
  register: ecs_cdw_vw_status
  until:
    - ecs_cdw_vw_status.virtual_warehouses | default([]) | length > 0
    - >-
      (
        ecs_cdw_vw_status.virtual_warehouses
        | first
        | default({})
      ).status
      | default('')
      is search('(?i)^(running|stopped|suspended|failed|error)$')
  retries: "{{ ecs_cdw_vw_wait_retries | int }}"
  delay: "{{ ecs_cdw_vw_wait_delay | int }}"
  failed_when: false
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh

- name: "CDW VW | Report {{ ecs_cdw_vw.type }} result"
  ansible.builtin.debug:
    msg: >-
      CDW Virtual Warehouse: type={{ ecs_cdw_vw.type }};
      name={{ ecs_cdw_vw.name }};
      status={{
        (
          ecs_cdw_vw_status.virtual_warehouses
          | default([])
          | first
          | default({})
        ).status
        | default('NotFound')
      }};
      result={{
        'READY'
        if (
          ecs_cdw_vw_status.virtual_warehouses
          | default([])
          | first
          | default({})
        ).status
        | default('')
        is search('(?i)^(running|stopped|suspended)$')
        else 'FAILED'
      }}.

- name: "CDW VW | Require healthy {{ ecs_cdw_vw.type }} Virtual Warehouse"
  ansible.builtin.assert:
    that:
      - ecs_cdw_vw_status.virtual_warehouses | default([]) | length > 0
      - >-
        (
          ecs_cdw_vw_status.virtual_warehouses
          | first
          | default({})
        ).status
        | default('')
        is search('(?i)^(running|stopped|suspended)$')
    fail_msg: >-
      CDW Virtual Warehouse failed:
      type={{ ecs_cdw_vw.type }};
      name={{ ecs_cdw_vw.name }};
      status={{
        (
          ecs_cdw_vw_status.virtual_warehouses
          | default([])
          | first
          | default({})
        ).status
        | default('NotFound')
      }}.

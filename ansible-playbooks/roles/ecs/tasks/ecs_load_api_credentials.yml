---
- name: Load cached ECS API credentials from controller file when present
  ansible.builtin.slurp:
    src: "{{ ecs_api_credentials_cache_path }}"
  register: ecs_api_credentials_cache_slurp
  failed_when: false
  when:
    - >-
      ecs_api_access_key_id | default('') | length == 0
      or ecs_api_private_key | default('') | length == 0
    - ecs_api_credentials_cache_path | default('') | length > 0

- name: Parse and apply cached ECS API credentials
  block:
    - name: Parse cached ECS API credentials
      ansible.builtin.set_fact:
        ecs_api_credentials_cache_parsed: >-
          {{
            ecs_api_credentials_cache_slurp.content
            | b64decode
            | from_yaml
            | default({}, true)
          }}
      no_log: true

    - name: Validate cached ECS API credentials
      ansible.builtin.assert:
        that:
          - ecs_api_credentials_cache_parsed is mapping
          - ecs_api_credentials_cache_parsed.access_key_id | default('') | length > 0
          - ecs_api_credentials_cache_parsed.private_key | default('') | length > 0
          - >-
            not (
              ecs_api_credentials_cache_parsed.private_key
              | default('')
              | regex_search('^-----BEGIN [^-]+----- ')
            )
        fail_msg: Cached ECS API credentials are incomplete or use the legacy folded PEM format.
      no_log: true

    - name: Apply cached ECS API credentials
      ansible.builtin.set_fact:
        ecs_api_access_key_id: "{{ ecs_api_credentials_cache_parsed.access_key_id }}"
        ecs_api_private_key: "{{ ecs_api_credentials_cache_parsed.private_key }}"
      no_log: true
  rescue:
    - name: Clear invalid cached ECS API credentials
      ansible.builtin.set_fact:
        ecs_api_credentials_cache_parsed: {}
        ecs_api_credentials_cache_invalid: true

    - name: Report invalid ECS API credentials cache
      ansible.builtin.debug:
        msg: >-
          ECS API credential cache {{ ecs_api_credentials_cache_path }} is invalid.
          It will be replaced only if automation must generate a new access key.
  when:
    - ecs_api_credentials_cache_slurp is defined
    - ecs_api_credentials_cache_slurp.content is defined

- name: Report cached ECS API credentials reused
  ansible.builtin.debug:
    msg: >-
      Reusing ECS automation API credentials from
      {{ ecs_api_credentials_cache_path }}.
  when:
    - ecs_api_credentials_cache_slurp is defined
    - ecs_api_credentials_cache_slurp.content is defined
    - not (ecs_api_credentials_cache_invalid | default(false) | bool)

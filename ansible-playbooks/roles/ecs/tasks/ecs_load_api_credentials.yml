---
- name: Load cached ECS API credentials from controller file when present
  ansible.builtin.slurp:
    src: "{{ ecs_api_credentials_cache_path }}"
  register: ecs_api_credentials_cache_slurp
  failed_when: false
  when:
    - >-
      ecs_api_access_key_id | default('') | length == 0
      or ecs_api_private_key | default('') | length == 0
    - ecs_api_credentials_cache_path | default('') | length > 0

- name: Apply cached ECS API credentials
  ansible.builtin.set_fact:
    ecs_api_access_key_id: >-
      {{
        (ecs_api_credentials_cache_slurp.content | b64decode | from_yaml)
        .access_key_id
      }}
    ecs_api_private_key: >-
      {{
        (ecs_api_credentials_cache_slurp.content | b64decode | from_yaml)
        .private_key
      }}
  no_log: true
  when:
    - ecs_api_credentials_cache_slurp is defined
    - ecs_api_credentials_cache_slurp.content is defined

---
- name: CAI | Start ML workspace provisioning
  cloudera.cloud.ml:
    environment: "{{ ecs_cdp_environment_name }}"
    name: "{{ ecs_cai_workspace_name }}"
    governance: "{{ ecs_cai_enable_governance | default(true) | bool }}"
    metrics: "{{ ecs_cai_enable_metrics | default(true) | bool }}"
    tls: "{{ ecs_cai_enable_tls | default(true) | bool }}"
    monitoring: "{{ ecs_cai_enable_monitoring | default(true) | bool }}"
    namespace: "{{ ecs_cai_k8s_namespace }}"
    resource_pool: "{{ ecs_cai_resource_pool }}"
    endpoint_tls: "{{ ecs_data_services_verify_tls | default(false) | bool }}"
    wait: false
    state: present
  environment: "{{ ecs_cdp_cli_environment }}"
  register: ecs_cai_workspace_start
  changed_when: false
  failed_when: false
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when: "'cai' in (ecs_data_services_install_names | default([]))"

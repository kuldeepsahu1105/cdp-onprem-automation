---
- name: CAI TLS | Configure wildcard certificate and Kubernetes secret
  when:
    - "'cai' in (ecs_data_services_install_names | default([]))"
    - ecs_cai_workbench_hostname | default('') | length > 0
    - ecs_cai_configure_wildcard_tls | default(true) | bool
    - groups.get('ipaserver', []) | length > 0
  block:
    - name: CAI TLS | Ensure FreeIPA wildcard certificate profile
      ansible.builtin.include_role:
        name: cloudera.exe.freeipa_server_wildcard_profile
        apply:
          delegate_to: "{{ groups.get('ipaserver', []) | default(['localhost'], true) | first }}"
          become: true
          connection: ssh
      vars:
        freeipa_wildcard_profile_name: "{{ ecs_cai_wildcard_cert_profile }}"

    - name: CAI TLS | Issue workbench wildcard certificate
      ansible.builtin.include_role:
        name: cloudera.exe.freeipa_server_unenrolled_tls
        apply:
          delegate_to: "{{ groups.get('ipaserver', []) | default(['localhost'], true) | first }}"
          become: true
          connection: ssh
      vars:
        unenrolled_hostname: "{{ ecs_cai_workbench_hostname }}"
        unenrolled_description: "Cloudera AI workbench wildcard certificate"
        unenrolled_cert_profile: "{{ ecs_cai_wildcard_cert_profile }}"

    - name: CAI TLS | Ensure Kubernetes Python client is installed on ECS master
      ansible.builtin.pip:
        name: kubernetes
        state: present
      become: true
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh

    - name: CAI TLS | Create workbench TLS secret
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ ecs_kubeconfig_path }}"
        namespace: "{{ ecs_cai_k8s_namespace }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ ecs_cai_tls_secret_name }}"
          type: kubernetes.io/tls
          data:
            tls.crt: "{{ lookup('file', ecs_cai_workbench_hostname + '.crt') | b64encode }}"
            tls.key: "{{ lookup('file', ecs_cai_workbench_hostname + '.pem') | b64encode }}"
      become: true
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
  always:
    - name: CAI TLS | Remove fetched certificate material from controller
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ playbook_dir }}/{{ ecs_cai_workbench_hostname }}.crt"
        - "{{ playbook_dir }}/{{ ecs_cai_workbench_hostname }}.pem"
      when: ecs_cai_workbench_hostname | default('') | length > 0
      no_log: true

- name: CAI TLS | Report external certificate requirement
  ansible.builtin.debug:
    msg: >-
      CAI wildcard TLS automation was skipped because no FreeIPA ipaserver host
      is present. Ensure {{ ecs_cai_tls_secret_name }} exists in namespace
      {{ ecs_cai_k8s_namespace }} before using {{ ecs_cai_workspace_url }}.
  when:
    - "'cai' in (ecs_data_services_install_names | default([]))"
    - ecs_cai_workbench_hostname | default('') | length > 0
    - ecs_cai_configure_wildcard_tls | default(true) | bool
    - groups.get('ipaserver', []) | length == 0

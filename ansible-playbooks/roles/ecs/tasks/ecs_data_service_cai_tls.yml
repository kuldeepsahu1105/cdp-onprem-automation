---
- name: CAI TLS | Reuse adopted workspace TLS contract
  ansible.builtin.set_fact:
    ecs_cai_expected_base_hostname: >-
      {{ ecs_cai_static_subdomain_effective | lower }}.{{ ecs_app_domain | lower }}
    ecs_cai_workbench_hostname: >-
      {{ ecs_cai_static_subdomain_effective | lower }}.{{ ecs_app_domain | lower }}
    ecs_cai_tls_subdomain_validated: "{{ ecs_cai_static_subdomain_effective }}"
  when: ecs_cai_existing_workspace | default({}) | length > 0

- name: CAI TLS | Skip pre-create convergence for adopted workspace
  ansible.builtin.debug:
    msg: >-
      CAI TLS: existing workspace {{
      ecs_cai_existing_workspace.instanceName
      | default(ecs_cai_workspace_name_effective) }} is authoritative at
      {{ ecs_cai_existing_workspace.instanceUrl
      | default('https://' + ecs_cai_expected_base_hostname) }}.
      Skipping certificate staging and pre-create secret convergence.
  when: ecs_cai_existing_workspace | default({}) | length > 0

- name: CAI TLS | Converge trusted pre-create certificate
  when: ecs_cai_existing_workspace | default({}) | length == 0
  block:
    - name: CAI TLS | Run provider-aware TLS convergence
      ansible.builtin.include_tasks: ecs_data_service_cai_tls_converge.yml
  always:
    - name: CAI TLS | Remove remote validation material
      ansible.builtin.file:
        path: "{{ ecs_cai_tls_validation_dir.path }}"
        state: absent
      become: false
      delegate_to: "{{ ecs_data_services_delegate_host }}"
      connection: ssh
      when:
        - ecs_cai_tls_validation_dir is defined
        - ecs_cai_tls_validation_dir.path | default('') | length > 0

    - name: CAI TLS | Remove fetched certificate material from controller
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ playbook_dir }}/{{ ecs_cai_expected_base_hostname | default('cai') }}.crt"
        - "{{ playbook_dir }}/{{ ecs_cai_expected_base_hostname | default('cai') }}.pem"
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      delegate_to: localhost
      connection: local

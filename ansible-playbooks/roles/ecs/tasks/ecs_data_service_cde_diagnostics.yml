---
- name: CDE diagnostics | List current Data Engineering services
  ansible.builtin.command:
    argv: "{{ ecs_data_services_cdp_cli_prefix + ['de', 'list-services', '--no-remove-deleted'] }}"
  environment: >-
    {{
      ecs_cde_creator_cli_environment
      | default(ecs_cdp_cli_environment, true)
    }}
  register: ecs_cde_diagnostic_service_list
  changed_when: false
  failed_when: false
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh

- name: CDE diagnostics | Initialize failed service details
  ansible.builtin.set_fact:
    ecs_cde_failed_service_summary: {}
    ecs_cde_failed_service_description: {}

- name: CDE diagnostics | Resolve failed service summary
  ansible.builtin.set_fact:
    ecs_cde_failed_service_summary: >-
      {{
        (
          (ecs_cde_diagnostic_service_list.stdout | from_json).services
          | default([])
          | selectattr('name', 'equalto', ecs_cde_service_name_effective)
          | list
          | first
        )
        | default({}, true)
      }}
  when:
    - ecs_cde_diagnostic_service_list.rc | default(1) == 0
    - ecs_cde_diagnostic_service_list.stdout | default('') | trim | regex_search('^\{')

- name: CDE diagnostics | Describe failed service
  ansible.builtin.command:
    argv: >-
      {{
        ecs_data_services_cdp_cli_prefix
        + [
          'de',
          'describe-service',
          '--cluster-id',
          ecs_cde_failed_service_summary.clusterId
        ]
      }}
  environment: >-
    {{
      ecs_cde_creator_cli_environment
      | default(ecs_cdp_cli_environment, true)
    }}
  register: ecs_cde_diagnostic_service_description
  changed_when: false
  failed_when: false
  become: false
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh
  when: ecs_cde_failed_service_summary.clusterId | default('') | length > 0

- name: CDE diagnostics | Parse failed service description
  ansible.builtin.set_fact:
    ecs_cde_failed_service_description: >-
      {{ ecs_cde_diagnostic_service_description.stdout | from_json }}
  when:
    - ecs_cde_diagnostic_service_description is not skipped
    - ecs_cde_diagnostic_service_description.rc | default(1) == 0
    - ecs_cde_diagnostic_service_description.stdout | default('') | trim | regex_search('^\{')

- name: CDE diagnostics | List control-plane pods
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_cde_control_plane_namespace }}"
      - get
      - pods
      - --output
      - wide
  register: ecs_cde_diagnostic_control_plane_pods
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh

- name: CDE diagnostics | Read control-plane deployment inventory
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_cde_control_plane_namespace }}"
      - get
      - deployments
      - --output
      - json
  register: ecs_cde_diagnostic_deployments_raw
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh

- name: CDE diagnostics | Initialize relevant deployment list
  ansible.builtin.set_fact:
    ecs_cde_diagnostic_deployments: []

- name: CDE diagnostics | Select remote-context control-plane deployments
  ansible.builtin.set_fact:
    ecs_cde_diagnostic_deployments: >-
      {%- set result = [] -%}
      {%- for deployment in
        (ecs_cde_diagnostic_deployments_raw.stdout | from_json).items | default([])
      -%}
      {%- set name = deployment.metadata.name | default('') -%}
      {%- if name | regex_search(
        '(cpx-liftie|dex-cp|resource-pool-manager|thunderhead-compute-api)'
      ) -%}
      {%- set _ = result.append(name) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ result }}
  when:
    - ecs_cde_diagnostic_deployments_raw.rc | default(1) == 0
    - ecs_cde_diagnostic_deployments_raw.stdout | default('') | trim | regex_search('^\{')

- name: CDE diagnostics | Collect remote-context control-plane logs
  ansible.builtin.command:
    argv:
      - "{{ ecs_coredns_kubectl_path }}"
      - --kubeconfig
      - "{{ ecs_coredns_kubeconfig_path }}"
      - --namespace
      - "{{ ecs_cde_control_plane_namespace }}"
      - logs
      - "deployment/{{ item }}"
      - --all-containers=true
      - "--since={{ ecs_cde_diagnostics_log_since }}"
      - "--tail={{ ecs_cde_diagnostics_log_tail }}"
  loop: "{{ ecs_cde_diagnostic_deployments }}"
  register: ecs_cde_diagnostic_control_plane_logs
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ ecs_data_services_delegate_host }}"
  connection: ssh

- name: CDE diagnostics | Report failed service and control-plane evidence
  ansible.builtin.debug:
    msg:
      - >-
        CDE service={{ ecs_cde_service_name_effective | default('unknown') }};
        summary={{ ecs_cde_failed_service_summary | to_json }};
        description={{ ecs_cde_failed_service_description | to_json }}
      - >-
        Control-plane pods in {{ ecs_cde_control_plane_namespace }}:
        {{ ecs_cde_diagnostic_control_plane_pods.stdout
           | default(ecs_cde_diagnostic_control_plane_pods.stderr, true) }}
      - >-
        Relevant deployment logs:
        {%- for result in ecs_cde_diagnostic_control_plane_logs.results | default([]) %}
        \n===== {{ result.item }} =====
        \n{{ result.stdout | default(result.stderr, true) }}
        {%- else %}
        no matching liftie/dex/cadence/compute/resource-pool deployment was discovered
        {%- endfor %}

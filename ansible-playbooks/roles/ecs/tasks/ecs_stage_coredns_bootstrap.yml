---
# RKE2 reconciles CoreDNS from its Helm chart. Stage the supported chart
# override before control-plane installation so Helm cannot restore
# /etc/resolv.conf over the direct identity-DNS forwarder.

- name: Resolve ECS CoreDNS bootstrap forwarders
  ansible.builtin.set_fact:
    ecs_coredns_bootstrap_forwarders: >-
      {{
        (
          ecs_coredns_forwarders
          if ecs_coredns_forwarders | default([]) | length > 0
          else (
            [
              hostvars[groups['ipaserver'][0]].private_ip
              | default(
                  hostvars[groups['ipaserver'][0]].ansible_host,
                  true
                )
            ]
            if identity_provider_effective | default('freeipa') == 'freeipa'
            and groups.get('ipaserver', []) | length > 0
            else (
              ad_dns_servers | default([])
              if identity_provider_effective | default('') == 'ad'
              else extra_dns_nameservers | default([])
            )
          )
        )
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | unique
        | list
      }}

- name: Require ECS CoreDNS bootstrap forwarders before First Run
  ansible.builtin.assert:
    that:
      - ecs_coredns_bootstrap_forwarders | length > 0
    fail_msg: >-
      Refusing to start ECS First Run without an initial CoreDNS forwarder.
      FreeIPA requires an ipaserver inventory address, AD requires
      ad_dns_servers, and other deployments require extra_dns_nameservers or
      an explicit ecs_coredns_forwarders override.

- name: Require literal IP ECS CoreDNS bootstrap forwarders
  ansible.builtin.command:
    argv: >-
      {{
        [
          'python3',
          '-c',
          'import ipaddress,sys; [ipaddress.ip_address(value) for value in sys.argv[1:]]'
        ]
        + ecs_coredns_bootstrap_forwarders
      }}
  changed_when: false

- name: Create RKE2 server manifest directory before First Run
  ansible.builtin.file:
    path: "{{ ecs_rke2_server_manifests_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  delegate_to: "{{ groups[ecs_cluster_master_group][0] }}"
  connection: ssh

- name: Stage persistent RKE2 CoreDNS forwarding policy before First Run
  ansible.builtin.copy:
    dest: "{{ ecs_rke2_coredns_helm_config_path }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      apiVersion: helm.cattle.io/v1
      kind: HelmChartConfig
      metadata:
        name: rke2-coredns
        namespace: kube-system
      spec:
        valuesContent: |-
          servers:
            - zones:
                - zone: .
              use_tcp: true
              port: 53
              plugins:
                - name: errors
                - name: health
                  configBlock: |-
                    lameduck 10s
                - name: ready
                - name: kubernetes
                  parameters: cluster.local in-addr.arpa ip6.arpa
                  configBlock: |-
                    pods insecure
                    fallthrough in-addr.arpa ip6.arpa
                    ttl 30
                - name: prometheus
                  parameters: 0.0.0.0:9153
                - name: forward
                  parameters: ". /etc/resolv.conf"
                - name: cache
                  parameters: "30"
                - name: loop
                - name: reload
                - name: loadbalance
            - zones:
                - zone: "{{ cluster_domain }}"
              port: 53
              plugins:
                - name: errors
                - name: cache
                  parameters: "30"
                - name: forward
                  parameters: ". {{ ecs_coredns_bootstrap_forwarders | join(' ') }}"
          nodelocal:
            extraClusterDomains:
              - "{{ cluster_domain }}"
  become: true
  delegate_to: "{{ groups[ecs_cluster_master_group][0] }}"
  connection: ssh

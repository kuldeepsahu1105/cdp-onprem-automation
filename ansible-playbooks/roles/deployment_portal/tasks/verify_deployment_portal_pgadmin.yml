---
# pgAdmin container must be running and serve HTTP on the published host port (Caddy upstream pgadmin:80).

- name: Check pgAdmin container is running
  ansible.builtin.command:
    cmd: >-
      docker ps --filter name=^{{ deployment_portal_pgadmin_container }}$
      --filter status=running -q
  register: pgadmin_container_running
  changed_when: false
  failed_when: false

- name: Capture pgAdmin container state when not running
  ansible.builtin.command:
    cmd: docker ps -a --filter name={{ deployment_portal_pgadmin_container }} --no-trunc
  register: pgadmin_container_ps
  changed_when: false
  failed_when: false
  when: pgadmin_container_running.stdout | default('') | trim | length == 0

- name: Capture pgAdmin logs when container is not running
  ansible.builtin.command:
    cmd: docker logs --tail 120 {{ deployment_portal_pgadmin_container }}
  register: pgadmin_logs_not_running
  changed_when: false
  failed_when: false
  when: pgadmin_container_running.stdout | default('') | trim | length == 0

- name: Fail when pgAdmin container is not running
  ansible.builtin.fail:
    msg: >-
      pgAdmin container '{{ deployment_portal_pgadmin_container }}' is not running on {{ inventory_hostname }}.
      Caddy vhost pgAdmin will return 502 until the container is healthy (upstream must be compose service name pgadmin:80).
      docker ps -a output:
      {{ pgadmin_container_ps.stdout | default('(none)') }}
      Recent logs:
      {{ pgadmin_logs_not_running.stdout | default('(no logs)') }}
      Fix: re-run PORTAL or on this host:
      cd {{ deployment_portal_config_dir }} && docker compose up -d --force-recreate pgadmin
  when: pgadmin_container_running.stdout | default('') | trim | length == 0

- name: Verify pgAdmin can read the PostgreSQL passfile
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ deployment_portal_pgadmin_container }}"
      - test
      - -r
      - /var/lib/pgadmin/.pgpass
  register: pgadmin_passfile_readable
  changed_when: false
  retries: 6
  delay: 3
  until: pgadmin_passfile_readable.rc == 0

- name: Discover installed PostgreSQL systemd units for pgAdmin verification
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      systemctl list-unit-files --type=service --no-legend --no-pager
      | awk '$1 ~ /^(postgresql|postgres|pgsql)([-@.][^ ]*)?\.service$/ {
          sub(/\.service$/, "", $1); print $1
        }'
    executable: /bin/bash
  register: pgadmin_postgres_installed_units
  changed_when: false
  become: true
  delegate_to: "{{ deployment_portal_context.postgresql.inventory_host }}"

- name: Record installed PostgreSQL systemd units
  ansible.builtin.set_fact:
    pgadmin_postgres_service_candidates: >-
      {{
        pgadmin_postgres_installed_units.stdout_lines
        | default([])
        | map('trim')
        | reject('equalto', '')
        | unique
        | list
      }}

- name: Select configured PostgreSQL systemd unit
  ansible.builtin.set_fact:
    pgadmin_postgres_service: >-
      {{
        (
          [
            'postgresql-' ~ (postgresql_version | string),
            'postgresql' ~ (postgresql_version | string),
            'postgresql@' ~ (postgresql_version | string) ~ '-main',
            'postgresql'
          ]
          | intersect(pgadmin_postgres_service_candidates)
          | first
        )
        | default('')
      }}

- name: Select sole installed PostgreSQL systemd unit as fallback
  ansible.builtin.set_fact:
    pgadmin_postgres_service: "{{ pgadmin_postgres_service_candidates | first }}"
  when:
    - pgadmin_postgres_service | default('') | length == 0
    - pgadmin_postgres_service_candidates | length == 1

- name: Record whether PostgreSQL is installed for pgAdmin verification
  ansible.builtin.set_fact:
    pgadmin_postgres_database_present: "{{ pgadmin_postgres_service_candidates | length > 0 }}"

- name: Defer pgAdmin database verification until CM_INSTALL
  ansible.builtin.debug:
    msg: >-
      PostgreSQL is not installed on {{ deployment_portal_context.postgresql.inventory_host }} yet.
      Skipping the database login check during portal bootstrap; CM_INSTALL owns
      23_setup_postgres.yml and must complete before CM_TLS_KRB_LDAP or CDH_INSTALL.
  when: not (pgadmin_postgres_database_present | bool)

- name: Capture PostgreSQL listener when service discovery is unresolved
  ansible.builtin.command:
    argv:
      - ss
      - -ltnp
      - "sport = :{{ deployment_portal_context.postgresql.port }}"
  register: pgadmin_postgres_listener
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ deployment_portal_context.postgresql.inventory_host }}"
  when:
    - pgadmin_postgres_database_present | bool
    - pgadmin_postgres_service | default('') | length == 0

- name: Capture PostgreSQL processes when service discovery is unresolved
  ansible.builtin.command:
    argv:
      - pgrep
      - -a
      - -f
      - "postgres|postmaster"
  register: pgadmin_postgres_processes
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ deployment_portal_context.postgresql.inventory_host }}"
  when:
    - pgadmin_postgres_database_present | bool
    - pgadmin_postgres_service | default('') | length == 0

- name: Require an installed PostgreSQL service for pgAdmin verification
  ansible.builtin.assert:
    that:
      - pgadmin_postgres_service | default('') | length > 0
    fail_msg: >-
      Could not unambiguously resolve the PostgreSQL systemd service on
      {{ deployment_portal_context.postgresql.inventory_host }}.
      Installed PostgreSQL units:
      {{ pgadmin_postgres_service_candidates | default([]) | join(', ') | default('(none)', true) }}.
      Port {{ deployment_portal_context.postgresql.port }} listener:
      {{ pgadmin_postgres_listener.stdout | default('(not captured)') }}.
      PostgreSQL processes:
      {{ pgadmin_postgres_processes.stdout | default('(not captured)') }}.
      Run 23_setup_postgres.yml when no dedicated PostgreSQL unit is installed;
      if multiple versions are installed, align postgresql_version with the intended unit.
  when: pgadmin_postgres_database_present | bool

- name: Ensure PostgreSQL is started for pgAdmin verification
  ansible.builtin.systemd:
    name: "{{ pgadmin_postgres_service }}"
    state: started
    enabled: true
    daemon_reload: true
  register: pgadmin_postgres_start
  failed_when: false
  become: true
  delegate_to: "{{ deployment_portal_context.postgresql.inventory_host }}"
  when: pgadmin_postgres_database_present | bool

- name: Capture PostgreSQL service state for pgAdmin verification
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ pgadmin_postgres_service }}"
  register: pgadmin_postgres_service_state
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ deployment_portal_context.postgresql.inventory_host }}"
  when: pgadmin_postgres_database_present | bool

- name: Capture PostgreSQL service status after startup failure
  ansible.builtin.command:
    argv:
      - systemctl
      - status
      - "{{ pgadmin_postgres_service }}"
      - --no-pager
      - -l
  register: pgadmin_postgres_service_status
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ deployment_portal_context.postgresql.inventory_host }}"
  when:
    - pgadmin_postgres_database_present | bool
    - pgadmin_postgres_service_state.rc | int != 0

- name: Capture PostgreSQL journal after startup failure
  ansible.builtin.command:
    argv:
      - journalctl
      - -u
      - "{{ pgadmin_postgres_service }}"
      - -n
      - "120"
      - --no-pager
  register: pgadmin_postgres_start_journal
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ deployment_portal_context.postgresql.inventory_host }}"
  when:
    - pgadmin_postgres_database_present | bool
    - pgadmin_postgres_service_state.rc | int != 0

- name: Fail when PostgreSQL cannot be started for pgAdmin
  ansible.builtin.fail:
    msg: >-
      PostgreSQL service {{ pgadmin_postgres_service }} is not active on
      {{ deployment_portal_context.postgresql.inventory_host }}.
      Start result: {{ pgadmin_postgres_start.msg | default('no systemd error reported') }}.
      Service status:
      {{ pgadmin_postgres_service_status.stdout | default('(no status output)') }}.
      Recent journal:
      {{ pgadmin_postgres_start_journal.stdout | default('(no journal output)') }}.
      Repair the database service or re-run 23_setup_postgres.yml before PORTAL.
  when:
    - pgadmin_postgres_database_present | bool
    - pgadmin_postgres_service_state.rc | int != 0

- name: Verify pgAdmin PostgreSQL credentials
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - "PGHOST={{ deployment_portal_context.postgresql.host_fqdn }}"
      - -e
      - "PGPORT={{ deployment_portal_context.postgresql.port }}"
      - -e
      - PGDATABASE=postgres
      - -e
      - "PGUSER={{ postgres_user }}"
      - -e
      - PGPASSFILE=/var/lib/pgadmin/.pgpass
      - -e
      - "PGSSLMODE={{ deployment_portal_pgadmin_postgres_sslmode | default('disable') }}"
      - "{{ deployment_portal_pgadmin_container }}"
      - /venv/bin/python3
      - -c
      - "import psycopg; psycopg.connect(connect_timeout=10).close()"
  register: pgadmin_postgres_login
  changed_when: false
  failed_when: false
  retries: 3
  delay: 5
  until: pgadmin_postgres_login.rc == 0
  when: pgadmin_postgres_database_present | bool

- name: Capture PostgreSQL service state after pgAdmin login failure
  ansible.builtin.command:
    argv:
      - systemctl
      - status
      - "{{ pgadmin_postgres_service }}"
      - --no-pager
      - -l
  register: pgadmin_postgres_login_service_status
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ deployment_portal_context.postgresql.inventory_host }}"
  when:
    - pgadmin_postgres_database_present | bool
    - pgadmin_postgres_login.rc | default(1) | int != 0

- name: Capture PostgreSQL journal after pgAdmin login failure
  ansible.builtin.command:
    argv:
      - journalctl
      - -u
      - "{{ pgadmin_postgres_service }}"
      - --since
      - -5 minutes
      - -n
      - "80"
      - --no-pager
  register: pgadmin_postgres_journal
  changed_when: false
  failed_when: false
  become: true
  delegate_to: "{{ deployment_portal_context.postgresql.inventory_host }}"
  when:
    - pgadmin_postgres_database_present | bool
    - pgadmin_postgres_login.rc | default(1) | int != 0

- name: Fail when pgAdmin cannot authenticate to PostgreSQL
  ansible.builtin.fail:
    msg: >-
      pgAdmin could not connect to PostgreSQL at
      {{ deployment_portal_context.postgresql.host_fqdn }}:{{ deployment_portal_context.postgresql.port }}
      (container host mapping {{ deployment_portal_context.postgresql.connect_host }})
      with sslmode={{ deployment_portal_pgadmin_postgres_sslmode | default('disable') }}.
      Client error: {{ pgadmin_postgres_login.stderr | default('unknown') }}.
      PostgreSQL service status:
      {{ pgadmin_postgres_login_service_status.stdout | default('unknown') }}.
      Recent PostgreSQL journal:
      {{ pgadmin_postgres_journal.stdout | default('(no journal output)') }}.
  when:
    - pgadmin_postgres_database_present | bool
    - pgadmin_postgres_login.rc | default(1) | int != 0

- name: Verify pgAdmin responds on localhost published port
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ deployment_portal_pgadmin_host_port | int }}/"
    method: GET
    status_code: [200, 302, 308]
    follow_redirects: none
    return_content: false
  register: pgadmin_local_http
  retries: 12
  delay: 5
  until: pgadmin_local_http is succeeded

- name: Capture pgAdmin logs when local HTTP check failed
  ansible.builtin.command:
    cmd: docker logs --tail 120 {{ deployment_portal_pgadmin_container }}
  register: pgadmin_logs_http_fail
  changed_when: false
  failed_when: false
  when: pgadmin_local_http is failed

- name: Fail when pgAdmin does not respond locally
  ansible.builtin.fail:
    msg: >-
      pgAdmin did not respond on http://127.0.0.1:{{ deployment_portal_pgadmin_host_port }}/ on {{ inventory_hostname }}.
      Check image arch ({{ deployment_portal_pgadmin_image }}), PGADMIN_DEFAULT_EMAIL/PASSWORD, and port conflicts on :{{ deployment_portal_pgadmin_host_port }}.
      Recent logs:
      {{ pgadmin_logs_http_fail.stdout | default('(no logs captured)') }}
  when: pgadmin_local_http is failed

- name: Show pgAdmin logs for debugging (optional)
  ansible.builtin.command:
    cmd: docker logs --tail 80 {{ deployment_portal_pgadmin_container }}
  register: pgadmin_logs_debug
  changed_when: false
  failed_when: false
  when: deployment_portal_pgadmin_debug_logs | default(false) | bool

- name: Print pgAdmin debug logs
  ansible.builtin.debug:
    var: pgadmin_logs_debug.stdout_lines
  when:
    - deployment_portal_pgadmin_debug_logs | default(false) | bool
    - pgadmin_logs_debug is defined

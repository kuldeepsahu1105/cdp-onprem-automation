---
# Operator access facts for deployment portal (localhost). Passwords rendered at deploy time only.

- name: Resolve deployment portal SSH key path on controller
  ansible.builtin.import_tasks: resolve_deployment_portal_ssh_key.yml

# SSH keys are never exported unless portal authentication is enabled.
- name: Resolve effective SSH key export for portal
  ansible.builtin.set_fact:
    deployment_portal_ssh_keys_expose_effective: >-
      {{
        (
          true
          if (deployment_portal_expose_ssh_keys | default(true) | string) in ['auto', 'Auto', 'AUTO']
          else (deployment_portal_expose_ssh_keys | default(true) | bool)
        )
        and (deployment_portal_basic_auth_enabled | default(false) | bool)
      }}

- name: Report suppressed SSH key export when portal authentication is disabled
  ansible.builtin.debug:
    msg: >-
      SSH key export was requested but has been suppressed because deployment_portal_basic_auth_enabled=false.
      Private keys are never copied to portal downloads without authentication.
  when:
    - not (deployment_portal_basic_auth_enabled | default(false) | bool)
    - >-
      (deployment_portal_expose_ssh_keys | default(true) | string) in ['auto', 'Auto', 'AUTO']
      or (deployment_portal_expose_ssh_keys | default(true) | bool)

- name: Stat ECS API credentials cache on controller
  ansible.builtin.stat:
    path: "{{ ecs_api_credentials_cache_path }}"
  register: _deployment_portal_ecs_api_cache_stat
  when: ecs_api_credentials_cache_path | default('') | length > 0

- name: Validate ECS API credentials cache for authenticated portal access
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ playbook_dir }}/files/parse_ecs_api_credentials_cache.py"
      - "{{ ecs_api_credentials_cache_path }}"
  register: deployment_portal_ecs_api_cache_parse
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - deployment_portal_basic_auth_enabled | default(false) | bool
    - ecs_api_credentials_cache_path | default('') | length > 0
    - _deployment_portal_ecs_api_cache_stat.stat.exists | default(false) | bool

- name: Apply ECS API credentials cache to authenticated portal access
  ansible.builtin.set_fact:
    deployment_portal_ecs_api_cache: "{{ deployment_portal_ecs_api_cache_parse.stdout | from_json }}"
  no_log: true
  when:
    - deployment_portal_ecs_api_cache_parse is defined
    - deployment_portal_ecs_api_cache_parse.rc | default(1) == 0

- name: Report unreadable ECS API credentials cache
  ansible.builtin.debug:
    msg: >-
      ECS API credential cache {{ ecs_api_credentials_cache_path }} is unreadable.
      Portal refresh will continue without displaying the cached API key.
  when:
    - deployment_portal_ecs_api_cache_parse is defined
    - deployment_portal_ecs_api_cache_parse.rc | default(0) != 0

- name: Default empty ECS API cache when unavailable
  ansible.builtin.set_fact:
    deployment_portal_ecs_api_cache: {}
  when: deployment_portal_ecs_api_cache is not defined

- name: Set Caddy bcrypt hash for portal session login
  ansible.builtin.set_fact:
    deployment_portal_basic_auth_hash: "{{ deployment_portal_basic_auth_password | password_hash('bcrypt') }}"
  no_log: true
  when: deployment_portal_basic_auth_enabled | default(false) | bool

- name: Clear portal login password hash when disabled
  ansible.builtin.set_fact:
    deployment_portal_basic_auth_hash: ""
  when: not (deployment_portal_basic_auth_enabled | default(false) | bool)

- name: Render deployment portal operator access structure
  ansible.builtin.set_fact:
    deployment_portal_operator_access: >-
      {{
        lookup('template', 'deployment_portal_operator_access.j2') | from_yaml | default({}, true)
      }}

---
- name: "SKIPPED PORTAL refresh — end ops host (Caddy stack disabled on controller)"
  ansible.builtin.meta: end_host
  when: not (hostvars['localhost'].deployment_portal_caddy_effective | default(false) | bool)

- name: Load portal context from localhost
  ansible.builtin.import_tasks: deployment_portal_load_host_facts.yml

- name: Check whether portal stack was bootstrapped
  ansible.builtin.stat:
    path: "{{ deployment_portal_config_dir }}/docker-compose.yml"
  register: portal_compose_stat

- name: Require bootstrap before refresh-only run
  ansible.builtin.fail:
    msg: >-
      Deployment portal not installed on {{ inventory_hostname }}
      (missing {{ deployment_portal_config_dir }}/docker-compose.yml).
      Run 10_setup_deployment_portal.yml or re-run PORTAL deploy phase.
  when: not portal_compose_stat.stat.exists

- name: Sync portal templates and stacks
  ansible.builtin.import_tasks: sync_deployment_portal_content.yml
  vars:
    deployment_portal_verify_post_cm: true

- name: Print deployment portal URLs
  ansible.builtin.import_tasks: print_deployment_portal_urls.yml
  vars:
    deployment_portal_urls_print_prefix: "(refreshed) "

- name: Print full access URL report (pipeline log / email)
  ansible.builtin.import_tasks: print_deployment_access_urls.yml

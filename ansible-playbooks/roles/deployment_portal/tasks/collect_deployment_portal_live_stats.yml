---
# Portal index KPIs from inventory only — no Cloudera Manager API calls (CM verify is playbook 25+).

- name: Set Prometheus poll path for portal live stats
  ansible.builtin.set_fact:
    _portal_live_poll_meta:
      snapshot_json: live-stats.json
      prometheus_query_path: >-
        {{
          '/prometheus/api/v1/query'
          if (deployment_portal_monitoring_routes_enabled | default(false) | bool)
          else ''
        }}
      prometheus_same_origin_hint: >-
        {{
          (
            'Live Prometheus queries work on the ops host :'
            ~ (deployment_portal_http_port | string)
            ~ ' index (path /prometheus). The portal lab vhost serves static files only.'
          )
          if (
            caddy_vhost_enabled | default(false) | bool
            and (deployment_portal_monitoring_routes_enabled | default(false) | bool)
          )
          else (
            'Prometheus targets refresh in-browser when monitoring path routes are enabled on this origin.'
            if (deployment_portal_monitoring_routes_enabled | default(false) | bool)
            else 'Enable the monitoring stack for live Prometheus target counts.'
          )
        }}

- name: Initialize portal live stats from inventory
  ansible.builtin.set_fact:
    deployment_portal_live_stats: >-
      {{
        {
          'collected_at': ansible_date_time.iso8601 | default(lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ')),
          'source': 'inventory',
          'cm_api_available': false,
          'inventory_host_count': deployment_portal_inventory_hosts | default([]) | length,
          'hosts': {},
          'clusters': [],
          'cm_management_service': {},
          'parcels': [],
          'notes': ['Inventory-only snapshot (no CM API from deployment portal playbook).'],
          'poll': _portal_live_poll_meta,
        }
      }}

- name: Merge live stats into deployment portal context
  ansible.builtin.set_fact:
    deployment_portal_context: >-
      {{
        deployment_portal_context | combine(
          {'live_stats': deployment_portal_live_stats | default({})},
          recursive=True
        )
      }}

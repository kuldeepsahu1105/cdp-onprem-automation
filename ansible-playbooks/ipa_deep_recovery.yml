### ansible-playbook -i inventory.ini ipa_deep_recovery.yml --limit ipaserver
# Optional verbose detect / recover / sanitize before re-running playbook 12.
# Not run by Jenkins IDENTITY by default (avoids ~100 skipped import_tasks in playbook 12 logs).
# Set ipa_server_deep_recovery: true or pass -e ipa_server_deep_recovery=true
---
- import_playbook: ensure_collections.yml

- name: Skip when Active Directory is detected
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Skip deep recovery for ad
      ansible.builtin.import_role:
        name: identity
        tasks_from: skip_deep_recovery_for_ad

- name: FreeIPA server deep recovery (detect / recover / sanitize)
  hosts: ipaserver
  become: yes
  vars_files:
    - group_vars/all.yml

  tasks:
    - name: Freeipa deep recovery
      ansible.builtin.import_role:
        name: identity
        tasks_from: freeipa_deep_recovery

### ansible-playbook -i inventory.ini 36_install_ipaserver_ec2_startstop.yml
# Deploy EC2 start/stop/describe helper on ipaserver (IAM role on instance performs API calls).
# Script path: {{ ec2_startstop_script_path }} ({prefix}_cldr_ec2_strt_stp.sh from deployment_name_prefix / ec2_startstop_script_name_prefix).
---
- import_playbook: 00_ensure_collections.yml

- name: Skip when no ipaserver in inventory
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: End play when ipaserver group is empty
      ansible.builtin.meta: end_play
      when: groups['ipaserver'] | default([]) | length == 0

- name: Install EC2 start/stop automation on ipaserver
  hosts: ipaserver
  become: true
  vars_files:
    - group_vars/all.yml
  vars:
    ec2_startstop_default_environment: "{{ deployment_name_prefix | default('', true) | trim }}"
  tasks:
    - name: Install AWS CLI (EC2 start/stop/describe)
      ansible.builtin.package:
        name: "{{ ec2_startstop_awscli_package }}"
        state: present
      vars:
        ec2_startstop_awscli_package: "{{ 'awscli' if ansible_os_family == 'RedHat' else 'awscli' }}"

    - name: Render EC2 start/stop example lines for this inventory
      ansible.builtin.set_fact:
        ec2_startstop_rendered: >-
          {{
            lookup('template', 'ec2_startstop_portal_facts.j2') | from_yaml | default({}, true)
          }}

    - name: Deploy EC2 start/stop script on ipaserver
      ansible.builtin.template:
        src: templates/cldr_ec2_strt_stp.sh.j2
        dest: "{{ ec2_startstop_script_path }}"
        owner: root
        group: root
        mode: "0755"

    - name: Symlink EC2 start/stop script into PATH
      ansible.builtin.file:
        src: "{{ ec2_startstop_script_path }}"
        dest: "/usr/local/bin/{{ ec2_startstop_script_basename }}"
        state: link
        force: true

    - name: Show script path
      ansible.builtin.debug:
        msg: "EC2 start/stop script installed at {{ ec2_startstop_script_path }}"

    - name: Show example EC2 start/stop commands for this deployment
      ansible.builtin.debug:
        msg:
          - "Generic: {{ ec2_startstop_rendered.usage_generic | default('') }}"
          - "Example: {{ ec2_startstop_rendered.example_start | default('') }}"

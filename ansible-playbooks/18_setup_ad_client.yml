### ansible-playbook -i inventory.ini 18_setup_ad_client.yml
#
# Active Directory realm join only (use 16_setup_identity_client.yml for auto-detect)
---
- import_playbook: ensure_collections.yml

- name: Detect and validate Active Directory configuration
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Require Active Directory mode
      ansible.builtin.assert:
        that:
          - identity_provider_effective == 'ad'
          - ad_domain | length > 0
          - ad_kdc_host | length > 0
          - ad_join_user | length > 0
          - ad_join_password | length > 0
        fail_msg: >-
          Active Directory not detected. Leave [ipaserver] empty in inventory
          and set ad_domain, ad_kdc_host, ad_join_user, ad_join_password.

- name: Install Active Directory client packages before DNS cutover
  hosts: "{{ identity_client_hosts }}"
  become: true
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: Install packages required by Active Directory
      ansible.builtin.import_tasks: common_tasks/install_identity_client_packages.yml

- name: Update DNS for Active Directory
  hosts: all
  become: yes
  tasks:
    - name: Configure DNS
      ansible.builtin.import_tasks: common_tasks/configure_resolv_conf.yml

    - name: Verify identity and external DNS after resolver cutover
      ansible.builtin.import_tasks: common_tasks/verify_identity_dns.yml

- name: Join cluster hosts to Active Directory realm
  hosts: "{{ identity_client_hosts }}"
  become: yes
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: Join Active Directory realm
      ansible.builtin.import_tasks: common_tasks/join_ad_realm.yml

    - name: Restore managed resolver configuration after Active Directory enrollment
      ansible.builtin.import_tasks: common_tasks/configure_resolv_conf.yml

    - name: Verify resolver configuration after Active Directory enrollment
      ansible.builtin.import_tasks: common_tasks/verify_identity_dns.yml

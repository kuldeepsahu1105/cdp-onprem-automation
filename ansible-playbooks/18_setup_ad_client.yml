### ansible-playbook -i inventory.ini 18_setup_ad_client.yml
#
# Active Directory realm join only (use 16_setup_identity_client.yml for auto-detect)
---
- import_playbook: ensure_collections.yml

- name: Detect and validate Active Directory configuration
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Require ad mode
      ansible.builtin.import_role:
        name: identity
        tasks_from: require_ad_mode

- name: Install Active Directory client packages before DNS cutover
  hosts: "{{ identity_client_hosts }}"
  become: true
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: Ad client packages
      ansible.builtin.import_role:
        name: identity
        tasks_from: ad_client_packages

- name: Update DNS for Active Directory
  hosts: all
  become: yes
  tasks:
    - name: Ad dns cutover
      ansible.builtin.import_role:
        name: identity
        tasks_from: ad_dns_cutover

- name: Join cluster hosts to Active Directory realm
  hosts: "{{ identity_client_hosts }}"
  become: yes
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: Ad client enrollment
      ansible.builtin.import_role:
        name: identity
        tasks_from: ad_client_enrollment

### ansible-playbook -i inventory.ini 28_setup_cm_cms.yml
#
# Enable Cloudera Management Service (CMS) on the CM host.
# CMS includes: Service Monitor, Host Monitor, Event Server, Alert Publisher,
# Reports Manager — this is NOT the CDP base cluster (HDFS/YARN/ZK).
# For base cluster install use 31_setup_base_cluster.yml
---
- import_playbook: ensure_collections.yml

- name: Enable Cloudera Management Service (CMS)
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: CM API — set connection context (once per play)
      ansible.builtin.import_tasks: common_tasks/resolve_cm_api_probe_context.yml

    - name: Capture Auto-TLS setup intent from inventory (before HTTPS probes may set autotls_enabled)
      ansible.builtin.set_fact:
        cm_autotls_setup_intent: "{{ autotls_enabled | default(true) | bool }}"

    - name: CMS — prepare Cloudera Manager API
      ansible.builtin.import_tasks: common_tasks/prepare_cm_security_api.yml

    - name: CM API — read TLS / Auto-TLS state for CMS messaging
      ansible.builtin.import_tasks: common_tasks/fetch_cm_autotls_api_state.yml

    - name: CMS — read existing management service
      ansible.builtin.uri:
        url: "{{ cm_krb_api_url }}/cm/service"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200, 404]
        follow_redirects: none
      delegate_to: "{{ cm_api_uri_delegate_to }}"
      register: cms_fast_path_service
      changed_when: false
      failed_when: false

    - name: CMS — read existing management roles
      ansible.builtin.uri:
        url: "{{ cm_krb_api_url }}/cm/service/roles"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
        follow_redirects: none
      delegate_to: "{{ cm_api_uri_delegate_to }}"
      register: cms_fast_path_roles
      changed_when: false
      when: cms_fast_path_service.status | default(0) == 200

    - name: CMS — detect healthy existing management service
      ansible.builtin.set_fact:
        cm_cms_noop_this_run: >-
          {{
            cms_fast_path_service.status | default(0) == 200
            and cms_fast_path_service.json.serviceState | default('') == 'STARTED'
            and cms_fast_path_service.json.healthSummary | default('') == 'GOOD'
            and (
              cms_fast_path_roles.json['items'] | default([])
              | selectattr('type', 'in', cm_cms_role_types)
              | list
              | length
            ) == (cm_cms_role_types | length)
            and (
              cms_fast_path_roles.json['items'] | default([])
              | selectattr('type', 'in', cm_cms_role_types)
              | rejectattr('roleState', 'equalto', 'STARTED')
              | list
              | length
            ) == 0
            and (
              cms_fast_path_roles.json['items'] | default([])
              | selectattr('type', 'in', cm_cms_role_types)
              | rejectattr('healthSummary', 'equalto', 'GOOD')
              | list
              | length
            ) == 0
          }}

    - name: CMS — report healthy existing service
      ansible.builtin.debug:
        msg: >-
          Cloudera Management Service and all requested roles are already STARTED and GOOD;
          skipping database reconciliation, role configuration, restart, and health waits.
      when: cm_cms_noop_this_run | bool

    - name: CMS — print existing Cloudera Manager access URLs
      ansible.builtin.import_tasks: common_tasks/print_cm_urls.yml
      when: cm_cms_noop_this_run | bool

    - name: CMS — finish healthy no-op play
      ansible.builtin.meta: end_play
      when: cm_cms_noop_this_run | bool

    - name: CMS — wait for PostgreSQL FQDN resolution on the CM host
      ansible.builtin.command:
        argv:
          - getent
          - ahostsv4
          - "{{ cm_cms_reports_manager_db_host }}"
      delegate_to: "{{ cm_manager_inventory_host }}"
      become: false
      register: cms_postgres_dns_lookup
      changed_when: false
      retries: "{{ identity_dns_verify_retries | default(12) | int }}"
      delay: "{{ identity_dns_verify_delay | default(5) | int }}"
      until: cms_postgres_dns_lookup.rc == 0

    - name: Print CMS target host
      ansible.builtin.debug:
        msg:
          - "CMS roles host: {{ cm_cms_hostname }}"
          - "Postgres (Reports Manager DB) host: {{ cm_cms_reports_manager_db_host }} (inventory: {{ cm_postgres_inventory_host }})"
          - "CMS role types: {{ cm_cms_role_types | join(', ') }}"
          - "Prerequisite: run 27_setup_cm_autotls.yml before CMS only when CM Auto-TLS is enabled (MGMT ssl_client_truststore_*); manual HTTPS :7183 skips agent truststore automation"

    - name: Configure and start Cloudera Management Service (REST API)
      ansible.builtin.import_tasks: common_tasks/configure_cm_cms_api.yml

    - name: Apply optional CM host tags from inventory (role, env, owner)
      ansible.builtin.import_tasks: common_tasks/apply_cm_host_tags.yml

    - name: Verify CM host agent heartbeats are fresh
      ansible.builtin.import_tasks: common_tasks/verify_cm_host_heartbeats.yml
      when: cm_host_heartbeat_verify_after_cms | default(true) | bool

    - name: Print CMS configuration result
      ansible.builtin.debug:
        msg: "Cloudera Management Service state: {{ cms_result.service_state | default('started') }}"

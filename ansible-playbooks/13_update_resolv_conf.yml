### ansible-playbook -i inventory.ini 13_update_resolv_conf.yml
# vars:
#   ipaserver_domain: cldr.internal.arpa

---
- import_playbook: ensure_collections.yml

- name: Generate and configure /etc/resolv.conf file based on existing values
  hosts: all
  become: yes
  vars:
    ipa_domain: "{{ ipaserver_domain | default('cldr.internal.arpa') }}"

  tasks:
    - name: Configure identity dns
      ansible.builtin.import_role:
        name: identity
        tasks_from: configure_identity_dns

### ansible-playbook -i inventory.ini 13_update_resolv_conf.yml
# vars:
#   ipaserver_domain: cldrsetup.local

---
- import_playbook: ensure_collections.yml

- name: Generate and configure /etc/resolv.conf file based on existing values
  hosts: all
  become: yes
  vars:
    ipa_domain: "{{ ipaserver_domain | default('cldrsetup.local') }}"

  tasks:
    - name: Configure resolv.conf for identity provider
      ansible.builtin.import_tasks: common_tasks/configure_resolv_conf.yml

    - name: Verify identity and external DNS after resolver cutover
      ansible.builtin.import_tasks: common_tasks/verify_identity_dns.yml

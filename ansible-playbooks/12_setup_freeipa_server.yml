### ansible-playbook -i inventory.ini 12_setup_freeipa_server.yml
# vars:
#   ipaserver_domain: cldrsetup.local
#   ipaserver_realm: "{{ ipaserver_domain | upper }}"
#   ipaadmin_principal: "admin"
#   ipaadmin_password: "vmware123"
#   ipadm_password: "{{ ipaadmin_password }}"
#   ipaserver_setup_dns: yes
#   dns_forwarders: "no"
#   reverse_zones: "no"
#   chrony_enabled: "yes"
---
- import_playbook: 00_ensure_collections.yml

- name: Skip FreeIPA server setup when Active Directory is detected
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: End playbook for Active Directory deployments
      ansible.builtin.meta: end_play
      when: identity_provider_effective == 'ad'

- name: Install and Configure FreeIPA Server
  hosts: ipaserver
  become: yes
  vars_files:
    - group_vars/all.yml

  tasks:
    - name: Print variables passed to the playbook
      debug:
        msg: >-
          hostname: "{{ ansible_fqdn }}"
          ipaadmin_password: "{{ ipaadmin_password }}"
          ipaserver_domain: "{{ ipaserver_domain }}"
          ipaserver_realm: "{{ ipaserver_realm }}"
          ipaserver_setup_dns: "{{ ipaserver_setup_dns }}"

    - name: Install required packages
      ansible.builtin.package:
        name: "{{ os_vars[ansible_os_family].freeipa_server_packages }}"
        state: present

    # - name: Set Java alternatives (if required)
    #   command: update-alternatives --config java
    #   register: java_result
    #   changed_when: "'selection' in java_result.stdout"

    - name: Extract NetBIOS name from realm
      set_fact:
        netbios_name: "{{ ipaserver_realm.split('.')[0] }}"

    - name: Display derived NetBIOS name (for verification)
      debug:
        msg: "Derived NetBIOS Name: {{ netbios_name }}"

    - name: Resolve deployment DNS facts for IPA install
      ansible.builtin.import_tasks: common_tasks/set_dns_facts.yml

    - name: Check if IPA server package is installed
      command: ipa-server-install --version
      register: ipa_check
      ignore_errors: true
      changed_when: false

    - name: Display IPA installation status
      debug:
        msg: "IPA Server package is installed with version: {{ ipa_check.stdout }}"
      when: ipa_check.rc == 0

    - name: Detect FreeIPA server install state (configured / partial / clean)
      ansible.builtin.import_tasks: common_tasks/detect_ipa_server_install_state.yml

    - name: Recover partial FreeIPA install (unattended uninstall before fresh install)
      ansible.builtin.import_tasks: common_tasks/recover_ipa_server_install.yml
      when: ipa_server_has_partial_state | bool

    - name: Recover partial FreeIPA install — mark recovery attempted
      ansible.builtin.set_fact:
        ipa_recovery_ran: true
      when: ipa_server_has_partial_state | bool

    - name: Re-detect FreeIPA state after unattended uninstall recovery
      ansible.builtin.import_tasks: common_tasks/detect_ipa_server_install_state.yml
      when: ipa_recovery_ran | default(false) | bool

    - name: Refuse ipa-server-install when critical debris remains after recovery
      ansible.builtin.fail:
        msg: >-
          FreeIPA on {{ inventory_hostname }} still has partial install debris after
          ipa-server-install --uninstall --unattended and automated path cleanup.
          Inspect /var/log/ipaserver-uninstall.log on the host.
          Manual recovery (as root): ipa-server-install --uninstall --unattended
          (add --force on RHEL if prompted), then as root: rm -rf /var/lib/ipa /etc/ipa and remove /etc/dirsrv/slapd-* if needed.
          Re-run: ansible-playbook -i inventory.ini 12_setup_freeipa_server.yml --limit {{ inventory_hostname }}
          See ansible-playbooks/docs/RUNBOOK.md (FreeIPA partial install).
      when: ipa_server_has_partial_state | default(false) | bool

    - name: Note fresh host — no FreeIPA configuration detected
      ansible.builtin.debug:
        msg: >-
          No FreeIPA server configuration found (no /etc/ipa/default.conf). Will run ipa-server-install on a clean host.
      when: ipa_server_install_clean_host | bool

    - name: Note stale default.conf removed — will run ipa-server-install
      ansible.builtin.debug:
        msg: >-
          ipactl reported IPA is not configured; removed stale /etc/ipa/default.conf if present.
          Running ipa-server-install on this host.
      when:
        - ipa_detect_ipactl_not_configured | default(false) | bool
        - ipa_server_install_clean_host | bool

    - name: Sanitize broken /var/lib/ipa and /etc/ipa before fresh ipa-server-install
      ansible.builtin.import_tasks: common_tasks/sanitize_ipa_paths_before_fresh_install.yml
      when:
        - not (ipa_server_has_default_conf | bool)
        - ipa_detect_ipactl_not_configured | default(false) | bool

    - name: IPA install gate — check default.conf after recovery/sanitize
      ansible.builtin.stat:
        path: /etc/ipa/default.conf
      register: ipa_install_gate_default_conf

    - name: IPA install gate — ipactl status (original 10_setup_freeipa_server.yml gate)
      ansible.builtin.command: ipactl status
      register: ipa_install_gate_ipactl
      changed_when: false
      failed_when: false

    - name: IPA install gate — run ipa-server-install when ipactl unhealthy or no default.conf
      ansible.builtin.set_fact:
        ipa_server_should_run_install: >-
          {{
            (ipa_install_gate_ipactl.rc | default(1) | int) != 0
            or not (ipa_install_gate_default_conf.stat.exists | default(false) | bool)
          }}

    - name: IPA install gate — summarize install decision
      ansible.builtin.debug:
        msg:
          - >-
            ipa-server-install will run: {{ ipa_server_should_run_install | bool }}
            (original gate: ipactl rc != 0 or missing /etc/ipa/default.conf).
          - "ipactl rc={{ ipa_install_gate_ipactl.rc | default('n/a') }}; default.conf present={{ ipa_install_gate_default_conf.stat.exists | default(false) }}"
          - "detect facts: has_default_conf={{ ipa_server_has_default_conf | default(false) }}, ipactl_not_configured={{ ipa_detect_ipactl_not_configured | default(false) }}, partial_debris={{ ipa_server_has_partial_state | default(false) }}"
          - >-
            DNS install forwarders: {{
              'VPC ' ~ effective_vpc_dns_resolver
              if (
                (dns_forwarders | default('no') | lower) in ['aws', 'vpc']
                and effective_vpc_dns_resolver | default('') | length > 0
              )
              else ('custom ' ~ dns_forwarders if dns_forwarders | default('') | length > 0 and (dns_forwarders | lower) != 'no' else '--no-forwarders')
            }}

    - name: Preflight hostname/DNS and dig before fresh ipa-server-install
      ansible.builtin.import_tasks: common_tasks/preflight_ipa_server_install.yml
      when: ipa_server_should_run_install | bool

    - name: Run IPA server installation
      ansible.builtin.command: >
        ipa-server-install --setup-dns --unattended
        --hostname={{ ansible_fqdn }}
        --ip-address={{ ansible_default_ipv4.address }}
        --domain={{ ipaserver_domain }}
        --realm={{ ipaserver_realm }}
        --ds-password={{ ipadm_password }}
        --admin-password={{ ipaadmin_password }}
        --no-dnssec-validation
        --netbios-name={{ netbios_name }}
        {% if (dns_forwarders | default('no') | lower) in ['aws', 'vpc'] and effective_vpc_dns_resolver | default('') | length > 0 %}
        --forwarder={{ effective_vpc_dns_resolver }}
        {% elif (dns_forwarders | default('no') | lower) == 'no' %} --no-forwarders {% elif dns_forwarders | default('') | length > 0 %} --forwarder={{ dns_forwarders }} {% endif %}
        {% if reverse_zones == 'no' %} --no-reverse {% endif %}
        {% if chrony_enabled == 'yes' %} --ntp-server=pool.ntp.org {% endif %}
      register: ipa_install_result
      changed_when: "'The ipa-server-install command was successful' in ipa_install_result.stderr"
      failed_when: false
      no_log: true
      when: ipa_server_should_run_install | bool

    - name: Capture tail of ipaserver-install.log when install failed
      ansible.builtin.shell: tail -n 50 /var/log/ipaserver-install.log 2>/dev/null || true
      register: ipa_install_log_tail
      changed_when: false
      no_log: true
      when:
        - ipa_server_should_run_install | bool
        - ipa_install_result is defined
        - ipa_install_result.rc | default(0) != 0

    - name: Fail with ipa-server-install diagnostics
      ansible.builtin.fail:
        msg: >-
          ipa-server-install failed on {{ inventory_hostname }} (rc={{ ipa_install_result.rc }}).
          stderr (truncated): {{ ipa_install_result.stderr | default('') | truncate(1500, True) }}
          Last 50 lines of /var/log/ipaserver-install.log:
          {{ ipa_install_log_tail.stdout | default('(log missing or empty)') }}
      when:
        - ipa_server_should_run_install | bool
        - ipa_install_result is defined
        - ipa_install_result.rc | default(0) != 0

    - name: Ensure FreeIPA KDC and IPA services are running
      ansible.builtin.import_tasks: common_tasks/ensure_ipa_kdc_services.yml
      vars:
        ipa_kdc_skip_start_after_install: "{{ ipa_install_result is changed | default(false) }}"

    - name: Configure FreeIPA KDC encryption types (AES)
      ansible.builtin.import_tasks: common_tasks/configure_ipa_krb_enc_types.yml

    - name: Print IPA server installation output
      ansible.builtin.debug:
        msg: "{{ ipa_install_result.stderr_lines }}"
      when: ipa_install_result is changed

    - name: Validate IPA Services
      command: ipactl status
      register: ipa_status
      changed_when: false
      failed_when: "'The ipactl command was successful' not in ipa_status.stderr"

    - name: Ensure Kerberos Ticket is Present
      shell: echo "{{ ipaadmin_password }}" | kinit {{ ipaadmin_principal }}
      register: kinit_result
      changed_when: false
      failed_when: kinit_result.rc != 0

    - name: Ensure IPA DNS forwards to VPC resolver on AWS (existing installs)
      ansible.builtin.command: >
        ipa dnsconfig-mod --forwarder={{ effective_vpc_dns_resolver }} --forward-policy=first
      register: ipa_vpc_forwarder
      changed_when: ipa_vpc_forwarder.rc == 0
      failed_when: false
      when:
        - (dns_forwarders | default('no') | lower) in ['aws', 'vpc']
        - effective_deployment_env | default('') == 'aws'
        - effective_vpc_dns_resolver | default('') | length > 0
        - not (ipa_server_should_run_install | default(false) | bool)

    - name: Print Current Kerberos Ticket
      command: klist -e
      register: kerberos_ticket
      changed_when: false

    - name: Debug Kerberos Ticket Details
      debug:
        msg: "{{ kerberos_ticket.stdout.replace('\t', '    ').split('\n') }}"

### ansible-playbook -i inventory.ini 12_setup_freeipa_server.yml
# vars:
#   ipaserver_domain: cldrsetup.local
#   ipaserver_realm: "{{ ipaserver_domain | upper }}"
#   ipaadmin_principal: "admin"
#   ipaadmin_password: "vmware123"
#   ipadm_password: "{{ ipaadmin_password }}"
#   ipaserver_setup_dns: yes
#   dns_forwarders: "no"   # AWS: VPC forwarder; bare metal: --no-forwarders (see resolve_ipa_install_dns_forwarders.yml)
#   reverse_zones: "no"
#   chrony_enabled: "yes"
---
- import_playbook: ensure_collections.yml

- name: Skip FreeIPA server setup when Active Directory is detected
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Skip freeipa server for ad
      ansible.builtin.import_role:
        name: identity
        tasks_from: skip_freeipa_server_for_ad

- name: Install and Configure FreeIPA Server
  hosts: ipaserver
  become: yes
  vars_files:
    - group_vars/all.yml

  tasks:
    - name: Freeipa server
      ansible.builtin.import_role:
        name: identity
        tasks_from: freeipa_server

### ansible-playbook -i inventory.ini 12_setup_freeipa_server.yml
# vars:
#   ipaserver_domain: cldrsetup.local
#   ipaserver_realm: "{{ ipaserver_domain | upper }}"
#   ipaadmin_principal: "admin"
#   ipaadmin_password: "vmware123"
#   ipadm_password: "{{ ipaadmin_password }}"
#   ipaserver_setup_dns: yes
#   dns_forwarders: "no"   # AWS: VPC forwarder; bare metal: --no-forwarders (see resolve_ipa_install_dns_forwarders.yml)
#   reverse_zones: "no"
#   chrony_enabled: "yes"
---
- import_playbook: 00_ensure_collections.yml

- name: Skip FreeIPA server setup when Active Directory is detected
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: End playbook for Active Directory deployments
      ansible.builtin.meta: end_play
      when: identity_provider_effective == 'ad'

- name: Install and Configure FreeIPA Server
  hosts: ipaserver
  become: yes
  vars_files:
    - group_vars/all.yml

  tasks:
    - name: Install required packages
      ansible.builtin.package:
        name: "{{ os_vars[ansible_os_family].freeipa_server_packages }}"
        state: present

    - name: Install DNS lookup tools required by ipa-server-install (dig)
      ansible.builtin.package:
        name: "{{ os_vars[ansible_os_family].ipa_install_dns_packages }}"
        state: present

    - name: Extract NetBIOS name from realm
      ansible.builtin.set_fact:
        netbios_name: "{{ ipaserver_realm.split('.')[0] }}"

    - name: Resolve deployment DNS facts for IPA install
      ansible.builtin.import_tasks: common_tasks/set_dns_facts.yml

    - name: Resolve ipa-server-install DNS forwarder flags
      ansible.builtin.import_tasks: common_tasks/resolve_ipa_install_dns_forwarders.yml

    - name: Check ipa-server-install package version (installer RPM only, not configured state)
      ansible.builtin.command: ipa-server-install --version
      register: ipa_server_install_pkg_version
      failed_when: false
      changed_when: false

    - name: Check IPA CLI version (installed)
      ansible.builtin.command: ipa --version
      register: ipa_cli_version
      failed_when: false
      changed_when: false

    - name: Check ipactl status
      ansible.builtin.command: ipactl status
      register: ipa_server_status
      failed_when: false
      changed_when: false

    - name: Check default.conf
      ansible.builtin.stat:
        path: /etc/ipa/default.conf
      register: ipa_default_conf

    - name: Derive IPA install gate from ipa CLI, ipactl, and default.conf
      ansible.builtin.set_fact:
        ipa_server_install_version_text: >-
          {{
            ipa_server_install_pkg_version.stdout | default('')
            | trim
            or ipa_server_install_pkg_version.stderr | default('') | trim
          }}
        ipa_cli_version_text: >-
          {{
            (ipa_cli_version.stdout | default(''))
            ~ (ipa_cli_version.stderr | default(''))
          }}
        ipa_cli_not_configured: >-
          {{
            ipa_cli_version_text is search('not configured', ignorecase=True)
          }}
        ipa_ipactl_status_text: >-
          {{
            (ipa_server_status.stdout | default(''))
            ~ (ipa_server_status.stderr | default(''))
          }}
        ipa_ipactl_not_configured: >-
          {{
            ipa_ipactl_status_text is search('IPA is not configured', ignorecase=True)
          }}
        ipa_cli_version_ok: >-
          {{
            (ipa_cli_version.rc | default(1) | int) == 0
            and not (ipa_cli_not_configured | bool)
          }}
        ipa_server_default_conf_present: >-
          {{
            ipa_default_conf.stat.exists | default(false) | bool
          }}
        ipa_ipactl_healthy: >-
          {{
            (ipa_server_status.rc | default(1) | int) == 0
            and not (
              ipa_ipactl_status_text is search('IPA is not configured', ignorecase=True)
            )
          }}
        ipa_server_configured_healthy: >-
          {{
            (ipa_cli_version_ok | bool)
            and (ipa_server_default_conf_present | bool)
            and (ipa_ipactl_healthy | bool)
          }}

    - name: IPA install gate — run install unless ipa --version, ipactl, and default.conf all healthy (or force)
      ansible.builtin.set_fact:
        ipa_server_should_run_install: >-
          {{
            (ipa_server_install_force | default(false) | bool)
            or not (ipa_server_configured_healthy | bool)
          }}
        ipa_server_install_gate_reason: >-
          {% if ipa_server_install_force | default(false) | bool -%}
          ipa_server_install_force=true (re-run install even when healthy; rare)
          {%- elif ipa_server_configured_healthy | bool -%}
          IPA configured and healthy (ipa --version, default.conf, ipactl)
          {%- elif not (ipa_cli_version_ok | bool) -%}
          ipa --version rc={{ ipa_cli_version.rc | default('n/a') }}{% if ipa_cli_not_configured | bool %} (IPA not configured){% endif %}
          {%- elif not (ipa_server_default_conf_present | bool) -%}
          missing /etc/ipa/default.conf
          {%- elif ipa_ipactl_not_configured | bool -%}
          ipactl reports IPA is not configured
          {%- elif (ipa_server_status.rc | default(1) | int) != 0 -%}
          ipactl status rc={{ ipa_server_status.rc | default('n/a') }} (expected 0)
          {%- else -%}
          IPA not healthy (install required)
          {%- endif %}

    - name: Remove stale default.conf when ipactl reports not configured
      ansible.builtin.file:
        path: /etc/ipa/default.conf
        state: absent
      when:
        - ipa_ipactl_not_configured | bool
        - ipa_default_conf.stat.exists | default(false) | bool

    - name: Summarize IPA install gate (ipa CLI, ipactl, default.conf, DNS forwarder mode)
      ansible.builtin.debug:
        msg: >-
          IPA install will run: {{ ipa_server_should_run_install | bool }}
          ({{ ipa_server_install_gate_reason | trim }}).
          Gate uses ipa --version rc={{ ipa_cli_version.rc | default('n/a') }}
          "{{ ipa_cli_version_text | default('') | trim }}" (installed/working CLI; not installer RPM).
          default.conf present={{ ipa_server_default_conf_present | bool }},
          ipactl rc={{ ipa_server_status.rc | default('n/a') }},
          configured_healthy={{ ipa_server_configured_healthy | bool }}.
          Debug: ipa-server-install --version rc={{ ipa_server_install_pkg_version.rc | default('n/a') }}
          "{{ ipa_server_install_version_text | default('') }}" (installer package only).
          DNS install mode: {{
            'VPC --forwarder=' ~ effective_vpc_dns_resolver
            if (ipa_install_dns_use_vpc_forwarder | default(false) | bool)
            else '--no-forwarders'
            if (ipa_install_dns_no_forwarders | default(false) | bool)
            else (
              'custom --forwarder=' ~ ipa_install_dns_custom_forwarder
              if (ipa_install_dns_custom_forwarder | default('') | length > 0)
              else '--no-forwarders (fallback)'
            )
          }} (from resolve_ipa_install_dns_forwarders.yml).

    - name: Preflight hostname/DNS and tooling before fresh ipa-server-install
      ansible.builtin.import_tasks: common_tasks/preflight_ipa_server_install.yml
      when: ipa_server_should_run_install | bool

    - name: Assert AWS VPC DNS forwarder is resolved before ipa-server-install
      ansible.builtin.assert:
        that:
          - effective_vpc_dns_resolver | default('') | length > 0
        fail_msg: >-
          ipa_server_install_use_vpc_dns_forwarder is true on AWS but effective_vpc_dns_resolver is empty.
          Check set_dns_facts (EC2 metadata, host private IP) or set aws_vpc_dns_resolver in group vars.
      when:
        - ipa_server_should_run_install | bool
        - ipa_install_dns_use_vpc_forwarder | default(false) | bool

    - name: Run IPA server installation
      ansible.builtin.shell: |
        set -euo pipefail
        exec ipa-server-install --setup-dns --unattended \
          --hostname="{{ ansible_fqdn }}" \
          --ip-address="{{ ansible_default_ipv4.address }}" \
          --domain="{{ ipaserver_domain }}" \
          --realm="{{ ipaserver_realm }}" \
          --ds-password="${IPA_DS_PASSWORD}" \
          --admin-password="${IPA_ADMIN_PASSWORD}" \
          --no-dnssec-validation \
          --netbios-name="{{ netbios_name }}" \
          {% if ipa_install_dns_use_vpc_forwarder | default(false) | bool %}
          --forwarder="{{ effective_vpc_dns_resolver }}" \
          {% elif ipa_install_dns_no_forwarders | default(false) | bool %}
          --no-forwarders \
          {% elif ipa_install_dns_custom_forwarder | default('') | length > 0 %}
          --forwarder="{{ ipa_install_dns_custom_forwarder }}" \
          {% else %}
          --no-forwarders \
          {% endif %}
          {% if reverse_zones == 'no' %}--no-reverse \
          {% endif %}{% if chrony_enabled == 'yes' %}--ntp-server=pool.ntp.org \
          {% endif %}
      environment:
        IPA_DS_PASSWORD: "{{ ipadm_password }}"
        IPA_ADMIN_PASSWORD: "{{ ipaadmin_password }}"
      args:
        executable: /bin/bash
      register: ipa_install_result
      changed_when: "'The ipa-server-install command was successful' in (ipa_install_result.stderr | default(''))"
      failed_when: false
      when: ipa_server_should_run_install | bool

    - name: Capture tail of ipaserver-install.log when install failed
      ansible.builtin.shell: tail -n 50 /var/log/ipaserver-install.log 2>/dev/null || true
      register: ipa_install_log_tail
      changed_when: false
      when:
        - ipa_server_should_run_install | bool
        - ipa_install_result is defined
        - ipa_install_result.rc | default(0) != 0

    - name: Fail with ipa-server-install diagnostics
      ansible.builtin.fail:
        msg: >-
          ipa-server-install failed on {{ inventory_hostname }} (rc={{ ipa_install_result.rc }}).
          stderr (truncated): {{
            ipa_install_result.stderr | default('')
            | replace(ipaadmin_password, '***')
            | replace(ipadm_password, '***')
            | truncate(1500, True)
          }}
          Last 50 lines of /var/log/ipaserver-install.log:
          {{ ipa_install_log_tail.stdout | default('(log missing or empty)') }}
          If the log shows FileNotFoundError [Errno 2] in install_check/ipachangeconf/newConf,
          remove partial state (rm -rf /var/lib/ipa /etc/ipa /etc/dirsrv/slapd-* when ipactl is not configured),
          ensure bind-utils (host/dig), 389-ds-base, and openldap are installed, and use real passwords
          (ipaadmin_password / ipadm_password — not YOUR_DS_PASSWORD placeholders).
          On AWS, if DNS used --no-forwarders unexpectedly, check effective_vpc_dns_resolver from set_dns_facts
          and ipa_server_install_use_vpc_dns_forwarder / dns_forwarders in group vars.
          See ansible-playbooks/docs/RUNBOOK.md troubleshooting diagnostic bundle.
      when:
        - ipa_server_should_run_install | bool
        - ipa_install_result is defined
        - ipa_install_result.rc | default(0) != 0

    - name: Validate IPA Services
      ansible.builtin.command: ipactl status
      register: ipa_status
      changed_when: false
      failed_when: "'The ipactl command was successful' not in ipa_status.stderr"

    - name: Ensure FreeIPA KDC and IPA services are running
      ansible.builtin.import_tasks: common_tasks/ensure_ipa_kdc_services.yml
      vars:
        ipa_kdc_skip_start_after_install: "{{ ipa_install_result is changed | default(false) }}"

    - name: Configure FreeIPA KDC encryption types (AES)
      ansible.builtin.import_tasks: common_tasks/configure_ipa_krb_enc_types.yml

    - name: Ensure Kerberos Ticket is Present
      ansible.builtin.shell: echo "{{ ipaadmin_password }}" | kinit {{ ipaadmin_principal }}
      register: kinit_result
      changed_when: false
      failed_when: kinit_result.rc != 0

    - name: Ensure IPA DNS forwards to VPC resolver on AWS (existing installs)
      ansible.builtin.command: >
        ipa dnsconfig-mod --forwarder={{ effective_vpc_dns_resolver }} --forward-policy=first
      register: ipa_vpc_forwarder
      changed_when: ipa_vpc_forwarder.rc == 0
      failed_when: false
      when:
        - ipa_install_dns_use_vpc_forwarder | default(false) | bool
        - not (ipa_server_should_run_install | default(false) | bool)

### ansible-playbook -i inventory.ini 00_setup_ssh_preqs.yml
# for file in [0-9]*_*; do mv "$file" "$((10#${file%%_*} + 1))_${file#*_}"; done
---
- import_playbook: ensure_collections.yml

- name: Validate SSH reachability before connecting to any inventory host
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Validate SSH reachability of all inventory hosts before this run's first connection
      ansible.builtin.import_role:
        name: prereq_ssh
        tasks_from: validate_reachability

- name: Ensure SSH allows password authentication and root login
  hosts: all:!ipaserver
  become: yes
  roles:
    - role: prereq_ssh

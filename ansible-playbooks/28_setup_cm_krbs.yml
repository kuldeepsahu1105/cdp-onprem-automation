### ansible-playbook -i inventory.ini 28_setup_cm_krbs.yml
# Run after 27_setup_cm_autotls.yml, 29_setup_cm_cms.yml, and 30_setup_cm_ldap.yml (pvc_setup cm_tls phase).
---
- import_playbook: 00_ensure_collections.yml

- name: Ensure FreeIPA KDC services are running before CM Kerberos setup
  hosts: ipaserver
  become: yes
  gather_facts: no
  tasks:
    - name: Skip when identity provider is not FreeIPA
      ansible.builtin.meta: end_host
      when: identity_provider_effective != 'freeipa'

    - name: Ensure IPA KDC services are active
      ansible.builtin.import_tasks: common_tasks/ensure_ipa_kdc_services.yml

    - name: Configure FreeIPA KDC encryption types (AES)
      ansible.builtin.import_tasks: common_tasks/configure_ipa_krb_enc_types.yml

- name: Enable Kerberos (KDC) integration in Cloudera Manager
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Clear CM restart flag for this play
      ansible.builtin.set_fact:
        cm_restart_after_config_change: false

    - name: Set up Cloudera Manager API URL
      ansible.builtin.import_tasks: common_tasks/set_cm_api_url.yml

    - name: Kerberos — resolve HTTPS CM API URL and KDC admin principal
      ansible.builtin.import_tasks: common_tasks/resolve_cm_krb_api_url.yml

    - name: Kerberos — preflight KDC reachability from controller
      ansible.builtin.import_tasks: common_tasks/preflight_kdc_reachable.yml

    - name: Print Kerberos integration targets
      ansible.builtin.debug:
        msg:
          - "Identity provider: {{ identity_provider_effective }}"
          - "CM API (Kerberos REST): {{ cm_krb_api_url }}"
          - "CM host: {{ cm_host }}"
          - "KDC host: {{ kdc_host }}"
          - "Kerberos realm: {{ cluster_realm }}"
          - "KDC type: {{ krb5_kdc_type }}"
          - "KDC admin principal (import): {{ cm_krb_kdc_admin_principal }}"
          - "CM KRB_ENC_TYPES: {{ krb5_enc_types }}"

    - name: Read CM Kerberos enabled state (kerberized)
      ansible.builtin.uri:
        url: "{{ cm_krb_api_url }}/cm/kerberosInfo"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200, 301, 303, 404]
      register: cm_krb_info_initial
      failed_when: false
      changed_when: false

    - name: Determine if Kerberos/KDC is already enabled in Cloudera Manager
      ansible.builtin.set_fact:
        kerberos_already_configured: >-
          {{
            cm_krb_info_initial.json is defined
            and (cm_krb_info_initial.json.kerberized | default(false) | bool)
          }}

    - name: Configure Kerberos via Cloudera Manager REST API
      ansible.builtin.import_tasks: common_tasks/configure_cm_kerberos_api.yml

    - name: Configure Active Directory-specific Kerberos settings
      ansible.builtin.uri:
        url: "{{ cm_krb_api_url | default(cm_api_url) }}/cm/kerberosConfig"
        method: PUT
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        body_format: json
        body:
          items:
            - name: AD_DELETE_ON_REGENERATE
              value: "{{ krb5_ad_delete_on_regenerate | default(true) | lower }}"
            - name: AD_KDC_DOMAIN
              value: "{{ krb5_ad_suffix }}"
        status_code: [200, 204, 301, 303]
      register: cm_kerberos_ad_config
      when:
        - identity_provider_effective == 'ad'
        - not kerberos_already_configured | default(false)
        - cm_kerberos_config_changed | default(false) | bool
      failed_when: false
      changed_when: true

    - name: Kerberos — mark Cloudera Manager restart required after AD CM config
      ansible.builtin.set_fact:
        cm_restart_after_config_change: true
      when:
        - identity_provider_effective == 'ad'
        - not kerberos_already_configured | default(false)
        - cm_kerberos_config_changed | default(false) | bool

    - name: Import KDC admin credentials into Cloudera Manager
      ansible.builtin.uri:
        url: >-
          {{ cm_krb_api_url }}/cm/commands/importAdminCredentials?username={{
          cm_krb_kdc_admin_principal | urlencode }}&password={{
          krb5_kdc_admin_password | urlencode }}
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200, 201, 204, 303]
      register: kdc_import_result
      failed_when: false
      changed_when: false
      when: not kerberos_already_configured | default(false)

    - name: Fail when importAdminCredentials HTTP request failed
      ansible.builtin.fail:
        msg: >-
          importAdminCredentials failed (HTTP {{ kdc_import_result.status | default('n/a') }}).
          CM expects username/password as query parameters on POST {{ cm_krb_api_url }}/cm/commands/importAdminCredentials.
          Principal={{ cm_krb_kdc_admin_principal }}, KDC={{ kdc_host }}, realm={{ cluster_realm }}.
          Response: {{ kdc_import_result.json | default(kdc_import_result.content | default('')) }}.
          Check /var/log/cloudera-scm-server/cloudera-scm-server.log on the CM host (ImportCredentials).
      when:
        - not kerberos_already_configured | default(false)
        - kdc_import_result is defined
        - kdc_import_result.status | default(0) | int not in [200, 201, 204, 303]

    - name: Wait for importAdminCredentials command
      ansible.builtin.import_tasks: common_tasks/wait_cm_api_command.yml
      vars:
        cm_api_command_id: "{{ kdc_import_result.json.id }}"
        cm_api_command_allow_already_exists: true
      when:
        - not kerberos_already_configured | default(false)
        - kdc_import_result.json.id is defined

    - name: Fail when importAdminCredentials did not return a command id (unexpected response)
      ansible.builtin.fail:
        msg: >-
          importAdminCredentials returned HTTP {{ kdc_import_result.status }} but no async command id.
          Response: {{ kdc_import_result.json | default({}) }}.
          Confirm KDC admin password for {{ cm_krb_kdc_admin_principal }} and that SECURITY_REALM/KDC_HOST
          were applied via REST before import (re-run this playbook).
          If credentials were imported manually in the CM UI, restart Cloudera Manager Server and re-run this playbook.
      when:
        - not kerberos_already_configured | default(false)
        - kdc_import_result.status | default(0) | int in [200, 201]
        - kdc_import_result.json.id is not defined

    - name: Kerberos — CM restart required after KDC admin credential import
      ansible.builtin.set_fact:
        cm_restart_after_config_change: true
      when:
        - not kerberos_already_configured | default(false)
        - kdc_import_result.status | default(0) | int in [200, 201, 204, 303]

    - name: Print KDC credential import result
      ansible.builtin.debug:
        msg: >-
          KDC credential import submitted (command id={{ kdc_import_result.json.id | default('n/a') }},
          HTTP {{ kdc_import_result.status | default('skipped') }})
      when: not kerberos_already_configured | default(false)

    - name: Restart Cloudera Manager after Kerberos configuration change
      ansible.builtin.import_tasks: common_tasks/apply_cm_restart_after_config.yml
      when: cm_restart_after_config_change | default(false) | bool

    - name: Print Kerberos configuration result
      ansible.builtin.debug:
        msg: >-
          Kerberos CM config applied (REST).
          kerberized={{ cm_krb_info.json.kerberized | default('unknown') }}
      when:
        - cm_kerberos_api_result is defined
        - cm_kerberos_api_result is changed

    - name: Kerberos already configured (credential import skipped)
      ansible.builtin.debug:
        msg: >-
          Kerberos is already enabled in Cloudera Manager (kerberized=true); skipped KDC credential import.
          CM Kerberos settings (e.g. KRB_ENC_TYPES) were reconciled when drift was detected.
      when: kerberos_already_configured | default(false)

    - name: Verify Cloudera Manager KDC integration is enabled
      ansible.builtin.import_tasks: common_tasks/verify_cm_kerberos_enabled.yml

### ansible-playbook -i inventory.ini 28_setup_cm_krbs.yml
---
- import_playbook: 00_ensure_collections.yml

- name: Enable Kerberos (KDC) integration in Cloudera Manager
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Clear CM restart flag for this play
      ansible.builtin.set_fact:
        cm_restart_after_config_change: false

    - name: Set up Cloudera Manager API URL
      ansible.builtin.import_tasks: common_tasks/set_cm_api_url.yml

    - name: Kerberos — resolve HTTPS CM API URL and KDC admin principal
      ansible.builtin.import_tasks: common_tasks/resolve_cm_krb_api_url.yml

    - name: Print Kerberos integration targets
      ansible.builtin.debug:
        msg:
          - "Identity provider: {{ identity_provider_effective }}"
          - "CM host: {{ cm_host }}"
          - "KDC host: {{ kdc_host }}"
          - "Kerberos realm: {{ cluster_realm }}"
          - "KDC type: {{ krb5_kdc_type }}"

    - name: Check current Kerberos configuration
      ansible.builtin.uri:
        url: "{{ cm_api_url }}/cm/kerberosConfig"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200, 404]
      register: kerberos_config
      failed_when: false

    - name: Determine if Kerberos is already configured
      ansible.builtin.set_fact:
        kerberos_already_configured: >-
          {{
            kerberos_config.json is defined and
            (
              kerberos_config.json['items'] | default([])
              | selectattr('name', 'equalto', 'SECURITY_REALM')
              | map(attribute='value')
              | first
              | default('')
              | length
            ) > 0
          }}

    - name: Import KDC admin credentials into Cloudera Manager
      ansible.builtin.uri:
        url: "{{ cm_krb_api_url }}/cm/commands/importAdminCredentials"
        method: POST
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        body_format: json
        body:
          username: "{{ cm_krb_kdc_admin_principal }}"
          password: "{{ krb5_kdc_admin_password }}"
        status_code: [200, 201, 204, 303, 400]
      register: kdc_import_result
      failed_when: false
      changed_when: false
      when: not kerberos_already_configured | default(false)

    - name: Wait for importAdminCredentials command (when CM returns a command id)
      ansible.builtin.uri:
        url: "{{ cm_krb_api_url }}/commands/{{ kdc_import_result.json.id }}"
        method: GET
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200, 301, 303]
      register: kdc_import_poll
      until: >
        kdc_import_poll.json.active is defined
        and not (kdc_import_poll.json.active | bool)
      retries: 40
      delay: 5
      when:
        - not kerberos_already_configured | default(false)
        - kdc_import_result.json is defined
        - kdc_import_result.json.id is defined

    - name: Accept importAdminCredentials when credentials already exist
      ansible.builtin.debug:
        msg: >-
          importAdminCredentials finished (success may be false when principal already exists):
          {{ kdc_import_poll.json.resultMessage | default(kdc_import_poll.json.result_message | default('n/a')) }}
      when: kdc_import_poll is defined

    - name: Fail when importAdminCredentials command failed
      ansible.builtin.fail:
        msg: >-
          importAdminCredentials failed:
          {{ kdc_import_poll.json.resultMessage | default(kdc_import_poll.json.result_message | default('unknown')) }}
      when:
        - kdc_import_poll is defined
        - kdc_import_poll.json is defined
        - kdc_import_poll.json.success is defined
        - not (kdc_import_poll.json.success | bool)
        - >
          (
            kdc_import_poll.json.resultMessage
            | default(kdc_import_poll.json.result_message | default(''))
            | trim
          ) | length > 0
        - >
          'already exists' not in (
            kdc_import_poll.json.resultMessage | default(kdc_import_poll.json.result_message | default(''))
            | lower
          )

    - name: Print KDC credential import result
      ansible.builtin.debug:
        msg: "KDC credential import status: {{ kdc_import_result.status | default('skipped') }}"
      when: not kerberos_already_configured | default(false)

    - name: Configure Kerberos via Cloudera Manager REST API
      ansible.builtin.import_tasks: common_tasks/configure_cm_kerberos_api.yml
      when: not kerberos_already_configured | default(false)

    - name: Configure Active Directory-specific Kerberos settings
      ansible.builtin.uri:
        url: "{{ cm_krb_api_url | default(cm_api_url) }}/cm/kerberosConfig"
        method: PUT
        user: "{{ cm_admin_user }}"
        password: "{{ cm_admin_pass }}"
        force_basic_auth: yes
        validate_certs: no
        body_format: json
        body:
          items:
            - name: AD_DELETE_ON_REGENERATE
              value: "{{ krb5_ad_delete_on_regenerate | default(true) | lower }}"
            - name: AD_KDC_DOMAIN
              value: "{{ krb5_ad_suffix }}"
        status_code: [200, 204, 301, 303]
      register: cm_kerberos_ad_config
      when:
        - identity_provider_effective == 'ad'
        - not kerberos_already_configured | default(false)
        - cm_kerberos_config_changed | default(false) | bool
      failed_when: false
      changed_when: true

    - name: Kerberos — mark Cloudera Manager restart required after AD CM config
      ansible.builtin.set_fact:
        cm_restart_after_config_change: true
      when:
        - identity_provider_effective == 'ad'
        - not kerberos_already_configured | default(false)
        - cm_kerberos_config_changed | default(false) | bool

    - name: Restart Cloudera Manager after Kerberos configuration change
      ansible.builtin.import_tasks: common_tasks/apply_cm_restart_after_config.yml
      when: cm_restart_after_config_change | default(false) | bool

    - name: Print Kerberos configuration result
      ansible.builtin.debug:
        msg: >-
          Kerberos CM config applied (REST).
          kerberized={{ cm_krb_info.json.kerberized | default('unknown') }}
      when:
        - cm_kerberos_api_result is defined
        - cm_kerberos_api_result is changed

    - name: Kerberos already configured
      ansible.builtin.debug:
        msg: "Kerberos is already enabled in Cloudera Manager. Skipping configuration and CM restart."
      when: kerberos_already_configured | default(false)

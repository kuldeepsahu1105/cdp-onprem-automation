---
- name: Set OS-specific facts
  ansible.builtin.import_tasks: common_tasks/set_os_facts.yml

- name: Stop and disable Cloudera Manager agent
  ansible.builtin.systemd:
    name: cloudera-scm-agent
    state: stopped
    enabled: false
  failed_when: false

- name: Remove Cloudera Manager agent packages
  ansible.builtin.package:
    name:
      - cloudera-manager-agent
      - cloudera-manager-daemons
    state: absent
  when: os.supports_cloudera_rpm | default(false)
  failed_when: false

- name: Remove Cloudera Manager agent directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /opt/cloudera/cm-agent
    - /var/lib/cloudera-scm-agent
    - /etc/cloudera-scm-agent
    - /var/log/cloudera-scm-agent
    - /var/run/cloudera-scm-agent
  failed_when: false

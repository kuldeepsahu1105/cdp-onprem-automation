# Keys allowed in Jenkins ANSIBLE_GROUP_VARS_YAML (Ansible-only — not Terraform/Jenkins UI).
# CM archive login uses CM_REPO_USERNAME / CM_REPO_PASSWORD parameters instead.
allowed_keys:
  # Identity / domain
  - identity_provider
  - ipaserver_domain
  - ad_domain
  - ad_kdc_host
  - ad_join_user

  # Passwords (ansible group_vars — not Jenkins/Terraform)
  - ipaadmin_password
  - ad_join_password
  - ad_ldap_bind_password
  - cm_admin_user
  - cm_admin_pass
  - cm_admin_bootstrap_pass
  - postgres_password
  - scm_db_password

  # Cloudera / CDH / ECS versions
  - cm_version
  - cm_numeric_version
  - cdh_version
  - cdh_numeric_version
  - cdv_version
  - cdv_dataviz_csd_jar
  - cfm_version
  - cfm_nifi_app_version
  - cfm_nifi_csd_jar
  - cfm_nifi_registry_csd_jar
  - csd_redhat_repo
  - csd_build_urls_enabled
  - csd_respect_service_toggles
  - csd_install_dataviz
  - csd_install_nifi
  - csd_install_nifi_registry
  - ecs_pvc_ds_version
  - ecs_parcel_version
  - cdh_basecluster_name
  - base_cluster_install_services
  - base_cluster_yarn_rm_max_mb
  - base_cluster_yarn_rm_max_vcores
  - base_cluster_yarn_nm_memory_mb
  - base_cluster_yarn_nm_vcores
  - ecs_cluster_name
  - deployment_portal_enabled
  - deployment_portal_host_group
  - deployment_portal_postgres_host_group
  - deployment_portal_http_port
  - deployment_portal_pgadmin_host_port
  - deployment_portal_access_profile
  - deployment_portal_prefer_fqdn_urls
  - deployment_portal_use_private_network_only
  - deployment_environment
  - monitoring_stack_enabled
  - caddy_vhost_enabled
  - caddy_vhost_public_base
  - caddy_vhost_dns_mode
  - autotls_enabled
  - cm_api_prefer_private_ip
  - cm_api_connect_host
  - monitoring_grafana_admin_password

  # OS / dependency versions
  - java_version
  - python_version
  - postgresql_version
  - postgres_jdbc_version
  - psycopg2_binary_version

  # Repo / parcel options (ansible deploy)
  - cm_repo_source
  - cdh_parcel_os_suffix
  - target_cpu_architecture
  - ecs_deploy_on_arm64
  - cm_debian_use_ubuntu_repo
  - cm_debian_ubuntu_compat_version

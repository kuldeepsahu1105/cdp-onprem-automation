# =============================================================================
# .tfvars.yaml — YAML deployment config (alternative to .tfvars.env)
# =============================================================================
#
# Use either this file OR .tfvars.env in your working directory.
# Override path: export TFVARS_FILE=/path/to/config.yaml
#
# Wrapper scripts auto-detect: .tfvars.yaml → .tfvars.yml → .tfvars.env
# Jenkins UI overrides VPC_MODE, SG_MODE, and related fields when set.
# =============================================================================

# --- General -----------------------------------------------------------------
aws_region: ap-southeast-1
owner: ksahu-ygulati
environment: development

# Optional ARM64 / Graviton (uncomment to enable)
# cpu_architecture: arm64
# apply_graviton_defaults: true
# auto_resolve_arm64_ami: true
# ecs_deploy_on_arm64: false

# --- Terraform: create new vs use existing -----------------------------------
# Defaults: default VPC, use existing SG, create new keypair (Jenkins forces naming)
# vpc_mode: USE_DEFAULT       # Jenkins: USE_DEFAULT | CREATE_NEW
# sg_mode: USE_EXISTING       # Jenkins: USE_EXISTING | CREATE_NEW
create_vpc: false
create_new_sg: false
create_keypair: true
create_eip: true

# Naming suffixes — full names: {environment}-{suffix}
keypair_name_suffix: pvc-new-keypair
sg_name_suffix: pvc_cluster_sg

# USE_EXISTING SG: name in VPC or sg-xxxxxxxx (Jenkins default: {environment}-pvc_cluster_sg)
# existing_sg_name: sg-0dbb6f79cba5ef701

# New VPC (only when create_vpc: true / Jenkins VPC_MODE=CREATE_NEW)
# vpc_name: development-cldr-vpc
# vpc_cidr_block: 172.16.0.0/16
# vpc_azs: '["ap-southeast-1a","ap-southeast-1b"]'
# vpc_public_subnets_cidr: '["172.16.0.0/24"]'
# vpc_private_subnets_cidr: '[]'
# enable_nat_gateway: false
# enable_vpn_gateway: false

# New SG (only when create_new_sg: true / Jenkins SG_MODE=CREATE_NEW)
# sg_name: development-pvc_cluster_sg
# allow_all: true
# allowed_cidrs: '["0.0.0.0/0"]'
# allowed_ports: '[0]'

# cldr_eip_name: development-cldr-mngr-eip

# --- Cloudera versions (Ansible — deploy versions live in group_vars/all.yml) --
cm_version: "7.13.2.10000"
# cdh_version: "7.3.2.10000"
# ecs_pvc_ds_version: "1.5.5-h3300"

# --- AMI (shared by all groups) ----------------------------------------------
ami_id: ami-0a66a47c24c021954

# --- Instance groups -----------------------------------------------------------
instance_groups:
  cldr_mngr:
    count: 1
    instance_type: m5.4xlarge
    volume_size: 300
  ipa_server:
    count: 1
    instance_type: m5.xlarge
    volume_size: 250
  pvcbase_master:
    count: 1
    instance_type: m5.4xlarge
    volume_size: 400
  pvcbase_worker:
    count: 3
    instance_type: m5.4xlarge
    volume_size: 400
  pvcecs_master:
    count: 1
    instance_type: m5.8xlarge
    volume_size: 1300
  pvcecs_worker:
    count: 7
    instance_type: r5a.4xlarge
    volume_size: 1300

# --- Tooling (rarely changed) ------------------------------------------------
terraform_version: latest

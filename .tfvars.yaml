# --- General -----------------------------------------------------------------
aws_region: ap-southeast-1
owner: ksahu-ygulati
environment: development
terraform_version: latest

# Optional ARM64 / Graviton (uncomment to enable)
# cpu_architecture: arm64
# apply_graviton_defaults: true
# auto_resolve_arm64_ami: true
# ecs_deploy_on_arm64: false

# --- Cloudera versions -------------------------------------------------------
cm_version: "7.13.2.10000"

# --- AWS existing resources ----------------------------------------------------
existing_sg_name: testing-pvc_cluster_sg
existing_keypair_name: kuldeep-pvc-session

# --- AMI (shared by all groups) ----------------------------------------------
ami_id: ami-0a66a47c24c021954

# --- Instance groups -----------------------------------------------------------
instance_groups:
  cldr_mngr:
    count: 1
    instance_type: m5.4xlarge
    volume_size: 300
  ipa_server:
    count: 1
    instance_type: m5.xlarge
    volume_size: 250
  pvcbase_master:
    count: 1
    instance_type: m5.4xlarge
    volume_size: 400
  pvcbase_worker:
    count: 3
    instance_type: m5.4xlarge
    volume_size: 400
  pvcecs_master:
    count: 1
    instance_type: m5.8xlarge
    volume_size: 1300
  pvcecs_worker:
    count: 7
    instance_type: r5a.4xlarge
    volume_size: 1300
